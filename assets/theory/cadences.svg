<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="100%" role="img" aria-label="四種終止式">
<style>line,path,polyline{stroke-linecap:round;stroke-linejoin:round}text{font-family:'Source Han Serif TW',serif}</style>
<rect width="760" height="330" fill="#f7f3ee"/>
<rect x="14" y="76" width="732" height="238" rx="14" fill="#fff" stroke="#d9d2c9" stroke-width="1"/>
<text x="30.0" y="40.0" font-size="19" text-anchor="start" fill="#2b2722" font-weight="700">四種終止式</text>
<text x="30.0" y="62.0" font-size="12.5" text-anchor="start" fill="#8a8078" font-weight="400">同樣的屬和弦，接去哪裡就決定這句話怎麼結束</text>
<text x="28.0" y="120.0" font-size="12" text-anchor="start" fill="#2b2722" font-weight="700">正格終止</text>
<rect x="190.0" y="98.0" width="210.0" height="30.0" rx="8" fill="#fff" stroke="#d9d2c9" stroke-width="1.4"/>
<text x="295.0" y="119.0" font-size="12" text-anchor="middle" fill="#A67C52" font-weight="700">V → I</text>
<text x="430.0" y="119.0" font-size="10.5" text-anchor="start" fill="#8a8078" font-weight="400">最完整、最結束</text>
<text x="28.0" y="172.0" font-size="12" text-anchor="start" fill="#2b2722" font-weight="700">變格終止</text>
<rect x="190.0" y="150.0" width="210.0" height="30.0" rx="8" fill="#fff" stroke="#d9d2c9" stroke-width="1.4"/>
<text x="295.0" y="171.0" font-size="12" text-anchor="middle" fill="#2b2722" font-weight="700">IV → I</text>
<text x="430.0" y="171.0" font-size="10.5" text-anchor="start" fill="#8a8078" font-weight="400">溫和、像「阿們」</text>
<text x="28.0" y="224.0" font-size="12" text-anchor="start" fill="#2b2722" font-weight="700">半終止</text>
<rect x="190.0" y="202.0" width="210.0" height="30.0" rx="8" fill="#fff" stroke="#d9d2c9" stroke-width="1.4"/>
<text x="295.0" y="223.0" font-size="12" text-anchor="middle" fill="#8a8078" font-weight="700">⋯ → V</text>
<text x="430.0" y="223.0" font-size="10.5" text-anchor="start" fill="#8a8078" font-weight="400">懸而未決，像逗號</text>
<text x="28.0" y="276.0" font-size="12" text-anchor="start" fill="#2b2722" font-weight="700">阻斷終止</text>
<rect x="190.0" y="254.0" width="210.0" height="30.0" rx="8" fill="#fff" stroke="#d9d2c9" stroke-width="1.4"/>
<text x="295.0" y="275.0" font-size="12" text-anchor="middle" fill="#8a8078" font-weight="700">V → vi</text>
<text x="430.0" y="275.0" font-size="10.5" text-anchor="start" fill="#8a8078" font-weight="400">期待回家卻被帶開</text>
<text x="28.0" y="316.0" font-size="11" text-anchor="start" fill="#8a8078" font-weight="400">四個終止式都發生在樂句結尾——它們決定這一句是「說完了」還是「還有話」。</text>
</svg>
