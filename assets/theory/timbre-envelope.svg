<text x="56.0" y="92.0" font-size="14" text-anchor="start" fill="#2b2722" font-weight="700">小提琴</text>
<text x="56.0" y="110.0" font-size="10" text-anchor="start" fill="#8a8078" font-weight="400">泛音一路延伸到高頻 → 亮、有毛邊</text>
