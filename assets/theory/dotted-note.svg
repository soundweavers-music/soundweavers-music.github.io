<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" width="100%" role="img" aria-label="附點：加上原本的一半">
<style>line,path,polyline{stroke-linecap:round;stroke-linejoin:round}text{font-family:'Source Han Serif TW',serif}</style>
<rect width="760" height="320" fill="#f7f3ee"/>
<rect x="14" y="76" width="732" height="228" rx="14" fill="#fff" stroke="#d9d2c9" stroke-width="1"/>
<text x="30.0" y="40.0" font-size="19" text-anchor="start" fill="#2b2722" font-weight="700">附點：加上原本的一半</text>
<text x="30.0" y="62.0" font-size="12.5" text-anchor="start" fill="#8a8078" font-weight="400">淺色那一段就是點帶來的長度</text>
<text x="248.0" y="125.0" font-size="11.5" text-anchor="end" fill="#2b2722" font-weight="700">四分音符</text>
<rect x="260.0" y="109.0" width="92.0" height="22.0" rx="4" fill="#A67C52" stroke="none" stroke-width="1.4"/>
<text x="366.0" y="125.0" font-size="10.5" text-anchor="start" fill="#8a8078" font-weight="400">1 拍</text>
<text x="248.0" y="169.0" font-size="11.5" text-anchor="end" fill="#2b2722" font-weight="700">附點四分音符</text>
<rect x="260.0" y="153.0" width="92.0" height="22.0" rx="4" fill="#A67C52" stroke="none" stroke-width="1.4"/>
<rect x="352.0" y="153.0" width="46.0" height="22.0" rx="4" fill="#e7d9c8" stroke="#A67C52" stroke-width="1.4"/>
<text x="375.0" y="168.0" font-size="9.5" text-anchor="middle" fill="#A67C52" font-weight="400">＋一半</text>
<text x="412.0" y="169.0" font-size="10.5" text-anchor="start" fill="#8a8078" font-weight="400">1.5 拍</text>
<text x="248.0" y="213.0" font-size="11.5" text-anchor="end" fill="#2b2722" font-weight="700">二分音符</text>
<rect x="260.0" y="197.0" width="184.0" height="22.0" rx="4" fill="#A67C52" stroke="none" stroke-width="1.4"/>
<text x="458.0" y="213.0" font-size="10.5" text-anchor="start" fill="#8a8078" font-weight="400">2 拍</text>
<text x="248.0" y="257.0" font-size="11.5" text-anchor="end" fill="#2b2722" font-weight="700">附點二分音符</text>
<rect x="260.0" y="241.0" width="184.0" height="22.0" rx="4" fill="#A67C52" stroke="none" stroke-width="1.4"/>
<rect x="444.0" y="241.0" width="92.0" height="22.0" rx="4" fill="#e7d9c8" stroke="#A67C52" stroke-width="1.4"/>
<text x="490.0" y="256.0" font-size="9.5" text-anchor="middle" fill="#A67C52" font-weight="400">＋一半</text>
<text x="550.0" y="257.0" font-size="10.5" text-anchor="start" fill="#8a8078" font-weight="400">3 拍</text>
<text x="28.0" y="272.0" font-size="11.5" text-anchor="start" fill="#2b2722" font-weight="400">附點只做一件事：把原本的音符長度再加一半。</text>
<text x="30.0" y="298.0" font-size="11" text-anchor="start" fill="#8a8078" font-weight="400">兩個附點＝加一半再一半，也就是原本的 1.75 倍。</text>
</svg>
