<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="100%" role="img" aria-label="鋼琴是弦樂、打擊還是鍵盤？">
<rect width="760" height="330" fill="#f7f3ee"/>
<text x="28.0" y="40.0" font-size="19" text-anchor="start" fill="#2b2722" font-weight="700">鋼琴是弦樂、打擊還是鍵盤？</text>
<text x="28.0" y="62.0" font-size="12.5" text-anchor="start" fill="#8a8078" font-weight="400">三種說法都對一半，因為它們回答的是不同的問題</text>
<rect x="40.0" y="148.0" width="130.0" height="74.0" rx="8" fill="#A67C52" stroke="none" stroke-width="1.4"/>
<text x="105.0" y="182.0" font-size="15" text-anchor="middle" fill="#fff" font-weight="700">鋼琴</text>
<text x="105.0" y="204.0" font-size="9.5" text-anchor="middle" fill="#f0e6da" font-weight="400">有弦・有槌・有鍵</text>
<line x1="178.0" y1="185.0" x2="294.6" y2="130.5" stroke="#8a8078" stroke-width="1.2"/><polygon points="300.0,128.0 295.1,133.7 292.5,128.1" fill="#8a8078"/>
<rect x="300.0" y="104.0" width="400.0" height="48.0" rx="8" fill="#fff" stroke="#d9d2c9" stroke-width="1.4"/>
<text x="318.0" y="126.0" font-size="12.5" text-anchor="start" fill="#2b2722" font-weight="700">弦樂</text>
<text x="318.0" y="144.0" font-size="10" text-anchor="start" fill="#8a8078" font-weight="400">有弦，可是不是拉也不是撥</text>
<line x1="178.0" y1="185.0" x2="294.0" y2="197.4" stroke="#8a8078" stroke-width="1.2"/><polygon points="300.0,198.0 292.9,200.3 293.5,194.2" fill="#8a8078"/>
<rect x="300.0" y="174.0" width="400.0" height="48.0" rx="8" fill="#fff" stroke="#d9d2c9" stroke-width="1.4"/>
<text x="318.0" y="196.0" font-size="12.5" text-anchor="start" fill="#2b2722" font-weight="700">打擊樂</text>
<text x="318.0" y="214.0" font-size="10" text-anchor="start" fill="#8a8078" font-weight="400">用槌敲，可是敲的是弦</text>
<line x1="178.0" y1="185.0" x2="295.0" y2="264.6" stroke="#8a8078" stroke-width="1.2"/><polygon points="300.0,268.0 292.6,266.7 296.1,261.6" fill="#8a8078"/>
<rect x="300.0" y="244.0" width="400.0" height="48.0" rx="8" fill="#fff" stroke="#d9d2c9" stroke-width="1.4"/>
<text x="318.0" y="266.0" font-size="12.5" text-anchor="start" fill="#2b2722" font-weight="700">鍵盤樂</text>
<text x="318.0" y="284.0" font-size="10" text-anchor="start" fill="#8a8078" font-weight="400">有鍵盤，可是鍵盤只是開關</text>
<rect x="300.0" y="290.0" width="400.0" height="0.0" rx="0" fill="none" stroke="none" stroke-width="1.4"/>
<text x="28.0" y="300.0" font-size="11" text-anchor="start" fill="#A67C52" font-weight="700">S-H 的答案：弦鳴・敲弦。振動源是弦，動它的是槌——兩個問題分開問就沒有矛盾。</text>
</svg>
