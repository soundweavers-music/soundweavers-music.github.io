<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="100%" role="img" aria-label="高音譜號管什麼">
<rect width="760" height="330" fill="#f7f3ee"/>
<text x="28.0" y="40.0" font-size="19" text-anchor="start" fill="#2b2722" font-weight="700">高音譜號管什麼</text>
<text x="28.0" y="62.0" font-size="12.5" text-anchor="start" fill="#8a8078" font-weight="400">大部分旋律樂器與人聲的高音，都寫在高音譜號上</text>
<line x1="52.0" y1="150.0" x2="250.0" y2="150.0" stroke="#2b2722" stroke-width="1.1"/>
<line x1="52.0" y1="163.0" x2="250.0" y2="163.0" stroke="#2b2722" stroke-width="1.1"/>
<line x1="52.0" y1="176.0" x2="250.0" y2="176.0" stroke="#2b2722" stroke-width="1.1"/>
<line x1="52.0" y1="189.0" x2="250.0" y2="189.0" stroke="#2b2722" stroke-width="1.1"/>
<line x1="52.0" y1="202.0" x2="250.0" y2="202.0" stroke="#2b2722" stroke-width="1.1"/>
<circle cx="78.0" cy="163.0" r="14.0" fill="none" stroke="#A67C52" stroke-width="2"/>
<text x="78.0" y="168.0" font-size="13" text-anchor="middle" fill="#A67C52" font-weight="700">G</text>
<text x="52.0" y="128.0" font-size="13" text-anchor="start" fill="#2b2722" font-weight="700">高音譜號（G 譜號）</text>
<text x="52.0" y="232.0" font-size="10" text-anchor="start" fill="#8a8078" font-weight="400">螺旋圈住第二線 → 那條線就是 G4</text>
<text x="52.0" y="252.0" font-size="10" text-anchor="start" fill="#8a8078" font-weight="400">常用範圍大約 C4 – C6，往上加線可以更高</text>
<rect x="330.0" y="116.0" width="180.0" height="44.0" rx="8" fill="#fff" stroke="#d9d2c9" stroke-width="1.4"/>
<text x="346.0" y="144.0" font-size="12" text-anchor="start" fill="#2b2722" font-weight="400">長笛</text>
<rect x="530.0" y="116.0" width="180.0" height="44.0" rx="8" fill="#fff" stroke="#d9d2c9" stroke-width="1.4"/>
<text x="546.0" y="144.0" font-size="12" text-anchor="start" fill="#2b2722" font-weight="400">雙簧管</text>
<rect x="330.0" y="174.0" width="180.0" height="44.0" rx="8" fill="#fff" stroke="#d9d2c9" stroke-width="1.4"/>
<text x="346.0" y="202.0" font-size="12" text-anchor="start" fill="#2b2722" font-weight="400">單簧管</text>
<rect x="530.0" y="174.0" width="180.0" height="44.0" rx="8" fill="#fff" stroke="#d9d2c9" stroke-width="1.4"/>
<text x="546.0" y="202.0" font-size="12" text-anchor="start" fill="#2b2722" font-weight="400">小提琴</text>
<rect x="330.0" y="232.0" width="180.0" height="44.0" rx="8" fill="#fff" stroke="#d9d2c9" stroke-width="1.4"/>
<text x="346.0" y="260.0" font-size="12" text-anchor="start" fill="#2b2722" font-weight="400">小號</text>
<rect x="530.0" y="232.0" width="180.0" height="44.0" rx="8" fill="#fff" stroke="#d9d2c9" stroke-width="1.4"/>
<text x="546.0" y="260.0" font-size="12" text-anchor="start" fill="#2b2722" font-weight="400">鋼琴右手</text>
<text x="330.0" y="300.0" font-size="11.5" text-anchor="start" fill="#A67C52" font-weight="700">旋律幾乎都住在這裡：這是「主角」的譜號。</text>
</svg>
