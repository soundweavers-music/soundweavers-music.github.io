<text x="30.0" y="40.0" font-size="19" text-anchor="start" fill="#2b2722" font-weight="700">速度是活的，不是節拍器上的數字</text>
<text x="30.0" y="62.0" font-size="12.5" text-anchor="start" fill="#8a8078" font-weight="400">同樣標 BPM 120，機器與人的差別在「每一拍之間怎麼分配」</text>
<text x="28.0" y="100.0" font-size="12" text-anchor="start" fill="#2b2722" font-weight="700">節拍器：每一拍間隔一模一樣</text>
