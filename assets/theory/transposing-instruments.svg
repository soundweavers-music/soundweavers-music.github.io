<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="100%" role="img" aria-label="移調樂器：譜上的 Do 不是聽到的 Do">
<rect width="760" height="340" fill="#f7f3ee"/>
<text x="28.0" y="40.0" font-size="19" text-anchor="start" fill="#2b2722" font-weight="700">移調樂器：譜上的 Do 不是聽到的 Do</text>
<text x="28.0" y="62.0" font-size="12.5" text-anchor="start" fill="#8a8078" font-weight="400">同一個指法、同一個「Do」，不同樂器響出來的高度不同</text>
<text x="250.0" y="100.0" font-size="10" text-anchor="start" fill="#8a8078" font-weight="400">譜上寫</text>
<text x="400.0" y="100.0" font-size="10" text-anchor="start" fill="#8a8078" font-weight="400">實際響</text>
<text x="560.0" y="100.0" font-size="10" text-anchor="start" fill="#8a8078" font-weight="400">差距</text>
<rect x="28.0" y="110.0" width="704.0" height="30.0" rx="6" fill="#fff" stroke="none" stroke-width="1.4"/>
<text x="28.0" y="130.0" font-size="11.5" text-anchor="start" fill="#2b2722" font-weight="400">B♭ 小號／單簧管</text>
<text x="250.0" y="130.0" font-size="11.5" text-anchor="start" fill="#A67C52" font-weight="700">C4</text>
<text x="400.0" y="130.0" font-size="11.5" text-anchor="start" fill="#2b2722" font-weight="400">B♭3</text>
<text x="560.0" y="130.0" font-size="10.5" text-anchor="start" fill="#8a8078" font-weight="400">低一個大二度</text>
<text x="28.0" y="164.0" font-size="11.5" text-anchor="start" fill="#2b2722" font-weight="400">F 法國號</text>
<text x="250.0" y="164.0" font-size="11.5" text-anchor="start" fill="#A67C52" font-weight="700">C4</text>
<text x="400.0" y="164.0" font-size="11.5" text-anchor="start" fill="#2b2722" font-weight="400">F3</text>
<text x="560.0" y="164.0" font-size="10.5" text-anchor="start" fill="#8a8078" font-weight="400">低一個純五度</text>
<rect x="28.0" y="178.0" width="704.0" height="30.0" rx="6" fill="#fff" stroke="none" stroke-width="1.4"/>
<text x="28.0" y="198.0" font-size="11.5" text-anchor="start" fill="#2b2722" font-weight="400">E♭ 中音薩克斯</text>
<text x="250.0" y="198.0" font-size="11.5" text-anchor="start" fill="#A67C52" font-weight="700">C4</text>
<text x="400.0" y="198.0" font-size="11.5" text-anchor="start" fill="#2b2722" font-weight="400">E♭3</text>
<text x="560.0" y="198.0" font-size="10.5" text-anchor="start" fill="#8a8078" font-weight="400">低一個大六度</text>
<text x="28.0" y="232.0" font-size="11.5" text-anchor="start" fill="#2b2722" font-weight="400">B♭ 次中音薩克斯</text>
<text x="250.0" y="232.0" font-size="11.5" text-anchor="start" fill="#A67C52" font-weight="700">C4</text>
<text x="400.0" y="232.0" font-size="11.5" text-anchor="start" fill="#2b2722" font-weight="400">B♭2</text>
<text x="560.0" y="232.0" font-size="10.5" text-anchor="start" fill="#8a8078" font-weight="400">低一個大九度</text>
<rect x="28.0" y="246.0" width="704.0" height="30.0" rx="6" fill="#fff" stroke="none" stroke-width="1.4"/>
<text x="28.0" y="266.0" font-size="11.5" text-anchor="start" fill="#2b2722" font-weight="400">吉他</text>
<text x="250.0" y="266.0" font-size="11.5" text-anchor="start" fill="#A67C52" font-weight="700">C4</text>
<text x="400.0" y="266.0" font-size="11.5" text-anchor="start" fill="#2b2722" font-weight="400">C3</text>
<text x="560.0" y="266.0" font-size="10.5" text-anchor="start" fill="#8a8078" font-weight="400">低一個八度</text>
<text x="28.0" y="300.0" font-size="11.5" text-anchor="start" fill="#2b2722" font-weight="400">短笛</text>
<text x="250.0" y="300.0" font-size="11.5" text-anchor="start" fill="#A67C52" font-weight="700">C5</text>
<text x="400.0" y="300.0" font-size="11.5" text-anchor="start" fill="#2b2722" font-weight="400">C6</text>
<text x="560.0" y="300.0" font-size="10.5" text-anchor="start" fill="#8a8078" font-weight="400">高一個八度</text>
<text x="28.0" y="328.0" font-size="11" text-anchor="start" fill="#8a8078" font-weight="400">移調樂器的譜不能用鋼琴直接照彈——讀總譜時要先換算。</text>
</svg>
