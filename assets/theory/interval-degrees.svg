<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" width="100%" role="img" aria-label="度數怎麼算：連頭帶尾">
<style>line,path,polyline{stroke-linecap:round;stroke-linejoin:round}text{font-family:'Source Han Serif TW',serif}</style>
<rect width="760" height="320" fill="#f7f3ee"/>
<rect x="14" y="76" width="732" height="228" rx="14" fill="#fff" stroke="#d9d2c9" stroke-width="1"/>
<text x="30.0" y="40.0" font-size="19" text-anchor="start" fill="#2b2722" font-weight="700">度數怎麼算：連頭帶尾</text>
<text x="30.0" y="62.0" font-size="12.5" text-anchor="start" fill="#8a8078" font-weight="400">數的是「經過幾個音名」，起點與終點都要算進去</text>
<rect x="70.0" y="120.0" width="76.0" height="96.0" rx="2" fill="#fff" stroke="#d9d2c9" stroke-width="1.4"/>
<text x="109.0" y="202.0" font-size="13" text-anchor="middle" fill="#A67C52" font-weight="700">C</text>
<text x="109.0" y="108.0" font-size="14" text-anchor="middle" fill="#A67C52" font-weight="700">1</text>
<rect x="148.0" y="120.0" width="76.0" height="96.0" rx="2" fill="#fff" stroke="#d9d2c9" stroke-width="1.4"/>
<text x="187.0" y="202.0" font-size="13" text-anchor="middle" fill="#2b2722" font-weight="400">D</text>
<text x="187.0" y="108.0" font-size="14" text-anchor="middle" fill="#8a8078" font-weight="700">2</text>
<rect x="226.0" y="120.0" width="76.0" height="96.0" rx="2" fill="#fff" stroke="#d9d2c9" stroke-width="1.4"/>
<text x="265.0" y="202.0" font-size="13" text-anchor="middle" fill="#2b2722" font-weight="400">E</text>
<text x="265.0" y="108.0" font-size="14" text-anchor="middle" fill="#8a8078" font-weight="700">3</text>
<rect x="304.0" y="120.0" width="76.0" height="96.0" rx="2" fill="#fff" stroke="#d9d2c9" stroke-width="1.4"/>
<text x="343.0" y="202.0" font-size="13" text-anchor="middle" fill="#2b2722" font-weight="400">F</text>
<text x="343.0" y="108.0" font-size="14" text-anchor="middle" fill="#8a8078" font-weight="700">4</text>
<rect x="382.0" y="120.0" width="76.0" height="96.0" rx="2" fill="#fff" stroke="#d9d2c9" stroke-width="1.4"/>
<text x="421.0" y="202.0" font-size="13" text-anchor="middle" fill="#2b2722" font-weight="400">G</text>
<text x="421.0" y="108.0" font-size="14" text-anchor="middle" fill="#8a8078" font-weight="700">5</text>
<rect x="460.0" y="120.0" width="76.0" height="96.0" rx="2" fill="#fff" stroke="#d9d2c9" stroke-width="1.4"/>
<text x="499.0" y="202.0" font-size="13" text-anchor="middle" fill="#2b2722" font-weight="400">A</text>
<text x="499.0" y="108.0" font-size="14" text-anchor="middle" fill="#8a8078" font-weight="700">6</text>
<rect x="538.0" y="120.0" width="76.0" height="96.0" rx="2" fill="#fff" stroke="#d9d2c9" stroke-width="1.4"/>
<text x="577.0" y="202.0" font-size="13" text-anchor="middle" fill="#2b2722" font-weight="400">B</text>
<text x="577.0" y="108.0" font-size="14" text-anchor="middle" fill="#8a8078" font-weight="700">7</text>
<rect x="616.0" y="120.0" width="76.0" height="96.0" rx="2" fill="#fff" stroke="#d9d2c9" stroke-width="1.4"/>
<text x="655.0" y="202.0" font-size="13" text-anchor="middle" fill="#A67C52" font-weight="700">C</text>
<text x="655.0" y="108.0" font-size="14" text-anchor="middle" fill="#A67C52" font-weight="700">8</text>
<text x="109.0" y="86.0" font-size="11" text-anchor="middle" fill="#8a8078" font-weight="400">度數</text>
<line x1="109.0" y1="242.0" x2="655.0" y2="242.0" stroke="#A67C52" stroke-width="1.4"/>
<text x="382.0" y="260.0" font-size="11" text-anchor="middle" fill="#A67C52" font-weight="400">C 到 C＝8 個音名＝八度（頭尾都算）</text>
<text x="28.0" y="282.0" font-size="11.5" text-anchor="start" fill="#2b2722" font-weight="400">同一個算法：C→E＝3 度、C→G＝5 度。從 0 開始數會少 1，</text>
<text x="28.0" y="302.0" font-size="11.5" text-anchor="start" fill="#8a8078" font-weight="400">所以口訣是「Do 到 Mi，數三個字」。</text>
</svg>
