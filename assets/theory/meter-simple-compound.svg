<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="100%" role="img" aria-label="單拍子 vs 複拍子">
<rect width="760" height="300" fill="#f7f3ee"/>
<text x="28.0" y="40.0" font-size="19" text-anchor="start" fill="#2b2722" font-weight="700">單拍子 vs 複拍子</text>
<text x="28.0" y="62.0" font-size="12.5" text-anchor="start" fill="#8a8078" font-weight="400">同樣的總長度，分組方式不同，律動就不同</text>
<text x="60.0" y="84.0" font-size="13.5" text-anchor="start" fill="#2b2722" font-weight="700">4/4 單拍子</text>
<text x="60.0" y="104.0" font-size="11" text-anchor="start" fill="#8a8078" font-weight="400">每拍可以再對半分</text>
<circle cx="76.0" cy="130.0" r="9.0" fill="#f7f3ee" stroke="#A67C52" stroke-width="1.8"/>
<circle cx="106.0" cy="130.0" r="9.0" fill="#f7f3ee" stroke="#A67C52" stroke-width="1.8"/>
<line x1="122.0" y1="114.0" x2="122.0" y2="146.0" stroke="#d9d2c9" stroke-width="1.2"/>
<circle cx="150.0" cy="130.0" r="9.0" fill="#f7f3ee" stroke="#A67C52" stroke-width="1.8"/>
<circle cx="180.0" cy="130.0" r="9.0" fill="#f7f3ee" stroke="#A67C52" stroke-width="1.8"/>
<line x1="196.0" y1="114.0" x2="196.0" y2="146.0" stroke="#d9d2c9" stroke-width="1.2"/>
<text x="430.0" y="84.0" font-size="13.5" text-anchor="start" fill="#2b2722" font-weight="700">6/8 複拍子</text>
<text x="430.0" y="104.0" font-size="11" text-anchor="start" fill="#8a8078" font-weight="400">每組三拍，聽起來是兩大拍</text>
<circle cx="446.0" cy="130.0" r="9.0" fill="#f7f3ee" stroke="#A67C52" stroke-width="1.8"/>
<circle cx="476.0" cy="130.0" r="9.0" fill="#f7f3ee" stroke="#A67C52" stroke-width="1.8"/>
<circle cx="506.0" cy="130.0" r="9.0" fill="#f7f3ee" stroke="#A67C52" stroke-width="1.8"/>
<line x1="522.0" y1="114.0" x2="522.0" y2="146.0" stroke="#d9d2c9" stroke-width="1.2"/>
<circle cx="550.0" cy="130.0" r="9.0" fill="#f7f3ee" stroke="#A67C52" stroke-width="1.8"/>
<circle cx="580.0" cy="130.0" r="9.0" fill="#f7f3ee" stroke="#A67C52" stroke-width="1.8"/>
<circle cx="610.0" cy="130.0" r="9.0" fill="#f7f3ee" stroke="#A67C52" stroke-width="1.8"/>
<line x1="626.0" y1="114.0" x2="626.0" y2="146.0" stroke="#d9d2c9" stroke-width="1.2"/>
<text x="60.0" y="200.0" font-size="12" text-anchor="start" fill="#2b2722" font-weight="#2b2722">單拍子：一拍＝一個自然單位（2 或 3 等分都自然）</text>
<text x="60.0" y="222.0" font-size="12" text-anchor="start" fill="#2b2722" font-weight="#2b2722">複拍子：一拍＝三個小單位組成的「大拍」</text>
<text x="60.0" y="252.0" font-size="12" text-anchor="start" fill="#A67C52" font-weight="700">所以 6/8 不是「六拍的 4/4」，而是「兩大拍、每拍三下」。</text>
</svg>
