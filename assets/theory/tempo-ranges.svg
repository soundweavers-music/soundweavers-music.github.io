<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="100%" role="img" aria-label="速度術語與它們的 BPM 區間">
<rect width="760" height="380" fill="#f7f3ee"/>
<text x="28.0" y="40.0" font-size="19" text-anchor="start" fill="#2b2722" font-weight="700">速度術語與它們的 BPM 區間</text>
<text x="28.0" y="62.0" font-size="12.5" text-anchor="start" fill="#8a8078" font-weight="400">長條是該術語常見的範圍；相鄰術語之間本來就有模糊地帶</text>
<text x="28.0" y="106.0" font-size="12" text-anchor="start" fill="#2b2722" font-weight="700">Largo 極緩板</text>
<text x="28.0" y="121.0" font-size="10" text-anchor="start" fill="#8a8078" font-weight="400">寬廣、莊嚴、沉重</text>
<rect x="232.8" y="98.0" width="45.6" height="16.0" rx="4" fill="#A67C52" stroke="none" stroke-width="1.4"/>
<text x="286.3" y="113.0" font-size="10.5" text-anchor="start" fill="#8a8078" font-weight="400">40–60</text>
<text x="28.0" y="139.0" font-size="12" text-anchor="start" fill="#2b2722" font-weight="700">Adagio 慢板</text>
<text x="28.0" y="154.0" font-size="10" text-anchor="start" fill="#8a8078" font-weight="400">自在、抒情、寧靜</text>
<rect x="292.0" y="131.0" width="22.8" height="16.0" rx="4" fill="#A67C52" stroke="none" stroke-width="1.4"/>
<text x="322.8" y="146.0" font-size="10.5" text-anchor="start" fill="#8a8078" font-weight="400">66–76</text>
<text x="28.0" y="172.0" font-size="12" text-anchor="start" fill="#2b2722" font-weight="700">Andante 行板</text>
<text x="28.0" y="187.0" font-size="10" text-anchor="start" fill="#8a8078" font-weight="400">散步的步調</text>
<rect x="314.8" y="164.0" width="72.9" height="16.0" rx="4" fill="#A67C52" stroke="none" stroke-width="1.4"/>
<text x="395.7" y="179.0" font-size="10.5" text-anchor="start" fill="#8a8078" font-weight="400">76–108</text>
<text x="28.0" y="205.0" font-size="12" text-anchor="start" fill="#2b2722" font-weight="700">Moderato 中板</text>
<text x="28.0" y="220.0" font-size="10" text-anchor="start" fill="#8a8078" font-weight="400">節制、平穩地推進</text>
<rect x="387.7" y="197.0" width="27.3" height="16.0" rx="4" fill="#A67C52" stroke="none" stroke-width="1.4"/>
<text x="423.0" y="212.0" font-size="10.5" text-anchor="start" fill="#8a8078" font-weight="400">108–120</text>
<text x="28.0" y="238.0" font-size="12" text-anchor="start" fill="#2b2722" font-weight="700">Allegro 快板</text>
<text x="28.0" y="253.0" font-size="10" text-anchor="start" fill="#8a8078" font-weight="400">活潑、有能量</text>
<rect x="415.0" y="230.0" width="109.3" height="16.0" rx="4" fill="#A67C52" stroke="none" stroke-width="1.4"/>
<text x="532.3" y="245.0" font-size="10.5" text-anchor="start" fill="#8a8078" font-weight="400">120–168</text>
<text x="28.0" y="271.0" font-size="12" text-anchor="start" fill="#2b2722" font-weight="700">Presto 急板</text>
<text x="28.0" y="286.0" font-size="10" text-anchor="start" fill="#8a8078" font-weight="400">狂熱、急迫</text>
<rect x="524.3" y="263.0" width="72.9" height="16.0" rx="4" fill="#A67C52" stroke="none" stroke-width="1.4"/>
<text x="605.2" y="278.0" font-size="10.5" text-anchor="start" fill="#8a8078" font-weight="400">168–200</text>
<line x1="210.0" y1="318.0" x2="620.0" y2="318.0" stroke="#8a8078" stroke-width="1.2"/>
<line x1="210.0" y1="312.0" x2="210.0" y2="324.0" stroke="#8a8078" stroke-width="1"/>
<text x="210.0" y="344.0" font-size="10" text-anchor="middle" fill="#8a8078" font-weight="400">30</text>
<line x1="278.3" y1="312.0" x2="278.3" y2="324.0" stroke="#8a8078" stroke-width="1"/>
<text x="278.3" y="344.0" font-size="10" text-anchor="middle" fill="#8a8078" font-weight="400">60</text>
<line x1="346.7" y1="312.0" x2="346.7" y2="324.0" stroke="#8a8078" stroke-width="1"/>
<text x="346.7" y="344.0" font-size="10" text-anchor="middle" fill="#8a8078" font-weight="400">90</text>
<line x1="415.0" y1="312.0" x2="415.0" y2="324.0" stroke="#8a8078" stroke-width="1"/>
<text x="415.0" y="344.0" font-size="10" text-anchor="middle" fill="#8a8078" font-weight="400">120</text>
<line x1="483.3" y1="312.0" x2="483.3" y2="324.0" stroke="#8a8078" stroke-width="1"/>
<text x="483.3" y="344.0" font-size="10" text-anchor="middle" fill="#8a8078" font-weight="400">150</text>
<line x1="551.7" y1="312.0" x2="551.7" y2="324.0" stroke="#8a8078" stroke-width="1"/>
<text x="551.7" y="344.0" font-size="10" text-anchor="middle" fill="#8a8078" font-weight="400">180</text>
<line x1="620.0" y1="312.0" x2="620.0" y2="324.0" stroke="#8a8078" stroke-width="1"/>
<text x="620.0" y="344.0" font-size="10" text-anchor="middle" fill="#8a8078" font-weight="400">210</text>
<text x="634.0" y="344.0" font-size="10" text-anchor="start" fill="#8a8078" font-weight="400">BPM</text>
<text x="28.0" y="362.0" font-size="11.5" text-anchor="start" fill="#8a8078" font-weight="400">各版本教材給的數值略有出入。術語真正要傳達的是情緒，不是節拍器上的數字。</text>
</svg>
