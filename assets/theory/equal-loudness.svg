<text x="30.0" y="40.0" font-size="19" text-anchor="start" fill="#2b2722" font-weight="700">等響曲線：同樣大聲，不等於同樣音壓</text>
<text x="30.0" y="62.0" font-size="12.5" text-anchor="start" fill="#8a8078" font-weight="400">曲線是等響線，數字是 phon（方）；低頻要更多音壓才聽得一樣響</text>
