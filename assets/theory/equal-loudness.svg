<text x="28.0" y="336.0" font-size="11.5" text-anchor="start" fill="#2b2722" font-weight="400">同一條線上的音，聽起來一樣大聲。音量轉小之後，低頻與極高頻會先「消失」。</text>
<text x="28.0" y="356.0" font-size="11" text-anchor="start" fill="#8a8078" font-weight="#2b2722">所以小聲聽音樂時總覺得沒低音——把音量調大，低頻就回來了。</text>
<text x="30.0" y="368.0" font-size="11" text-anchor="start" fill="#8a8078" font-weight="400">曲線為示意，實際數據見 ISO 226 等響曲線。</text>
</svg>
