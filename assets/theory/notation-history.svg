<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="100%" role="img" aria-label="從紐姆譜到五線譜">
<style>line,path,polyline{stroke-linecap:round;stroke-linejoin:round}text{font-family:'Source Han Serif TW',serif}</style>
<rect width="760" height="360" fill="#f7f3ee"/>
<rect x="14" y="76" width="732" height="268" rx="14" fill="#fff" stroke="#d9d2c9" stroke-width="1"/>
<text x="30.0" y="40.0" font-size="19" text-anchor="start" fill="#2b2722" font-weight="700">從紐姆譜到五線譜</text>
<text x="30.0" y="62.0" font-size="12.5" text-anchor="start" fill="#8a8078" font-weight="400">每一個發明都在回答同一個問題：怎麼把聲音寫下來，讓別人唱得一樣</text>
<text x="52.0" y="108.0" font-size="14" text-anchor="start" fill="#2b2722" font-weight="700">紐姆譜</text>
<text x="52.0" y="126.0" font-size="10.5" text-anchor="start" fill="#8a8078" font-weight="400">9–10 世紀</text>
<ellipse cx="98.0" cy="176.0" rx="7.0" ry="4.5" fill="#A67C52" stroke="none" stroke-width="1.4" transform="rotate(-20 98.0 176.0)"/>
<ellipse cx="130.0" cy="170.0" rx="7.0" ry="4.5" fill="#A67C52" stroke="none" stroke-width="1.4" transform="rotate(-20 130.0 170.0)"/>
<ellipse cx="164.0" cy="178.0" rx="7.0" ry="4.5" fill="#A67C52" stroke="none" stroke-width="1.4" transform="rotate(-20 164.0 178.0)"/>
<ellipse cx="196.0" cy="172.0" rx="7.0" ry="4.5" fill="#A67C52" stroke="none" stroke-width="1.4" transform="rotate(-20 196.0 172.0)"/>
<text x="62.0" y="214.0" font-size="10" text-anchor="start" fill="#8a8078" font-weight="400">歌　詞　行</text>
<text x="52.0" y="268.0" font-size="10" text-anchor="start" fill="#8a8078" font-weight="400">記號浮在歌詞上方</text>
<text x="52.0" y="286.0" font-size="10" text-anchor="start" fill="#8a8078" font-weight="400">只記方向與輪廓</text>
<text x="52.0" y="304.0" font-size="10" text-anchor="start" fill="#8a8078" font-weight="400">高低靠記憶與口傳</text>
<text x="290.0" y="108.0" font-size="14" text-anchor="start" fill="#2b2722" font-weight="700">四線譜</text>
<text x="290.0" y="126.0" font-size="10.5" text-anchor="start" fill="#8a8078" font-weight="400">11 世紀・桂多</text>
<line x1="290.0" y1="164.0" x2="460.0" y2="164.0" stroke="#2b2722" stroke-width="1.1"/>
<line x1="290.0" y1="178.0" x2="460.0" y2="178.0" stroke="#2b2722" stroke-width="1.1"/>
<line x1="290.0" y1="192.0" x2="460.0" y2="192.0" stroke="#2b2722" stroke-width="1.1"/>
<line x1="290.0" y1="206.0" x2="460.0" y2="206.0" stroke="#2b2722" stroke-width="1.1"/>
<rect x="330.0" y="165.0" width="9.0" height="9.0" rx="1" fill="#A67C52" stroke="none" stroke-width="1.4"/>
<rect x="382.0" y="179.0" width="9.0" height="9.0" rx="1" fill="#A67C52" stroke="none" stroke-width="1.4"/>
<rect x="430.0" y="165.0" width="9.0" height="9.0" rx="1" fill="#A67C52" stroke="none" stroke-width="1.4"/>
<text x="300.0" y="232.0" font-size="10" text-anchor="start" fill="#8a8078" font-weight="400">線＝音高的樓梯</text>
<text x="290.0" y="268.0" font-size="10" text-anchor="start" fill="#8a8078" font-weight="400">把線拉出來</text>
<text x="290.0" y="286.0" font-size="10" text-anchor="start" fill="#8a8078" font-weight="400">音高第一次有位置</text>
<text x="290.0" y="304.0" font-size="10" text-anchor="start" fill="#8a8078" font-weight="400">唱詩班可以遠距教學</text>
<text x="528.0" y="108.0" font-size="14" text-anchor="start" fill="#2b2722" font-weight="700">五線譜</text>
<text x="528.0" y="126.0" font-size="10.5" text-anchor="start" fill="#8a8078" font-weight="400">17 世紀至今</text>
<line x1="528.0" y1="158.0" x2="698.0" y2="158.0" stroke="#2b2722" stroke-width="1.1"/>
<line x1="528.0" y1="171.0" x2="698.0" y2="171.0" stroke="#2b2722" stroke-width="1.1"/>
<line x1="528.0" y1="184.0" x2="698.0" y2="184.0" stroke="#2b2722" stroke-width="1.1"/>
<line x1="528.0" y1="197.0" x2="698.0" y2="197.0" stroke="#2b2722" stroke-width="1.1"/>
<line x1="528.0" y1="210.0" x2="698.0" y2="210.0" stroke="#2b2722" stroke-width="1.1"/>
<circle cx="550.0" cy="171.0" r="12.0" fill="none" stroke="#A67C52" stroke-width="2"/>
<text x="550.0" y="176.0" font-size="11" text-anchor="middle" fill="#A67C52" font-weight="700">G</text>
<ellipse cx="598.0" cy="184.0" rx="8.0" ry="6.0" fill="#A67C52" stroke="none" stroke-width="1.4" transform="rotate(-20 598.0 184.0)"/>
<ellipse cx="648.0" cy="171.0" rx="8.0" ry="6.0" fill="#A67C52" stroke="none" stroke-width="1.4" transform="rotate(-20 648.0 171.0)"/>
<text x="538.0" y="232.0" font-size="10" text-anchor="start" fill="#8a8078" font-weight="400">線＋譜號＝解碼鑰匙</text>
<text x="528.0" y="268.0" font-size="10" text-anchor="start" fill="#8a8078" font-weight="400">五條線＋譜號</text>
<text x="528.0" y="286.0" font-size="10" text-anchor="start" fill="#8a8078" font-weight="400">高低與節奏都寫得清</text>
<text x="528.0" y="304.0" font-size="10" text-anchor="start" fill="#8a8078" font-weight="400">樂器、聲部都能記</text>
<line x1="60.0" y1="336.0" x2="694.0" y2="336.0" stroke="#8a8078" stroke-width="1.2"/><polygon points="700.0,336.0 693.2,339.1 693.2,332.9" fill="#8a8078"/>
</svg>
