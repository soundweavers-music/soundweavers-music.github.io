<ellipse cx="464.0" cy="107.0" rx="8.5" ry="6.2" fill="#2b2722" stroke="none" stroke-width="1.4" transform="rotate(-20 464.0 107.0)"/>
<text x="475.0" y="100.0" font-size="9.5" text-anchor="start" fill="#8a8078" font-weight="400">G3</text>
<ellipse cx="520.0" cy="100.0" rx="8.5" ry="6.2" fill="#2b2722" stroke="none" stroke-width="1.4" transform="rotate(-20 520.0 100.0)"/>
<text x="531.0" y="93.0" font-size="9.5" text-anchor="start" fill="#8a8078" font-weight="400">A3</text>
<ellipse cx="576.0" cy="93.0" rx="8.5" ry="6.2" fill="#2b2722" stroke="none" stroke-width="1.4" transform="rotate(-20 576.0 93.0)"/>
<text x="587.0" y="86.0" font-size="9.5" text-anchor="start" fill="#8a8078" font-weight="400">B3</text>
<line x1="614.0" y1="86.0" x2="650.0" y2="86.0" stroke="#2b2722" stroke-width="1.1"/>
<ellipse cx="632.0" cy="86.0" rx="8.5" ry="6.2" fill="#2b2722" stroke="none" stroke-width="1.4" transform="rotate(-20 632.0 86.0)"/>
<text x="643.0" y="79.0" font-size="9.5" text-anchor="start" fill="#8a8078" font-weight="400">C4</text>
<text x="28.0" y="218.0" font-size="12" text-anchor="start" fill="#2b2722" font-weight="400">看線（下→上）：G2・B2・D3・F3・A3</text>
<text x="28.0" y="242.0" font-size="12" text-anchor="start" fill="#2b2722" font-weight="400">看間（下→上）：A2・C3・E3・G3</text>
<text x="28.0" y="268.0" font-size="11.5" text-anchor="start" fill="#8a8078" font-weight="400">口訣：Good Boys Do Fine Always　／　All Cows Eat Grass</text>
<text x="28.0" y="296.0" font-size="11.5" text-anchor="start" fill="#8a8078" font-weight="400">同樣一條線，換了譜號就換了音名——中央 C 在低音譜號是上加一線。</text>
</svg>
