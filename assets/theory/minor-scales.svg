<text x="453.0" y="198.0" font-size="9" text-anchor="middle" fill="#8a8078" font-weight="400">全</text>
<circle cx="482.0" cy="208.0" r="14.0" fill="#fff" stroke="#d9d2c9" stroke-width="1.4"/>
