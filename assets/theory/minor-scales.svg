<text x="511.0" y="280.0" font-size="9" text-anchor="middle" fill="#8a8078" font-weight="400">全</text>
<circle cx="540.0" cy="290.0" r="14.0" fill="#fff" stroke="#A67C52" stroke-width="1.4"/>
