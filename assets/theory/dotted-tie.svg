<rect x="490.0" y="306.0" width="58.0" height="20.0" rx="2" fill="#e9d9c6" stroke="#A67C52" stroke-width="1.4"/>
<path d="M 460.0 303.0 Q 490.0 276.0 520.0 303.0" fill="none" stroke="#A67C52" stroke-width="1.6"/>
<text x="490.0" y="350.0" font-size="10.5" text-anchor="middle" fill="#A67C52" font-weight="700">2 拍</text>
</svg>
