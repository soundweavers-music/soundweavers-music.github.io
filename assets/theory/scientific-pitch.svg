<text x="70.5" y="198.0" font-size="9.5" text-anchor="middle" fill="#8a8078" font-weight="400">C4</text>
<text x="275.5" y="198.0" font-size="9.5" text-anchor="middle" fill="#8a8078" font-weight="400">A4</text>
<text x="357.5" y="198.0" font-size="9.5" text-anchor="middle" fill="#8a8078" font-weight="400">C5</text>
<text x="603.5" y="198.0" font-size="9.5" text-anchor="middle" fill="#8a8078" font-weight="400">B5</text>
<line x1="91.0" y1="90.0" x2="91.0" y2="96.0" stroke="#A67C52" stroke-width="1"/>
<text x="91.0" y="82.0" font-size="10" text-anchor="middle" fill="#A67C52" font-weight="400">C♯／D♭ 同一個鍵</text>
<text x="275.5" y="82.0" font-size="10" text-anchor="middle" fill="#A67C52" font-weight="400">A4＝440 Hz</text>
<text x="70.5" y="214.0" font-size="9.5" text-anchor="middle" fill="#A67C52" font-weight="400">中央 C</text>
<text x="28.0" y="240.0" font-size="12" text-anchor="start" fill="#2b2722" font-weight="400">科學音高＝音名＋八度數字。C4 是中央 C，所以中央 C 上方的 A 就叫 A4。</text>
<text x="28.0" y="264.0" font-size="11.5" text-anchor="start" fill="#8a8078" font-weight="400">同一個黑鍵有兩個名字：從 C 往上升叫 C♯，從 D 往下降叫 D♭——</text>
<text x="28.0" y="286.0" font-size="11.5" text-anchor="start" fill="#8a8078" font-weight="400">聲音完全一樣，寫哪一個取決於它所在的調性。</text>
<text x="28.0" y="312.0" font-size="11.5" text-anchor="start" fill="#8a8078" font-weight="400">頻率：C4 261.63 Hz　A4 440 Hz　C5 523.25 Hz（每升八度就乘以 2）</text>
</svg>
