<text x="28.0" y="40.0" font-size="19" text-anchor="start" fill="#2b2722" font-weight="700">科學音高：音名加上八度數字</text>
<text x="28.0" y="62.0" font-size="12.5" text-anchor="start" fill="#8a8078" font-weight="400">同一顆鍵在不同調性裡會有不同的寫法</text>
