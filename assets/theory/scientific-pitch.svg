<line x1="114.0" y1="102.0" x2="153.2" y2="102.0" stroke="#8a8078" stroke-width="1.2"/><polygon points="158.0,102.0 152.5,104.4 152.5,99.6" fill="#8a8078"/>
<text x="136.0" y="94.0" font-size="9.5" text-anchor="middle" fill="#8a8078" font-weight="400">同一個黑鍵：C♯／D♭</text>
<text x="30.0" y="276.0" font-size="11.5" text-anchor="start" fill="#2b2722" font-weight="400">科學音高＝音名＋八度數字。C4 是中央 C，它上方的 A 就叫 A4。</text>
<text x="30.0" y="298.0" font-size="11" text-anchor="start" fill="#8a8078" font-weight="#2b2722">同一個黑鍵有兩個名字：從 C 往上升叫 C♯，從 D 往下降叫 D♭——聲音一樣，寫法不同。</text>
<text x="30.0" y="320.0" font-size="11" text-anchor="start" fill="#8a8078" font-weight="#2b2722">頻率：C4 261.63 Hz　A4 440 Hz　C5 523.25 Hz（每升一個八度就乘以 2）</text>
</svg>
