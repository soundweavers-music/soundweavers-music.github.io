<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="100%" role="img" aria-label="五聲與藍調：拿掉幾個音">
<style>line,path,polyline{stroke-linecap:round;stroke-linejoin:round}text{font-family:'Source Han Serif TW',serif}</style>
<rect width="760" height="330" fill="#f7f3ee"/>
<rect x="14" y="76" width="732" height="238" rx="14" fill="#fff" stroke="#d9d2c9" stroke-width="1"/>
<text x="30.0" y="40.0" font-size="19" text-anchor="start" fill="#2b2722" font-weight="700">五聲與藍調：拿掉幾個音</text>
<text x="30.0" y="62.0" font-size="12.5" text-anchor="start" fill="#8a8078" font-weight="400">大調五聲抽掉 4、7；小調五聲換一個起點；藍調再多一個 ♭5</text>
<text x="28.0" y="122.0" font-size="11.5" text-anchor="start" fill="#2b2722" font-weight="700">大調五聲（1 2 3 5 6）</text>
<text x="20.0" y="140.0" font-size="9.5" text-anchor="start" fill="#8a8078" font-weight="400">抽掉第 4、7 音，沒有半音、沒有三全音</text>
<circle cx="300.0" cy="118.0" r="15.0" fill="#fff" stroke="#d9d2c9" stroke-width="1.3"/>
<text x="300.0" y="122.0" font-size="10" text-anchor="middle" fill="#2b2722" font-weight="400">C</text>
<circle cx="344.0" cy="118.0" r="15.0" fill="#fff" stroke="#d9d2c9" stroke-width="1.3"/>
<text x="344.0" y="122.0" font-size="10" text-anchor="middle" fill="#2b2722" font-weight="400">D</text>
<circle cx="388.0" cy="118.0" r="15.0" fill="#fff" stroke="#d9d2c9" stroke-width="1.3"/>
<text x="388.0" y="122.0" font-size="10" text-anchor="middle" fill="#2b2722" font-weight="400">E</text>
<circle cx="476.0" cy="118.0" r="15.0" fill="#fff" stroke="#d9d2c9" stroke-width="1.3"/>
<text x="476.0" y="122.0" font-size="10" text-anchor="middle" fill="#2b2722" font-weight="400">G</text>
<circle cx="520.0" cy="118.0" r="15.0" fill="#fff" stroke="#d9d2c9" stroke-width="1.3"/>
<text x="520.0" y="122.0" font-size="10" text-anchor="middle" fill="#2b2722" font-weight="400">A</text>
<circle cx="608.0" cy="118.0" r="15.0" fill="#fff" stroke="#d9d2c9" stroke-width="1.3"/>
<text x="608.0" y="122.0" font-size="10" text-anchor="middle" fill="#2b2722" font-weight="400">C</text>
<text x="28.0" y="188.0" font-size="11.5" text-anchor="start" fill="#2b2722" font-weight="700">小調五聲（1 ♭3 4 5 ♭7）</text>
<text x="20.0" y="206.0" font-size="9.5" text-anchor="start" fill="#8a8078" font-weight="400">流行、搖滾、R&amp;B 最常用的五個音</text>
<circle cx="300.0" cy="184.0" r="15.0" fill="#fff" stroke="#d9d2c9" stroke-width="1.3"/>
<text x="300.0" y="188.0" font-size="10" text-anchor="middle" fill="#2b2722" font-weight="400">A</text>
<circle cx="344.0" cy="184.0" r="15.0" fill="#fff" stroke="#d9d2c9" stroke-width="1.3"/>
<text x="344.0" y="188.0" font-size="10" text-anchor="middle" fill="#2b2722" font-weight="400">C</text>
<circle cx="388.0" cy="184.0" r="15.0" fill="#fff" stroke="#d9d2c9" stroke-width="1.3"/>
<text x="388.0" y="188.0" font-size="10" text-anchor="middle" fill="#2b2722" font-weight="400">D</text>
<circle cx="432.0" cy="184.0" r="15.0" fill="#fff" stroke="#d9d2c9" stroke-width="1.3"/>
<text x="432.0" y="188.0" font-size="10" text-anchor="middle" fill="#2b2722" font-weight="400">E</text>
<circle cx="476.0" cy="184.0" r="15.0" fill="#fff" stroke="#d9d2c9" stroke-width="1.3"/>
<text x="476.0" y="188.0" font-size="10" text-anchor="middle" fill="#2b2722" font-weight="400">G</text>
<text x="28.0" y="254.0" font-size="11.5" text-anchor="start" fill="#2b2722" font-weight="700">藍調音階（加 ♭5）</text>
<text x="20.0" y="272.0" font-size="9.5" text-anchor="start" fill="#8a8078" font-weight="400">♭5 是藍調音，常在半音之間滑動</text>
<circle cx="300.0" cy="250.0" r="15.0" fill="#fff" stroke="#d9d2c9" stroke-width="1.3"/>
<text x="300.0" y="254.0" font-size="10" text-anchor="middle" fill="#2b2722" font-weight="400">A</text>
<circle cx="344.0" cy="250.0" r="15.0" fill="#fff" stroke="#d9d2c9" stroke-width="1.3"/>
<text x="344.0" y="254.0" font-size="10" text-anchor="middle" fill="#2b2722" font-weight="400">C</text>
<circle cx="388.0" cy="250.0" r="15.0" fill="#fff" stroke="#d9d2c9" stroke-width="1.3"/>
<text x="388.0" y="254.0" font-size="10" text-anchor="middle" fill="#2b2722" font-weight="400">D</text>
<circle cx="432.0" cy="250.0" r="15.0" fill="#f2e0cc" stroke="#A67C52" stroke-width="1.3"/>
<text x="432.0" y="254.0" font-size="10" text-anchor="middle" fill="#A67C52" font-weight="400">E♭</text>
<circle cx="476.0" cy="250.0" r="15.0" fill="#fff" stroke="#d9d2c9" stroke-width="1.3"/>
<text x="476.0" y="254.0" font-size="10" text-anchor="middle" fill="#2b2722" font-weight="400">E</text>
<circle cx="520.0" cy="250.0" r="15.0" fill="#fff" stroke="#d9d2c9" stroke-width="1.3"/>
<text x="520.0" y="254.0" font-size="10" text-anchor="middle" fill="#2b2722" font-weight="400">G</text>
<text x="28.0" y="314.0" font-size="11" text-anchor="start" fill="#8a8078" font-weight="400">五聲音階之所以到處都是，是因為它拿掉了最容易打架的兩個音。</text>
</svg>
