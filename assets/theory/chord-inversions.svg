<text x="627.0" y="286.0" font-size="9.5" text-anchor="middle" fill="#8a8078" font-weight="400">低音＝五度 G → 懸著、待解決</text>
<text x="28.0" y="318.0" font-size="11" text-anchor="start" fill="#8a8078" font-weight="400">同樣三個音，最低音換人，功能就從「落地」變成「過渡」或「懸空」。</text>
