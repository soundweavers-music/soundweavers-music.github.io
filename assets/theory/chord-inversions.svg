<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" width="100%" role="img" aria-label="轉位：誰在最低音">
<rect width="760" height="320" fill="#f7f3ee"/>
<text x="28.0" y="40.0" font-size="19" text-anchor="start" fill="#2b2722" font-weight="700">轉位：誰在最低音</text>
<text x="28.0" y="62.0" font-size="12.5" text-anchor="start" fill="#8a8078" font-weight="400">斜線和弦的意思就是「和弦／低音」，例如 C/E＝C 和弦、低音彈 E</text>
<rect x="40.0" y="104.0" width="214.0" height="178.0" rx="10" fill="#fff" stroke="#d9d2c9" stroke-width="1.4"/>
<text x="147.0" y="130.0" font-size="12" text-anchor="middle" fill="#2b2722" font-weight="700">原位</text>
<text x="147.0" y="150.0" font-size="12.5" text-anchor="middle" fill="#A67C52" font-weight="700">C</text>
<circle cx="147.0" cy="246.0" r="13.0" fill="#A67C52" stroke="#A67C52" stroke-width="1.4"/>
<text x="147.0" y="250.0" font-size="10.5" text-anchor="middle" fill="#fff" font-weight="400">C</text>
<circle cx="147.0" cy="220.0" r="13.0" fill="#f7f3ee" stroke="#d9d2c9" stroke-width="1.4"/>
<text x="147.0" y="224.0" font-size="10.5" text-anchor="middle" fill="#2b2722" font-weight="400">E</text>
<circle cx="147.0" cy="194.0" r="13.0" fill="#f7f3ee" stroke="#d9d2c9" stroke-width="1.4"/>
<text x="147.0" y="198.0" font-size="10.5" text-anchor="middle" fill="#2b2722" font-weight="400">G</text>
<text x="147.0" y="274.0" font-size="9.5" text-anchor="middle" fill="#8a8078" font-weight="400">C 在最低 → 最落地</text>
<rect x="280.0" y="104.0" width="214.0" height="178.0" rx="10" fill="#fff" stroke="#d9d2c9" stroke-width="1.4"/>
<text x="387.0" y="130.0" font-size="12" text-anchor="middle" fill="#2b2722" font-weight="700">第一轉位</text>
<text x="387.0" y="150.0" font-size="12.5" text-anchor="middle" fill="#A67C52" font-weight="700">C/E</text>
<circle cx="387.0" cy="246.0" r="13.0" fill="#A67C52" stroke="#A67C52" stroke-width="1.4"/>
<text x="387.0" y="250.0" font-size="10.5" text-anchor="middle" fill="#fff" font-weight="400">E</text>
<circle cx="387.0" cy="220.0" r="13.0" fill="#f7f3ee" stroke="#d9d2c9" stroke-width="1.4"/>
<text x="387.0" y="224.0" font-size="10.5" text-anchor="middle" fill="#2b2722" font-weight="400">G</text>
<circle cx="387.0" cy="194.0" r="13.0" fill="#f7f3ee" stroke="#d9d2c9" stroke-width="1.4"/>
<text x="387.0" y="198.0" font-size="10.5" text-anchor="middle" fill="#2b2722" font-weight="400">C</text>
<text x="387.0" y="274.0" font-size="9.5" text-anchor="middle" fill="#8a8078" font-weight="400">E 在最低 → 輕、前進</text>
<rect x="520.0" y="104.0" width="214.0" height="178.0" rx="10" fill="#fff" stroke="#d9d2c9" stroke-width="1.4"/>
<text x="627.0" y="130.0" font-size="12" text-anchor="middle" fill="#2b2722" font-weight="700">第二轉位</text>
<text x="627.0" y="150.0" font-size="12.5" text-anchor="middle" fill="#A67C52" font-weight="700">C/G</text>
<circle cx="627.0" cy="246.0" r="13.0" fill="#A67C52" stroke="#A67C52" stroke-width="1.4"/>
<text x="627.0" y="250.0" font-size="10.5" text-anchor="middle" fill="#fff" font-weight="400">G</text>
<circle cx="627.0" cy="220.0" r="13.0" fill="#f7f3ee" stroke="#d9d2c9" stroke-width="1.4"/>
<text x="627.0" y="224.0" font-size="10.5" text-anchor="middle" fill="#2b2722" font-weight="400">C</text>
<circle cx="627.0" cy="194.0" r="13.0" fill="#f7f3ee" stroke="#d9d2c9" stroke-width="1.4"/>
<text x="627.0" y="198.0" font-size="10.5" text-anchor="middle" fill="#2b2722" font-weight="400">E</text>
<text x="627.0" y="274.0" font-size="9.5" text-anchor="middle" fill="#8a8078" font-weight="400">G 在最低 → 懸著、待解決</text>
<text x="28.0" y="306.0" font-size="11" text-anchor="start" fill="#8a8078" font-weight="400">同樣三個音，最低音換人，功能就從「落地」變成「過渡」或「懸空」。</text>
</svg>
