<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="100%" role="img" aria-label="五種常見七和弦">
<rect width="760" height="380" fill="#f7f3ee"/>
<text x="28.0" y="40.0" font-size="19" text-anchor="start" fill="#2b2722" font-weight="700">五種常見七和弦</text>
<text x="28.0" y="62.0" font-size="12.5" text-anchor="start" fill="#8a8078" font-weight="400">在三和弦上再疊一個三度，就是第四個音；它的高度決定整個和弦的性格</text>
<text x="28.0" y="116.0" font-size="11.5" text-anchor="start" fill="#2b2722" font-weight="700">大七 Cmaj7</text>
<circle cx="190.0" cy="112.0" r="14.0" fill="#fff" stroke="#d9d2c9" stroke-width="1.3"/>
<text x="190.0" y="116.0" font-size="10" text-anchor="middle" fill="#2b2722" font-weight="400">C</text>
<circle cx="234.0" cy="112.0" r="14.0" fill="#fff" stroke="#d9d2c9" stroke-width="1.3"/>
<text x="234.0" y="116.0" font-size="10" text-anchor="middle" fill="#2b2722" font-weight="400">E</text>
<circle cx="278.0" cy="112.0" r="14.0" fill="#fff" stroke="#d9d2c9" stroke-width="1.3"/>
<text x="278.0" y="116.0" font-size="10" text-anchor="middle" fill="#2b2722" font-weight="400">G</text>
<circle cx="322.0" cy="112.0" r="14.0" fill="#fff" stroke="#d9d2c9" stroke-width="1.3"/>
<text x="322.0" y="116.0" font-size="10" text-anchor="middle" fill="#2b2722" font-weight="400">B</text>
<text x="400.0" y="116.0" font-size="11" text-anchor="start" fill="#A67C52" font-weight="400">4 + 3 + 4</text>
<text x="520.0" y="116.0" font-size="10" text-anchor="start" fill="#8a8078" font-weight="400">明亮、夢幻</text>
<text x="28.0" y="168.0" font-size="11.5" text-anchor="start" fill="#2b2722" font-weight="700">屬七 C7</text>
<circle cx="190.0" cy="164.0" r="14.0" fill="#fff" stroke="#d9d2c9" stroke-width="1.3"/>
<text x="190.0" y="168.0" font-size="10" text-anchor="middle" fill="#2b2722" font-weight="400">C</text>
<circle cx="234.0" cy="164.0" r="14.0" fill="#fff" stroke="#d9d2c9" stroke-width="1.3"/>
<text x="234.0" y="168.0" font-size="10" text-anchor="middle" fill="#2b2722" font-weight="400">E</text>
<circle cx="278.0" cy="164.0" r="14.0" fill="#fff" stroke="#d9d2c9" stroke-width="1.3"/>
<text x="278.0" y="168.0" font-size="10" text-anchor="middle" fill="#2b2722" font-weight="400">G</text>
<circle cx="322.0" cy="164.0" r="14.0" fill="#f2e0cc" stroke="#A67C52" stroke-width="1.3"/>
<text x="322.0" y="168.0" font-size="10" text-anchor="middle" fill="#A67C52" font-weight="400">B♭</text>
<text x="400.0" y="168.0" font-size="11" text-anchor="start" fill="#A67C52" font-weight="400">4 + 3 + 3</text>
<text x="520.0" y="168.0" font-size="10" text-anchor="start" fill="#8a8078" font-weight="400">有張力、想解決</text>
<text x="28.0" y="220.0" font-size="11.5" text-anchor="start" fill="#2b2722" font-weight="700">小七 Cm7</text>
<circle cx="190.0" cy="216.0" r="14.0" fill="#fff" stroke="#d9d2c9" stroke-width="1.3"/>
<text x="190.0" y="220.0" font-size="10" text-anchor="middle" fill="#2b2722" font-weight="400">C</text>
<circle cx="234.0" cy="216.0" r="14.0" fill="#f2e0cc" stroke="#A67C52" stroke-width="1.3"/>
<text x="234.0" y="220.0" font-size="10" text-anchor="middle" fill="#A67C52" font-weight="400">E♭</text>
<circle cx="278.0" cy="216.0" r="14.0" fill="#fff" stroke="#d9d2c9" stroke-width="1.3"/>
<text x="278.0" y="220.0" font-size="10" text-anchor="middle" fill="#2b2722" font-weight="400">G</text>
<circle cx="322.0" cy="216.0" r="14.0" fill="#f2e0cc" stroke="#A67C52" stroke-width="1.3"/>
<text x="322.0" y="220.0" font-size="10" text-anchor="middle" fill="#A67C52" font-weight="400">B♭</text>
<text x="400.0" y="220.0" font-size="11" text-anchor="start" fill="#A67C52" font-weight="400">3 + 4 + 3</text>
<text x="520.0" y="220.0" font-size="10" text-anchor="start" fill="#8a8078" font-weight="400">柔和、爵士標配</text>
<text x="28.0" y="272.0" font-size="11.5" text-anchor="start" fill="#2b2722" font-weight="700">半減 Cm7♭5</text>
<circle cx="190.0" cy="268.0" r="14.0" fill="#fff" stroke="#d9d2c9" stroke-width="1.3"/>
<text x="190.0" y="272.0" font-size="10" text-anchor="middle" fill="#2b2722" font-weight="400">C</text>
<circle cx="234.0" cy="268.0" r="14.0" fill="#f2e0cc" stroke="#A67C52" stroke-width="1.3"/>
<text x="234.0" y="272.0" font-size="10" text-anchor="middle" fill="#A67C52" font-weight="400">E♭</text>
<circle cx="278.0" cy="268.0" r="14.0" fill="#f2e0cc" stroke="#A67C52" stroke-width="1.3"/>
<text x="278.0" y="272.0" font-size="10" text-anchor="middle" fill="#A67C52" font-weight="400">G♭</text>
<circle cx="322.0" cy="268.0" r="14.0" fill="#f2e0cc" stroke="#A67C52" stroke-width="1.3"/>
<text x="322.0" y="272.0" font-size="10" text-anchor="middle" fill="#A67C52" font-weight="400">B♭</text>
<text x="400.0" y="272.0" font-size="11" text-anchor="start" fill="#A67C52" font-weight="400">3 + 3 + 4</text>
<text x="520.0" y="272.0" font-size="10" text-anchor="start" fill="#8a8078" font-weight="400">陰暗但不崩塌</text>
<text x="28.0" y="324.0" font-size="11.5" text-anchor="start" fill="#2b2722" font-weight="700">減七 Cdim7</text>
<circle cx="190.0" cy="320.0" r="14.0" fill="#fff" stroke="#d9d2c9" stroke-width="1.3"/>
<text x="190.0" y="324.0" font-size="10" text-anchor="middle" fill="#2b2722" font-weight="400">C</text>
<circle cx="234.0" cy="320.0" r="14.0" fill="#f2e0cc" stroke="#A67C52" stroke-width="1.3"/>
<text x="234.0" y="324.0" font-size="10" text-anchor="middle" fill="#A67C52" font-weight="400">E♭</text>
<circle cx="278.0" cy="320.0" r="14.0" fill="#f2e0cc" stroke="#A67C52" stroke-width="1.3"/>
<text x="278.0" y="324.0" font-size="10" text-anchor="middle" fill="#A67C52" font-weight="400">G♭</text>
<circle cx="322.0" cy="320.0" r="14.0" fill="#f2e0cc" stroke="#A67C52" stroke-width="1.3"/>
<text x="322.0" y="324.0" font-size="10" text-anchor="middle" fill="#A67C52" font-weight="400">B♭♭</text>
<text x="400.0" y="324.0" font-size="11" text-anchor="start" fill="#A67C52" font-weight="400">3 + 3 + 3</text>
<text x="520.0" y="324.0" font-size="10" text-anchor="start" fill="#8a8078" font-weight="400">極度不穩定</text>
<text x="28.0" y="366.0" font-size="11" text-anchor="start" fill="#8a8078" font-weight="400">七和弦的張力來源是七度音：小七度想往下解決，大七度則是顏色。</text>
</svg>
