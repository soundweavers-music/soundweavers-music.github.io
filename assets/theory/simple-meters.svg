<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="100%" role="img" aria-label="單拍子的三種性格">
<style>line,path,polyline{stroke-linecap:round;stroke-linejoin:round}text{font-family:'Source Han Serif TW',serif}</style>
<rect width="760" height="340" fill="#f7f3ee"/>
<rect x="14" y="76" width="732" height="248" rx="14" fill="#fff" stroke="#d9d2c9" stroke-width="1"/>
<text x="30.0" y="40.0" font-size="19" text-anchor="start" fill="#2b2722" font-weight="700">單拍子的三種性格</text>
<text x="30.0" y="62.0" font-size="12.5" text-anchor="start" fill="#8a8078" font-weight="400">同樣的四分音符，分成 2 堆、3 堆、4 堆，走路的方式就不同</text>
<text x="28.0" y="110.0" font-size="15" text-anchor="start" fill="#2b2722" font-weight="700">2/4</text>
<text x="28.0" y="128.0" font-size="10" text-anchor="start" fill="#8a8078" font-weight="400">進行曲、行軍、嘉年華</text>
<circle cx="340.0" cy="112.0" r="15.0" fill="#A67C52" stroke="#A67C52" stroke-width="2"/>
<text x="340.0" y="117.0" font-size="11" text-anchor="middle" fill="#fff" font-weight="700">1</text>
<circle cx="380.0" cy="112.0" r="8.0" fill="#f7f3ee" stroke="#8a8078" stroke-width="1.6"/>
<text x="380.0" y="115.5" font-size="9.5" text-anchor="middle" fill="#8a8078" font-weight="400">2</text>
<circle cx="420.0" cy="112.0" r="15.0" fill="#A67C52" stroke="#A67C52" stroke-width="2"/>
<text x="420.0" y="117.0" font-size="11" text-anchor="middle" fill="#fff" font-weight="700">1</text>
<circle cx="460.0" cy="112.0" r="8.0" fill="#f7f3ee" stroke="#8a8078" stroke-width="1.6"/>
<text x="460.0" y="115.5" font-size="9.5" text-anchor="middle" fill="#8a8078" font-weight="400">2</text>
<text x="28.0" y="178.0" font-size="15" text-anchor="start" fill="#2b2722" font-weight="700">3/4</text>
<text x="28.0" y="196.0" font-size="10" text-anchor="start" fill="#8a8078" font-weight="400">華爾滋、小步舞曲</text>
<circle cx="340.0" cy="180.0" r="15.0" fill="#A67C52" stroke="#A67C52" stroke-width="2"/>
<text x="340.0" y="185.0" font-size="11" text-anchor="middle" fill="#fff" font-weight="700">1</text>
<circle cx="380.0" cy="180.0" r="8.0" fill="#f7f3ee" stroke="#8a8078" stroke-width="1.6"/>
<text x="380.0" y="183.5" font-size="9.5" text-anchor="middle" fill="#8a8078" font-weight="400">2</text>
<circle cx="420.0" cy="180.0" r="8.0" fill="#f7f3ee" stroke="#8a8078" stroke-width="1.6"/>
<text x="420.0" y="183.5" font-size="9.5" text-anchor="middle" fill="#8a8078" font-weight="400">3</text>
<circle cx="460.0" cy="180.0" r="15.0" fill="#A67C52" stroke="#A67C52" stroke-width="2"/>
<text x="460.0" y="185.0" font-size="11" text-anchor="middle" fill="#fff" font-weight="700">1</text>
<circle cx="500.0" cy="180.0" r="8.0" fill="#f7f3ee" stroke="#8a8078" stroke-width="1.6"/>
<text x="500.0" y="183.5" font-size="9.5" text-anchor="middle" fill="#8a8078" font-weight="400">2</text>
<circle cx="540.0" cy="180.0" r="8.0" fill="#f7f3ee" stroke="#8a8078" stroke-width="1.6"/>
<text x="540.0" y="183.5" font-size="9.5" text-anchor="middle" fill="#8a8078" font-weight="400">3</text>
<text x="28.0" y="246.0" font-size="15" text-anchor="start" fill="#2b2722" font-weight="700">4/4</text>
<text x="28.0" y="264.0" font-size="10" text-anchor="start" fill="#8a8078" font-weight="400">流行、搖滾、多數現代音樂</text>
<circle cx="340.0" cy="248.0" r="15.0" fill="#A67C52" stroke="#A67C52" stroke-width="2"/>
<text x="340.0" y="253.0" font-size="11" text-anchor="middle" fill="#fff" font-weight="700">1</text>
<circle cx="380.0" cy="248.0" r="8.0" fill="#f7f3ee" stroke="#8a8078" stroke-width="1.6"/>
<text x="380.0" y="251.5" font-size="9.5" text-anchor="middle" fill="#8a8078" font-weight="400">2</text>
<circle cx="420.0" cy="248.0" r="11.0" fill="#f7f3ee" stroke="#A67C52" stroke-width="2"/>
<text x="420.0" y="252.0" font-size="10" text-anchor="middle" fill="#A67C52" font-weight="700">3</text>
<circle cx="460.0" cy="248.0" r="8.0" fill="#f7f3ee" stroke="#8a8078" stroke-width="1.6"/>
<text x="460.0" y="251.5" font-size="9.5" text-anchor="middle" fill="#8a8078" font-weight="400">4</text>
<circle cx="500.0" cy="248.0" r="15.0" fill="#A67C52" stroke="#A67C52" stroke-width="2"/>
<text x="500.0" y="253.0" font-size="11" text-anchor="middle" fill="#fff" font-weight="700">1</text>
<circle cx="540.0" cy="248.0" r="8.0" fill="#f7f3ee" stroke="#8a8078" stroke-width="1.6"/>
<text x="540.0" y="251.5" font-size="9.5" text-anchor="middle" fill="#8a8078" font-weight="400">2</text>
<circle cx="580.0" cy="248.0" r="11.0" fill="#f7f3ee" stroke="#A67C52" stroke-width="2"/>
<text x="580.0" y="252.0" font-size="10" text-anchor="middle" fill="#A67C52" font-weight="700">3</text>
<circle cx="620.0" cy="248.0" r="8.0" fill="#f7f3ee" stroke="#8a8078" stroke-width="1.6"/>
<text x="620.0" y="251.5" font-size="9.5" text-anchor="middle" fill="#8a8078" font-weight="400">4</text>
<text x="28.0" y="318.0" font-size="11.5" text-anchor="start" fill="#8a8078" font-weight="400">兩小節為一組；圓圈越大＝重音越強，每小節的第一拍永遠是強拍。</text>
</svg>
