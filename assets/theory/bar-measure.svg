<text x="28.0" y="268.0" font-size="11.5" text-anchor="start" fill="#2b2722" font-weight="400">上面的 4：一小節有幾拍。下面的 4：用四分音符當一拍。</text>
<text x="28.0" y="290.0" font-size="11" text-anchor="start" fill="#8a8078" font-weight="400">小節線只是把拍子分組，不是音樂「暫停」的地方。</text>
