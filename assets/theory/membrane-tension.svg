<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" width="100%" role="img" aria-label="鼓的聲音怎麼調">
<rect width="760" height="320" fill="#f7f3ee"/>
<text x="28.0" y="40.0" font-size="19" text-anchor="start" fill="#2b2722" font-weight="700">鼓的聲音怎麼調</text>
<text x="28.0" y="62.0" font-size="12.5" text-anchor="start" fill="#8a8078" font-weight="400">膜鳴樂器用張力與面積控制音高，跟弦樂是同一個物理</text>
<circle cx="170.0" cy="200.0" r="66.0" fill="#fff" stroke="#2b2722" stroke-width="1.6"/>
<circle cx="170.0" cy="200.0" r="75.0" fill="none" stroke="#d9d2c9" stroke-width="1.2"/>
<line x1="238.0" y1="200.0" x2="252.0" y2="200.0" stroke="#A67C52" stroke-width="1.6"/>
<line x1="218.1" y1="248.1" x2="228.0" y2="258.0" stroke="#A67C52" stroke-width="1.6"/>
<line x1="170.0" y1="268.0" x2="170.0" y2="282.0" stroke="#A67C52" stroke-width="1.6"/>
<line x1="121.9" y1="248.1" x2="112.0" y2="258.0" stroke="#A67C52" stroke-width="1.6"/>
<line x1="102.0" y1="200.0" x2="88.0" y2="200.0" stroke="#A67C52" stroke-width="1.6"/>
<line x1="121.9" y1="151.9" x2="112.0" y2="142.0" stroke="#A67C52" stroke-width="1.6"/>
<line x1="170.0" y1="132.0" x2="170.0" y2="118.0" stroke="#A67C52" stroke-width="1.6"/>
<line x1="218.1" y1="151.9" x2="228.0" y2="142.0" stroke="#A67C52" stroke-width="1.6"/>
<text x="170.0" y="134.0" font-size="11" text-anchor="middle" fill="#8a8078" font-weight="400">鼓皮</text>
<text x="28.0" y="296.0" font-size="10.5" text-anchor="start" fill="#8a8078" font-weight="400">八個張力點一起拉＝調音；單邊拉太緊，鼓皮會歪，音也不乾淨。</text>
<text x="320.0" y="130.0" font-size="11.5" text-anchor="start" fill="#2b2722" font-weight="700">面積越大 → 音越低</text>
<circle cx="360.0" cy="210.0" r="24.0" fill="#fff" stroke="#2b2722" stroke-width="1.4"/>
<text x="360.0" y="252.0" font-size="10" text-anchor="middle" fill="#8a8078" font-weight="400">小鼓</text>
<circle cx="500.0" cy="210.0" r="46.0" fill="#fff" stroke="#2b2722" stroke-width="1.4"/>
<text x="500.0" y="272.0" font-size="10" text-anchor="middle" fill="#8a8078" font-weight="400">大鼓</text>
<text x="320.0" y="176.0" font-size="11.5" text-anchor="start" fill="#A67C52" font-weight="700">拉得越緊 → 音越高</text>
<text x="600.0" y="190.0" font-size="10.5" text-anchor="start" fill="#8a8078" font-weight="400">鼓皮張力＝弦的</text>
<text x="600.0" y="208.0" font-size="10.5" text-anchor="start" fill="#8a8078" font-weight="400">「張力旋鈕」；</text>
<text x="600.0" y="226.0" font-size="10.5" text-anchor="start" fill="#8a8078" font-weight="400">直徑＝弦的</text>
<text x="600.0" y="244.0" font-size="10.5" text-anchor="start" fill="#8a8078" font-weight="400">「長度」。</text>
</svg>
