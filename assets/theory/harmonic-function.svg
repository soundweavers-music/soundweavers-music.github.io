<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="100%" role="img" aria-label="三種功能，一個循環">
<rect width="760" height="340" fill="#f7f3ee"/>
<text x="28.0" y="40.0" font-size="19" text-anchor="start" fill="#2b2722" font-weight="700">三種功能，一個循環</text>
<text x="28.0" y="62.0" font-size="12.5" text-anchor="start" fill="#8a8078" font-weight="400">七個順階和弦只有三種工作：待在家、離開、回家</text>
<rect x="40.0" y="104.0" width="200.0" height="96.0" rx="10" fill="#fff" stroke="#d9d2c9" stroke-width="1.4"/>
<text x="140.0" y="132.0" font-size="12.5" text-anchor="middle" fill="#A67C52" font-weight="700">T　主功能</text>
<text x="140.0" y="158.0" font-size="11" text-anchor="middle" fill="#2b2722" font-weight="400">I・vi・iii</text>
<text x="140.0" y="182.0" font-size="9.5" text-anchor="middle" fill="#8a8078" font-weight="400">待在家、穩定</text>
<rect x="280.0" y="104.0" width="200.0" height="96.0" rx="10" fill="#fff" stroke="#d9d2c9" stroke-width="1.4"/>
<text x="380.0" y="132.0" font-size="12.5" text-anchor="middle" fill="#2b2722" font-weight="700">S　下屬功能</text>
<text x="380.0" y="158.0" font-size="11" text-anchor="middle" fill="#2b2722" font-weight="400">IV・ii</text>
<text x="380.0" y="182.0" font-size="9.5" text-anchor="middle" fill="#8a8078" font-weight="400">離開家、鋪陳</text>
<rect x="520.0" y="104.0" width="200.0" height="96.0" rx="10" fill="#fff" stroke="#d9d2c9" stroke-width="1.4"/>
<text x="620.0" y="132.0" font-size="12.5" text-anchor="middle" fill="#8a8078" font-weight="700">D　屬功能</text>
<text x="620.0" y="158.0" font-size="11" text-anchor="middle" fill="#2b2722" font-weight="400">V・vii°</text>
<text x="620.0" y="182.0" font-size="9.5" text-anchor="middle" fill="#8a8078" font-weight="400">製造張力、想回家</text>
<line x1="242.0" y1="152.0" x2="270.8" y2="152.0" stroke="#A67C52" stroke-width="1.8"/><polygon points="278.0,152.0 269.8,155.7 269.8,148.3" fill="#A67C52"/>
<line x1="482.0" y1="152.0" x2="510.8" y2="152.0" stroke="#A67C52" stroke-width="1.8"/><polygon points="518.0,152.0 509.8,155.7 509.8,148.3" fill="#A67C52"/>
<path d="M 600.0 204.0 Q 380.0 288.0 165.9 206.2" fill="none" stroke="#A67C52" stroke-width="1.7"/><polygon points="160.0,204.0 169.0,203.9 166.6,210.1" fill="#A67C52"/>
<text x="380.0" y="276.0" font-size="10.5" text-anchor="middle" fill="#A67C52" font-weight="700">D → T：回家</text>
<text x="28.0" y="300.0" font-size="11.5" text-anchor="start" fill="#2b2722" font-weight="400">常見的路徑是 T → S → D → T；也可以省略成 T → D → T。</text>
<text x="28.0" y="324.0" font-size="11" text-anchor="start" fill="#8a8078" font-weight="400">反過來走（D → S）會削弱終止的力道，流行歌常用它製造「倒退感」。</text>
</svg>
