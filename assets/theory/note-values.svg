<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="100%" role="img" aria-label="音符的時值：倍數關係">
<style>line,path,polyline{stroke-linecap:round;stroke-linejoin:round}text{font-family:'Source Han Serif TW',serif}</style>
<rect width="760" height="400" fill="#f7f3ee"/>
<rect x="14" y="76" width="732" height="308" rx="14" fill="#fff" stroke="#d9d2c9" stroke-width="1"/>
<text x="30.0" y="40.0" font-size="19" text-anchor="start" fill="#2b2722" font-weight="700">音符的時值：倍數關係</text>
<text x="30.0" y="62.0" font-size="12.5" text-anchor="start" fill="#8a8078" font-weight="400">每一種音符都是上一種的一半長；符頭空心或實心、符尾幾條，都是線索</text>
<text x="34.0" y="100.0" font-size="12.5" text-anchor="start" fill="#2b2722" font-weight="700">一個全音符 = 4 拍（4/4 拍下）</text>
<ellipse cx="96.0" cy="138.0" rx="8.2" ry="5.8" fill="none" stroke="#2b2722" stroke-width="1.8" transform="rotate(-22 96.0 138.0)"/>
<text x="120.0" y="142.0" font-size="11.5" text-anchor="start" fill="#2b2722" font-weight="700">全音符</text>
<rect x="230.0" y="127.0" width="360.0" height="20.0" rx="10" fill="#f2e7da" stroke="#A67C52" stroke-width="1.0"/>
<text x="598.0" y="142.0" font-size="10.5" text-anchor="start" fill="#8a8078" font-weight="#2b2722">4 拍</text>
<ellipse cx="96.0" cy="174.0" rx="7.8" ry="5.6" fill="none" stroke="#2b2722" stroke-width="1.8" transform="rotate(-22 96.0 174.0)"/><line x1="102.4" y1="173.0" x2="102.4" y2="142.0" stroke="#2b2722" stroke-width="1.6"/>
<text x="120.0" y="178.0" font-size="11.5" text-anchor="start" fill="#2b2722" font-weight="700">二分音符</text>
<rect x="230.0" y="163.0" width="180.0" height="20.0" rx="10" fill="#f2e7da" stroke="#A67C52" stroke-width="1.0"/>
<text x="418.0" y="178.0" font-size="10.5" text-anchor="start" fill="#8a8078" font-weight="#2b2722">2 拍</text>
<ellipse cx="96.0" cy="210.0" rx="7.8" ry="5.6" fill="#2b2722" stroke="#2b2722" stroke-width="1.8" transform="rotate(-22 96.0 210.0)"/><line x1="102.4" y1="209.0" x2="102.4" y2="178.0" stroke="#2b2722" stroke-width="1.6"/>
<text x="120.0" y="214.0" font-size="11.5" text-anchor="start" fill="#2b2722" font-weight="700">四分音符</text>
<rect x="230.0" y="199.0" width="90.0" height="20.0" rx="10" fill="#f2e7da" stroke="#A67C52" stroke-width="1.0"/>
<text x="328.0" y="214.0" font-size="10.5" text-anchor="start" fill="#8a8078" font-weight="#2b2722">1 拍</text>
<ellipse cx="96.0" cy="246.0" rx="7.8" ry="5.6" fill="#2b2722" stroke="#2b2722" stroke-width="1.8" transform="rotate(-22 96.0 246.0)"/><line x1="102.4" y1="245.0" x2="102.4" y2="214.0" stroke="#2b2722" stroke-width="1.6"/><path d="M 102.4 214.0 q 10 6 9 16" fill="none" stroke="#2b2722" stroke-width="2.0"/>
<text x="120.0" y="250.0" font-size="11.5" text-anchor="start" fill="#2b2722" font-weight="700">八分音符</text>
<rect x="230.0" y="235.0" width="45.0" height="20.0" rx="10" fill="#f2e7da" stroke="#A67C52" stroke-width="1.0"/>
<text x="283.0" y="250.0" font-size="10.5" text-anchor="start" fill="#8a8078" font-weight="#2b2722">半拍</text>
<ellipse cx="96.0" cy="282.0" rx="7.8" ry="5.6" fill="#2b2722" stroke="#2b2722" stroke-width="1.8" transform="rotate(-22 96.0 282.0)"/><line x1="102.4" y1="281.0" x2="102.4" y2="250.0" stroke="#2b2722" stroke-width="1.6"/><path d="M 102.4 250.0 q 10 6 9 16" fill="none" stroke="#2b2722" stroke-width="2.0"/><path d="M 102.4 258.0 q 10 6 9 16" fill="none" stroke="#2b2722" stroke-width="2.0"/>
<text x="120.0" y="286.0" font-size="11.5" text-anchor="start" fill="#2b2722" font-weight="700">十六分音符</text>
<rect x="230.0" y="271.0" width="22.5" height="20.0" rx="10" fill="#f2e7da" stroke="#A67C52" stroke-width="1.0"/>
<text x="260.5" y="286.0" font-size="10.5" text-anchor="start" fill="#8a8078" font-weight="#2b2722">1/4 拍</text>
<line x1="34.0" y1="322.0" x2="726.0" y2="322.0" stroke="#d9d2c9" stroke-width="1"/>
<text x="34.0" y="344.0" font-size="11" text-anchor="start" fill="#8a8078" font-weight="#2b2722">拍號決定「一拍」是哪一種音符：4/4 → 四分音符、6/8 → 八分音符、2/2 → 二分音符。</text>
</svg>
