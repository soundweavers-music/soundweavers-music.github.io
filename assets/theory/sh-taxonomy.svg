<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 382" width="100%" role="img" aria-label="薩克斯—霍恩博斯特爾分類">
<rect width="760" height="382" fill="#f7f3ee"/>
<text x="28.0" y="40.0" font-size="19" text-anchor="start" fill="#2b2722" font-weight="700">薩克斯—霍恩博斯特爾分類</text>
<text x="28.0" y="62.0" font-size="12.5" text-anchor="start" fill="#8a8078" font-weight="400">一個問題問到底：聲音的源頭是什麼在震動？</text>
<rect x="28.0" y="164.0" width="156.0" height="64.0" rx="8" fill="#A67C52" stroke="none" stroke-width="1.4"/>
<text x="106.0" y="190.0" font-size="13" text-anchor="middle" fill="#fff" font-weight="700">什麼東西</text>
<text x="106.0" y="212.0" font-size="13" text-anchor="middle" fill="#fff" font-weight="700">在振動？</text>
<line x1="184.0" y1="196.0" x2="240.0" y2="92.0" stroke="#d9d2c9" stroke-width="1.1"/>
<rect x="240.0" y="68.0" width="250.0" height="48.0" rx="6" fill="#f7f3ee" stroke="#d9d2c9" stroke-width="1.4"/>
<text x="254.0" y="88.0" font-size="12.5" text-anchor="start" fill="#2b2722" font-weight="700">弦鳴</text>
<text x="254.0" y="107.0" font-size="10.5" text-anchor="start" fill="#8a8078" font-weight="400">振動源：弦</text>
<text x="506.0" y="96.0" font-size="10.5" text-anchor="start" fill="#2b2722" font-weight="400">小提琴・吉他・鋼琴</text>
<line x1="184.0" y1="196.0" x2="240.0" y2="144.0" stroke="#d9d2c9" stroke-width="1.1"/>
<rect x="240.0" y="120.0" width="250.0" height="48.0" rx="6" fill="#f7f3ee" stroke="#d9d2c9" stroke-width="1.4"/>
<text x="254.0" y="140.0" font-size="12.5" text-anchor="start" fill="#2b2722" font-weight="700">氣鳴</text>
<text x="254.0" y="159.0" font-size="10.5" text-anchor="start" fill="#8a8078" font-weight="400">振動源：空氣柱</text>
<text x="506.0" y="148.0" font-size="10.5" text-anchor="start" fill="#2b2722" font-weight="400">長笛・小號・迪吉里杜管</text>
<line x1="184.0" y1="196.0" x2="240.0" y2="196.0" stroke="#d9d2c9" stroke-width="1.1"/>
<rect x="240.0" y="172.0" width="250.0" height="48.0" rx="6" fill="#f7f3ee" stroke="#d9d2c9" stroke-width="1.4"/>
<text x="254.0" y="192.0" font-size="12.5" text-anchor="start" fill="#2b2722" font-weight="700">膜鳴</text>
<text x="254.0" y="211.0" font-size="10.5" text-anchor="start" fill="#8a8078" font-weight="400">振動源：繃緊的皮膜</text>
<text x="506.0" y="200.0" font-size="10.5" text-anchor="start" fill="#2b2722" font-weight="400">定音鼓・小鼓・鈴鼓</text>
<line x1="184.0" y1="196.0" x2="240.0" y2="248.0" stroke="#d9d2c9" stroke-width="1.1"/>
<rect x="240.0" y="224.0" width="250.0" height="48.0" rx="6" fill="#f7f3ee" stroke="#d9d2c9" stroke-width="1.4"/>
<text x="254.0" y="244.0" font-size="12.5" text-anchor="start" fill="#2b2722" font-weight="700">體鳴</text>
<text x="254.0" y="263.0" font-size="10.5" text-anchor="start" fill="#8a8078" font-weight="400">振動源：樂器本體</text>
<text x="506.0" y="252.0" font-size="10.5" text-anchor="start" fill="#2b2722" font-weight="400">木琴・鑼・鈸</text>
<line x1="184.0" y1="196.0" x2="240.0" y2="300.0" stroke="#d9d2c9" stroke-width="1.1"/>
<rect x="240.0" y="276.0" width="250.0" height="48.0" rx="6" fill="#f7f3ee" stroke="#d9d2c9" stroke-width="1.4"/>
<text x="254.0" y="296.0" font-size="12.5" text-anchor="start" fill="#2b2722" font-weight="700">電鳴</text>
<text x="254.0" y="315.0" font-size="10.5" text-anchor="start" fill="#8a8078" font-weight="400">振動源：電路或電子拾音</text>
<text x="506.0" y="304.0" font-size="10.5" text-anchor="start" fill="#2b2722" font-weight="400">合成器・電鋼琴・電吉他</text>
<text x="28.0" y="350.0" font-size="11.5" text-anchor="start" fill="#8a8078" font-weight="400">外觀、材質、怎麼演奏都是表象；只有「什麼在振動」是單一標準。</text>
<text x="28.0" y="364.0" font-size="11.5" text-anchor="start" fill="#8a8078" font-weight="400">電鳴是後來補上的第五類，不在 1914 年的原始架構裡。</text>
</svg>
