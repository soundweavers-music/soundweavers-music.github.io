<text x="30.0" y="62.0" font-size="12.5" text-anchor="start" fill="#8a8078" font-weight="400">第二線（G4）被螺旋圈住，其餘的音就照著階梯數</text>
<line x1="110.0" y1="156.0" x2="720.0" y2="156.0" stroke="#2b2722" stroke-width="1.1"/>
