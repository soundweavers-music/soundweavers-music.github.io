<text x="28.0" y="268.0" font-size="11.5" text-anchor="start" fill="#8a8078" font-weight="400">口訣：Every Good Boy Deserves Fudge　／　FACE</text>
<text x="28.0" y="296.0" font-size="11.5" text-anchor="start" fill="#8a8078" font-weight="400">中央 C（C4）在下加一線；再往下就只是多畫一條短線，階梯照樣推算。</text>
