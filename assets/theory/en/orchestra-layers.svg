<text x="504.0" y="232.0" font-size="10.5" text-anchor="middle" fill="#2b2722" font-weight="400">horn</text>
<rect x="574.0" y="204.0" width="112.0" height="44.0" rx="8" fill="#fff" stroke="#d9d2c9" stroke-width="1.4"/>
<text x="630.0" y="232.0" font-size="10.5" text-anchor="middle" fill="#2b2722" font-weight="400">oboe II</text>
<rect x="180.0" y="274.0" width="520.0" height="72.0" rx="10" fill="#efe8df" stroke="none" stroke-width="1.4"/>
<text x="166.0" y="316.0" font-size="12.5" text-anchor="end" fill="#2b2722" font-weight="700">low</text>
<rect x="196.0" y="288.0" width="112.0" height="44.0" rx="8" fill="#fff" stroke="#d9d2c9" stroke-width="1.4"/>
<text x="252.0" y="316.0" font-size="10.5" text-anchor="middle" fill="#2b2722" font-weight="400">cello</text>
<rect x="322.0" y="288.0" width="112.0" height="44.0" rx="8" fill="#fff" stroke="#d9d2c9" stroke-width="1.4"/>
<text x="378.0" y="316.0" font-size="10.5" text-anchor="middle" fill="#2b2722" font-weight="400">bassoon</text>
<rect x="448.0" y="288.0" width="112.0" height="44.0" rx="8" fill="#fff" stroke="#d9d2c9" stroke-width="1.4"/>
<text x="504.0" y="316.0" font-size="10.5" text-anchor="middle" fill="#2b2722" font-weight="400">double bass</text>
