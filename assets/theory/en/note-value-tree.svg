<text x="28.0" y="292.0" font-size="10" text-anchor="start" fill="#8a8078" font-weight="400">Half beat</text>
<text x="722.0" y="284.0" font-size="10" text-anchor="start" fill="#8a8078" font-weight="400">×8</text>
<text x="430.0" y="322.0" font-size="11.5" text-anchor="middle" fill="#8a8078" font-weight="400">One line of the same length can be cut into 1, 2, 4, 8 parts</text>
