<text x="722.0" y="180.0" font-size="10" text-anchor="start" fill="#8a8078" font-weight="400">×2</text>
<rect x="150.0" y="212.0" width="136.0" height="30.0" rx="3" fill="#f7f3ee" stroke="#d9d2c9" stroke-width="1.2"/>
<rect x="290.0" y="212.0" width="136.0" height="30.0" rx="3" fill="#f7f3ee" stroke="#d9d2c9" stroke-width="1.2"/>
<rect x="430.0" y="212.0" width="136.0" height="30.0" rx="3" fill="#f7f3ee" stroke="#d9d2c9" stroke-width="1.2"/>
<rect x="570.0" y="212.0" width="136.0" height="30.0" rx="3" fill="#f7f3ee" stroke="#d9d2c9" stroke-width="1.2"/>
<text x="28.0" y="224.0" font-size="12.5" text-anchor="start" fill="#2b2722" font-weight="700">Quarter note</text>
