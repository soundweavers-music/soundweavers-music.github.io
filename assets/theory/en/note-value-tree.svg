<text x="28.0" y="136.0" font-size="10" text-anchor="start" fill="#8a8078" font-weight="400">4 beats</text>
<text x="722.0" y="128.0" font-size="10" text-anchor="start" fill="#8a8078" font-weight="400">×1</text>
<rect x="150.0" y="160.0" width="276.0" height="30.0" rx="3" fill="#f7f3ee" stroke="#d9d2c9" stroke-width="1.2"/>
