<rect x="290.0" y="264.0" width="66.0" height="30.0" rx="3" fill="#f7f3ee" stroke="#d9d2c9" stroke-width="1.2"/>
<rect x="360.0" y="264.0" width="66.0" height="30.0" rx="3" fill="#f7f3ee" stroke="#d9d2c9" stroke-width="1.2"/>
<rect x="430.0" y="264.0" width="66.0" height="30.0" rx="3" fill="#f7f3ee" stroke="#d9d2c9" stroke-width="1.2"/>
