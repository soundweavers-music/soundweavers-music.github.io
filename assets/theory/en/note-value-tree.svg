<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="100%" role="img" aria-label="Note values: each level halves">
<style>line,path,polyline{stroke-linecap:round;stroke-linejoin:round}text{font-family:'Source Han Serif TW',serif}</style>
<rect width="760" height="340" fill="#f7f3ee"/>
<rect x="14" y="76" width="732" height="248" rx="14" fill="#fff" stroke="#d9d2c9" stroke-width="1"/>
<text x="30.0" y="40.0" font-size="19" text-anchor="start" fill="#2b2722" font-weight="700">Note values: each level halves</text>
<text x="30.0" y="62.0" font-size="12.5" text-anchor="start" fill="#8a8078" font-weight="400">One bar of equal length; each level down is shorter; the number of flags = how many times it was halved</text>
<rect x="150.0" y="108.0" width="556.0" height="30.0" rx="3" fill="#A67C52" stroke="#d9d2c9" stroke-width="1.2"/>
