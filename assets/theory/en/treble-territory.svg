<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="100%" role="img" aria-label="What the treble clef is for">
<rect width="760" height="330" fill="#f7f3ee"/>
<text x="28.0" y="40.0" font-size="19" text-anchor="start" fill="#2b2722" font-weight="700">What the treble clef is for</text>
<text x="28.0" y="62.0" font-size="12.5" text-anchor="start" fill="#8a8078" font-weight="400">Most melodic instruments and high voices are written here</text>
<line x1="52.0" y1="150.0" x2="250.0" y2="150.0" stroke="#2b2722" stroke-width="1.1"/>
<line x1="52.0" y1="163.0" x2="250.0" y2="163.0" stroke="#2b2722" stroke-width="1.1"/>
<line x1="52.0" y1="176.0" x2="250.0" y2="176.0" stroke="#2b2722" stroke-width="1.1"/>
<line x1="52.0" y1="189.0" x2="250.0" y2="189.0" stroke="#2b2722" stroke-width="1.1"/>
<line x1="52.0" y1="202.0" x2="250.0" y2="202.0" stroke="#2b2722" stroke-width="1.1"/>
<circle cx="78.0" cy="163.0" r="14.0" fill="none" stroke="#A67C52" stroke-width="2"/>
<text x="78.0" y="168.0" font-size="13" text-anchor="middle" fill="#A67C52" font-weight="700">G</text>
<text x="52.0" y="128.0" font-size="13" text-anchor="start" fill="#2b2722" font-weight="700">Treble clef (G clef)</text>
<text x="52.0" y="232.0" font-size="10" text-anchor="start" fill="#8a8078" font-weight="400">The spiral circles line 2 → that line is G4</text>
<text x="52.0" y="252.0" font-size="10" text-anchor="start" fill="#8a8078" font-weight="400">Usual range about C4–C6; ledger lines go higher</text>
<rect x="330.0" y="116.0" width="180.0" height="44.0" rx="8" fill="#fff" stroke="#d9d2c9" stroke-width="1.4"/>
<text x="346.0" y="144.0" font-size="12" text-anchor="start" fill="#2b2722" font-weight="400">Flute</text>
<rect x="530.0" y="116.0" width="180.0" height="44.0" rx="8" fill="#fff" stroke="#d9d2c9" stroke-width="1.4"/>
<text x="546.0" y="144.0" font-size="12" text-anchor="start" fill="#2b2722" font-weight="400">Oboe</text>
<rect x="330.0" y="174.0" width="180.0" height="44.0" rx="8" fill="#fff" stroke="#d9d2c9" stroke-width="1.4"/>
<text x="346.0" y="202.0" font-size="12" text-anchor="start" fill="#2b2722" font-weight="400">Clarinet</text>
<rect x="530.0" y="174.0" width="180.0" height="44.0" rx="8" fill="#fff" stroke="#d9d2c9" stroke-width="1.4"/>
<text x="546.0" y="202.0" font-size="12" text-anchor="start" fill="#2b2722" font-weight="400">Violin</text>
<rect x="330.0" y="232.0" width="180.0" height="44.0" rx="8" fill="#fff" stroke="#d9d2c9" stroke-width="1.4"/>
<text x="346.0" y="260.0" font-size="12" text-anchor="start" fill="#2b2722" font-weight="400">Trumpet</text>
<rect x="530.0" y="232.0" width="180.0" height="44.0" rx="8" fill="#fff" stroke="#d9d2c9" stroke-width="1.4"/>
<text x="546.0" y="260.0" font-size="12" text-anchor="start" fill="#2b2722" font-weight="400">Piano, right hand</text>
<text x="330.0" y="300.0" font-size="11.5" text-anchor="start" fill="#A67C52" font-weight="700">Melody lives here: this is the &quot;lead&quot; clef</text>
</svg>
