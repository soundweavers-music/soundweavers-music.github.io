<text x="28.0" y="306.0" font-size="11.5" text-anchor="start" fill="#2b2722" font-weight="700">Aeolian</text>
<text x="150.0" y="306.0" font-size="11" text-anchor="start" fill="#A67C52" font-weight="700">A</text>
<text x="200.0" y="306.0" font-size="11" text-anchor="middle" fill="#2b2722" font-weight="400">A</text>
