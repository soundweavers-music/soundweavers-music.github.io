<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="100%" role="img" aria-label="Dots and ties: two ways to lengthen a note">
<style>line,path,polyline{stroke-linecap:round;stroke-linejoin:round}text{font-family:'Source Han Serif TW',serif}</style>
<rect width="760" height="340" fill="#f7f3ee"/>
<rect x="14" y="76" width="732" height="248" rx="14" fill="#fff" stroke="#d9d2c9" stroke-width="1"/>
<text x="30.0" y="40.0" font-size="19" text-anchor="start" fill="#2b2722" font-weight="700">Dots and ties: two ways to lengthen a note</text>
<text x="30.0" y="62.0" font-size="12.5" text-anchor="start" fill="#8a8078" font-weight="400">A dot adds half; a tie joins two notes into one</text>
<text x="28.0" y="124.0" font-size="12" text-anchor="start" fill="#2b2722" font-weight="700">Dotted half = 3 beats</text>
<text x="20.0" y="142.0" font-size="9" text-anchor="start" fill="#8a8078" font-weight="400">2 beats + half (1 beat) = 3 beats</text>
<line x1="250.0" y1="108.0" x2="250.0" y2="142.0" stroke="#2b2722" stroke-width="1.2"/>
<line x1="310.0" y1="108.0" x2="310.0" y2="142.0" stroke="#d9d2c9" stroke-width="1"/>
<line x1="370.0" y1="108.0" x2="370.0" y2="142.0" stroke="#d9d2c9" stroke-width="1"/>
<line x1="430.0" y1="108.0" x2="430.0" y2="142.0" stroke="#d9d2c9" stroke-width="1"/>
<line x1="490.0" y1="108.0" x2="490.0" y2="142.0" stroke="#2b2722" stroke-width="1.2"/>
<rect x="250.0" y="114.0" width="178.0" height="22.0" rx="2" fill="#e9d9c6" stroke="#A67C52" stroke-width="1.4"/>
<text x="340.0" y="129.0" font-size="10" text-anchor="middle" fill="#A67C52" font-weight="700">3 beats</text>
<rect x="430.0" y="118.0" width="58.0" height="14.0" rx="2" fill="none" stroke="#d9d2c9" stroke-width="1"/>
<text x="460.0" y="129.0" font-size="9.5" text-anchor="middle" fill="#8a8078" font-weight="400">Rest</text>
<text x="28.0" y="186.0" font-size="12" text-anchor="start" fill="#2b2722" font-weight="700">Dotted quarter = 1.5 beats</text>
<text x="20.0" y="204.0" font-size="9" text-anchor="start" fill="#8a8078" font-weight="400">1 beat + half (half beat) = 1.5 beats</text>
<line x1="250.0" y1="170.0" x2="250.0" y2="204.0" stroke="#2b2722" stroke-width="1.2"/>
<line x1="310.0" y1="170.0" x2="310.0" y2="204.0" stroke="#d9d2c9" stroke-width="1"/>
<line x1="370.0" y1="170.0" x2="370.0" y2="204.0" stroke="#d9d2c9" stroke-width="1"/>
<line x1="430.0" y1="170.0" x2="430.0" y2="204.0" stroke="#d9d2c9" stroke-width="1"/>
<line x1="490.0" y1="170.0" x2="490.0" y2="204.0" stroke="#2b2722" stroke-width="1.2"/>
<rect x="250.0" y="176.0" width="88.0" height="22.0" rx="2" fill="#e9d9c6" stroke="#A67C52" stroke-width="1.4"/>
<text x="295.0" y="191.0" font-size="10" text-anchor="middle" fill="#A67C52" font-weight="700">1.5 beats</text>
<rect x="340.0" y="180.0" width="148.0" height="14.0" rx="2" fill="none" stroke="#d9d2c9" stroke-width="1"/>
<text x="415.0" y="191.0" font-size="9.5" text-anchor="middle" fill="#8a8078" font-weight="400">Rest</text>
<text x="28.0" y="248.0" font-size="12" text-anchor="start" fill="#2b2722" font-weight="700">Dotted eighth = 0.75 beat</text>
<text x="20.0" y="266.0" font-size="9" text-anchor="start" fill="#8a8078" font-weight="400">Half beat + half (quarter beat)</text>
<line x1="250.0" y1="232.0" x2="250.0" y2="266.0" stroke="#2b2722" stroke-width="1.2"/>
<line x1="310.0" y1="232.0" x2="310.0" y2="266.0" stroke="#d9d2c9" stroke-width="1"/>
<line x1="370.0" y1="232.0" x2="370.0" y2="266.0" stroke="#d9d2c9" stroke-width="1"/>
<line x1="430.0" y1="232.0" x2="430.0" y2="266.0" stroke="#d9d2c9" stroke-width="1"/>
<line x1="490.0" y1="232.0" x2="490.0" y2="266.0" stroke="#2b2722" stroke-width="1.2"/>
<rect x="250.0" y="238.0" width="43.0" height="22.0" rx="2" fill="#e9d9c6" stroke="#A67C52" stroke-width="1.4"/>
<text x="272.5" y="253.0" font-size="10" text-anchor="middle" fill="#A67C52" font-weight="700">0.75</text>
<rect x="295.0" y="242.0" width="193.0" height="14.0" rx="2" fill="none" stroke="#d9d2c9" stroke-width="1"/>
<text x="392.5" y="253.0" font-size="9.5" text-anchor="middle" fill="#8a8078" font-weight="400">Rest</text>
<text x="28.0" y="318.0" font-size="12" text-anchor="start" fill="#2b2722" font-weight="700">Tie: across the barline</text>
<text x="20.0" y="336.0" font-size="9" text-anchor="start" fill="#8a8078" font-weight="400">Two same pitches joined = 2 beats</text>
<line x1="250.0" y1="302.0" x2="250.0" y2="332.0" stroke="#2b2722" stroke-width="1.2"/>
<line x1="310.0" y1="302.0" x2="310.0" y2="332.0" stroke="#d9d2c9" stroke-width="1"/>
<line x1="370.0" y1="302.0" x2="370.0" y2="332.0" stroke="#d9d2c9" stroke-width="1"/>
<line x1="430.0" y1="302.0" x2="430.0" y2="332.0" stroke="#d9d2c9" stroke-width="1"/>
<line x1="490.0" y1="302.0" x2="490.0" y2="332.0" stroke="#2b2722" stroke-width="1.2"/>
<line x1="490.0" y1="302.0" x2="490.0" y2="332.0" stroke="#2b2722" stroke-width="1.2"/>
<line x1="550.0" y1="302.0" x2="550.0" y2="332.0" stroke="#d9d2c9" stroke-width="1"/>
<line x1="610.0" y1="302.0" x2="610.0" y2="332.0" stroke="#d9d2c9" stroke-width="1"/>
<line x1="670.0" y1="302.0" x2="670.0" y2="332.0" stroke="#d9d2c9" stroke-width="1"/>
<line x1="730.0" y1="302.0" x2="730.0" y2="332.0" stroke="#2b2722" stroke-width="1.2"/>
<rect x="430.0" y="306.0" width="58.0" height="20.0" rx="2" fill="#e9d9c6" stroke="#A67C52" stroke-width="1.4"/>
<rect x="490.0" y="306.0" width="58.0" height="20.0" rx="2" fill="#e9d9c6" stroke="#A67C52" stroke-width="1.4"/>
<path d="M 460.0 303.0 Q 490.0 276.0 520.0 303.0" fill="none" stroke="#A67C52" stroke-width="1.6"/>
<text x="490.0" y="350.0" font-size="10.5" text-anchor="middle" fill="#A67C52" font-weight="700">2 beats</text>
</svg>
