<text x="28.0" y="118.0" font-size="13" text-anchor="start" fill="#2b2722" font-weight="700">beat</text>
<text x="28.0" y="136.0" font-size="10.5" text-anchor="start" fill="#8a8078" font-weight="400">background grid</text>
<text x="28.0" y="206.0" font-size="13" text-anchor="start" fill="#2b2722" font-weight="700">rhythm</text>
