<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="100%" role="img" aria-label="從紐姆譜到五線譜">
<rect width="760" height="360" fill="#f7f3ee"/>
<text x="28.0" y="40.0" font-size="19" text-anchor="start" fill="#2b2722" font-weight="700">From neumes to the five-line staff</text>
<text x="28.0" y="62.0" font-size="12.5" text-anchor="start" fill="#8a8078" font-weight="400">Every invention answers the same question: how to write sound down so someone else sings it the same way</text>
<text x="52.0" y="108.0" font-size="14" text-anchor="start" fill="#2b2722" font-weight="700">neumes</text>
<text x="52.0" y="126.0" font-size="10.5" text-anchor="start" fill="#8a8078" font-weight="400">9th–10th century</text>
<ellipse cx="98.0" cy="176.0" rx="7.0" ry="4.5" fill="#A67C52" stroke="none" stroke-width="1.4" transform="rotate(-20 98.0 176.0)"/>
<ellipse cx="130.0" cy="170.0" rx="7.0" ry="4.5" fill="#A67C52" stroke="none" stroke-width="1.4" transform="rotate(-20 130.0 170.0)"/>
<ellipse cx="164.0" cy="178.0" rx="7.0" ry="4.5" fill="#A67C52" stroke="none" stroke-width="1.4" transform="rotate(-20 164.0 178.0)"/>
<ellipse cx="196.0" cy="172.0" rx="7.0" ry="4.5" fill="#A67C52" stroke="none" stroke-width="1.4" transform="rotate(-20 196.0 172.0)"/>
<text x="62.0" y="214.0" font-size="10" text-anchor="start" fill="#8a8078" font-weight="400">lyric line</text>
<text x="52.0" y="268.0" font-size="10" text-anchor="start" fill="#8a8078" font-weight="400">marks float above the words</text>
<text x="52.0" y="286.0" font-size="10" text-anchor="start" fill="#8a8078" font-weight="400">only direction and shape</text>
<text x="52.0" y="304.0" font-size="10" text-anchor="start" fill="#8a8078" font-weight="400">pitch lives in memory and word of mouth</text>
<text x="290.0" y="108.0" font-size="14" text-anchor="start" fill="#2b2722" font-weight="700">the four-line staff</text>
<text x="290.0" y="126.0" font-size="10.5" text-anchor="start" fill="#8a8078" font-weight="400">11th century, Guido</text>
<line x1="290.0" y1="164.0" x2="460.0" y2="164.0" stroke="#2b2722" stroke-width="1.1"/>
<line x1="290.0" y1="178.0" x2="460.0" y2="178.0" stroke="#2b2722" stroke-width="1.1"/>
<line x1="290.0" y1="192.0" x2="460.0" y2="192.0" stroke="#2b2722" stroke-width="1.1"/>
<line x1="290.0" y1="206.0" x2="460.0" y2="206.0" stroke="#2b2722" stroke-width="1.1"/>
<rect x="330.0" y="165.0" width="9.0" height="9.0" rx="1" fill="#A67C52" stroke="none" stroke-width="1.4"/>
<rect x="382.0" y="179.0" width="9.0" height="9.0" rx="1" fill="#A67C52" stroke="none" stroke-width="1.4"/>
<rect x="430.0" y="165.0" width="9.0" height="9.0" rx="1" fill="#A67C52" stroke="none" stroke-width="1.4"/>
<text x="300.0" y="232.0" font-size="10" text-anchor="start" fill="#8a8078" font-weight="400">a line is a staircase for pitch</text>
<text x="290.0" y="268.0" font-size="10" text-anchor="start" fill="#8a8078" font-weight="400">pull the line out</text>
<text x="290.0" y="286.0" font-size="10" text-anchor="start" fill="#8a8078" font-weight="400">pitch has a position at last</text>
<text x="290.0" y="304.0" font-size="10" text-anchor="start" fill="#8a8078" font-weight="400">choirs can learn at a distance</text>
<text x="528.0" y="108.0" font-size="14" text-anchor="start" fill="#2b2722" font-weight="700">the five-line staff</text>
<text x="528.0" y="126.0" font-size="10.5" text-anchor="start" fill="#8a8078" font-weight="400">17th century to today</text>
<line x1="528.0" y1="158.0" x2="698.0" y2="158.0" stroke="#2b2722" stroke-width="1.1"/>
<line x1="528.0" y1="171.0" x2="698.0" y2="171.0" stroke="#2b2722" stroke-width="1.1"/>
<line x1="528.0" y1="184.0" x2="698.0" y2="184.0" stroke="#2b2722" stroke-width="1.1"/>
<line x1="528.0" y1="197.0" x2="698.0" y2="197.0" stroke="#2b2722" stroke-width="1.1"/>
<line x1="528.0" y1="210.0" x2="698.0" y2="210.0" stroke="#2b2722" stroke-width="1.1"/>
<circle cx="550.0" cy="171.0" r="12.0" fill="none" stroke="#A67C52" stroke-width="2"/>
<text x="550.0" y="176.0" font-size="11" text-anchor="middle" fill="#A67C52" font-weight="700">G</text>
<ellipse cx="598.0" cy="184.0" rx="8.0" ry="6.0" fill="#A67C52" stroke="none" stroke-width="1.4" transform="rotate(-20 598.0 184.0)"/>
<ellipse cx="648.0" cy="171.0" rx="8.0" ry="6.0" fill="#A67C52" stroke="none" stroke-width="1.4" transform="rotate(-20 648.0 171.0)"/>
<text x="538.0" y="232.0" font-size="10" text-anchor="start" fill="#8a8078" font-weight="400">lines + clef = the decoding key</text>
<text x="528.0" y="268.0" font-size="10" text-anchor="start" fill="#8a8078" font-weight="400">five lines and a clef</text>
<text x="528.0" y="286.0" font-size="10" text-anchor="start" fill="#8a8078" font-weight="400">pitch and rhythm both written clearly</text>
<text x="528.0" y="304.0" font-size="10" text-anchor="start" fill="#8a8078" font-weight="400">instruments and voices both</text>
<line x1="60.0" y1="336.0" x2="700.0" y2="336.0" stroke="#8a8078" stroke-width="1.2"/><path d="M693.2 339.1 L700.0 336.0 L693.2 332.9" fill="none" stroke="#8a8078" stroke-width="1.2"/>
</svg>
