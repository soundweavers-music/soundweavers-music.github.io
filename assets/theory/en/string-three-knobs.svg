<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" width="100%" role="img" aria-label="Three knobs on a string: length, tension, mass">
<rect width="760" height="350" fill="#f7f3ee"/>
<text x="28.0" y="40.0" font-size="19" text-anchor="start" fill="#2b2722" font-weight="700">Three knobs on a string: length, tension, mass</text>
<text x="28.0" y="62.0" font-size="12.5" text-anchor="start" fill="#8a8078" font-weight="400">frequency ∝ √(tension/mass) ÷ length; in practice length is the one you move</text>
<text x="28.0" y="96.0" font-size="12" text-anchor="start" fill="#2b2722" font-weight="400">Pitch is set by three things, and changing any one changes the frequency</text>
<text x="28.0" y="140.0" font-size="12" text-anchor="start" fill="#2b2722" font-weight="700">length</text>
<line x1="120.0" y1="136.0" x2="460.0" y2="136.0" stroke="#2b2722" stroke-width="2.6"/>
<line x1="120.0" y1="168.0" x2="250.0" y2="168.0" stroke="#2b2722" stroke-width="2.6"/>
<line x1="470.0" y1="136.0" x2="524.0" y2="136.0" stroke="#A67C52" stroke-width="1.5"/><polygon points="530.0,136.0 523.2,139.1 523.2,132.9" fill="#A67C52"/>
<text x="540.0" y="141.0" font-size="11" text-anchor="start" fill="#A67C52" font-weight="700">shorter string → higher note</text>
<text x="120.0" y="190.0" font-size="10" text-anchor="start" fill="#8a8078" font-weight="400">Fretting a note is exactly this: cutting the sounding length short</text>
<text x="28.0" y="228.0" font-size="12" text-anchor="start" fill="#2b2722" font-weight="700">tension</text>
<line x1="120.0" y1="224.0" x2="460.0" y2="224.0" stroke="#2b2722" stroke-width="2.6"/>
<line x1="112.0" y1="224.0" x2="66.0" y2="224.0" stroke="#8a8078" stroke-width="1.2"/><polygon points="60.0,224.0 66.8,220.9 66.8,227.1" fill="#8a8078"/>
<line x1="468.0" y1="224.0" x2="514.0" y2="224.0" stroke="#8a8078" stroke-width="1.2"/><polygon points="520.0,224.0 513.2,227.1 513.2,220.9" fill="#8a8078"/>
<line x1="520.0" y1="224.0" x2="574.0" y2="224.0" stroke="#A67C52" stroke-width="1.5"/><polygon points="580.0,224.0 573.2,227.1 573.2,220.9" fill="#A67C52"/>
<text x="590.0" y="229.0" font-size="11" text-anchor="start" fill="#A67C52" font-weight="700">tighter → higher note</text>
<text x="28.0" y="292.0" font-size="12" text-anchor="start" fill="#2b2722" font-weight="700">mass</text>
<line x1="120.0" y1="288.0" x2="460.0" y2="288.0" stroke="#2b2722" stroke-width="2.6"/>
<line x1="120.0" y1="306.0" x2="460.0" y2="306.0" stroke="#2b2722" stroke-width="5.2"/>
<text x="472.0" y="292.0" font-size="10" text-anchor="start" fill="#A67C52" font-weight="400">thin string: high</text>
<text x="472.0" y="310.0" font-size="10" text-anchor="start" fill="#8a8078" font-weight="400">thick string: low</text>
<text x="120.0" y="332.0" font-size="10" text-anchor="start" fill="#8a8078" font-weight="400">At the same length, thicker means heavier, and heavier vibrates slower</text>
</svg>
