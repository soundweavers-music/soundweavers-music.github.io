<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="100%" role="img" aria-label="Consonance &amp; dissonance: simpler ratios blend more">
<rect width="760" height="400" fill="#f7f3ee"/>
<text x="28.0" y="40.0" font-size="19" text-anchor="start" fill="#2b2722" font-weight="700">Consonance &amp; dissonance: simpler ratios blend more</text>
<text x="28.0" y="62.0" font-size="12.5" text-anchor="start" fill="#8a8078" font-weight="400">Perfect consonances sound like one voice extended; dissonances need resolution</text>
<text x="28.0" y="120.0" font-size="12.5" text-anchor="start" fill="#2b2722" font-weight="700">Perfect consonance</text>
<text x="28.0" y="138.0" font-size="10" text-anchor="start" fill="#8a8078" font-weight="400">Unison, perfect 5th, octave</text>
<text x="28.0" y="154.0" font-size="9.5" text-anchor="start" fill="#A67C52" font-weight="400">1:1　3:2　2:1</text>
<rect x="400.0" y="108.0" width="300.0" height="14.0" rx="7" fill="#efe4d6" stroke="none" stroke-width="1.4"/>
<rect x="400.0" y="108.0" width="54.0" height="14.0" rx="7" fill="#c9a883" stroke="none" stroke-width="1.4"/>
<text x="28.0" y="182.0" font-size="12.5" text-anchor="start" fill="#2b2722" font-weight="700">Imperfect consonance</text>
<text x="28.0" y="200.0" font-size="10" text-anchor="start" fill="#8a8078" font-weight="400">Major/minor 3rds, major/minor 6ths</text>
<text x="28.0" y="216.0" font-size="9.5" text-anchor="start" fill="#A67C52" font-weight="400">5:4　6:5　5:3　8:5</text>
<rect x="400.0" y="170.0" width="300.0" height="14.0" rx="7" fill="#efe4d6" stroke="none" stroke-width="1.4"/>
<rect x="400.0" y="170.0" width="135.0" height="14.0" rx="7" fill="#c9a883" stroke="none" stroke-width="1.4"/>
<text x="28.0" y="244.0" font-size="12.5" text-anchor="start" fill="#2b2722" font-weight="700">Dissonance</text>
<text x="28.0" y="262.0" font-size="10" text-anchor="start" fill="#8a8078" font-weight="400">Major/minor 2nds, major/minor 7ths</text>
<text x="28.0" y="278.0" font-size="9.5" text-anchor="start" fill="#A67C52" font-weight="400">9:8　16:15　15:8　16:9</text>
<rect x="400.0" y="232.0" width="300.0" height="14.0" rx="7" fill="#efe4d6" stroke="none" stroke-width="1.4"/>
<rect x="400.0" y="232.0" width="246.0" height="14.0" rx="7" fill="#A67C52" stroke="none" stroke-width="1.4"/>
<text x="28.0" y="306.0" font-size="12.5" text-anchor="start" fill="#2b2722" font-weight="700">Most tense</text>
<text x="28.0" y="324.0" font-size="10" text-anchor="start" fill="#8a8078" font-weight="400">Tritone (aug. 4th / dim. 5th)</text>
<text x="28.0" y="340.0" font-size="9.5" text-anchor="start" fill="#A67C52" font-weight="400">45:32</text>
<rect x="400.0" y="294.0" width="300.0" height="14.0" rx="7" fill="#efe4d6" stroke="none" stroke-width="1.4"/>
<rect x="400.0" y="294.0" width="294.0" height="14.0" rx="7" fill="#A67C52" stroke="none" stroke-width="1.4"/>
<text x="400.0" y="106.0" font-size="10" text-anchor="start" fill="#8a8078" font-weight="400">Perceived &quot;roughness&quot;</text>
<text x="28.0" y="382.0" font-size="11" text-anchor="start" fill="#8a8078" font-weight="400">The perfect 4th is special: often dissonant in two voices, consonant in three or more.</text>
</svg>
