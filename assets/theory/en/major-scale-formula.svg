<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="100%" role="img" aria-label="Major scale formula: W–W–H–W–W–W–H">
<rect width="760" height="330" fill="#f7f3ee"/>
<text x="28.0" y="40.0" font-size="19" text-anchor="start" fill="#2b2722" font-weight="700">Major scale formula: W–W–H–W–W–W–H</text>
<text x="28.0" y="62.0" font-size="12.5" text-anchor="start" fill="#8a8078" font-weight="400">Seven intervals complete an octave; the two half steps are the major scale&#x27;s fingerprint</text>
<rect x="66.0" y="120.0" width="82.0" height="84.0" rx="2" fill="#fff" stroke="#d9d2c9" stroke-width="1.4"/>
<text x="108.0" y="192.0" font-size="13" text-anchor="middle" fill="#2b2722" font-weight="400">C</text>
<rect x="150.0" y="120.0" width="82.0" height="84.0" rx="2" fill="#fff" stroke="#d9d2c9" stroke-width="1.4"/>
<text x="192.0" y="192.0" font-size="13" text-anchor="middle" fill="#2b2722" font-weight="400">D</text>
<rect x="234.0" y="120.0" width="82.0" height="84.0" rx="2" fill="#fff" stroke="#d9d2c9" stroke-width="1.4"/>
<text x="276.0" y="192.0" font-size="13" text-anchor="middle" fill="#2b2722" font-weight="400">E</text>
<rect x="318.0" y="120.0" width="82.0" height="84.0" rx="2" fill="#fff" stroke="#d9d2c9" stroke-width="1.4"/>
<text x="360.0" y="192.0" font-size="13" text-anchor="middle" fill="#2b2722" font-weight="400">F</text>
<rect x="402.0" y="120.0" width="82.0" height="84.0" rx="2" fill="#fff" stroke="#d9d2c9" stroke-width="1.4"/>
<text x="444.0" y="192.0" font-size="13" text-anchor="middle" fill="#2b2722" font-weight="400">G</text>
<rect x="486.0" y="120.0" width="82.0" height="84.0" rx="2" fill="#fff" stroke="#d9d2c9" stroke-width="1.4"/>
<text x="528.0" y="192.0" font-size="13" text-anchor="middle" fill="#2b2722" font-weight="400">A</text>
<rect x="570.0" y="120.0" width="82.0" height="84.0" rx="2" fill="#fff" stroke="#d9d2c9" stroke-width="1.4"/>
<text x="612.0" y="192.0" font-size="13" text-anchor="middle" fill="#2b2722" font-weight="400">B</text>
<rect x="654.0" y="120.0" width="82.0" height="84.0" rx="2" fill="#fff" stroke="#d9d2c9" stroke-width="1.4"/>
<text x="696.0" y="192.0" font-size="13" text-anchor="middle" fill="#2b2722" font-weight="400">C</text>
<text x="108.0" y="104.0" font-size="12" text-anchor="middle" fill="#8a8078" font-weight="400">Whole</text>
<line x1="100.0" y1="114.0" x2="116.0" y2="114.0" stroke="#8a8078" stroke-width="1.4"/>
<text x="192.0" y="104.0" font-size="12" text-anchor="middle" fill="#8a8078" font-weight="400">Whole</text>
<line x1="184.0" y1="114.0" x2="200.0" y2="114.0" stroke="#8a8078" stroke-width="1.4"/>
<text x="276.0" y="104.0" font-size="12" text-anchor="middle" fill="#A67C52" font-weight="700">Half</text>
<line x1="268.0" y1="114.0" x2="284.0" y2="114.0" stroke="#A67C52" stroke-width="1.4"/>
<text x="360.0" y="104.0" font-size="12" text-anchor="middle" fill="#8a8078" font-weight="400">Whole</text>
<line x1="352.0" y1="114.0" x2="368.0" y2="114.0" stroke="#8a8078" stroke-width="1.4"/>
<text x="444.0" y="104.0" font-size="12" text-anchor="middle" fill="#8a8078" font-weight="400">Whole</text>
<line x1="436.0" y1="114.0" x2="452.0" y2="114.0" stroke="#8a8078" stroke-width="1.4"/>
<text x="528.0" y="104.0" font-size="12" text-anchor="middle" fill="#8a8078" font-weight="400">Whole</text>
<line x1="520.0" y1="114.0" x2="536.0" y2="114.0" stroke="#8a8078" stroke-width="1.4"/>
<text x="612.0" y="104.0" font-size="12" text-anchor="middle" fill="#A67C52" font-weight="700">Half</text>
<line x1="604.0" y1="114.0" x2="620.0" y2="114.0" stroke="#A67C52" stroke-width="1.4"/>
<text x="402.0" y="232.0" font-size="11.5" text-anchor="middle" fill="#A67C52" font-weight="400">Half steps fall between 3–4 and 7–8</text>
<text x="28.0" y="274.0" font-size="11.5" text-anchor="start" fill="#2b2722" font-weight="400">This formula also yields three major triads: C–E–G, F–A–C, G–B–D,</text>
<text x="28.0" y="294.0" font-size="11.5" text-anchor="start" fill="#2b2722" font-weight="400">the most common I, IV, V in pop songs.</text>
<text x="28.0" y="318.0" font-size="11" text-anchor="start" fill="#8a8078" font-weight="400">Starting on another note works the same; just add sharps or flats.</text>
</svg>
