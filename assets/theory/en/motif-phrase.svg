<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" width="100%" role="img" aria-label="How a motif becomes a period">
<rect width="760" height="350" fill="#f7f3ee"/>
<text x="28.0" y="40.0" font-size="19" text-anchor="start" fill="#2b2722" font-weight="700">How a motif becomes a period</text>
<text x="28.0" y="62.0" font-size="12.5" text-anchor="start" fill="#8a8078" font-weight="400">Same material repeated, sequenced, varied: eight bars make a complete sentence</text>
<rect x="90.0" y="130.0" width="75.0" height="44.0" rx="4" fill="#fff" stroke="#d9d2c9" stroke-width="1.1"/>
<text x="127.5" y="158.0" font-size="9" text-anchor="middle" fill="#8a8078" font-weight="400">1</text>
<rect x="168.0" y="130.0" width="75.0" height="44.0" rx="4" fill="#fff" stroke="#d9d2c9" stroke-width="1.1"/>
<text x="205.5" y="158.0" font-size="9" text-anchor="middle" fill="#8a8078" font-weight="400">2</text>
<rect x="246.0" y="130.0" width="75.0" height="44.0" rx="4" fill="#fff" stroke="#d9d2c9" stroke-width="1.1"/>
<text x="283.5" y="158.0" font-size="9" text-anchor="middle" fill="#8a8078" font-weight="400">3</text>
<rect x="324.0" y="130.0" width="75.0" height="44.0" rx="4" fill="#fff" stroke="#d9d2c9" stroke-width="1.1"/>
<text x="361.5" y="158.0" font-size="9" text-anchor="middle" fill="#8a8078" font-weight="400">4</text>
<rect x="402.0" y="130.0" width="75.0" height="44.0" rx="4" fill="#fff" stroke="#d9d2c9" stroke-width="1.1"/>
<text x="439.5" y="158.0" font-size="9" text-anchor="middle" fill="#8a8078" font-weight="400">5</text>
<rect x="480.0" y="130.0" width="75.0" height="44.0" rx="4" fill="#fff" stroke="#d9d2c9" stroke-width="1.1"/>
<text x="517.5" y="158.0" font-size="9" text-anchor="middle" fill="#8a8078" font-weight="400">6</text>
<rect x="558.0" y="130.0" width="75.0" height="44.0" rx="4" fill="#fff" stroke="#d9d2c9" stroke-width="1.1"/>
<text x="595.5" y="158.0" font-size="9" text-anchor="middle" fill="#8a8078" font-weight="400">7</text>
<rect x="636.0" y="130.0" width="75.0" height="44.0" rx="4" fill="#fff" stroke="#d9d2c9" stroke-width="1.1"/>
<text x="673.5" y="158.0" font-size="9" text-anchor="middle" fill="#8a8078" font-weight="400">8</text>
<rect x="90.0" y="100.0" width="75.0" height="24.0" rx="4" fill="#fff" stroke="#d9d2c9" stroke-width="1.2"/>
<text x="127.5" y="116.0" font-size="9.5" text-anchor="middle" fill="#2b2722" font-weight="400">a</text>
<rect x="168.0" y="100.0" width="75.0" height="24.0" rx="4" fill="#fff" stroke="#d9d2c9" stroke-width="1.2"/>
<text x="205.5" y="116.0" font-size="9.5" text-anchor="middle" fill="#2b2722" font-weight="400">a'</text>
<rect x="246.0" y="100.0" width="75.0" height="24.0" rx="4" fill="#fff" stroke="#d9d2c9" stroke-width="1.2"/>
<text x="283.5" y="116.0" font-size="9.5" text-anchor="middle" fill="#2b2722" font-weight="400">b</text>
<rect x="324.0" y="100.0" width="75.0" height="24.0" rx="4" fill="#f2e0cc" stroke="#A67C52" stroke-width="1.2"/>
<text x="361.5" y="116.0" font-size="9.5" text-anchor="middle" fill="#A67C52" font-weight="400">→V</text>
<rect x="402.0" y="100.0" width="75.0" height="24.0" rx="4" fill="#fff" stroke="#d9d2c9" stroke-width="1.2"/>
<text x="439.5" y="116.0" font-size="9.5" text-anchor="middle" fill="#2b2722" font-weight="400">a</text>
<rect x="480.0" y="100.0" width="75.0" height="24.0" rx="4" fill="#fff" stroke="#d9d2c9" stroke-width="1.2"/>
<text x="517.5" y="116.0" font-size="9.5" text-anchor="middle" fill="#2b2722" font-weight="400">a'</text>
<rect x="558.0" y="100.0" width="75.0" height="24.0" rx="4" fill="#fff" stroke="#d9d2c9" stroke-width="1.2"/>
<text x="595.5" y="116.0" font-size="9.5" text-anchor="middle" fill="#2b2722" font-weight="400">b'</text>
<rect x="636.0" y="100.0" width="75.0" height="24.0" rx="4" fill="#f2e0cc" stroke="#A67C52" stroke-width="1.2"/>
<text x="673.5" y="116.0" font-size="9.5" text-anchor="middle" fill="#A67C52" font-weight="400">→I</text>
<line x1="90.0" y1="84.0" x2="402.0" y2="84.0" stroke="#A67C52" stroke-width="1.6"/>
<text x="246.0" y="74.0" font-size="10.5" text-anchor="middle" fill="#A67C52" font-weight="700">Antecedent (question)</text>
<line x1="402.0" y1="84.0" x2="714.0" y2="84.0" stroke="#6B8FBF" stroke-width="1.6"/>
<text x="558.0" y="74.0" font-size="10.5" text-anchor="middle" fill="#6B8FBF" font-weight="700">Consequent (answer)</text>
<line x1="90.0" y1="196.0" x2="714.0" y2="196.0" stroke="#8a8078" stroke-width="1.4"/>
<text x="402.0" y="216.0" font-size="11" text-anchor="middle" fill="#8a8078" font-weight="400">8 bars = one period: two phrases, question and answer</text>
<text x="28.0" y="260.0" font-size="11.5" text-anchor="start" fill="#2b2722" font-weight="400">Motif (2–5 notes) → phrase (4 bars) → period (8 bars) → section.</text>
<text x="28.0" y="282.0" font-size="11" text-anchor="start" fill="#8a8078" font-weight="400">Top row a, a&#x27;, b: repetitions and sequences of the same motif; arrows mark phrase ends.</text>
<text x="28.0" y="310.0" font-size="11" text-anchor="start" fill="#8a8078" font-weight="400">Antecedent ends on V (half cadence), consequent returns to I (authentic cadence)—the question and answer.</text>
</svg>
