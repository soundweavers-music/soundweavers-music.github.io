<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="100%" role="img" aria-label="Three functions, one cycle">
<rect width="760" height="340" fill="#f7f3ee"/>
<text x="28.0" y="40.0" font-size="19" text-anchor="start" fill="#2b2722" font-weight="700">Three functions, one cycle</text>
<text x="28.0" y="62.0" font-size="12.5" text-anchor="start" fill="#8a8078" font-weight="400">The seven diatonic chords have only three jobs: stay home, leave, return</text>
<rect x="40.0" y="104.0" width="200.0" height="96.0" rx="10" fill="#fff" stroke="#d9d2c9" stroke-width="1.4"/>
<text x="140.0" y="132.0" font-size="12.5" text-anchor="middle" fill="#A67C52" font-weight="700">T  Tonic</text>
<text x="140.0" y="158.0" font-size="11" text-anchor="middle" fill="#2b2722" font-weight="400">I・vi・iii</text>
<text x="140.0" y="182.0" font-size="9.5" text-anchor="middle" fill="#8a8078" font-weight="400">Stay home, stable</text>
<rect x="280.0" y="104.0" width="200.0" height="96.0" rx="10" fill="#fff" stroke="#d9d2c9" stroke-width="1.4"/>
<text x="380.0" y="132.0" font-size="12.5" text-anchor="middle" fill="#2b2722" font-weight="700">S  Subdominant</text>
<text x="380.0" y="158.0" font-size="11" text-anchor="middle" fill="#2b2722" font-weight="400">IV・ii</text>
<text x="380.0" y="182.0" font-size="9.5" text-anchor="middle" fill="#8a8078" font-weight="400">Leave home, prepare</text>
<rect x="520.0" y="104.0" width="200.0" height="96.0" rx="10" fill="#fff" stroke="#d9d2c9" stroke-width="1.4"/>
<text x="620.0" y="132.0" font-size="12.5" text-anchor="middle" fill="#8a8078" font-weight="700">D  Dominant</text>
<text x="620.0" y="158.0" font-size="11" text-anchor="middle" fill="#2b2722" font-weight="400">V・vii°</text>
<text x="620.0" y="182.0" font-size="9.5" text-anchor="middle" fill="#8a8078" font-weight="400">Create tension, want to return</text>
<text x="260.0" y="156.0" font-size="16" text-anchor="middle" fill="#A67C52" font-weight="700">→</text>
<text x="500.0" y="156.0" font-size="16" text-anchor="middle" fill="#A67C52" font-weight="700">→</text>
<path d="M 620 206 Q 380 268 140 206" fill="none" stroke="#A67C52" stroke-width="1.4"/>
<text x="380.0" y="250.0" font-size="10.5" text-anchor="middle" fill="#A67C52" font-weight="400">D → T: return home</text>
<text x="28.0" y="300.0" font-size="11.5" text-anchor="start" fill="#2b2722" font-weight="400">The common path is T → S → D → T; it can be shortened to T → D → T.</text>
<text x="28.0" y="324.0" font-size="11" text-anchor="start" fill="#8a8078" font-weight="400">Going backwards (D → S) weakens the cadence; pop songs use it for a &quot;backward&quot; feel.</text>
</svg>
