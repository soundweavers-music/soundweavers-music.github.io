<line x1="91.0" y1="90.0" x2="91.0" y2="96.0" stroke="#A67C52" stroke-width="1"/>
<text x="91.0" y="82.0" font-size="10" text-anchor="middle" fill="#A67C52" font-weight="400">C♯ / D♭, one key</text>
<text x="275.5" y="82.0" font-size="10" text-anchor="middle" fill="#A67C52" font-weight="400">A4＝440 Hz</text>
<text x="70.5" y="214.0" font-size="9.5" text-anchor="middle" fill="#A67C52" font-weight="400">middle C</text>
<text x="28.0" y="240.0" font-size="12" text-anchor="start" fill="#2b2722" font-weight="400">Scientific pitch = note name + octave number. C4 is middle C, so the A above it is A4</text>
<text x="28.0" y="264.0" font-size="11.5" text-anchor="start" fill="#8a8078" font-weight="400">One black key, two names: up from C it is C♯, down from D it is D♭—</text>
<text x="28.0" y="286.0" font-size="11.5" text-anchor="start" fill="#8a8078" font-weight="400">The sound is identical; which one you write depends on the key</text>
<text x="28.0" y="312.0" font-size="11.5" text-anchor="start" fill="#8a8078" font-weight="400">Frequency: C4 261.63 Hz · A4 440 Hz · C5 523.25 Hz (every octave doubles it)</text>
