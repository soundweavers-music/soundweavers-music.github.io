<text x="30.0" y="276.0" font-size="11.5" text-anchor="start" fill="#2b2722" font-weight="400">Scientific pitch = note name + octave number. C4 is middle C; the A above it is A4.</text>
<text x="30.0" y="298.0" font-size="11" text-anchor="start" fill="#8a8078" font-weight="#2b2722">One black key, two names: up from C is C♯, down from D is D♭ — same sound, different spelling.</text>
<text x="30.0" y="320.0" font-size="11" text-anchor="start" fill="#8a8078" font-weight="#2b2722">Frequency: C4 261.63 Hz  A4 440 Hz  C5 523.25 Hz (each octave up doubles)</text>
