<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="100%" role="img" aria-label="Five qualities: major, minor, perfect, aug, dim">
<rect width="760" height="380" fill="#f7f3ee"/>
<text x="28.0" y="40.0" font-size="19" text-anchor="start" fill="#2b2722" font-weight="700">Five qualities: major, minor, perfect, aug, dim</text>
<text x="28.0" y="62.0" font-size="12.5" text-anchor="start" fill="#8a8078" font-weight="400">Perfect intervals have one form; others come in major/minor; a semitone out or in gives aug/dim</text>
<line x1="80.0" y1="150.0" x2="700.0" y2="150.0" stroke="#2b2722" stroke-width="1.4"/>
<line x1="80.0" y1="142.0" x2="80.0" y2="158.0" stroke="#2b2722" stroke-width="1.2"/>
<text x="80.0" y="176.0" font-size="9.5" text-anchor="middle" fill="#8a8078" font-weight="400">0</text>
<text x="80.0" y="132.0" font-size="10.5" text-anchor="middle" fill="#A67C52" font-weight="700">P1</text>
<line x1="131.7" y1="142.0" x2="131.7" y2="158.0" stroke="#2b2722" stroke-width="1.2"/>
<text x="131.7" y="176.0" font-size="9.5" text-anchor="middle" fill="#8a8078" font-weight="400">1</text>
<text x="131.7" y="132.0" font-size="10.5" text-anchor="middle" fill="#2b2722" font-weight="400">m2</text>
<line x1="183.3" y1="142.0" x2="183.3" y2="158.0" stroke="#2b2722" stroke-width="1.2"/>
<text x="183.3" y="176.0" font-size="9.5" text-anchor="middle" fill="#8a8078" font-weight="400">2</text>
<text x="183.3" y="132.0" font-size="10.5" text-anchor="middle" fill="#2b2722" font-weight="400">M2</text>
<line x1="235.0" y1="142.0" x2="235.0" y2="158.0" stroke="#2b2722" stroke-width="1.2"/>
<text x="235.0" y="176.0" font-size="9.5" text-anchor="middle" fill="#8a8078" font-weight="400">3</text>
<text x="235.0" y="132.0" font-size="10.5" text-anchor="middle" fill="#2b2722" font-weight="400">m3</text>
<line x1="286.7" y1="142.0" x2="286.7" y2="158.0" stroke="#2b2722" stroke-width="1.2"/>
<text x="286.7" y="176.0" font-size="9.5" text-anchor="middle" fill="#8a8078" font-weight="400">4</text>
<text x="286.7" y="132.0" font-size="10.5" text-anchor="middle" fill="#2b2722" font-weight="400">M3</text>
<line x1="338.3" y1="142.0" x2="338.3" y2="158.0" stroke="#2b2722" stroke-width="1.2"/>
<text x="338.3" y="176.0" font-size="9.5" text-anchor="middle" fill="#8a8078" font-weight="400">5</text>
<text x="338.3" y="132.0" font-size="10.5" text-anchor="middle" fill="#A67C52" font-weight="700">P4</text>
<line x1="390.0" y1="142.0" x2="390.0" y2="158.0" stroke="#2b2722" stroke-width="1.2"/>
<text x="390.0" y="176.0" font-size="9.5" text-anchor="middle" fill="#8a8078" font-weight="400">6</text>
<text x="390.0" y="132.0" font-size="10.5" text-anchor="middle" fill="#2b2722" font-weight="400">Tritone</text>
<line x1="441.7" y1="142.0" x2="441.7" y2="158.0" stroke="#2b2722" stroke-width="1.2"/>
<text x="441.7" y="176.0" font-size="9.5" text-anchor="middle" fill="#8a8078" font-weight="400">7</text>
<text x="441.7" y="132.0" font-size="10.5" text-anchor="middle" fill="#A67C52" font-weight="700">P5</text>
<line x1="493.3" y1="142.0" x2="493.3" y2="158.0" stroke="#2b2722" stroke-width="1.2"/>
<text x="493.3" y="176.0" font-size="9.5" text-anchor="middle" fill="#8a8078" font-weight="400">8</text>
<text x="493.3" y="132.0" font-size="10.5" text-anchor="middle" fill="#2b2722" font-weight="400">m6</text>
<line x1="545.0" y1="142.0" x2="545.0" y2="158.0" stroke="#2b2722" stroke-width="1.2"/>
<text x="545.0" y="176.0" font-size="9.5" text-anchor="middle" fill="#8a8078" font-weight="400">9</text>
<text x="545.0" y="132.0" font-size="10.5" text-anchor="middle" fill="#2b2722" font-weight="400">M6</text>
<line x1="596.7" y1="142.0" x2="596.7" y2="158.0" stroke="#2b2722" stroke-width="1.2"/>
<text x="596.7" y="176.0" font-size="9.5" text-anchor="middle" fill="#8a8078" font-weight="400">10</text>
<text x="596.7" y="132.0" font-size="10.5" text-anchor="middle" fill="#2b2722" font-weight="400">m7</text>
<line x1="648.3" y1="142.0" x2="648.3" y2="158.0" stroke="#2b2722" stroke-width="1.2"/>
<text x="648.3" y="176.0" font-size="9.5" text-anchor="middle" fill="#8a8078" font-weight="400">11</text>
<text x="648.3" y="132.0" font-size="10.5" text-anchor="middle" fill="#2b2722" font-weight="400">M7</text>
<line x1="700.0" y1="142.0" x2="700.0" y2="158.0" stroke="#2b2722" stroke-width="1.2"/>
<text x="700.0" y="176.0" font-size="9.5" text-anchor="middle" fill="#8a8078" font-weight="400">12</text>
<text x="700.0" y="132.0" font-size="10.5" text-anchor="middle" fill="#A67C52" font-weight="700">P8</text>
<text x="28.0" y="224.0" font-size="11.5" text-anchor="start" fill="#2b2722" font-weight="700">Major +1 semitone</text>
<text x="228.0" y="224.0" font-size="11.5" text-anchor="start" fill="#A67C52" font-weight="400">→</text>
<text x="250.0" y="224.0" font-size="11.5" text-anchor="start" fill="#2b2722" font-weight="400">Augmented</text>
<text x="28.0" y="258.0" font-size="11.5" text-anchor="start" fill="#2b2722" font-weight="700">Major −1 semitone</text>
<text x="228.0" y="258.0" font-size="11.5" text-anchor="start" fill="#A67C52" font-weight="400">→</text>
<text x="250.0" y="258.0" font-size="11.5" text-anchor="start" fill="#2b2722" font-weight="400">Minor</text>
<text x="28.0" y="292.0" font-size="11.5" text-anchor="start" fill="#2b2722" font-weight="700">Minor −1 semitone</text>
<text x="228.0" y="292.0" font-size="11.5" text-anchor="start" fill="#A67C52" font-weight="400">→</text>
<text x="250.0" y="292.0" font-size="11.5" text-anchor="start" fill="#2b2722" font-weight="400">Diminished</text>
<text x="28.0" y="326.0" font-size="11.5" text-anchor="start" fill="#2b2722" font-weight="700">Perfect ±1 semitone</text>
<text x="228.0" y="326.0" font-size="11.5" text-anchor="start" fill="#A67C52" font-weight="400">→</text>
<text x="250.0" y="326.0" font-size="11.5" text-anchor="start" fill="#2b2722" font-weight="400">Aug/dim (no major/minor)</text>
<text x="28.0" y="366.0" font-size="11" text-anchor="start" fill="#8a8078" font-weight="400">Shrink a minor 3rd by a semitone to get a diminished 3rd; widen a perfect 5th by a semitone to get an augmented 5th.</text>
</svg>
