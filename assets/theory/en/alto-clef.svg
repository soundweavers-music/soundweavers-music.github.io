<text x="414.0" y="158.0" font-size="10.5" text-anchor="start" fill="#A67C52" font-weight="700">Line 1 = middle C</text>
<text x="28.0" y="186.0" font-size="12" text-anchor="start" fill="#2b2722" font-weight="700">Alto clef</text>
<text x="28.0" y="232.0" font-size="9.5" text-anchor="start" fill="#8a8078" font-weight="400">The viola&#x27;s standard clef</text>
<line x1="260.0" y1="180.0" x2="560.0" y2="180.0" stroke="#2b2722" stroke-width="1.1"/>
<line x1="260.0" y1="193.0" x2="560.0" y2="193.0" stroke="#2b2722" stroke-width="1.1"/>
