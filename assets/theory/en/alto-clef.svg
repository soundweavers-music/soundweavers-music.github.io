<circle cx="300.0" cy="206.0" r="13.0" fill="none" stroke="#A67C52" stroke-width="2"/>
<text x="300.0" y="211.0" font-size="12" text-anchor="middle" fill="#A67C52" font-weight="700">C</text>
<circle cx="400.0" cy="206.0" r="4.5" fill="#A67C52" stroke="none" stroke-width="1.4"/>
<text x="414.0" y="210.0" font-size="10.5" text-anchor="start" fill="#A67C52" font-weight="700">Line 3 = middle C</text>
<text x="28.0" y="264.0" font-size="12" text-anchor="start" fill="#2b2722" font-weight="700">Tenor clef</text>
<text x="28.0" y="310.0" font-size="9.5" text-anchor="start" fill="#8a8078" font-weight="400">High range of the cello and bassoon</text>
<line x1="260.0" y1="258.0" x2="560.0" y2="258.0" stroke="#2b2722" stroke-width="1.1"/>
<line x1="260.0" y1="271.0" x2="560.0" y2="271.0" stroke="#2b2722" stroke-width="1.1"/>
<line x1="260.0" y1="284.0" x2="560.0" y2="284.0" stroke="#2b2722" stroke-width="1.1"/>
