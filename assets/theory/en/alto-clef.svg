<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="100%" role="img" aria-label="C 譜號：記號放在哪一條線，中央 C 就在那裡">
<rect width="760" height="360" fill="#f7f3ee"/>
<text x="28.0" y="40.0" font-size="19" text-anchor="start" fill="#2b2722" font-weight="700">The C clef: wherever it sits, that line is middle C</text>
<text x="28.0" y="62.0" font-size="12.5" text-anchor="start" fill="#8a8078" font-weight="400">Same staff: move the C clef up a line and the whole ruler shifts too</text>
<text x="28.0" y="108.0" font-size="12" text-anchor="start" fill="#2b2722" font-weight="700">Soprano clef</text>
<text x="28.0" y="154.0" font-size="9.5" text-anchor="start" fill="#8a8078" font-weight="400">Rare: some method books and early music</text>
<line x1="260.0" y1="102.0" x2="560.0" y2="102.0" stroke="#2b2722" stroke-width="1.1"/>
<line x1="260.0" y1="115.0" x2="560.0" y2="115.0" stroke="#2b2722" stroke-width="1.1"/>
<line x1="260.0" y1="128.0" x2="560.0" y2="128.0" stroke="#2b2722" stroke-width="1.1"/>
