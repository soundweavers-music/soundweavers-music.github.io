<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="100%" role="img" aria-label="Secondary dominant: boss on foreign turf">
<style>line,path,polyline{stroke-linecap:round;stroke-linejoin:round}text{font-family:'Source Han Serif TW',serif}</style>
<rect width="760" height="330" fill="#f7f3ee"/>
<rect x="14" y="76" width="732" height="238" rx="14" fill="#fff" stroke="#d9d2c9" stroke-width="1"/>
<text x="30.0" y="40.0" font-size="19" text-anchor="start" fill="#2b2722" font-weight="700">Secondary dominant: boss on foreign turf</text>
<text x="30.0" y="62.0" font-size="12.5" text-anchor="start" fill="#8a8078" font-weight="400">Any chord can take its V in front — tension jumps</text>
<rect x="24.0" y="98.0" width="712.0" height="34.0" rx="8" fill="#fff" stroke="none" stroke-width="1.4"/>
<text x="40.0" y="118.0" font-size="12" text-anchor="start" fill="#A67C52" font-weight="700">V/V</text>
<text x="130.0" y="118.0" font-size="11" text-anchor="start" fill="#2b2722" font-weight="400">D7（D–F♯–A–C）</text>
<line x1="336.0" y1="114.0" x2="379.6" y2="114.0" stroke="#A67C52" stroke-width="1.6"/><polygon points="386.0,114.0 378.7,117.3 378.7,110.7" fill="#A67C52"/>
<text x="400.0" y="118.0" font-size="12" text-anchor="start" fill="#2b2722" font-weight="700">G</text>
<text x="470.0" y="118.0" font-size="10" text-anchor="start" fill="#8a8078" font-weight="400">Treat G as temporary tonic</text>
<text x="40.0" y="168.0" font-size="12" text-anchor="start" fill="#A67C52" font-weight="700">V/vi</text>
<text x="130.0" y="168.0" font-size="11" text-anchor="start" fill="#2b2722" font-weight="400">E7（E–G♯–B–D）</text>
<line x1="336.0" y1="164.0" x2="379.6" y2="164.0" stroke="#A67C52" stroke-width="1.6"/><polygon points="386.0,164.0 378.7,167.3 378.7,160.7" fill="#A67C52"/>
<text x="400.0" y="168.0" font-size="12" text-anchor="start" fill="#2b2722" font-weight="700">Am</text>
<text x="470.0" y="168.0" font-size="10" text-anchor="start" fill="#8a8078" font-weight="400">Treat Am as temporary tonic</text>
<rect x="24.0" y="198.0" width="712.0" height="34.0" rx="8" fill="#fff" stroke="none" stroke-width="1.4"/>
<text x="40.0" y="218.0" font-size="12" text-anchor="start" fill="#A67C52" font-weight="700">V/ii</text>
<text x="130.0" y="218.0" font-size="11" text-anchor="start" fill="#2b2722" font-weight="400">A7（A–C♯–E–G）</text>
<line x1="336.0" y1="214.0" x2="379.6" y2="214.0" stroke="#A67C52" stroke-width="1.6"/><polygon points="386.0,214.0 378.7,217.3 378.7,210.7" fill="#A67C52"/>
<text x="400.0" y="218.0" font-size="12" text-anchor="start" fill="#2b2722" font-weight="700">Dm</text>
<text x="470.0" y="218.0" font-size="10" text-anchor="start" fill="#8a8078" font-weight="400">Treat Dm as temporary tonic</text>
<text x="40.0" y="268.0" font-size="12" text-anchor="start" fill="#A67C52" font-weight="700">V/IV</text>
<text x="130.0" y="268.0" font-size="11" text-anchor="start" fill="#2b2722" font-weight="400">C7（C–E–G–B♭）</text>
<line x1="336.0" y1="264.0" x2="379.6" y2="264.0" stroke="#A67C52" stroke-width="1.6"/><polygon points="386.0,264.0 378.7,267.3 378.7,260.7" fill="#A67C52"/>
<text x="400.0" y="268.0" font-size="12" text-anchor="start" fill="#2b2722" font-weight="700">F</text>
<text x="470.0" y="268.0" font-size="10" text-anchor="start" fill="#8a8078" font-weight="400">Treat F as temporary tonic</text>
<text x="28.0" y="316.0" font-size="11" text-anchor="start" fill="#8a8078" font-weight="400">Secondary dominants bring out-of-key notes (F♯ in D7, G♯ in E7) — that&#x27;s the flash.</text>
</svg>
