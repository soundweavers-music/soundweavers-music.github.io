<line x1="40.0" y1="336.0" x2="460.0" y2="336.0" stroke="#d9d2c9" stroke-width="1"/>
<text x="500.0" y="118.0" font-size="13" text-anchor="start" fill="#2b2722" font-weight="700">One note, four ways to write it</text>
<text x="500.0" y="140.0" font-size="11.5" text-anchor="start" fill="#8a8078" font-weight="#2b2722">Taiwanese books pair the note name</text>
<text x="500.0" y="158.0" font-size="11.5" text-anchor="start" fill="#8a8078" font-weight="#2b2722">with solfège; pop charts use numbers</text>
<text x="500.0" y="186.0" font-size="11.5" text-anchor="start" fill="#8a8078" font-weight="#2b2722">Solfège names are relative: change key</text>
<text x="500.0" y="204.0" font-size="11.5" text-anchor="start" fill="#8a8078" font-weight="#2b2722">and the same syllable hits a different note</text>
