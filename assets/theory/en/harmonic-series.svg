<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="100%" role="img" aria-label="The harmonic series: the physics of consonance">
<rect width="760" height="400" fill="#f7f3ee"/>
<text x="28.0" y="40.0" font-size="19" text-anchor="start" fill="#2b2722" font-weight="700">The harmonic series: the physics of consonance</text>
<text x="28.0" y="62.0" font-size="12.5" text-anchor="start" fill="#8a8078" font-weight="400">The nth harmonic is n times the fundamental</text>
<text x="28.0" y="92.0" font-size="12" text-anchor="start" fill="#2b2722" font-weight="400">A string vibrates as a whole and also in 2 or 3 parts at once</text>
<text x="28.0" y="126.0" font-size="11" text-anchor="start" fill="#8a8078" font-weight="400">whole</text>
<line x1="210.0" y1="122.0" x2="690.0" y2="122.0" stroke="#2b2722" stroke-width="1.2"/>
<text x="28.0" y="154.0" font-size="11" text-anchor="start" fill="#8a8078" font-weight="400">2 parts</text>
<line x1="210.0" y1="150.0" x2="690.0" y2="150.0" stroke="#2b2722" stroke-width="1.2"/>
<circle cx="450.0" cy="150.0" r="3.4" fill="#f7f3ee" stroke="#A67C52" stroke-width="1.4"/>
<text x="28.0" y="182.0" font-size="11" text-anchor="start" fill="#8a8078" font-weight="400">3 parts</text>
<line x1="210.0" y1="178.0" x2="690.0" y2="178.0" stroke="#2b2722" stroke-width="1.2"/>
<circle cx="370.0" cy="178.0" r="3.4" fill="#f7f3ee" stroke="#A67C52" stroke-width="1.4"/>
<circle cx="530.0" cy="178.0" r="3.4" fill="#f7f3ee" stroke="#A67C52" stroke-width="1.4"/>
<text x="400.0" y="196.0" font-size="9.5" text-anchor="start" fill="#8a8078" font-weight="400">Small circle = node, where the string does not move</text>
<text x="210.0" y="210.0" font-size="10.5" text-anchor="start" fill="#8a8078" font-weight="400">harmonic</text>
<text x="286.0" y="210.0" font-size="10.5" text-anchor="start" fill="#8a8078" font-weight="400">frequency (100 Hz fundamental)</text>
<text x="452.0" y="210.0" font-size="10.5" text-anchor="start" fill="#8a8078" font-weight="400">ratio</text>
<text x="540.0" y="210.0" font-size="10.5" text-anchor="start" fill="#8a8078" font-weight="400">interval</text>
<text x="210.0" y="236.0" font-size="11.5" text-anchor="start" fill="#2b2722" font-weight="700">1</text>
<text x="286.0" y="236.0" font-size="11.5" text-anchor="start" fill="#2b2722" font-weight="400">100 Hz</text>
<text x="452.0" y="236.0" font-size="11.5" text-anchor="start" fill="#8a8078" font-weight="400">—</text>
<text x="540.0" y="236.0" font-size="11.5" text-anchor="start" fill="#2b2722" font-weight="400">fundamental</text>
<text x="210.0" y="259.0" font-size="11.5" text-anchor="start" fill="#2b2722" font-weight="700">2</text>
<text x="286.0" y="259.0" font-size="11.5" text-anchor="start" fill="#2b2722" font-weight="400">200 Hz</text>
<text x="452.0" y="259.0" font-size="11.5" text-anchor="start" fill="#A67C52" font-weight="400">2:1</text>
<text x="540.0" y="259.0" font-size="11.5" text-anchor="start" fill="#2b2722" font-weight="400">perfect octave</text>
<text x="210.0" y="282.0" font-size="11.5" text-anchor="start" fill="#2b2722" font-weight="700">3</text>
<text x="286.0" y="282.0" font-size="11.5" text-anchor="start" fill="#2b2722" font-weight="400">300 Hz</text>
<text x="452.0" y="282.0" font-size="11.5" text-anchor="start" fill="#A67C52" font-weight="400">3:2</text>
<text x="540.0" y="282.0" font-size="11.5" text-anchor="start" fill="#2b2722" font-weight="400">perfect fifth</text>
<text x="210.0" y="305.0" font-size="11.5" text-anchor="start" fill="#2b2722" font-weight="700">4</text>
<text x="286.0" y="305.0" font-size="11.5" text-anchor="start" fill="#2b2722" font-weight="400">400 Hz</text>
<text x="452.0" y="305.0" font-size="11.5" text-anchor="start" fill="#A67C52" font-weight="400">4:3</text>
<text x="540.0" y="305.0" font-size="11.5" text-anchor="start" fill="#2b2722" font-weight="400">perfect fourth</text>
<text x="210.0" y="328.0" font-size="11.5" text-anchor="start" fill="#2b2722" font-weight="700">5</text>
<text x="286.0" y="328.0" font-size="11.5" text-anchor="start" fill="#2b2722" font-weight="400">500 Hz</text>
<text x="452.0" y="328.0" font-size="11.5" text-anchor="start" fill="#A67C52" font-weight="400">5:4</text>
<text x="540.0" y="328.0" font-size="11.5" text-anchor="start" fill="#2b2722" font-weight="400">major third</text>
<text x="210.0" y="351.0" font-size="11.5" text-anchor="start" fill="#2b2722" font-weight="700">6</text>
<text x="286.0" y="351.0" font-size="11.5" text-anchor="start" fill="#2b2722" font-weight="400">600 Hz</text>
<text x="452.0" y="351.0" font-size="11.5" text-anchor="start" fill="#A67C52" font-weight="400">6:5</text>
<text x="540.0" y="351.0" font-size="11.5" text-anchor="start" fill="#2b2722" font-weight="400">minor third</text>
<text x="28.0" y="376.0" font-size="11" text-anchor="start" fill="#8a8078" font-weight="400">Simple ratios line up and sound consonant; equal temperament squeezes the 3:2 fifth to 700 cents to allow free key changes</text>
</svg>
