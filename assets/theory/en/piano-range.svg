<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 260" width="100%" role="img" aria-label="鋼琴的音域">
<rect width="760" height="260" fill="#f7f3ee"/>
<text x="28.0" y="40.0" font-size="19" text-anchor="start" fill="#2b2722" font-weight="700">The piano&#x27;s range</text>
<text x="28.0" y="62.0" font-size="12.5" text-anchor="start" fill="#8a8078" font-weight="400">Within an octave the frequency doubles—which is why it sounds like &quot;the same note&quot;</text>
<rect x="90.0" y="92.0" width="610.0" height="52.0" rx="4" fill="#f7f3ee" stroke="#d9d2c9" stroke-width="1.4"/>
<line x1="90.0" y1="92.0" x2="90.0" y2="144.0" stroke="#8a8078" stroke-width="1"/>
<circle cx="90.0" cy="152.0" r="3.2" fill="#A67C52" stroke="none" stroke-width="1.4"/>
<text x="90.0" y="170.0" font-size="11.5" text-anchor="middle" fill="#2b2722" font-weight="400">A0</text>
<text x="90.0" y="186.0" font-size="10.5" text-anchor="middle" fill="#8a8078" font-weight="400">28 Hz</text>
<line x1="195.2" y1="92.0" x2="195.2" y2="144.0" stroke="#8a8078" stroke-width="1"/>
<circle cx="195.2" cy="152.0" r="3.2" fill="#A67C52" stroke="none" stroke-width="1.4"/>
<text x="195.2" y="170.0" font-size="11.5" text-anchor="middle" fill="#2b2722" font-weight="400">C2</text>
<text x="195.2" y="186.0" font-size="10.5" text-anchor="middle" fill="#8a8078" font-weight="400">65 Hz</text>
<line x1="363.4" y1="92.0" x2="363.4" y2="144.0" stroke="#8a8078" stroke-width="1"/>
<circle cx="363.4" cy="152.0" r="3.2" fill="#A67C52" stroke="none" stroke-width="1.4"/>
<text x="363.4" y="170.0" font-size="11.5" text-anchor="middle" fill="#2b2722" font-weight="400">C4</text>
<text x="363.4" y="186.0" font-size="10.5" text-anchor="middle" fill="#8a8078" font-weight="400">262 Hz</text>
<line x1="531.7" y1="92.0" x2="531.7" y2="144.0" stroke="#8a8078" stroke-width="1"/>
<circle cx="531.7" cy="152.0" r="3.2" fill="#A67C52" stroke="none" stroke-width="1.4"/>
<text x="531.7" y="170.0" font-size="11.5" text-anchor="middle" fill="#2b2722" font-weight="400">C6</text>
<text x="531.7" y="186.0" font-size="10.5" text-anchor="middle" fill="#8a8078" font-weight="400">1046 Hz</text>
<line x1="700.0" y1="92.0" x2="700.0" y2="144.0" stroke="#8a8078" stroke-width="1"/>
<circle cx="700.0" cy="152.0" r="3.2" fill="#A67C52" stroke="none" stroke-width="1.4"/>
<text x="700.0" y="170.0" font-size="11.5" text-anchor="middle" fill="#2b2722" font-weight="400">C8</text>
<text x="700.0" y="186.0" font-size="10.5" text-anchor="middle" fill="#8a8078" font-weight="400">4186 Hz</text>
<text x="28.0" y="112.0" font-size="14" text-anchor="start" fill="#2b2722" font-weight="700">low</text>
<text x="28.0" y="130.0" font-size="12" text-anchor="start" fill="#A67C52" font-weight="400">27.5 Hz</text>
<text x="732.0" y="112.0" font-size="14" text-anchor="end" fill="#2b2722" font-weight="700">high</text>
<text x="732.0" y="130.0" font-size="12" text-anchor="end" fill="#A67C52" font-weight="400">4186 Hz</text>
<text x="395.0" y="88.0" font-size="13" text-anchor="middle" fill="#2b2722" font-weight="400">88 keys, A0 to C8: about seven octaves</text>
<text x="395.0" y="232.0" font-size="11.5" text-anchor="middle" fill="#8a8078" font-weight="400">The axis is logarithmic: every octave (a doubling of frequency) takes the same width</text>
</svg>
