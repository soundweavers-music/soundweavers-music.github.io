<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="100%" role="img" aria-label="Fixed key-signature order">
<style>line,path,polyline{stroke-linecap:round;stroke-linejoin:round}text{font-family:'Source Han Serif TW',serif}</style>
<rect width="760" height="360" fill="#f7f3ee"/>
<rect x="14" y="76" width="732" height="268" rx="14" fill="#fff" stroke="#d9d2c9" stroke-width="1"/>
<text x="30.0" y="40.0" font-size="19" text-anchor="start" fill="#2b2722" font-weight="700">Fixed key-signature order</text>
<text x="30.0" y="62.0" font-size="12.5" text-anchor="start" fill="#8a8078" font-weight="400">Three sharps means A major / F♯ minor; the order never changes</text>
<line x1="90.0" y1="120.0" x2="720.0" y2="120.0" stroke="#2b2722" stroke-width="1.1"/>
<line x1="90.0" y1="133.0" x2="720.0" y2="133.0" stroke="#2b2722" stroke-width="1.1"/>
<line x1="90.0" y1="146.0" x2="720.0" y2="146.0" stroke="#2b2722" stroke-width="1.1"/>
<line x1="90.0" y1="159.0" x2="720.0" y2="159.0" stroke="#2b2722" stroke-width="1.1"/>
<line x1="90.0" y1="172.0" x2="720.0" y2="172.0" stroke="#2b2722" stroke-width="1.1"/>
<text x="28.0" y="110.0" font-size="11.5" text-anchor="start" fill="#2b2722" font-weight="700">Sharp keys: F → C → G → D → A → E → B</text>
<text x="170.0" y="128.0" font-size="19" text-anchor="middle" fill="#A67C52" font-weight="700">♯</text>
<text x="170.0" y="198.0" font-size="10" text-anchor="middle" fill="#8a8078" font-weight="400">F♯</text>
<text x="230.0" y="147.5" font-size="19" text-anchor="middle" fill="#A67C52" font-weight="700">♯</text>
<text x="230.0" y="198.0" font-size="10" text-anchor="middle" fill="#8a8078" font-weight="400">C♯</text>
<text x="290.0" y="121.5" font-size="19" text-anchor="middle" fill="#A67C52" font-weight="700">♯</text>
<text x="290.0" y="198.0" font-size="10" text-anchor="middle" fill="#8a8078" font-weight="400">G♯</text>
<text x="350.0" y="141.0" font-size="19" text-anchor="middle" fill="#A67C52" font-weight="700">♯</text>
<text x="350.0" y="198.0" font-size="10" text-anchor="middle" fill="#8a8078" font-weight="400">D♯</text>
<text x="410.0" y="160.5" font-size="19" text-anchor="middle" fill="#A67C52" font-weight="700">♯</text>
<text x="410.0" y="198.0" font-size="10" text-anchor="middle" fill="#8a8078" font-weight="400">A♯</text>
<text x="470.0" y="134.5" font-size="19" text-anchor="middle" fill="#A67C52" font-weight="700">♯</text>
<text x="470.0" y="198.0" font-size="10" text-anchor="middle" fill="#8a8078" font-weight="400">E♯</text>
<text x="530.0" y="154.0" font-size="19" text-anchor="middle" fill="#A67C52" font-weight="700">♯</text>
<text x="530.0" y="198.0" font-size="10" text-anchor="middle" fill="#8a8078" font-weight="400">B♯</text>
<line x1="90.0" y1="238.0" x2="720.0" y2="238.0" stroke="#2b2722" stroke-width="1.1"/>
<line x1="90.0" y1="251.0" x2="720.0" y2="251.0" stroke="#2b2722" stroke-width="1.1"/>
<line x1="90.0" y1="264.0" x2="720.0" y2="264.0" stroke="#2b2722" stroke-width="1.1"/>
<line x1="90.0" y1="277.0" x2="720.0" y2="277.0" stroke="#2b2722" stroke-width="1.1"/>
<line x1="90.0" y1="290.0" x2="720.0" y2="290.0" stroke="#2b2722" stroke-width="1.1"/>
<text x="28.0" y="228.0" font-size="11.5" text-anchor="start" fill="#2b2722" font-weight="700">Flat keys: B → E → A → D → G → C → F</text>
<text x="170.0" y="272.0" font-size="19" text-anchor="middle" fill="#A67C52" font-weight="700">♭</text>
<text x="170.0" y="316.0" font-size="10" text-anchor="middle" fill="#8a8078" font-weight="400">B♭</text>
<text x="230.0" y="252.5" font-size="19" text-anchor="middle" fill="#A67C52" font-weight="700">♭</text>
<text x="230.0" y="316.0" font-size="10" text-anchor="middle" fill="#8a8078" font-weight="400">E♭</text>
<text x="290.0" y="278.5" font-size="19" text-anchor="middle" fill="#A67C52" font-weight="700">♭</text>
<text x="290.0" y="316.0" font-size="10" text-anchor="middle" fill="#8a8078" font-weight="400">A♭</text>
<text x="350.0" y="259.0" font-size="19" text-anchor="middle" fill="#A67C52" font-weight="700">♭</text>
<text x="350.0" y="316.0" font-size="10" text-anchor="middle" fill="#8a8078" font-weight="400">D♭</text>
<text x="410.0" y="285.0" font-size="19" text-anchor="middle" fill="#A67C52" font-weight="700">♭</text>
<text x="410.0" y="316.0" font-size="10" text-anchor="middle" fill="#8a8078" font-weight="400">G♭</text>
<text x="470.0" y="265.5" font-size="19" text-anchor="middle" fill="#A67C52" font-weight="700">♭</text>
<text x="470.0" y="316.0" font-size="10" text-anchor="middle" fill="#8a8078" font-weight="400">C♭</text>
<text x="530.0" y="291.5" font-size="19" text-anchor="middle" fill="#A67C52" font-weight="700">♭</text>
<text x="530.0" y="316.0" font-size="10" text-anchor="middle" fill="#8a8078" font-weight="400">F♭</text>
<text x="28.0" y="340.0" font-size="11" text-anchor="start" fill="#8a8078" font-weight="400">Accidentals in a key signature don&#x27;t follow scale order, but a fixed order along the circle of fifths (up or down).</text>
</svg>
