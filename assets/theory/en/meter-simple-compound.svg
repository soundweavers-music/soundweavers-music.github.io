<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="100%" role="img" aria-label="Simple vs compound metre">
<style>line,path,polyline{stroke-linecap:round;stroke-linejoin:round}text{font-family:'Source Han Serif TW',serif}</style>
<rect width="760" height="300" fill="#f7f3ee"/>
<rect x="14" y="76" width="732" height="208" rx="14" fill="#fff" stroke="#d9d2c9" stroke-width="1"/>
<text x="30.0" y="40.0" font-size="19" text-anchor="start" fill="#2b2722" font-weight="700">Simple vs compound metre</text>
<text x="30.0" y="62.0" font-size="12.5" text-anchor="start" fill="#8a8078" font-weight="400">Same total length, grouped differently: a different groove</text>
<text x="60.0" y="84.0" font-size="13.5" text-anchor="start" fill="#2b2722" font-weight="700">4/4 simple metre</text>
<text x="60.0" y="104.0" font-size="11" text-anchor="start" fill="#8a8078" font-weight="400">each beat splits in half</text>
<circle cx="76.0" cy="130.0" r="10.0" fill="#f2e0cc" stroke="#A67C52" stroke-width="1.6"/>
<circle cx="106.0" cy="130.0" r="10.0" fill="#f2e0cc" stroke="#A67C52" stroke-width="1.6"/>
<line x1="122.0" y1="114.0" x2="122.0" y2="146.0" stroke="#d9d2c9" stroke-width="1.2"/>
<circle cx="150.0" cy="130.0" r="10.0" fill="#f2e0cc" stroke="#A67C52" stroke-width="1.6"/>
<circle cx="180.0" cy="130.0" r="10.0" fill="#f2e0cc" stroke="#A67C52" stroke-width="1.6"/>
<line x1="196.0" y1="114.0" x2="196.0" y2="146.0" stroke="#d9d2c9" stroke-width="1.2"/>
<text x="430.0" y="84.0" font-size="13.5" text-anchor="start" fill="#2b2722" font-weight="700">6/8 compound metre</text>
<text x="430.0" y="104.0" font-size="11" text-anchor="start" fill="#8a8078" font-weight="400">three per group, heard as two big beats</text>
<circle cx="446.0" cy="130.0" r="10.0" fill="#f2e0cc" stroke="#A67C52" stroke-width="1.6"/>
<circle cx="476.0" cy="130.0" r="10.0" fill="#f2e0cc" stroke="#A67C52" stroke-width="1.6"/>
<circle cx="506.0" cy="130.0" r="10.0" fill="#f2e0cc" stroke="#A67C52" stroke-width="1.6"/>
<line x1="522.0" y1="114.0" x2="522.0" y2="146.0" stroke="#d9d2c9" stroke-width="1.2"/>
<circle cx="550.0" cy="130.0" r="10.0" fill="#f2e0cc" stroke="#A67C52" stroke-width="1.6"/>
<circle cx="580.0" cy="130.0" r="10.0" fill="#f2e0cc" stroke="#A67C52" stroke-width="1.6"/>
<circle cx="610.0" cy="130.0" r="10.0" fill="#f2e0cc" stroke="#A67C52" stroke-width="1.6"/>
<line x1="626.0" y1="114.0" x2="626.0" y2="146.0" stroke="#d9d2c9" stroke-width="1.2"/>
<text x="60.0" y="200.0" font-size="12" text-anchor="start" fill="#2b2722" font-weight="#2b2722">Simple: a beat is one natural unit (splits into 2 or 3)</text>
<text x="60.0" y="222.0" font-size="12" text-anchor="start" fill="#2b2722" font-weight="#2b2722">Compound: a beat is a &quot;big beat&quot; of three small ones</text>
<text x="60.0" y="252.0" font-size="12" text-anchor="start" fill="#A67C52" font-weight="700">So 6/8 is not &quot;six beats of 4/4&quot; but &quot;two big beats, three taps each&quot;</text>
</svg>
