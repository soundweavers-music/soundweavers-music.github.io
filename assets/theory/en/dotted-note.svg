<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" width="100%" role="img" aria-label="The dot: add half the note&#x27;s value">
<rect width="760" height="320" fill="#f7f3ee"/>
<text x="28.0" y="40.0" font-size="19" text-anchor="start" fill="#2b2722" font-weight="700">The dot: add half the note&#x27;s value</text>
<text x="28.0" y="62.0" font-size="12.5" text-anchor="start" fill="#8a8078" font-weight="400">The pale segment is what the dot adds</text>
<text x="248.0" y="125.0" font-size="11.5" text-anchor="end" fill="#2b2722" font-weight="700">quarter note</text>
<rect x="260.0" y="109.0" width="92.0" height="22.0" rx="4" fill="#A67C52" stroke="none" stroke-width="1.4"/>
<text x="366.0" y="125.0" font-size="10.5" text-anchor="start" fill="#8a8078" font-weight="400">1 beat</text>
<text x="248.0" y="169.0" font-size="11.5" text-anchor="end" fill="#2b2722" font-weight="700">dotted quarter note</text>
<rect x="260.0" y="153.0" width="92.0" height="22.0" rx="4" fill="#A67C52" stroke="none" stroke-width="1.4"/>
<rect x="352.0" y="153.0" width="46.0" height="22.0" rx="4" fill="#e7d9c8" stroke="#A67C52" stroke-width="1.4"/>
<text x="375.0" y="168.0" font-size="9.5" text-anchor="middle" fill="#A67C52" font-weight="400">+ half</text>
<text x="412.0" y="169.0" font-size="10.5" text-anchor="start" fill="#8a8078" font-weight="400">1.5 beats</text>
<text x="248.0" y="213.0" font-size="11.5" text-anchor="end" fill="#2b2722" font-weight="700">half note</text>
<rect x="260.0" y="197.0" width="184.0" height="22.0" rx="4" fill="#A67C52" stroke="none" stroke-width="1.4"/>
<text x="458.0" y="213.0" font-size="10.5" text-anchor="start" fill="#8a8078" font-weight="400">2 beats</text>
<text x="248.0" y="257.0" font-size="11.5" text-anchor="end" fill="#2b2722" font-weight="700">dotted half note</text>
<rect x="260.0" y="241.0" width="184.0" height="22.0" rx="4" fill="#A67C52" stroke="none" stroke-width="1.4"/>
<rect x="444.0" y="241.0" width="92.0" height="22.0" rx="4" fill="#e7d9c8" stroke="#A67C52" stroke-width="1.4"/>
<text x="490.0" y="256.0" font-size="9.5" text-anchor="middle" fill="#A67C52" font-weight="400">+ half</text>
<text x="550.0" y="257.0" font-size="10.5" text-anchor="start" fill="#8a8078" font-weight="400">3 beats</text>
<text x="28.0" y="272.0" font-size="11.5" text-anchor="start" fill="#2b2722" font-weight="400">A dot does one thing: it adds half again to the note&#x27;s length</text>
<text x="28.0" y="302.0" font-size="11.5" text-anchor="start" fill="#8a8078" font-weight="400">Two dots = half, then half of that again: 1.75 times the original</text>
</svg>
