<rect width="760" height="330" fill="#f7f3ee"/>
<text x="28.0" y="40.0" font-size="19" text-anchor="start" fill="#2b2722" font-weight="700">Sound is a pressure wave in air</text>
<text x="28.0" y="62.0" font-size="12.5" text-anchor="start" fill="#8a8078" font-weight="400">The drum skin pushes out and back; the air is squeezed and released, and the pattern travels</text>
<text x="28.0" y="96.0" font-size="12" text-anchor="start" fill="#2b2722" font-weight="400">Dots are air molecules: packed is compression, spread is rarefaction; the wave travels, the dots stay put</text>
