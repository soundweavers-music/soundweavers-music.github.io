<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 280" width="100%" role="img" aria-label="The beat is not an even tick but a pattern of strong and weak">
<rect width="760" height="280" fill="#f7f3ee"/>
<text x="28.0" y="40.0" font-size="19" text-anchor="start" fill="#2b2722" font-weight="700">The beat is not an even tick but a pattern of strong and weak</text>
<text x="28.0" y="62.0" font-size="12.5" text-anchor="start" fill="#8a8078" font-weight="400">Same spacing, different accents: the groove changes</text>
<text x="28.0" y="94.0" font-size="14.5" text-anchor="start" fill="#2b2722" font-weight="700">Four beats (4/4)</text>
<text x="28.0" y="114.0" font-size="11.5" text-anchor="start" fill="#8a8078" font-weight="400">strong · weak · mid-strong · weak</text>
<circle cx="300.0" cy="120.0" r="22.0" fill="#A67C52" stroke="#A67C52" stroke-width="2"/>
<text x="300.0" y="126.0" font-size="14" text-anchor="middle" fill="#fff" font-weight="700">1</text>
<circle cx="378.0" cy="120.0" r="11.0" fill="#f7f3ee" stroke="#8a8078" stroke-width="1.6"/>
<text x="378.0" y="124.5" font-size="11.5" text-anchor="middle" fill="#8a8078" font-weight="400">2</text>
<circle cx="456.0" cy="120.0" r="15.0" fill="#f7f3ee" stroke="#A67C52" stroke-width="2"/>
<text x="456.0" y="125.0" font-size="12.5" text-anchor="middle" fill="#A67C52" font-weight="700">3</text>
<circle cx="534.0" cy="120.0" r="11.0" fill="#f7f3ee" stroke="#8a8078" stroke-width="1.6"/>
<text x="534.0" y="124.5" font-size="11.5" text-anchor="middle" fill="#8a8078" font-weight="400">4</text>
<text x="28.0" y="199.0" font-size="14.5" text-anchor="start" fill="#2b2722" font-weight="700">Three beats (3/4)</text>
<text x="28.0" y="219.0" font-size="11.5" text-anchor="start" fill="#8a8078" font-weight="400">strong · weak · weak</text>
<circle cx="300.0" cy="225.0" r="22.0" fill="#A67C52" stroke="#A67C52" stroke-width="2"/>
<text x="300.0" y="231.0" font-size="14" text-anchor="middle" fill="#fff" font-weight="700">1</text>
<circle cx="378.0" cy="225.0" r="11.0" fill="#f7f3ee" stroke="#8a8078" stroke-width="1.6"/>
<text x="378.0" y="229.5" font-size="11.5" text-anchor="middle" fill="#8a8078" font-weight="400">2</text>
<circle cx="456.0" cy="225.0" r="11.0" fill="#f7f3ee" stroke="#8a8078" stroke-width="1.6"/>
<text x="456.0" y="229.5" font-size="11.5" text-anchor="middle" fill="#8a8078" font-weight="400">3</text>
<text x="300.0" y="262.0" font-size="11.5" text-anchor="start" fill="#8a8078" font-weight="#2b2722">Bigger circle = stronger accent; beat 1 is always strong</text>
</svg>
