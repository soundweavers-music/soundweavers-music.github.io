<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 382" width="100%" role="img" aria-label="Sachs–Hornbostel classification">
<rect width="760" height="382" fill="#f7f3ee"/>
<text x="28.0" y="40.0" font-size="19" text-anchor="start" fill="#2b2722" font-weight="700">Sachs–Hornbostel classification</text>
<text x="28.0" y="62.0" font-size="12.5" text-anchor="start" fill="#8a8078" font-weight="400">One question, asked all the way: what is vibrating?</text>
<rect x="28.0" y="164.0" width="156.0" height="64.0" rx="8" fill="#A67C52" stroke="none" stroke-width="1.4"/>
<text x="106.0" y="190.0" font-size="13" text-anchor="middle" fill="#fff" font-weight="700">what</text>
<text x="106.0" y="212.0" font-size="13" text-anchor="middle" fill="#fff" font-weight="700">is vibrating?</text>
<line x1="184.0" y1="196.0" x2="240.0" y2="92.0" stroke="#d9d2c9" stroke-width="1.1"/>
<rect x="240.0" y="68.0" width="250.0" height="48.0" rx="6" fill="#f7f3ee" stroke="#d9d2c9" stroke-width="1.4"/>
<text x="254.0" y="88.0" font-size="12.5" text-anchor="start" fill="#2b2722" font-weight="700">chordophones</text>
<text x="254.0" y="107.0" font-size="10.5" text-anchor="start" fill="#8a8078" font-weight="400">source: the string</text>
<text x="506.0" y="96.0" font-size="10.5" text-anchor="start" fill="#2b2722" font-weight="400">violin, guitar, piano</text>
<line x1="184.0" y1="196.0" x2="240.0" y2="144.0" stroke="#d9d2c9" stroke-width="1.1"/>
<rect x="240.0" y="120.0" width="250.0" height="48.0" rx="6" fill="#f7f3ee" stroke="#d9d2c9" stroke-width="1.4"/>
<text x="254.0" y="140.0" font-size="12.5" text-anchor="start" fill="#2b2722" font-weight="700">aerophones</text>
<text x="254.0" y="159.0" font-size="10.5" text-anchor="start" fill="#8a8078" font-weight="400">source: the air column</text>
<text x="506.0" y="148.0" font-size="10.5" text-anchor="start" fill="#2b2722" font-weight="400">flute, trumpet, didgeridoo</text>
<line x1="184.0" y1="196.0" x2="240.0" y2="196.0" stroke="#d9d2c9" stroke-width="1.1"/>
<rect x="240.0" y="172.0" width="250.0" height="48.0" rx="6" fill="#f7f3ee" stroke="#d9d2c9" stroke-width="1.4"/>
<text x="254.0" y="192.0" font-size="12.5" text-anchor="start" fill="#2b2722" font-weight="700">membranophones</text>
<text x="254.0" y="211.0" font-size="10.5" text-anchor="start" fill="#8a8078" font-weight="400">source: a stretched skin</text>
<text x="506.0" y="200.0" font-size="10.5" text-anchor="start" fill="#2b2722" font-weight="400">timpani, snare drum, tambourine</text>
<line x1="184.0" y1="196.0" x2="240.0" y2="248.0" stroke="#d9d2c9" stroke-width="1.1"/>
<rect x="240.0" y="224.0" width="250.0" height="48.0" rx="6" fill="#f7f3ee" stroke="#d9d2c9" stroke-width="1.4"/>
<text x="254.0" y="244.0" font-size="12.5" text-anchor="start" fill="#2b2722" font-weight="700">idiophones</text>
<text x="254.0" y="263.0" font-size="10.5" text-anchor="start" fill="#8a8078" font-weight="400">source: the body itself</text>
<text x="506.0" y="252.0" font-size="10.5" text-anchor="start" fill="#2b2722" font-weight="400">xylophone, gong, cymbals</text>
<line x1="184.0" y1="196.0" x2="240.0" y2="300.0" stroke="#d9d2c9" stroke-width="1.1"/>
<rect x="240.0" y="276.0" width="250.0" height="48.0" rx="6" fill="#f7f3ee" stroke="#d9d2c9" stroke-width="1.4"/>
<text x="254.0" y="296.0" font-size="12.5" text-anchor="start" fill="#2b2722" font-weight="700">electrophones</text>
<text x="254.0" y="315.0" font-size="10.5" text-anchor="start" fill="#8a8078" font-weight="400">source: a circuit or pickup</text>
<text x="506.0" y="304.0" font-size="10.5" text-anchor="start" fill="#2b2722" font-weight="400">synth, electric piano, electric guitar</text>
<text x="28.0" y="350.0" font-size="11.5" text-anchor="start" fill="#8a8078" font-weight="400">Looks, material and how it is played are surface; only &quot;what is vibrating&quot; is one criterion</text>
<text x="28.0" y="364.0" font-size="11.5" text-anchor="start" fill="#8a8078" font-weight="400">Electrophones came later as a fifth class; they are not in the 1914 original</text>
</svg>
