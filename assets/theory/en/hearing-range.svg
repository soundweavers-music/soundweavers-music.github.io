<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 370" width="100%" role="img" aria-label="The edge of hearing: 20 Hz to 20 kHz">
<style>line,path,polyline{stroke-linecap:round;stroke-linejoin:round}text{font-family:'Source Han Serif TW',serif}</style>
<rect width="760" height="370" fill="#f7f3ee"/>
<rect x="14" y="76" width="732" height="278" rx="14" fill="#fff" stroke="#d9d2c9" stroke-width="1"/>
<text x="30.0" y="40.0" font-size="19" text-anchor="start" fill="#2b2722" font-weight="700">The edge of hearing: 20 Hz to 20 kHz</text>
<text x="30.0" y="62.0" font-size="12.5" text-anchor="start" fill="#8a8078" font-weight="400">The axis is logarithmic; above 20 kHz is ultrasound</text>
<rect x="191.4" y="96.0" width="412.5" height="216.0" rx="6" fill="#efe8df" stroke="none" stroke-width="1.4"/>
<text x="195.4" y="88.0" font-size="10.5" text-anchor="start" fill="#8a8078" font-weight="400">human hearing (20 Hz – 20 kHz)</text>
<text x="28.0" y="140.0" font-size="11.5" text-anchor="start" fill="#2b2722" font-weight="700">human</text>
<rect x="191.4" y="129.0" width="412.5" height="14.0" rx="3" fill="#A67C52" stroke="none" stroke-width="1.4"/>
<text x="611.9" y="140.0" font-size="9.5" text-anchor="start" fill="#8a8078" font-weight="#2b2722">20 Hz – 20 kHz</text>
<text x="28.0" y="180.0" font-size="11.5" text-anchor="start" fill="#2b2722" font-weight="400">piano</text>
<rect x="210.4" y="169.0" width="300.1" height="14.0" rx="3" fill="#c2ae97" stroke="none" stroke-width="1.4"/>
<text x="518.5" y="180.0" font-size="9.5" text-anchor="start" fill="#8a8078" font-weight="#2b2722">A0 – C8</text>
<text x="28.0" y="220.0" font-size="11.5" text-anchor="start" fill="#2b2722" font-weight="400">Violin</text>
<rect x="327.7" y="209.0" width="165.6" height="14.0" rx="3" fill="#c2ae97" stroke="none" stroke-width="1.4"/>
<text x="501.3" y="220.0" font-size="9.5" text-anchor="start" fill="#8a8078" font-weight="#2b2722">G3 – G7</text>
<text x="28.0" y="260.0" font-size="11.5" text-anchor="start" fill="#2b2722" font-weight="400">voice</text>
<rect x="275.6" y="249.0" width="155.0" height="14.0" rx="3" fill="#c2ae97" stroke="none" stroke-width="1.4"/>
<text x="438.7" y="260.0" font-size="9.5" text-anchor="start" fill="#8a8078" font-weight="#2b2722">E2 – C6</text>
<text x="28.0" y="300.0" font-size="11.5" text-anchor="start" fill="#2b2722" font-weight="400">dog</text>
<rect x="232.8" y="289.0" width="436.7" height="14.0" rx="3" fill="#c2ae97" stroke="none" stroke-width="1.4"/>
<text x="677.5" y="300.0" font-size="9.5" text-anchor="start" fill="#8a8078" font-weight="#2b2722">40 – 60 kHz</text>
<line x1="150.0" y1="316.0" x2="700.0" y2="316.0" stroke="#8a8078" stroke-width="1.2"/>
<line x1="150.0" y1="310.0" x2="150.0" y2="322.0" stroke="#8a8078" stroke-width="1"/>
<text x="150.0" y="338.0" font-size="10" text-anchor="middle" fill="#8a8078" font-weight="400">10</text>
<line x1="287.5" y1="310.0" x2="287.5" y2="322.0" stroke="#8a8078" stroke-width="1"/>
<text x="287.5" y="338.0" font-size="10" text-anchor="middle" fill="#8a8078" font-weight="400">100</text>
<line x1="425.0" y1="310.0" x2="425.0" y2="322.0" stroke="#8a8078" stroke-width="1"/>
<text x="425.0" y="338.0" font-size="10" text-anchor="middle" fill="#8a8078" font-weight="400">1k</text>
<line x1="562.5" y1="310.0" x2="562.5" y2="322.0" stroke="#8a8078" stroke-width="1"/>
<text x="562.5" y="338.0" font-size="10" text-anchor="middle" fill="#8a8078" font-weight="400">10k</text>
<line x1="700.0" y1="310.0" x2="700.0" y2="322.0" stroke="#8a8078" stroke-width="1"/>
<text x="700.0" y="338.0" font-size="10" text-anchor="middle" fill="#8a8078" font-weight="400">100k</text>
<text x="140.0" y="338.0" font-size="10" text-anchor="end" fill="#8a8078" font-weight="400">Hz</text>
<text x="30.0" y="348.0" font-size="11" text-anchor="start" fill="#8a8078" font-weight="400">The high-frequency limit drops with age; most adults hear up to about 15–17 kHz.</text>
</svg>
