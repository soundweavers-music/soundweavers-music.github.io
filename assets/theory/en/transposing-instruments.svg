<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="100%" role="img" aria-label="Transposing instruments: written Do ≠ sounding Do">
<style>line,path,polyline{stroke-linecap:round;stroke-linejoin:round}text{font-family:'Source Han Serif TW',serif}</style>
<rect width="760" height="340" fill="#f7f3ee"/>
<rect x="14" y="76" width="732" height="248" rx="14" fill="#fff" stroke="#d9d2c9" stroke-width="1"/>
<text x="30.0" y="40.0" font-size="19" text-anchor="start" fill="#2b2722" font-weight="700">Transposing instruments: written Do ≠ sounding Do</text>
<text x="30.0" y="62.0" font-size="12.5" text-anchor="start" fill="#8a8078" font-weight="400">Same fingering, same written Do, different sounding pitch</text>
<text x="250.0" y="100.0" font-size="10" text-anchor="start" fill="#8a8078" font-weight="400">Written</text>
<text x="400.0" y="100.0" font-size="10" text-anchor="start" fill="#8a8078" font-weight="400">Sounding</text>
<text x="560.0" y="100.0" font-size="10" text-anchor="start" fill="#8a8078" font-weight="400">Interval</text>
<rect x="28.0" y="110.0" width="704.0" height="30.0" rx="6" fill="#fff" stroke="none" stroke-width="1.4"/>
<text x="28.0" y="130.0" font-size="11.5" text-anchor="start" fill="#2b2722" font-weight="400">B♭ trumpet / clarinet</text>
<text x="250.0" y="130.0" font-size="11.5" text-anchor="start" fill="#A67C52" font-weight="700">C4</text>
<text x="400.0" y="130.0" font-size="11.5" text-anchor="start" fill="#2b2722" font-weight="400">B♭3</text>
<text x="560.0" y="130.0" font-size="10.5" text-anchor="start" fill="#8a8078" font-weight="400">Down a major 2nd</text>
<text x="28.0" y="164.0" font-size="11.5" text-anchor="start" fill="#2b2722" font-weight="400">F horn</text>
<text x="250.0" y="164.0" font-size="11.5" text-anchor="start" fill="#A67C52" font-weight="700">C4</text>
<text x="400.0" y="164.0" font-size="11.5" text-anchor="start" fill="#2b2722" font-weight="400">F3</text>
<text x="560.0" y="164.0" font-size="10.5" text-anchor="start" fill="#8a8078" font-weight="400">Down a perfect 5th</text>
<rect x="28.0" y="178.0" width="704.0" height="30.0" rx="6" fill="#fff" stroke="none" stroke-width="1.4"/>
<text x="28.0" y="198.0" font-size="11.5" text-anchor="start" fill="#2b2722" font-weight="400">E♭ alto sax</text>
<text x="250.0" y="198.0" font-size="11.5" text-anchor="start" fill="#A67C52" font-weight="700">C4</text>
<text x="400.0" y="198.0" font-size="11.5" text-anchor="start" fill="#2b2722" font-weight="400">E♭3</text>
<text x="560.0" y="198.0" font-size="10.5" text-anchor="start" fill="#8a8078" font-weight="400">Down a major 6th</text>
<text x="28.0" y="232.0" font-size="11.5" text-anchor="start" fill="#2b2722" font-weight="400">B♭ tenor sax</text>
<text x="250.0" y="232.0" font-size="11.5" text-anchor="start" fill="#A67C52" font-weight="700">C4</text>
<text x="400.0" y="232.0" font-size="11.5" text-anchor="start" fill="#2b2722" font-weight="400">B♭2</text>
<text x="560.0" y="232.0" font-size="10.5" text-anchor="start" fill="#8a8078" font-weight="400">Down a major 9th</text>
<rect x="28.0" y="246.0" width="704.0" height="30.0" rx="6" fill="#fff" stroke="none" stroke-width="1.4"/>
<text x="28.0" y="266.0" font-size="11.5" text-anchor="start" fill="#2b2722" font-weight="400">Guitar</text>
<text x="250.0" y="266.0" font-size="11.5" text-anchor="start" fill="#A67C52" font-weight="700">C4</text>
<text x="400.0" y="266.0" font-size="11.5" text-anchor="start" fill="#2b2722" font-weight="400">C3</text>
<text x="560.0" y="266.0" font-size="10.5" text-anchor="start" fill="#8a8078" font-weight="400">Down an octave</text>
<text x="28.0" y="300.0" font-size="11.5" text-anchor="start" fill="#2b2722" font-weight="400">Piccolo</text>
<text x="250.0" y="300.0" font-size="11.5" text-anchor="start" fill="#A67C52" font-weight="700">C5</text>
<text x="400.0" y="300.0" font-size="11.5" text-anchor="start" fill="#2b2722" font-weight="400">C6</text>
<text x="560.0" y="300.0" font-size="10.5" text-anchor="start" fill="#8a8078" font-weight="400">Up an octave</text>
<text x="28.0" y="328.0" font-size="11" text-anchor="start" fill="#8a8078" font-weight="400">Transposing parts can&#x27;t be played on piano as written — convert when reading the score.</text>
</svg>
