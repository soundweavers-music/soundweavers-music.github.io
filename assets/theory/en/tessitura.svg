<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" width="100%" role="img" aria-label="You can reach it; can you stay there?">
<style>line,path,polyline{stroke-linecap:round;stroke-linejoin:round}text{font-family:'Source Han Serif TW',serif}</style>
<rect width="760" height="350" fill="#f7f3ee"/>
<rect x="14" y="76" width="732" height="258" rx="14" fill="#fff" stroke="#d9d2c9" stroke-width="1"/>
<text x="30.0" y="40.0" font-size="19" text-anchor="start" fill="#2b2722" font-weight="700">You can reach it; can you stay there?</text>
<text x="30.0" y="62.0" font-size="12.5" text-anchor="start" fill="#8a8078" font-weight="400">Light is the limit; dark is where you can stay</text>
<text x="28.0" y="125.0" font-size="11.5" text-anchor="start" fill="#2b2722" font-weight="700">soprano</text>
<rect x="452.4" y="111.0" width="176.0" height="18.0" rx="4" fill="#e7d9c8" stroke="none" stroke-width="1.4"/>
<rect x="505.2" y="111.0" width="70.4" height="18.0" rx="4" fill="#A67C52" stroke="none" stroke-width="1.4"/>
<text x="28.0" y="169.0" font-size="11.5" text-anchor="start" fill="#2b2722" font-weight="700">mezzo</text>
<rect x="408.4" y="155.0" width="176.0" height="18.0" rx="4" fill="#e7d9c8" stroke="none" stroke-width="1.4"/>
<rect x="461.2" y="155.0" width="70.4" height="18.0" rx="4" fill="#A67C52" stroke="none" stroke-width="1.4"/>
<text x="28.0" y="213.0" font-size="11.5" text-anchor="start" fill="#2b2722" font-weight="700">tenor</text>
<rect x="338.0" y="199.0" width="167.2" height="18.0" rx="4" fill="#e7d9c8" stroke="none" stroke-width="1.4"/>
<rect x="382.0" y="199.0" width="70.4" height="18.0" rx="4" fill="#A67C52" stroke="none" stroke-width="1.4"/>
<text x="28.0" y="257.0" font-size="11.5" text-anchor="start" fill="#2b2722" font-weight="700">bass</text>
<rect x="267.6" y="243.0" width="167.2" height="18.0" rx="4" fill="#e7d9c8" stroke="none" stroke-width="1.4"/>
<rect x="311.6" y="243.0" width="70.4" height="18.0" rx="4" fill="#A67C52" stroke="none" stroke-width="1.4"/>
<text x="250.0" y="288.0" font-size="10.5" text-anchor="start" fill="#8a8078" font-weight="400">Dark = tessitura, light = the full singable range</text>
<text x="28.0" y="306.0" font-size="11" text-anchor="start" fill="#2b2722" font-weight="400">Most of a show sits in the dark band, so the voice lasts; stay at the light edge and two songs burn it out</text>
<text x="30.0" y="328.0" font-size="11" text-anchor="start" fill="#8a8078" font-weight="400">When writing, put the top note at the top of the tessitura, not at the voice&#x27;s limit</text>
</svg>
