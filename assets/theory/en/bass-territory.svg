<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="100%" role="img" aria-label="What the bass clef is for">
<rect width="760" height="330" fill="#f7f3ee"/>
<text x="28.0" y="40.0" font-size="19" text-anchor="start" fill="#2b2722" font-weight="700">What the bass clef is for</text>
<text x="28.0" y="62.0" font-size="12.5" text-anchor="start" fill="#8a8078" font-weight="400">Bass instruments, and the left hand, are all written here</text>
<line x1="52.0" y1="150.0" x2="250.0" y2="150.0" stroke="#2b2722" stroke-width="1.1"/>
<line x1="52.0" y1="163.0" x2="250.0" y2="163.0" stroke="#2b2722" stroke-width="1.1"/>
<line x1="52.0" y1="176.0" x2="250.0" y2="176.0" stroke="#2b2722" stroke-width="1.1"/>
<line x1="52.0" y1="189.0" x2="250.0" y2="189.0" stroke="#2b2722" stroke-width="1.1"/>
<line x1="52.0" y1="202.0" x2="250.0" y2="202.0" stroke="#2b2722" stroke-width="1.1"/>
<circle cx="78.0" cy="176.0" r="14.0" fill="none" stroke="#A67C52" stroke-width="2"/>
<text x="78.0" y="181.0" font-size="13" text-anchor="middle" fill="#A67C52" font-weight="700">F</text>
<text x="52.0" y="128.0" font-size="13" text-anchor="start" fill="#2b2722" font-weight="700">Bass clef (F clef)</text>
<text x="52.0" y="232.0" font-size="10" text-anchor="start" fill="#8a8078" font-weight="400">Two dots bracket line 4 → that line is F3</text>
<text x="52.0" y="252.0" font-size="10" text-anchor="start" fill="#8a8078" font-weight="400">Usual range about E2–C4; ledger lines go lower</text>
<rect x="330.0" y="116.0" width="180.0" height="44.0" rx="8" fill="#fff" stroke="#d9d2c9" stroke-width="1.4"/>
<text x="346.0" y="144.0" font-size="12" text-anchor="start" fill="#2b2722" font-weight="400">bassoon</text>
<rect x="530.0" y="116.0" width="180.0" height="44.0" rx="8" fill="#fff" stroke="#d9d2c9" stroke-width="1.4"/>
<text x="546.0" y="144.0" font-size="12" text-anchor="start" fill="#2b2722" font-weight="400">Trombone</text>
<rect x="330.0" y="174.0" width="180.0" height="44.0" rx="8" fill="#fff" stroke="#d9d2c9" stroke-width="1.4"/>
<text x="346.0" y="202.0" font-size="12" text-anchor="start" fill="#2b2722" font-weight="400">cello</text>
<rect x="530.0" y="174.0" width="180.0" height="44.0" rx="8" fill="#fff" stroke="#d9d2c9" stroke-width="1.4"/>
<text x="546.0" y="202.0" font-size="12" text-anchor="start" fill="#2b2722" font-weight="400">double bass</text>
<rect x="330.0" y="232.0" width="180.0" height="44.0" rx="8" fill="#fff" stroke="#d9d2c9" stroke-width="1.4"/>
<text x="346.0" y="260.0" font-size="12" text-anchor="start" fill="#2b2722" font-weight="400">tuba</text>
<rect x="530.0" y="232.0" width="180.0" height="44.0" rx="8" fill="#fff" stroke="#d9d2c9" stroke-width="1.4"/>
<text x="546.0" y="260.0" font-size="12" text-anchor="start" fill="#2b2722" font-weight="400">Piano, left hand</text>
<text x="330.0" y="300.0" font-size="11.5" text-anchor="start" fill="#A67C52" font-weight="700">The foundation is written here: the &quot;root&quot; clef</text>
</svg>
