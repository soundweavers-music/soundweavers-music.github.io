<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="100%" role="img" aria-label="Same chords, different groove">
<style>line,path,polyline{stroke-linecap:round;stroke-linejoin:round}text{font-family:'Source Han Serif TW',serif}</style>
<rect width="760" height="330" fill="#f7f3ee"/>
<rect x="14" y="76" width="732" height="238" rx="14" fill="#fff" stroke="#d9d2c9" stroke-width="1"/>
<text x="30.0" y="40.0" font-size="19" text-anchor="start" fill="#2b2722" font-weight="700">Same chords, different groove</text>
<text x="30.0" y="62.0" font-size="12.5" text-anchor="start" fill="#8a8078" font-weight="400">Boom is the bass, chick is the chord; where the accent falls decides whether it walks or spins</text>
<text x="28.0" y="96.0" font-size="12" text-anchor="start" fill="#2b2722" font-weight="400">Same chords; move the accent and the groove changes</text>
<text x="28.0" y="136.0" font-size="12" text-anchor="start" fill="#2b2722" font-weight="700">2/4 march</text>
<text x="20.0" y="156.0" font-size="9.5" text-anchor="start" fill="#8a8078" font-weight="400">left foot on boom, right foot on chick</text>
<line x1="220.0" y1="160.0" x2="368.0" y2="160.0" stroke="#d9d2c9" stroke-width="1.2"/>
<circle cx="250.0" cy="140.0" r="15.0" fill="#A67C52" stroke="#A67C52" stroke-width="1.8"/>
<text x="250.0" y="145.0" font-size="11" text-anchor="middle" fill="#fff" font-weight="400">boom</text>
<circle cx="324.0" cy="140.0" r="10.0" fill="#f7f3ee" stroke="#8a8078" stroke-width="1.8"/>
<text x="324.0" y="145.0" font-size="9.5" text-anchor="middle" fill="#8a8078" font-weight="400">chick</text>
<text x="28.0" y="196.0" font-size="12" text-anchor="start" fill="#2b2722" font-weight="700">3/4 waltz</text>
<text x="20.0" y="216.0" font-size="9.5" text-anchor="start" fill="#8a8078" font-weight="400">one heavy step, two light, so it spins</text>
<line x1="220.0" y1="220.0" x2="442.0" y2="220.0" stroke="#d9d2c9" stroke-width="1.2"/>
<circle cx="250.0" cy="200.0" r="15.0" fill="#A67C52" stroke="#A67C52" stroke-width="1.8"/>
<text x="250.0" y="205.0" font-size="11" text-anchor="middle" fill="#fff" font-weight="400">boom</text>
<circle cx="324.0" cy="200.0" r="10.0" fill="#f7f3ee" stroke="#8a8078" stroke-width="1.8"/>
<text x="324.0" y="205.0" font-size="9.5" text-anchor="middle" fill="#8a8078" font-weight="400">chick</text>
<circle cx="398.0" cy="200.0" r="10.0" fill="#f7f3ee" stroke="#8a8078" stroke-width="1.8"/>
<text x="398.0" y="205.0" font-size="9.5" text-anchor="middle" fill="#8a8078" font-weight="400">chick</text>
<text x="28.0" y="256.0" font-size="12" text-anchor="start" fill="#2b2722" font-weight="700">4/4 pop</text>
<text x="20.0" y="276.0" font-size="9.5" text-anchor="start" fill="#8a8078" font-weight="400">two boom-chick pairs, the steadiest feel</text>
<line x1="220.0" y1="280.0" x2="516.0" y2="280.0" stroke="#d9d2c9" stroke-width="1.2"/>
<circle cx="250.0" cy="260.0" r="15.0" fill="#A67C52" stroke="#A67C52" stroke-width="1.8"/>
<text x="250.0" y="265.0" font-size="11" text-anchor="middle" fill="#fff" font-weight="400">boom</text>
<circle cx="324.0" cy="260.0" r="10.0" fill="#f7f3ee" stroke="#8a8078" stroke-width="1.8"/>
<text x="324.0" y="265.0" font-size="9.5" text-anchor="middle" fill="#8a8078" font-weight="400">chick</text>
<circle cx="398.0" cy="260.0" r="15.0" fill="#A67C52" stroke="#A67C52" stroke-width="1.8"/>
<text x="398.0" y="265.0" font-size="11" text-anchor="middle" fill="#fff" font-weight="400">boom</text>
<circle cx="472.0" cy="260.0" r="10.0" fill="#f7f3ee" stroke="#8a8078" stroke-width="1.8"/>
<text x="472.0" y="265.0" font-size="9.5" text-anchor="middle" fill="#8a8078" font-weight="400">chick</text>
<text x="28.0" y="306.0" font-size="11.5" text-anchor="start" fill="#8a8078" font-weight="400">Play all three in turn; change the metre and the same song feels different</text>
</svg>
