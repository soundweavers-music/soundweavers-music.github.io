<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="100%" role="img" aria-label="Four Cadences">
<rect width="760" height="330" fill="#f7f3ee"/>
<text x="28.0" y="40.0" font-size="19" text-anchor="start" fill="#2b2722" font-weight="700">Four Cadences</text>
<text x="28.0" y="62.0" font-size="12.5" text-anchor="start" fill="#8a8078" font-weight="400">Same dominant chord; where it goes decides the ending</text>
<text x="28.0" y="120.0" font-size="12" text-anchor="start" fill="#2b2722" font-weight="700">Authentic Cadence</text>
<rect x="190.0" y="98.0" width="210.0" height="30.0" rx="8" fill="#fff" stroke="#d9d2c9" stroke-width="1.4"/>
<text x="295.0" y="119.0" font-size="12" text-anchor="middle" fill="#A67C52" font-weight="700">V → I</text>
<text x="430.0" y="119.0" font-size="10.5" text-anchor="start" fill="#8a8078" font-weight="400">Most complete, final</text>
<text x="28.0" y="172.0" font-size="12" text-anchor="start" fill="#2b2722" font-weight="700">Plagal Cadence</text>
<rect x="190.0" y="150.0" width="210.0" height="30.0" rx="8" fill="#fff" stroke="#d9d2c9" stroke-width="1.4"/>
<text x="295.0" y="171.0" font-size="12" text-anchor="middle" fill="#2b2722" font-weight="700">IV → I</text>
<text x="430.0" y="171.0" font-size="10.5" text-anchor="start" fill="#8a8078" font-weight="400">Gentle, like &quot;Amen&quot;</text>
<text x="28.0" y="224.0" font-size="12" text-anchor="start" fill="#2b2722" font-weight="700">Half Cadence</text>
<rect x="190.0" y="202.0" width="210.0" height="30.0" rx="8" fill="#fff" stroke="#d9d2c9" stroke-width="1.4"/>
<text x="295.0" y="223.0" font-size="12" text-anchor="middle" fill="#8a8078" font-weight="700">⋯ → V</text>
<text x="430.0" y="223.0" font-size="10.5" text-anchor="start" fill="#8a8078" font-weight="400">Unresolved, like a comma</text>
<text x="28.0" y="276.0" font-size="12" text-anchor="start" fill="#2b2722" font-weight="700">Deceptive Cadence</text>
<rect x="190.0" y="254.0" width="210.0" height="30.0" rx="8" fill="#fff" stroke="#d9d2c9" stroke-width="1.4"/>
<text x="295.0" y="275.0" font-size="12" text-anchor="middle" fill="#8a8078" font-weight="700">V → vi</text>
<text x="430.0" y="275.0" font-size="10.5" text-anchor="start" fill="#8a8078" font-weight="400">Expects home, led away</text>
<text x="28.0" y="316.0" font-size="11" text-anchor="start" fill="#8a8078" font-weight="400">All four cadences occur at phrase ends—they decide whether the phrase is &quot;finished&quot; or &quot;has more to say&quot;.</text>
</svg>
