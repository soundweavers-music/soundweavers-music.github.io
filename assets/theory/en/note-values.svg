<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 386" width="100%" role="img" aria-label="音符的時值：倍數關係">
<rect width="760" height="386" fill="#f7f3ee"/>
<text x="28.0" y="40.0" font-size="19" text-anchor="start" fill="#2b2722" font-weight="700">Note values: a doubling relationship</text>
<text x="28.0" y="62.0" font-size="12.5" text-anchor="start" fill="#8a8078" font-weight="400">Every note is half as long as the one above</text>
<text x="40.0" y="96.0" font-size="12.5" text-anchor="start" fill="#2b2722" font-weight="700">One whole note = 4 beats (in 4/4)</text>
<rect x="200.0" y="118.0" width="400.0" height="20.0" rx="3" fill="#A67C52" stroke="#A67C52" stroke-width="1.4"/>
<text x="190.0" y="133.0" font-size="12" text-anchor="end" fill="#2b2722" font-weight="700">whole note</text>
<text x="610.0" y="133.0" font-size="11.5" text-anchor="start" fill="#8a8078" font-weight="#2b2722">4 beats</text>
<rect x="200.0" y="150.0" width="200.0" height="20.0" rx="3" fill="#A67C52" stroke="#A67C52" stroke-width="1.4"/>
<text x="190.0" y="165.0" font-size="12" text-anchor="end" fill="#2b2722" font-weight="700">half note</text>
<text x="410.0" y="165.0" font-size="11.5" text-anchor="start" fill="#8a8078" font-weight="#2b2722">2 beats</text>
<rect x="200.0" y="182.0" width="100.0" height="20.0" rx="3" fill="#A67C52" stroke="#A67C52" stroke-width="1.4"/>
<text x="190.0" y="197.0" font-size="12" text-anchor="end" fill="#2b2722" font-weight="700">quarter note</text>
<text x="310.0" y="197.0" font-size="11.5" text-anchor="start" fill="#8a8078" font-weight="#2b2722">1 beat</text>
<rect x="200.0" y="214.0" width="50.0" height="20.0" rx="3" fill="#A67C52" stroke="#A67C52" stroke-width="1.4"/>
<text x="190.0" y="229.0" font-size="12" text-anchor="end" fill="#2b2722" font-weight="700">eighth note</text>
<text x="260.0" y="229.0" font-size="11.5" text-anchor="start" fill="#8a8078" font-weight="#2b2722">half a beat</text>
<rect x="200.0" y="246.0" width="25.0" height="20.0" rx="3" fill="#A67C52" stroke="#A67C52" stroke-width="1.4"/>
<text x="190.0" y="261.0" font-size="12" text-anchor="end" fill="#2b2722" font-weight="700">sixteenth note</text>
<text x="235.0" y="261.0" font-size="11.5" text-anchor="start" fill="#8a8078" font-weight="#2b2722">quarter of a beat</text>
<text x="40.0" y="292.0" font-size="12" text-anchor="start" fill="#2b2722" font-weight="700">The time signature decides what &quot;one beat&quot; is:</text>
<text x="40.0" y="314.0" font-size="11.5" text-anchor="start" fill="#8a8078" font-weight="#2b2722">4/4 → quarter note = one beat</text>
<text x="40.0" y="334.0" font-size="11.5" text-anchor="start" fill="#8a8078" font-weight="#2b2722">6/8 → eighth note = one beat</text>
<text x="40.0" y="354.0" font-size="11.5" text-anchor="start" fill="#8a8078" font-weight="#2b2722">2/2 → half note = one beat</text>
</svg>
