<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" width="100%" role="img" aria-label="Inversion: flip the interval">
<style>line,path,polyline{stroke-linecap:round;stroke-linejoin:round}text{font-family:'Source Han Serif TW',serif}</style>
<rect width="760" height="320" fill="#f7f3ee"/>
<rect x="14" y="76" width="732" height="228" rx="14" fill="#fff" stroke="#d9d2c9" stroke-width="1"/>
<text x="30.0" y="40.0" font-size="19" text-anchor="start" fill="#2b2722" font-weight="700">Inversion: flip the interval</text>
<text x="30.0" y="62.0" font-size="12.5" text-anchor="start" fill="#8a8078" font-weight="400">Same distance, other end, new name</text>
<rect x="28.0" y="98.0" width="300.0" height="34.0" rx="8" fill="#fff" stroke="#d9d2c9" stroke-width="1.2"/>
<text x="178.0" y="120.0" font-size="12" text-anchor="middle" fill="#2b2722" font-weight="400">Perfect 5th C → G</text>
<text x="360.0" y="120.0" font-size="15" text-anchor="middle" fill="#A67C52" font-weight="400">⇄</text>
<rect x="396.0" y="98.0" width="300.0" height="34.0" rx="8" fill="#f2e7da" stroke="#d9d2c9" stroke-width="1.2"/>
<text x="546.0" y="120.0" font-size="12" text-anchor="middle" fill="#A67C52" font-weight="400">Perfect 4th G → C</text>
<text x="712.0" y="120.0" font-size="10" text-anchor="middle" fill="#8a8078" font-weight="400">5 ＋ 4 ＝ 9</text>
<rect x="28.0" y="162.0" width="300.0" height="34.0" rx="8" fill="#fff" stroke="#d9d2c9" stroke-width="1.2"/>
<text x="178.0" y="184.0" font-size="12" text-anchor="middle" fill="#2b2722" font-weight="400">Major 3rd C → E</text>
<text x="360.0" y="184.0" font-size="15" text-anchor="middle" fill="#A67C52" font-weight="400">⇄</text>
<rect x="396.0" y="162.0" width="300.0" height="34.0" rx="8" fill="#f2e7da" stroke="#d9d2c9" stroke-width="1.2"/>
<text x="546.0" y="184.0" font-size="12" text-anchor="middle" fill="#A67C52" font-weight="400">Minor 6th E → C</text>
<text x="712.0" y="184.0" font-size="10" text-anchor="middle" fill="#8a8078" font-weight="400">3 ＋ 6 ＝ 9</text>
<rect x="28.0" y="226.0" width="300.0" height="34.0" rx="8" fill="#fff" stroke="#d9d2c9" stroke-width="1.2"/>
<text x="178.0" y="248.0" font-size="12" text-anchor="middle" fill="#2b2722" font-weight="400">Major 2nd C → D</text>
<text x="360.0" y="248.0" font-size="15" text-anchor="middle" fill="#A67C52" font-weight="400">⇄</text>
<rect x="396.0" y="226.0" width="300.0" height="34.0" rx="8" fill="#f2e7da" stroke="#d9d2c9" stroke-width="1.2"/>
<text x="546.0" y="248.0" font-size="12" text-anchor="middle" fill="#A67C52" font-weight="400">Minor 7th D → C</text>
<text x="712.0" y="248.0" font-size="10" text-anchor="middle" fill="#8a8078" font-weight="400">2 ＋ 7 ＝ 9</text>
<text x="28.0" y="306.0" font-size="11" text-anchor="start" fill="#8a8078" font-weight="400">Raise the lower note an octave and the interval flips: degrees add to 9, major becomes minor, perfect stays perfect.</text>
</svg>
