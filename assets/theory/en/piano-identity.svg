<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="100%" role="img" aria-label="Is the piano a string, percussion or keyboard instrument?">
<rect width="760" height="330" fill="#f7f3ee"/>
<text x="28.0" y="40.0" font-size="19" text-anchor="start" fill="#2b2722" font-weight="700">Is the piano a string, percussion or keyboard instrument?</text>
<text x="28.0" y="62.0" font-size="12.5" text-anchor="start" fill="#8a8078" font-weight="400">All three are half right, because they answer different questions</text>
<rect x="40.0" y="148.0" width="130.0" height="74.0" rx="8" fill="#A67C52" stroke="none" stroke-width="1.4"/>
<text x="105.0" y="182.0" font-size="15" text-anchor="middle" fill="#fff" font-weight="700">piano</text>
<text x="105.0" y="204.0" font-size="9.5" text-anchor="middle" fill="#f0e6da" font-weight="400">strings, hammers, keys</text>
<line x1="178.0" y1="185.0" x2="300.0" y2="128.0" stroke="#8a8078" stroke-width="1.2"/><path d="M295.1 133.7 L300.0 128.0 L292.5 128.1" fill="none" stroke="#8a8078" stroke-width="1.2"/>
<rect x="300.0" y="104.0" width="400.0" height="48.0" rx="8" fill="#fff" stroke="#d9d2c9" stroke-width="1.4"/>
<text x="318.0" y="126.0" font-size="12.5" text-anchor="start" fill="#2b2722" font-weight="700">strings</text>
<text x="318.0" y="144.0" font-size="10" text-anchor="start" fill="#8a8078" font-weight="400">it has strings, but you neither bow nor pluck</text>
<line x1="178.0" y1="185.0" x2="300.0" y2="198.0" stroke="#8a8078" stroke-width="1.2"/><path d="M292.9 200.3 L300.0 198.0 L293.5 194.2" fill="none" stroke="#8a8078" stroke-width="1.2"/>
<rect x="300.0" y="174.0" width="400.0" height="48.0" rx="8" fill="#fff" stroke="#d9d2c9" stroke-width="1.4"/>
<text x="318.0" y="196.0" font-size="12.5" text-anchor="start" fill="#2b2722" font-weight="700">percussion</text>
<text x="318.0" y="214.0" font-size="10" text-anchor="start" fill="#8a8078" font-weight="400">you strike it, but the hammer hits strings</text>
<line x1="178.0" y1="185.0" x2="300.0" y2="268.0" stroke="#8a8078" stroke-width="1.2"/><path d="M292.6 266.7 L300.0 268.0 L296.1 261.6" fill="none" stroke="#8a8078" stroke-width="1.2"/>
<rect x="300.0" y="244.0" width="400.0" height="48.0" rx="8" fill="#fff" stroke="#d9d2c9" stroke-width="1.4"/>
<text x="318.0" y="266.0" font-size="12.5" text-anchor="start" fill="#2b2722" font-weight="700">keyboard</text>
<text x="318.0" y="284.0" font-size="10" text-anchor="start" fill="#8a8078" font-weight="400">it has a keyboard, but the keys are just switches</text>
<rect x="300.0" y="290.0" width="400.0" height="0.0" rx="0" fill="none" stroke="none" stroke-width="1.4"/>
<text x="28.0" y="300.0" font-size="11" text-anchor="start" fill="#A67C52" font-weight="700">The S-H answer: chordophone, struck. The source is a string, the hammer moves it; two questions, no contradiction</text>
</svg>
