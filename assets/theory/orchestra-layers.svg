<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="100%" role="img" aria-label="管弦樂團的三層樓">
<style>line,path,polyline{stroke-linecap:round;stroke-linejoin:round}text{font-family:'Source Han Serif TW',serif}</style>
<rect width="760" height="380" fill="#f7f3ee"/>
<rect x="14" y="76" width="732" height="288" rx="14" fill="#fff" stroke="#d9d2c9" stroke-width="1"/>
<text x="30.0" y="40.0" font-size="19" text-anchor="start" fill="#2b2722" font-weight="700">管弦樂團的三層樓</text>
<text x="30.0" y="62.0" font-size="12.5" text-anchor="start" fill="#8a8078" font-weight="400">高、中、低三層各自有幾個住戶；重疊太多會互相蓋住</text>
<text x="28.0" y="96.0" font-size="12" text-anchor="start" fill="#2b2722" font-weight="400">三層各自有住戶；相鄰兩層留一點重疊（法國號可以補中音，也可以補低音）。</text>
<rect x="180.0" y="106.0" width="520.0" height="72.0" rx="10" fill="#efe8df" stroke="none" stroke-width="1.4"/>
<text x="166.0" y="148.0" font-size="12.5" text-anchor="end" fill="#2b2722" font-weight="700">高音</text>
<rect x="196.0" y="120.0" width="112.0" height="44.0" rx="8" fill="#fff" stroke="#d9d2c9" stroke-width="1.4"/>
<text x="252.0" y="148.0" font-size="10.5" text-anchor="middle" fill="#2b2722" font-weight="400">長笛</text>
<rect x="322.0" y="120.0" width="112.0" height="44.0" rx="8" fill="#fff" stroke="#d9d2c9" stroke-width="1.4"/>
<text x="378.0" y="148.0" font-size="10.5" text-anchor="middle" fill="#2b2722" font-weight="400">小提琴</text>
<rect x="448.0" y="120.0" width="112.0" height="44.0" rx="8" fill="#fff" stroke="#d9d2c9" stroke-width="1.4"/>
<text x="504.0" y="148.0" font-size="10.5" text-anchor="middle" fill="#2b2722" font-weight="400">雙簧管</text>
<rect x="574.0" y="120.0" width="112.0" height="44.0" rx="8" fill="#fff" stroke="#d9d2c9" stroke-width="1.4"/>
<text x="630.0" y="148.0" font-size="10.5" text-anchor="middle" fill="#2b2722" font-weight="400">小號</text>
<rect x="180.0" y="190.0" width="520.0" height="72.0" rx="10" fill="#efe8df" stroke="none" stroke-width="1.4"/>
<text x="166.0" y="232.0" font-size="12.5" text-anchor="end" fill="#2b2722" font-weight="700">中音</text>
<rect x="196.0" y="204.0" width="112.0" height="44.0" rx="8" fill="#fff" stroke="#d9d2c9" stroke-width="1.4"/>
<text x="252.0" y="232.0" font-size="10.5" text-anchor="middle" fill="#2b2722" font-weight="400">中提琴</text>
<rect x="322.0" y="204.0" width="112.0" height="44.0" rx="8" fill="#fff" stroke="#d9d2c9" stroke-width="1.4"/>
<text x="378.0" y="232.0" font-size="10.5" text-anchor="middle" fill="#2b2722" font-weight="400">單簧管</text>
<rect x="448.0" y="204.0" width="112.0" height="44.0" rx="8" fill="#fff" stroke="#d9d2c9" stroke-width="1.4"/>
<text x="504.0" y="232.0" font-size="10.5" text-anchor="middle" fill="#2b2722" font-weight="400">法國號</text>
<rect x="574.0" y="204.0" width="112.0" height="44.0" rx="8" fill="#fff" stroke="#d9d2c9" stroke-width="1.4"/>
<text x="630.0" y="232.0" font-size="10.5" text-anchor="middle" fill="#2b2722" font-weight="400">雙簧管 II</text>
<rect x="180.0" y="274.0" width="520.0" height="72.0" rx="10" fill="#efe8df" stroke="none" stroke-width="1.4"/>
<text x="166.0" y="316.0" font-size="12.5" text-anchor="end" fill="#2b2722" font-weight="700">低音</text>
<rect x="196.0" y="288.0" width="112.0" height="44.0" rx="8" fill="#fff" stroke="#d9d2c9" stroke-width="1.4"/>
<text x="252.0" y="316.0" font-size="10.5" text-anchor="middle" fill="#2b2722" font-weight="400">大提琴</text>
<rect x="322.0" y="288.0" width="112.0" height="44.0" rx="8" fill="#fff" stroke="#d9d2c9" stroke-width="1.4"/>
<text x="378.0" y="316.0" font-size="10.5" text-anchor="middle" fill="#2b2722" font-weight="400">低音管</text>
<rect x="448.0" y="288.0" width="112.0" height="44.0" rx="8" fill="#fff" stroke="#d9d2c9" stroke-width="1.4"/>
<text x="504.0" y="316.0" font-size="10.5" text-anchor="middle" fill="#2b2722" font-weight="400">低音提琴</text>
<rect x="574.0" y="288.0" width="112.0" height="44.0" rx="8" fill="#fff" stroke="#d9d2c9" stroke-width="1.4"/>
<text x="630.0" y="316.0" font-size="10.5" text-anchor="middle" fill="#2b2722" font-weight="400">低音號</text>
<text x="28.0" y="372.0" font-size="11.5" text-anchor="start" fill="#8a8078" font-weight="400">真正的重點不是「塞滿」，是每一層都聽得見。</text>
</svg>
