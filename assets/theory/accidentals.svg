<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 310" width="100%" role="img" aria-label="臨時記號只管一小節">
<rect width="760" height="310" fill="#f7f3ee"/>
<text x="28.0" y="40.0" font-size="19" text-anchor="start" fill="#2b2722" font-weight="700">臨時記號只管一小節</text>
<text x="28.0" y="62.0" font-size="12.5" text-anchor="start" fill="#8a8078" font-weight="400">同一個音，加一個記號就換了身分；小節線之後自動失效</text>
<rect x="34.0" y="104.0" width="224.0" height="168.0" rx="10" fill="#fff" stroke="#d9d2c9" stroke-width="1.4"/>
<text x="146.0" y="176.0" font-size="44" text-anchor="middle" fill="#A67C52" font-weight="700">♯</text>
<text x="146.0" y="206.0" font-size="12.5" text-anchor="middle" fill="#2b2722" font-weight="700">升記號</text>
<text x="146.0" y="230.0" font-size="10.5" text-anchor="middle" fill="#8a8078" font-weight="400">把音升高半音</text>
<text x="146.0" y="252.0" font-size="11" text-anchor="middle" fill="#A67C52" font-weight="700">C → C♯</text>
<rect x="278.0" y="104.0" width="224.0" height="168.0" rx="10" fill="#fff" stroke="#d9d2c9" stroke-width="1.4"/>
<text x="390.0" y="176.0" font-size="44" text-anchor="middle" fill="#A67C52" font-weight="700">♭</text>
<text x="390.0" y="206.0" font-size="12.5" text-anchor="middle" fill="#2b2722" font-weight="700">降記號</text>
<text x="390.0" y="230.0" font-size="10.5" text-anchor="middle" fill="#8a8078" font-weight="400">把音降低半音</text>
<text x="390.0" y="252.0" font-size="11" text-anchor="middle" fill="#A67C52" font-weight="700">D → D♭</text>
<rect x="522.0" y="104.0" width="224.0" height="168.0" rx="10" fill="#fff" stroke="#d9d2c9" stroke-width="1.4"/>
<text x="634.0" y="176.0" font-size="44" text-anchor="middle" fill="#8a8078" font-weight="700">♮</text>
<text x="634.0" y="206.0" font-size="12.5" text-anchor="middle" fill="#2b2722" font-weight="700">還原記號</text>
<text x="634.0" y="230.0" font-size="10.5" text-anchor="middle" fill="#8a8078" font-weight="400">取消前面的升降</text>
<text x="634.0" y="252.0" font-size="11" text-anchor="middle" fill="#A67C52" font-weight="700">C♯ → C</text>
</svg>
