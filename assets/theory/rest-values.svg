<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="100%" role="img" aria-label="休止符：安靜也是節奏">
<style>line,path,polyline{stroke-linecap:round;stroke-linejoin:round}text{font-family:'Source Han Serif TW',serif}</style>
<rect width="760" height="300" fill="#f7f3ee"/>
<rect x="14" y="76" width="732" height="208" rx="14" fill="#fff" stroke="#d9d2c9" stroke-width="1"/>
<text x="30.0" y="40.0" font-size="19" text-anchor="start" fill="#2b2722" font-weight="700">休止符：安靜也是節奏</text>
<text x="30.0" y="62.0" font-size="12.5" text-anchor="start" fill="#8a8078" font-weight="400">休止符的長度家族與音符完全對應——它佔的是時間，不是空白</text>
<text x="28.0" y="122.0" font-size="12" text-anchor="start" fill="#2b2722" font-weight="700">全休止符</text>
<text x="20.0" y="138.0" font-size="9.5" text-anchor="start" fill="#8a8078" font-weight="400">整個小節都不出聲</text>
<line x1="250.0" y1="116.0" x2="670.0" y2="116.0" stroke="#d9d2c9" stroke-width="1.2"/>
<rect x="250.0" y="102.0" width="420.0" height="14.0" rx="2" fill="#efe4d6" stroke="#8a8078" stroke-width="1.4"/>
<text x="460.0" y="113.0" font-size="9.5" text-anchor="middle" fill="#8a8078" font-weight="400">4 拍</text>
<text x="28.0" y="168.0" font-size="12" text-anchor="start" fill="#2b2722" font-weight="700">二分休止符</text>
<text x="20.0" y="184.0" font-size="9.5" text-anchor="start" fill="#8a8078" font-weight="400">休兩拍</text>
<line x1="250.0" y1="162.0" x2="670.0" y2="162.0" stroke="#d9d2c9" stroke-width="1.2"/>
<rect x="250.0" y="148.0" width="210.0" height="14.0" rx="2" fill="#efe4d6" stroke="#8a8078" stroke-width="1.4"/>
<text x="355.0" y="159.0" font-size="9.5" text-anchor="middle" fill="#8a8078" font-weight="400">2 拍</text>
<text x="28.0" y="214.0" font-size="12" text-anchor="start" fill="#2b2722" font-weight="700">四分休止符</text>
<text x="20.0" y="230.0" font-size="9.5" text-anchor="start" fill="#8a8078" font-weight="400">休一拍</text>
<line x1="250.0" y1="208.0" x2="670.0" y2="208.0" stroke="#d9d2c9" stroke-width="1.2"/>
<rect x="250.0" y="194.0" width="105.0" height="14.0" rx="2" fill="#efe4d6" stroke="#8a8078" stroke-width="1.4"/>
<text x="302.5" y="205.0" font-size="9.5" text-anchor="middle" fill="#8a8078" font-weight="400">1 拍</text>
<text x="28.0" y="260.0" font-size="12" text-anchor="start" fill="#2b2722" font-weight="700">八分休止符</text>
<text x="20.0" y="276.0" font-size="9.5" text-anchor="start" fill="#8a8078" font-weight="400">休半拍</text>
<line x1="250.0" y1="254.0" x2="670.0" y2="254.0" stroke="#d9d2c9" stroke-width="1.2"/>
<rect x="250.0" y="240.0" width="52.5" height="14.0" rx="2" fill="#efe4d6" stroke="#8a8078" stroke-width="1.4"/>
<text x="276.2" y="251.0" font-size="9.5" text-anchor="middle" fill="#8a8078" font-weight="400">0.5 拍</text>
<text x="460.0" y="288.0" font-size="11" text-anchor="middle" fill="#8a8078" font-weight="400">橫條＝沒有聲音的時間，長度跟音符一樣是砍半的</text>
</svg>
