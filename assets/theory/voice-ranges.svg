<text x="502.0" y="274.0" font-size="10" text-anchor="start" fill="#8a8078" font-weight="400">E2–E4</text>
<line x1="456.4" y1="92.0" x2="456.4" y2="292.0" stroke="#A67C52" stroke-width="1.1" stroke-dasharray="4 4"/>
<text x="456.4" y="86.0" font-size="9.5" text-anchor="middle" fill="#A67C52" font-weight="400">中央 C</text>
<line x1="231.0" y1="292.0" x2="231.0" y2="298.0" stroke="#8a8078" stroke-width="1"/>
<text x="231.0" y="312.0" font-size="9.5" text-anchor="middle" fill="#8a8078" font-weight="400">C2</text>
<line x1="343.7" y1="292.0" x2="343.7" y2="298.0" stroke="#8a8078" stroke-width="1"/>
<text x="343.7" y="312.0" font-size="9.5" text-anchor="middle" fill="#8a8078" font-weight="400">C3</text>
<line x1="456.4" y1="292.0" x2="456.4" y2="298.0" stroke="#8a8078" stroke-width="1"/>
<text x="456.4" y="312.0" font-size="9.5" text-anchor="middle" fill="#8a8078" font-weight="400">C4</text>
<line x1="569.2" y1="292.0" x2="569.2" y2="298.0" stroke="#8a8078" stroke-width="1"/>
<text x="569.2" y="312.0" font-size="9.5" text-anchor="middle" fill="#8a8078" font-weight="400">C5</text>
<line x1="681.9" y1="292.0" x2="681.9" y2="298.0" stroke="#8a8078" stroke-width="1"/>
<text x="681.9" y="312.0" font-size="9.5" text-anchor="middle" fill="#8a8078" font-weight="400">C6</text>
<text x="30.0" y="344.0" font-size="11" text-anchor="start" fill="#8a8078" font-weight="400">這是常見範圍，不是絕對界線；每個人的聲帶條件差很多。</text>
