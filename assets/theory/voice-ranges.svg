<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 366" width="100%" role="img" aria-label="六大聲部的常見音域">
<style>line,path,polyline{stroke-linecap:round;stroke-linejoin:round}text{font-family:'Source Han Serif TW',serif}</style>
<rect width="760" height="366" fill="#f7f3ee"/>
<rect x="14" y="76" width="732" height="274" rx="14" fill="#fff" stroke="#d9d2c9" stroke-width="1"/>
<text x="30.0" y="40.0" font-size="19" text-anchor="start" fill="#2b2722" font-weight="700">六大聲部的常見音域</text>
<text x="30.0" y="62.0" font-size="12.5" text-anchor="start" fill="#8a8078" font-weight="400">橫軸是對數刻度，同一個八度佔一樣寬</text>
<text x="28.0" y="114.0" font-size="11.5" text-anchor="start" fill="#2b2722" font-weight="400">女高音 Soprano</text>
<rect x="456.4" y="102.0" width="225.5" height="16.0" rx="4" fill="#A67C52" stroke="none" stroke-width="1.4"/>
<text x="689.9" y="114.0" font-size="10" text-anchor="start" fill="#8a8078" font-weight="400">C4–C6</text>
<text x="28.0" y="146.0" font-size="11.5" text-anchor="start" fill="#2b2722" font-weight="400">女中音 Mezzo</text>
<rect x="428.3" y="134.0" width="225.4" height="16.0" rx="4" fill="#A67C52" stroke="none" stroke-width="1.4"/>
<text x="661.7" y="146.0" font-size="10" text-anchor="start" fill="#8a8078" font-weight="400">A3–A5</text>
<text x="28.0" y="178.0" font-size="11.5" text-anchor="start" fill="#2b2722" font-weight="400">女低音 Contralto</text>
<rect x="390.7" y="166.0" width="225.5" height="16.0" rx="4" fill="#A67C52" stroke="none" stroke-width="1.4"/>
<text x="624.1" y="178.0" font-size="10" text-anchor="start" fill="#8a8078" font-weight="400">F3–F5</text>
<text x="28.0" y="210.0" font-size="11.5" text-anchor="start" fill="#2b2722" font-weight="400">男高音 Tenor</text>
<rect x="343.7" y="198.0" width="225.5" height="16.0" rx="4" fill="#A67C52" stroke="none" stroke-width="1.4"/>
<text x="577.2" y="210.0" font-size="10" text-anchor="start" fill="#8a8078" font-weight="400">C3–C5</text>
<text x="28.0" y="242.0" font-size="11.5" text-anchor="start" fill="#2b2722" font-weight="400">男中音 Baritone</text>
<rect x="315.6" y="230.0" width="225.4" height="16.0" rx="4" fill="#A67C52" stroke="none" stroke-width="1.4"/>
<text x="549.0" y="242.0" font-size="10" text-anchor="start" fill="#8a8078" font-weight="400">A2–A4</text>
<text x="28.0" y="274.0" font-size="11.5" text-anchor="start" fill="#2b2722" font-weight="400">男低音 Bass</text>
