<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="100%" role="img" aria-label="常見樂器的實際音域">
<rect width="760" height="380" fill="#f7f3ee"/>
<text x="28.0" y="40.0" font-size="19" text-anchor="start" fill="#2b2722" font-weight="700">常見樂器的實際音域</text>
<text x="28.0" y="62.0" font-size="12.5" text-anchor="start" fill="#8a8078" font-weight="400">橫軸是對數刻度；同一個八度佔一樣寬</text>
<text x="28.0" y="112.0" font-size="12" text-anchor="start" fill="#2b2722" font-weight="400">長笛 Flute</text>
<rect x="440.7" y="101.0" width="194.5" height="14.0" rx="3" fill="#A67C52" stroke="none" stroke-width="1.4"/>
<text x="643.2" y="112.0" font-size="10.5" text-anchor="#8a8078" fill="#2b2722" font-weight="400">C4–C7</text>
<text x="28.0" y="142.0" font-size="12" text-anchor="start" fill="#2b2722" font-weight="400">小提琴 Violin</text>
<rect x="413.7" y="131.0" width="259.3" height="14.0" rx="3" fill="#A67C52" stroke="none" stroke-width="1.4"/>
<text x="681.0" y="142.0" font-size="10.5" text-anchor="#8a8078" fill="#2b2722" font-weight="400">G3–G7</text>
<text x="28.0" y="172.0" font-size="12" text-anchor="start" fill="#2b2722" font-weight="400">單簧管 Clarinet</text>
<rect x="386.6" y="161.0" width="221.5" height="14.0" rx="3" fill="#A67C52" stroke="none" stroke-width="1.4"/>
<text x="616.2" y="172.0" font-size="10.5" text-anchor="#8a8078" fill="#2b2722" font-weight="400">D3–G6</text>
<text x="28.0" y="202.0" font-size="12" text-anchor="start" fill="#2b2722" font-weight="400">小號 Trumpet</text>
<rect x="397.5" y="191.0" width="183.7" height="14.0" rx="3" fill="#A67C52" stroke="none" stroke-width="1.4"/>
<text x="589.2" y="202.0" font-size="10.5" text-anchor="#8a8078" fill="#2b2722" font-weight="400">E3–D6</text>
<text x="28.0" y="232.0" font-size="12" text-anchor="start" fill="#2b2722" font-weight="400">大提琴 Cello</text>
<rect x="311.0" y="221.0" width="259.3" height="14.0" rx="3" fill="#A67C52" stroke="none" stroke-width="1.4"/>
<text x="578.3" y="232.0" font-size="10.5" text-anchor="#8a8078" fill="#2b2722" font-weight="400">C2–C6</text>
<text x="28.0" y="262.0" font-size="12" text-anchor="start" fill="#2b2722" font-weight="400">吉他 Guitar</text>
<rect x="332.6" y="251.0" width="259.3" height="14.0" rx="3" fill="#A67C52" stroke="none" stroke-width="1.4"/>
<text x="600.0" y="262.0" font-size="10.5" text-anchor="#8a8078" fill="#2b2722" font-weight="400">E2–E6</text>
<text x="28.0" y="292.0" font-size="12" text-anchor="start" fill="#2b2722" font-weight="400">低音管 Bassoon</text>
<rect x="300.3" y="281.0" width="216.0" height="14.0" rx="3" fill="#A67C52" stroke="none" stroke-width="1.4"/>
<text x="524.3" y="292.0" font-size="10.5" text-anchor="#8a8078" fill="#2b2722" font-weight="400">Bb1–D5</text>
<text x="28.0" y="322.0" font-size="12" text-anchor="start" fill="#2b2722" font-weight="400">低音提琴 Bass</text>
<rect x="267.8" y="311.0" width="210.7" height="14.0" rx="3" fill="#A67C52" stroke="none" stroke-width="1.4"/>
<text x="486.5" y="322.0" font-size="10.5" text-anchor="#8a8078" fill="#2b2722" font-weight="400">E1–G4</text>
<line x1="246.2" y1="96.0" x2="246.2" y2="336.0" stroke="#d9d2c9" stroke-width="1"/>
<text x="246.2" y="360.0" font-size="10.5" text-anchor="middle" fill="#8a8078" font-weight="400">C1</text>
<line x1="311.0" y1="96.0" x2="311.0" y2="336.0" stroke="#d9d2c9" stroke-width="1"/>
<text x="311.0" y="360.0" font-size="10.5" text-anchor="middle" fill="#8a8078" font-weight="400">C2</text>
<line x1="375.9" y1="96.0" x2="375.9" y2="336.0" stroke="#d9d2c9" stroke-width="1"/>
<text x="375.9" y="360.0" font-size="10.5" text-anchor="middle" fill="#8a8078" font-weight="400">C3</text>
<line x1="440.7" y1="96.0" x2="440.7" y2="336.0" stroke="#d9d2c9" stroke-width="1"/>
<text x="440.7" y="360.0" font-size="10.5" text-anchor="middle" fill="#8a8078" font-weight="400">C4</text>
<line x1="505.5" y1="96.0" x2="505.5" y2="336.0" stroke="#d9d2c9" stroke-width="1"/>
<text x="505.5" y="360.0" font-size="10.5" text-anchor="middle" fill="#8a8078" font-weight="400">C5</text>
<line x1="570.3" y1="96.0" x2="570.3" y2="336.0" stroke="#d9d2c9" stroke-width="1"/>
<text x="570.3" y="360.0" font-size="10.5" text-anchor="middle" fill="#8a8078" font-weight="400">C6</text>
<line x1="635.2" y1="96.0" x2="635.2" y2="336.0" stroke="#d9d2c9" stroke-width="1"/>
<text x="635.2" y="360.0" font-size="10.5" text-anchor="middle" fill="#8a8078" font-weight="400">C7</text>
<text x="704.0" y="96.0" font-size="11" text-anchor="start" fill="#2b2722" font-weight="400"></text>
<text x="28.0" y="362.0" font-size="11.5" text-anchor="start" fill="#8a8078" font-weight="400">各樂器實際可演奏範圍因型號與演奏者而異，此為常見範圍。</text>
</svg>
