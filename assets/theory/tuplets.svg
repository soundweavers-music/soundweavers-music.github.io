<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" width="100%" role="img" aria-label="三連音：不在家族裡的長度">
<style>line,path,polyline{stroke-linecap:round;stroke-linejoin:round}text{font-family:'Source Han Serif TW',serif}</style>
<rect width="760" height="320" fill="#f7f3ee"/>
<rect x="14" y="76" width="732" height="228" rx="14" fill="#fff" stroke="#d9d2c9" stroke-width="1"/>
<text x="30.0" y="40.0" font-size="19" text-anchor="start" fill="#2b2722" font-weight="700">三連音：不在家族裡的長度</text>
<text x="30.0" y="62.0" font-size="12.5" text-anchor="start" fill="#8a8078" font-weight="400">同樣是一拍，可以被切成 2、3 或 4 份；標記上的數字告訴你切成幾份</text>
<text x="28.0" y="124.0" font-size="12" text-anchor="start" fill="#2b2722" font-weight="700">二等分（八分音符）</text>
<text x="20.0" y="142.0" font-size="9.5" text-anchor="start" fill="#8a8078" font-weight="400">一拍兩個</text>
<line x1="230.0" y1="142.0" x2="670.0" y2="142.0" stroke="#2b2722" stroke-width="1.2"/>
<line x1="340.0" y1="132.0" x2="340.0" y2="142.0" stroke="#8a8078" stroke-width="2.2"/>
<circle cx="340.0" cy="126.0" r="7.0" fill="#f7f3ee" stroke="#8a8078" stroke-width="1.6"/>
<line x1="560.0" y1="132.0" x2="560.0" y2="142.0" stroke="#8a8078" stroke-width="2.2"/>
<circle cx="560.0" cy="126.0" r="7.0" fill="#f7f3ee" stroke="#8a8078" stroke-width="1.6"/>
<text x="684.0" y="146.0" font-size="10" text-anchor="start" fill="#8a8078" font-weight="400">1</text>
<text x="28.0" y="186.0" font-size="12" text-anchor="start" fill="#2b2722" font-weight="700">三連音</text>
<text x="20.0" y="204.0" font-size="9.5" text-anchor="start" fill="#8a8078" font-weight="400">一拍三個</text>
<line x1="230.0" y1="204.0" x2="670.0" y2="204.0" stroke="#2b2722" stroke-width="1.2"/>
<line x1="303.3" y1="194.0" x2="303.3" y2="204.0" stroke="#A67C52" stroke-width="2.2"/>
<circle cx="303.3" cy="188.0" r="7.0" fill="#A67C52" stroke="#A67C52" stroke-width="1.6"/>
<line x1="450.0" y1="194.0" x2="450.0" y2="204.0" stroke="#A67C52" stroke-width="2.2"/>
<circle cx="450.0" cy="188.0" r="7.0" fill="#A67C52" stroke="#A67C52" stroke-width="1.6"/>
<line x1="596.7" y1="194.0" x2="596.7" y2="204.0" stroke="#A67C52" stroke-width="2.2"/>
<circle cx="596.7" cy="188.0" r="7.0" fill="#A67C52" stroke="#A67C52" stroke-width="1.6"/>
<text x="450.0" y="174.0" font-size="13" text-anchor="middle" fill="#A67C52" font-weight="700">3</text>
<text x="684.0" y="208.0" font-size="10" text-anchor="start" fill="#8a8078" font-weight="400">1</text>
<text x="28.0" y="248.0" font-size="12" text-anchor="start" fill="#2b2722" font-weight="700">四等分（十六分音符）</text>
<text x="20.0" y="266.0" font-size="9.5" text-anchor="start" fill="#8a8078" font-weight="400">一拍四個</text>
<line x1="230.0" y1="266.0" x2="670.0" y2="266.0" stroke="#2b2722" stroke-width="1.2"/>
<line x1="285.0" y1="256.0" x2="285.0" y2="266.0" stroke="#8a8078" stroke-width="2.2"/>
<circle cx="285.0" cy="250.0" r="7.0" fill="#f7f3ee" stroke="#8a8078" stroke-width="1.6"/>
<line x1="395.0" y1="256.0" x2="395.0" y2="266.0" stroke="#8a8078" stroke-width="2.2"/>
<circle cx="395.0" cy="250.0" r="7.0" fill="#f7f3ee" stroke="#8a8078" stroke-width="1.6"/>
<line x1="505.0" y1="256.0" x2="505.0" y2="266.0" stroke="#8a8078" stroke-width="2.2"/>
<circle cx="505.0" cy="250.0" r="7.0" fill="#f7f3ee" stroke="#8a8078" stroke-width="1.6"/>
<line x1="615.0" y1="256.0" x2="615.0" y2="266.0" stroke="#8a8078" stroke-width="2.2"/>
<circle cx="615.0" cy="250.0" r="7.0" fill="#f7f3ee" stroke="#8a8078" stroke-width="1.6"/>
<text x="684.0" y="270.0" font-size="10" text-anchor="start" fill="#8a8078" font-weight="400">1</text>
<text x="28.0" y="306.0" font-size="11.5" text-anchor="start" fill="#8a8078" font-weight="400">三連音不屬於「砍一半」的家族，它是把一拍平均切成三份。</text>
</svg>
