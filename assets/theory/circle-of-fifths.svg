<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 450" width="100%" role="img" aria-label="五度圈：所有調的地圖">
<rect width="760" height="450" fill="#f7f3ee"/>
<text x="28.0" y="40.0" font-size="19" text-anchor="start" fill="#2b2722" font-weight="700">五度圈：所有調的地圖</text>
<text x="28.0" y="62.0" font-size="12.5" text-anchor="start" fill="#8a8078" font-weight="400">順時針每走一格多一個升號，逆時針多一個降號；對面的調相差六個記號</text>
