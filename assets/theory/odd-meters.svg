<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" width="100%" role="img" aria-label="不對稱拍號：分組決定律動">
<rect width="760" height="350" fill="#f7f3ee"/>
<text x="28.0" y="40.0" font-size="19" text-anchor="start" fill="#2b2722" font-weight="700">不對稱拍號：分組決定律動</text>
<text x="28.0" y="62.0" font-size="12.5" text-anchor="start" fill="#8a8078" font-weight="400">5/4 與 7/8 都是把同樣的音符切成不等長的小組</text>
<text x="28.0" y="104.0" font-size="12" text-anchor="start" fill="#2b2722" font-weight="700">5/4　3 + 2</text>
<text x="28.0" y="124.0" font-size="10" text-anchor="start" fill="#8a8078" font-weight="400">長—長—長、短—短</text>
<circle cx="300.0" cy="112.0" r="11.0" fill="#A67C52" stroke="#A67C52" stroke-width="1.8"/>
<circle cx="330.0" cy="112.0" r="8.0" fill="#f7f3ee" stroke="#8a8078" stroke-width="1.8"/>
<circle cx="360.0" cy="112.0" r="8.0" fill="#f7f3ee" stroke="#8a8078" stroke-width="1.8"/>
<line x1="287.0" y1="132.0" x2="373.0" y2="132.0" stroke="#A67C52" stroke-width="1.1"/>
<text x="330.0" y="148.0" font-size="9.5" text-anchor="middle" fill="#8a8078" font-weight="400">3</text>
<circle cx="410.0" cy="112.0" r="11.0" fill="#A67C52" stroke="#A67C52" stroke-width="1.8"/>
<circle cx="440.0" cy="112.0" r="8.0" fill="#f7f3ee" stroke="#8a8078" stroke-width="1.8"/>
<line x1="397.0" y1="132.0" x2="453.0" y2="132.0" stroke="#A67C52" stroke-width="1.1"/>
<text x="425.0" y="148.0" font-size="9.5" text-anchor="middle" fill="#8a8078" font-weight="400">2</text>
<text x="28.0" y="158.0" font-size="12" text-anchor="start" fill="#2b2722" font-weight="700">5/4　2 + 3</text>
<text x="28.0" y="178.0" font-size="10" text-anchor="start" fill="#8a8078" font-weight="400">短—短、長—長—長</text>
<circle cx="300.0" cy="166.0" r="11.0" fill="#A67C52" stroke="#A67C52" stroke-width="1.8"/>
<circle cx="330.0" cy="166.0" r="8.0" fill="#f7f3ee" stroke="#8a8078" stroke-width="1.8"/>
<line x1="287.0" y1="186.0" x2="343.0" y2="186.0" stroke="#A67C52" stroke-width="1.1"/>
<text x="315.0" y="202.0" font-size="9.5" text-anchor="middle" fill="#8a8078" font-weight="400">2</text>
<circle cx="380.0" cy="166.0" r="11.0" fill="#A67C52" stroke="#A67C52" stroke-width="1.8"/>
<circle cx="410.0" cy="166.0" r="8.0" fill="#f7f3ee" stroke="#8a8078" stroke-width="1.8"/>
<circle cx="440.0" cy="166.0" r="8.0" fill="#f7f3ee" stroke="#8a8078" stroke-width="1.8"/>
<line x1="367.0" y1="186.0" x2="453.0" y2="186.0" stroke="#A67C52" stroke-width="1.1"/>
<text x="410.0" y="202.0" font-size="9.5" text-anchor="middle" fill="#8a8078" font-weight="400">3</text>
<text x="28.0" y="212.0" font-size="12" text-anchor="start" fill="#2b2722" font-weight="700">7/8　3 + 2 + 2</text>
<text x="28.0" y="232.0" font-size="10" text-anchor="start" fill="#8a8078" font-weight="400">巴爾幹舞步：一步長、兩步短</text>
<circle cx="300.0" cy="220.0" r="11.0" fill="#A67C52" stroke="#A67C52" stroke-width="1.8"/>
<circle cx="330.0" cy="220.0" r="8.0" fill="#f7f3ee" stroke="#8a8078" stroke-width="1.8"/>
<circle cx="360.0" cy="220.0" r="8.0" fill="#f7f3ee" stroke="#8a8078" stroke-width="1.8"/>
<line x1="287.0" y1="240.0" x2="373.0" y2="240.0" stroke="#A67C52" stroke-width="1.1"/>
<text x="330.0" y="256.0" font-size="9.5" text-anchor="middle" fill="#8a8078" font-weight="400">3</text>
<circle cx="410.0" cy="220.0" r="11.0" fill="#A67C52" stroke="#A67C52" stroke-width="1.8"/>
<circle cx="440.0" cy="220.0" r="8.0" fill="#f7f3ee" stroke="#8a8078" stroke-width="1.8"/>
<line x1="397.0" y1="240.0" x2="453.0" y2="240.0" stroke="#A67C52" stroke-width="1.1"/>
<text x="425.0" y="256.0" font-size="9.5" text-anchor="middle" fill="#8a8078" font-weight="400">2</text>
<circle cx="490.0" cy="220.0" r="11.0" fill="#A67C52" stroke="#A67C52" stroke-width="1.8"/>
<circle cx="520.0" cy="220.0" r="8.0" fill="#f7f3ee" stroke="#8a8078" stroke-width="1.8"/>
<line x1="477.0" y1="240.0" x2="533.0" y2="240.0" stroke="#A67C52" stroke-width="1.1"/>
<text x="505.0" y="256.0" font-size="9.5" text-anchor="middle" fill="#8a8078" font-weight="400">2</text>
<text x="28.0" y="266.0" font-size="12" text-anchor="start" fill="#2b2722" font-weight="700">7/8　2 + 2 + 3</text>
<text x="28.0" y="286.0" font-size="10" text-anchor="start" fill="#8a8078" font-weight="400">同樣七個音，換一個重音位置</text>
<circle cx="300.0" cy="274.0" r="11.0" fill="#A67C52" stroke="#A67C52" stroke-width="1.8"/>
<circle cx="330.0" cy="274.0" r="8.0" fill="#f7f3ee" stroke="#8a8078" stroke-width="1.8"/>
<line x1="287.0" y1="294.0" x2="343.0" y2="294.0" stroke="#A67C52" stroke-width="1.1"/>
<text x="315.0" y="310.0" font-size="9.5" text-anchor="middle" fill="#8a8078" font-weight="400">2</text>
<circle cx="380.0" cy="274.0" r="11.0" fill="#A67C52" stroke="#A67C52" stroke-width="1.8"/>
<circle cx="410.0" cy="274.0" r="8.0" fill="#f7f3ee" stroke="#8a8078" stroke-width="1.8"/>
<line x1="367.0" y1="294.0" x2="423.0" y2="294.0" stroke="#A67C52" stroke-width="1.1"/>
<text x="395.0" y="310.0" font-size="9.5" text-anchor="middle" fill="#8a8078" font-weight="400">2</text>
<circle cx="460.0" cy="274.0" r="11.0" fill="#A67C52" stroke="#A67C52" stroke-width="1.8"/>
<circle cx="490.0" cy="274.0" r="8.0" fill="#f7f3ee" stroke="#8a8078" stroke-width="1.8"/>
<circle cx="520.0" cy="274.0" r="8.0" fill="#f7f3ee" stroke="#8a8078" stroke-width="1.8"/>
<line x1="447.0" y1="294.0" x2="533.0" y2="294.0" stroke="#A67C52" stroke-width="1.1"/>
<text x="490.0" y="310.0" font-size="9.5" text-anchor="middle" fill="#8a8078" font-weight="400">3</text>
<text x="28.0" y="336.0" font-size="11.5" text-anchor="start" fill="#8a8078" font-weight="400">大圓＝重音；重音落在每一組的第一拍，七個音就會有兩種完全不同的跛腳感。</text>
</svg>
