<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 364" width="100%" role="img" aria-label="四種織體">
<style>line,path,polyline{stroke-linecap:round;stroke-linejoin:round}text{font-family:'Source Han Serif TW',serif}</style>
<rect width="760" height="364" fill="#f7f3ee"/>
<rect x="14" y="76" width="732" height="272" rx="14" fill="#fff" stroke="#d9d2c9" stroke-width="1"/>
<text x="30.0" y="40.0" font-size="19" text-anchor="start" fill="#2b2722" font-weight="700">四種織體</text>
<text x="30.0" y="62.0" font-size="12.5" text-anchor="start" fill="#8a8078" font-weight="400">同樣的旋律，用不同方式疊，聽起來就是完全不同的音樂</text>
<rect x="30.0" y="104.0" width="340.0" height="100.0" rx="10" fill="#fff" stroke="#d9d2c9" stroke-width="1.4"/>
<text x="46.0" y="128.0" font-size="12" text-anchor="start" fill="#2b2722" font-weight="700">單音音樂</text>
<text x="46.0" y="146.0" font-size="9" text-anchor="start" fill="#8a8078" font-weight="400">只有一條旋律，齊唱或齊奏</text>
<line x1="50.0" y1="176.0" x2="330.0" y2="176.0" stroke="#A67C52" stroke-width="2"/>
<circle cx="190.0" cy="176.0" r="5.0" fill="#A67C52" stroke="none" stroke-width="1"/>
<rect x="400.0" y="104.0" width="340.0" height="100.0" rx="10" fill="#fff" stroke="#d9d2c9" stroke-width="1.4"/>
<text x="416.0" y="128.0" font-size="12" text-anchor="start" fill="#2b2722" font-weight="700">複音音樂</text>
<text x="416.0" y="146.0" font-size="9" text-anchor="start" fill="#8a8078" font-weight="400">多條獨立旋律同時走（卡農、賦格）</text>
<line x1="420.0" y1="176.0" x2="700.0" y2="176.0" stroke="#A67C52" stroke-width="2"/>
<line x1="420.0" y1="190.0" x2="700.0" y2="190.0" stroke="#6B8FBF" stroke-width="2"/>
<circle cx="490.0" cy="176.0" r="4.0" fill="#A67C52" stroke="none" stroke-width="1"/>
<circle cx="630.0" cy="190.0" r="4.0" fill="#6B8FBF" stroke="none" stroke-width="1"/>
<rect x="30.0" y="220.0" width="340.0" height="100.0" rx="10" fill="#fff" stroke="#d9d2c9" stroke-width="1.4"/>
<text x="46.0" y="244.0" font-size="12" text-anchor="start" fill="#2b2722" font-weight="700">主調音樂</text>
<text x="46.0" y="262.0" font-size="9" text-anchor="start" fill="#8a8078" font-weight="400">一條旋律＋和弦伴奏（流行歌）</text>
<line x1="50.0" y1="286.0" x2="330.0" y2="286.0" stroke="#A67C52" stroke-width="2"/>
<rect x="70.0" y="296.0" width="26.0" height="12.0" rx="3" fill="#f2e0cc" stroke="#A67C52" stroke-width="1"/>
<rect x="114.0" y="296.0" width="26.0" height="12.0" rx="3" fill="#f2e0cc" stroke="#A67C52" stroke-width="1"/>
<rect x="158.0" y="296.0" width="26.0" height="12.0" rx="3" fill="#f2e0cc" stroke="#A67C52" stroke-width="1"/>
<rect x="202.0" y="296.0" width="26.0" height="12.0" rx="3" fill="#f2e0cc" stroke="#A67C52" stroke-width="1"/>
<rect x="246.0" y="296.0" width="26.0" height="12.0" rx="3" fill="#f2e0cc" stroke="#A67C52" stroke-width="1"/>
<rect x="290.0" y="296.0" width="26.0" height="12.0" rx="3" fill="#f2e0cc" stroke="#A67C52" stroke-width="1"/>
<rect x="400.0" y="220.0" width="340.0" height="100.0" rx="10" fill="#fff" stroke="#d9d2c9" stroke-width="1.4"/>
<text x="416.0" y="244.0" font-size="12" text-anchor="start" fill="#2b2722" font-weight="700">異音音樂</text>
<text x="416.0" y="262.0" font-size="9" text-anchor="start" fill="#8a8078" font-weight="400">同一條旋律，各自加裝飾（國樂、甘美朗）</text>
<line x1="420.0" y1="292.0" x2="700.0" y2="292.0" stroke="#A67C52" stroke-width="2"/>
<path d="M 430 304 q 10 -8 20 0 q 10 8 20 0 q 10 -8 20 0" fill="none" stroke="#6B8FBF" stroke-width="1.6"/>
<path d="M 480 304 q 10 -8 20 0 q 10 8 20 0 q 10 -8 20 0" fill="none" stroke="#6B8FBF" stroke-width="1.6"/>
<text x="28.0" y="348.0" font-size="11" text-anchor="start" fill="#8a8078" font-weight="400">判斷織體只要問一句：你的耳朵在「跟著一條線」，還是在「聽好幾條線」？</text>
</svg>
