<text x="686.0" y="216.0" font-size="10" text-anchor="middle" fill="#A67C52" font-weight="400">B♭</text>
<text x="400.0" y="288.0" font-size="10" text-anchor="start" fill="#8a8078" font-weight="400">同一個家，三個音不同</text>
<text x="28.0" y="324.0" font-size="11" text-anchor="start" fill="#8a8078" font-weight="400">一個換重心（同調號），一個換顏色（同主音）——這兩種親戚最常用來轉調。</text>
