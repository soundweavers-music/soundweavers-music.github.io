<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="100%" role="img" aria-label="弦與管怎麼控制音高">
<rect width="760" height="380" fill="#f7f3ee"/>
<text x="28.0" y="40.0" font-size="19" text-anchor="start" fill="#2b2722" font-weight="700">弦與管怎麼控制音高</text>
<text x="28.0" y="62.0" font-size="12.5" text-anchor="start" fill="#8a8078" font-weight="400">兩者共用同一個物理法則：振動的長度減半，頻率就加倍</text>
<text x="28.0" y="96.0" font-size="12.5" text-anchor="start" fill="#2b2722" font-weight="700">弦：按弦把有效弦長縮短，音就變高</text>
<line x1="120.0" y1="132.0" x2="540.0" y2="132.0" stroke="#2b2722" stroke-width="2.4"/>
<circle cx="120.0" cy="132.0" r="4.2" fill="#A67C52" stroke="none" stroke-width="1.4"/>
<text x="550.0" y="136.0" font-size="10.5" text-anchor="start" fill="#8a8078" font-weight="400">全弦＝C</text>
<line x1="120.0" y1="166.0" x2="330.0" y2="166.0" stroke="#2b2722" stroke-width="2.4"/>
<circle cx="120.0" cy="166.0" r="4.2" fill="#A67C52" stroke="none" stroke-width="1.4"/>
<text x="340.0" y="170.0" font-size="10.5" text-anchor="start" fill="#8a8078" font-weight="400">一半＝高八度</text>
<line x1="120.0" y1="200.0" x2="225.0" y2="200.0" stroke="#2b2722" stroke-width="2.4"/>
<circle cx="120.0" cy="200.0" r="4.2" fill="#A67C52" stroke="none" stroke-width="1.4"/>
<text x="235.0" y="204.0" font-size="10.5" text-anchor="start" fill="#8a8078" font-weight="400">四分之一＝再高八度</text>
<text x="28.0" y="254.0" font-size="12.5" text-anchor="start" fill="#2b2722" font-weight="700">氣柱：開孔改變有效管長，音就變高</text>
<rect x="120.0" y="277.0" width="420.0" height="18.0" rx="3" fill="#f7f3ee" stroke="#2b2722" stroke-width="1.4"/>
<text x="550.0" y="290.0" font-size="10.5" text-anchor="start" fill="#8a8078" font-weight="400">全管＝C</text>
<rect x="120.0" y="313.0" width="210.0" height="18.0" rx="3" fill="#f7f3ee" stroke="#2b2722" stroke-width="1.4"/>
<text x="340.0" y="326.0" font-size="10.5" text-anchor="start" fill="#8a8078" font-weight="400">一半＝高八度</text>
<text x="28.0" y="362.0" font-size="11.5" text-anchor="start" fill="#8a8078" font-weight="400">弦的張力與粗細、管子的開口與形狀也會影響音高；長度是最直接的那個旋鈕。</text>
</svg>
