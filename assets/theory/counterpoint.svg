<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="100%" role="img" aria-label="對位：兩條旋律的三種關係">
<style>line,path,polyline{stroke-linecap:round;stroke-linejoin:round}text{font-family:'Source Han Serif TW',serif}</style>
<rect width="760" height="330" fill="#f7f3ee"/>
<rect x="14" y="76" width="732" height="238" rx="14" fill="#fff" stroke="#d9d2c9" stroke-width="1"/>
<text x="30.0" y="40.0" font-size="19" text-anchor="start" fill="#2b2722" font-weight="700">對位：兩條旋律的三種關係</text>
<text x="30.0" y="62.0" font-size="12.5" text-anchor="start" fill="#8a8078" font-weight="400">每一條都要能獨立被聽見，同時又不能互相打結</text>
<text x="50.0" y="100.0" font-size="12.5" text-anchor="start" fill="#2b2722" font-weight="700">同向</text>
<text x="50.0" y="118.0" font-size="9" text-anchor="start" fill="#8a8078" font-weight="400">兩條一起走，容易糊在一起</text>
<polyline points="50.0,180.0 102.0,154.0 154.0,128.0 206.0,102.0" fill="none" stroke="#A67C52" stroke-width="2"/>
<polyline points="50.0,210.0 102.0,184.0 154.0,158.0 206.0,132.0" fill="none" stroke="#6B8FBF" stroke-width="2"/>
<circle cx="50.0" cy="180.0" r="4.0" fill="#A67C52" stroke="none" stroke-width="1"/>
<circle cx="50.0" cy="210.0" r="4.0" fill="#6B8FBF" stroke="none" stroke-width="1"/>
<circle cx="102.0" cy="154.0" r="4.0" fill="#A67C52" stroke="none" stroke-width="1"/>
<circle cx="102.0" cy="184.0" r="4.0" fill="#6B8FBF" stroke="none" stroke-width="1"/>
<circle cx="154.0" cy="128.0" r="4.0" fill="#A67C52" stroke="none" stroke-width="1"/>
<circle cx="154.0" cy="158.0" r="4.0" fill="#6B8FBF" stroke="none" stroke-width="1"/>
<circle cx="206.0" cy="102.0" r="4.0" fill="#A67C52" stroke="none" stroke-width="1"/>
<circle cx="206.0" cy="132.0" r="4.0" fill="#6B8FBF" stroke="none" stroke-width="1"/>
<text x="294.0" y="100.0" font-size="12.5" text-anchor="start" fill="#2b2722" font-weight="700">反向</text>
<text x="294.0" y="118.0" font-size="9" text-anchor="start" fill="#8a8078" font-weight="400">一條上一條下，層次最清楚</text>
<polyline points="294.0,180.0 346.0,154.0 398.0,128.0 450.0,102.0" fill="none" stroke="#A67C52" stroke-width="2"/>
<polyline points="294.0,210.0 346.0,184.0 398.0,158.0 450.0,132.0" fill="none" stroke="#6B8FBF" stroke-width="2"/>
<circle cx="294.0" cy="180.0" r="4.0" fill="#A67C52" stroke="none" stroke-width="1"/>
<circle cx="294.0" cy="210.0" r="4.0" fill="#6B8FBF" stroke="none" stroke-width="1"/>
<circle cx="346.0" cy="154.0" r="4.0" fill="#A67C52" stroke="none" stroke-width="1"/>
<circle cx="346.0" cy="184.0" r="4.0" fill="#6B8FBF" stroke="none" stroke-width="1"/>
<circle cx="398.0" cy="128.0" r="4.0" fill="#A67C52" stroke="none" stroke-width="1"/>
<circle cx="398.0" cy="158.0" r="4.0" fill="#6B8FBF" stroke="none" stroke-width="1"/>
<circle cx="450.0" cy="102.0" r="4.0" fill="#A67C52" stroke="none" stroke-width="1"/>
<circle cx="450.0" cy="132.0" r="4.0" fill="#6B8FBF" stroke="none" stroke-width="1"/>
<text x="538.0" y="100.0" font-size="12.5" text-anchor="start" fill="#2b2722" font-weight="700">斜向</text>
<text x="538.0" y="118.0" font-size="9" text-anchor="start" fill="#8a8078" font-weight="400">一條不動、一條動</text>
<polyline points="538.0,180.0 590.0,154.0 642.0,128.0 694.0,102.0" fill="none" stroke="#A67C52" stroke-width="2"/>
<polyline points="538.0,210.0 590.0,184.0 642.0,158.0 694.0,132.0" fill="none" stroke="#6B8FBF" stroke-width="2"/>
<circle cx="538.0" cy="180.0" r="4.0" fill="#A67C52" stroke="none" stroke-width="1"/>
<circle cx="538.0" cy="210.0" r="4.0" fill="#6B8FBF" stroke="none" stroke-width="1"/>
<circle cx="590.0" cy="154.0" r="4.0" fill="#A67C52" stroke="none" stroke-width="1"/>
<circle cx="590.0" cy="184.0" r="4.0" fill="#6B8FBF" stroke="none" stroke-width="1"/>
<circle cx="642.0" cy="128.0" r="4.0" fill="#A67C52" stroke="none" stroke-width="1"/>
<circle cx="642.0" cy="158.0" r="4.0" fill="#6B8FBF" stroke="none" stroke-width="1"/>
<circle cx="694.0" cy="102.0" r="4.0" fill="#A67C52" stroke="none" stroke-width="1"/>
<circle cx="694.0" cy="132.0" r="4.0" fill="#6B8FBF" stroke="none" stroke-width="1"/>
<text x="28.0" y="300.0" font-size="11" text-anchor="start" fill="#2b2722" font-weight="400">對位的規則（避免平行五度、跳進後級進解決）都是為了讓兩條線聽得清楚。</text>
<text x="28.0" y="322.0" font-size="11" text-anchor="start" fill="#8a8078" font-weight="400">卡農是持續的模仿；賦格則是把模仿做成有呈示部與插句的建築。</text>
</svg>
