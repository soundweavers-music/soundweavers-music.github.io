<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="100%" role="img" aria-label="七種教會調式：同一組音、七個家">
<rect width="760" height="400" fill="#f7f3ee"/>
<text x="28.0" y="40.0" font-size="19" text-anchor="start" fill="#2b2722" font-weight="700">七種教會調式：同一組音、七個家</text>
<text x="28.0" y="62.0" font-size="12.5" text-anchor="start" fill="#8a8078" font-weight="400">從白鍵的每一個音出發，就得到一種調式；把個性音改掉，調式就消失</text>
<text x="28.0" y="116.0" font-size="11.5" text-anchor="start" fill="#2b2722" font-weight="700">Ionian</text>
<text x="150.0" y="116.0" font-size="11" text-anchor="start" fill="#A67C52" font-weight="700">C</text>
<text x="200.0" y="116.0" font-size="11" text-anchor="middle" fill="#2b2722" font-weight="400">C</text>
<text x="226.0" y="116.0" font-size="11" text-anchor="middle" fill="#2b2722" font-weight="400">D</text>
<text x="252.0" y="116.0" font-size="11" text-anchor="middle" fill="#2b2722" font-weight="400">E</text>
<text x="278.0" y="116.0" font-size="11" text-anchor="middle" fill="#2b2722" font-weight="400">F</text>
<text x="304.0" y="116.0" font-size="11" text-anchor="middle" fill="#2b2722" font-weight="400">G</text>
<text x="330.0" y="116.0" font-size="11" text-anchor="middle" fill="#2b2722" font-weight="400">A</text>
<text x="356.0" y="116.0" font-size="11" text-anchor="middle" fill="#2b2722" font-weight="400">B</text>
<text x="430.0" y="116.0" font-size="10" text-anchor="start" fill="#8a8078" font-weight="400">等於大調</text>
<text x="28.0" y="154.0" font-size="11.5" text-anchor="start" fill="#2b2722" font-weight="700">Dorian</text>
<text x="150.0" y="154.0" font-size="11" text-anchor="start" fill="#A67C52" font-weight="700">D</text>
<text x="200.0" y="154.0" font-size="11" text-anchor="middle" fill="#2b2722" font-weight="400">D</text>
<text x="226.0" y="154.0" font-size="11" text-anchor="middle" fill="#2b2722" font-weight="400">E</text>
<text x="252.0" y="154.0" font-size="11" text-anchor="middle" fill="#2b2722" font-weight="400">F</text>
<text x="278.0" y="154.0" font-size="11" text-anchor="middle" fill="#2b2722" font-weight="400">G</text>
<text x="304.0" y="154.0" font-size="11" text-anchor="middle" fill="#2b2722" font-weight="400">A</text>
<text x="330.0" y="154.0" font-size="11" text-anchor="middle" fill="#A67C52" font-weight="700">B</text>
<line x1="321.0" y1="158.0" x2="339.0" y2="158.0" stroke="#A67C52" stroke-width="1.6"/>
<text x="356.0" y="154.0" font-size="11" text-anchor="middle" fill="#2b2722" font-weight="400">C</text>
<text x="430.0" y="154.0" font-size="10" text-anchor="start" fill="#8a8078" font-weight="400">小調但第六音不降</text>
<text x="28.0" y="192.0" font-size="11.5" text-anchor="start" fill="#2b2722" font-weight="700">Phrygian</text>
<text x="150.0" y="192.0" font-size="11" text-anchor="start" fill="#A67C52" font-weight="700">E</text>
<text x="200.0" y="192.0" font-size="11" text-anchor="middle" fill="#2b2722" font-weight="400">E</text>
<text x="226.0" y="192.0" font-size="11" text-anchor="middle" fill="#A67C52" font-weight="700">F</text>
<line x1="217.0" y1="196.0" x2="235.0" y2="196.0" stroke="#A67C52" stroke-width="1.6"/>
<text x="252.0" y="192.0" font-size="11" text-anchor="middle" fill="#2b2722" font-weight="400">G</text>
<text x="278.0" y="192.0" font-size="11" text-anchor="middle" fill="#2b2722" font-weight="400">A</text>
<text x="304.0" y="192.0" font-size="11" text-anchor="middle" fill="#2b2722" font-weight="400">B</text>
<text x="330.0" y="192.0" font-size="11" text-anchor="middle" fill="#2b2722" font-weight="400">C</text>
<text x="356.0" y="192.0" font-size="11" text-anchor="middle" fill="#2b2722" font-weight="400">D</text>
<text x="430.0" y="192.0" font-size="10" text-anchor="start" fill="#8a8078" font-weight="400">小調但第二音降</text>
<text x="28.0" y="230.0" font-size="11.5" text-anchor="start" fill="#2b2722" font-weight="700">Lydian</text>
<text x="150.0" y="230.0" font-size="11" text-anchor="start" fill="#A67C52" font-weight="700">F</text>
<text x="200.0" y="230.0" font-size="11" text-anchor="middle" fill="#2b2722" font-weight="400">F</text>
<text x="226.0" y="230.0" font-size="11" text-anchor="middle" fill="#2b2722" font-weight="400">G</text>
<text x="252.0" y="230.0" font-size="11" text-anchor="middle" fill="#2b2722" font-weight="400">A</text>
<text x="278.0" y="230.0" font-size="11" text-anchor="middle" fill="#A67C52" font-weight="700">B</text>
<line x1="269.0" y1="234.0" x2="287.0" y2="234.0" stroke="#A67C52" stroke-width="1.6"/>
<text x="304.0" y="230.0" font-size="11" text-anchor="middle" fill="#2b2722" font-weight="400">C</text>
<text x="330.0" y="230.0" font-size="11" text-anchor="middle" fill="#2b2722" font-weight="400">D</text>
<text x="356.0" y="230.0" font-size="11" text-anchor="middle" fill="#2b2722" font-weight="400">E</text>
<text x="430.0" y="230.0" font-size="10" text-anchor="start" fill="#8a8078" font-weight="400">大調但第四音升</text>
<text x="28.0" y="268.0" font-size="11.5" text-anchor="start" fill="#2b2722" font-weight="700">Mixolydian</text>
<text x="150.0" y="268.0" font-size="11" text-anchor="start" fill="#A67C52" font-weight="700">G</text>
<text x="200.0" y="268.0" font-size="11" text-anchor="middle" fill="#2b2722" font-weight="400">G</text>
<text x="226.0" y="268.0" font-size="11" text-anchor="middle" fill="#2b2722" font-weight="400">A</text>
<text x="252.0" y="268.0" font-size="11" text-anchor="middle" fill="#2b2722" font-weight="400">B</text>
<text x="278.0" y="268.0" font-size="11" text-anchor="middle" fill="#2b2722" font-weight="400">C</text>
<text x="304.0" y="268.0" font-size="11" text-anchor="middle" fill="#2b2722" font-weight="400">D</text>
<text x="330.0" y="268.0" font-size="11" text-anchor="middle" fill="#2b2722" font-weight="400">E</text>
<text x="356.0" y="268.0" font-size="11" text-anchor="middle" fill="#A67C52" font-weight="700">F</text>
<line x1="347.0" y1="272.0" x2="365.0" y2="272.0" stroke="#A67C52" stroke-width="1.6"/>
<text x="430.0" y="268.0" font-size="10" text-anchor="start" fill="#8a8078" font-weight="400">大調但第七音降</text>
<text x="28.0" y="306.0" font-size="11.5" text-anchor="start" fill="#2b2722" font-weight="700">Aeolian</text>
<text x="150.0" y="306.0" font-size="11" text-anchor="start" fill="#A67C52" font-weight="700">A</text>
<text x="200.0" y="306.0" font-size="11" text-anchor="middle" fill="#2b2722" font-weight="400">A</text>
<text x="226.0" y="306.0" font-size="11" text-anchor="middle" fill="#2b2722" font-weight="400">B</text>
<text x="252.0" y="306.0" font-size="11" text-anchor="middle" fill="#2b2722" font-weight="400">C</text>
<text x="278.0" y="306.0" font-size="11" text-anchor="middle" fill="#2b2722" font-weight="400">D</text>
<text x="304.0" y="306.0" font-size="11" text-anchor="middle" fill="#2b2722" font-weight="400">E</text>
<text x="330.0" y="306.0" font-size="11" text-anchor="middle" fill="#2b2722" font-weight="400">F</text>
<text x="356.0" y="306.0" font-size="11" text-anchor="middle" fill="#2b2722" font-weight="400">G</text>
<text x="430.0" y="306.0" font-size="10" text-anchor="start" fill="#8a8078" font-weight="400">等於自然小調</text>
<text x="28.0" y="344.0" font-size="11.5" text-anchor="start" fill="#2b2722" font-weight="700">Locrian</text>
<text x="150.0" y="344.0" font-size="11" text-anchor="start" fill="#A67C52" font-weight="700">B</text>
<text x="200.0" y="344.0" font-size="11" text-anchor="middle" fill="#2b2722" font-weight="400">B</text>
<text x="226.0" y="344.0" font-size="11" text-anchor="middle" fill="#2b2722" font-weight="400">C</text>
<text x="252.0" y="344.0" font-size="11" text-anchor="middle" fill="#2b2722" font-weight="400">D</text>
<text x="278.0" y="344.0" font-size="11" text-anchor="middle" fill="#2b2722" font-weight="400">E</text>
<text x="304.0" y="344.0" font-size="11" text-anchor="middle" fill="#A67C52" font-weight="700">F</text>
<line x1="295.0" y1="348.0" x2="313.0" y2="348.0" stroke="#A67C52" stroke-width="1.6"/>
<text x="330.0" y="344.0" font-size="11" text-anchor="middle" fill="#2b2722" font-weight="400">G</text>
<text x="356.0" y="344.0" font-size="11" text-anchor="middle" fill="#2b2722" font-weight="400">A</text>
<text x="430.0" y="344.0" font-size="10" text-anchor="start" fill="#8a8078" font-weight="400">第五音降，最不穩定</text>
<text x="28.0" y="388.0" font-size="11" text-anchor="start" fill="#8a8078" font-weight="400">七個調式都是同一組白鍵，只是把不同的音當家；標成棕色的就是它的「個性音」。</text>
</svg>
