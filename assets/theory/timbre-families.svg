<text x="28.0" y="62.0" font-size="12.5" text-anchor="start" fill="#8a8078" font-weight="400">敲擊類起音快、衰減快；持續類可以維持不墜</text>
<text x="28.0" y="96.0" font-size="12" text-anchor="start" fill="#2b2722" font-weight="400">同一個敲擊動作，振動體不同，能量留下來的形狀就不同。</text>
