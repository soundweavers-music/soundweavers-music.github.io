<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="100%" role="img" aria-label="全音與半音：樓梯的高度差">
<style>line,path,polyline{stroke-linecap:round;stroke-linejoin:round}text{font-family:'Source Han Serif TW',serif}</style>
<rect width="760" height="340" fill="#f7f3ee"/>
<rect x="14" y="76" width="732" height="248" rx="14" fill="#fff" stroke="#d9d2c9" stroke-width="1"/>
<text x="30.0" y="40.0" font-size="19" text-anchor="start" fill="#2b2722" font-weight="700">全音與半音：樓梯的高度差</text>
<text x="30.0" y="62.0" font-size="12.5" text-anchor="start" fill="#8a8078" font-weight="400">半音是最小的一格；兩個半音黏起來就是一個全音</text>
<text x="28.0" y="106.0" font-size="12" text-anchor="start" fill="#2b2722" font-weight="400">把一個八度攤平：12 個半音，白鍵 7 個、黑鍵 5 個。</text>
<rect x="52.0" y="140.0" width="51.0" height="78.0" rx="3" fill="#fff" stroke="#d9d2c9" stroke-width="1.4"/>
<text x="77.5" y="186.0" font-size="12" text-anchor="middle" fill="#2b2722" font-weight="700">C</text>
<rect x="106.0" y="140.0" width="51.0" height="78.0" rx="3" fill="#2b2722" stroke="#d9d2c9" stroke-width="1.4"/>
<text x="131.5" y="186.0" font-size="12" text-anchor="middle" fill="#fff" font-weight="700">C♯</text>
<rect x="160.0" y="140.0" width="51.0" height="78.0" rx="3" fill="#fff" stroke="#d9d2c9" stroke-width="1.4"/>
<text x="185.5" y="186.0" font-size="12" text-anchor="middle" fill="#2b2722" font-weight="700">D</text>
<rect x="214.0" y="140.0" width="51.0" height="78.0" rx="3" fill="#2b2722" stroke="#d9d2c9" stroke-width="1.4"/>
<text x="239.5" y="186.0" font-size="12" text-anchor="middle" fill="#fff" font-weight="700">D♯</text>
<rect x="268.0" y="140.0" width="51.0" height="78.0" rx="3" fill="#fff" stroke="#d9d2c9" stroke-width="1.4"/>
<text x="293.5" y="186.0" font-size="12" text-anchor="middle" fill="#2b2722" font-weight="700">E</text>
<rect x="322.0" y="140.0" width="51.0" height="78.0" rx="3" fill="#fff" stroke="#d9d2c9" stroke-width="1.4"/>
<text x="347.5" y="186.0" font-size="12" text-anchor="middle" fill="#2b2722" font-weight="700">F</text>
<rect x="376.0" y="140.0" width="51.0" height="78.0" rx="3" fill="#2b2722" stroke="#d9d2c9" stroke-width="1.4"/>
<text x="401.5" y="186.0" font-size="12" text-anchor="middle" fill="#fff" font-weight="700">F♯</text>
<rect x="430.0" y="140.0" width="51.0" height="78.0" rx="3" fill="#fff" stroke="#d9d2c9" stroke-width="1.4"/>
<text x="455.5" y="186.0" font-size="12" text-anchor="middle" fill="#2b2722" font-weight="700">G</text>
<rect x="484.0" y="140.0" width="51.0" height="78.0" rx="3" fill="#2b2722" stroke="#d9d2c9" stroke-width="1.4"/>
<text x="509.5" y="186.0" font-size="12" text-anchor="middle" fill="#fff" font-weight="700">G♯</text>
<rect x="538.0" y="140.0" width="51.0" height="78.0" rx="3" fill="#fff" stroke="#d9d2c9" stroke-width="1.4"/>
<text x="563.5" y="186.0" font-size="12" text-anchor="middle" fill="#2b2722" font-weight="700">A</text>
<rect x="592.0" y="140.0" width="51.0" height="78.0" rx="3" fill="#2b2722" stroke="#d9d2c9" stroke-width="1.4"/>
<text x="617.5" y="186.0" font-size="12" text-anchor="middle" fill="#fff" font-weight="700">A♯</text>
<rect x="646.0" y="140.0" width="51.0" height="78.0" rx="3" fill="#fff" stroke="#d9d2c9" stroke-width="1.4"/>
<text x="671.5" y="186.0" font-size="12" text-anchor="middle" fill="#2b2722" font-weight="700">B</text>
<line x1="56.0" y1="250.0" x2="144.0" y2="250.0" stroke="#A67C52" stroke-width="1.5"/><polygon points="150.0,250.0 143.2,253.1 143.2,246.9" fill="#A67C52"/>
<text x="56.0" y="272.0" font-size="11" text-anchor="start" fill="#A67C52" font-weight="700">全音＝跨 2 格（2 個半音）</text>
<line x1="272.0" y1="250.0" x2="306.0" y2="250.0" stroke="#A67C52" stroke-width="1.5"/><polygon points="312.0,250.0 305.2,253.1 305.2,246.9" fill="#A67C52"/>
<text x="290.0" y="272.0" font-size="11" text-anchor="start" fill="#A67C52" font-weight="700">半音＝跨 1 格</text>
<text x="30.0" y="318.0" font-size="11" text-anchor="start" fill="#8a8078" font-weight="400">E–F 與 B–C 之間沒有黑鍵，那兩格本來就只有半音。</text>
</svg>
