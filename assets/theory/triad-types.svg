<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" width="100%" role="img" aria-label="四種三和弦：兩層三度的排列組合">
<rect width="760" height="350" fill="#f7f3ee"/>
<text x="28.0" y="40.0" font-size="19" text-anchor="start" fill="#2b2722" font-weight="700">四種三和弦：兩層三度的排列組合</text>
<text x="28.0" y="62.0" font-size="12.5" text-anchor="start" fill="#8a8078" font-weight="400">大加小＝大，小加大＝小，大加大＝增，小加小＝減</text>
<rect x="30.0" y="100.0" width="166.0" height="216.0" rx="10" fill="#fff" stroke="#d9d2c9" stroke-width="1.4"/>
<text x="113.0" y="124.0" font-size="12.5" text-anchor="middle" fill="#2b2722" font-weight="700">大三和弦</text>
<text x="113.0" y="142.0" font-size="11" text-anchor="middle" fill="#A67C52" font-weight="700">C</text>
<circle cx="113.0" cy="168.0" r="13.0" fill="#f7f3ee" stroke="#d9d2c9" stroke-width="1.2"/>
<text x="113.0" y="172.0" font-size="10.5" text-anchor="middle" fill="#2b2722" font-weight="400">G</text>
<circle cx="113.0" cy="194.0" r="13.0" fill="#f7f3ee" stroke="#d9d2c9" stroke-width="1.2"/>
<text x="113.0" y="198.0" font-size="10.5" text-anchor="middle" fill="#2b2722" font-weight="400">E</text>
<circle cx="113.0" cy="220.0" r="13.0" fill="#f7f3ee" stroke="#d9d2c9" stroke-width="1.2"/>
<text x="113.0" y="224.0" font-size="10.5" text-anchor="middle" fill="#2b2722" font-weight="400">C</text>
<text x="113.0" y="256.0" font-size="11" text-anchor="middle" fill="#A67C52" font-weight="700">4 + 3</text>
<text x="113.0" y="278.0" font-size="9.5" text-anchor="middle" fill="#8a8078" font-weight="400">亮、穩、最常見</text>
<text x="113.0" y="302.0" font-size="9" text-anchor="middle" fill="#8a8078" font-weight="400">根音＋三度＋五度</text>
<rect x="212.0" y="100.0" width="166.0" height="216.0" rx="10" fill="#fff" stroke="#d9d2c9" stroke-width="1.4"/>
<text x="295.0" y="124.0" font-size="12.5" text-anchor="middle" fill="#2b2722" font-weight="700">小三和弦</text>
<text x="295.0" y="142.0" font-size="11" text-anchor="middle" fill="#A67C52" font-weight="700">Cm</text>
<circle cx="295.0" cy="168.0" r="13.0" fill="#f7f3ee" stroke="#d9d2c9" stroke-width="1.2"/>
<text x="295.0" y="172.0" font-size="10.5" text-anchor="middle" fill="#2b2722" font-weight="400">G</text>
<circle cx="295.0" cy="194.0" r="13.0" fill="#f2e0cc" stroke="#d9d2c9" stroke-width="1.2"/>
<text x="295.0" y="198.0" font-size="10.5" text-anchor="middle" fill="#2b2722" font-weight="400">E♭</text>
<circle cx="295.0" cy="220.0" r="13.0" fill="#f7f3ee" stroke="#d9d2c9" stroke-width="1.2"/>
<text x="295.0" y="224.0" font-size="10.5" text-anchor="middle" fill="#2b2722" font-weight="400">C</text>
<text x="295.0" y="256.0" font-size="11" text-anchor="middle" fill="#A67C52" font-weight="700">3 + 4</text>
<text x="295.0" y="278.0" font-size="9.5" text-anchor="middle" fill="#8a8078" font-weight="400">暗、柔、抒情</text>
<text x="295.0" y="302.0" font-size="9" text-anchor="middle" fill="#8a8078" font-weight="400">根音＋三度＋五度</text>
<rect x="394.0" y="100.0" width="166.0" height="216.0" rx="10" fill="#fff" stroke="#d9d2c9" stroke-width="1.4"/>
<text x="477.0" y="124.0" font-size="12.5" text-anchor="middle" fill="#2b2722" font-weight="700">增三和弦</text>
<text x="477.0" y="142.0" font-size="11" text-anchor="middle" fill="#A67C52" font-weight="700">Caug</text>
<circle cx="477.0" cy="168.0" r="13.0" fill="#f2e0cc" stroke="#d9d2c9" stroke-width="1.2"/>
<text x="477.0" y="172.0" font-size="10.5" text-anchor="middle" fill="#2b2722" font-weight="400">G♯</text>
<circle cx="477.0" cy="194.0" r="13.0" fill="#f7f3ee" stroke="#d9d2c9" stroke-width="1.2"/>
<text x="477.0" y="198.0" font-size="10.5" text-anchor="middle" fill="#2b2722" font-weight="400">E</text>
<circle cx="477.0" cy="220.0" r="13.0" fill="#f7f3ee" stroke="#d9d2c9" stroke-width="1.2"/>
<text x="477.0" y="224.0" font-size="10.5" text-anchor="middle" fill="#2b2722" font-weight="400">C</text>
<text x="477.0" y="256.0" font-size="11" text-anchor="middle" fill="#A67C52" font-weight="700">4 + 4</text>
<text x="477.0" y="278.0" font-size="9.5" text-anchor="middle" fill="#8a8078" font-weight="400">懸浮、不安、過門</text>
<text x="477.0" y="302.0" font-size="9" text-anchor="middle" fill="#8a8078" font-weight="400">根音＋三度＋五度</text>
<rect x="576.0" y="100.0" width="166.0" height="216.0" rx="10" fill="#fff" stroke="#d9d2c9" stroke-width="1.4"/>
<text x="659.0" y="124.0" font-size="12.5" text-anchor="middle" fill="#2b2722" font-weight="700">減三和弦</text>
<text x="659.0" y="142.0" font-size="11" text-anchor="middle" fill="#A67C52" font-weight="700">Cdim</text>
<circle cx="659.0" cy="168.0" r="13.0" fill="#f2e0cc" stroke="#d9d2c9" stroke-width="1.2"/>
<text x="659.0" y="172.0" font-size="10.5" text-anchor="middle" fill="#2b2722" font-weight="400">G♭</text>
<circle cx="659.0" cy="194.0" r="13.0" fill="#f2e0cc" stroke="#d9d2c9" stroke-width="1.2"/>
<text x="659.0" y="198.0" font-size="10.5" text-anchor="middle" fill="#2b2722" font-weight="400">E♭</text>
<circle cx="659.0" cy="220.0" r="13.0" fill="#f7f3ee" stroke="#d9d2c9" stroke-width="1.2"/>
<text x="659.0" y="224.0" font-size="10.5" text-anchor="middle" fill="#2b2722" font-weight="400">C</text>
<text x="659.0" y="256.0" font-size="11" text-anchor="middle" fill="#A67C52" font-weight="700">3 + 3</text>
<text x="659.0" y="278.0" font-size="9.5" text-anchor="middle" fill="#8a8078" font-weight="400">極不穩定，必須解決</text>
<text x="659.0" y="302.0" font-size="9" text-anchor="middle" fill="#8a8078" font-weight="400">根音＋三度＋五度</text>
<text x="28.0" y="336.0" font-size="11" text-anchor="start" fill="#8a8078" font-weight="400">三和弦只差中間那個三度與上面的五度——兩個音就決定了整個顏色。</text>
</svg>
