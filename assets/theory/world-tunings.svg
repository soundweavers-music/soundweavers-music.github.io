<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="100%" role="img" aria-label="十二平均律只是其中一種切法">
<style>line,path,polyline{stroke-linecap:round;stroke-linejoin:round}text{font-family:'Source Han Serif TW',serif}</style>
<rect width="760" height="400" fill="#f7f3ee"/>
<rect x="14" y="76" width="732" height="308" rx="14" fill="#fff" stroke="#d9d2c9" stroke-width="1"/>
<text x="30.0" y="40.0" font-size="19" text-anchor="start" fill="#2b2722" font-weight="700">十二平均律只是其中一種切法</text>
<text x="30.0" y="62.0" font-size="12.5" text-anchor="start" fill="#8a8078" font-weight="400">同一個八度，不同文化切在不同位置上；耳朵會適應，也會聽出不同</text>
<text x="28.0" y="112.0" font-size="11.5" text-anchor="start" fill="#2b2722" font-weight="700">十二平均律</text>
<text x="20.0" y="130.0" font-size="9.5" text-anchor="start" fill="#8a8078" font-weight="400">每個半音都剛好 100 音分，轉調最方便</text>
<line x1="120.0" y1="120.0" x2="690.0" y2="120.0" stroke="#d9d2c9" stroke-width="1"/>
<line x1="120.0" y1="110.0" x2="120.0" y2="130.0" stroke="#A67C52" stroke-width="2"/>
<line x1="167.5" y1="110.0" x2="167.5" y2="130.0" stroke="#A67C52" stroke-width="2"/>
<line x1="215.0" y1="110.0" x2="215.0" y2="130.0" stroke="#A67C52" stroke-width="2"/>
<line x1="262.5" y1="110.0" x2="262.5" y2="130.0" stroke="#A67C52" stroke-width="2"/>
<line x1="310.0" y1="110.0" x2="310.0" y2="130.0" stroke="#A67C52" stroke-width="2"/>
<line x1="357.5" y1="110.0" x2="357.5" y2="130.0" stroke="#A67C52" stroke-width="2"/>
<line x1="405.0" y1="110.0" x2="405.0" y2="130.0" stroke="#A67C52" stroke-width="2"/>
<line x1="452.5" y1="110.0" x2="452.5" y2="130.0" stroke="#A67C52" stroke-width="2"/>
<line x1="500.0" y1="110.0" x2="500.0" y2="130.0" stroke="#A67C52" stroke-width="2"/>
<line x1="547.5" y1="110.0" x2="547.5" y2="130.0" stroke="#A67C52" stroke-width="2"/>
<line x1="595.0" y1="110.0" x2="595.0" y2="130.0" stroke="#A67C52" stroke-width="2"/>
<line x1="642.5" y1="110.0" x2="642.5" y2="130.0" stroke="#A67C52" stroke-width="2"/>
<line x1="690.0" y1="110.0" x2="690.0" y2="130.0" stroke="#A67C52" stroke-width="2"/>
<text x="28.0" y="208.0" font-size="11.5" text-anchor="start" fill="#2b2722" font-weight="700">純律（Just）</text>
<text x="20.0" y="226.0" font-size="9.5" text-anchor="start" fill="#8a8078" font-weight="400">用簡單比例算，三度特別甜，但換調會走音</text>
<line x1="120.0" y1="216.0" x2="690.0" y2="216.0" stroke="#d9d2c9" stroke-width="1"/>
<line x1="120.0" y1="206.0" x2="120.0" y2="226.0" stroke="#6B8FBF" stroke-width="2"/>
<line x1="216.9" y1="206.0" x2="216.9" y2="226.0" stroke="#6B8FBF" stroke-width="2"/>
<line x1="303.4" y1="206.0" x2="303.4" y2="226.0" stroke="#6B8FBF" stroke-width="2"/>
<line x1="356.5" y1="206.0" x2="356.5" y2="226.0" stroke="#6B8FBF" stroke-width="2"/>
<line x1="453.4" y1="206.0" x2="453.4" y2="226.0" stroke="#6B8FBF" stroke-width="2"/>
<line x1="539.9" y1="206.0" x2="539.9" y2="226.0" stroke="#6B8FBF" stroke-width="2"/>
<line x1="636.8" y1="206.0" x2="636.8" y2="226.0" stroke="#6B8FBF" stroke-width="2"/>
<line x1="690.0" y1="206.0" x2="690.0" y2="226.0" stroke="#6B8FBF" stroke-width="2"/>
<text x="28.0" y="304.0" font-size="11.5" text-anchor="start" fill="#2b2722" font-weight="700">甘美朗 Slendro</text>
<text x="20.0" y="322.0" font-size="9.5" text-anchor="start" fill="#8a8078" font-weight="400">一個八度切成五個幾乎等長的小步</text>
<line x1="120.0" y1="312.0" x2="690.0" y2="312.0" stroke="#d9d2c9" stroke-width="1"/>
<line x1="120.0" y1="302.0" x2="120.0" y2="322.0" stroke="#2b2722" stroke-width="2"/>
<line x1="234.0" y1="302.0" x2="234.0" y2="322.0" stroke="#2b2722" stroke-width="2"/>
<line x1="348.0" y1="302.0" x2="348.0" y2="322.0" stroke="#2b2722" stroke-width="2"/>
<line x1="462.0" y1="302.0" x2="462.0" y2="322.0" stroke="#2b2722" stroke-width="2"/>
<line x1="576.0" y1="302.0" x2="576.0" y2="322.0" stroke="#2b2722" stroke-width="2"/>
<line x1="690.0" y1="302.0" x2="690.0" y2="322.0" stroke="#2b2722" stroke-width="2"/>
<line x1="120.0" y1="84.0" x2="120.0" y2="300.0" stroke="#d9d2c9" stroke-width="1" stroke-dasharray="2 6"/>
<text x="120.0" y="338.0" font-size="10" text-anchor="middle" fill="#8a8078" font-weight="400">0</text>
<line x1="215.0" y1="84.0" x2="215.0" y2="300.0" stroke="#d9d2c9" stroke-width="1" stroke-dasharray="2 6"/>
<text x="215.0" y="338.0" font-size="10" text-anchor="middle" fill="#8a8078" font-weight="400">200</text>
<line x1="310.0" y1="84.0" x2="310.0" y2="300.0" stroke="#d9d2c9" stroke-width="1" stroke-dasharray="2 6"/>
<text x="310.0" y="338.0" font-size="10" text-anchor="middle" fill="#8a8078" font-weight="400">400</text>
<line x1="405.0" y1="84.0" x2="405.0" y2="300.0" stroke="#d9d2c9" stroke-width="1" stroke-dasharray="2 6"/>
<text x="405.0" y="338.0" font-size="10" text-anchor="middle" fill="#8a8078" font-weight="400">600</text>
<line x1="500.0" y1="84.0" x2="500.0" y2="300.0" stroke="#d9d2c9" stroke-width="1" stroke-dasharray="2 6"/>
<text x="500.0" y="338.0" font-size="10" text-anchor="middle" fill="#8a8078" font-weight="400">800</text>
<line x1="595.0" y1="84.0" x2="595.0" y2="300.0" stroke="#d9d2c9" stroke-width="1" stroke-dasharray="2 6"/>
<text x="595.0" y="338.0" font-size="10" text-anchor="middle" fill="#8a8078" font-weight="400">1000</text>
<line x1="690.0" y1="84.0" x2="690.0" y2="300.0" stroke="#d9d2c9" stroke-width="1" stroke-dasharray="2 6"/>
<text x="690.0" y="338.0" font-size="10" text-anchor="middle" fill="#8a8078" font-weight="400">1200</text>
<text x="405.0" y="360.0" font-size="10.5" text-anchor="middle" fill="#8a8078" font-weight="400">音分（cent）── 一個八度＝1200 音分</text>
<text x="30.0" y="378.0" font-size="11" text-anchor="start" fill="#8a8078" font-weight="400">圖為概念示意，不同地區與樂團的實際調音仍有差異。</text>
</svg>
