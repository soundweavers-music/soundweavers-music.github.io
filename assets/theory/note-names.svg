<text x="500.0" y="118.0" font-size="13" text-anchor="start" fill="#2b2722" font-weight="700">同一個音，四種寫法。</text>
<text x="500.0" y="140.0" font-size="11.5" text-anchor="start" fill="#8a8078" font-weight="#2b2722">台灣的教材多半用「音名＋唱名」</text>
<text x="500.0" y="158.0" font-size="11.5" text-anchor="start" fill="#8a8078" font-weight="#2b2722">並用，簡譜則常見於流行歌譜。</text>
<text x="500.0" y="186.0" font-size="11.5" text-anchor="start" fill="#8a8078" font-weight="#2b2722">唱名是「相對」的：換一個調，</text>
<text x="500.0" y="204.0" font-size="11.5" text-anchor="start" fill="#8a8078" font-weight="#2b2722">同一個唱名會對到不同的音名。</text>
