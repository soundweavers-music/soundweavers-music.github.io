<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" width="100%" role="img" aria-label="弦的三個旋鈕：長度、張力、質量">
<style>line,path,polyline{stroke-linecap:round;stroke-linejoin:round}text{font-family:'Source Han Serif TW',serif}</style>
<rect width="760" height="350" fill="#f7f3ee"/>
<rect x="14" y="76" width="732" height="258" rx="14" fill="#fff" stroke="#d9d2c9" stroke-width="1"/>
<text x="30.0" y="40.0" font-size="19" text-anchor="start" fill="#2b2722" font-weight="700">弦的三個旋鈕：長度、張力、質量</text>
<text x="30.0" y="62.0" font-size="12.5" text-anchor="start" fill="#8a8078" font-weight="400">頻率 ∝ √(張力／質量) ÷ 長度；實務上最常動的是長度</text>
<text x="28.0" y="96.0" font-size="12" text-anchor="start" fill="#2b2722" font-weight="400">音高由三件事決定，任何一個變動都會改變頻率。</text>
<text x="28.0" y="140.0" font-size="12" text-anchor="start" fill="#2b2722" font-weight="700">長度</text>
<line x1="120.0" y1="136.0" x2="460.0" y2="136.0" stroke="#2b2722" stroke-width="2.6"/>
<line x1="120.0" y1="168.0" x2="250.0" y2="168.0" stroke="#2b2722" stroke-width="2.6"/>
<line x1="470.0" y1="136.0" x2="524.0" y2="136.0" stroke="#A67C52" stroke-width="1.5"/><polygon points="530.0,136.0 523.2,139.1 523.2,132.9" fill="#A67C52"/>
<text x="540.0" y="141.0" font-size="11" text-anchor="start" fill="#A67C52" font-weight="700">弦越短 → 音越高</text>
<text x="120.0" y="190.0" font-size="10" text-anchor="start" fill="#8a8078" font-weight="400">按弦就是這個動作：把有效弦長砍短。</text>
<text x="28.0" y="228.0" font-size="12" text-anchor="start" fill="#2b2722" font-weight="700">張力</text>
<line x1="120.0" y1="224.0" x2="460.0" y2="224.0" stroke="#2b2722" stroke-width="2.6"/>
<line x1="112.0" y1="224.0" x2="66.0" y2="224.0" stroke="#8a8078" stroke-width="1.2"/><polygon points="60.0,224.0 66.8,220.9 66.8,227.1" fill="#8a8078"/>
<line x1="468.0" y1="224.0" x2="514.0" y2="224.0" stroke="#8a8078" stroke-width="1.2"/><polygon points="520.0,224.0 513.2,227.1 513.2,220.9" fill="#8a8078"/>
<line x1="520.0" y1="224.0" x2="574.0" y2="224.0" stroke="#A67C52" stroke-width="1.5"/><polygon points="580.0,224.0 573.2,227.1 573.2,220.9" fill="#A67C52"/>
<text x="590.0" y="229.0" font-size="11" text-anchor="start" fill="#A67C52" font-weight="700">越緊 → 音越高</text>
<text x="28.0" y="292.0" font-size="12" text-anchor="start" fill="#2b2722" font-weight="700">質量</text>
<line x1="120.0" y1="288.0" x2="460.0" y2="288.0" stroke="#2b2722" stroke-width="2.6"/>
<line x1="120.0" y1="306.0" x2="460.0" y2="306.0" stroke="#2b2722" stroke-width="5.2"/>
<text x="472.0" y="292.0" font-size="10" text-anchor="start" fill="#A67C52" font-weight="400">細弦 高</text>
<text x="472.0" y="310.0" font-size="10" text-anchor="start" fill="#8a8078" font-weight="400">粗弦 低</text>
<text x="120.0" y="332.0" font-size="10" text-anchor="start" fill="#8a8078" font-weight="400">同樣長度下，越粗越重，振動越慢。</text>
</svg>
