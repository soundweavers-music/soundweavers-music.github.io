<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" width="100%" role="img" aria-label="音域不是一條線，是三層">
<style>line,path,polyline{stroke-linecap:round;stroke-linejoin:round}text{font-family:'Source Han Serif TW',serif}</style>
<rect width="760" height="350" fill="#f7f3ee"/>
<rect x="14" y="76" width="732" height="258" rx="14" fill="#fff" stroke="#d9d2c9" stroke-width="1"/>
<text x="30.0" y="40.0" font-size="19" text-anchor="start" fill="#2b2722" font-weight="700">音域不是一條線，是三層</text>
<text x="30.0" y="62.0" font-size="12.5" text-anchor="start" fill="#8a8078" font-weight="400">理論、實用、舒適——同一個樂器，三種不同的「極限」</text>
<text x="28.0" y="126.0" font-size="12.5" text-anchor="start" fill="#2b2722" font-weight="700">理論音域</text>
<text x="28.0" y="144.0" font-size="9.5" text-anchor="start" fill="#8a8078" font-weight="400">樂譜寫得出來、樂器做得到</text>
<rect x="258.8" y="118.0" width="422.4" height="24.0" rx="5" fill="#e7d9c8" stroke="none" stroke-width="1.4"/>
<text x="28.0" y="186.0" font-size="12.5" text-anchor="start" fill="#2b2722" font-weight="700">實用音域</text>
<text x="28.0" y="204.0" font-size="9.5" text-anchor="start" fill="#8a8078" font-weight="400">演出與錄音真正會用的</text>
<rect x="329.2" y="178.0" width="299.2" height="24.0" rx="5" fill="#d6c3ab" stroke="none" stroke-width="1.4"/>
<text x="28.0" y="246.0" font-size="12.5" text-anchor="start" fill="#2b2722" font-weight="700">舒適音域</text>
<text x="28.0" y="264.0" font-size="9.5" text-anchor="start" fill="#8a8078" font-weight="400">長時間待著也不累的</text>
<rect x="408.4" y="238.0" width="140.8" height="24.0" rx="5" fill="#A67C52" stroke="none" stroke-width="1.4"/>
<text x="28.0" y="308.0" font-size="11.5" text-anchor="start" fill="#A67C52" font-weight="700">越往裡面，越能長時間待著；把高潮寫在舒適帶上緣，而不是極限。</text>
<text x="30.0" y="328.0" font-size="11" text-anchor="start" fill="#8a8078" font-weight="400">實際數字依樂器、型號與演奏者而異；重點是三層之間的關係。</text>
</svg>
