<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" width="100%" role="img" aria-label="數字低音：轉位的速記法">
<rect width="760" height="320" fill="#f7f3ee"/>
<text x="28.0" y="40.0" font-size="19" text-anchor="start" fill="#2b2722" font-weight="700">數字低音：轉位的速記法</text>
<text x="28.0" y="62.0" font-size="12.5" text-anchor="start" fill="#8a8078" font-weight="400">七和弦有四個位置；低音換人，數字就跟著換</text>
<rect x="40.0" y="104.0" width="158.0" height="176.0" rx="10" fill="#fff" stroke="#d9d2c9" stroke-width="1.4"/>
<text x="119.0" y="128.0" font-size="11.5" text-anchor="middle" fill="#2b2722" font-weight="700">原位</text>
<text x="119.0" y="166.0" font-size="24" text-anchor="middle" fill="#A67C52" font-weight="700">7</text>
<circle cx="119.0" cy="236.0" r="10.0" fill="#A67C52" stroke="#A67C52" stroke-width="1.2"/>
<text x="119.0" y="239.5" font-size="8.5" text-anchor="middle" fill="#fff" font-weight="400">C</text>
<circle cx="119.0" cy="216.0" r="10.0" fill="#f7f3ee" stroke="#d9d2c9" stroke-width="1.2"/>
<text x="119.0" y="219.5" font-size="8.5" text-anchor="middle" fill="#2b2722" font-weight="400">E</text>
<circle cx="119.0" cy="196.0" r="10.0" fill="#f7f3ee" stroke="#d9d2c9" stroke-width="1.2"/>
<text x="119.0" y="199.5" font-size="8.5" text-anchor="middle" fill="#2b2722" font-weight="400">G</text>
<circle cx="119.0" cy="176.0" r="10.0" fill="#f7f3ee" stroke="#d9d2c9" stroke-width="1.2"/>
<text x="119.0" y="179.5" font-size="8.5" text-anchor="middle" fill="#2b2722" font-weight="400">B</text>
<text x="119.0" y="268.0" font-size="9" text-anchor="middle" fill="#8a8078" font-weight="400">低音是根音</text>
<rect x="220.0" y="104.0" width="158.0" height="176.0" rx="10" fill="#fff" stroke="#d9d2c9" stroke-width="1.4"/>
<text x="299.0" y="128.0" font-size="11.5" text-anchor="middle" fill="#2b2722" font-weight="700">第一轉位</text>
<text x="299.0" y="166.0" font-size="24" text-anchor="middle" fill="#A67C52" font-weight="700">6/5</text>
<circle cx="299.0" cy="236.0" r="10.0" fill="#A67C52" stroke="#A67C52" stroke-width="1.2"/>
<text x="299.0" y="239.5" font-size="8.5" text-anchor="middle" fill="#fff" font-weight="400">E</text>
<circle cx="299.0" cy="216.0" r="10.0" fill="#f7f3ee" stroke="#d9d2c9" stroke-width="1.2"/>
<text x="299.0" y="219.5" font-size="8.5" text-anchor="middle" fill="#2b2722" font-weight="400">G</text>
<circle cx="299.0" cy="196.0" r="10.0" fill="#f7f3ee" stroke="#d9d2c9" stroke-width="1.2"/>
<text x="299.0" y="199.5" font-size="8.5" text-anchor="middle" fill="#2b2722" font-weight="400">B</text>
<circle cx="299.0" cy="176.0" r="10.0" fill="#f7f3ee" stroke="#d9d2c9" stroke-width="1.2"/>
<text x="299.0" y="179.5" font-size="8.5" text-anchor="middle" fill="#2b2722" font-weight="400">C</text>
<text x="299.0" y="268.0" font-size="9" text-anchor="middle" fill="#8a8078" font-weight="400">低音是三度</text>
<rect x="400.0" y="104.0" width="158.0" height="176.0" rx="10" fill="#fff" stroke="#d9d2c9" stroke-width="1.4"/>
<text x="479.0" y="128.0" font-size="11.5" text-anchor="middle" fill="#2b2722" font-weight="700">第二轉位</text>
<text x="479.0" y="166.0" font-size="24" text-anchor="middle" fill="#A67C52" font-weight="700">4/3</text>
<circle cx="479.0" cy="236.0" r="10.0" fill="#A67C52" stroke="#A67C52" stroke-width="1.2"/>
<text x="479.0" y="239.5" font-size="8.5" text-anchor="middle" fill="#fff" font-weight="400">G</text>
<circle cx="479.0" cy="216.0" r="10.0" fill="#f7f3ee" stroke="#d9d2c9" stroke-width="1.2"/>
<text x="479.0" y="219.5" font-size="8.5" text-anchor="middle" fill="#2b2722" font-weight="400">B</text>
<circle cx="479.0" cy="196.0" r="10.0" fill="#f7f3ee" stroke="#d9d2c9" stroke-width="1.2"/>
<text x="479.0" y="199.5" font-size="8.5" text-anchor="middle" fill="#2b2722" font-weight="400">C</text>
<circle cx="479.0" cy="176.0" r="10.0" fill="#f7f3ee" stroke="#d9d2c9" stroke-width="1.2"/>
<text x="479.0" y="179.5" font-size="8.5" text-anchor="middle" fill="#2b2722" font-weight="400">E</text>
<text x="479.0" y="268.0" font-size="9" text-anchor="middle" fill="#8a8078" font-weight="400">低音是五度</text>
<rect x="580.0" y="104.0" width="158.0" height="176.0" rx="10" fill="#fff" stroke="#d9d2c9" stroke-width="1.4"/>
<text x="659.0" y="128.0" font-size="11.5" text-anchor="middle" fill="#2b2722" font-weight="700">第三轉位</text>
<text x="659.0" y="166.0" font-size="24" text-anchor="middle" fill="#A67C52" font-weight="700">4/2</text>
<circle cx="659.0" cy="236.0" r="10.0" fill="#A67C52" stroke="#A67C52" stroke-width="1.2"/>
<text x="659.0" y="239.5" font-size="8.5" text-anchor="middle" fill="#fff" font-weight="400">B</text>
<circle cx="659.0" cy="216.0" r="10.0" fill="#f7f3ee" stroke="#d9d2c9" stroke-width="1.2"/>
<text x="659.0" y="219.5" font-size="8.5" text-anchor="middle" fill="#2b2722" font-weight="400">C</text>
<circle cx="659.0" cy="196.0" r="10.0" fill="#f7f3ee" stroke="#d9d2c9" stroke-width="1.2"/>
<text x="659.0" y="199.5" font-size="8.5" text-anchor="middle" fill="#2b2722" font-weight="400">E</text>
<circle cx="659.0" cy="176.0" r="10.0" fill="#f7f3ee" stroke="#d9d2c9" stroke-width="1.2"/>
<text x="659.0" y="179.5" font-size="8.5" text-anchor="middle" fill="#2b2722" font-weight="400">G</text>
<text x="659.0" y="268.0" font-size="9" text-anchor="middle" fill="#8a8078" font-weight="400">低音是七度</text>
<text x="28.0" y="306.0" font-size="11" text-anchor="start" fill="#8a8078" font-weight="400">數字代表「低音上方還剩哪些音程」，不是拍數——看到 6/5 就是第一轉位。</text>
</svg>
