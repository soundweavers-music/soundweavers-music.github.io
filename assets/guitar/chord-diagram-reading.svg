<text x="26" y="404" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="11" fill="#3D3229" text-anchor="start">○ ＝ 空弦：左手不按，但右手要刷到</text>
<text x="26" y="425" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="11" fill="#3D3229" text-anchor="start">✕ ＝ 不刷：和弦外音，右手要避開</text>
<text x="26" y="446" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="11" fill="#3D3229" text-anchor="start">● 裡的數字是建議手指：1 食指、2 中指、3 無名指、4 小指</text>
<text x="26" y="467" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="11" fill="#3D3229" text-anchor="start">最左邊的直線是第 6 弦，最右邊是第 1 弦；最上面那條粗線是上弦枕，往下一格一格數</text>
