<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 338" role="img" aria-label="拿穩 Pick：三個地方會出事">
  <title>拿穩 Pick：三個地方會出事</title>
  <rect width="640" height="338" fill="#FBF8F4"/>
<text x="24" y="34" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="15" fill="#3D3229" text-anchor="start" font-weight="700">拿穩 Pick：三個地方會出事</text>
<text x="24" y="55" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="11.5" fill="#8C8078" text-anchor="start">Pick 拿不穩，刷弦一定卡；先固定握法再談速度</text>
<rect x="24.0" y="84" width="280.0" height="90" rx="10" fill="#F3E9DC" stroke="#C9BCAA"/>
<text x="42.0" y="114" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="20" fill="#A67C52" text-anchor="start" font-weight="700">1</text>
<text x="68.0" y="114" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="12.5" fill="#3D3229" text-anchor="start" font-weight="700">握法</text>
<text x="42.0" y="138" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="10.5" fill="#3D3229" text-anchor="start">食指第一指節側面托住，大拇指指腹垂</text>
<text x="42.0" y="156" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="10.5" fill="#3D3229" text-anchor="start">直蓋上，形成十字</text>
<rect x="320.0" y="84" width="280.0" height="90" rx="10" fill="#F3E9DC" stroke="#C9BCAA"/>
<text x="338.0" y="114" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="20" fill="#A67C52" text-anchor="start" font-weight="700">2</text>
<text x="364.0" y="114" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="12.5" fill="#3D3229" text-anchor="start" font-weight="700">露出長度</text>
<text x="338.0" y="138" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="10.5" fill="#3D3229" text-anchor="start">尖端只露 3～5mm；露太多會卡弦</text>
<text x="338.0" y="156" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="10.5" fill="#3D3229" text-anchor="start">、太少會刮不出聲音</text>
<rect x="24.0" y="188" width="280.0" height="90" rx="10" fill="#F3E9DC" stroke="#C9BCAA"/>
<text x="42.0" y="218" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="20" fill="#A67C52" text-anchor="start" font-weight="700">3</text>
<text x="68.0" y="218" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="12.5" fill="#3D3229" text-anchor="start" font-weight="700">力道</text>
<text x="42.0" y="242" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="10.5" fill="#3D3229" text-anchor="start">三成力，能拿穩不掉就好；捏死會讓整</text>
<text x="42.0" y="260" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="10.5" fill="#3D3229" text-anchor="start">條前臂跟著僵硬</text>
<rect x="320.0" y="188" width="280.0" height="90" rx="10" fill="#F3E9DC" stroke="#C9BCAA"/>
<text x="338.0" y="218" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="20" fill="#A67C52" text-anchor="start" font-weight="700">4</text>
<text x="364.0" y="218" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="12.5" fill="#3D3229" text-anchor="start" font-weight="700">角度</text>
<text x="338.0" y="242" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="10.5" fill="#3D3229" text-anchor="start">稍微斜 15～20 度，用側面切過</text>
<text x="338.0" y="260" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="10.5" fill="#3D3229" text-anchor="start">弦，聲音會圓很多</text>
<text x="24" y="324" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="10.5" fill="#8C8078" text-anchor="start">掉 Pick 通常不是手滑，是握太緊——肌肉一僵，反而更容易掉。</text>
</svg>