<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-label="大三和弦與小三和弦的差別">
  <title>大三與小三：只差中間那顆音</title>
  <rect width="640" height="300" fill="#FBF8F4"/>
<text x="24" y="34" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="15" fill="#3D3229" text-anchor="start" font-weight="700">大三與小三：只差中間那顆音差幾個半音</text>
<text x="24" y="55" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="11.5" fill="#8C8078" text-anchor="start">根音與五音都一樣，只有三音不同——這就是「明亮」與「憂傷」的全部差別</text>
<text x="150" y="113" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="12.5" fill="#3D3229" text-anchor="end" font-weight="700">大三和弦（C）</text>
<rect x="158.0" y="90" width="36" height="36" rx="8" fill="#F3E9DC" stroke="#A67C52"/>
<text x="176" y="113" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="10" fill="#3D3229" text-anchor="middle" font-weight="700">根音</text>
<rect x="262.0" y="90" width="36" height="36" rx="8" fill="#A67C52" stroke="#A67C52"/>
<text x="280" y="113" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="10" fill="#FFFFFF" text-anchor="middle" font-weight="700">三音</text>
<rect x="340.0" y="90" width="36" height="36" rx="8" fill="#A67C52" stroke="#A67C52"/>
<text x="358" y="113" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="10" fill="#FFFFFF" text-anchor="middle" font-weight="700">五音</text>
<path d="M194.0 108 L262.0 108" stroke="#8C8078" stroke-width="1" stroke-dasharray="3 3"/>
<text x="228.0" y="100" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="10" fill="#8C8078" text-anchor="middle">4</text>
<path d="M298.0 108 L340.0 108" stroke="#8C8078" stroke-width="1" stroke-dasharray="3 3"/>
<text x="319.0" y="100" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="10" fill="#8C8078" text-anchor="middle">3</text>
<text x="392" y="113" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="10.5" fill="#8C8078" text-anchor="start">根音 → 4 個半音 → 再 3 個半音</text>
<text x="150" y="197" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="12.5" fill="#3D3229" text-anchor="end" font-weight="700">小三和弦（Cm）</text>
<rect x="158.0" y="174" width="36" height="36" rx="8" fill="#F3E9DC" stroke="#A67C52"/>
<text x="176" y="197" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="10" fill="#3D3229" text-anchor="middle" font-weight="700">根音</text>
<rect x="236.0" y="174" width="36" height="36" rx="8" fill="#A67C52" stroke="#A67C52"/>
<text x="254" y="197" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="10" fill="#FFFFFF" text-anchor="middle" font-weight="700">三音</text>
<rect x="340.0" y="174" width="36" height="36" rx="8" fill="#A67C52" stroke="#A67C52"/>
<text x="358" y="197" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="10" fill="#FFFFFF" text-anchor="middle" font-weight="700">五音</text>
<path d="M194.0 192 L236.0 192" stroke="#8C8078" stroke-width="1" stroke-dasharray="3 3"/>
<text x="215.0" y="184" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="10" fill="#8C8078" text-anchor="middle">3</text>
<path d="M272.0 192 L340.0 192" stroke="#8C8078" stroke-width="1" stroke-dasharray="3 3"/>
<text x="306.0" y="184" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="10" fill="#8C8078" text-anchor="middle">4</text>
<text x="392" y="197" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="10.5" fill="#8C8078" text-anchor="start">根音 → 3 個半音 → 再 4 個半音</text>
<text x="24" y="284" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="10.5" fill="#8C8078" text-anchor="start">把三音降半個音，大三就變成小三；這也是為什麼同一個根音可以有兩種完全不同的情緒。</text>
</svg>