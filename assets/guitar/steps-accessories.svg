<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 442" role="img" aria-label="彈唱必備的五樣東西">
  <title>彈唱必備的五樣東西</title>
  <rect width="640" height="442" fill="#FBF8F4"/>
<text x="24" y="34" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="15" fill="#3D3229" text-anchor="start" font-weight="700">彈唱必備的五樣東西</text>
<text x="24" y="55" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="11.5" fill="#8C8078" text-anchor="start">加起來通常不到琴價的兩成，但少了任何一樣都會卡住</text>
<rect x="24.0" y="84" width="280.0" height="90" rx="10" fill="#F3E9DC" stroke="#C9BCAA"/>
<text x="42.0" y="114" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="20" fill="#A67C52" text-anchor="start" font-weight="700">1</text>
<text x="68.0" y="114" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="12.5" fill="#3D3229" text-anchor="start" font-weight="700">調音器</text>
<text x="42.0" y="138" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="10.5" fill="#3D3229" text-anchor="start">夾式為主；每次拿琴先調，一分鐘就好</text>
<rect x="320.0" y="84" width="280.0" height="90" rx="10" fill="#F3E9DC" stroke="#C9BCAA"/>
<text x="338.0" y="114" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="20" fill="#A67C52" text-anchor="start" font-weight="700">2</text>
<text x="364.0" y="114" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="12.5" fill="#3D3229" text-anchor="start" font-weight="700">Pick</text>
<text x="338.0" y="138" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="10.5" fill="#3D3229" text-anchor="start">三種厚度各一：0.6 刷弦、0.8</text>
<text x="338.0" y="156" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="10.5" fill="#3D3229" text-anchor="start"> 萬用、1.0 練重音</text>
<rect x="24.0" y="188" width="280.0" height="90" rx="10" fill="#F3E9DC" stroke="#C9BCAA"/>
<text x="42.0" y="218" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="20" fill="#A67C52" text-anchor="start" font-weight="700">3</text>
<text x="68.0" y="218" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="12.5" fill="#3D3229" text-anchor="start" font-weight="700">移調夾</text>
<text x="42.0" y="242" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="10.5" fill="#3D3229" text-anchor="start">彈唱一定要有，夾上去就換調</text>
<rect x="320.0" y="188" width="280.0" height="90" rx="10" fill="#F3E9DC" stroke="#C9BCAA"/>
<text x="338.0" y="218" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="20" fill="#A67C52" text-anchor="start" font-weight="700">4</text>
<text x="364.0" y="218" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="12.5" fill="#3D3229" text-anchor="start" font-weight="700">背帶</text>
<text x="338.0" y="242" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="10.5" fill="#3D3229" text-anchor="start">站著彈才需要；坐著彈靠三點支撐</text>
<rect x="24.0" y="292" width="280.0" height="90" rx="10" fill="#F3E9DC" stroke="#C9BCAA"/>
<text x="42.0" y="322" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="20" fill="#A67C52" text-anchor="start" font-weight="700">5</text>
<text x="68.0" y="322" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="12.5" fill="#3D3229" text-anchor="start" font-weight="700">擦拭布</text>
<text x="42.0" y="346" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="10.5" fill="#3D3229" text-anchor="start">每次彈完擦弦，弦的壽命差很多</text>
<text x="24" y="428" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="10.5" fill="#8C8078" text-anchor="start">先不要買效果器或第二把琴；把這五樣準備好，前半年就很夠用。</text>
</svg>