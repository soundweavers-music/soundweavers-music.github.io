<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" role="img" aria-label="左手按弦的位置與角度">
  <title>左手按弦：靠近琴衍、指尖立起</title>
  <rect width="640" height="330" fill="#FBF8F4"/>
<text x="24" y="34" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="15" fill="#3D3229" text-anchor="start" font-weight="700">按弦的兩件事：位置與角度</text>
<text x="24" y="55" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="11.5" fill="#8C8078" text-anchor="start">同一顆音，按對地方不用出力就響；按錯地方再用力也是悶的</text>
<rect x="40" y="96" width="160" height="64" fill="#F7F1E7" stroke="#C9BCAA"/>
<line x1="40" y1="96" x2="200" y2="96" stroke="#8C8078" stroke-width="2.4"/>
<line x1="40" y1="128" x2="200" y2="128" stroke="#8C8078" stroke-width="1"/>
<line x1="40" y1="160" x2="200" y2="160" stroke="#8C8078" stroke-width="1"/>
<line x1="40" y1="160" x2="200" y2="160" stroke="#8C8078" stroke-width="1"/>
<line x1="200" y1="96" x2="200" y2="160" stroke="#3D3229" stroke-width="3"/>
<circle cx="152.0" cy="144" r="9" fill="#A67C52"/>
<text x="120" y="188" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="10.5" fill="#3D3229" text-anchor="middle">○ 正確：貼著琴衍右側</text>
<rect x="240" y="96" width="160" height="64" fill="#F7F1E7" stroke="#C9BCAA"/>
<line x1="240" y1="96" x2="400" y2="96" stroke="#8C8078" stroke-width="2.4"/>
<line x1="240" y1="128" x2="400" y2="128" stroke="#8C8078" stroke-width="1"/>
<line x1="240" y1="160" x2="400" y2="160" stroke="#8C8078" stroke-width="1"/>
<line x1="240" y1="160" x2="400" y2="160" stroke="#8C8078" stroke-width="1"/>
<line x1="400" y1="96" x2="400" y2="160" stroke="#3D3229" stroke-width="3"/>
<circle cx="316.0" cy="144" r="9" fill="#B4553F"/>
<text x="320" y="188" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="10.5" fill="#3D3229" text-anchor="middle">✕ 太中間：要多花一倍力氣</text>
<rect x="440" y="96" width="160" height="64" fill="#F7F1E7" stroke="#C9BCAA"/>
<line x1="440" y1="96" x2="600" y2="96" stroke="#8C8078" stroke-width="2.4"/>
<line x1="440" y1="128" x2="600" y2="128" stroke="#8C8078" stroke-width="1"/>
<line x1="440" y1="160" x2="600" y2="160" stroke="#8C8078" stroke-width="1"/>
<line x1="440" y1="160" x2="600" y2="160" stroke="#8C8078" stroke-width="1"/>
<line x1="600" y1="96" x2="600" y2="160" stroke="#3D3229" stroke-width="3"/>
<circle cx="572.4" cy="144" r="9" fill="#B4553F"/>
<text x="520" y="188" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="10.5" fill="#3D3229" text-anchor="middle">✕ 壓在琴衍上：聲音會死掉</text>
<text x="40" y="240" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="11" fill="#3D3229" text-anchor="start">指尖立起來、從琴頸正上方落下：手指與弦垂直，旁邊的弦才不會被悶到。</text>
<text x="40" y="264" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="11" fill="#3D3229" text-anchor="start">手腕微拱、虎口留空；手掌貼在琴頸上會讓小指伸不出去。</text>
<text x="40" y="314" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="10.5" fill="#8C8078" text-anchor="start">按不響先檢查兩件事：有沒有貼著琴衍、指尖有沒有立起來。力氣通常不是問題。</text>
</svg>