<text x="24" y="242" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="10.5" fill="#8C8078" text-anchor="start">先唸「噠—啊—噠」抓比例，再上琴；用節拍器時把細分設成三連音。</text>
