<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 234" role="img" aria-label="換氣點怎麼標：三個原則">
  <title>換氣點怎麼標：三個原則</title>
  <rect width="640" height="234" fill="#FBF8F4"/>
<text x="24" y="34" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="15" fill="#3D3229" text-anchor="start" font-weight="700">換氣點怎麼標：三個原則</text>
<text x="24" y="55" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="11.5" fill="#8C8078" text-anchor="start">標在譜上，比每次憑感覺可靠</text>
<rect x="24.0" y="84" width="181.33333333333334" height="90" rx="10" fill="#F3E9DC" stroke="#C9BCAA"/>
<text x="42.0" y="114" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="20" fill="#A67C52" text-anchor="start" font-weight="700">1</text>
<text x="68.0" y="114" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="12.5" fill="#3D3229" text-anchor="start" font-weight="700">句尾換氣</text>
<text x="42.0" y="138" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="10.5" fill="#3D3229" text-anchor="start">一個樂句結束的地方標一個「V」</text>
<rect x="221.33333333333334" y="84" width="181.33333333333334" height="90" rx="10" fill="#F3E9DC" stroke="#C9BCAA"/>
<text x="239.33333333333334" y="114" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="20" fill="#A67C52" text-anchor="start" font-weight="700">2</text>
<text x="265.33333333333337" y="114" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="12.5" fill="#3D3229" text-anchor="start" font-weight="700">長音前先吸</text>
<text x="239.33333333333334" y="138" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="10.5" fill="#3D3229" text-anchor="start">遇到兩拍以上的長音，前一小節就要準</text>
<text x="239.33333333333334" y="156" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="10.5" fill="#3D3229" text-anchor="start">備</text>
<rect x="418.6666666666667" y="84" width="181.33333333333334" height="90" rx="10" fill="#F3E9DC" stroke="#C9BCAA"/>
<text x="436.6666666666667" y="114" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="20" fill="#A67C52" text-anchor="start" font-weight="700">3</text>
<text x="462.6666666666667" y="114" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="12.5" fill="#3D3229" text-anchor="start" font-weight="700">不要卡在字中間</text>
<text x="436.6666666666667" y="138" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="10.5" fill="#3D3229" text-anchor="start">換氣點要落在詞與詞之間，不要切斷一</text>
<text x="436.6666666666667" y="156" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="10.5" fill="#3D3229" text-anchor="start">個詞</text>
<text x="24" y="220" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="10.5" fill="#8C8078" text-anchor="start">用鉛筆標、用螢光筆畫都可以；標過一次，下次就不用再想。</text>
</svg>