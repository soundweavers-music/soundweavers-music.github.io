<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 234" role="img" aria-label="節拍器訓練：三階段，每階段 5 分鐘">
  <title>節拍器訓練：三階段，每階段 5 分鐘</title>
  <rect width="640" height="234" fill="#FBF8F4"/>
<text x="24" y="34" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="15" fill="#3D3229" text-anchor="start" font-weight="700">節拍器訓練：三階段，每階段 5 分鐘</text>
<text x="24" y="55" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="11.5" fill="#8C8078" text-anchor="start">先求穩，再求快；跟著節拍器彈對一次，勝過亂彈十次</text>
<rect x="24.0" y="84" width="181.33333333333334" height="90" rx="10" fill="#F3E9DC" stroke="#C9BCAA"/>
<text x="42.0" y="114" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="20" fill="#A67C52" text-anchor="start" font-weight="700">1</text>
<text x="68.0" y="114" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="12.5" fill="#3D3229" text-anchor="start" font-weight="700">只刷正拍</text>
<text x="42.0" y="138" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="10.5" fill="#3D3229" text-anchor="start">60 BPM，一拍一下；每一聲「噠</text>
<text x="42.0" y="156" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="10.5" fill="#3D3229" text-anchor="start">」都要和撥弦同時</text>
<rect x="221.33333333333334" y="84" width="181.33333333333334" height="90" rx="10" fill="#F3E9DC" stroke="#C9BCAA"/>
<text x="239.33333333333334" y="114" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="20" fill="#A67C52" text-anchor="start" font-weight="700">2</text>
<text x="265.33333333333337" y="114" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="12.5" fill="#3D3229" text-anchor="start" font-weight="700">加反拍</text>
<text x="239.33333333333334" y="138" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="10.5" fill="#3D3229" text-anchor="start">同樣 60 BPM，改成一拍兩下，</text>
<text x="239.33333333333334" y="156" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="10.5" fill="#3D3229" text-anchor="start">數 1 and 2 and</text>
<rect x="418.6666666666667" y="84" width="181.33333333333334" height="90" rx="10" fill="#F3E9DC" stroke="#C9BCAA"/>
<text x="436.6666666666667" y="114" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="20" fill="#A67C52" text-anchor="start" font-weight="700">3</text>
<text x="462.6666666666667" y="114" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="12.5" fill="#3D3229" text-anchor="start" font-weight="700">混搭節奏型</text>
<text x="436.6666666666667" y="138" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="10.5" fill="#3D3229" text-anchor="start">用節奏型 3（↓ - ↓↑ - ↑</text>
<text x="436.6666666666667" y="156" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="10.5" fill="#3D3229" text-anchor="start">↓↑），第 3 拍空揮不能亂</text>
<text x="24" y="220" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="10.5" fill="#8C8078" text-anchor="start">跟不上就把速度降到 50；能穩穩彈完兩遍再往上加 5 BPM。</text>
</svg>