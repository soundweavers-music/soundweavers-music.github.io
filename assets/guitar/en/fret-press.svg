<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" role="img" aria-label="Where and at what angle the left hand presses">
  <title>Fretting: next to the fret wire, fingertips upright</title>
  <rect width="640" height="330" fill="#FBF8F4"/>
<text x="24" y="34" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="15" fill="#3D3229" text-anchor="start" font-weight="700">Two things about fretting: where, and at what angle</text>
<text x="24" y="55" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="11.5" fill="#8C8078" text-anchor="start">In the right spot a note rings with no effort; in the wrong spot, more force still sounds dead</text>
<rect x="40" y="96" width="160" height="64" fill="#F7F1E7" stroke="#C9BCAA"/>
<line x1="40" y1="96" x2="200" y2="96" stroke="#8C8078" stroke-width="2.4"/>
<line x1="40" y1="128" x2="200" y2="128" stroke="#8C8078" stroke-width="1"/>
<line x1="40" y1="160" x2="200" y2="160" stroke="#8C8078" stroke-width="1"/>
<line x1="40" y1="160" x2="200" y2="160" stroke="#8C8078" stroke-width="1"/>
<line x1="200" y1="96" x2="200" y2="160" stroke="#3D3229" stroke-width="3"/>
<circle cx="152.0" cy="144" r="9" fill="#A67C52"/>
<text x="120" y="188" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="10.5" fill="#3D3229" text-anchor="middle">○ Correct: next to the fret</text>
<rect x="240" y="96" width="160" height="64" fill="#F7F1E7" stroke="#C9BCAA"/>
<line x1="240" y1="96" x2="400" y2="96" stroke="#8C8078" stroke-width="2.4"/>
<line x1="240" y1="128" x2="400" y2="128" stroke="#8C8078" stroke-width="1"/>
<line x1="240" y1="160" x2="400" y2="160" stroke="#8C8078" stroke-width="1"/>
<line x1="240" y1="160" x2="400" y2="160" stroke="#8C8078" stroke-width="1"/>
<line x1="400" y1="96" x2="400" y2="160" stroke="#3D3229" stroke-width="3"/>
<circle cx="316.0" cy="144" r="9" fill="#B4553F"/>
<text x="320" y="188" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="10.5" fill="#3D3229" text-anchor="middle">✕ Mid-fret: twice the effort</text>
<rect x="440" y="96" width="160" height="64" fill="#F7F1E7" stroke="#C9BCAA"/>
<line x1="440" y1="96" x2="600" y2="96" stroke="#8C8078" stroke-width="2.4"/>
<line x1="440" y1="128" x2="600" y2="128" stroke="#8C8078" stroke-width="1"/>
<line x1="440" y1="160" x2="600" y2="160" stroke="#8C8078" stroke-width="1"/>
<line x1="440" y1="160" x2="600" y2="160" stroke="#8C8078" stroke-width="1"/>
<line x1="600" y1="96" x2="600" y2="160" stroke="#3D3229" stroke-width="3"/>
<circle cx="572.4" cy="144" r="9" fill="#B4553F"/>
<text x="520" y="188" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="10.5" fill="#3D3229" text-anchor="middle">✕ On the fret: the note dies</text>
<text x="40" y="240" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="11" fill="#3D3229" text-anchor="start">Fingertips upright, dropping straight down: at right angles, so the next string still rings</text>
<text x="40" y="264" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="11" fill="#3D3229" text-anchor="start">Wrist slightly arched, a gap at the web; palm against the neck and the little finger can&#x27;t reach</text>
<text x="40" y="314" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="10.5" fill="#8C8078" text-anchor="start">If a note won&#x27;t ring: next to the fret wire, fingertips upright? Force is rarely the problem</text>
</svg>