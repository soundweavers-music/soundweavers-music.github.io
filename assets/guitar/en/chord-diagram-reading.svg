<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 492" role="img" aria-label="How to read a chord diagram, with C as the example">
  <title>How to read a chord diagram</title>
  <rect width="640" height="492" fill="#FBF8F4"/>
<text x="26" y="34" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="16" fill="#3D3229" text-anchor="start" font-weight="700">How to read a chord diagram (a C chord)</text>
<text x="26" y="55" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="11.5" fill="#8C8078" text-anchor="start">The guitar is held upright and seen from the front: left is the 6th string, the top is the headstock</text>
<text x="295.0" y="130" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="13" fill="#3D3229" text-anchor="middle" font-weight="700">C</text>
<line x1="214.0" y1="144" x2="214.0" y2="326.0" stroke="#C9BCAA" stroke-width="1"/>
<line x1="246.4" y1="144" x2="246.4" y2="326.0" stroke="#C9BCAA" stroke-width="1"/>
<line x1="278.8" y1="144" x2="278.8" y2="326.0" stroke="#C9BCAA" stroke-width="1"/>
<line x1="311.2" y1="144" x2="311.2" y2="326.0" stroke="#C9BCAA" stroke-width="1"/>
<line x1="343.6" y1="144" x2="343.6" y2="326.0" stroke="#C9BCAA" stroke-width="1"/>
<line x1="376.0" y1="144" x2="376.0" y2="326.0" stroke="#C9BCAA" stroke-width="1"/>
<line x1="214" y1="144.0" x2="376.0" y2="144.0" stroke="#3D3229" stroke-width="3"/>
<line x1="214" y1="189.5" x2="376.0" y2="189.5" stroke="#C9BCAA" stroke-width="1"/>
<line x1="214" y1="235.0" x2="376.0" y2="235.0" stroke="#C9BCAA" stroke-width="1"/>
<line x1="214" y1="280.5" x2="376.0" y2="280.5" stroke="#C9BCAA" stroke-width="1"/>
<line x1="214" y1="326.0" x2="376.0" y2="326.0" stroke="#C9BCAA" stroke-width="1"/>
<text x="214.0" y="138" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="11" fill="#8C8078" text-anchor="middle">✕</text>
<circle cx="311.2" cy="135" r="3.4" fill="none" stroke="#3D3229" stroke-width="1.2"/>
<circle cx="376.0" cy="135" r="3.4" fill="none" stroke="#3D3229" stroke-width="1.2"/>
<circle cx="246.4" cy="257.8" r="11.0" fill="#A67C52"/>
<text x="246.4" y="261.55" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="10" fill="#FFFFFF" text-anchor="middle" font-weight="700">3</text>
<circle cx="278.8" cy="212.2" r="11.0" fill="#A67C52"/>
<text x="278.8" y="216.05" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="10" fill="#FFFFFF" text-anchor="middle" font-weight="700">2</text>
<circle cx="343.6" cy="166.8" r="11.0" fill="#A67C52"/>
<text x="343.6" y="170.55" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="10" fill="#FFFFFF" text-anchor="middle" font-weight="700">1</text>
<text x="214.0" y="346.0" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="10.5" fill="#8C8078" text-anchor="middle">6</text>
<text x="246.4" y="346.0" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="10.5" fill="#8C8078" text-anchor="middle">5</text>
<text x="278.8" y="346.0" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="10.5" fill="#8C8078" text-anchor="middle">4</text>
<text x="311.2" y="346.0" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="10.5" fill="#8C8078" text-anchor="middle">3</text>
<text x="343.6" y="346.0" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="10.5" fill="#8C8078" text-anchor="middle">2</text>
<text x="376.0" y="346.0" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="10.5" fill="#8C8078" text-anchor="middle">1</text>
<text x="390.0" y="170.75" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="10" fill="#8C8078" text-anchor="start">Fret 1</text>
<text x="390.0" y="216.25" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="10" fill="#8C8078" text-anchor="start">Fret 2</text>
<text x="390.0" y="261.75" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="10" fill="#8C8078" text-anchor="start">Fret 3</text>
<text x="390.0" y="307.25" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="10" fill="#8C8078" text-anchor="start">Fret 4</text>
<path d="M214 128 L214 120" stroke="#8C8078" stroke-width="1"/>
<text x="214" y="114" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="10.5" fill="#3D3229" text-anchor="middle">✕ skip</text>
<path d="M278.8 128 L278.8 120" stroke="#8C8078" stroke-width="1"/>
<text x="278.8" y="114" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="10.5" fill="#3D3229" text-anchor="middle">○ open</text>
<path d="M204 144 L188 144" stroke="#8C8078" stroke-width="1"/>
<text x="184" y="148" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="10.5" fill="#3D3229" text-anchor="end">Nut</text>
<text x="26" y="404" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="11" fill="#3D3229" text-anchor="start">○ = open string: the left hand frets nothing, but the right hand still strums it</text>
<text x="26" y="425" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="11" fill="#3D3229" text-anchor="start">✕ = don&#x27;t strum: a note outside the chord, the right hand skips it</text>
<text x="26" y="446" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="11" fill="#3D3229" text-anchor="start">The number in ● is the suggested finger: 1 index, 2 middle, 3 ring, 4 little</text>
<text x="26" y="467" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="11" fill="#3D3229" text-anchor="start">Leftmost line is the 6th string, rightmost the 1st; the thick top line is the nut, count down fret by fret</text>
</svg>