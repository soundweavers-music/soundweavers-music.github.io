<line x1="313.0" y1="129.0" x2="351.0" y2="129.0" stroke="#8C8078" stroke-width="0.8"/>
<line x1="313.5" y1="139.5" x2="350.5" y2="139.5" stroke="#8C8078" stroke-width="0.8"/>
<circle cx="330" cy="252" r="22" fill="#FBF8F4" stroke="#3D3229" stroke-width="1.5"/>
<rect x="300" y="318" width="60" height="10" rx="2" fill="#DCCDBB" stroke="#3D3229" stroke-width="1"/>
</g>
<path d="M238 250 L150 171" stroke="#8C8078" stroke-width="1" fill="none"/>
<circle cx="238" cy="250" r="5" fill="#A67C52"/>
<text x="140" y="175" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="11.5" fill="#3D3229" text-anchor="end" font-weight="700">① Chest (body back)</text>
<path d="M406 330 L420 368" stroke="#8C8078" stroke-width="1" fill="none"/>
<circle cx="406" cy="330" r="5" fill="#A67C52"/>
<text x="430" y="372" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="11.5" fill="#3D3229" text-anchor="start" font-weight="700">② Right forearm (lower edge)</text>
<path d="M318 96 L150 92" stroke="#8C8078" stroke-width="1" fill="none"/>
<circle cx="318" cy="96" r="5" fill="#A67C52"/>
<text x="140" y="96" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="11.5" fill="#3D3229" text-anchor="end" font-weight="700">③ Web behind neck</text>
<text x="24" y="404" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="10.5" fill="#8C8078" text-anchor="start">The strap is only backup: sitting, the guitar shouldn&#x27;t hang from it; standing, let it share the weight</text>
</svg>