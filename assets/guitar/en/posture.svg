<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-label="Three points of support when holding the guitar">
  <title>Three points of support when holding the guitar</title>
  <rect width="640" height="420" fill="#FBF8F4"/>
<text x="24" y="34" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="15" fill="#3D3229" text-anchor="start" font-weight="700">Three points of contact: chest, right forearm, left-hand web</text>
<text x="24" y="55" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="11.5" fill="#8C8078" text-anchor="start">All three points just &quot;rest&quot;; squeeze any one and the tone dulls and chord changes slow down</text>
