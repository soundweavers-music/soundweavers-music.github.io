<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 294" role="img" aria-label="Why singing seated gives you less support">
  <title>Why singing seated gives you less support</title>
  <rect width="640" height="294" fill="#FBF8F4"/>
<text x="24" y="34" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="15" fill="#3D3229" text-anchor="start" font-weight="700">Why singing seated gives you less support</text>
<text x="24" y="55" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="11.5" fill="#8C8078" text-anchor="start">The posture is fine; looking down at the guitar is what pinches the airway</text>
<text x="164.0" y="84" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="11.5" fill="#A67C52" text-anchor="start" font-weight="700">Playing seated</text>
<text x="394.0" y="84" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="11.5" fill="#A67C52" text-anchor="start" font-weight="700">Playing standing</text>
<rect x="24" y="96" width="592" height="56" fill="#F3E9DC" opacity=".5"/>
<text x="34" y="120" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="11.5" fill="#3D3229" text-anchor="start" font-weight="700">Gaze</text>
<text x="164.0" y="118" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="10.5" fill="#3D3229" text-anchor="start">You look down at your hands</text>
<text x="394.0" y="118" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="10.5" fill="#3D3229" text-anchor="start">You look straight ahead</text>
<text x="34" y="176" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="11.5" fill="#3D3229" text-anchor="start" font-weight="700">Throat</text>
<text x="164.0" y="174" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="10.5" fill="#3D3229" text-anchor="start">Chin tucks in, airway narrows</text>
<text x="394.0" y="174" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="10.5" fill="#3D3229" text-anchor="start">Airway stays open</text>
<rect x="24" y="208" width="592" height="56" fill="#F3E9DC" opacity=".5"/>
<text x="34" y="232" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="11.5" fill="#3D3229" text-anchor="start" font-weight="700">Support</text>
<text x="164.0" y="230" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="10.5" fill="#3D3229" text-anchor="start">The belly tends to sag</text>
<text x="394.0" y="230" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="10.5" fill="#3D3229" text-anchor="start">Easier to breathe from the belly</text>
<text x="24" y="282" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="10.5" fill="#8C8078" text-anchor="start">Seated works too: raise the guitar and the chart to eye level, and stop looking down</text>
</svg>