<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 230" role="img" aria-label="The standard shape of a pop song">
  <title>The standard shape of a pop song</title>
  <rect width="640" height="230" fill="#FBF8F4"/>
<text x="24" y="34" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="15" fill="#3D3229" text-anchor="start" font-weight="700">The standard shape of a pop song</text>
<text x="24" y="55" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="11.5" fill="#8C8078" text-anchor="start">Same chords; the sections and the dynamics make the shape</text>
<rect x="24.0" y="84" width="55.2" height="52" rx="7" fill="#F3E9DC" stroke="#C9BCAA"/>
<text x="51.6" y="116" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="11.5" fill="#3D3229" text-anchor="middle" font-weight="700">Intro</text>
<text x="26" y="156" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="9.5" fill="#8C8078" text-anchor="start">8 bars max</text>
<rect x="83.2" y="84" width="114.4" height="52" rx="7" fill="#F3E9DC" stroke="#C9BCAA"/>
<text x="140.4" y="116" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="11.5" fill="#3D3229" text-anchor="middle" font-weight="700">Verse</text>
<text x="85.2" y="156" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="9.5" fill="#8C8078" text-anchor="start">Space</text>
<rect x="201.6" y="84" width="55.2" height="52" rx="7" fill="#F3E9DC" stroke="#C9BCAA"/>
<text x="229.20000000000002" y="116" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="11.5" fill="#3D3229" text-anchor="middle" font-weight="700">Pre-chorus</text>
<text x="203.60000000000002" y="156" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="9.5" fill="#8C8078" text-anchor="start">Build up</text>
<rect x="260.8" y="84" width="114.4" height="52" rx="7" fill="#F3E9DC" stroke="#C9BCAA"/>
<text x="318.0" y="116" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="11.5" fill="#3D3229" text-anchor="middle" font-weight="700">Chorus</text>
<text x="262.8" y="156" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="9.5" fill="#8C8078" text-anchor="start">All strums</text>
<rect x="379.2" y="84" width="55.2" height="52" rx="7" fill="#F3E9DC" stroke="#C9BCAA"/>
<text x="406.80000000000007" y="116" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="11.5" fill="#3D3229" text-anchor="middle" font-weight="700">Interlude</text>
<text x="381.20000000000005" y="156" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="9.5" fill="#8C8078" text-anchor="start">Breathe</text>
<rect x="438.4" y="84" width="114.4" height="52" rx="7" fill="#F3E9DC" stroke="#C9BCAA"/>
<text x="495.6" y="116" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="11.5" fill="#3D3229" text-anchor="middle" font-weight="700">Chorus</text>
<text x="440.40000000000003" y="156" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="9.5" fill="#8C8078" text-anchor="start">Peak</text>
<rect x="556.8" y="84" width="55.2" height="52" rx="7" fill="#F3E9DC" stroke="#C9BCAA"/>
<text x="584.4000000000001" y="116" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="11.5" fill="#3D3229" text-anchor="middle" font-weight="700">Outro</text>
<text x="558.8000000000001" y="156" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="9.5" fill="#8C8078" text-anchor="start">Slow down</text>
<text x="24" y="218" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="10.5" fill="#8C8078" text-anchor="start">The chorus sounds loud because the verse held back; strumming flat out all the way has no shape</text>
</svg>