<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" role="img" aria-label="Standard tuning for all six strings">
  <title>Standard tuning for all six strings</title>
  <rect width="640" height="340" fill="#FBF8F4"/>
<text x="24" y="34" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="15" fill="#3D3229" text-anchor="start" font-weight="700">Six strings and standard tuning E–A–D–G–B–E</text>
<text x="24" y="55" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="11.5" fill="#8C8078" text-anchor="start">Top to bottom: 1st string (thinnest) to 6th (thickest); the figure is the open string&#x27;s frequency</text>
<line x1="110" y1="96" x2="452" y2="96" stroke="#3D3229" stroke-width="1.0" opacity=".55"/>
<text x="96" y="101" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="11.5" fill="#3D3229" text-anchor="end" font-weight="700">String 1</text>
<circle cx="482" cy="96" r="14" fill="#F3E9DC" stroke="#C9BCAA"/>
<text x="482" y="101" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="11" fill="#A67C52" text-anchor="middle" font-weight="700">E4</text>
<text x="510" y="101" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="10" fill="#8C8078" text-anchor="middle">329.63 Hz</text>
<line x1="110" y1="130" x2="452" y2="130" stroke="#3D3229" stroke-width="1.6" opacity=".55"/>
<text x="96" y="135" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="11.5" fill="#3D3229" text-anchor="end" font-weight="700">String 2</text>
<circle cx="482" cy="130" r="14" fill="#F3E9DC" stroke="#C9BCAA"/>
<text x="482" y="135" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="11" fill="#A67C52" text-anchor="middle" font-weight="700">B3</text>
<text x="510" y="135" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="10" fill="#8C8078" text-anchor="middle">246.94 Hz</text>
<line x1="110" y1="164" x2="452" y2="164" stroke="#3D3229" stroke-width="2.1" opacity=".55"/>
<text x="96" y="169" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="11.5" fill="#3D3229" text-anchor="end" font-weight="700">String 3</text>
<circle cx="482" cy="164" r="14" fill="#F3E9DC" stroke="#C9BCAA"/>
<text x="482" y="169" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="11" fill="#A67C52" text-anchor="middle" font-weight="700">G3</text>
<text x="510" y="169" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="10" fill="#8C8078" text-anchor="middle">196.00 Hz</text>
<line x1="110" y1="198" x2="452" y2="198" stroke="#3D3229" stroke-width="2.7" opacity=".55"/>
<text x="96" y="203" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="11.5" fill="#3D3229" text-anchor="end" font-weight="700">String 4</text>
<circle cx="482" cy="198" r="14" fill="#F3E9DC" stroke="#C9BCAA"/>
<text x="482" y="203" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="11" fill="#A67C52" text-anchor="middle" font-weight="700">D3</text>
<text x="510" y="203" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="10" fill="#8C8078" text-anchor="middle">146.83 Hz</text>
<line x1="110" y1="232" x2="452" y2="232" stroke="#3D3229" stroke-width="3.2" opacity=".55"/>
<text x="96" y="237" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="11.5" fill="#3D3229" text-anchor="end" font-weight="700">String 5</text>
<circle cx="482" cy="232" r="14" fill="#F3E9DC" stroke="#C9BCAA"/>
<text x="482" y="237" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="11" fill="#A67C52" text-anchor="middle" font-weight="700">A2</text>
<text x="510" y="237" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="10" fill="#8C8078" text-anchor="middle">110.00 Hz</text>
<line x1="110" y1="266" x2="452" y2="266" stroke="#3D3229" stroke-width="3.8" opacity=".55"/>
<text x="96" y="271" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="11.5" fill="#3D3229" text-anchor="end" font-weight="700">String 6</text>
<circle cx="482" cy="266" r="14" fill="#F3E9DC" stroke="#C9BCAA"/>
<text x="482" y="271" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="11" fill="#A67C52" text-anchor="middle" font-weight="700">E2</text>
<text x="510" y="271" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="10" fill="#8C8078" text-anchor="middle">82.41 Hz</text>
<text x="24" y="292" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="11" fill="#3D3229" text-anchor="start">The 1st string is on top, the 6th at the bottom—the same thing as &quot;thick strings up&quot; in your arms</text>
<text x="24" y="318" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="10.5" fill="#8C8078" text-anchor="start">Mnemonic: Eddie Ate Dynamite, Good Bye Eddie (E-A-D-G-B-E)</text>
</svg>