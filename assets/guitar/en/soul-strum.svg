<line x1="349.0" y1="86" x2="349.0" y2="262" stroke="#C9BCAA" stroke-width="1" opacity=".55"/>
<line x1="415.25" y1="86" x2="415.25" y2="262" stroke="#C9BCAA" stroke-width="1" opacity=".55"/>
<line x1="481.5" y1="86" x2="481.5" y2="262" stroke="#C9BCAA" stroke-width="1" opacity=".55"/>
