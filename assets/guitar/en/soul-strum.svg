<rect x="150.25" y="86" width="66.25" height="176" fill="#F3E9DC" opacity=".55"/>
<rect x="349.0" y="86" width="66.25" height="176" fill="#F3E9DC" opacity=".55"/>
<text x="26" y="300" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="11" fill="#3D3229" text-anchor="start">Chant &quot;down, down-up, up-down-up&quot;: only the downstroke on beat 3 is empty; the rest follows the wrist</text>
<text x="26" y="326" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="10.5" fill="#8C8078" text-anchor="start">The usual sticking point: after the upstroke on beat 2, don&#x27;t park in mid-air—keep the wrist swinging down</text>
</svg>