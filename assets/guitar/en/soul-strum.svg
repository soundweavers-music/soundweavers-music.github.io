<text x="315.875" y="168" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="20" fill="#C9BCAA" text-anchor="middle">↑</text>
<text x="382.125" y="168" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="20" fill="#C9BCAA" text-anchor="middle">↓</text>
<text x="448.375" y="168" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="20" fill="#C9BCAA" text-anchor="middle">↑</text>
<text x="514.625" y="168" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="20" fill="#C9BCAA" text-anchor="middle">↓</text>
<text x="580.875" y="168" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="20" fill="#C9BCAA" text-anchor="middle">↑</text>
<line x1="84" y1="194" x2="614" y2="194" stroke="#C9BCAA" stroke-width="1"/>
<text x="80" y="242" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="10.5" fill="#8C8078" text-anchor="end">Struck</text>
<text x="117.125" y="236" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="22" fill="#A67C52" text-anchor="middle" font-weight="700">↓</text>
<text x="249.625" y="236" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="22" fill="#A67C52" text-anchor="middle" font-weight="700">↓</text>
<text x="315.875" y="236" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="22" fill="#A67C52" text-anchor="middle" font-weight="700">↑</text>
<text x="448.375" y="236" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="22" fill="#A67C52" text-anchor="middle" font-weight="700">↑</text>
<text x="514.625" y="236" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="22" fill="#A67C52" text-anchor="middle" font-weight="700">↓</text>
<text x="580.875" y="236" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="22" fill="#A67C52" text-anchor="middle" font-weight="700">↑</text>
<line x1="84" y1="262" x2="614" y2="262" stroke="#C9BCAA" stroke-width="1"/>
<line x1="84.0" y1="86" x2="84.0" y2="262" stroke="#C9BCAA" stroke-width="1" opacity=".55"/>
