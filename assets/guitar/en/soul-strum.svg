<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" role="img" aria-label="The eight beats of the 8-beat soul strum">
  <title>The 8-beat soul strum</title>
  <rect width="640" height="340" fill="#FBF8F4"/>
<text x="26" y="34" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="16" fill="#3D3229" text-anchor="start" font-weight="700">The 8 Beat soul strum: ↓  ↓↑  ↑↓↑</text>
<text x="26" y="55" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="11.5" fill="#8C8078" text-anchor="start">Grey lines are ghost strums: the hand swings but misses the strings</text>
