<text x="514.625" y="100" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="12" fill="#8C8078" text-anchor="middle">4</text>
<text x="580.875" y="100" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="12" fill="#8C8078" text-anchor="middle">&amp;</text>
<line x1="84" y1="126" x2="614" y2="126" stroke="#C9BCAA" stroke-width="1"/>
