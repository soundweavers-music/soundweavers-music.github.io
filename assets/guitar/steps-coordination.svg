<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 338" role="img" aria-label="手口協調四步驟：先拆開，再合起來">
  <title>手口協調四步驟：先拆開，再合起來</title>
  <rect width="640" height="338" fill="#FBF8F4"/>
<text x="24" y="34" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="15" fill="#3D3229" text-anchor="start" font-weight="700">手口協調四步驟：先拆開，再合起來</text>
<text x="24" y="55" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="11.5" fill="#8C8078" text-anchor="start">一開口就亂，是因為大腦同時要處理兩件事；把它們分開練</text>
<rect x="24.0" y="84" width="280.0" height="90" rx="10" fill="#F3E9DC" stroke="#C9BCAA"/>
<text x="42.0" y="114" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="20" fill="#A67C52" text-anchor="start" font-weight="700">1</text>
<text x="68.0" y="114" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="12.5" fill="#3D3229" text-anchor="start" font-weight="700">只彈不唱</text>
<text x="42.0" y="138" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="10.5" fill="#3D3229" text-anchor="start">把伴奏彈到不用看也能彈，嘴巴完全安</text>
<text x="42.0" y="156" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="10.5" fill="#3D3229" text-anchor="start">靜</text>
<rect x="320.0" y="84" width="280.0" height="90" rx="10" fill="#F3E9DC" stroke="#C9BCAA"/>
<text x="338.0" y="114" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="20" fill="#A67C52" text-anchor="start" font-weight="700">2</text>
<text x="364.0" y="114" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="12.5" fill="#3D3229" text-anchor="start" font-weight="700">只唱不彈</text>
<text x="338.0" y="138" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="10.5" fill="#3D3229" text-anchor="start">跟著原曲唱，手上什麼都不做，確認歌</text>
<text x="338.0" y="156" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="10.5" fill="#3D3229" text-anchor="start">詞與拍子對得上</text>
<rect x="24.0" y="188" width="280.0" height="90" rx="10" fill="#F3E9DC" stroke="#C9BCAA"/>
<text x="42.0" y="218" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="20" fill="#A67C52" text-anchor="start" font-weight="700">3</text>
<text x="68.0" y="218" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="12.5" fill="#3D3229" text-anchor="start" font-weight="700">唱拍不唱詞</text>
<text x="42.0" y="242" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="10.5" fill="#3D3229" text-anchor="start">嘴巴只數 1 &amp; 2 &amp;，手照彈；</text>
<text x="42.0" y="260" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="10.5" fill="#3D3229" text-anchor="start">先讓節奏對齊</text>
<rect x="320.0" y="188" width="280.0" height="90" rx="10" fill="#F3E9DC" stroke="#C9BCAA"/>
<text x="338.0" y="218" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="20" fill="#A67C52" text-anchor="start" font-weight="700">4</text>
<text x="364.0" y="218" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="12.5" fill="#3D3229" text-anchor="start" font-weight="700">合起來慢練</text>
<text x="338.0" y="242" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="10.5" fill="#3D3229" text-anchor="start">降到原速的 80%，歌詞與刷弦一起</text>
<text x="338.0" y="260" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="10.5" fill="#3D3229" text-anchor="start">來，錯了就退回上一步</text>
<text x="24" y="324" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="10.5" fill="#8C8078" text-anchor="start">卡住的位置要記下來：每次都在同一個字亂，就是那一個字的拍點還沒對齊。</text>
</svg>