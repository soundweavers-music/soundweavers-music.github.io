<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 268" role="img" aria-label="這一段的和弦進行">
  <title>這一段的和弦進行</title>
  <rect width="720" height="268" fill="#FBF8F4"/>
<text x="28.0" y="34.0" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="15" fill="#3D3229" text-anchor="start" font-weight="700">這一段的和弦進行</text>
<text x="28.0" y="55.0" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="11.5" fill="#8C8078" text-anchor="start">每一列是一輪；下面的小字是那一輪的刷法或歌詞</text>
<rect x="28.0" y="92" width="52" height="30" rx="8" fill="#F3E9DC" stroke="#C9BCAA"/>
<text x="54.0" y="112.0" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="12" fill="#3D3229" text-anchor="middle" font-weight="700">C</text>
<text x="86.0" y="112.0" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="12" fill="#8C8078" text-anchor="start">→</text>
<rect x="100.0" y="92" width="52" height="30" rx="8" fill="#F3E9DC" stroke="#C9BCAA"/>
<text x="126.0" y="112.0" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="12" fill="#3D3229" text-anchor="middle" font-weight="700">Em7</text>
<text x="28.0" y="140.0" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="10" fill="#8C8078" text-anchor="start">塞納河畔左岸的咖啡(空)</text>
<rect x="28.0" y="160" width="52" height="30" rx="8" fill="#F3E9DC" stroke="#C9BCAA"/>
<text x="54.0" y="180.0" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="12" fill="#3D3229" text-anchor="middle" font-weight="700">Dm7</text>
<text x="86.0" y="180.0" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="12" fill="#8C8078" text-anchor="start">→</text>
<rect x="100.0" y="160" width="52" height="30" rx="8" fill="#F3E9DC" stroke="#C9BCAA"/>
<text x="126.0" y="180.0" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="12" fill="#3D3229" text-anchor="middle" font-weight="700">G7</text>
<text x="28.0" y="208.0" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="10" fill="#8C8078" text-anchor="start">我手一杯品嚐你的美(空)</text>
<text x="28.0" y="234.0" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="10" fill="#8C8078" text-anchor="start">整段反覆；換和弦時右手不要停，只換左手。</text>
</svg>