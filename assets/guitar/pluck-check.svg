<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" role="img" aria-label="爬音測試">
  <title>爬音測試</title>
  <rect width="640" height="320" fill="#FBF8F4"/>
<text x="24" y="34" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="15" fill="#3D3229" text-anchor="start" font-weight="700">爬音測試：一顆和弦按好之後，六條弦逐條撥</text>
<text x="24" y="55" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="11.5" fill="#8C8078" text-anchor="start">哪一條悶，就修那一條；不要一次改三個地方</text>
<text x="120" y="104" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="11.5" fill="#3D3229" text-anchor="end" font-weight="700">第 6 弦</text>
<circle cx="160" cy="100" r="9" fill="#A67C52"/>
<text x="186" y="104" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="10.5" fill="#8C8078" text-anchor="start">清脆、能延音</text>
<text x="120" y="136" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="11.5" fill="#3D3229" text-anchor="end" font-weight="700">第 5 弦</text>
<circle cx="160" cy="132" r="9" fill="#A67C52"/>
<text x="186" y="136" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="10.5" fill="#8C8078" text-anchor="start">清脆、能延音</text>
<text x="120" y="168" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="11.5" fill="#3D3229" text-anchor="end" font-weight="700">第 4 弦</text>
<circle cx="160" cy="164" r="9" fill="#B4553F"/>
<text x="186" y="168" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="10.5" fill="#B4553F" text-anchor="start">悶音 → 檢查手指有沒有壓到旁邊的弦</text>
<text x="120" y="200" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="11.5" fill="#3D3229" text-anchor="end" font-weight="700">第 3 弦</text>
<circle cx="160" cy="196" r="9" fill="#A67C52"/>
<text x="186" y="200" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="10.5" fill="#8C8078" text-anchor="start">清脆、能延音</text>
<text x="120" y="232" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="11.5" fill="#3D3229" text-anchor="end" font-weight="700">第 2 弦</text>
<circle cx="160" cy="228" r="9" fill="#A67C52"/>
<text x="186" y="232" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="10.5" fill="#8C8078" text-anchor="start">清脆、能延音</text>
<text x="120" y="264" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="11.5" fill="#3D3229" text-anchor="end" font-weight="700">第 1 弦</text>
<circle cx="160" cy="260" r="9" fill="#A67C52"/>
<text x="186" y="264" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="10.5" fill="#8C8078" text-anchor="start">清脆、能延音</text>
<text x="24" y="272" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="11" fill="#3D3229" text-anchor="start">順序固定：由第 6 弦往上撥到第 1 弦，每次都一樣，耳朵才比較得出來。</text>
<text x="24" y="298" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="10.5" fill="#8C8078" text-anchor="start">全部清脆之後再刷整排；有一條悶，刷起來就會「少一塊」。</text>
</svg>