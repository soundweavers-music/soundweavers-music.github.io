<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" role="img" aria-label="四種基本音符：一個小節可以裝幾個">
  <title>四種基本音符：一個小節可以裝幾個</title>
  <rect width="640" height="320" fill="#FBF8F4"/>
<text x="24" y="34" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="15" fill="#3D3229" text-anchor="start" font-weight="700">四種基本音符：一個小節可以裝幾個</text>
<text x="24" y="55" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="11.5" fill="#8C8078" text-anchor="start">橫條的長度就是音延續的長度；4/4 拍一小節固定 4 拍</text>
<text x="140" y="108" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="12" fill="#3D3229" text-anchor="end" font-weight="700">全音符</text>
<rect x="150.0" y="88" width="416.0" height="28" rx="5" fill="#A67C52" opacity="0.85"/>
<text x="150" y="134" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="10" fill="#8C8078" text-anchor="start">4 拍｜刷一下，讓它響滿整小節</text>
<line x1="150" y1="82" x2="150" y2="122" stroke="#3D3229" stroke-width="1.6"/>
<line x1="570" y1="82" x2="570" y2="122" stroke="#3D3229" stroke-width="1.6"/>
<text x="140" y="162" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="12" fill="#3D3229" text-anchor="end" font-weight="700">二分音符</text>
<rect x="150.0" y="142" width="206.0" height="28" rx="5" fill="#A67C52" opacity="0.85"/>
<rect x="360.0" y="142" width="206.0" height="28" rx="5" fill="#A67C52" opacity="0.55"/>
<text x="150" y="188" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="10" fill="#8C8078" text-anchor="start">2 拍｜一小節兩下</text>
<line x1="150" y1="136" x2="150" y2="176" stroke="#3D3229" stroke-width="1.6"/>
<line x1="570" y1="136" x2="570" y2="176" stroke="#3D3229" stroke-width="1.6"/>
<text x="140" y="216" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="12" fill="#3D3229" text-anchor="end" font-weight="700">四分音符</text>
<rect x="150.0" y="196" width="101.0" height="28" rx="5" fill="#A67C52" opacity="0.85"/>
<rect x="255.0" y="196" width="101.0" height="28" rx="5" fill="#A67C52" opacity="0.55"/>
<rect x="360.0" y="196" width="101.0" height="28" rx="5" fill="#A67C52" opacity="0.85"/>
<rect x="465.0" y="196" width="101.0" height="28" rx="5" fill="#A67C52" opacity="0.55"/>
<text x="150" y="242" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="10" fill="#8C8078" text-anchor="start">1 拍｜跟著節拍器一下一下</text>
<line x1="150" y1="190" x2="150" y2="230" stroke="#3D3229" stroke-width="1.6"/>
<line x1="570" y1="190" x2="570" y2="230" stroke="#3D3229" stroke-width="1.6"/>
<text x="140" y="270" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="12" fill="#3D3229" text-anchor="end" font-weight="700">八分音符</text>
<rect x="150.0" y="250" width="48.5" height="28" rx="5" fill="#A67C52" opacity="0.85"/>
<rect x="202.5" y="250" width="48.5" height="28" rx="5" fill="#A67C52" opacity="0.55"/>
<rect x="255.0" y="250" width="48.5" height="28" rx="5" fill="#A67C52" opacity="0.85"/>
<rect x="307.5" y="250" width="48.5" height="28" rx="5" fill="#A67C52" opacity="0.55"/>
<rect x="360.0" y="250" width="48.5" height="28" rx="5" fill="#A67C52" opacity="0.85"/>
<rect x="412.5" y="250" width="48.5" height="28" rx="5" fill="#A67C52" opacity="0.55"/>
<rect x="465.0" y="250" width="48.5" height="28" rx="5" fill="#A67C52" opacity="0.85"/>
<rect x="517.5" y="250" width="48.5" height="28" rx="5" fill="#A67C52" opacity="0.55"/>
<text x="150" y="296" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="10" fill="#8C8078" text-anchor="start">半拍｜一拍裡兩下，數成 1 &amp; 2 &amp;</text>
<line x1="150" y1="244" x2="150" y2="284" stroke="#3D3229" stroke-width="1.6"/>
<line x1="570" y1="244" x2="570" y2="284" stroke="#3D3229" stroke-width="1.6"/>
</svg>