<text x="74" y="224" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="9.5" fill="#8C8078" text-anchor="end">拍點</text>
<text x="26" y="320" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="11" fill="#3D3229" text-anchor="start">換和弦時只動大拇指：C、Am 撥第 5 弦，G、Em 撥第 6 弦，Dm、Fmaj7 撥第 4 弦。</text>
<text x="26" y="346" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="10.5" fill="#8C8078" text-anchor="start">八個音要一樣大聲，像齒輪一樣均勻；圈起來的是根音，可以稍微重一點點。</text>
