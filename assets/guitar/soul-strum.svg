<text x="26" y="300" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="11" fill="#3D3229" text-anchor="start">口訣「下、下上、上下上」：只有第 3 拍的正拍是空的，其餘照著手腕的慣性走。</text>
<text x="26" y="326" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="10.5" fill="#8C8078" text-anchor="start">新手最容易卡住的地方：第 2 拍上刷完不要停在空中，讓手腕繼續往下揮，反拍才接得上。</text>
