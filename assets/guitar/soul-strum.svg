<text x="26" y="55" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="11.5" fill="#8C8078" text-anchor="start">灰線是空揮——手照樣擺動，只是不碰到弦。第 3 拍正拍不刷，所以第 3 拍的反拍聽起來像突然往前跳</text>
