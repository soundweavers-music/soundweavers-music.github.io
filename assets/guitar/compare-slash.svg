<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 294" role="img" aria-label="看到 G/B 別慌：斜線右邊只是低音">
  <title>看到 G/B 別慌：斜線右邊只是低音</title>
  <rect width="640" height="294" fill="#FBF8F4"/>
<text x="24" y="34" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="15" fill="#3D3229" text-anchor="start" font-weight="700">看到 G/B 別慌：斜線右邊只是低音</text>
<text x="24" y="55" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="11.5" fill="#8C8078" text-anchor="start">斜線和弦＝左邊的和弦 ＋ 右邊指定的低音</text>
<text x="164.0" y="84" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="11.5" fill="#A67C52" text-anchor="start" font-weight="700">意思</text>
<text x="394.0" y="84" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="11.5" fill="#A67C52" text-anchor="start" font-weight="700">怎麼按</text>
<rect x="24" y="96" width="592" height="56" fill="#F3E9DC" opacity=".5"/>
<text x="34" y="120" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="11.5" fill="#3D3229" text-anchor="start" font-weight="700">G/B</text>
<text x="164.0" y="118" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="10.5" fill="#3D3229" text-anchor="start">G 和弦，低音改彈 B</text>
<text x="394.0" y="118" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="10.5" fill="#3D3229" text-anchor="start">原 G 指型，第 5 弦</text>
<text x="394.0" y="135" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="10.5" fill="#3D3229" text-anchor="start">改按第 2 格</text>
<text x="34" y="176" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="11.5" fill="#3D3229" text-anchor="start" font-weight="700">D/F#</text>
<text x="164.0" y="174" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="10.5" fill="#3D3229" text-anchor="start">D 和弦，低音改彈 F#</text>
<text x="394.0" y="174" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="10.5" fill="#3D3229" text-anchor="start">第 6 弦按第 2 格，</text>
<text x="394.0" y="191" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="10.5" fill="#3D3229" text-anchor="start">其餘照 D</text>
<rect x="24" y="208" width="592" height="56" fill="#F3E9DC" opacity=".5"/>
<text x="34" y="232" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="11.5" fill="#3D3229" text-anchor="start" font-weight="700">C/E</text>
<text x="164.0" y="230" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="10.5" fill="#3D3229" text-anchor="start">C 和弦，低音改彈 E</text>
<text x="394.0" y="230" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="10.5" fill="#3D3229" text-anchor="start">第 6 弦空弦，其餘照 </text>
<text x="394.0" y="247" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="10.5" fill="#3D3229" text-anchor="start">C</text>
<text x="24" y="282" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="10.5" fill="#8C8078" text-anchor="start">按不出來時，直接彈斜線左邊那個和弦也不會錯；低音只是加分。</text>
</svg>