<rect x="386" y="216" width="76" height="30" rx="6" fill="#FBF8F4" stroke="#C9BCAA"/>
<text x="424.0" y="236" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="12" fill="#A67C52" text-anchor="middle">C</text>
