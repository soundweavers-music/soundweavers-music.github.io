<text x="24" y="286" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="10.5" fill="#8C8078" text-anchor="start">例：原曲 E 大調要唱，用 C 調指法夾第 4 格；覺得太高就換 D 調或 G 調指法再夾。</text>
