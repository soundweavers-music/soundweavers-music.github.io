<text x="128" y="233" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="11" fill="#3D3229" text-anchor="end" font-weight="700">A 調指法</text>
<rect x="140" y="216" width="76" height="30" rx="6" fill="#F3E9DC" stroke="#C9BCAA"/>
<text x="178.0" y="236" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="12" fill="#3D3229" text-anchor="middle" font-weight="700">A</text>
