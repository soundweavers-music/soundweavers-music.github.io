<svg xmlns="http://www.w3.org/2000/svg" width="720" height="350" viewBox="0 0 720 350" role="img" aria-label="台灣的濕度對琴做了什麼"><title>台灣的濕度對琴做了什麼</title><rect width="720" height="350" fill="#fdfbf7"/><text x="24" y="34" font-size="15" text-anchor="start" fill="#3a3128" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">台灣的濕度對琴做了什麼</text><text x="24" y="55" font-size="11.5" text-anchor="start" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">實木面板怕的是「變化」，不是「濕」或「乾」本身；穩定比數字漂亮重要</text><text x="164.0" y="84" font-size="11.5" text-anchor="start" fill="#A67C52" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">太濕（&gt;70%）</text><text x="434.0" y="84" font-size="11.5" text-anchor="start" fill="#A67C52" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">太乾（&lt;40%）</text><rect x="24" y="96" width="672" height="56" fill="#f3ece2" opacity=".5"/><text x="34" y="120" font-size="11.5" text-anchor="start" fill="#3a3128" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">面板</text><text x="164.0" y="118" font-size="10.5" text-anchor="start" fill="#3a3128" font-family="system-ui, -apple-system, Segoe UI, sans-serif">膨脹凸起、弦距變高</text><text x="434.0" y="118" font-size="10.5" text-anchor="start" fill="#3a3128" font-family="system-ui, -apple-system, Segoe UI, sans-serif">收縮、可能乾裂</text><text x="34" y="176" font-size="11.5" text-anchor="start" fill="#3a3128" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">聲音</text><text x="164.0" y="174" font-size="10.5" text-anchor="start" fill="#3a3128" font-family="system-ui, -apple-system, Segoe UI, sans-serif">變悶、延音變短</text><text x="434.0" y="174" font-size="10.5" text-anchor="start" fill="#3a3128" font-family="system-ui, -apple-system, Segoe UI, sans-serif">變尖、失去低頻</text><rect x="24" y="208" width="672" height="56" fill="#f3ece2" opacity=".5"/><text x="34" y="232" font-size="11.5" text-anchor="start" fill="#3a3128" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">弦</text><text x="164.0" y="230" font-size="10.5" text-anchor="start" fill="#3a3128" font-family="system-ui, -apple-system, Segoe UI, sans-serif">生鏽快、手感變澀</text><text x="434.0" y="230" font-size="10.5" text-anchor="start" fill="#3a3128" font-family="system-ui, -apple-system, Segoe UI, sans-serif">較不易生鏽</text><text x="34" y="288" font-size="11.5" text-anchor="start" fill="#3a3128" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">對策</text><text x="164.0" y="286" font-size="10.5" text-anchor="start" fill="#3a3128" font-family="system-ui, -apple-system, Segoe UI, sans-serif">琴袋放乾燥劑、除濕機設 </text><text x="164.0" y="303" font-size="10.5" text-anchor="start" fill="#3a3128" font-family="system-ui, -apple-system, Segoe UI, sans-serif">55%</text><text x="434.0" y="286" font-size="10.5" text-anchor="start" fill="#3a3128" font-family="system-ui, -apple-system, Segoe UI, sans-serif">琴袋放調濕包，遠離冷氣出</text><text x="434.0" y="303" font-size="10.5" text-anchor="start" fill="#3a3128" font-family="system-ui, -apple-system, Segoe UI, sans-serif">風口</text><text x="24" y="338" font-size="10.5" text-anchor="start" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">最省心的做法：琴袋內放一包雙向調濕包（例如 49%），比每天追著濕度計跑有效。</text></svg>
