<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" role="img" aria-label="封閉和弦指型平移"><title>封閉和弦指型平移</title><rect width="720" height="300" fill="#fdfbf7"/><text x="24" y="34" font-size="15" text-anchor="start" fill="#3a3128" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">封閉和弦的平移：同一個手型，往右就是升調</text><text x="24" y="55" font-size="11.5" text-anchor="start" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">食指橫按整個格，其餘三指補位；整組往琴身移 1 格＝升 1 個半音</text><rect x="90" y="96" width="440" height="80" rx="6" fill="#faf4ea" stroke="#c9bba6"/><line x1="90" y1="96" x2="90" y2="176" stroke="#9C8F87" stroke-width="2.6"/><line x1="178" y1="96" x2="178" y2="176" stroke="#9C8F87" stroke-width="1"/><line x1="266" y1="96" x2="266" y2="176" stroke="#9C8F87" stroke-width="1"/><line x1="354" y1="96" x2="354" y2="176" stroke="#9C8F87" stroke-width="1"/><line x1="442" y1="96" x2="442" y2="176" stroke="#9C8F87" stroke-width="1"/><line x1="530" y1="96" x2="530" y2="176" stroke="#9C8F87" stroke-width="1"/><text x="134.0" y="194" font-size="10" text-anchor="middle" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">1</text><text x="222.0" y="194" font-size="10" text-anchor="middle" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">2</text><text x="310.0" y="194" font-size="10" text-anchor="middle" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">3</text><text x="398.0" y="194" font-size="10" text-anchor="middle" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">4</text><text x="486.0" y="194" font-size="10" text-anchor="middle" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">5</text><rect x="108.0" y="116" width="52" height="42" rx="8" fill="#C4956A" opacity="0.95"/><text x="134.0" y="136" font-size="14" text-anchor="middle" fill="#fdfbf7" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">Bb</text><text x="134.0" y="152" font-size="9" text-anchor="middle" fill="#fdfbf7" font-family="system-ui, -apple-system, Segoe UI, sans-serif">1 格</text><rect x="196.0" y="116" width="52" height="42" rx="8" fill="#C4956A" opacity="0.75"/><text x="222.0" y="136" font-size="14" text-anchor="middle" fill="#fdfbf7" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">B</text><text x="222.0" y="152" font-size="9" text-anchor="middle" fill="#fdfbf7" font-family="system-ui, -apple-system, Segoe UI, sans-serif">2 格</text><rect x="284.0" y="116" width="52" height="42" rx="8" fill="#C4956A" opacity="0.5499999999999999"/><text x="310.0" y="136" font-size="14" text-anchor="middle" fill="#fdfbf7" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">C</text><text x="310.0" y="152" font-size="9" text-anchor="middle" fill="#fdfbf7" font-family="system-ui, -apple-system, Segoe UI, sans-serif">3 格</text><text x="24" y="234" font-size="11" text-anchor="start" fill="#3a3128" font-family="system-ui, -apple-system, Segoe UI, sans-serif">同一個手型，第 1 格是 Bb、第 2 格是 B、第 3 格是 C——不用換按法，只要移動。</text><text x="24" y="260" font-size="10.5" text-anchor="start" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">每日 3 分鐘：在 1、3、5、7 格各按一次，每次撥四下，確認四條弦都響。</text></svg>
