<svg xmlns="http://www.w3.org/2000/svg" width="700" height="264" viewBox="0 0 700 264" role="img" aria-label="海島雷鬼刷法：正拍全部留白"><title>海島雷鬼刷法：正拍全部留白</title><rect width="700" height="264" fill="#fdfbf7"/><text x="24" y="30" font-size="15" text-anchor="start" fill="#3a3128" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">海島雷鬼刷法：正拍全部留白</text><text x="24" y="50" font-size="11.5" text-anchor="start" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">正拍（數字）手往下揮但不碰弦，反拍（&amp;）才真的刷下去——這就是雷鬼的彈跳感</text><line x1="110.0" y1="76" x2="110.0" y2="222" stroke="#C4956A" stroke-width="1.3"/><line x1="180.0" y1="76" x2="180.0" y2="222" stroke="#c9bba6" stroke-width="1"/><line x1="250.0" y1="76" x2="250.0" y2="222" stroke="#C4956A" stroke-width="1.3"/><line x1="320.0" y1="76" x2="320.0" y2="222" stroke="#c9bba6" stroke-width="1"/><line x1="390.0" y1="76" x2="390.0" y2="222" stroke="#C4956A" stroke-width="1.3"/><line x1="460.0" y1="76" x2="460.0" y2="222" stroke="#c9bba6" stroke-width="1"/><line x1="530.0" y1="76" x2="530.0" y2="222" stroke="#C4956A" stroke-width="1.3"/><line x1="600.0" y1="76" x2="600.0" y2="222" stroke="#c9bba6" stroke-width="1"/><line x1="670.0" y1="76" x2="670.0" y2="222" stroke="#C4956A" stroke-width="1.3"/><text x="98" y="97" font-size="10.5" text-anchor="end" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">拍點</text><text x="145.0" y="97" font-size="11" text-anchor="middle" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">1</text><text x="215.0" y="97" font-size="11" text-anchor="middle" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">&amp;</text><text x="285.0" y="97" font-size="11" text-anchor="middle" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">2</text><text x="355.0" y="97" font-size="11" text-anchor="middle" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">&amp;</text><text x="425.0" y="97" font-size="11" text-anchor="middle" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">3</text><text x="495.0" y="97" font-size="11" text-anchor="middle" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">&amp;</text><text x="565.0" y="97" font-size="11" text-anchor="middle" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">4</text><text x="635.0" y="97" font-size="11" text-anchor="middle" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">&amp;</text><text x="98" y="131" font-size="10.5" text-anchor="end" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">右手</text><text x="145.0" y="131" font-size="12" text-anchor="middle" fill="#cfc4b8" font-family="system-ui, -apple-system, Segoe UI, sans-serif">(↓)</text><text x="215.0" y="132" font-size="15" text-anchor="middle" fill="#A67C52" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">↑</text><text x="285.0" y="131" font-size="12" text-anchor="middle" fill="#cfc4b8" font-family="system-ui, -apple-system, Segoe UI, sans-serif">(↓)</text><text x="355.0" y="132" font-size="15" text-anchor="middle" fill="#A67C52" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">↑</text><text x="425.0" y="131" font-size="12" text-anchor="middle" fill="#cfc4b8" font-family="system-ui, -apple-system, Segoe UI, sans-serif">(↓)</text><text x="495.0" y="132" font-size="15" text-anchor="middle" fill="#A67C52" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">↑</text><text x="565.0" y="131" font-size="12" text-anchor="middle" fill="#cfc4b8" font-family="system-ui, -apple-system, Segoe UI, sans-serif">(↓)</text><text x="635.0" y="132" font-size="15" text-anchor="middle" fill="#A67C52" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">↑</text><text x="98" y="165" font-size="10.5" text-anchor="end" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">左手</text><text x="145.0" y="166" font-size="15" text-anchor="middle" fill="#A67C52" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">預備</text><text x="215.0" y="166" font-size="15" text-anchor="middle" fill="#A67C52" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">按緊</text><text x="285.0" y="166" font-size="15" text-anchor="middle" fill="#A67C52" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">放開</text><text x="355.0" y="166" font-size="15" text-anchor="middle" fill="#A67C52" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">按緊</text><text x="425.0" y="166" font-size="15" text-anchor="middle" fill="#A67C52" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">放開</text><text x="495.0" y="166" font-size="15" text-anchor="middle" fill="#A67C52" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">按緊</text><text x="565.0" y="166" font-size="15" text-anchor="middle" fill="#A67C52" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">放開</text><text x="635.0" y="166" font-size="15" text-anchor="middle" fill="#A67C52" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">按緊</text><text x="98" y="199" font-size="10.5" text-anchor="end" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">聽覺</text><text x="145.0" y="199" font-size="12" text-anchor="middle" fill="#cfc4b8" font-family="system-ui, -apple-system, Segoe UI, sans-serif">—</text><text x="215.0" y="199" font-size="10.5" text-anchor="middle" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">恰！</text><text x="285.0" y="199" font-size="12" text-anchor="middle" fill="#cfc4b8" font-family="system-ui, -apple-system, Segoe UI, sans-serif">—</text><text x="355.0" y="199" font-size="10.5" text-anchor="middle" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">恰！</text><text x="425.0" y="199" font-size="12" text-anchor="middle" fill="#cfc4b8" font-family="system-ui, -apple-system, Segoe UI, sans-serif">—</text><text x="495.0" y="199" font-size="10.5" text-anchor="middle" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">恰！</text><text x="565.0" y="199" font-size="12" text-anchor="middle" fill="#cfc4b8" font-family="system-ui, -apple-system, Segoe UI, sans-serif">—</text><text x="635.0" y="199" font-size="10.5" text-anchor="middle" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">恰！</text><text x="24" y="248" font-size="10.5" text-anchor="start" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">左手在正拍「放開」是關鍵：弦一鬆，聲音就斷，反拍刷下去才有乾淨的「恰」。</text></svg>
