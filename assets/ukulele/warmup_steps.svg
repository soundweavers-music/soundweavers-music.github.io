<svg xmlns="http://www.w3.org/2000/svg" width="720" height="338" viewBox="0 0 720 338" role="img" aria-label="今日暖身：三件事，各兩分鐘"><title>今日暖身：三件事，各兩分鐘</title><rect width="720" height="338" fill="#fdfbf7"/><text x="24" y="34" font-size="15" text-anchor="start" fill="#3a3128" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">今日暖身：三件事，各兩分鐘</text><text x="24" y="55" font-size="11.5" text-anchor="start" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">暖身的目的不是練會什麼，是讓手指醒過來、讓音準穩定</text><rect x="24.0" y="84" width="320.0" height="90" rx="10" fill="#f3ece2" stroke="#c9bba6"/><text x="42.0" y="114" font-size="20" text-anchor="start" fill="#A67C52" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">1</text><text x="68.0" y="114" font-size="12.5" text-anchor="start" fill="#3a3128" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">爬格子</text><text x="42.0" y="138" font-size="10.5" text-anchor="start" fill="#3a3128" font-family="system-ui, -apple-system, Segoe UI, sans-serif">第 1～4 格，一指一格，從第 4</text><text x="42.0" y="156" font-size="10.5" text-anchor="start" fill="#3a3128" font-family="system-ui, -apple-system, Segoe UI, sans-serif"> 弦爬到第 1 弦，60 BPM</text><rect x="360.0" y="84" width="320.0" height="90" rx="10" fill="#f3ece2" stroke="#c9bba6"/><text x="378.0" y="114" font-size="20" text-anchor="start" fill="#A67C52" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">2</text><text x="404.0" y="114" font-size="12.5" text-anchor="start" fill="#3a3128" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">空弦穩定度</text><text x="378.0" y="138" font-size="10.5" text-anchor="start" fill="#3a3128" font-family="system-ui, -apple-system, Segoe UI, sans-serif">每條弦撥四下，聲音要一樣大、一樣長</text><rect x="24.0" y="188" width="320.0" height="90" rx="10" fill="#f3ece2" stroke="#c9bba6"/><text x="42.0" y="218" font-size="20" text-anchor="start" fill="#A67C52" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">3</text><text x="68.0" y="218" font-size="12.5" text-anchor="start" fill="#3a3128" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">和弦切換</text><text x="42.0" y="242" font-size="10.5" text-anchor="start" fill="#3a3128" font-family="system-ui, -apple-system, Segoe UI, sans-serif">C → Am → F → G7 慢</text><text x="42.0" y="260" font-size="10.5" text-anchor="start" fill="#3a3128" font-family="system-ui, -apple-system, Segoe UI, sans-serif">慢換，只求乾淨不求快</text><text x="24" y="324" font-size="10.5" text-anchor="start" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">手還沒熱就練快，是成年人練琴最常見的受傷原因。</text></svg>
