<svg xmlns="http://www.w3.org/2000/svg" width="720" height="240" viewBox="0 0 720 240" role="img" aria-label="A song&#x27;s dynamics: verse holds back, chorus opens"><title>A song&#x27;s dynamics: verse holds back, chorus opens</title><rect width="720" height="240" fill="#fdfbf7"/><text x="24" y="34" font-size="15" text-anchor="start" fill="#3a3128" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">A song&#x27;s dynamics: verse holds back, chorus opens</text><text x="24" y="55" font-size="11.5" text-anchor="start" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">Same four chords; how many strings, how many strokes, how loud makes the three-level climb</text><rect x="24.0" y="84" width="197.6" height="52" rx="7" fill="#f3ece2" stroke="#c9bba6"/><text x="122.8" y="116" font-size="11.5" text-anchor="middle" fill="#3a3128" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">Verse</text><text x="26" y="156" font-size="9.5" text-anchor="start" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">Arpeggio</text><rect x="225.6" y="84" width="130.4" height="52" rx="7" fill="#f3ece2" stroke="#c9bba6"/><text x="290.8" y="116" font-size="11.5" text-anchor="middle" fill="#3a3128" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">Pre-chorus</text><text x="227.6" y="156" font-size="9.5" text-anchor="start" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">Crescendo downs</text><rect x="360.0" y="84" width="197.6" height="52" rx="7" fill="#f3ece2" stroke="#c9bba6"/><text x="458.8" y="116" font-size="11.5" text-anchor="middle" fill="#3a3128" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">Chorus</text><text x="362.0" y="156" font-size="9.5" text-anchor="start" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">Full 16 Beat</text><text x="362.0" y="172" font-size="9.5" text-anchor="start" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">strum</text><rect x="561.6" y="84" width="130.4" height="52" rx="7" fill="#f3ece2" stroke="#c9bba6"/><text x="626.8000000000001" y="116" font-size="11.5" text-anchor="middle" fill="#3a3128" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">Outro</text><text x="563.6" y="156" font-size="9.5" text-anchor="start" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">Back to arpeggio</text><text x="24" y="228" font-size="10.5" text-anchor="start" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">The chorus only sounds big because the verse held back; strumming flat the whole way has no shape</text></svg>
