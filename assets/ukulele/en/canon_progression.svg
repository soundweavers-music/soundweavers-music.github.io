<svg xmlns="http://www.w3.org/2000/svg" width="700" height="260" viewBox="0 0 700 260" role="img" aria-label="The Canon chord progression"><title>The Canon chord progression</title><rect width="700" height="260" fill="#fdfbf7"/><text x="24" y="28" font-size="14" text-anchor="start" fill="#3a3128" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">The Canon progression: 1 – 5 – 6m – 3m – 4 – 1 – 4 – 5</text><text x="24" y="48" font-size="11" text-anchor="start" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">In C major. In G major the same eight become G–D–Em–Bm–C–G–C–D; the degrees never change</text><rect x="26" y="86" width="74" height="86" rx="9" fill="#f3ece2" stroke="#c9bba6"/><text x="63.0" y="124" font-size="18" text-anchor="middle" fill="#3a3128" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">C</text><text x="63.0" y="154" font-size="12" text-anchor="middle" fill="#A67C52" font-family="system-ui, -apple-system, Segoe UI, sans-serif">1</text><path d="M101 129 l6 0" stroke="#9C8F87" stroke-width="1.2"/><rect x="108" y="86" width="74" height="86" rx="9" fill="#f3ece2" stroke="#c9bba6"/><text x="145.0" y="124" font-size="18" text-anchor="middle" fill="#3a3128" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">G</text><text x="145.0" y="154" font-size="12" text-anchor="middle" fill="#A67C52" font-family="system-ui, -apple-system, Segoe UI, sans-serif">5</text><path d="M183 129 l6 0" stroke="#9C8F87" stroke-width="1.2"/><rect x="190" y="86" width="74" height="86" rx="9" fill="#f3ece2" stroke="#c9bba6"/><text x="227.0" y="124" font-size="18" text-anchor="middle" fill="#3a3128" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">Am</text><text x="227.0" y="154" font-size="12" text-anchor="middle" fill="#A67C52" font-family="system-ui, -apple-system, Segoe UI, sans-serif">6m</text><path d="M265 129 l6 0" stroke="#9C8F87" stroke-width="1.2"/><rect x="272" y="86" width="74" height="86" rx="9" fill="#f3ece2" stroke="#c9bba6"/><text x="309.0" y="124" font-size="18" text-anchor="middle" fill="#3a3128" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">Em</text><text x="309.0" y="154" font-size="12" text-anchor="middle" fill="#A67C52" font-family="system-ui, -apple-system, Segoe UI, sans-serif">3m</text><path d="M347 129 l6 0" stroke="#9C8F87" stroke-width="1.2"/><rect x="354" y="86" width="74" height="86" rx="9" fill="#f3ece2" stroke="#c9bba6"/><text x="391.0" y="124" font-size="18" text-anchor="middle" fill="#3a3128" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">F</text><text x="391.0" y="154" font-size="12" text-anchor="middle" fill="#A67C52" font-family="system-ui, -apple-system, Segoe UI, sans-serif">4</text><path d="M429 129 l6 0" stroke="#9C8F87" stroke-width="1.2"/><rect x="436" y="86" width="74" height="86" rx="9" fill="#f3ece2" stroke="#c9bba6"/><text x="473.0" y="124" font-size="18" text-anchor="middle" fill="#3a3128" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">C</text><text x="473.0" y="154" font-size="12" text-anchor="middle" fill="#A67C52" font-family="system-ui, -apple-system, Segoe UI, sans-serif">1</text><path d="M511 129 l6 0" stroke="#9C8F87" stroke-width="1.2"/><rect x="518" y="86" width="74" height="86" rx="9" fill="#f3ece2" stroke="#c9bba6"/><text x="555.0" y="124" font-size="18" text-anchor="middle" fill="#3a3128" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">F</text><text x="555.0" y="154" font-size="12" text-anchor="middle" fill="#A67C52" font-family="system-ui, -apple-system, Segoe UI, sans-serif">4</text><path d="M593 129 l6 0" stroke="#9C8F87" stroke-width="1.2"/><rect x="600" y="86" width="74" height="86" rx="9" fill="#f3ece2" stroke="#c9bba6"/><text x="637.0" y="124" font-size="18" text-anchor="middle" fill="#3a3128" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">G</text><text x="637.0" y="154" font-size="12" text-anchor="middle" fill="#A67C52" font-family="system-ui, -apple-system, Segoe UI, sans-serif">5</text><text x="272" y="194" font-size="10.5" text-anchor="start" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">↑ Bar 5 turns to the 4 and opens up; the 4–5 leads the ear home</text><text x="24" y="216" font-size="10.5" text-anchor="start" fill="#3a3128" font-family="system-ui, -apple-system, Segoe UI, sans-serif">1 – 5 – 6m – 3m: the opening four; 6m and 3m are minor, so it sits soft and wistful</text><text x="24" y="236" font-size="10.5" text-anchor="start" fill="#3a3128" font-family="system-ui, -apple-system, Segoe UI, sans-serif">4 – 1 – 4 – 5: the middle comes home first, then 4–5 pushes back to the 1</text><text x="24" y="256" font-size="10.5" text-anchor="start" fill="#3a3128" font-family="system-ui, -apple-system, Segoe UI, sans-serif">Why it is easy to remember: half the eight repeat, so you learn six</text></svg>
