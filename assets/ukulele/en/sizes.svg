<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400" role="img" aria-label="The four ukulele sizes"><title>The four ukulele sizes</title><rect width="760" height="400" fill="#fdfbf7"/><text x="24" y="28" font-size="14" fill="#3a3128" font-family="system-ui, -apple-system, Segoe UI, sans-serif">Four sizes, same scale, stood upright</text><circle cx="110" cy="270" r="40" fill="#C4956A" stroke="#A67C52" stroke-width="1.4"/><circle cx="110" cy="210" r="30" fill="#C4956A" stroke="#A67C52" stroke-width="1.4"/><rect x="105" y="126" width="10" height="55" fill="#A67C52" opacity="0.9"/><rect x="97" y="98" width="26" height="30" rx="6" fill="#A67C52"/><circle cx="110" cy="266" r="5" fill="#fdfbf7" stroke="#c9bba6"/><text x="110" y="332" font-size="12.5" text-anchor="middle" fill="#3a3128" font-family="system-ui, -apple-system, Segoe UI, sans-serif">Soprano</text><text x="110" y="348" font-size="11" text-anchor="middle" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">21 in</text><text x="110" y="362" font-size="10" text-anchor="middle" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">bright, tight frets</text><circle cx="280" cy="266" r="44" fill="#C4956A" stroke="#A67C52" stroke-width="1.4"/><circle cx="280" cy="201" r="33" fill="#C4956A" stroke="#A67C52" stroke-width="1.4"/><rect x="275" y="108" width="11" height="60" fill="#A67C52" opacity="0.9"/><rect x="266" y="77" width="28" height="33" rx="7" fill="#A67C52"/><circle cx="280" cy="262" r="5" fill="#fdfbf7" stroke="#c9bba6"/><text x="280" y="332" font-size="12.5" text-anchor="middle" fill="#3a3128" font-family="system-ui, -apple-system, Segoe UI, sans-serif">Concert</text><text x="280" y="348" font-size="11" text-anchor="middle" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">23 in</text><text x="280" y="362" font-size="10" text-anchor="middle" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">balanced, best bet</text><circle cx="450" cy="260" r="50" fill="#C4956A" stroke="#A67C52" stroke-width="1.4"/><circle cx="450" cy="187" r="37" fill="#C4956A" stroke="#A67C52" stroke-width="1.4"/><rect x="444" y="82" width="12" height="68" fill="#A67C52" opacity="0.9"/><rect x="434" y="47" width="32" height="37" rx="7" fill="#A67C52"/><circle cx="450" cy="256" r="6" fill="#fdfbf7" stroke="#c9bba6"/><text x="450" y="332" font-size="12.5" text-anchor="middle" fill="#3a3128" font-family="system-ui, -apple-system, Segoe UI, sans-serif">Tenor</text><text x="450" y="348" font-size="11" text-anchor="middle" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">26 in</text><text x="450" y="362" font-size="10" text-anchor="middle" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">loud, strong low end</text><circle cx="620" cy="253" r="57" fill="#C4956A" stroke="#A67C52" stroke-width="1.4"/><circle cx="620" cy="168" r="43" fill="#C4956A" stroke="#A67C52" stroke-width="1.4"/><rect x="613" y="46" width="14" height="79" fill="#A67C52" opacity="0.9"/><rect x="601" y="6" width="37" height="43" rx="9" fill="#A67C52"/><circle cx="620" cy="247" r="7" fill="#fdfbf7" stroke="#c9bba6"/><text x="620" y="332" font-size="12.5" text-anchor="middle" fill="#3a3128" font-family="system-ui, -apple-system, Segoe UI, sans-serif">Baritone</text><text x="620" y="348" font-size="11" text-anchor="middle" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">30 in</text><text x="620" y="362" font-size="10" text-anchor="middle" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">deep · D-G-B-E</text><text x="24" y="384" font-size="11" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">The first three (21 / 23 / 26 in) tune the same, G-C-E-A; the 30 in Baritone is D-G-B-E</text></svg>
