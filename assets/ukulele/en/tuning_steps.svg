<svg xmlns="http://www.w3.org/2000/svg" width="720" height="338" viewBox="0 0 720 338" role="img" aria-label="Tuning in four steps: 4th string to 1st"><title>Tuning in four steps: 4th string to 1st</title><rect width="720" height="338" fill="#fdfbf7"/><text x="24" y="34" font-size="15" text-anchor="start" fill="#3a3128" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">Tuning in four steps: 4th string to 1st</text><text x="24" y="55" font-size="11.5" text-anchor="start" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">Run a round every time you pick it up; it takes a minute</text><rect x="24.0" y="84" width="320.0" height="90" rx="10" fill="#f3ece2" stroke="#c9bba6"/><text x="42.0" y="114" font-size="20" text-anchor="start" fill="#A67C52" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">1</text><text x="68.0" y="114" font-size="12.5" text-anchor="start" fill="#3a3128" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">Clip on the tuner</text><text x="42.0" y="138" font-size="10.5" text-anchor="start" fill="#3a3128" font-family="system-ui, -apple-system, Segoe UI, sans-serif">On the headstock, mode C (equal temperament)</text><text x="42.0" y="156" font-size="10.5" text-anchor="start" fill="#3a3128" font-family="system-ui, -apple-system, Segoe UI, sans-serif">reference 440 Hz</text><rect x="360.0" y="84" width="320.0" height="90" rx="10" fill="#f3ece2" stroke="#c9bba6"/><text x="378.0" y="114" font-size="20" text-anchor="start" fill="#A67C52" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">2</text><text x="404.0" y="114" font-size="12.5" text-anchor="start" fill="#3a3128" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">One string at a time</text><text x="378.0" y="138" font-size="10.5" text-anchor="start" fill="#3a3128" font-family="system-ui, -apple-system, Segoe UI, sans-serif">Start on the 4th; after each pluck wait 1–2 </text><text x="378.0" y="156" font-size="10.5" text-anchor="start" fill="#3a3128" font-family="system-ui, -apple-system, Segoe UI, sans-serif">seconds for the note to settle</text><rect x="24.0" y="188" width="320.0" height="90" rx="10" fill="#f3ece2" stroke="#c9bba6"/><text x="42.0" y="218" font-size="20" text-anchor="start" fill="#A67C52" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">3</text><text x="68.0" y="218" font-size="12.5" text-anchor="start" fill="#3a3128" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">Note name first, needle second</text><text x="42.0" y="242" font-size="10.5" text-anchor="start" fill="#3a3128" font-family="system-ui, -apple-system, Segoe UI, sans-serif">Wrong letter means you&#x27;re far off; get the note</text><text x="42.0" y="260" font-size="10.5" text-anchor="start" fill="#3a3128" font-family="system-ui, -apple-system, Segoe UI, sans-serif">The needle only fine-tunes</text><rect x="360.0" y="188" width="320.0" height="90" rx="10" fill="#f3ece2" stroke="#c9bba6"/><text x="378.0" y="218" font-size="20" text-anchor="start" fill="#A67C52" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">4</text><text x="404.0" y="218" font-size="12.5" text-anchor="start" fill="#3a3128" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">Go back and check again</text><text x="378.0" y="242" font-size="10.5" text-anchor="start" fill="#3a3128" font-family="system-ui, -apple-system, Segoe UI, sans-serif">Once the 1st is tuned, the tension shift</text><text x="378.0" y="260" font-size="10.5" text-anchor="start" fill="#3a3128" font-family="system-ui, -apple-system, Segoe UI, sans-serif">pulls the earlier ones flat</text><text x="24" y="324" font-size="10.5" text-anchor="start" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">New strings drift for the first two days; that&#x27;s normal. Tune before you play, and once after</text></svg>
