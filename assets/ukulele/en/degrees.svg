<svg xmlns="http://www.w3.org/2000/svg" width="720" height="270" viewBox="0 0 720 270" role="img" aria-label="Degrees and the chords under them"><title>Degrees and the chords under them</title><rect width="720" height="270" fill="#fdfbf7"/><text x="24" y="34" font-size="15" text-anchor="start" fill="#3a3128" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">Degrees: in any key, the same number is the same job</text><text x="24" y="55" font-size="11.5" text-anchor="start" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">Learn the degrees; change key and only the names shift, the progression stays</text><text x="128" y="106" font-size="11" text-anchor="end" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">Degree</text><rect x="144.0" y="84" width="70.6" height="34" rx="7" fill="#f3ece2" stroke="#c9bba6"/><text x="179.28571428571428" y="106" font-size="12.5" text-anchor="middle" fill="#3a3128" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">1</text><rect x="222.6" y="84" width="70.6" height="34" rx="7" fill="#fdfbf7" stroke="#c9bba6"/><text x="257.85714285714283" y="106" font-size="12.5" text-anchor="middle" fill="#3a3128" font-family="system-ui, -apple-system, Segoe UI, sans-serif">2m</text><rect x="301.1" y="84" width="70.6" height="34" rx="7" fill="#fdfbf7" stroke="#c9bba6"/><text x="336.4285714285714" y="106" font-size="12.5" text-anchor="middle" fill="#3a3128" font-family="system-ui, -apple-system, Segoe UI, sans-serif">3m</text><rect x="379.7" y="84" width="70.6" height="34" rx="7" fill="#fdfbf7" stroke="#c9bba6"/><text x="415.0" y="106" font-size="12.5" text-anchor="middle" fill="#3a3128" font-family="system-ui, -apple-system, Segoe UI, sans-serif">4</text><rect x="458.3" y="84" width="70.6" height="34" rx="7" fill="#f3ece2" stroke="#c9bba6"/><text x="493.57142857142856" y="106" font-size="12.5" text-anchor="middle" fill="#3a3128" font-weight="700" f