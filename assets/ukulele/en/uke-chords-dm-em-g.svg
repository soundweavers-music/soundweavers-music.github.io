<svg xmlns="http://www.w3.org/2000/svg" width="720" height="372" viewBox="0 0 720 372" role="img" aria-label="The three most-used chords: Dm, Em, G"><title>The three most-used chords: Dm, Em, G</title><rect width="720" height="372" fill="#fdfbf7"/><text x="24" y="30" font-size="15" text-anchor="start" fill="#3a3128" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">The three most-used chords: Dm, Em, G</text><text x="24" y="50" font-size="11.5" text-anchor="start" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">Left to right is the 4th string to the 1st; ○ strum it, ● is a pressed string</text><text x="136.0" y="84" font-size="14" text-anchor="middle" fill="#3a3128" font-family="system-ui, -apple-system, Segoe UI, sans-serif">Dm</text><line x1="108.0" y1="110" x2="108.0" y2="182" stroke="#c9bba6" stroke-width="1.2"/><line x1="126.0" y1="110" x2="126.0" y2="182" stroke="#c9bba6" stroke-width="1.2"/><line x1="144.0" y1="110" x2="144.0" y2="182" stroke="#c9bba6" stroke-width="1.2"/><line x1="162.0" y1="110" x2="162.0" y2="182" stroke="#c9bba6" stroke-width="1.2"/><line x1="108.0" y1="110" x2="162.0" y2="110" stroke="#3a3128" stroke-width="2"/><line x1="108.0" y1="128" x2="162.0" y2="128" stroke="#c9bba6" stroke-width="1.2"/><line x1="108.0" y1="146" x2="162.0" y2="146" stroke="#c9bba6" stroke-width="1.2"/><line x1="108.0" y1="164" x2="162.0" y2="164" stroke="#c9bba6" stroke-width="1.2"/><line x1="108.0" y1="182" x2="162.0" y2="182" stroke="#c9bba6" stroke-width="1.2"/><circle cx="108.0" cy="137.0" r="6.5" fill="#C4956A"/><circle cx="126.0" cy="137.0" r="6.5" fill="#C4956A"/><circle cx="144.0" cy="119.0" r="6.5" fill="#C4956A"/><circle cx="162.0" cy="102" r="4" fill="none" stroke="#A67C52" stroke-width="1.6"/><text x="136.0" y="248" font-size="9.5" text-anchor="middle" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">Index: 2nd string, fret 1</text><text x="136.0" y="264" font-size="9.5"