<svg xmlns="http://www.w3.org/2000/svg" width="720" height="350" viewBox="0 0 720 350" role="img" aria-label="Three grades of construction: why the price differs"><title>Three grades of construction: why the price differs</title><rect width="720" height="350" fill="#fdfbf7"/><text x="24" y="34" font-size="15" text-anchor="start" fill="#3a3128" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">Three grades of construction: why the price differs</text><text x="24" y="55" font-size="11.5" text-anchor="start" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">The difference is how many layers the top has, not the name of the wood</text><text x="164.0" y="84" font-size="11.5" text-anchor="start" fill="#A67C52" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">Laminate</text><text x="434.0" y="84" font-size="11.5" text-anchor="start" fill="#A67C52" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">All solid</text><rect x="24" y="96" width="672" height="56" fill="#f3ece2" opacity=".5"/><text x="34" y="120" font-size="11.5" text-anchor="start" fill="#3a3128" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">Construction</text><text x="164.0" y="118" font-size="10.5" text-anchor="start" fill="#3a3128" font-family="system-ui, -apple-system, Segoe UI, sans-serif">Three thin sheets, grain crossed</text><text x="434.0" y="118" font-size="10.5" text-anchor="start" fill="#3a3128" font-family="system-ui, -apple-system, Segoe UI, sans-serif">One solid piece, sliced thin</text><text x="34" y="176" font-size="11.5" text-anchor="start" fill="#3a3128" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">Tone</text><text x="164.0" y="174" font-size="10.5" text-anchor="start" fill="#3a3128" font-family="system-ui, -apple-system, Segoe UI, sans-serif">Thinner, doesn&#x27;t open up</text><text x="434.0" y="174" font-size="10.5" text-anchor="start" fill="#3a3128" font-family="system-ui, -apple-system, Segoe UI, sans-serif">Opens up with age; warm lows, sustain</text><rect x="24" y="208" width="672" height="56" fill="#f3ece2" opacity=".5"/><text x="34" y="232" font-size="11.5" text-anchor="start" fill="#3a3128" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">Price</text><text x="164.0" y="230" font-size="10.5" text-anchor="start" fill="#3a3128" font-family="system-ui, -apple-system, Segoe UI, sans-serif">Cheap, a good first uke</text><text x="434.0" y="230" font-size="10.5" text-anchor="start" fill="#3a3128" font-family="system-ui, -apple-system, Segoe UI, sans-serif">Dearer, needs looking after</text><text x="34" y="288" font-size="11.5" text-anchor="start" fill="#3a3128" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">Best for</text><text x="164.0" y="286" font-size="10.5" text-anchor="start" fill="#3a3128" font-family="system-ui, -apple-system, Segoe UI, sans-serif">Travel, casual strumming, tight budget</text><text x="434.0" y="286" font-size="10.5" text-anchor="start" fill="#3a3128" font-family="system-ui, -apple-system, Segoe UI, sans-serif">Daily playing, care about tone</text><text x="24" y="338" font-size="10.5" text-anchor="start" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">Solid top, with laminate back and sides, is the middle option: better tone than laminate, cheaper than all solid</text></svg>
