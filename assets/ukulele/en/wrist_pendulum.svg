<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" role="img" aria-label="The wrist pendulum"><title>The wrist pendulum</title><rect width="720" height="300" fill="#fdfbf7"/><text x="24" y="34" font-size="15" text-anchor="start" fill="#3a3128" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">Right hand as pendulum: wrist moves, elbow stays</text><text x="24" y="55" font-size="11.5" text-anchor="start" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">Down strums take all four strings, up strums only the high ones; the pass that misses is an air strum</text><rect x="90" y="118" width="150" height="34" rx="12" fill="#f3ece2" stroke="#c9bba6"/><text x="165" y="108" font-size="10" text-anchor="middle" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">forearm (fixed)</text><circle cx="250" cy="135" r="13" fill="#A67C52"/><text x="250" y="172" font-size="10" text-anchor="middle" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">wrist pivot</text><path d="M250 135 m -92 -46 a 104 104 0 0 1 0 92" stroke="#C4956A" stroke-width="3" fill="none"/><path d="M250 135 L404 96" stroke="#A67C52" stroke-width="3"/><path d="M250 135 L404 176" stroke="#A67C52" stroke-width="3"/><text x="414" y="100" font-size="10.5" text-anchor="start" fill="#3a3128" font-family="system-ui, -apple-system, Segoe UI, sans-serif">up strum (top strings)</text><text x="414" y="180" font-size="10.5" text-anchor="start" fill="#3a3128" font-family="system-ui, -apple-system, Segoe UI, sans-serif">down strum (all four)</text><text x="356" y="70" font-size="10" text-anchor="middle" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">air strum: the hand swings but misses</text><path d="M330 62 q 26 -18 52 0" stroke="#9C8F87" stroke-width="1" fill="none"/><text x="24" y="238" font-size="11" text-anchor="start" fill="#3a3128" font-family="system-ui, -apple-system, Segoe UI, sans-serif">Keep the wrist moving and the beat holds; let the elbow swing and it falls apart</text><text x="24" y="266" font-size="10.5" text-anchor="start" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">The shorter the stroke and the nearer the wrist, the faster you can go—this is the way into 16-beat strumming</text></svg>
