<svg xmlns="http://www.w3.org/2000/svg" width="640" height="240" viewBox="0 0 640 240" role="img" aria-label="High-G vs Low-G string order"><title>High-G vs Low-G string order</title><rect width="640" height="240" fill="#fdfbf7"/><text x="24" y="28" font-size="14" fill="#3a3128" font-family="system-ui, -apple-system, Segoe UI, sans-serif">High-G vs Low-G: the string order changes</text><text x="24" y="74" font-size="12" fill="#3a3128" font-family="system-ui, -apple-system, Segoe UI, sans-serif">High-G (standard)</text><rect x="190" y="54" width="60" height="28" rx="6" fill="#fdfbf7" stroke="#c9bba6"/><text x="220" y="72" font-size="12" text-anchor="middle" fill="#3a3128" font-family="system-ui, -apple-system, Segoe UI, sans-serif">A4</text><rect x="262" y="54" width="60" height="28" rx="6" fill="#fdfbf7" stroke="#c9bba6"/><text x="292" y="72" font-size="12" text-anchor="middle" fill="#3a3128" font-family="system-ui, -apple-system, Segoe UI, sans-serif">E4</text><rect x="334" y="54" width="60" height="28" rx="6" fill="#fdfbf7" stroke="#c9bba6"/><text x="364" y="72" font-size="12" text-anchor="middle" fill="#3a3128" font-family="system-ui, -apple-system, Segoe UI, sans-serif">C4</text><rect x="406" y="54" width="60" height="28" rx="6" fill="#fdfbf7" stroke="#c9bba6"/><text x="436" y="72" font-size="12" text-anchor="middle" fill="#3a3128" font-family="system-ui, -apple-system, Segoe UI, sans-serif">G4</text><text x="24" y="96" font-size="11" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">4th above the 3rd: it sounds jumpy</text><text x="24" y="150" font-size="12" fill="#3a3128" font-family="system-ui, -apple-system, Segoe UI, sans-serif">Low-G (modified)</text><rect x="190" y="130" width="60" height="28" rx="6" fill="#fdfbf7" stroke="#c9bba6"/><text x="220" y="148" font-size="12" text-anchor="middle" fill="#3a3128" font-family="system-ui, -apple-system, Segoe UI, sans-serif">A4</text><rect x="262" y="130" width="60" height="28" rx="6" fill="#fdfbf7" stroke="#c9bba6"/><text x="292" y="148" font-size="12" text-anchor="middle" fill="#3a3128" font-family="system-ui, -apple-system, Segoe UI, sans-serif">E4</text><rect x="334" y="130" width="60" height="28" rx="6" fill="#fdfbf7" stroke="#c9bba6"/><text x="364" y="148" font-size="12" text-anchor="middle" fill="#3a3128" font-family="system-ui, -apple-system, Segoe UI, sans-serif">C4</text><rect x="406" y="130" width="60" height="28" rx="6" fill="#f6efe6" stroke="#c9bba6"/><text x="436" y="148" font-size="12" text-anchor="middle" fill="#3a3128" font-family="system-ui, -apple-system, Segoe UI, sans-serif">G3</text><text x="24" y="172" font-size="11" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">4th now lowest: chords get fatter</text><text x="24" y="222" font-size="10.5" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">Left to right is string 1 to string 4; Low-G swaps only the 4th, so every shape still works</text></svg>
