<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" role="img" aria-label="Where the natural harmonics sit"><title>Where the natural harmonics sit</title><rect width="720" height="300" fill="#fdfbf7"/><text x="24" y="34" font-size="15" text-anchor="start" fill="#3a3128" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">Harmonics: touch the wire, don&#x27;t press</text><text x="24" y="55" font-size="11.5" text-anchor="start" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">Fret 12 is easiest and loudest; frets 7 and 5 ring higher and thinner</text><rect x="90" y="96" width="550" height="60" fill="#faf4ea" stroke="#c9bba6"/><line x1="90.0" y1="96" x2="90.0" y2="156" stroke="#9C8F87" stroke-width="2.6"/><line x1="135.8" y1="96" x2="135.8" y2="156" stroke="#9C8F87" stroke-width="1"/><line x1="181.7" y1="96" x2="181.7" y2="156" stroke="#9C8F87" stroke-width="1"/><line x1="227.5" y1="96" x2="227.5" y2="156" stroke="#9C8F87" stroke-width="1"/><line x1="273.3" y1="96" x2="273.3" y2="156" stroke="#9C8F87" stroke-width="1"/><line x1="319.2" y1="96" x2="319.2" y2="156" stroke="#9C8F87" stroke-width="1"/><line x1="365.0" y1="96" x2="365.0" y2="156" stroke="#9C8F87" stroke-width="1"/><line x1="410.8" y1="96" x2="410.8" y2="156" stroke="#9C8F87" stroke-width="1"/><line x1="456.7" y1="96" x2="456.7" y2="156" stroke="#9C8F87" stroke-width="1"/><line x1="502.5" y1="96" x2="502.5" y2="156" stroke="#9C8F87" stroke-width="1"/><line x1="548.3" y1="96" x2="548.3" y2="156" stroke="#9C8F87" stroke-width="1"/><line x1="594.2" y1="96" x2="594.2" y2="156" stroke="#9C8F87" stroke-width="1"/><line x1="640.0" y1="96" x2="640.0" y2="156" stroke="#9C8F87" stroke-width="1"/><circle cx="640.0" cy="126.0" r="11" fill="#A67C52"/><text x="640.0" y="178" font-size="11" text-anchor="middle" fill="#3a3128" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">12</text><text x="640.0" y="196" font-size="9" text-anchor="middle" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">Fret 12 · octave up</text><circle cx="410.8" cy="126.0" r="11" fill="#A67C52"/><text x="410.83333333333337" y="178" font-size="11" text-anchor="middle" fill="#3a3128" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">7</text><text x="410.83333333333337" y="196" font-size="9" text-anchor="middle" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">Fret 7 · octave + 5th</text><circle cx="319.2" cy="126.0" r="11" fill="#A67C52"/><text x="319.1666666666667" y="178" font-size="11" text-anchor="middle" fill="#3a3128" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">5</text><text x="319.1666666666667" y="196" font-size="9" text-anchor="middle" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">Fret 5 · two octaves up</text><text x="112.91666666666667" y="178" font-size="8.5" text-anchor="middle" fill="#cfc4b8" font-family="system-ui, -apple-system, Segoe UI, sans-serif">1</text><text x="158.75000000000003" y="178" font-size="8.5" text-anchor="middle" fill="#cfc4b8" font-family="system-ui, -apple-system, Segoe UI, sans-serif">2</text><text x="204.58333333333334" y="178" font-size="8.5" text-anchor="middle" fill="#cfc4b8" font-family="system-ui, -apple-system, Segoe UI, sans-serif">3</text><text x="250.4166666666667" y="178" font-size="8.5" text-anchor="middle" fill="#cfc4b8" font-family="system-ui, -apple-system, Segoe UI, sans-serif">4</text><text x="296.25" y="178" font-size="8.5" text-anchor="middle" fill="#cfc4b8" font-family="system-ui, -apple-system, Segoe UI, sans-serif">5</text><text x="342.0833333333333" y="178" font-size="8.5" text-anchor="middle" fill="#cfc4b8" font-family="system-ui, -apple-system, Segoe UI, sans-serif">6</text><text x="387.9166666666667" y="178" font-size="8.5" text-anchor="middle" fill="#cfc4b8" font-family="system-ui, -apple-system, Segoe UI, sans-serif">7</text><text x="433.75" y="178" font-size="8.5" text-anchor="middle" fill="#cfc4b8" font-family="system-ui, -apple-system, Segoe UI, sans-serif">8</text><text x="479.5833333333333" y="178" font-size="8.5" text-anchor="middle" fill="#cfc4b8" font-family="system-ui, -apple-system, Segoe UI, sans-serif">9</text><text x="525.4166666666667" y="178" font-size="8.5" text-anchor="middle" fill="#cfc4b8" font-family="system-ui, -apple-system, Segoe UI, sans-serif">10</text><text x="571.2500000000001" y="178" font-size="8.5" text-anchor="middle" fill="#cfc4b8" font-family="system-ui, -apple-system, Segoe UI, sans-serif">11</text><text x="617.0833333333334" y="178" font-size="8.5" text-anchor="middle" fill="#cfc4b8" font-family="system-ui, -apple-system, Segoe UI, sans-serif">12</text><text x="24" y="238" font-size="11" text-anchor="start" fill="#3a3128" font-family="system-ui, -apple-system, Segoe UI, sans-serif">How: rest the fingertip on the wire without pressing, pluck with the right hand and lift the left at once</text><text x="24" y="262" font-size="10.5" text-anchor="start" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">Quiet is normal; move the mic closer, or lift those notes in the mix afterwards</text></svg>
