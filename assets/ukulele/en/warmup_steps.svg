<svg xmlns="http://www.w3.org/2000/svg" width="720" height="338" viewBox="0 0 720 338" role="img" aria-label="Today&#x27;s warm-up: three things, two minutes each"><title>Today&#x27;s warm-up: three things, two minutes each</title><rect width="720" height="338" fill="#fdfbf7"/><text x="24" y="34" font-size="15" text-anchor="start" fill="#3a3128" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">Today&#x27;s warm-up: three things, two minutes each</text><text x="24" y="55" font-size="11.5" text-anchor="start" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">The point isn&#x27;t to master anything—it&#x27;s waking up the fingers and settling the tuning</text><rect x="24.0" y="84" width="320.0" height="90" rx="10" fill="#f3ece2" stroke="#c9bba6"/><text x="42.0" y="114" font-size="20" text-anchor="start" fill="#A67C52" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">1</text><text x="68.0" y="114" font-size="12.5" text-anchor="start" fill="#3a3128" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">The 1-2-3-4 walk</text><text x="42.0" y="138" font-size="10.5" text-anchor="start" fill="#3a3128" font-family="system-ui, -apple-system, Segoe UI, sans-serif">Frets 1–4, one finger each, from the 4th</text><text x="42.0" y="156" font-size="10.5" text-anchor="start" fill="#3a3128" font-family="system-ui, -apple-system, Segoe UI, sans-serif"> string up to the 1st, 60 BPM</text><rect x="360.0" y="84" width="320.0" height="90" rx="10" fill="#f3ece2" stroke="#c9bba6"/><text x="378.0" y="114" font-size="20" text-anchor="start" fill="#A67C52" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">2</text><text x="404.0" y="114" font-size="12.5" text-anchor="start" fill="#3a3128" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">Open-string control</text><text x="378.0" y="138" font-size="10.5" text-anchor="start" fill="#3a3128" font-family="system-ui, -apple-system, Segoe UI, sans-serif">Four plucks per string: same volume, same length</text><rect x="24.0" y="188" width="320.0" height="90" rx="10" fill="#f3ece2" stroke="#c9bba6"/><text x="42.0" y="218" font-size="20" text-anchor="start" fill="#A67C52" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">3</text><text x="68.0" y="218" font-size="12.5" text-anchor="start" fill="#3a3128" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">Chord changes</text><text x="42.0" y="242" font-size="10.5" text-anchor="start" fill="#3a3128" font-family="system-ui, -apple-system, Segoe UI, sans-serif">C → Am → F → G7</text><text x="42.0" y="260" font-size="10.5" text-anchor="start" fill="#3a3128" font-family="system-ui, -apple-system, Segoe UI, sans-serif">Change slowly; clean, not fast</text><text x="24" y="324" font-size="10.5" text-anchor="start" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">Practising fast before your hands are warm is the commonest way adult players hurt themselves</text></svg>
