<svg xmlns="http://www.w3.org/2000/svg" width="720" height="330" viewBox="0 0 720 330" role="img" aria-label="Where and how the left hand frets"><title>Where and how the left hand frets</title><rect width="720" height="330" fill="#fdfbf7"/><text x="24" y="34" font-size="15" text-anchor="start" fill="#3a3128" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">Fretting: where you press, and at what angle</text><text x="24" y="55" font-size="11.5" text-anchor="start" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">In the right spot a note rings with no effort; in the wrong spot, more force still sounds dead</text><rect x="48" y="96" width="176" height="64" fill="#faf4ea" stroke="#c9bba6"/><line x1="48" y1="96" x2="224" y2="96" stroke="#9C8F87" stroke-width="2.4"/><line x1="48" y1="128" x2="224" y2="128" stroke="#9C8F87" stroke-width="1"/><line x1="48" y1="160" x2="224" y2="160" stroke="#9C8F87" stroke-width="1"/><line x1="48" y1="160" x2="224" y2="160" stroke="#9C8F87"/><line x1="224" y1="96" x2="224" y2="160" stroke="#3a3128" stroke-width="3"/><circle cx="171.6" cy="144" r="9" fill="#A67C52"/><text x="136" y="188" font-size="10.5" text-anchor="middle" fill="#3a3128" font-family="system-ui, -apple-system, Segoe UI, sans-serif">○ Correct: next to the fret</text><rect x="272" y="96" width="176" height="64" fill="#faf4ea" stroke="#c9bba6"/><line x1="272" y1="96" x2="448" y2="96" stroke="#9C8F87" stroke-width="2.4"/><line x1="272" y1="128" x2="448" y2="128" stroke="#9C8F87" stroke-width="1"/><line x1="272" y1="160" x2="448" y2="160" stroke="#9C8F87" stroke-width="1"/><line x1="272" y1="160" x2="448" y2="160" stroke="#9C8F87"/><line x1="448" y1="96" x2="448" y2="160" stroke="#3a3128" stroke-width="3"/><circle cx="356.0" cy="144" r="9" fill="#B4553F"/><text x="360" y="188" font-size="10.5" text-anchor="middle" fill="#3a3128" font-family="system-ui, -apple-system, Segoe UI, sans-serif">✕ Mid-fret: twice the effort</text><rect x="496" y="96" width="176" height="64" fill="#faf4ea" stroke="#c9bba6"/><line x1="496" y1="96" x2="672" y2="96" stroke="#9C8F87" stroke-width="2.4"/><line x1="496" y1="128" x2="672" y2="128" stroke="#9C8F87" stroke-width="1"/><line x1="496" y1="160" x2="672" y2="160" stroke="#9C8F87" stroke-width="1"/><line x1="496" y1="160" x2="672" y2="160" stroke="#9C8F87"/><line x1="672" y1="96" x2="672" y2="160" stroke="#3a3128" stroke-width="3"/><circle cx="642.0" cy="144" r="9" fill="#B4553F"/><text x="584" y="188" font-size="10.5" text-anchor="middle" fill="#3a3128" font-family="system-ui, -apple-system, Segoe UI, sans-serif">✕ On the fret: the note dies</text><text x="48" y="240" font-size="11" text-anchor="start" fill="#3a3128" font-family="system-ui, -apple-system, Segoe UI, sans-serif">Fingertips upright, dropping straight down: at right angles, so the next string still rings</text><text x="48" y="264" font-size="11" text-anchor="start" fill="#3a3128" font-family="system-ui, -apple-system, Segoe UI, sans-serif">Wrist slightly arched, a gap at the web; palm against the neck and the little finger can&#x27;t reach</text><text x="48" y="314" font-size="10.5" text-anchor="start" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">Soft strings: a dead note is almost always the wrong spot or a collapsed fingertip, rarely force</text></svg>
