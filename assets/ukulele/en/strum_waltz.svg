<svg xmlns="http://www.w3.org/2000/svg" width="620" height="300" viewBox="0 0 620 300" role="img" aria-label="Strum placement in triple time"><title>Strum placement in triple time</title><rect width="620" height="300" fill="#fdfbf7"/><text x="24" y="28" font-size="14" fill="#3a3128" font-family="system-ui, -apple-system, Segoe UI, sans-serif">Strum placement in 3/4 and 6/8</text><text x="24" y="62" font-size="12.5" fill="#3a3128" font-family="system-ui, -apple-system, Segoe UI, sans-serif">3/4 (waltz: strong–weak–weak)</text><rect x="40" y="74" width="104" height="52" rx="6" fill="#f3ece2" stroke="#c9bba6"/><text x="92" y="106" font-size="18" text-anchor="middle" fill="#A67C52" font-family="system-ui, -apple-system, Segoe UI, sans-serif">↓</text><text x="92" y="120" font-size="10" text-anchor="middle" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">1</text><rect x="160" y="74" width="104" height="52" rx="6" fill="#fdfbf7" stroke="#c9bba6"/><text x="212" y="106" font-size="18" text-anchor="middle" fill="#A67C52" font-family="system-ui, -apple-system, Segoe UI, sans-serif">↓ ↑</text><text x="212" y="120" font-size="10" text-anchor="middle" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">2</text><rect x="280" y="74" width="104" height="52" rx="6" fill="#fdfbf7" stroke="#c9bba6"/><text x="332" y="106" font-size="18" text-anchor="middle" fill="#A67C52" font-family="system-ui, -apple-system, Segoe UI, sans-serif">↓ ↑</text><text x="332" y="120" font-size="10" text-anchor="middle" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">3</text><text x="24" y="168" font-size="12.5" fill="#3a3128" font-family="system-ui, -apple-system, Segoe UI, sans-serif">6/8 (two big beats, three strums each)</text><rect x="40" y="180" width="234" height="52" rx="6" fill="#f3ece2" stroke="#c9bba6"/><text x="157" y="206" font-size="16" text-anchor="middle" fill="#A67C52" font-family="system-ui, -apple-system, Segoe UI, sans-serif">↓　↓　↑</text><text x="157" y="222" font-size="10" text-anchor="middle" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">1 2 3　</text><rect x="290" y="180" width="234" height="52" rx="6" fill="#fdfbf7" stroke="#c9bba6"/><text x="407" y="206" font-size="16" text-anchor="middle" fill="#A67C52" font-family="system-ui, -apple-system, Segoe UI, sans-serif">↓　↓　↑</text><text x="407" y="222" font-size="10" text-anchor="middle" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">1 2 3 4 5 6</text><text x="24" y="268" font-size="11" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">In 3/4 make beat 1 fullest; in 6/8 accent the two big beats—don&#x27;t give all six the same weight</text></svg>
