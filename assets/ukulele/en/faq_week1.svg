<svg xmlns="http://www.w3.org/2000/svg" width="720" height="294" viewBox="0 0 720 294" role="img" aria-label="Three week-one stumbling blocks"><title>Three week-one stumbling blocks</title><rect width="720" height="294" fill="#fdfbf7"/><text x="24" y="34" font-size="15" text-anchor="start" fill="#3a3128" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">Three week-one stumbling blocks</text><text x="24" y="55" font-size="11.5" text-anchor="start" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">Almost everyone hits these three, and none of them means you lack talent</text><text x="164.0" y="84" font-size="11.5" text-anchor="start" fill="#A67C52" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">Real reason</text><text x="434.0" y="84" font-size="11.5" text-anchor="start" fill="#A67C52" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">Fix</text><rect x="24" y="96" width="672" height="56" fill="#f3ece2" opacity=".5"/><text x="34" y="120" font-size="11.5" text-anchor="start" fill="#3a3128" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">Sore fingers</text><text x="164.0" y="118" font-size="10.5" text-anchor="start" fill="#3a3128" font-family="system-ui, -apple-system, Segoe UI, sans-serif">Finger pressed halfway between frets,</text><text x="164.0" y="135" font-size="10.5" text-anchor="start" fill="#3a3128" font-family="system-ui, -apple-system, Segoe UI, sans-serif">fingertip lying flat</text><text x="434.0" y="118" font-size="10.5" text-anchor="start" fill="#3a3128" font-family="system-ui, -apple-system, Segoe UI, sans-serif">Press by the fret, fingertips upright; </text><text x="434.0" y="135" font-size="10.5" text-anchor="start" fill="#3a3128" font-family="system-ui, -apple-system, Segoe UI, sans-serif">ten minutes a day is enough</text><text x="34" y="176" font-size="11.5" text-anchor="start" fill="#3a3128" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">Muted chords</text><text x="164.0" y="174" font-size="10.5" text-anchor="start" fill="#3a3128" font-family="system-ui, -apple-system, Segoe UI, sans-serif">A finger is touching the next string</text><text x="434.0" y="174" font-size="10.5" text-anchor="start" fill="#3a3128" font-family="system-ui, -apple-system, Segoe UI, sans-serif">Stand fingers up; press one string only</text><text x="434.0" y="191" font-size="10.5" text-anchor="start" fill="#3a3128" font-family="system-ui, -apple-system, Segoe UI, sans-serif">that should ring</text><rect x="24" y="208" width="672" height="56" fill="#f3ece2" opacity=".5"/><text x="34" y="232" font-size="11.5" text-anchor="start" fill="#3a3128" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">Slow chord changes</text><text x="164.0" y="230" font-size="10.5" text-anchor="start" fill="#3a3128" font-family="system-ui, -apple-system, Segoe UI, sans-serif">The whole hand lifts and hunts again</text><text x="434.0" y="230" font-size="10.5" text-anchor="start" fill="#3a3128" font-family="system-ui, -apple-system, Segoe UI, sans-serif">Keep one common finger as a signpost (see </text><text x="434.0" y="247" font-size="10.5" text-anchor="start" fill="#3a3128" font-family="system-ui, -apple-system, Segoe UI, sans-serif">5.2）</text><text x="24" y="282" font-size="10.5" text-anchor="start" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">Sore is normal, broken skin is not. Before the calluses come, play ten minutes less, not more</text></svg>
