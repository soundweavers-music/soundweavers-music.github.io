<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" role="img" aria-label="Barre shapes move"><title>Barre shapes move</title><rect width="720" height="300" fill="#fdfbf7"/><text x="24" y="34" font-size="15" text-anchor="start" fill="#3a3128" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">Moving a barre chord: same grip, further right, higher key</text><text x="24" y="55" font-size="11.5" text-anchor="start" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">Index barres the fret, three fingers fill in; 1 fret toward the body = up a semitone</text><rect x="90" y="96" width="440" height="80" rx="6" fill="#faf4ea" stroke="#c9bba6"/><line x1="90" y1="96" x2="90" y2="176" stroke="#9C8F87" stroke-width="2.6"/><line x1="178" y1="96" x2="178" y2="176" stroke="#9C8F87" stroke-width="1"/><line x1="266" y1="96" x2="266" y2="176" stroke="#9C8F87" stroke-width="1"/><line x1="354" y1="96" x2="354" y2="176" stroke="#9C8F87" stroke-width="1"/><line x1="442" y1="96" x2="442" y2="176" stroke="#9C8F87" stroke-width="1"/><line x1="530" y1="96" x2="530" y2="176" stroke="#9C8F87" stroke-width="1"/><text x="134.0" y="194" font-size="10" text-anchor="middle" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">1</text><text x="222.0" y="194" font-size="10" text-anchor="middle" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">2</text><text x="310.0" y="194" font-size="10" text-anchor="middle" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">3</text><text x="398.0" y="194" font-size="10" text-anchor="middle" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">4</text><text x="486.0" y="194" font-size="10" text-anchor="middle" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">5</text><rect x="108.0" y="116" width="52" height="42" rx="8" fill="#C4956A" opacity="0.95"/><text x="134.0" y="136" font-size="14" text-anchor="middle" fill="#fdfbf7" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">Bb</text><text x="134.0" y="152" font-size="9" text-anchor="middle" fill="#fdfbf7" font-family="system-ui, -apple-system, Segoe UI, sans-serif">fret 1</text><rect x="196.0" y="116" width="52" height="42" rx="8" fill="#C4956A" opacity="0.75"/><text x="222.0" y="136" font-size="14" text-anchor="middle" fill="#fdfbf7" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">B</text><text x="222.0" y="152" font-size="9" text-anchor="middle" fill="#fdfbf7" font-family="system-ui, -apple-system, Segoe UI, sans-serif">fret 2</text><rect x="284.0" y="116" width="52" height="42" rx="8" fill="#C4956A" opacity="0.5499999999999999"/><text x="310.0" y="136" font-size="14" text-anchor="middle" fill="#fdfbf7" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">C</text><text x="310.0" y="152" font-size="9" text-anchor="middle" fill="#fdfbf7" font-family="system-ui, -apple-system, Segoe UI, sans-serif">fret 3</text><text x="24" y="234" font-size="11" text-anchor="start" fill="#3a3128" font-family="system-ui, -apple-system, Segoe UI, sans-serif">Same shape: fret 1 is Bb, fret 2 is B, fret 3 is C—no new grip, just move</text><text x="24" y="260" font-size="10.5" text-anchor="start" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">3 minutes a day: frets 1, 3, 5 and 7, four strums each, all four strings ringing</text></svg>
