<svg xmlns="http://www.w3.org/2000/svg" width="760" height="320" viewBox="0 0 760 320" role="img" aria-label="Ukulele anatomy"><title>Ukulele anatomy</title><rect width="760" height="320" fill="#fdfbf7"/><text x="24" y="30" font-size="14" fill="#3a3128" font-family="system-ui, -apple-system, Segoe UI, sans-serif">Parts of the ukulele</text><path d="M 120 250 c -52 0 -52 -78 0 -94 c 30 -10 52 -28 52 -44 c 0 -18 34 -18 34 0 c 0 16 22 34 52 44 c 52 16 52 94 0 94 z" fill="#C4956A" stroke="#A67C52" stroke-width="1.5"/><circle cx="187" cy="205" r="17" fill="#fdfbf7" stroke="#c9bba6" stroke-width="1.2"/><text x="187" y="209" font-size="9" text-anchor="middle" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">Soundhole</text><rect x="196" y="196" width="10" height="30" fill="#A67C52"/><rect x="187" y="89" width="34" height="14" fill="#A67C52" opacity="0.9"/><rect x="196" y="103" width="16" height="104" fill="#A67C52" opacity="0.75"/><line x1="196" y1="118" x2="212" y2="118" stroke="#3a3128" stroke-width="0.9" opacity="0.45"/><line x1="196" y1="129" x2="212" y2="129" stroke="#3a3128" stroke-width="0.9" opacity="0.45"/><line x1="196" y1="140" x2="212" y2="140" stroke="#3a3128" stroke-width="0.9" opacity="0.45"/><line x1="196" y1="151" x2="212" y2="151" stroke="#3a3128" stroke-width="0.9" opacity="0.45"/><line x1="196" y1="162" x2="212" y2="162" stroke="#3a3128" stroke-width="0.9" opacity="0.45"/><line x1="196" y1="173" x2="212" y2="173" stroke="#3a3128" stroke-width="0.9" opacity="0.45"/><line x1="196" y1="184" x2="212" y2="184" stroke="#3a3128" stroke-width="0.9" opacity="0.45"/><line x1="196" y1="195" x2="212" y2="195" stroke="#3a3128" stroke-width="0.9" opacity="0.45"/><line x1="196" y1="206" x2="212" y2="206" stroke="#3a3128" stroke-width="0.9" opacity="0.45"/><rect x="195" y="52" width="18" height="38" rx="6" fill="#A67C52"/><circle cx="191" cy="60" r="3" fill="#fdfbf7" stroke="#c9bba6"/><circle cx="217" cy="69" r="3" fill="#fdfbf7" stroke="#c9bba6"/><circle cx="191" cy="78" r="3" fill="#fdfbf7" stroke="#c9bba6"/><circle cx="217" cy="87" r="3" fill="#fdfbf7" stroke="#c9bba6"/><line x1="198" y1="60" x2="198" y2="226" stroke="#3a3128" stroke-width="0.8" opacity="0.55"/><line x1="202" y1="60" x2="202" y2="226" stroke="#3a3128" stroke-width="0.8" opacity="0.55"/><line x1="206" y1="60" x2="206" y2="226" stroke="#3a3128" stroke-width="0.8" opacity="0.55"/><line x1="210" y1="60" x2="210" y2="226" stroke="#3a3128" stroke-width="0.8" opacity="0.55"/><line x1="228" y1="80" x2="240" y2="80" stroke="#c9bba6"/><text x="244" y="84" font-size="12" fill="#3a3128" font-family="system-ui, -apple-system, Segoe UI, sans-serif">Headstock: holds the tuning pegs</text><line x1="228" y1="104" x2="240" y2="104" stroke="#c9bba6"/><text x="244" y="108" font-size="12" fill="#3a3128" font-family="system-ui, -apple-system, Segoe UI, sans-serif">Nut: where the string&#x27;s speaking length starts</text><line x1="228" y1="146" x2="240" y2="146" stroke="#c9bba6"/><text x="244" y="150" font-size="12" fill="#3a3128" font-family="system-ui, -apple-system, Segoe UI, sans-serif">Neck and frets: what the left hand presses</text><line x1="228" y1="201" x2="240" y2="201" stroke="#c9bba6"/><text x="244" y="205" font-size="12" fill="#3a3128" font-family="system-ui, -apple-system, Segoe UI, sans-serif">Saddle: where vibration ends, and sustain with it</text><line x1="228" y1="240" x2="240" y2="240" stroke="#c9bba6"/><text x="244" y="244" font-size="12" fill="#3a3128" font-family="system-ui, -apple-system, Segoe UI, sans-serif">Body: the top sets the tone and volume</text><text x="24" y="300" font-size="11" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">When buying, check three: nut height (too high is hard to press), sharp fret ends, a lifting bridge</text></svg>
