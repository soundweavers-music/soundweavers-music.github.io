<svg xmlns="http://www.w3.org/2000/svg" width="680" height="300" viewBox="0 0 680 300" role="img" aria-label="Hammer-on, pull-off, slide"><title>Hammer-on, pull-off, slide</title><rect width="680" height="300" fill="#fdfbf7"/><text x="24" y="28" font-size="14" text-anchor="start" fill="#3a3128" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">Hammer-on, pull-off, slide: the second note skips the right hand</text><text x="24" y="48" font-size="11" text-anchor="start" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">All three stay on one string; the left hand moves as the note sounds, and holds firm</text><text x="126.0" y="96" font-size="12.5" text-anchor="middle" fill="#3a3128" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">Hammer-on</text><text x="26" y="122" font-size="10" text-anchor="start" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">C string</text><line x1="70" y1="160" x2="226" y2="160" stroke="#3a3128" stroke-width="1.2" opacity="0.45"/><rect x="82" y="150" width="20" height="20" fill="#fdfbf7"/><text x="92" y="166" font-size="16" text-anchor="middle" fill="#A67C52" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">0</text><rect x="196" y="150" width="20" height="20" fill="#fdfbf7"/><text x="206" y="166" font-size="16" text-anchor="middle" fill="#A67C52" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">2</text><path d="M104 144 Q126.0 104 206 144" stroke="#A67C52" stroke-width="1.6" fill="none"/><path d="M206 144 l-7 -1 l2 -6 z" fill="#A67C52"/><text x="126.0" y="114" font-size="13" text-anchor="middle" fill="#A67C52" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">H</text><text x="26" y="202" font-size="10.5" text-anchor="start" fill="#3a3128" font-family="system-ui, -apple-system, Segoe UI, sans-serif">Pluck open C, hammer into fret 2</text><text x="342.0" y="96" font-size="12.5" text-anchor="middle" fill="#3a3128" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">Pull-off</text><text x="242" y="122" font-size="10" text-anchor="start" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">C string</text><line x1="286" y1="160" x2="442" y2="160" stroke="#3a3128" stroke-width="1.2" opacity="0.45"/><rect x="298" y="150" width="20" height="20" fill="#fdfbf7"/><text x="308" y="166" font-size="16" text-anchor="middle" fill="#A67C52" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">2</text><rect x="412" y="150" width="20" height="20" fill="#fdfbf7"/><text x="422" y="166" font-size="16" text-anchor="middle" fill="#A67C52" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">0</text><path d="M320 144 Q342.0 104 422 144" stroke="#A67C52" stroke-width="1.6" fill="none"/><path d="M422 144 l-7 -1 l2 -6 z" fill="#A67C52"/><text x="342.0" y="114" font-size="13" text-anchor="middle" fill="#A67C52" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">P</text><text x="242" y="202" font-size="10.5" text-anchor="start" fill="#3a3128" font-family="system-ui, -apple-system, Segoe UI, sans-serif">Fret 2 on C, pull off to open</text><text x="558.0" y="96" font-size="12.5" text-anchor="middle" fill="#3a3128" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">Slide</text><text x="458" y="122" font-size="10" text-anchor="start" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">C string</text><line x1="502" y1="160" x2="658" y2="160" stroke="#3a3128" stroke-width="1.2" opacity="0.45"/><rect x="514" y="150" width="20" height="20" fill="#fdfbf7"/><text x="524" y="166" font-size="16" text-anchor="middle" fill="#A67C52" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">2</text><rect x="628" y="150" width="20" height="20" fill="#fdfbf7"/><text x="638" y="166" font-size="16" text-anchor="middle" fill="#A67C52" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">5</text><path d="M536 144 Q558.0 104 638 144" stroke="#A67C52" stroke-width="1.6" fill="none"/><path d="M638 144 l-7 -1 l2 -6 z" fill="#A67C52"/><text x="558.0" y="114" font-size="13" text-anchor="middle" fill="#A67C52" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">S</text><text x="458" y="202" font-size="10.5" text-anchor="start" fill="#3a3128" font-family="system-ui, -apple-system, Segoe UI, sans-serif">Hold fret 2, pluck, slide to fret 5</text><text x="24" y="284" font-size="10.5" text-anchor="start" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">Soft, low-tension strings kill hammer-ons and pull-offs: fingertips upright, the move small but definite</text></svg>
