<svg xmlns="http://www.w3.org/2000/svg" width="720" height="350" viewBox="0 0 720 350" role="img" aria-label="Filming on a phone: placement beats gear"><title>Filming on a phone: placement beats gear</title><rect width="720" height="350" fill="#fdfbf7"/><text x="24" y="34" font-size="15" text-anchor="start" fill="#3a3128" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">Filming on a phone: placement beats gear</text><text x="24" y="55" font-size="11.5" text-anchor="start" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">The phone mic sits at the bottom, so it hears whatever is closest to it</text><text x="164.0" y="84" font-size="11.5" text-anchor="start" fill="#A67C52" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">Try this</text><text x="434.0" y="84" font-size="11.5" text-anchor="start" fill="#A67C52" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">Why</text><rect x="24" y="96" width="672" height="56" fill="#f3ece2" opacity=".5"/><text x="34" y="120" font-size="11.5" text-anchor="start" fill="#3a3128" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">Distance</text><text x="164.0" y="118" font-size="10.5" text-anchor="start" fill="#3a3128" font-family="system-ui, -apple-system, Segoe UI, sans-serif">80～120cm</text><text x="434.0" y="118" font-size="10.5" text-anchor="start" fill="#3a3128" font-family="system-ui, -apple-system, Segoe UI, sans-serif">Too close and it is all uke; too far and you get</text><text x="434.0" y="135" font-size="10.5" text-anchor="start" fill="#3a3128" font-family="system-ui, -apple-system, Segoe UI, sans-serif">the whole room</text><text x="34" y="176" font-size="11.5" text-anchor="start" fill="#3a3128" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">Height</text><text x="164.0" y="174" font-size="10.5" text-anchor="start" fill="#3a3128" font-family="system-ui, -apple-system, Segoe UI, sans-serif">At your mouth, a little above the uke</text><text x="434.0" y="174" font-size="10.5" text-anchor="start" fill="#3a3128" font-family="system-ui, -apple-system, Segoe UI, sans-serif">The voice in front, the uke behind</text><rect x="24" y="208" width="672" height="56" fill="#f3ece2" opacity=".5"/><text x="34" y="232" font-size="11.5" text-anchor="start" fill="#3a3128" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">Angle</text><text x="164.0" y="230" font-size="10.5" text-anchor="start" fill="#3a3128" font-family="system-ui, -apple-system, Segoe UI, sans-serif">Light at 45° from the side</text><text x="434.0" y="230" font-size="10.5" text-anchor="start" fill="#3a3128" font-family="system-ui, -apple-system, Segoe UI, sans-serif">Your face gains depth and doesn&#x27;t go</text><text x="434.0" y="247" font-size="10.5" text-anchor="start" fill="#3a3128" font-family="system-ui, -apple-system, Segoe UI, sans-serif">dark</text><text x="34" y="288" font-size="11.5" text-anchor="start" fill="#3a3128" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">Background</text><text x="164.0" y="286" font-size="10.5" text-anchor="start" fill="#3a3128" font-family="system-ui, -apple-system, Segoe UI, sans-serif">Curtain, wardrobe, bedside</text><text x="434.0" y="286" font-size="10.5" text-anchor="start" fill="#3a3128" font-family="system-ui, -apple-system, Segoe UI, sans-serif">Bare walls make the sound hollow</text><text x="24" y="338" font-size="10.5" text-anchor="start" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">Record 20 seconds and listen before the real take; getting the placement right beats a new mic</text></svg>
