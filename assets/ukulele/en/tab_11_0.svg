<svg xmlns="http://www.w3.org/2000/svg" width="700" height="260" viewBox="0 0 700 260" role="img" aria-label="The hammer-on fill built into Am"><title>The hammer-on fill built into Am</title><rect width="700" height="260" fill="#fdfbf7"/><text x="24" y="32" font-size="15" text-anchor="start" fill="#3a3128" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">The hammer-on fill built into Am</text><line x1="76" y1="76" x2="670.0" y2="76" stroke="#3a3128" stroke-width="1" opacity="0.42"/><text x="64" y="80" font-size="11" text-anchor="end" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">A</text><rect x="311.0" y="68.0" width="16" height="16" fill="#fdfbf7"/><text x="319.0" y="81" font-size="11.5" text-anchor="middle" fill="#A67C52" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">0</text><line x1="76" y1="102" x2="670.0" y2="102" stroke="#3a3128" stroke-width="1" opacity="0.42"/><text x="64" y="106" font-size="11" text-anchor="end" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">E</text><rect x="239.0" y="94.0" width="16" height="16" fill="#fdfbf7"/><text x="247.0" y="107" font-size="11.5" text-anchor="middle" fill="#A67C52" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">0</text><rect x="455.0" y="94.0" width="16" height="16" fill="#fdfbf7"/><text x="463.0" y="107" font-size="11.5" text-anchor="middle" fill="#A67C52" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">0</text><line x1="76" y1="128" x2="670.0" y2="128" stroke="#3a3128" stroke-width="1" opacity="0.42"/><text x="64" y="132" font-size="11" text-anchor="end" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">C</text><rect x="167.0" y="120.0" width="16" height="16" fill="#fdfbf7"/><text x="175.0" y="133" font-size="11.5" text-anchor="middle" fill="#A67C52" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">0</text><rect x="527.0" y="120.0" width="16" height="16" fill="#fdfbf7"/><text x="535.0" y="133" font-size="11.5" text-anchor="middle" fill="#A67C52" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">0</text><rect x="599.0" y="120.0" width="16" height="16" fill="#fdfbf7"/><text x="607.0" y="133" font-size="11.5" text-anchor="middle" fill="#A67C52" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">2</text><line x1="76" y1="154" x2="670.0" y2="154" stroke="#3a3128" stroke-width="1" opacity="0.42"/><text x="64" y="158" font-size="11" text-anchor="end" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">G</text><rect x="113.0" y="146.0" width="16" height="16" fill="#fdfbf7"/><text x="121.0" y="159" font-size="11.5" text-anchor="middle" fill="#A67C52" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">2</text><text x="76" y="192" font-size="10.5" text-anchor="start" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">Beats:  1   &amp;   2   &amp;   3   &amp;   4   &amp;</text><text x="76" y="209" font-size="10.5" text-anchor="start" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">How: play the Am arpeggio for three beats; on beat 4 pick the open C, hammer fret 2 with the ring finger</text><text x="24" y="248" font-size="10" text-anchor="start" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">Numbers are frets for the left hand; strings read top to bottom, string 1 (A) to string 4 (G)</text></svg>
