<svg xmlns="http://www.w3.org/2000/svg" width="720" height="320" viewBox="0 0 720 320" role="img" aria-label="Accents in 3/4 and 6/8"><title>Accents in 3/4 and 6/8</title><rect width="720" height="320" fill="#fdfbf7"/><text x="24" y="34" font-size="15" text-anchor="start" fill="#3a3128" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">3/4 and 6/8: the accent falls elsewhere</text><text x="24" y="55" font-size="11.5" text-anchor="start" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">Both group in threes, but 6/8 is two big beats of three, so it sounds faster and rounder</text><text x="96" y="110" font-size="14" text-anchor="end" fill="#A67C52" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">3/4</text><rect x="120.0" y="88" width="167.3" height="36" rx="6" fill="#C4956A" stroke="#c9bba6"/><text x="203.66666666666669" y="111" font-size="11.5" text-anchor="middle" fill="#fdfbf7" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">Strong</text><rect x="293.3" y="88" width="167.3" height="36" rx="6" fill="#f3ece2" stroke="#c9bba6"/><text x="377.00000000000006" y="111" font-size="11.5" text-anchor="middle" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">Weak</text><rect x="466.7" y="88" width="167.3" height="36" rx="6" fill="#f3ece2" stroke="#c9bba6"/><text x="550.3333333333334" y="111" font-size="11.5" text-anchor="middle" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">Weak</text><text x="120" y="148" font-size="10" text-anchor="start" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">Count all three; beat 1 is fullest</text><text x="96" y="206" font-size="14" text-anchor="end" fill="#A67C52" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">6/8</text><rect x="120.0" y="184" width="80.7" height="36" rx="6" fill="#C4956A" stroke="#c9bba6"/><text x="160.33333333333334" y="207" font-size="11.5" text-anchor="middle" fill="#fdfbf7" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">Strong</text><rect x="206.7" y="184" width="80.7" height="36" rx="6" fill="#f3ece2" stroke="#c9bba6"/><text x="247.00000000000003" y="207" font-size="11.5" text-anchor="middle" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">Weak</text><rect x="293.3" y="184" width="80.7" height="36" rx="6" fill="#f3ece2" stroke="#c9bba6"/><text x="333.6666666666667" y="207" font-size="11.5" text-anchor="middle" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">Weak</text><rect x="380.0" y="184" width="80.7" height="36" rx="6" fill="#C4956A" stroke="#c9bba6"/><text x="420.3333333333333" y="207" font-size="11.5" text-anchor="middle" fill="#fdfbf7" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">Medium</text><rect x="466.7" y="184" width="80.7" height="36" rx="6" fill="#f3ece2" stroke="#c9bba6"/><text x="507.0" y="207" font-size="11.5" text-anchor="middle" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">Weak</text><rect x="553.3" y="184" width="80.7" height="36" rx="6" fill="#f3ece2" stroke="#c9bba6"/><text x="593.6666666666667" y="207" font-size="11.5" text-anchor="middle" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">Weak</text><text x="120" y="244" font-size="10" text-anchor="start" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">Two big beats; the 4th stroke gets another push</text><text x="24" y="304" font-size="10.5" text-anchor="start" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">6/8 is not six even beats: count two big ones, push the 1st and 4th harder, and the groove lands</text></svg>
