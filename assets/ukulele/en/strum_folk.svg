amily="system-ui, -apple-system, Segoe UI, sans-serif">↑</text><rect x="380" y="70" width="62" height="70" rx="6" fill="#fdfbf7" stroke="#c9bba6"/><text x="411.0" y="90" font-size="11" text-anchor="middle" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">＋</text><rect x="448" y="70" width="62" height="70" rx="6" fill="#f3ece2" stroke="#c9bba6"/><text x="479.0" y="90" font-size="11" text-anchor="middle" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">4</text><text x="479.0" y="122" font-size="22" text-anchor="middle" fill="#A67C52" font-family="system-ui, -apple-system, Segoe UI, sans-serif">↓</text><rect x="516" y="70" width="62" height="70" rx="6" fill="#fdfbf7" stroke="#c9bba6"/><text x="547.0" y="90" font-size="11" text-anchor="middle" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">＋</text><text x="547.0" y="122" font-size="22" text-anchor="middle" fill="#A67C52" font-family="system-ui, -apple-system, Segoe UI, sans-serif">↑</text><text x="24" y="166" font-size="11.5" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">&quot;+&quot; is the off beat (hand on its way up); a blank cell = hand swings but misses (air strum)</text><text x="24" y="186" font-size="11.5" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">Eight moves a bar; the wrist never stops, even when you change chords</text></svg>
