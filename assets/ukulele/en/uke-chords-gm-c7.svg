<svg xmlns="http://www.w3.org/2000/svg" width="720" height="372" viewBox="0 0 720 372" role="img" aria-label="Gm and C7: one minor chord, one dominant seventh"><title>Gm and C7: one minor chord, one dominant seventh</title><rect width="720" height="372" fill="#fdfbf7"/><text x="24" y="30" font-size="15" text-anchor="start" fill="#3a3128" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">Gm and C7: one minor chord, one dominant seventh</text><text x="24" y="50" font-size="11.5" text-anchor="start" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">Gm uses three fingers, C7 only one—both turn up together in songs in F</text><text x="192.0" y="84" font-size="14" text-anchor="middle" fill="#3a3128" font-family="system-ui, -apple-system, Segoe UI, sans-serif">Gm</text><line x1="164.0" y1="110" x2="164.0" y2="182" stroke="#c9bba6" stroke-width="1.2"/><line x1="182.0" y1="110" x2="182.0" y2="182" stroke="#c9bba6" stroke-width="1.2"/><line x1="200.0" y1="110" x2="200.0" y2="182" stroke="#c9bba6" stroke-width="1.2"/><line x1="218.0" y1="110" x2="218.0" y2="182" stroke="#c9bba6" stroke-width="1.2"/><line x1="164.0" y1="110" x2="218.0" y2="110" stroke="#3a3128" stroke-width="2"/><line x1="164.0" y1="128" x2="218.0" y2="128" stroke="#c9bba6" stroke-width="1.2"/><line x1="164.0" y1="146" x2="218.0" y2="146" stroke="#c9bba6" stroke-width="1.2"/><line x1="164.0" y1="164" x2="218.0" y2="164" stroke="#c9bba6" stroke-width="1.2"/><line x1="164.0" y1="182" x2="218.0" y2="182" stroke="#c9bba6" stroke-width="1.2"/><circle cx="164.0" cy="102" r="4" fill="none" stroke="#A67C52" stroke-width="1.6"/><circle cx="182.0" cy="137.0" r="6.5" fill="#C4956A"/><circle cx="200.0" cy="155.0" r="6.5" fill="#C4956A"/><circle cx="218.0" cy="119.0" r="6.5" fill="#C4956A"/><text x="192.0" y="248" font-size="9.5" text-anchor="middle" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">Index: 1st string, fret 1</text><text x="192.