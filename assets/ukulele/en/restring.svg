<svg xmlns="http://www.w3.org/2000/svg" width="640" height="210" viewBox="0 0 640 210" role="img" aria-label="Three steps to a restring"><title>Three steps to a restring</title><rect width="640" height="210" fill="#fdfbf7"/><text x="24" y="28" font-size="14" fill="#3a3128" font-family="system-ui, -apple-system, Segoe UI, sans-serif">Three steps to a restring</text><rect x="30" y="60" width="185" height="96" rx="10" fill="#fbf7f0" stroke="#c9bba6"/><text x="122" y="96" font-size="22" text-anchor="middle" fill="#A67C52" font-family="system-ui, -apple-system, Segoe UI, sans-serif">① Slacken</text><text x="122" y="112" font-size="10.5" text-anchor="middle" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">Wind the peg down first</text><text x="122" y="129" font-size="10.5" text-anchor="middle" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">Zero tension before it comes off</text><rect x="235" y="60" width="185" height="96" rx="10" fill="#fbf7f0" stroke="#c9bba6"/><text x="327" y="96" font-size="22" text-anchor="middle" fill="#A67C52" font-family="system-ui, -apple-system, Segoe UI, sans-serif">② Remove</text><text x="327" y="112" font-size="10.5" text-anchor="middle" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">Pull the old string from the bridge</text><text x="327" y="129" font-size="10.5" text-anchor="middle" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">Wipe the fretboard and frets</text><rect x="440" y="60" width="185" height="96" rx="10" fill="#fbf7f0" stroke="#c9bba6"/><text x="532" y="96" font-size="22" text-anchor="middle" fill="#A67C52" font-family="system-ui, -apple-system, Segoe UI, sans-serif">③ Tie</text><text x="532" y="112" font-size="10.5" text-anchor="middle" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">Tie a figure-eight at the bridge</text><text x="532" y="129" font-size="10.5" text-anchor="middle" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">Tune as you stretch it in</text><text x="24" y="190" font-size="10.5" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">Change one string at a time and tune it at once; when all four are on, do a last pass</text></svg>
