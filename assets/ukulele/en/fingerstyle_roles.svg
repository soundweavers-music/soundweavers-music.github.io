<svg xmlns="http://www.w3.org/2000/svg" width="680" height="330" viewBox="0 0 680 330" role="img" aria-label="Fingerstyle: melody and accompaniment roles"><title>Fingerstyle: melody and accompaniment roles</title><rect width="680" height="330" fill="#fdfbf7"/><text x="24" y="28" font-size="14" text-anchor="start" fill="#3a3128" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">Fingerstyle roles: the top strings sing, the bottom strings accompany</text><text x="24" y="48" font-size="11" text-anchor="start" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">One uke does two jobs: the right hand layers, the left hand holds the chord</text><rect x="24" y="92" width="632" height="38" rx="8" fill="#f3ece2" stroke="#c9bba6"/><text x="38" y="116" font-size="11.5" text-anchor="start" fill="#3a3128" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">1st string A</text><text x="160" y="116" font-size="11.5" text-anchor="start" fill="#A67C52" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">Melody</text><text x="290" y="116" font-size="11" text-anchor="start" fill="#3a3128" font-family="system-ui, -apple-system, Segoe UI, sans-serif">Ring a</text><text x="430" y="116" font-size="10.5" text-anchor="start" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">The tune, and the loudest voice</text><rect x="24" y="138" width="632" height="38" rx="8" fill="#fdfbf7" stroke="#c9bba6"/><text x="38" y="162" font-size="11.5" text-anchor="start" fill="#3a3128" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">2nd string E</text><text x="160" y="162" font-size="11.5" text-anchor="start" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">Melody/harmony</text><text x="290" y="162" font-size="11" text-anchor="start" fill="#3a3128" font-family="system-ui, -apple-system, Segoe UI, sans-serif">Middle m</text><text x="430" y="162" font-size="10.5" text-anchor="start" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">Often a double stop with string 1</text><rect x="24" y="184" width="632" height="38" rx="8" fill="#fdfbf7" stroke="#c9bba6"/><text x="38" y="208" font-size="11.5" text-anchor="start" fill="#3a3128" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">3rd string C</text><text x="160" y="208" font-size="11.5" text-anchor="start" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">Harmony</text><text x="290" y="208" font-size="11" text-anchor="start" fill="#3a3128" font-family="system-ui, -apple-system, Segoe UI, sans-serif">Index i</text><text x="430" y="208" font-size="10.5" text-anchor="start" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">Inner notes, kept under the melody</text><rect x="24" y="230" width="632" height="38" rx="8" fill="#f3ece2" stroke="#c9bba6"/><text x="38" y="254" font-size="11.5" text-anchor="start" fill="#3a3128" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">4th string G</text><text x="160" y="254" font-size="11.5" text-anchor="start" fill="#A67C52" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">Bass</text><text x="290" y="254" font-size="11" text-anchor="start" fill="#3a3128" font-family="system-ui, -apple-system, Segoe UI, sans-serif">Thumb p</text><text x="430" y="254" font-size="10.5" text-anchor="start" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">Heaviest on beat 1 of the bar</text><text x="24" y="286" font-size="11" text-anchor="start" fill="#3a3128" font-family="system-ui, -apple-system, Segoe UI, sans-serif">Three steps: find the melody, put it on the top two strings, fill gaps with chord tones</text><text x="24" y="312" font-size="10.5" text-anchor="start" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">Usual mistake: too much bass buries the melody; stop string 4 as soon as it sounds</text></svg>
