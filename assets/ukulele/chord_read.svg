<svg xmlns="http://www.w3.org/2000/svg" width="520" height="300" viewBox="0 0 520 300" role="img" aria-label="和弦圖閱讀說明"><title>和弦圖閱讀說明</title><rect width="520" height="300" fill="#fdfbf7"/><text x="24" y="28" font-size="14" fill="#3a3128" font-family="system-ui, -apple-system, Segoe UI, sans-serif">怎麼讀和弦圖</text><text x="136.0" y="62" font-size="14" text-anchor="middle" fill="#3a3128" font-family="system-ui, -apple-system, Segoe UI, sans-serif">C</text><line x1="108" y1="88" x2="108" y2="160" stroke="#c9bba6" stroke-width="1.2"/><line x1="126" y1="88" x2="126" y2="160" stroke="#c9bba6" stroke-width="1.2"/><line x1="144" y1="88" x2="144" y2="160" stroke="#c9bba6" stroke-width="1.2"/><line x1="162" y1="88" x2="162" y2="160" stroke="#c9bba6" stroke-width="1.2"/><line x1="108" y1="88" x2="162" y2="88" stroke="#3a3128" stroke-width="2"/><line x1="108" y1="106" x2="162" y2="106" stroke="#c9bba6" stroke-width="1.2"/><line x1="108" y1="124" x2="162" y2="124" stroke="#c9bba6" stroke-width="1.2"/><line x1="108" y1="142" x2="162" y2="142" stroke="#c9bba6" stroke-width="1.2"/><line x1="108" y1="160" x2="162" y2="160" stroke="#c9bba6" stroke-width="1.2"/><circle cx="108" cy="133.0" r="6.5" fill="#C4956A"/><circle cx="126" cy="80" r="4" fill="none" stroke="#A67C52" stroke-width="1.6"/><circle cx="144" cy="80" r="4" fill="none" stroke="#A67C52" stroke-width="1.6"/><circle cx="162" cy="80" r="4" fill="none" stroke="#A67C52" stroke-width="1.6"/><text x="170" y="76" font-size="11.5" fill="#3a3128" font-family="system-ui, -apple-system, Segoe UI, sans-serif">○ 空弦（左手不按，右手要刷）</text><text x="170" y="110" font-size="11.5" fill="#3a3128" font-family="system-ui, -apple-system, Segoe UI, sans-serif">數字 = 第幾格，不是手指編號</text><text x="170" y="144" font-size="11.5" fill="#3a3128" font-family="system-ui, -apple-system, Segoe UI, sans-serif">直線由左至右 = 第 4 弦到第 1 弦</text><text x="170" y="178" font-size="11.5" fill="#3a3128" font-family="system-ui, -apple-system, Segoe UI, sans-serif">頂端粗線 = 上弦枕；✕ = 不彈這條弦</text><text x="24" y="286" font-size="10.5" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">和弦圖是「直立看琴」：最左邊是靠近你下巴的第 4 弦。</text></svg>
