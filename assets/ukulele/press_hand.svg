<svg xmlns="http://www.w3.org/2000/svg" width="720" height="330" viewBox="0 0 720 330" role="img" aria-label="左手按弦的位置與角度"><title>左手按弦的位置與角度</title><rect width="720" height="330" fill="#fdfbf7"/><text x="24" y="34" font-size="15" text-anchor="start" fill="#3a3128" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">按弦的兩件事：位置與角度</text><text x="24" y="55" font-size="11.5" text-anchor="start" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">同一顆音，按對地方不用出力就響；按錯地方再用力也是悶的</text><rect x="48" y="96" width="176" height="64" fill="#faf4ea" stroke="#c9bba6"/><line x1="48" y1="96" x2="224" y2="96" stroke="#9C8F87" stroke-width="2.4"/><line x1="48" y1="128" x2="224" y2="128" stroke="#9C8F87" stroke-width="1"/><line x1="48" y1="160" x2="224" y2="160" stroke="#9C8F87" stroke-width="1"/><line x1="48" y1="160" x2="224" y2="160" stroke="#9C8F87"/><line x1="224" y1="96" x2="224" y2="160" stroke="#3a3128" stroke-width="3"/><circle cx="171.6" cy="144" r="9" fill="#A67C52"/><text x="136" y="188" font-size="10.5" text-anchor="middle" fill="#3a3128" font-family="system-ui, -apple-system, Segoe UI, sans-serif">○ 正確：貼著琴衍右側</text><rect x="272" y="96" width="176" height="64" fill="#faf4ea" stroke="#c9bba6"/><line x1="272" y1="96" x2="448" y2="96" stroke="#9C8F87" stroke-width="2.4"/><line x1="272" y1="128" x2="448" y2="128" stroke="#9C8F87" stroke-width="1"/><line x1="272" y1="160" x2="448" y2="160" stroke="#9C8F87" stroke-width="1"/><line x1="272" y1="160" x2="448" y2="160" stroke="#9C8F87"/><line x1="448" y1="96" x2="448" y2="160" stroke="#3a3128" stroke-width="3"/><circle cx="356.0" cy="144" r="9" fill="#B4553F"/><text x="360" y="188" font-size="10.5" text-anchor="middle" fill="#3a3128" font-family="system-ui, -apple-system, Segoe UI, sans-serif">✕ 太中間：要多花一倍力氣</text><rect x="496" y="96" width="176" height="64" fill="#faf4ea" stroke="#c9bba6"/><line x1="496" y1="96" x2="672" y2="96" stroke="#9C8F87" stroke-width="2.4"/><line x1="496" y1="128" x2="672" y2="128" stroke="#9C8F87" stroke-width="1"/><line x1="496" y1="160" x2="672" y2="160" stroke="#9C8F87" stroke-width="1"/><line x1="496" y1="160" x2="672" y2="160" stroke="#9C8F87"/><line x1="672" y1="96" x2="672" y2="160" stroke="#3a3128" stroke-width="3"/><circle cx="642.0" cy="144" r="9" fill="#B4553F"/><text x="584" y="188" font-size="10.5" text-anchor="middle" fill="#3a3128" font-family="system-ui, -apple-system, Segoe UI, sans-serif">✕ 壓在琴衍上：聲音會死掉</text><text x="48" y="240" font-size="11" text-anchor="start" fill="#3a3128" font-family="system-ui, -apple-system, Segoe UI, sans-serif">指尖立起來、從琴頸正上方落下：手指與弦垂直，旁邊的弦才不會被悶到。</text><text x="48" y="264" font-size="11" text-anchor="start" fill="#3a3128" font-family="system-ui, -apple-system, Segoe UI, sans-serif">手腕微拱、虎口留空；手掌貼在琴頸上會讓小指伸不出去。</text><text x="48" y="314" font-size="10.5" text-anchor="start" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">烏克麗麗弦軟，按不響幾乎都是「沒貼著琴衍」或「指尖塌下去」，很少是力氣問題。</text></svg>
