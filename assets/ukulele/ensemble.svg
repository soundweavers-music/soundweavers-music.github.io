<svg xmlns="http://www.w3.org/2000/svg" width="720" height="280" viewBox="0 0 720 280" role="img" aria-label="雙人合奏的音域分工"><title>雙人合奏的音域分工</title><rect width="720" height="280" fill="#fdfbf7"/><text x="24" y="34" font-size="15" text-anchor="start" fill="#3a3128" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">雙人合奏：把音域分開，才不會互打架</text><text x="24" y="55" font-size="11.5" text-anchor="start" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">兩把琴都待在第 1～3 格，頻率會全部擠在一起</text><rect x="40" y="92" width="640" height="34" rx="8" fill="#f3ece2" stroke="#c9bba6"/><line x1="40.0" y1="92" x2="40.0" y2="126" stroke="#c9bba6" opacity=".7"/><line x1="120.0" y1="92" x2="120.0" y2="126" stroke="#c9bba6" opacity=".7"/><line x1="200.0" y1="92" x2="200.0" y2="126" stroke="#c9bba6" opacity=".7"/><line x1="280.0" y1="92" x2="280.0" y2="126" stroke="#c9bba6" opacity=".7"/><line x1="360.0" y1="92" x2="360.0" y2="126" stroke="#c9bba6" opacity=".7"/><line x1="440.0" y1="92" x2="440.0" y2="126" stroke="#c9bba6" opacity=".7"/><line x1="520.0" y1="92" x2="520.0" y2="126" stroke="#c9bba6" opacity=".7"/><line x1="600.0" y1="92" x2="600.0" y2="126" stroke="#c9bba6" opacity=".7"/><text x="52" y="114" font-size="11" text-anchor="start" fill="#3a3128" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">角色 A｜低把位</text><text x="40" y="146" font-size="10" text-anchor="start" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">刷節奏、打拍子，負責地板</text><rect x="40" y="156" width="640" height="34" rx="8" fill="#f3ece2" stroke="#c9bba6"/><line x1="40.0" y1="156" x2="40.0" y2="190" stroke="#c9bba6" opacity=".7"/><line x1="120.0" y1="156" x2="120.0" y2="190" stroke="#c9bba6" opacity=".7"/><line x1="200.0" y1="156" x2="200.0" y2="190" stroke="#c9bba6" opacity=".7"/><line x1="280.0" y1="156" x2="280.0" y2="190" stroke="#c9bba6" opacity=".7"/><line x1="360.0" y1="156" x2="360.0" y2="190" stroke="#c9bba6" opacity=".7"/><line x1="440.0" y1="156" x2="440.0" y2="190" stroke="#c9bba6" opacity=".7"/><line x1="520.0" y1="156" x2="520.0" y2="190" stroke="#c9bba6" opacity=".7"/><line x1="600.0" y1="156" x2="600.0" y2="190" stroke="#c9bba6" opacity=".7"/><text x="52" y="178" font-size="11" text-anchor="start" fill="#3a3128" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">角色 B｜高把位</text><text x="40" y="210" font-size="10" text-anchor="start" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">第 5～10 格的三和弦與過門，負責天空</text><text x="24" y="264" font-size="10.5" text-anchor="start" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">分工後音量不用大：兩把琴的音域錯開，聽起來自然就厚。</text></svg>
