<svg xmlns="http://www.w3.org/2000/svg" width="720" height="240" viewBox="0 0 720 240" role="img" aria-label="一首歌的動態：主歌收、副歌放"><title>一首歌的動態：主歌收、副歌放</title><rect width="720" height="240" fill="#fdfbf7"/><text x="24" y="34" font-size="15" text-anchor="start" fill="#3a3128" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">一首歌的動態：主歌收、副歌放</text><text x="24" y="55" font-size="11.5" text-anchor="start" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">同一組和弦，靠「刷幾條弦、刷幾下、多大聲」做出三段落差</text><rect x="24.0" y="84" width="197.6" height="52" rx="7" fill="#f3ece2" stroke="#c9bba6"/><text x="122.8" y="116" font-size="11.5" text-anchor="middle" fill="#3a3128" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">主歌</text><text x="26" y="156" font-size="9.5" text-anchor="start" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">指法分解</text><rect x="225.6" y="84" width="130.4" height="52" rx="7" fill="#f3ece2" stroke="#c9bba6"/><text x="290.8" y="116" font-size="11.5" text-anchor="middle" fill="#3a3128" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">導歌</text><text x="227.6" y="156" font-size="9.5" text-anchor="start" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">漸強下刷</text><rect x="360.0" y="84" width="197.6" height="52" rx="7" fill="#f3ece2" stroke="#c9bba6"/><text x="458.8" y="116" font-size="11.5" text-anchor="middle" fill="#3a3128" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">副歌</text><text x="362.0" y="156" font-size="9.5" text-anchor="start" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">16 Beat 全</text><text x="362.0" y="172" font-size="9.5" text-anchor="start" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">刷</text><rect x="561.6" y="84" width="130.4" height="52" rx="7" fill="#f3ece2" stroke="#c9bba6"/><text x="626.8000000000001" y="116" font-size="11.5" text-anchor="middle" fill="#3a3128" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">尾奏</text><text x="563.6" y="156" font-size="9.5" text-anchor="start" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">回到分解</text><text x="24" y="228" font-size="10.5" text-anchor="start" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">副歌之所以聽起來大，是因為前面刻意收；一路全刷反而沒有起伏。</text></svg>
