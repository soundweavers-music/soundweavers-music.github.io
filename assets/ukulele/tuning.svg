<svg xmlns="http://www.w3.org/2000/svg" width="720" height="372" viewBox="0 0 720 372" role="img" aria-label="烏克麗麗調音音高圖"><title>烏克麗麗調音音高圖</title><rect width="720" height="372" fill="#fdfbf7"/><text x="24" y="30" font-size="14" fill="#3a3128" font-family="system-ui, -apple-system, Segoe UI, sans-serif">標準調音 G-C-E-A</text><line x1="60" y1="237" x2="640" y2="237" stroke="#c9bba6" stroke-dasharray="3 4"/><circle cx="110" cy="237" r="9" fill="#C4956A"/><text x="110" y="221" font-size="14" text-anchor="middle" fill="#3a3128" font-family="system-ui, -apple-system, Segoe UI, sans-serif">G4</text><text x="110" y="284" font-size="11.5" text-anchor="middle" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">第 4 弦</text><text x="110" y="300" font-size="10.5" text-anchor="middle" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">392 Hz</text><line x1="60" y1="260" x2="640" y2="260" stroke="#c9bba6" stroke-dasharray="3 4"/><circle cx="240" cy="260" r="9" fill="#C4956A"/><text x="240" y="244" font-size="14" text-anchor="middle" fill="#3a3128" font-family="system-ui, -apple-system, Segoe UI, sans-serif">C4</text><text x="240" y="284" font-size="11.5" text-anchor="middle" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">第 3 弦</text><text x="240" y="300" font-size="10.5" text-anchor="middle" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">262 Hz</text><line x1="60" y1="260" x2="640" y2="260" stroke="#c9bba6" stroke-dasharray="3 4"/><circle cx="370" cy="260" r="9" fill="#C4956A"/><text x="370" y="244" font-size="14" text-anchor="middle" fill="#3a3128" font-family="system-ui, -apple-system, Segoe UI, sans-serif">E4</text><text x="370" y="284" font-size="11.5" text-anchor="middle" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">第 2 弦</text><text x="370" y="300" font-size="10.5" text-anchor="middle" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">330 Hz</text><line x1="60" y1="153" x2="640" y2="153" stroke="#c9bba6" stroke-dasharray="3 4"/><circle cx="500" cy="153" r="9" fill="#C4956A"/><text x="500" y="137" font-size="14" text-anchor="middle" fill="#3a3128" font-family="system-ui, -apple-system, Segoe UI, sans-serif">A4</text><text x="500" y="284" font-size="11.5" text-anchor="middle" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">第 1 弦</text><text x="500" y="300" font-size="10.5" text-anchor="middle" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">440 Hz</text><line x1="60" y1="742" x2="640" y2="742" stroke="#A67C52" stroke-dasharray="5 5"/><circle cx="110" cy="742" r="7" fill="none" stroke="#A67C52" stroke-width="2"/><text x="122" y="746" font-size="11" fill="#A67C52" font-family="system-ui, -apple-system, Segoe UI, sans-serif">Low-G（第 4 弦換成低八度 G3，196 Hz）</text><text x="24" y="352" font-size="11.5" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">High-G：第 4 弦（G4）比第 3 弦（C4）高，所以四條弦由低到高是 C→E→G→A，不是「愈左愈低」。</text></svg>
