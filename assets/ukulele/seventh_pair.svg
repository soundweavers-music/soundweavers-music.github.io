" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">四條全空弦</text><text x="520.0" y="160" font-size="18" text-anchor="middle" fill="#A67C52" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">→</text><text x="24" y="358" font-size="10.5" text-anchor="start" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">同一段旋律換上七和弦，鼓跟貝斯不用動，整首歌就會突然「夜景」起來。</text></svg>
