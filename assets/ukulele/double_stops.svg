le-system, Segoe UI, sans-serif">3 弦格</text><text x="24" y="302" font-size="10" text-anchor="start" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">六度的兩格差距較大，用拇指＋中指或拇指＋無名指同時撥，聲音比三度更開闊。</text><text x="24" y="364" font-size="10.5" text-anchor="start" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">雙音的兩顆音都要清楚，不要一掌蓋上去；先分開撥、聽得出兩個音，再同時撥。</text></svg>
