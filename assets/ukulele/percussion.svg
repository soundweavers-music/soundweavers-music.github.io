<svg xmlns="http://www.w3.org/2000/svg" width="680" height="430" viewBox="0 0 680 430" role="img" aria-label="打板擊點"><title>打板擊點</title><rect width="680" height="430" fill="#fdfbf7"/><text x="24" y="28" font-size="14" text-anchor="start" fill="#3a3128" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">打板：兩種擊點做出大鼓與小鼓</text><text x="24" y="48" font-size="11" text-anchor="start" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">大鼓＝掌根敲面板低頻、小鼓＝指甲背拍弦；兩個點位不要混在一起</text><circle cx="190" cy="274" r="66" fill="#C4956A" stroke="#A67C52" stroke-width="1.6"/><circle cx="190" cy="184" r="48" fill="#C4956A" stroke="#A67C52" stroke-width="1.6"/><rect x="174" y="68" width="32" height="76" fill="#A67C52" opacity="0.85"/><rect x="170" y="54" width="40" height="18" rx="5" fill="#A67C52"/><line x1="183.0" y1="58" x2="183.0" y2="292" stroke="#3a3128" stroke-width="0.8" opacity="0.3"/><line x1="187.6" y1="58" x2="187.6" y2="292" stroke="#3a3128" stroke-width="0.8" opacity="0.3"/><line x1="192.2" y1="58" x2="192.2" y2="292" stroke="#3a3128" stroke-width="0.8" opacity="0.3"/><line x1="196.8" y1="58" x2="196.8" y2="292" stroke="#3a3128" stroke-width="0.8" opacity="0.3"/><circle cx="190" cy="222" r="17" fill="#fdfbf7" stroke="#c9bba6" stroke-width="1.2"/><rect x="166" y="284" width="48" height="11" rx="3" fill="#A67C52"/><path d="M188 184 L340 124" stroke="#9C8F87" stroke-width="1" fill="none"/><circle cx="188" cy="184" r="14" fill="#A67C52"/><text x="188" y="189" font-size="12" text-anchor="middle" fill="#fdfbf7" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">K</text><text x="348" y="128" font-size="10.5" text-anchor="start" fill="#3a3128" font-family="system-ui, -apple-system, Segoe UI, sans-serif">掌根敲上方面板＝大鼓（低、悶）</text><path d="M190 222 L340 182" stroke="#9C8F87" stroke-width="1" fill="none"/><circle cx="190" cy="222" r="14" fill="#A67C52"/><text x="190" y="227" font-size="12" text-anchor="middle" fill="#fdfbf7" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">S</text><text x="348" y="186" font-size="10.5" text-anchor="start" fill="#3a3128" font-family="system-ui, -apple-system, Segoe UI, sans-serif">指甲背拍過琴弦＝小鼓（脆、亮）</text><path d="M224 302 L340 296" stroke="#9C8F87" stroke-width="1" fill="none"/><circle cx="224" cy="302" r="14" fill="#A67C52"/><text x="224" y="307" font-size="12" text-anchor="middle" fill="#fdfbf7" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">K2</text><text x="348" y="300" font-size="10.5" text-anchor="start" fill="#3a3128" font-family="system-ui, -apple-system, Segoe UI, sans-serif">側板下緣也可敲，聲音更集中</text><text x="348" y="250" font-size="10.5" text-anchor="start" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">兩個擊點要分開練：先只打 K（拍在腿上），再只打 S；</text><text x="348" y="268" font-size="10.5" text-anchor="start" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">兩件事都穩了，才把它們輪流放進同一小節。</text><text x="24" y="368" font-size="11" text-anchor="start" fill="#3a3128" font-family="system-ui, -apple-system, Segoe UI, sans-serif">4 拍基本型：K – S – K – S，每一拍都同時撥一個旋律音（拇指撥低音、食指撥高音）。</text><text x="24" y="396" font-size="10.5" text-anchor="start" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">先把手拍在腿上打出 K–S–K–S，確定節奏穩了再上琴；上琴後音量放小，讓旋律線聽得見。</text></svg>
