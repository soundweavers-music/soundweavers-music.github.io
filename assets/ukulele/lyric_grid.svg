<svg xmlns="http://www.w3.org/2000/svg" width="720" height="292" viewBox="0 0 720 292" role="img" aria-label="歌詞與拍點對齊"><title>歌詞與拍點對齊</title><rect width="720" height="292" fill="#fdfbf7"/><text x="24" y="34" font-size="15" text-anchor="start" fill="#3a3128" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">歌詞對到拍點：一個字配一下刷弦</text><text x="24" y="55" font-size="11.5" text-anchor="start" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">先把歌詞一個字一個字放進格子裡，再彈；對不上就是格子放錯，不是手笨</text><line x1="132.0" y1="78" x2="132.0" y2="188" stroke="#C4956A" stroke-width="1"/><line x1="201.8" y1="78" x2="201.8" y2="188" stroke="#c9bba6" stroke-width="1"/><line x1="271.5" y1="78" x2="271.5" y2="188" stroke="#C4956A" stroke-width="1"/><line x1="341.2" y1="78" x2="341.2" y2="188" stroke="#c9bba6" stroke-width="1"/><line x1="411.0" y1="78" x2="411.0" y2="188" stroke="#C4956A" stroke-width="1"/><line x1="480.8" y1="78" x2="480.8" y2="188" stroke="#c9bba6" stroke-width="1"/><line x1="550.5" y1="78" x2="550.5" y2="188" stroke="#C4956A" stroke-width="1"/><line x1="620.2" y1="78" x2="620.2" y2="188" stroke="#c9bba6" stroke-width="1"/><line x1="690.0" y1="78" x2="690.0" y2="188" stroke="#C4956A" stroke-width="1"/><text x="120" y="98" font-size="10.5" text-anchor="end" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">拍點</text><text x="166.875" y="98" font-size="10.5" text-anchor="middle" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">1</text><text x="236.625" y="98" font-size="10.5" text-anchor="middle" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">&amp;</text><text x="306.375" y="98" font-size="10.5" text-anchor="middle" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">2</text><text x="376.125" y="98" font-size="10.5" text-anchor="middle" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">&amp;</text><text x="445.875" y="98" font-size="10.5" text-anchor="middle" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">3</text><text x="515.625" y="98" font-size="10.5" text-anchor="middle" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">&amp;</text><text x="585.375" y="98" font-size="10.5" text-anchor="middle" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">4</text><text x="655.125" y="98" font-size="10.5" text-anchor="middle" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">&amp;</text><text x="120" y="132" font-size="10.5" text-anchor="end" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">刷法</text><text x="166.875" y="132" font-size="16" text-anchor="middle" fill="#A67C52" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">↓</text><text x="236.625" y="131" font-size="14" text-anchor="middle" fill="#cfc4b8" font-family="system-ui, -apple-system, Segoe UI, sans-serif">·</text><text x="306.375" y="132" font-size="16" text-anchor="middle" fill="#A67C52" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">↓</text><text x="376.125" y="132" font-size="16" text-anchor="middle" fill="#A67C52" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">↑</text><text x="445.875" y="131" font-size="14" text-anchor="middle" fill="#cfc4b8" font-family="system-ui, -apple-system, Segoe UI, sans-serif">·</text><text x="515.625" y="132" font-size="16" text-anchor="middle" fill="#A67C52" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">↑</text><text x="585.375" y="132" font-size="16" text-anchor="middle" fill="#A67C52" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">↓</text><text x="655.125" y="132" font-size="16" text-anchor="middle" fill="#A67C52" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">↑</text><text x="120" y="166" font-size="10.5" text-anchor="end" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">歌詞</text><text x="166.875" y="166" font-size="14" text-anchor="middle" fill="#3a3128" font-family="system-ui, -apple-system, Segoe UI, sans-serif">有</text><text x="236.625" y="166" font-size="14" text-anchor="middle" fill="#3a3128" font-family="system-ui, -apple-system, Segoe UI, sans-serif">一</text><text x="306.375" y="166" font-size="14" text-anchor="middle" fill="#3a3128" font-family="system-ui, -apple-system, Segoe UI, sans-serif">個</text><text x="376.125" y="166" font-size="14" text-anchor="middle" fill="#3a3128" font-family="system-ui, -apple-system, Segoe UI, sans-serif">美</text><text x="445.875" y="166" font-size="14" text-anchor="middle" fill="#3a3128" font-family="system-ui, -apple-system, Segoe UI, sans-serif">麗</text><text x="515.625" y="166" font-size="14" text-anchor="middle" fill="#3a3128" font-family="system-ui, -apple-system, Segoe UI, sans-serif">的</text><text x="585.375" y="166" font-size="14" text-anchor="middle" fill="#3a3128" font-family="system-ui, -apple-system, Segoe UI, sans-serif">小</text><text x="655.125" y="166" font-size="14" text-anchor="middle" fill="#3a3128" font-family="system-ui, -apple-system, Segoe UI, sans-serif">薇</text><text x="24" y="230" font-size="11" text-anchor="start" fill="#3a3128" font-family="system-ui, -apple-system, Segoe UI, sans-serif">練習順序：① 只唸歌詞打拍子 ② 只刷不唱 ③ 兩者一起。</text><text x="24" y="256" font-size="10.5" text-anchor="start" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">換和弦時右手不要停：左手換位置，右手繼續擺動。</text></svg>
