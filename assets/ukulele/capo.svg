<svg xmlns="http://www.w3.org/2000/svg" width="680" height="320" viewBox="0 0 680 320" role="img" aria-label="移調夾位置與實際調性"><title>移調夾位置與實際調性</title><rect width="680" height="320" fill="#fdfbf7"/><text x="24" y="28" font-size="14" text-anchor="start" fill="#3a3128" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">移調夾：把第 3 格當成新的上弦枕</text><text x="24" y="48" font-size="11" text-anchor="start" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">手指按的形狀完全不變，只是整把琴的音高往上移了三個半音</text><rect x="70" y="76" width="372" height="86" rx="6" fill="#faf4ea" stroke="#c9bba6"/><line x1="70" y1="76" x2="70" y2="162" stroke="#c9bba6" stroke-width="2.6"/><line x1="132" y1="76" x2="132" y2="162" stroke="#c9bba6" stroke-width="1"/><line x1="194" y1="76" x2="194" y2="162" stroke="#c9bba6" stroke-width="1"/><line x1="256" y1="76" x2="256" y2="162" stroke="#c9bba6" stroke-width="1"/><line x1="318" y1="76" x2="318" y2="162" stroke="#c9bba6" stroke-width="1"/><line x1="380" y1="76" x2="380" y2="162" stroke="#c9bba6" stroke-width="1"/><line x1="442" y1="76" x2="442" y2="162" stroke="#c9bba6" stroke-width="1"/><line x1="70" y1="90" x2="442" y2="90" stroke="#3a3128" stroke-width="0.9" opacity="0.5"/><line x1="70" y1="108" x2="442" y2="108" stroke="#3a3128" stroke-width="0.9" opacity="0.5"/><line x1="70" y1="126" x2="442" y2="126" stroke="#3a3128" stroke-width="0.9" opacity="0.5"/><line x1="70" y1="144" x2="442" y2="144" stroke="#3a3128" stroke-width="0.9" opacity="0.5"/><text x="60" y="94" font-size="10" text-anchor="end" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">G</text><text x="60" y="112" font-size="10" text-anchor="end" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">C</text><text x="60" y="130" font-size="10" text-anchor="end" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">E</text><text x="60" y="148" font-size="10" text-anchor="end" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">A</text><rect x="243" y="70" width="10" height="96" rx="4" fill="#A67C52"/><path d="M248 166 L248 182" stroke="#A67C52" stroke-width="1"/><text x="254" y="194" font-size="10.5" text-anchor="start" fill="#A67C52" font-family="system-ui, -apple-system, Segoe UI, sans-serif">Capo 夾在第 3 格（緊貼第 3 條琴衍的左側，跟按弦的位置一樣）</text><text x="101.0" y="170" font-size="9.5" text-anchor="middle" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">1</text><text x="163.0" y="170" font-size="9.5" text-anchor="middle" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">2</text><text x="225.0" y="170" font-size="9.5" text-anchor="middle" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">3</text><text x="287.0" y="170" font-size="9.5" text-anchor="middle" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">4</text><text x="349.0" y="170" font-size="9.5" text-anchor="middle" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">5</text><text x="411.0" y="170" font-size="9.5" text-anchor="middle" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">6</text><rect x="70" y="212" width="270" height="78" rx="9" fill="#f3ece2" stroke="#c9bba6"/><text x="84" y="238" font-size="11.5" text-anchor="start" fill="#3a3128" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">左手按 C 大調指法</text><text x="84" y="262" font-size="12" text-anchor="start" fill="#A67C52" font-family="system-ui, -apple-system, Segoe UI, sans-serif">C – Am – F – G</text><path d="M356 251 l26 0" stroke="#9C8F87" stroke-width="1.2"/><path d="M382 251 l-7 -4 v8 z" fill="#9C8F87"/><rect x="400" y="212" width="248" height="78" rx="9" fill="#f3ece2" stroke="#c9bba6"/><text x="414" y="238" font-size="11.5" text-anchor="start" fill="#3a3128" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">耳朵聽到的實際音高</text><text x="414" y="262" font-size="12" text-anchor="start" fill="#A67C52" font-family="system-ui, -apple-system, Segoe UI, sans-serif">Eb 大調（原曲的調）</text><text x="24" y="312" font-size="10.5" text-anchor="start" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">夾高 1 格＝升 1 個半音。移調夾只能升，不能降；要降就換一組低把位指法。</text></svg>
