<svg xmlns="http://www.w3.org/2000/svg" width="720" height="258" viewBox="0 0 720 258" role="img" aria-label="移調夾速查"><title>移調夾速查</title><rect width="720" height="258" fill="#fdfbf7"/><text x="24" y="34" font-size="15" text-anchor="start" fill="#3a3128" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">移調夾速查：按同一組指法，實際唱出來的調</text><text x="24" y="55" font-size="11.5" text-anchor="start" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">往琴身方向夾 1 格＝升 1 個半音；移調夾只能升，不能降</text><text x="194.0" y="86" font-size="10.5" text-anchor="middle" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">不夾</text><text x="282.0" y="86" font-size="10.5" text-anchor="middle" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">夾 1 格</text><text x="370.0" y="86" font-size="10.5" text-anchor="middle" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">夾 2 格</text><text x="458.0" y="86" font-size="10.5" text-anchor="middle" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">夾 3 格</text><text x="546.0" y="86" font-size="10.5" text-anchor="middle" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">夾 4 格</text><text x="634.0" y="86" font-size="10.5" text-anchor="middle" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">夾 5 格</text><text x="138" y="116" font-size="11.5" text-anchor="end" fill="#3a3128" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">C 調指法</text><rect x="150" y="98" width="82" height="32" rx="6" fill="#f3ece2" stroke="#c9bba6"/><text x="191.0" y="119" font-size="12" text-anchor="middle" fill="#3a3128" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">C</text><rect x="238" y="98" width="82" height="32" rx="6" fill="#fdfbf7" stroke="#c9bba6"/><text x="279.0" y="119" font-size="12" text-anchor="middle" fill="#A67C52" font-family=