<svg xmlns="http://www.w3.org/2000/svg" width="720" height="350" viewBox="0 0 720 350" role="img" aria-label="三種板材：價格差在哪裡"><title>三種板材：價格差在哪裡</title><rect width="720" height="350" fill="#fdfbf7"/><text x="24" y="34" font-size="15" text-anchor="start" fill="#3a3128" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">三種板材：價格差在哪裡</text><text x="24" y="55" font-size="11.5" text-anchor="start" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">差別在「面板是幾層」，不是木頭品種的名字好不好聽</text><text x="164.0" y="84" font-size="11.5" text-anchor="start" fill="#A67C52" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">合板（Laminate）</text><text x="434.0" y="84" font-size="11.5" text-anchor="start" fill="#A67C52" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">全單板（Solid）</text><rect x="24" y="96" width="672" height="56" fill="#f3ece2" opacity=".5"/><text x="34" y="120" font-size="11.5" text-anchor="start" fill="#3a3128" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">結構</text><text x="164.0" y="118" font-size="10.5" text-anchor="start" fill="#3a3128" font-family="system-ui, -apple-system, Segoe UI, sans-serif">三層薄木交錯壓合</text><text x="434.0" y="118" font-size="10.5" text-anchor="start" fill="#3a3128" font-family="system-ui, -apple-system, Segoe UI, sans-serif">整塊實木切薄</text><text x="34" y="176" font-size="11.5" text-anchor="start" fill="#3a3128" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">聲音</text><text x="164.0" y="174" font-size="10.5" text-anchor="start" fill="#3a3128" font-family="system-ui, -apple-system, Segoe UI, sans-serif">較平、開聲空間小</text><text x="434.0" y="174" font-size="10.5" text-anchor="start" fill="#3a3128" font-family="system-ui, -apple-system, Segoe UI, sans-serif">越彈越開，低頻與延音更好</text><rect x="24" y="208" width="672" height="56" fill="#f3ece2" opacity=".5"/><text x="34" y="232" font-size="11.5" text-anchor="start" fill="#3a3128" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">價格</text><text x="164.0" y="230" font-size="10.5" text-anchor="start" fill="#3a3128" font-family="system-ui, -apple-system, Segoe UI, sans-serif">便宜，適合第一把</text><text x="434.0" y="230" font-size="10.5" text-anchor="start" fill="#3a3128" font-family="system-ui, -apple-system, Segoe UI, sans-serif">貴，需要保養</text><text x="34" y="288" font-size="11.5" text-anchor="start" fill="#3a3128" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">適合</text><text x="164.0" y="286" font-size="10.5" text-anchor="start" fill="#3a3128" font-family="system-ui, -apple-system, Segoe UI, sans-serif">旅行、隨手彈、預算有限</text><text x="434.0" y="286" font-size="10.5" text-anchor="start" fill="#3a3128" font-family="system-ui, -apple-system, Segoe UI, sans-serif">每天彈、在意音色</text><text x="24" y="338" font-size="10.5" text-anchor="start" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">面單板（面板實木、側背合板）是中間選項：音色明顯比合板好，價格又不到全單板。</text></svg>
