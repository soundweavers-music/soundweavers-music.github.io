<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" role="img" aria-label="滑音與過門"><title>滑音與過門</title><rect width="720" height="300" fill="#fdfbf7"/><text x="24" y="34" font-size="15" text-anchor="start" fill="#3a3128" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">滑音與過門：讓和弦之間有東西可聽</text><text x="24" y="55" font-size="11.5" text-anchor="start" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">滑音是「同一個手指沿著弦移動」；過門是「在空拍處塞一兩個音」</text><text x="130" y="80" font-size="12" text-anchor="middle" fill="#3a3128" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">滑音 Slide</text><line x1="40" y1="126" x2="220" y2="126" stroke="#3a3128" stroke-width="1.2" opacity=".45"/><rect x="73" y="116" width="22" height="20" fill="#fdfbf7"/><text x="84" y="132" font-size="15" text-anchor="middle" fill="#A67C52" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">2</text><rect x="165" y="116" width="22" height="20" fill="#fdfbf7"/><text x="176" y="132" font-size="15" text-anchor="middle" fill="#A67C52" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">5</text><path d="M96 108 Q130 78 164 108" stroke="#A67C52" stroke-width="1.6" fill="none"/><text x="130" y="94" font-size="13" text-anchor="middle" fill="#A67C52" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">/</text><text x="40" y="166" font-size="10" text-anchor="start" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">壓住第 2 格撥響，手</text><text x="40" y="182" font-size="10" text-anchor="start" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">指不鬆開滑到第 5 格</text><text x="370" y="80" font-size="12" text-anchor="middle" fill="#3a3128" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">錘音 Hammer</text><line x1="280" y1="126" x2="460" y2="126" stroke="#3a3128" stroke-width="1.2" opacity=".45"/><rect x="313" y="116" width="22" height="20" fill="#fdfbf7"/><text x="324" y="132" font-size="15" text-anchor="middle" fill="#A67C52" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">0</text><rect x="405" y="116" width="22" height="20" fill="#fdfbf7"/><text x="416" y="132" font-size="15" text-anchor="middle" fill="#A67C52" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">2</text><path d="M336 108 Q370 78 404 108" stroke="#A67C52" stroke-width="1.6" fill="none"/><text x="370" y="94" font-size="13" text-anchor="middle" fill="#A67C52" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">H</text><text x="280" y="166" font-size="10" text-anchor="start" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">撥空弦後用手指敲第 2</text><text x="280" y="182" font-size="10" text-anchor="start" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif"> 格，右手不再撥</text><text x="610" y="80" font-size="12" text-anchor="middle" fill="#3a3128" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">勾音 Pull-off</text><line x1="520" y1="126" x2="700" y2="126" stroke="#3a3128" stroke-width="1.2" opacity=".45"/><rect x="553" y="116" width="22" height="20" fill="#fdfbf7"/><text x="564" y="132" font-size="15" text-anchor="middle" fill="#A67C52" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">2</text><rect x="645" y="116" width="22" height="20" fill="#fdfbf7"/><text x="656" y="132" font-size="15" text-anchor="middle" fill="#A67C52" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">0</text><path d="M576 108 Q610 78 644 108" stroke="#A67C52" stroke-width="1.6" fill="none"/><text x="610" y="94" font-size="13" text-anchor="middle" fill="#A67C52" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">P</text><text x="520" y="166" font-size="10" text-anchor="start" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">按住第 2 格撥響，手</text><text x="520" y="182" font-size="10" text-anchor="start" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">指往下勾離開</text><text x="24" y="284" font-size="10.5" text-anchor="start" fill="#3a3128" font-family="system-ui, -apple-system, Segoe UI, sans-serif">過門的位置通常在每小節最後半拍：先讓和弦響滿，再用一個音把聽眾帶到下一小節。</text></svg>
