mily="system-ui, -apple-system, Segoe UI, sans-serif">Am</text><rect x="615.4" y="130" width="70.6" height="34" rx="7" fill="#fdfbf7" stroke="#c9bba6"/><text x="650.7142857142858" y="152" font-size="12.5" text-anchor="middle" fill="#3a3128" font-family="system-ui, -apple-system, Segoe UI, sans-serif">Bdim</text><text x="128" y="198" font-size="11" text-anchor="end" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">G 大調</text><rect x="144.0" y="176" width="70.6" height="34" rx="7" fill="#fdfbf7" stroke="#c9bba6"/><text x="179.28571428571428" y="198" font-size="12.5" text-anchor="middle" fill="#3a3128" font-family="system-ui, -apple-system, Segoe UI, sans-serif">G</text><rect x="222.6" y="176" width="70.6" height="34" rx="7" fill="#fdfbf7" stroke="#c9bba6"/><text x="257.85714285714283" y="198" font-size="12.5" text-anchor="middle" fill="#3a3128" font-family="system-ui, -apple-system, Segoe UI, sans-serif">Am</text><rect x="301.1" y="176" width="70.6" height="34" rx="7" fill="#fdfbf7" stroke="#c9bba6"/><text x="336.4285714285714" y="198" font-size="12.5" text-anchor="middle" fill="#3a3128" font-family="system-ui, -apple-system, Segoe UI, sans-serif">Bm</text><rect x="379.7" y="176" width="70.6" height="34" rx="7" fill="#fdfbf7" stroke="#c9bba6"/><text x="415.0" y="198" font-size="12.5" text-anchor="middle" fill="#3a3128" font-family="system-ui, -apple-system, Segoe UI, sans-serif">C</text><rect x="458.3" y="176" width="70.6" height="34" rx="7" fill="#fdfbf7" stroke="#c9bba6"/><text x="493.57142857142856" y="198" font-size="12.5" text-anchor="middle" fill="#3a3128" font-family="system-ui, -apple-system, Segoe UI, sans-serif">D</text><rect x="536.9" y="176" width="70.6" height="34" rx="7" fill="#fdfbf7" stroke="#c9bba6"/><text x="572.1428571428572" y="198" font-size="12.5" text-anchor="middle" fill="#3a3128" font-family="system-ui, -apple-system, Segoe UI, sans-serif">Em</text><rect x="615.4" y="176" width="70.6" height="34" rx="7" fill="#fdfbf7" stroke="#c9bba6"/><text x="650.7142857142858" y="198" font-size="12.5" text-anchor="middle" fill="#3a3128" font-family="system-ui, -apple-system, Segoe UI, sans-serif">F#dim</text><text x="24" y="254" font-size="10.5" text-anchor="start" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">換調時整排平移：C 調的 1-5-6m-4 到了 G 調就是 G-D-Em-C。</text></svg>
