<svg xmlns="http://www.w3.org/2000/svg" width="720" height="372" viewBox="0 0 720 372" role="img" aria-label="Gm 與 C7：一個小和弦、一個屬七和弦"><title>Gm 與 C7：一個小和弦、一個屬七和弦</title><rect width="720" height="372" fill="#fdfbf7"/><text x="24" y="30" font-size="15" text-anchor="start" fill="#3a3128" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">Gm 與 C7：一個小和弦、一個屬七和弦</text><text x="24" y="50" font-size="11.5" text-anchor="start" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">Gm 有三根手指在動，C7 只要一根——這兩個常一起出現在 F 大調的歌裡</text><text x="192.0" y="84" font-size="14" text-anchor="middle" fill="#3a3128" font-family="system-ui, -apple-system, Segoe UI, sans-serif">Gm</text><line x1="164.0" y1="110" x2="164.0" y2="182" stroke="#c9bba6" stroke-width="1.2"/><line x1="182.0" y1="110" x2="182.0" y2="182" stroke="#c9bba6" stroke-width="1.2"/><line x1="200.0" y1="110" x2="200.0" y2="182" stroke="#c9bba6" stroke-width="1.2"/><line x1="218.0" y1="110" x2="218.0" y2="182" stroke="#c9bba6" stroke-width="1.2"/><line x1="164.0" y1="110" x2="218.0" y2="110" stroke="#3a3128" stroke-width="2"/><line x1="164.0" y1="128" x2="218.0" y2="128" stroke="#c9bba6" stroke-width="1.2"/><line x1="164.0" y1="146" x2="218.0" y2="146" stroke="#c9bba6" stroke-width="1.2"/><line x1="164.0" y1="164" x2="218.0" y2="164" stroke="#c9bba6" stroke-width="1.2"/><line x1="164.0" y1="182" x2="218.0" y2="182" stroke="#c9bba6" stroke-width="1.2"/><circle cx="164.0" cy="102" r="4" fill="none" stroke="#A67C52" stroke-width="1.6"/><circle cx="182.0" cy="137.0" r="6.5" fill="#C4956A"/><circle cx="200.0" cy="155.0" r="6.5" fill="#C4956A"/><circle cx="218.0" cy="119.0" r="6.5" fill="#C4956A"/><text x="192.0" y="248" font-size="9.5" text-anchor="middle" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">食指 1 弦 1 格、</text><text x="192.0" y="264" font-size="9.5" text-anchor="middle" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">中指 3 弦 2 格、</text><text x="192.0" y="280" font-size="9.5" text-anchor="middle" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">無名指 2 弦 3 格</text><text x="528.0" y="84" font-size="14" text-anchor="middle" fill="#3a3128" font-family="system-ui, -apple-system, Segoe UI, sans-serif">C7</text><line x1="500.0" y1="110" x2="500.0" y2="182" stroke="#c9bba6" stroke-width="1.2"/><line x1="518.0" y1="110" x2="518.0" y2="182" stroke="#c9bba6" stroke-width="1.2"/><line x1="536.0" y1="110" x2="536.0" y2="182" stroke="#c9bba6" stroke-width="1.2"/><line x1="554.0" y1="110" x2="554.0" y2="182" stroke="#c9bba6" stroke-width="1.2"/><line x1="500.0" y1="110" x2="554.0" y2="110" stroke="#3a3128" stroke-width="2"/><line x1="500.0" y1="128" x2="554.0" y2="128" stroke="#c9bba6" stroke-width="1.2"/><line x1="500.0" y1="146" x2="554.0" y2="146" stroke="#c9bba6" stroke-width="1.2"/><line x1="500.0" y1="164" x2="554.0" y2="164" stroke="#c9bba6" stroke-width="1.2"/><line x1="500.0" y1="182" x2="554.0" y2="182" stroke="#c9bba6" stroke-width="1.2"/><circle cx="500.0" cy="102" r="4" fill="none" stroke="#A67C52" stroke-width="1.6"/><circle cx="518.0" cy="102" r="4" fill="none" stroke="#A67C52" stroke-width="1.6"/><circle cx="536.0" cy="102" r="4" fill="none" stroke="#A67C52" stroke-width="1.6"/><circle cx="554.0" cy="119.0" r="6.5" fill="#C4956A"/><text x="528.0" y="248" font-size="9.5" text-anchor="middle" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">食指 1 弦 1 格，</text><text x="528.0" y="264" font-size="9.5" text-anchor="middle" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">其餘三條空弦</text><text x="24" y="358" font-size="10.5" text-anchor="start" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">C7 的第 1 弦第 1 格是它的個性所在；放開就變回 C，張力會整個消失。</text></svg>
