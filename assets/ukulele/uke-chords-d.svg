</text><text x="192.0" y="280" font-size="9.5" text-anchor="middle" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">無名指 4 弦 2 格</text><text x="528.0" y="84" font-size="14" text-anchor="middle" fill="#3a3128" font-family="system-ui, -apple-system, Segoe UI, sans-serif">D（半封閉）</text><line x1="500.0" y1="110" x2="500.0" y2="182" stroke="#c9bba6" stroke-width="1.2"/><line x1="518.0" y1="110" x2="518.0" y2="182" stroke="#c9bba6" stroke-width="1.2"/><line x1="536.0" y1="110" x2="536.0" y2="182" stroke="#c9bba6" stroke-width="1.2"/><line x1="554.0" y1="110" x2="554.0" y2="182" stroke="#c9bba6" stroke-width="1.2"/><line x1="500.0" y1="110" x2="554.0" y2="110" stroke="#3a3128" stroke-width="2"/><line x1="500.0" y1="128" x2="554.0" y2="128" stroke="#c9bba6" stroke-width="1.2"/><line x1="500.0" y1="146" x2="554.0" y2="146" stroke="#c9bba6" stroke-width="1.2"/><line x1="500.0" y1="164" x2="554.0" y2="164" stroke="#c9bba6" stroke-width="1.2"/><line x1="500.0" y1="182" x2="554.0" y2="182" stroke="#c9bba6" stroke-width="1.2"/><circle cx="500.0" cy="137.0" r="6.5" fill="#C4956A"/><circle cx="518.0" cy="137.0" r="6.5" fill="#C4956A"/><circle cx="536.0" cy="137.0" r="6.5" fill="#C4956A"/><circle cx="554.0" cy="102" r="4" fill="none" stroke="#A67C52" stroke-width="1.6"/><text x="528.0" y="248" font-size="9.5" text-anchor="middle" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">食指一次壓住 4、3、</text><text x="528.0" y="264" font-size="9.5" text-anchor="middle" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">2 弦第 2 格，第 </text><text x="528.0" y="280" font-size="9.5" text-anchor="middle" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">1 弦留空</text><text x="24" y="358" font-size="10.5" text-anchor="start" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">兩種按法聽起來一樣；挑一個你換得快的就好，不要兩種混著用。</text></svg>
