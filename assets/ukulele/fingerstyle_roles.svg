<svg xmlns="http://www.w3.org/2000/svg" width="680" height="330" viewBox="0 0 680 330" role="img" aria-label="指彈旋律與伴奏分工"><title>指彈旋律與伴奏分工</title><rect width="680" height="330" fill="#fdfbf7"/><text x="24" y="28" font-size="14" text-anchor="start" fill="#3a3128" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">指彈的分工：上面的弦唱歌，下面的弦伴奏</text><text x="24" y="48" font-size="11" text-anchor="start" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">同一把琴同時做兩件事——右手負責分層，左手負責把和弦按好</text><rect x="24" y="92" width="632" height="38" rx="8" fill="#f3ece2" stroke="#c9bba6"/><text x="38" y="116" font-size="11.5" text-anchor="start" fill="#3a3128" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">第 1 弦 A</text><text x="160" y="116" font-size="11.5" text-anchor="start" fill="#A67C52" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">旋律</text><text x="290" y="116" font-size="11" text-anchor="start" fill="#3a3128" font-family="system-ui, -apple-system, Segoe UI, sans-serif">無名指 a</text><text x="430" y="116" font-size="10.5" text-anchor="start" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">主旋律，音量最突出</text><rect x="24" y="138" width="632" height="38" rx="8" fill="#fdfbf7" stroke="#c9bba6"/><text x="38" y="162" font-size="11.5" text-anchor="start" fill="#3a3128" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">第 2 弦 E</text><text x="160" y="162" font-size="11.5" text-anchor="start" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">旋律／和聲</text><text x="290" y="162" font-size="11" text-anchor="start" fill="#3a3128" font-family="system-ui, -apple-system, Segoe UI, sans-serif">中指 m</text><text x="430" y="162" font-size="10.5" text-anchor="start" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">常與第 1 弦搭配成雙音</text><rect x="24" y="184" width="632" height="38" rx="8" fill="#fdfbf7" stroke="#c9bba6"/><text x="38" y="208" font-size="11.5" text-anchor="start" fill="#3a3128" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">第 3 弦 C</text><text x="160" y="208" font-size="11.5" text-anchor="start" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">和聲</text><text x="290" y="208" font-size="11" text-anchor="start" fill="#3a3128" font-family="system-ui, -apple-system, Segoe UI, sans-serif">食指 i</text><text x="430" y="208" font-size="10.5" text-anchor="start" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">填中間的音，別蓋過旋律</text><rect x="24" y="230" width="632" height="38" rx="8" fill="#f3ece2" stroke="#c9bba6"/><text x="38" y="254" font-size="11.5" text-anchor="start" fill="#3a3128" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">第 4 弦 G</text><text x="160" y="254" font-size="11.5" text-anchor="start" fill="#A67C52" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">低音 Bass</text><text x="290" y="254" font-size="11" text-anchor="start" fill="#3a3128" font-family="system-ui, -apple-system, Segoe UI, sans-serif">拇指 p</text><text x="430" y="254" font-size="10.5" text-anchor="start" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">每小節第 1 拍最重</text><text x="24" y="286" font-size="11" text-anchor="start" fill="#3a3128" font-family="system-ui, -apple-system, Segoe UI, sans-serif">改編三步：① 抓出主旋律 ② 旋律音全部排到最上面兩條弦 ③ 剩下的空隙用和弦音填滿。</text><text x="24" y="312" font-size="10.5" text-anchor="start" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">常見錯誤：低音刷得太滿、旋律被蓋掉。第 4 弦一響就收，把空間留給第 1 弦。</text></svg>
