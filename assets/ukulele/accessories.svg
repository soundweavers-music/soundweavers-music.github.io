<svg xmlns="http://www.w3.org/2000/svg" width="720" height="338" viewBox="0 0 720 338" role="img" aria-label="買琴必備的四樣配件"><title>買琴必備的四樣配件</title><rect width="720" height="338" fill="#fdfbf7"/><text x="24" y="34" font-size="15" text-anchor="start" fill="#3a3128" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">買琴必備的四樣配件</text><text x="24" y="55" font-size="11.5" text-anchor="start" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">這四樣加起來通常不到琴價的一成，但少了會很麻煩</text><rect x="24.0" y="84" width="320.0" height="90" rx="10" fill="#f3ece2" stroke="#c9bba6"/><text x="42.0" y="114" font-size="20" text-anchor="start" fill="#A67C52" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">1</text><text x="68.0" y="114" font-size="12.5" text-anchor="start" fill="#3a3128" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">調音器</text><text x="42.0" y="138" font-size="10.5" text-anchor="start" fill="#3a3128" font-family="system-ui, -apple-system, Segoe UI, sans-serif">夾式即可；手機 App 也可以，但</text><text x="42.0" y="156" font-size="10.5" text-anchor="start" fill="#3a3128" font-family="system-ui, -apple-system, Segoe UI, sans-serif">夾式在吵雜環境更穩</text><rect x="360.0" y="84" width="320.0" height="90" rx="10" fill="#f3ece2" stroke="#c9bba6"/><text x="378.0" y="114" font-size="20" text-anchor="start" fill="#A67C52" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">2</text><text x="404.0" y="114" font-size="12.5" text-anchor="start" fill="#3a3128" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">琴袋或琴盒</text><text x="378.0" y="138" font-size="10.5" text-anchor="start" fill="#3a3128" font-family="system-ui, -apple-system, Segoe UI, sans-serif">厚琴袋就夠日常使用；要帶出門選有硬</text><text x="378.0" y="156" font-size="10.5" text-anchor="start" fill="#3a3128" font-family="system-ui, -apple-system, Segoe UI, sans-serif">殼的</text><rect x="24.0" y="188" width="320.0" height="90" rx="10" fill="#f3ece2" stroke="#c9bba6"/><text x="42.0" y="218" font-size="20" text-anchor="start" fill="#A67C52" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">3</text><text x="68.0" y="218" font-size="12.5" text-anchor="start" fill="#3a3128" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">背帶</text><text x="42.0" y="242" font-size="10.5" text-anchor="start" fill="#3a3128" font-family="system-ui, -apple-system, Segoe UI, sans-serif">站著彈才需要；坐著彈靠三點支撐就好</text><rect x="360.0" y="188" width="320.0" height="90" rx="10" fill="#f3ece2" stroke="#c9bba6"/><text x="378.0" y="218" font-size="20" text-anchor="start" fill="#A67C52" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">4</text><text x="404.0" y="218" font-size="12.5" text-anchor="start" fill="#3a3128" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">擦拭布</text><text x="378.0" y="242" font-size="10.5" text-anchor="start" fill="#3a3128" font-family="system-ui, -apple-system, Segoe UI, sans-serif">每次彈完擦弦，弦的壽命差很多</text><text x="24" y="324" font-size="10.5" text-anchor="start" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">先不要買一堆效果器或改裝品；把這四樣準備好，再談第二把琴。</text></svg>
