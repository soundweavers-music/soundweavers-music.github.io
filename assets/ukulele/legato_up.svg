<svg xmlns="http://www.w3.org/2000/svg" width="680" height="300" viewBox="0 0 680 300" role="img" aria-label="錘音勾音滑音"><title>錘音勾音滑音</title><rect width="680" height="300" fill="#fdfbf7"/><text x="24" y="28" font-size="14" text-anchor="start" fill="#3a3128" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">錘音、勾音、滑音：第二個音不靠右手</text><text x="24" y="48" font-size="11" text-anchor="start" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">三個動作都在同一條弦上完成；左手在發聲的瞬間才動，而且要壓得住</text><text x="126.0" y="96" font-size="12.5" text-anchor="middle" fill="#3a3128" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">錘音 Hammer-on</text><text x="26" y="122" font-size="10" text-anchor="start" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">C 弦</text><line x1="70" y1="160" x2="226" y2="160" stroke="#3a3128" stroke-width="1.2" opacity="0.45"/><rect x="82" y="150" width="20" height="20" fill="#fdfbf7"/><text x="92" y="166" font-size="16" text-anchor="middle" fill="#A67C52" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">0</text><rect x="196" y="150" width="20" height="20" fill="#fdfbf7"/><text x="206" y="166" font-size="16" text-anchor="middle" fill="#A67C52" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">2</text><path d="M104 144 Q126.0 104 206 144" stroke="#A67C52" stroke-width="1.6" fill="none"/><path d="M206 144 l-7 -1 l2 -6 z" fill="#A67C52"/><text x="126.0" y="114" font-size="13" text-anchor="middle" fill="#A67C52" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">H</text><text x="26" y="202" font-size="10.5" text-anchor="start" fill="#3a3128" font-family="system-ui, -apple-system, Segoe UI, sans-serif">右手撥 C 空弦，中指快速敲進第 2 格</text><text x="342.0" y="96" font-size="12.5" text-anchor="middle" fill="#3a3128" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">勾音 Pull-off</text><text x="242" y="122" font-size="10" text-anchor="start" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">C 弦</text><line x1="286" y1="160" x2="442" y2="160" stroke="#3a3128" stroke-width="1.2" opacity="0.45"/><rect x="298" y="150" width="20" height="20" fill="#fdfbf7"/><text x="308" y="166" font-size="16" text-anchor="middle" fill="#A67C52" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">2</text><rect x="412" y="150" width="20" height="20" fill="#fdfbf7"/><text x="422" y="166" font-size="16" text-anchor="middle" fill="#A67C52" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">0</text><path d="M320 144 Q342.0 104 422 144" stroke="#A67C52" stroke-width="1.6" fill="none"/><path d="M422 144 l-7 -1 l2 -6 z" fill="#A67C52"/><text x="342.0" y="114" font-size="13" text-anchor="middle" fill="#A67C52" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">P</text><text x="242" y="202" font-size="10.5" text-anchor="start" fill="#3a3128" font-family="system-ui, -apple-system, Segoe UI, sans-serif">按 C 弦第 2 格撥響，中指向下勾離開變空弦</text><text x="558.0" y="96" font-size="12.5" text-anchor="middle" fill="#3a3128" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">滑音 Slide</text><text x="458" y="122" font-size="10" text-anchor="start" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">C 弦</text><line x1="502" y1="160" x2="658" y2="160" stroke="#3a3128" stroke-width="1.2" opacity="0.45"/><rect x="514" y="150" width="20" height="20" fill="#fdfbf7"/><text x="524" y="166" font-size="16" text-anchor="middle" fill="#A67C52" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">2</text><rect x="628" y="150" width="20" height="20" fill="#fdfbf7"/><text x="638" y="166" font-size="16" text-anchor="middle" fill="#A67C52" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">5</text><path d="M536 144 Q558.0 104 638 144" stroke="#A67C52" stroke-width="1.6" fill="none"/><path d="M638 144 l-7 -1 l2 -6 z" fill="#A67C52"/><text x="558.0" y="114" font-size="13" text-anchor="middle" fill="#A67C52" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">S</text><text x="458" y="202" font-size="10.5" text-anchor="start" fill="#3a3128" font-family="system-ui, -apple-system, Segoe UI, sans-serif">壓住第 2 格撥響後不鬆手，滑到第 5 格停住</text><text x="24" y="284" font-size="10.5" text-anchor="start" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">烏克麗麗弦軟、張力小，錘音與勾音特別容易「悶掉」：指尖要立起來，動作要小但果斷。</text></svg>
