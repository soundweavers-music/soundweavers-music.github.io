<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" role="img" aria-label="半音階鍵盤圖"><title>半音階鍵盤圖</title><rect width="720" height="300" fill="#fdfbf7"/><text x="24" y="30" font-size="15" text-anchor="start" fill="#3a3128" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">一個八度裡的 12 個半音</text><text x="24" y="50" font-size="11.5" text-anchor="start" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">白鍵 7 個、黑鍵 5 個；升記號與降記號指的是同一個音（C# ＝ Db）</text><rect x="160.0" y="96" width="48" height="96" rx="4" fill="#fdfbf7" stroke="#c9bba6"/><text x="185.0" y="174" font-size="12" text-anchor="middle" fill="#3a3128" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">C</text><rect x="210.0" y="96" width="48" height="96" rx="4" fill="#fdfbf7" stroke="#c9bba6"/><text x="235.0" y="174" font-size="12" text-anchor="middle" fill="#3a3128" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">D</text><rect x="260.0" y="96" width="48" height="96" rx="4" fill="#fdfbf7" stroke="#c9bba6"/><text x="285.0" y="174" font-size="12" text-anchor="middle" fill="#3a3128" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">E</text><rect x="310.0" y="96" width="48" height="96" rx="4" fill="#fdfbf7" stroke="#c9bba6"/><text x="335.0" y="174" font-size="12" text-anchor="middle" fill="#3a3128" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">F</text><rect x="360.0" y="96" width="48" height="96" rx="4" fill="#fdfbf7" stroke="#c9bba6"/><text x="385.0" y="174" font-size="12" text-anchor="middle" fill="#3a3128" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">G</text><rect x="410.0" y="96" width="48" height="96" rx="4" fill="#fdfbf7" stroke="#c9bba6"/><text x="435.0" y="174" font-size="12" text-anchor="middle" fill="#3a3128" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">A</text><rect x="460.0" y="96" width="48" height="96" rx="4" fill="#fdfbf7" stroke="#c9bba6"/><text x="485.0" y="174" font-size="12" text-anchor="middle" fill="#3a3128" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">B</text><rect x="194.0" y="96" width="30" height="58" rx="4" fill="#A67C52"/><text x="209.0" y="138" font-size="9.5" text-anchor="middle" fill="#fdfbf7" font-family="system-ui, -apple-system, Segoe UI, sans-serif">Db</text><rect x="244.0" y="96" width="30" height="58" rx="4" fill="#A67C52"/><text x="259.0" y="138" font-size="9.5" text-anchor="middle" fill="#fdfbf7" font-family="system-ui, -apple-system, Segoe UI, sans-serif">Eb</text><rect x="344.0" y="96" width="30" height="58" rx="4" fill="#A67C52"/><text x="359.0" y="138" font-size="9.5" text-anchor="middle" fill="#fdfbf7" font-family="system-ui, -apple-system, Segoe UI, sans-serif">Gb</text><rect x="394.0" y="96" width="30" height="58" rx="4" fill="#A67C52"/><text x="409.0" y="138" font-size="9.5" text-anchor="middle" fill="#fdfbf7" font-family="system-ui, -apple-system, Segoe UI, sans-serif">Ab</text><rect x="444.0" y="96" width="30" height="58" rx="4" fill="#A67C52"/><text x="459.0" y="138" font-size="9.5" text-anchor="middle" fill="#fdfbf7" font-family="system-ui, -apple-system, Segoe UI, sans-serif">Bb</text><text x="24" y="232" font-size="10.5" text-anchor="start" fill="#3a3128" font-family="system-ui, -apple-system, Segoe UI, sans-serif">C → C# → D → D# → E → F → F# → G → G# → A → A# → B → C</text><text x="24" y="258" font-size="10.5" text-anchor="start" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">相鄰兩個鍵就是半音；隔一個鍵是全音。吉他、烏克麗麗相鄰兩格也都是半音。</text></svg>
