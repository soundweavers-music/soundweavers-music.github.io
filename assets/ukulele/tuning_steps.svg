<svg xmlns="http://www.w3.org/2000/svg" width="720" height="338" viewBox="0 0 720 338" role="img" aria-label="調音四步驟：從第 4 弦調到第 1 弦"><title>調音四步驟：從第 4 弦調到第 1 弦</title><rect width="720" height="338" fill="#fdfbf7"/><text x="24" y="34" font-size="15" text-anchor="start" fill="#3a3128" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">調音四步驟：從第 4 弦調到第 1 弦</text><text x="24" y="55" font-size="11.5" text-anchor="start" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">每次拿起琴都先跑一輪，一分鐘內可以完成</text><rect x="24.0" y="84" width="320.0" height="90" rx="10" fill="#f3ece2" stroke="#c9bba6"/><text x="42.0" y="114" font-size="20" text-anchor="start" fill="#A67C52" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">1</text><text x="68.0" y="114" font-size="12.5" text-anchor="start" fill="#3a3128" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">夾上調音器</text><text x="42.0" y="138" font-size="10.5" text-anchor="start" fill="#3a3128" font-family="system-ui, -apple-system, Segoe UI, sans-serif">夾在琴頭，模式選 C（十二平均律）</text><text x="42.0" y="156" font-size="10.5" text-anchor="start" fill="#3a3128" font-family="system-ui, -apple-system, Segoe UI, sans-serif">，基準 440Hz</text><rect x="360.0" y="84" width="320.0" height="90" rx="10" fill="#f3ece2" stroke="#c9bba6"/><text x="378.0" y="114" font-size="20" text-anchor="start" fill="#A67C52" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">2</text><text x="404.0" y="114" font-size="12.5" text-anchor="start" fill="#3a3128" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">一次只撥一根弦</text><text x="378.0" y="138" font-size="10.5" text-anchor="start" fill="#3a3128" font-family="system-ui, -apple-system, Segoe UI, sans-serif">從第 4 弦開始；撥完等 1～2 </text><text x="378.0" y="156" font-size="10.5" text-anchor="start" fill="#3a3128" font-family="system-ui, -apple-system, Segoe UI, sans-serif">秒，讓音穩定再讀</text><rect x="24.0" y="188" width="320.0" height="90" rx="10" fill="#f3ece2" stroke="#c9bba6"/><text x="42.0" y="218" font-size="20" text-anchor="start" fill="#A67C52" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">3</text><text x="68.0" y="218" font-size="12.5" text-anchor="start" fill="#3a3128" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">先看音名、再看指針</text><text x="42.0" y="242" font-size="10.5" text-anchor="start" fill="#3a3128" font-family="system-ui, -apple-system, Segoe UI, sans-serif">字母不對就是差太多，先把音名調對，</text><text x="42.0" y="260" font-size="10.5" text-anchor="start" fill="#3a3128" font-family="system-ui, -apple-system, Segoe UI, sans-serif">指針只是微調</text><rect x="360.0" y="188" width="320.0" height="90" rx="10" fill="#f3ece2" stroke="#c9bba6"/><text x="378.0" y="218" font-size="20" text-anchor="start" fill="#A67C52" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">4</text><text x="404.0" y="218" font-size="12.5" text-anchor="start" fill="#3a3128" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">回頭再檢查一次</text><text x="378.0" y="242" font-size="10.5" text-anchor="start" fill="#3a3128" font-family="system-ui, -apple-system, Segoe UI, sans-serif">調好第 1 弦後張力會變，前面幾條</text><text x="378.0" y="260" font-size="10.5" text-anchor="start" fill="#3a3128" font-family="system-ui, -apple-system, Segoe UI, sans-serif">常會跟著跑掉</text><text x="24" y="324" font-size="10.5" text-anchor="start" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">換弦後的前兩天一定會一直走音，這是正常的；彈之前先調，彈完再調一次。</text></svg>
