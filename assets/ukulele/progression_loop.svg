ans-serif">重　輕　重　輕</text><text x="24" y="320" font-size="10.5" text-anchor="start" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">「重」是手腕多用一點力、聲音更飽；「輕」不是不刷，是刷得薄一點。四拍都要刷到，差別在力道。</text></svg>
