<svg xmlns="http://www.w3.org/2000/svg" width="620" height="210" viewBox="0 0 620 210" role="img" aria-label="民謠搖滾刷弦格子"><title>民謠搖滾刷弦格子</title><rect width="620" height="210" fill="#fdfbf7"/><text x="24" y="28" font-size="14" fill="#3a3128" font-family="system-ui, -apple-system, Segoe UI, sans-serif">民謠搖滾（Folk Rock）4/4：↓　↓↑　↑↓↑</text><rect x="40" y="70" width="62" height="70" rx="6" fill="#f3ece2" stroke="#c9bba6"/><text x="71.0" y="90" font-size="11" text-anchor="middle" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">1</text><text x="71.0" y="122" font-size="22" text-anchor="middle" fill="#A67C52" font-family="system-ui, -apple-system, Segoe UI, sans-serif">↓</text><rect x="108" y="70" width="62" height="70" rx="6" fill="#fdfbf7" stroke="#c9bba6"/><text x="139.0" y="90" font-size="11" text-anchor="middle" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">＋</text><rect x="176" y="70" width="62" height="70" rx="6" fill="#f3ece2" stroke="#c9bba6"/><text x="207.0" y="90" font-size="11" text-anchor="middle" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">2</text><text x="207.0" y="122" font-size="22" text-anchor="middle" fill="#A67C52" font-family="system-ui, -apple-system, Segoe UI, sans-serif">↓</text><rect x="244" y="70" width="62" height="70" rx="6" fill="#fdfbf7" stroke="#c9bba6"/><text x="275.0" y="90" font-size="11" text-anchor="middle" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">＋</text><text x="275.0" y="122" font-size="22" text-anchor="middle" fill="#A67C52" font-family="system-ui, -apple-system, Segoe UI, sans-serif">↑</text><rect x="312" y="70" width="62" height="70" rx="6" fill="#f3ece2" stroke="#c9bba6"/><text x="343.0" y="90" font-size="11" text-anchor="middle" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">3</text><text x="343.0" y="122" font-size="22" text-anchor="middle" fill="#A67C52" font-family="system-ui, -apple-system, Segoe UI, sans-serif">↑</text><rect x="380" y="70" width="62" height="70" rx="6" fill="#fdfbf7" stroke="#c9bba6"/><text x="411.0" y="90" font-size="11" text-anchor="middle" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">＋</text><rect x="448" y="70" width="62" height="70" rx="6" fill="#f3ece2" stroke="#c9bba6"/><text x="479.0" y="90" font-size="11" text-anchor="middle" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">4</text><text x="479.0" y="122" font-size="22" text-anchor="middle" fill="#A67C52" font-family="system-ui, -apple-system, Segoe UI, sans-serif">↓</text><rect x="516" y="70" width="62" height="70" rx="6" fill="#fdfbf7" stroke="#c9bba6"/><text x="547.0" y="90" font-size="11" text-anchor="middle" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">＋</text><text x="547.0" y="122" font-size="22" text-anchor="middle" fill="#A67C52" font-family="system-ui, -apple-system, Segoe UI, sans-serif">↑</text><text x="24" y="166" font-size="11.5" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">「＋」是反拍（手往上的空檔）；空白的格子＝手繼續擺動但不碰弦（Air Strum）。</text><text x="24" y="186" font-size="11.5" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">每一小節固定 8 個動作，換和弦時手腕不要停。</text></svg>
