<svg xmlns="http://www.w3.org/2000/svg" width="640" height="210" viewBox="0 0 640 210" role="img" aria-label="換弦三步"><title>換弦三步</title><rect width="640" height="210" fill="#fdfbf7"/><text x="24" y="28" font-size="14" fill="#3a3128" font-family="system-ui, -apple-system, Segoe UI, sans-serif">換弦三步</text><rect x="30" y="60" width="185" height="96" rx="10" fill="#fbf7f0" stroke="#c9bba6"/><text x="122" y="96" font-size="22" text-anchor="middle" fill="#A67C52" font-family="system-ui, -apple-system, Segoe UI, sans-serif">① 鬆</text><text x="122" y="112" font-size="10.5" text-anchor="middle" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">先鬆弦鈕</text><text x="122" y="129" font-size="10.5" text-anchor="middle" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">讓弦完全沒有張力再加熱</text><rect x="235" y="60" width="185" height="96" rx="10" fill="#fbf7f0" stroke="#c9bba6"/><text x="327" y="96" font-size="22" text-anchor="middle" fill="#A67C52" font-family="system-ui, -apple-system, Segoe UI, sans-serif">② 拆</text><text x="327" y="112" font-size="10.5" text-anchor="middle" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">從琴橋拉出舊弦</text><text x="327" y="129" font-size="10.5" text-anchor="middle" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">清潔指板與琴格</text><rect x="440" y="60" width="185" height="96" rx="10" fill="#fbf7f0" stroke="#c9bba6"/><text x="532" y="96" font-size="22" text-anchor="middle" fill="#A67C52" font-family="system-ui, -apple-system, Segoe UI, sans-serif">③ 綁</text><text x="532" y="112" font-size="10.5" text-anchor="middle" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">新弦繞成八字結</text><text x="532" y="129" font-size="10.5" text-anchor="middle" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">邊調音邊拉緊</text><text x="24" y="190" font-size="10.5" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">一次只換一條弦，換完立刻調音；四條都換完再整體微調一次。</text></svg>
