<svg xmlns="http://www.w3.org/2000/svg" width="720" height="320" viewBox="0 0 720 320" role="img" aria-label="四種基本音符"><title>四種基本音符</title><rect width="720" height="320" fill="#fdfbf7"/><text x="24" y="34" font-size="15" text-anchor="start" fill="#3a3128" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">四種基本音符：一個小節可以裝幾個</text><text x="24" y="55" font-size="11.5" text-anchor="start" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">橫條的長度就是音延續的長度；4/4 拍一小節固定 4 拍</text><text x="160" y="108" font-size="12" text-anchor="end" fill="#3a3128" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">全音符</text><rect x="170.0" y="88" width="466.0" height="28" rx="5" fill="#C4956A" opacity="0.9"/><text x="170" y="134" font-size="10" text-anchor="start" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">4 拍｜刷一下，讓它響滿整小節</text><line x1="170" y1="82" x2="170" y2="122" stroke="#3a3128" stroke-width="1.6"/><line x1="640" y1="82" x2="640" y2="122" stroke="#3a3128" stroke-width="1.6"/><text x="160" y="162" font-size="12" text-anchor="end" fill="#3a3128" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">二分音符</text><rect x="170.0" y="142" width="231.0" height="28" rx="5" fill="#C4956A" opacity="0.9"/><rect x="405.0" y="142" width="231.0" height="28" rx="5" fill="#C4956A" opacity="0.55"/><text x="170" y="188" font-size="10" text-anchor="start" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">2 拍｜一小節兩下</text><line x1="170" y1="136" x2="170" y2="176" stroke="#3a3128" stroke-width="1.6"/><line x1="640" y1="136" x2="640" y2="176" stroke="#3a3128" stroke-width="1.6"/><text x="160" y="216" font-size="12" text-anchor="end" fill="#3a3128" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">四分音符</text><rect x="170.0" y="196" width="113.5" height="28" rx="5" fill="#C4956A" opacity="0.9"/><rect x="287.5" y="196" width="113.5" height="28" rx="5" fill="#C4956A" opacity="0.55"/><rect x="405.0" y="196" width="113.5" height="28" rx="5" fill="#C4956A" opacity="0.9"/><rect x="522.5" y="196" width="113.5" height="28" rx="5" fill="#C4956A" opacity="0.55"/><text x="170" y="242" font-size="10" text-anchor="start" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">1 拍｜跟著節拍器一下一下</text><line x1="170" y1="190" x2="170" y2="230" stroke="#3a3128" stroke-width="1.6"/><line x1="640" y1="190" x2="640" y2="230" stroke="#3a3128" stroke-width="1.6"/><text x="160" y="270" font-size="12" text-anchor="end" fill="#3a3128" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">八分音符</text><rect x="170.0" y="250" width="54.8" height="28" rx="5" fill="#C4956A" opacity="0.9"/><rect x="228.8" y="250" width="54.8" height="28" rx="5" fill="#C4956A" opacity="0.55"/><rect x="287.5" y="250" width="54.8" height="28" rx="5" fill="#C4956A" opacity="0.9"/><rect x="346.2" y="250" width="54.8" height="28" rx="5" fill="#C4956A" opacity="0.55"/><rect x="405.0" y="250" width="54.8" height="28" rx="5" fill="#C4956A" opacity="0.9"/><rect x="463.8" y="250" width="54.8" height="28" rx="5" fill="#C4956A" opacity="0.55"/><rect x="522.5" y="250" width="54.8" height="28" rx="5" fill="#C4956A" opacity="0.9"/><rect x="581.2" y="250" width="54.8" height="28" rx="5" fill="#C4956A" opacity="0.55"/><text x="170" y="296" font-size="10" text-anchor="start" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">半拍｜一拍裡兩下，數 1 &amp; 2 &amp;</text><line x1="170" y1="244" x2="170" y2="284" stroke="#3a3128" stroke-width="1.6"/><line x1="640" y1="244" x2="640" y2="284" stroke="#3a3128" stroke-width="1.6"/></svg>
