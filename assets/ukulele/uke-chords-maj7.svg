" y2="146" stroke="#c9bba6" stroke-width="1.2"/><line x1="584.0" y1="164" x2="638.0" y2="164" stroke="#c9bba6" stroke-width="1.2"/><line x1="584.0" y1="182" x2="638.0" y2="182" stroke="#c9bba6" stroke-width="1.2"/><circle cx="584.0" cy="102" r="4" fill="none" stroke="#A67C52" stroke-width="1.6"/><circle cx="602.0" cy="137.0" r="6.5" fill="#C4956A"/><circle cx="620.0" cy="102" r="4" fill="none" stroke="#A67C52" stroke-width="1.6"/><circle cx="638.0" cy="137.0" r="6.5" fill="#C4956A"/><text x="612.0" y="248" font-size="9.5" text-anchor="middle" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">食指 3 弦 2 格、</text><text x="612.0" y="264" font-size="9.5" text-anchor="middle" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">中指 1 弦 2 格</text><text x="24" y="358" font-size="10.5" text-anchor="start" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">F 和弦把 3 弦 4 格那顆音換成 3 弦空弦，就變成 Fmaj7——不是「放開無名指」那麼簡單。</text></svg>
