<svg xmlns="http://www.w3.org/2000/svg" width="720" height="320" viewBox="0 0 720 320" role="img" aria-label="3/4 與 6/8 的重音"><title>3/4 與 6/8 的重音</title><rect width="720" height="320" fill="#fdfbf7"/><text x="24" y="34" font-size="15" text-anchor="start" fill="#3a3128" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">3/4 與 6/8：重音落在不同地方</text><text x="24" y="55" font-size="11.5" text-anchor="start" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">兩者都是三拍一組，但 6/8 是「兩大拍、每大拍三下」，聽起來更快、更圓</text><text x="96" y="110" font-size="14" text-anchor="end" fill="#A67C52" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">3/4</text><rect x="120.0" y="88" width="167.3" height="36" rx="6" fill="#C4956A" stroke="#c9bba6"/><text x="203.66666666666669" y="111" font-size="11.5" text-anchor="middle" fill="#fdfbf7" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">強</text><rect x="293.3" y="88" width="167.3" height="36" rx="6" fill="#f3ece2" stroke="#c9bba6"/><text x="377.00000000000006" y="111" font-size="11.5" text-anchor="middle" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">弱</text><rect x="466.7" y="88" width="167.3" height="36" rx="6" fill="#f3ece2" stroke="#c9bba6"/><text x="550.3333333333334" y="111" font-size="11.5" text-anchor="middle" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">弱</text><text x="120" y="148" font-size="10" text-anchor="start" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">三拍一一數；第 1 拍最飽滿</text><text x="96" y="206" font-size="14" text-anchor="end" fill="#A67C52" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">6/8</text><rect x="120.0" y="184" width="80.7" height="36" rx="6" fill="#C4956A" stroke="#c9bba6"/><text x="160.33333333333334" y="207" font-size="11.5" text-anchor="middle" fill="#fdfbf7" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">強</text><rect x="206.7" y="184" width="80.7" height="36" rx="6" fill="#f3ece2" stroke="#c9bba6"/><text x="247.00000000000003" y="207" font-size="11.5" text-anchor="middle" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">弱</text><rect x="293.3" y="184" width="80.7" height="36" rx="6" fill="#f3ece2" stroke="#c9bba6"/><text x="333.6666666666667" y="207" font-size="11.5" text-anchor="middle" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">弱</text><rect x="380.0" y="184" width="80.7" height="36" rx="6" fill="#C4956A" stroke="#c9bba6"/><text x="420.3333333333333" y="207" font-size="11.5" text-anchor="middle" fill="#fdfbf7" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">次強</text><rect x="466.7" y="184" width="80.7" height="36" rx="6" fill="#f3ece2" stroke="#c9bba6"/><text x="507.0" y="207" font-size="11.5" text-anchor="middle" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">弱</text><rect x="553.3" y="184" width="80.7" height="36" rx="6" fill="#f3ece2" stroke="#c9bba6"/><text x="593.6666666666667" y="207" font-size="11.5" text-anchor="middle" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">弱</text><text x="120" y="244" font-size="10" text-anchor="start" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">兩大拍；第 4 下要再給一次力道</text><text x="24" y="304" font-size="10.5" text-anchor="start" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">6/8 不是「六個平均的四拍」；數成兩大拍，第 1 與第 4 下明顯更用力，律動就對了。</text></svg>
