<svg xmlns="http://www.w3.org/2000/svg" width="660" height="320" viewBox="0 0 660 320" role="img" aria-label="持琴三點支撐"><title>持琴三點支撐</title><rect width="660" height="320" fill="#fdfbf7"/><text x="24" y="28" font-size="14" fill="#3a3128" font-family="system-ui, -apple-system, Segoe UI, sans-serif">持琴三點支撐（側面示意）</text><rect x="96" y="70" width="118" height="196" rx="26" fill="#f6efe6" stroke="#c9bba6"/><circle cx="155" cy="52" r="22" fill="#f6efe6" stroke="#c9bba6"/><g transform="translate(206,196) rotate(-22)"><circle cx="0" cy="14" r="27" fill="#C4956A" stroke="#A67C52" stroke-width="1.4"/><circle cx="0" cy="-12" r="20" fill="#C4956A" stroke="#A67C52" stroke-width="1.4"/><rect x="-4" y="-82" width="8" height="52" fill="#A67C52"/><rect x="-9" y="-100" width="18" height="20" rx="4" fill="#A67C52"/></g><line x1="150" y1="196" x2="330" y2="82" stroke="#c9bba6" stroke-dasharray="3 3"/><circle cx="150" cy="196" r="10" fill="#A67C52"/><text x="150" y="200" font-size="11" text-anchor="middle" fill="#fff" font-family="system-ui, -apple-system, Segoe UI, sans-serif">①</text><text x="340" y="86" font-size="12.5" fill="#3a3128" font-family="system-ui, -apple-system, Segoe UI, sans-serif">① 胸口貼住琴背（只是靠著）</text><line x1="232" y1="246" x2="330" y2="144" stroke="#c9bba6" stroke-dasharray="3 3"/><circle cx="232" cy="246" r="10" fill="#A67C52"/><text x="232" y="250" font-size="11" text-anchor="middle" fill="#fff" font-family="system-ui, -apple-system, Segoe UI, sans-serif">②</text><text x="340" y="148" font-size="12.5" fill="#3a3128" font-family="system-ui, -apple-system, Segoe UI, sans-serif">② 右前臂輕壓琴身右上緣</text><line x1="214" y1="118" x2="330" y2="206" stroke="#c9bba6" stroke-dasharray="3 3"/><circle cx="214" cy="118" r="10" fill="#A67C52"/><text x="214" y="122" font-size="11" text-anchor="middle" fill="#fff" font-family="system-ui, -apple-system, Segoe UI, sans-serif">③</text><text x="340" y="210" font-size="12.5" fill="#3a3128" font-family="system-ui, -apple-system, Segoe UI, sans-serif">③ 左手虎口輕托琴頸，不要夾死</text><text x="24" y="300" font-size="11" fill="#9C8F87" font-family="system-ui, -apple-system, Segoe UI, sans-serif">三點都只是「靠著」，不要用力夾：右臂壓太緊面板會悶，虎口夾死換和弦會變慢。</text></svg>
