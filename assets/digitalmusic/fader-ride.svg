  <text x="344.0" y="110" class="ts" font-size="9.5" text-anchor="middle" fill="#B0563F">某個字被吃掉 → 只推那一下</text>
  <rect x="60" y="250" width="250" height="54" rx="8" fill="#DEE8F3" stroke="#D9CFC4" stroke-width="1.3"/>
  <text x="72" y="272" class="t" font-size="13" font-weight="700">先修 clip gain</text>
  <text x="72" y="291" class="ts" font-size="11">段落性的問題用它，推桿留給表情</text>
  <rect x="340" y="250" width="260" height="54" rx="8" fill="#F3E9DC" stroke="#D9CFC4" stroke-width="1.3"/>
  <text x="352" y="272" class="t" font-size="13" font-weight="700">推桿只做小幅度</text>
  <text x="352" y="291" class="ts" font-size="11">超過 3 dB 就該回頭看錄音</text>
</svg>
