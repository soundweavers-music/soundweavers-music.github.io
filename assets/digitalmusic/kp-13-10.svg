<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 460" role="img" aria-label="何時要從靜態混音進入動態處理？">
  <title>何時要從靜態混音進入動態處理？</title>
  <rect width="660" height="460" fill="#FBF8F4"/>
  <style>
    .t   { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; }
    .tb  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; font-weight: 700; }
    .ts  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #8C8078; }
    .num { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #FFFFFF; font-weight: 700; font-size: 11px; }
    .ink { fill: none; stroke: #3D3229; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; }
    .thin{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; }
    .dash{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; stroke-dasharray: 4 5; }
    .lead{ fill: none; stroke: #8C8078; stroke-width: 1; }
    .acc { fill: none; stroke: #A67C52; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .blue{ fill: none; stroke: #6B8FBF; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .green{ fill: none; stroke: #6F8F6A; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .red { fill: none; stroke: #B0563F; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .dot { fill: #3D3229; }
  </style>
  <text x="26" y="34" class="tb" font-size="16">何時要從靜態混音進入動態處理？</text>
  <text x="26" y="55" class="ts" font-size="12.5">把這一節的重點排在一起</text>
  <rect x="26.0" y="96" width="295.0" height="96" rx="9" fill="#F3E9DC" stroke="#D9CFC4" stroke-width="1.4"/>  <circle cx="40.0" cy="116" r="10" fill="#A67C52"/>  <text x="40.0" y="120" text-anchor="middle" class="num">1</text>  <text x="60.0" y="121" class="t" font-size="12" font-weight="700">所有樂器的音量比例已</text>  <text x="40.0" y="144" class="ts" font-size="9.5" fill="#8C8078">經大致正確。</text>  <rect x="339.0" y="96" width="295.0" height="96" rx="9" fill="#F3E9DC" stroke="#D9CFC4" stroke-width="1.4"/>  <circle cx="353.0" cy="116" r="10" fill="#A67C52"/>  <text x="353.0" y="120" text-anchor="middle" class="num">2</text>  <text x="373.0" y="121" class="t" font-size="12" font-weight="700">主從關係清楚，聽眾不</text>  <text x="353.0" y="144" class="ts" font-size="9.5" fill="#8C8078">需要思考就知道要聽哪裡。</text>  <rect x="26.0" y="206" width="295.0" height="96" rx="9" fill="#F3E9DC" stroke="#D9CFC4" stroke-width="1.4"/>  <circle cx="40.0" cy="226" r="10" fill="#A67C52"/>  <text x="40.0" y="230" text-anchor="middle" class="num">3</text>  <text x="60.0" y="231" class="t" font-size="12" font-weight="700">聲向配置提供了寬闊且</text>  <text x="40.0" y="254" class="ts" font-size="9.5" fill="#8C8078">穩定的立體聲畫面。</text>  <rect x="339.0" y="206" width="295.0" height="96" rx="9" fill="#F3E9DC" stroke="#D9CFC4" stroke-width="1.4"/>  <circle cx="353.0" cy="226" r="10" fill="#A67C52"/>  <text x="353.0" y="230" text-anchor="middle" class="num">4</text>  <text x="373.0" y="231" class="t" font-size="12" font-weight="700">沒有任何一個樂器在特</text>  <text x="353.0" y="254" class="ts" font-size="9.5" fill="#8C8078">定段落突然消失或爆出。</text>  <rect x="26.0" y="316" width="295.0" height="96" rx="9" fill="#F3E9DC" stroke="#D9CFC4" stroke-width="1.4"/>  <circle cx="40.0" cy="336" r="10" fill="#A67C52"/>  <text x="40.0" y="340" text-anchor="middle" class="num">5</text>  <text x="60.0" y="341" class="t" font-size="12" font-weight="700">壓縮器</text>  <text x="40.0" y="364" class="ts" font-size="9.5" fill="#8C8078">用來控制動態範圍，讓Bass線</text>  <text x="40.0" y="380" class="ts" font-size="9.5" fill="#8C8078">條更一致、讓Vocal的尾音不</text>  <text x="40.0" y="396" class="ts" font-size="9.5" fill="#8C8078">會忽大忽小。</text>  <rect x="339.0" y="316" width="295.0" height="96" rx="9" fill="#F3E9DC" stroke="#D9CFC4" stroke-width="1.4"/>  <circle cx="353.0" cy="336" r="10" fill="#A67C52"/>  <text x="353.0" y="340" text-anchor="middle" class="num">6</text>  <text x="373.0" y="341" class="t" font-size="12" font-weight="700">EQ</text>  <text x="353.0" y="364" class="ts" font-size="9.5" fill="#8C8078">用來解決頻率衝突，例如Kick</text>  <text x="353.0" y="380" class="ts" font-size="9.5" fill="#8C8078">與Bass的低頻打架、主唱與吉</text>  <text x="353.0" y="396" class="ts" font-size="9.5" fill="#8C8078">他的中高頻重疊。</text>
</svg>
