<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400" role="img" aria-label="LUFS 與限縮">
  <title>LUFS 與限縮</title>
  <rect width="660" height="400" fill="#FBF8F4"/>
  <style>
    .t   { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; }
    .tb  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; font-weight: 700; }
    .ts  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #8C8078; }
    .num { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #FFFFFF; font-weight: 700; font-size: 11px; }
    .ink { fill: none; stroke: #3D3229; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; }
    .thin{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; }
    .dash{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; stroke-dasharray: 4 5; }
    .lead{ fill: none; stroke: #8C8078; stroke-width: 1; }
    .acc { fill: none; stroke: #A67C52; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .blue{ fill: none; stroke: #6B8FBF; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .green{ fill: none; stroke: #6F8F6A; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .red { fill: none; stroke: #B0563F; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .dot { fill: #3D3229; }
  </style>
  <text x="26" y="34" class="tb" font-size="16">LUFS 與限縮</text>
  <text x="26" y="55" class="ts" font-size="12.5">響度標準與 True Peak 的關係</text>
  <text x="26" y="84" class="ts" font-size="12">LUFS 量的是「人耳感受的整體響度」，不是峰值；同一首歌可以很大聲卻不刺。</text>
  <text x="60" y="112" class="t" font-size="11">Spotify / YouTube</text>
  <text x="360" y="112" class="ts" font-size="11" text-anchor="end" fill="#A67C52">−14 LUFS</text>
  <path d="M60 120 L360 120" class="thin" stroke-dasharray="2 4"/>
  <text x="60" y="146" class="t" font-size="11">Apple Music</text>
  <text x="360" y="146" class="ts" font-size="11" text-anchor="end" fill="#A67C52">−16 LUFS</text>
  <path d="M60 154 L360 154" class="thin" stroke-dasharray="2 4"/>
  <text x="60" y="180" class="t" font-size="11">Podcast</text>
  <text x="360" y="180" class="ts" font-size="11" text-anchor="end" fill="#A67C52">−16 LUFS</text>
  <path d="M60 188 L360 188" class="thin" stroke-dasharray="2 4"/>
  <text x="60" y="214" class="t" font-size="11">廣播（EBU R128）</text>
  <text x="360" y="214" class="ts" font-size="11" text-anchor="end" fill="#A67C52">−23 LUFS</text>
  <path d="M60 222 L360 222" class="thin" stroke-dasharray="2 4"/>
  <text x="60" y="268" class="ts" font-size="11" fill="#B0563F">True Peak 要留在 −1 dBTP 以下，串流轉檔才不會爆。</text>
  <rect x="400" y="112" width="210" height="150" rx="4" fill="#FFFFFF" stroke="#D9CFC4" stroke-width="1.4"/>
  <path d="M400 242 L610 242" class="thin"/>
  <path d="M400 138 L610 138" class="thin" stroke-dasharray="3 3"/>
  <text x="404" y="132" class="ts" font-size="9" fill="#8C8078">0 dBFS</text>
  <rect x="418" y="222" width="12" height="20" rx="2" fill="#A67C52" opacity="0.35"/>
  <rect x="438" y="210" width="12" height="32" rx="2" fill="#A67C52" opacity="0.35"/>
  <rect x="458" y="198" width="12" height="44" rx="2" fill="#A67C52" opacity="0.35"/>
  <rect x="478" y="186" width="12" height="56" rx="2" fill="#A67C52" opacity="0.35"/>
  <rect x="498" y="174" width="12" height="68" rx="2" fill="#A67C52" opacity="0.35"/>
  <rect x="518" y="162" width="12" height="80" rx="2" fill="#A67C52" opacity="0.35"/>
  <rect x="538" y="150" width="12" height="92" rx="2" fill="#A67C52" opacity="0.35"/>
  <rect x="558" y="138" width="12" height="104" rx="2" fill="#A67C52" opacity="0.35"/>
  <rect x="578" y="126" width="12" height="116" rx="2" fill="#A67C52" opacity="0.35"/>
  <text x="505.0" y="280" class="ts" font-size="9.5" text-anchor="middle">限縮後的波形</text>
  <text x="26" y="340" class="ts" font-size="11">限縮到 −14 LUFS 通常只掉 2–4 dB；要再大聲，通常是混音階段就有問題。</text>
  <text x="26" y="382" class="ts" font-size="11" fill="#8C8078">大聲不等於好聽：串流平台會把過大的母帶轉小，你的動態反而被吃掉。</text>
</svg>
