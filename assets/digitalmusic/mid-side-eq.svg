<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 360" role="img" aria-label="Mid / Side 處理">
  <title>Mid / Side 處理</title>
  <rect width="660" height="360" fill="#FBF8F4"/>
  <style>
    .t   { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; }
    .tb  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; font-weight: 700; }
    .ts  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #8C8078; }
    .num { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #FFFFFF; font-weight: 700; font-size: 11px; }
    .ink { fill: none; stroke: #3D3229; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; }
    .thin{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; }
    .dash{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; stroke-dasharray: 4 5; }
    .lead{ fill: none; stroke: #8C8078; stroke-width: 1; }
    .acc { fill: none; stroke: #A67C52; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .blue{ fill: none; stroke: #6B8FBF; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .green{ fill: none; stroke: #6F8F6A; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .red { fill: none; stroke: #B0563F; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .dot { fill: #3D3229; }
  </style>
  <text x="26" y="34" class="tb" font-size="16">Mid / Side 處理</text>
  <text x="26" y="55" class="ts" font-size="12.5">把中央與兩側分開處理</text>
  <text x="26" y="84" class="ts" font-size="12">Mid 是左右共同的內容（人聲、大鼓），Side 是左右的差異（殘響、寬度）。</text>
  <rect x="60" y="110" width="160" height="60" rx="8" fill="#FFFFFF" stroke="#D9CFC4" stroke-width="1.3"/>
  <text x="72" y="132" class="t" font-size="13" font-weight="700">立體聲</text>
  <text x="72" y="151" class="ts" font-size="11">L / R</text>
  <rect x="270" y="110" width="120" height="60" rx="8" fill="#F3E9DC" stroke="#D9CFC4" stroke-width="1.3"/>
  <text x="282" y="132" class="t" font-size="13" font-weight="700">Mid</text>
  <text x="282" y="151" class="ts" font-size="11">L+R</text>
  <rect x="270" y="200" width="120" height="60" rx="8" fill="#DEE8F3" stroke="#D9CFC4" stroke-width="1.3"/>
  <text x="282" y="222" class="t" font-size="13" font-weight="700">Side</text>
  <text x="282" y="241" class="ts" font-size="11">L−R</text>
  <path d="M220 140 L266 140" class="thin"/>
  <path d="M220 140 C240 140 246 230 266 230" class="thin"/>
  <rect x="440" y="110" width="160" height="60" rx="8" fill="#F3E9DC" stroke="#D9CFC4" stroke-width="1.3"/>
  <text x="452" y="132" class="t" font-size="13" font-weight="700">EQ 只動 Mid</text>
  <text x="452" y="151" class="ts" font-size="11">人聲更清楚</text>
  <rect x="440" y="200" width="160" height="60" rx="8" fill="#DEE8F3" stroke="#D9CFC4" stroke-width="1.3"/>
  <text x="452" y="222" class="t" font-size="13" font-weight="700">EQ 只動 Side</text>
  <text x="452" y="241" class="ts" font-size="11">殘響變乾淨</text>
  <path d="M390 140 L436 140" class="thin"/>
  <path d="M390 230 L436 230" class="thin"/>
  <text x="26" y="300" class="ts" font-size="11">把 200 Hz 以下的 Side 切掉，低頻會立刻集中；把 3 kHz 的 Mid 修掉，人聲不會那麼刺。</text>
  <text x="26" y="342" class="ts" font-size="11" fill="#8C8078">M/S 處理後一定要檢查單聲道：Side 完全消失是正常，Mid 不該消失。</text>
</svg>
