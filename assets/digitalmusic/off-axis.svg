<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 360" role="img" aria-label="軸上與軸外">
  <title>軸上與軸外</title>
  <rect width="660" height="360" fill="#FBF8F4"/>
  <style>
    .t   { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; }
    .tb  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; font-weight: 700; }
    .ts  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #8C8078; }
    .num { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #FFFFFF; font-weight: 700; font-size: 11px; }
    .ink { fill: none; stroke: #3D3229; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; }
    .thin{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; }
    .dash{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; stroke-dasharray: 4 5; }
    .lead{ fill: none; stroke: #8C8078; stroke-width: 1; }
    .acc { fill: none; stroke: #A67C52; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .blue{ fill: none; stroke: #6B8FBF; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .green{ fill: none; stroke: #6F8F6A; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .red { fill: none; stroke: #B0563F; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .dot { fill: #3D3229; }
  </style>
  <text x="26" y="34" class="tb" font-size="16">軸上與軸外</text>
  <text x="26" y="55" class="ts" font-size="12.5">角度換掉的是唇齒與氣流</text>
  <text x="26" y="84" class="ts" font-size="12">正對嘴巴收得最亮、最多唇齒聲；偏一點角度，這兩樣都會少。</text>
  <circle cx="200" cy="190" r="26" fill="#3D3229" opacity="0.85"/>
  <text x="200" y="238" class="ts" font-size="10" text-anchor="middle">麥克風</text>
  <path d="M228 190 L350 190" class="acc"/>
  <text x="366.0" y="190.0" class="ts" font-size="10" fill="#A67C52">軸上 0°</text>
  <path d="M227 197 L345 229" class="green"/>
  <text x="360.5481322062509" y="231.41104721640332" class="ts" font-size="10" fill="#6F8F6A">偏 15°</text>
  <path d="M221 208 L315 286" class="blue"/>
  <text x="328.5671108990365" y="292.8460175498463" class="ts" font-size="10" fill="#6B8FBF">偏 40°</text>
  <rect x="400" y="120" width="200" height="54" rx="8" fill="#F3E9DC" stroke="#D9CFC4" stroke-width="1.3"/>
  <text x="412" y="142" class="t" font-size="13" font-weight="700">軸上</text>
  <text x="412" y="161" class="ts" font-size="11">唇齒、鼻音最明顯</text>
  <rect x="400" y="184" width="200" height="54" rx="8" fill="#E4EBDC" stroke="#D9CFC4" stroke-width="1.3"/>
  <text x="412" y="206" class="t" font-size="13" font-weight="700">偏 15–20°</text>
  <text x="412" y="225" class="ts" font-size="11">噴麥與齒音都減少</text>
  <rect x="400" y="248" width="200" height="54" rx="8" fill="#DEE8F3" stroke="#D9CFC4" stroke-width="1.3"/>
  <text x="412" y="270" class="t" font-size="13" font-weight="700">偏 40° 以上</text>
  <text x="412" y="289" class="ts" font-size="11">聲音開始發悶</text>
  <text x="26" y="342" class="ts" font-size="11">偏角是取捨：少一點噴麥，就少一點高頻細節。先錄一版聽聽看。</text>
</svg>
