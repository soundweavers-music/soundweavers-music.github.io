<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 460" role="img" aria-label="在 DAW 中設定 Comping 工作流程">
  <title>在 DAW 中設定 Comping 工作流程</title>
  <rect width="660" height="460" fill="#FBF8F4"/>
  <style>
    .t   { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; }
    .tb  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; font-weight: 700; }
    .ts  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #8C8078; }
    .num { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #FFFFFF; font-weight: 700; font-size: 11px; }
    .ink { fill: none; stroke: #3D3229; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; }
    .thin{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; }
    .dash{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; stroke-dasharray: 4 5; }
    .lead{ fill: none; stroke: #8C8078; stroke-width: 1; }
    .acc { fill: none; stroke: #A67C52; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .blue{ fill: none; stroke: #6B8FBF; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .green{ fill: none; stroke: #6F8F6A; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .red { fill: none; stroke: #B0563F; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .dot { fill: #3D3229; }
  </style>
  <text x="26" y="34" class="tb" font-size="16">在 DAW 中設定 Comping 工作流程</text>
  <text x="26" y="55" class="ts" font-size="12.5">把這一節的重點排在一起</text>
  <rect x="26.0" y="96" width="295.0" height="96" rx="9" fill="#F3E9DC" stroke="#D9CFC4" stroke-width="1.4"/>  <circle cx="40.0" cy="116" r="10" fill="#A67C52"/>  <text x="40.0" y="120" text-anchor="middle" class="num">1</text>  <text x="60.0" y="121" class="t" font-size="12" font-weight="700">啟用CycleMode</text>  <text x="40.0" y="144" class="ts" font-size="9.5" fill="#8C8078">按下鍵盤C或在尺規區域點擊，設</text>  <text x="40.0" y="160" class="ts" font-size="9.5" fill="#8C8078">定要錄音的段落範圍。</text>  <rect x="339.0" y="96" width="295.0" height="96" rx="9" fill="#F3E9DC" stroke="#D9CFC4" stroke-width="1.4"/>  <circle cx="353.0" cy="116" r="10" fill="#A67C52"/>  <text x="353.0" y="120" text-anchor="middle" class="num">2</text>  <text x="373.0" y="121" class="t" font-size="12" font-weight="700">錄製多個Take</text>  <text x="353.0" y="144" class="ts" font-size="9.5" fill="#8C8078">在CycleMode下錄音，每</text>  <text x="353.0" y="160" class="ts" font-size="9.5" fill="#8C8078">完成一次循環，Logic會自動</text>  <text x="353.0" y="176" class="ts" font-size="9.5" fill="#8C8078">建立一個新的Take。</text>  <rect x="26.0" y="206" width="295.0" height="96" rx="9" fill="#F3E9DC" stroke="#D9CFC4" stroke-width="1.4"/>  <circle cx="40.0" cy="226" r="10" fill="#A67C52"/>  <text x="40.0" y="230" text-anchor="middle" class="num">3</text>  <text x="60.0" y="231" class="t" font-size="12" font-weight="700">開啟CompFolder</text>  <text x="40.0" y="254" class="ts" font-size="9.5" fill="#8C8078">錄完後，音軌區會自動顯示為一個</text>  <text x="40.0" y="270" class="ts" font-size="9.5" fill="#8C8078">CompFolder。</text>  <rect x="339.0" y="206" width="295.0" height="96" rx="9" fill="#F3E9DC" stroke="#D9CFC4" stroke-width="1.4"/>  <circle cx="353.0" cy="226" r="10" fill="#A67C52"/>  <text x="353.0" y="230" text-anchor="middle" class="num">4</text>  <text x="373.0" y="231" class="t" font-size="12" font-weight="700">選取最佳片段</text>  <text x="353.0" y="254" class="ts" font-size="9.5" fill="#8C8078">在CompFolder中，按住</text>  <text x="353.0" y="270" class="ts" font-size="9.5" fill="#8C8078">Cmd點擊不同Take的段落，</text>  <text x="353.0" y="286" class="ts" font-size="9.5" fill="#8C8078">Logic會自動將選取的區域</text>  <rect x="26.0" y="316" width="295.0" height="96" rx="9" fill="#F3E9DC" stroke="#D9CFC4" stroke-width="1.4"/>  <circle cx="40.0" cy="336" r="10" fill="#A67C52"/>  <text x="40.0" y="340" text-anchor="middle" class="num">5</text>  <text x="60.0" y="341" class="t" font-size="12" font-weight="700">快速切換Take</text>  <text x="40.0" y="364" class="ts" font-size="9.5" fill="#8C8078">使用上/下方向鍵可以在不同Ta</text>  <text x="40.0" y="380" class="ts" font-size="9.5" fill="#8C8078">ke之間切換聆聽，快速比較。</text>  <rect x="339.0" y="316" width="295.0" height="96" rx="9" fill="#F3E9DC" stroke="#D9CFC4" stroke-width="1.4"/>  <circle cx="353.0" cy="336" r="10" fill="#A67C52"/>  <text x="353.0" y="340" text-anchor="middle" class="num">6</text>  <text x="373.0" y="341" class="t" font-size="12" font-weight="700">建立多個Playlist</text>  <text x="353.0" y="364" class="ts" font-size="9.5" fill="#8C8078">在音軌名稱旁的Playlist</text>  <text x="353.0" y="380" class="ts" font-size="9.5" fill="#8C8078">選單中選擇「Duplicate</text>  <text x="353.0" y="396" class="ts" font-size="9.5" fill="#8C8078">」，為每個Take建立一個新</text>
</svg>
