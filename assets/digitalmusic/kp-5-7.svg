<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 460" role="img" aria-label="六、打擊樂器（Percussion）收音">
  <title>六、打擊樂器（Percussion）收音</title>
  <rect width="660" height="460" fill="#FBF8F4"/>
  <style>
    .t   { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; }
    .tb  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; font-weight: 700; }
    .ts  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #8C8078; }
    .num { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #FFFFFF; font-weight: 700; font-size: 11px; }
    .ink { fill: none; stroke: #3D3229; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; }
    .thin{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; }
    .dash{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; stroke-dasharray: 4 5; }
    .lead{ fill: none; stroke: #8C8078; stroke-width: 1; }
    .acc { fill: none; stroke: #A67C52; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .blue{ fill: none; stroke: #6B8FBF; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .green{ fill: none; stroke: #6F8F6A; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .red { fill: none; stroke: #B0563F; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .dot { fill: #3D3229; }
  </style>
  <text x="26" y="34" class="tb" font-size="16">六、打擊樂器（Percussion）收音</text>
  <text x="26" y="55" class="ts" font-size="12.5">把這一節的重點排在一起</text>
  <rect x="26.0" y="96" width="295.0" height="96" rx="9" fill="#F3E9DC" stroke="#D9CFC4" stroke-width="1.4"/>  <circle cx="40.0" cy="116" r="10" fill="#A67C52"/>  <text x="40.0" y="120" text-anchor="middle" class="num">1</text>  <text x="60.0" y="121" class="t" font-size="12" font-weight="700">距離</text>  <text x="40.0" y="144" class="ts" font-size="9.5" fill="#8C8078">15-30公分，麥克風指向鼓面</text>  <text x="40.0" y="160" class="ts" font-size="9.5" fill="#8C8078">中心偏邊緣——中心低頻多，邊緣</text>  <text x="40.0" y="176" class="ts" font-size="9.5" fill="#8C8078">slap聲明顯。</text>  <rect x="339.0" y="96" width="295.0" height="96" rx="9" fill="#F3E9DC" stroke="#D9CFC4" stroke-width="1.4"/>  <circle cx="353.0" cy="116" r="10" fill="#A67C52"/>  <text x="353.0" y="120" text-anchor="middle" class="num">2</text>  <text x="373.0" y="121" class="t" font-size="12" font-weight="700">可選立體聲</text>  <text x="353.0" y="144" class="ts" font-size="9.5" fill="#8C8078">用兩支麥克風，一支針對低音（鼓</text>  <text x="353.0" y="160" class="ts" font-size="9.5" fill="#8C8078">中心）、一支針對slap（鼓邊</text>  <text x="353.0" y="176" class="ts" font-size="9.5" fill="#8C8078">），混音時平衡。</text>  <rect x="26.0" y="206" width="295.0" height="96" rx="9" fill="#F3E9DC" stroke="#D9CFC4" stroke-width="1.4"/>  <circle cx="40.0" cy="226" r="10" fill="#A67C52"/>  <text x="40.0" y="230" text-anchor="middle" class="num">3</text>  <text x="60.0" y="231" class="t" font-size="12" font-weight="700">過多低頻解決</text>  <text x="40.0" y="254" class="ts" font-size="9.5" fill="#8C8078">如果低頻過轟，將麥克風往後移1</text>  <text x="40.0" y="270" class="ts" font-size="9.5" fill="#8C8078">0公分，或啟用低切濾波（hig</text>  <text x="40.0" y="286" class="ts" font-size="9.5" fill="#8C8078">h-passfilter）。</text>  <rect x="339.0" y="206" width="295.0" height="96" rx="9" fill="#F3E9DC" stroke="#D9CFC4" stroke-width="1.4"/>  <circle cx="353.0" cy="226" r="10" fill="#A67C52"/>  <text x="353.0" y="230" text-anchor="middle" class="num">4</text>  <text x="373.0" y="231" class="t" font-size="12" font-weight="700">Shaker/沙鈴</text>  <text x="353.0" y="254" class="ts" font-size="9.5" fill="#8C8078">距離20-40公分，心形指向，</text>  <text x="353.0" y="270" class="ts" font-size="9.5" fill="#8C8078">注意不要收到手部摩擦聲。</text>  <rect x="26.0" y="316" width="295.0" height="96" rx="9" fill="#F3E9DC" stroke="#D9CFC4" stroke-width="1.4"/>  <circle cx="40.0" cy="336" r="10" fill="#A67C52"/>  <text x="40.0" y="340" text-anchor="middle" class="num">5</text>  <text x="60.0" y="341" class="t" font-size="12" font-weight="700">Tambourine/鈴鼓</text>  <text x="40.0" y="364" class="ts" font-size="9.5" fill="#8C8078">距離15-30公分，對準鈴片區</text>  <text x="40.0" y="380" class="ts" font-size="9.5" fill="#8C8078">域。</text>  <rect x="339.0" y="316" width="295.0" height="96" rx="9" fill="#F3E9DC" stroke="#D9CFC4" stroke-width="1.4"/>  <circle cx="353.0" cy="336" r="10" fill="#A67C52"/>  <text x="353.0" y="340" text-anchor="middle" class="num">6</text>  <text x="373.0" y="341" class="t" font-size="12" font-weight="700">Triangle/三角鐵</text>  <text x="353.0" y="364" class="ts" font-size="9.5" fill="#8C8078">一枝心形小振膜電容麥克風，距離</text>  <text x="353.0" y="380" class="ts" font-size="9.5" fill="#8C8078">20-30公分，對準三角鐵的開</text>  <text x="353.0" y="396" class="ts" font-size="9.5" fill="#8C8078">放端（開口處）。</text>
</svg>
