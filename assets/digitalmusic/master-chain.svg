<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400" role="img" aria-label="Master Bus 的處理順序">
  <title>Master Bus 的處理順序</title>
  <rect width="660" height="400" fill="#FBF8F4"/>
  <style>
    .t   { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; }
    .tb  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; font-weight: 700; }
    .ts  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #8C8078; }
    .num { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #FFFFFF; font-weight: 700; font-size: 11px; }
    .ink { fill: none; stroke: #3D3229; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; }
    .thin{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; }
    .dash{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; stroke-dasharray: 4 5; }
    .lead{ fill: none; stroke: #8C8078; stroke-width: 1; }
    .acc { fill: none; stroke: #A67C52; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .blue{ fill: none; stroke: #6B8FBF; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .green{ fill: none; stroke: #6F8F6A; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .red { fill: none; stroke: #B0563F; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .dot { fill: #3D3229; }
  </style>
  <text x="26" y="34" class="tb" font-size="16">Master Bus 的處理順序</text>
  <text x="26" y="55" class="ts" font-size="12.5">每一站都只做一點，合起來才成立</text>
  <text x="26" y="84" class="ts" font-size="12">母帶是「最後一次全域調整」；鏈越長，前一步的錯誤越難救。</text>
  <rect x="46" y="130" width="106" height="66" rx="8" fill="#FFFFFF" stroke="#6B8FBF" stroke-width="1.3"/>
  <text x="56" y="156" class="t" font-size="11" font-weight="700">參考檢查</text>
  <text x="56" y="176" class="ts" font-size="9" fill="#8C8078">先聽，不動手</text>
  <path d="M154.0 163.0 L157.5 163.0" fill="none" stroke="#8C8078" stroke-width="1.7" stroke-linecap="round"/><path d="M162.0 163.0 L157.4 165.0 L157.4 161.0 Z" fill="#8C8078"/>
  <rect x="164" y="130" width="106" height="66" rx="8" fill="#FFFFFF" stroke="#6B8FBF" stroke-width="1.3"/>
  <text x="174" y="156" class="t" font-size="11" font-weight="700">EQ</text>
  <text x="174" y="176" class="ts" font-size="9" fill="#8C8078">極輕微的整體平衡</text>
  <path d="M272.0 163.0 L275.5 163.0" fill="none" stroke="#8C8078" stroke-width="1.7" stroke-linecap="round"/><path d="M280.0 163.0 L275.4 165.0 L275.4 161.0 Z" fill="#8C8078"/>
  <rect x="282" y="130" width="106" height="66" rx="8" fill="#FFFFFF" stroke="#6B8FBF" stroke-width="1.3"/>
  <text x="292" y="156" class="t" font-size="11" font-weight="700">多頻段壓縮</text>
  <text x="292" y="176" class="ts" font-size="9" fill="#8C8078">可選</text>
  <path d="M390.0 163.0 L393.5 163.0" fill="none" stroke="#8C8078" stroke-width="1.7" stroke-linecap="round"/><path d="M398.0 163.0 L393.4 165.0 L393.4 161.0 Z" fill="#8C8078"/>
  <rect x="400" y="130" width="106" height="66" rx="8" fill="#FFFFFF" stroke="#6B8FBF" stroke-width="1.3"/>
  <text x="410" y="156" class="t" font-size="11" font-weight="700">限縮 Limiter</text>
  <text x="410" y="176" class="ts" font-size="9" fill="#8C8078">最後一道</text>
  <path d="M508.0 163.0 L511.5 163.0" fill="none" stroke="#8C8078" stroke-width="1.7" stroke-linecap="round"/><path d="M516.0 163.0 L511.4 165.0 L511.4 161.0 Z" fill="#8C8078"/>
  <rect x="518" y="130" width="106" height="66" rx="8" fill="#FFFFFF" stroke="#6B8FBF" stroke-width="1.3"/>
  <text x="528" y="156" class="t" font-size="11" font-weight="700">LUFS 檢查</text>
  <text x="528" y="176" class="ts" font-size="9" fill="#8C8078">對平台目標</text>
  <text x="26" y="236" class="ts" font-size="11.5">Master bus 不是「把聲音變好聽」的地方，是「確認整首一致」的地方。</text>
  <text x="26" y="262" class="ts" font-size="11" fill="#8C8078">若某一軌在總線上必須靠大量處理才站得住，問題在混音，不在母帶。</text>
  <rect x="46" y="296" width="180" height="60" rx="8" fill="#E4EBDC" stroke="#D9CFC4" stroke-width="1.3"/>
  <text x="58" y="318" class="t" font-size="13" font-weight="700">該自己做的</text>
  <text x="58" y="337" class="ts" font-size="11">單曲、EP、預算有限</text>
  <rect x="246" y="296" width="180" height="60" rx="8" fill="#F3E9DC" stroke="#D9CFC4" stroke-width="1.3"/>
  <text x="258" y="318" class="t" font-size="13" font-weight="700">該交給別人</text>
  <text x="258" y="337" class="ts" font-size="11">專輯、發行、需要第二雙耳朵</text>
  <rect x="446" y="296" width="180" height="60" rx="8" fill="#DEE8F3" stroke="#D9CFC4" stroke-width="1.3"/>
  <text x="458" y="318" class="t" font-size="13" font-weight="700">留 headroom</text>
  <text x="458" y="337" class="ts" font-size="11">交給母帶師前峰值 −6 dBFS</text>
</svg>
