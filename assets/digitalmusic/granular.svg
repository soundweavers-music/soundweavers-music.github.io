  <text x="26" y="34" class="tb" font-size="16">顆粒合成</text>
  <text x="26" y="55" class="ts" font-size="12.5">把聲音切成小片再重組</text>
  <text x="26" y="84" class="ts" font-size="12">顆粒合成把聲音切成幾十毫秒的小片，再以不同的密度與位置重組。</text>
