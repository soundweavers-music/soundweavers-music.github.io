<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 412" role="img" aria-label="混音常見問題：先猜這五個">
  <title>混音常見問題：先猜這五個</title>
  <rect width="660" height="412" fill="#FBF8F4"/>
  <style>
    .t   { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; }
    .tb  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; font-weight: 700; }
    .ts  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #8C8078; }
    .num { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #FFFFFF; font-weight: 700; font-size: 11px; }
    .ink { fill: none; stroke: #3D3229; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; }
    .thin{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; }
    .dash{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; stroke-dasharray: 4 5; }
    .lead{ fill: none; stroke: #8C8078; stroke-width: 1; }
    .acc { fill: none; stroke: #A67C52; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .blue{ fill: none; stroke: #6B8FBF; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .green{ fill: none; stroke: #6F8F6A; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .red { fill: none; stroke: #B0563F; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .dot { fill: #3D3229; }
  </style>
  <text x="26" y="34" class="tb" font-size="16">混音常見問題：先猜這五個</text>
  <text x="26" y="55" class="ts" font-size="12.5">九成的「聽起來不對」都在這幾項裡</text>
  <text x="150.0" y="92" class="t" font-size="11.5" font-weight="700" fill="#A67C52">可能原因</text>  <text x="395.0" y="92" class="t" font-size="11.5" font-weight="700" fill="#A67C52">先動哪裡</text>  <rect x="26" y="104" width="608" height="58" rx="4" fill="#F3E9DC" opacity="0.55"/>  <text x="34" y="126" class="t" font-size="11.5" font-weight="700">人聲不清楚</text>  <text x="150.0" y="124" class="ts" font-size="10" fill="#5D4E41">被中頻樂器蓋住</text>  <text x="395.0" y="124" class="ts" font-size="10" fill="#5D4E41">讓樂器讓位，不是把人聲推大</text>  <text x="34" y="184" class="t" font-size="11.5" font-weight="700">低頻糊</text>  <text x="150.0" y="182" class="ts" font-size="10" fill="#5D4E41">Kick 與 Bass 撞</text>  <text x="150.0" y="197" class="ts" font-size="10" fill="#5D4E41">在一起</text>  <text x="395.0" y="182" class="ts" font-size="10" fill="#5D4E41">分工：一高一低的角色</text>  <rect x="26" y="220" width="608" height="58" rx="4" fill="#F3E9DC" opacity="0.55"/>  <text x="34" y="242" class="t" font-size="11.5" font-weight="700">整體很吵</text>  <text x="150.0" y="240" class="ts" font-size="10" fill="#5D4E41">每軌都塞滿</text>  <text x="395.0" y="240" class="ts" font-size="10" fill="#5D4E41">先減，不要一直加</text>  <text x="34" y="300" class="t" font-size="11.5" font-weight="700">沒有立體感</text>  <text x="150.0" y="298" class="ts" font-size="10" fill="#5D4E41">全部擺中間</text>  <text x="395.0" y="298" class="ts" font-size="10" fill="#5D4E41">把配角往兩側擺</text>  <rect x="26" y="336" width="608" height="58" rx="4" fill="#F3E9DC" opacity="0.55"/>  <text x="34" y="358" class="t" font-size="11.5" font-weight="700">聽起來很遠</text>  <text x="150.0" y="356" class="ts" font-size="10" fill="#5D4E41">殘響太多</text>  <text x="395.0" y="356" class="ts" font-size="10" fill="#5D4E41">縮短 decay、加 pr</text>  <text x="395.0" y="371" class="ts" font-size="10" fill="#5D4E41">e-delay</text>
  <text x="26" y="394" class="ts" font-size="11">一次只改一個地方，改完 A/B 一次；同時改三個就不知道誰有效。</text>
</svg>
