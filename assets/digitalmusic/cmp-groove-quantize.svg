<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 296" role="img" aria-label="保留 Groove 還是完美量化">
  <title>保留 Groove 還是完美量化</title>
  <rect width="660" height="296" fill="#FBF8F4"/>
  <style>
    .t   { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; }
    .tb  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; font-weight: 700; }
    .ts  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #8C8078; }
    .num { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #FFFFFF; font-weight: 700; font-size: 11px; }
    .ink { fill: none; stroke: #3D3229; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; }
    .thin{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; }
    .dash{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; stroke-dasharray: 4 5; }
    .lead{ fill: none; stroke: #8C8078; stroke-width: 1; }
    .acc { fill: none; stroke: #A67C52; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .blue{ fill: none; stroke: #6B8FBF; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .green{ fill: none; stroke: #6F8F6A; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .red { fill: none; stroke: #B0563F; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .dot { fill: #3D3229; }
  </style>
  <text x="26" y="34" class="tb" font-size="16">保留 Groove 還是完美量化</text>
  <text x="26" y="55" class="ts" font-size="12.5">量化讓節奏整齊，也讓它變得沒有味道</text>
  <text x="150.0" y="92" class="t" font-size="11.5" font-weight="700" fill="#A67C52">聽起來</text>  <text x="395.0" y="92" class="t" font-size="11.5" font-weight="700" fill="#A67C52">什麼時候用</text>  <rect x="26" y="104" width="608" height="58" rx="4" fill="#F3E9DC" opacity="0.55"/>  <text x="34" y="126" class="t" font-size="11.5" font-weight="700">全量化</text>  <text x="150.0" y="124" class="ts" font-size="10" fill="#5D4E41">精準、機械</text>  <text x="395.0" y="124" class="ts" font-size="10" fill="#5D4E41">電子舞曲、需要整齊的段落</text>  <text x="34" y="184" class="t" font-size="11.5" font-weight="700">保留 Groove</text>  <text x="150.0" y="182" class="ts" font-size="10" fill="#5D4E41">有人味、微微搖擺</text>  <text x="395.0" y="182" class="ts" font-size="10" fill="#5D4E41">爵士、放克、真人演奏</text>  <rect x="26" y="220" width="608" height="58" rx="4" fill="#F3E9DC" opacity="0.55"/>  <text x="34" y="242" class="t" font-size="11.5" font-weight="700">只修明顯的</text>  <text x="150.0" y="240" class="ts" font-size="10" fill="#5D4E41">兩者之間</text>  <text x="395.0" y="240" class="ts" font-size="10" fill="#5D4E41">流行歌最常用的做法</text>
  <text x="26" y="278" class="ts" font-size="11">折衷法：先全量化，再把每個音的強度與時間「人為地」加回一點誤差。</text>
</svg>
