<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 346" role="img" aria-label="建立混音的順序：先把地基打好">
  <title>建立混音的順序：先把地基打好</title>
  <rect width="660" height="346" fill="#FBF8F4"/>
  <style>
    .t   { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; }
    .tb  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; font-weight: 700; }
    .ts  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #8C8078; }
    .num { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #FFFFFF; font-weight: 700; font-size: 11px; }
    .ink { fill: none; stroke: #3D3229; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; }
    .thin{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; }
    .dash{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; stroke-dasharray: 4 5; }
    .lead{ fill: none; stroke: #8C8078; stroke-width: 1; }
    .acc { fill: none; stroke: #A67C52; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .blue{ fill: none; stroke: #6B8FBF; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .green{ fill: none; stroke: #6F8F6A; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .red { fill: none; stroke: #B0563F; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .dot { fill: #3D3229; }
  </style>
  <text x="26" y="34" class="tb" font-size="16">建立混音的順序：先把地基打好</text>
  <text x="26" y="55" class="ts" font-size="12.5">順序錯了會一直在補救；照這個順序，每一步都只需要顧一件事</text>
  <circle cx="38.0" cy="110" r="10" fill="#A67C52"/>  <text x="38.0" y="114" text-anchor="middle" class="num">1</text>  <rect x="26.0" y="96" width="141.5" height="88" rx="9" fill="#F3E9DC" stroke="#D9CFC4" stroke-width="1.4"/>  <text x="36.0" y="140" class="t" font-size="12.5" font-weight="700">Fader 歸零</text>  <text x="36.0" y="158" class="ts" font-size="9.5" fill="#8C8078">全部推回 0，先聽原始</text>  <text x="36.0" y="173" class="ts" font-size="9.5" fill="#8C8078">平衡</text>  <path d="M169.5 140.0 L173.2 140.0" fill="none" stroke="#A67C52" stroke-width="1.7" stroke-linecap="round"/><path d="M179.5 140.0 L173.1 142.9 L173.1 137.1 Z" fill="#A67C52"/>  <circle cx="193.5" cy="110" r="10" fill="#A67C52"/>  <text x="193.5" y="114" text-anchor="middle" class="num">2</text>  <rect x="181.5" y="96" width="141.5" height="88" rx="9" fill="#F3E9DC" stroke="#D9CFC4" stroke-width="1.4"/>  <text x="191.5" y="140" class="t" font-size="12.5" font-weight="700">主唱定位</text>  <text x="191.5" y="158" class="ts" font-size="9.5" fill="#8C8078">以人聲為基準，決定整體</text>  <text x="191.5" y="173" class="ts" font-size="9.5" fill="#8C8078">音量</text>  <path d="M325.0 140.0 L328.7 140.0" fill="none" stroke="#A67C52" stroke-width="1.7" stroke-linecap="round"/><path d="M335.0 140.0 L328.6 142.9 L328.6 137.1 Z" fill="#A67C52"/>  <circle cx="349.0" cy="110" r="10" fill="#A67C52"/>  <text x="349.0" y="114" text-anchor="middle" class="num">3</text>  <rect x="337.0" y="96" width="141.5" height="88" rx="9" fill="#F3E9DC" stroke="#D9CFC4" stroke-width="1.4"/>  <text x="347.0" y="140" class="t" font-size="12.5" font-weight="700">節奏組</text>  <text x="347.0" y="158" class="ts" font-size="9.5" fill="#8C8078">Kick、Snare、</text>  <text x="347.0" y="173" class="ts" font-size="9.5" fill="#8C8078">Bass 對齊</text>  <path d="M480.5 140.0 L484.2 140.0" fill="none" stroke="#A67C52" stroke-width="1.7" stroke-linecap="round"/><path d="M490.5 140.0 L484.1 142.9 L484.1 137.1 Z" fill="#A67C52"/>  <circle cx="504.5" cy="110" r="10" fill="#A67C52"/>  <text x="504.5" y="114" text-anchor="middle" class="num">4</text>  <rect x="492.5" y="96" width="141.5" height="88" rx="9" fill="#F3E9DC" stroke="#D9CFC4" stroke-width="1.4"/>  <text x="502.5" y="140" class="t" font-size="12.5" font-weight="700">支撐樂器</text>  <text x="502.5" y="158" class="ts" font-size="9.5" fill="#8C8078">吉他、鍵盤、Pad 補</text>  <text x="502.5" y="173" class="ts" font-size="9.5" fill="#8C8078">空隙</text>  <circle cx="38.0" cy="232" r="10" fill="#A67C52"/>  <text x="38.0" y="236" text-anchor="middle" class="num">5</text>  <rect x="26.0" y="218" width="141.5" height="88" rx="9" fill="#F3E9DC" stroke="#D9CFC4" stroke-width="1.4"/>  <text x="36.0" y="262" class="t" font-size="12.5" font-weight="700">聲向</text>  <text x="36.0" y="280" class="ts" font-size="9.5" fill="#8C8078">擺左右，把頻率錯開</text>  <path d="M169.5 262.0 L173.2 262.0" fill="none" stroke="#A67C52" stroke-width="1.7" stroke-linecap="round"/><path d="M179.5 262.0 L173.1 264.9 L173.1 259.1 Z" fill="#A67C52"/>  <circle cx="193.5" cy="232" r="10" fill="#A67C52"/>  <text x="193.5" y="236" text-anchor="middle" class="num">6</text>  <rect x="181.5" y="218" width="141.5" height="88" rx="9" fill="#F3E9DC" stroke="#D9CFC4" stroke-width="1.4"/>  <text x="191.5" y="262" class="t" font-size="12.5" font-weight="700">動態與空間</text>  <text x="191.5" y="280" class="ts" font-size="9.5" fill="#8C8078">最後才加壓縮與殘響</text>
  <text x="26" y="328" class="ts" font-size="11">順序不是鐵律，但「先平衡、後處理」幾乎不會錯。</text>
</svg>
