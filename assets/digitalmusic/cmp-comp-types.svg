<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 354" role="img" aria-label="四種壓縮器的個性">
  <title>四種壓縮器的個性</title>
  <rect width="660" height="354" fill="#FBF8F4"/>
  <style>
    .t   { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; }
    .tb  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; font-weight: 700; }
    .ts  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #8C8078; }
    .num { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #FFFFFF; font-weight: 700; font-size: 11px; }
    .ink { fill: none; stroke: #3D3229; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; }
    .thin{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; }
    .dash{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; stroke-dasharray: 4 5; }
    .lead{ fill: none; stroke: #8C8078; stroke-width: 1; }
    .acc { fill: none; stroke: #A67C52; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .blue{ fill: none; stroke: #6B8FBF; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .green{ fill: none; stroke: #6F8F6A; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .red { fill: none; stroke: #B0563F; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .dot { fill: #3D3229; }
  </style>
  <text x="26" y="34" class="tb" font-size="16">四種壓縮器的個性</text>
  <text x="26" y="55" class="ts" font-size="12.5">同一組參數，換一台壓縮器，聲音就換一個樣子</text>
  <text x="150.0" y="92" class="t" font-size="11.5" font-weight="700" fill="#A67C52">個性</text>  <text x="395.0" y="92" class="t" font-size="11.5" font-weight="700" fill="#A67C52">常用在</text>  <rect x="26" y="104" width="608" height="58" rx="4" fill="#F3E9DC" opacity="0.55"/>  <text x="34" y="126" class="t" font-size="11.5" font-weight="700">VCA</text>  <text x="150.0" y="124" class="ts" font-size="10" fill="#5D4E41">乾淨、快、可控</text>  <text x="395.0" y="124" class="ts" font-size="10" fill="#5D4E41">鼓組、匯流排</text>  <text x="34" y="184" class="t" font-size="11.5" font-weight="700">FET</text>  <text x="150.0" y="182" class="ts" font-size="10" fill="#5D4E41">有攻擊性、顆粒明顯</text>  <text x="395.0" y="182" class="ts" font-size="10" fill="#5D4E41">搖滾人聲、房間鼓</text>  <rect x="26" y="220" width="608" height="58" rx="4" fill="#F3E9DC" opacity="0.55"/>  <text x="34" y="242" class="t" font-size="11.5" font-weight="700">Optical</text>  <text x="150.0" y="240" class="ts" font-size="10" fill="#5D4E41">慢、圓、有音樂性</text>  <text x="395.0" y="240" class="ts" font-size="10" fill="#5D4E41">人聲、貝斯</text>  <text x="34" y="300" class="t" font-size="11.5" font-weight="700">Vari-Mu</text>  <text x="150.0" y="298" class="ts" font-size="10" fill="#5D4E41">柔和、厚、黏</text>  <text x="395.0" y="298" class="ts" font-size="10" fill="#5D4E41">母帶、匯流排</text>
  <text x="26" y="336" class="ts" font-size="11">先選個性，再調參數；個性不對，怎麼調都像在硬拉。</text>
</svg>
