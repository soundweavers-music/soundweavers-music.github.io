<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 350" role="img" aria-label="十、實戰組合：多個調變效果的疊加使用">
  <title>十、實戰組合：多個調變效果的疊加使用</title>
  <rect width="660" height="350" fill="#FBF8F4"/>
  <style>
    .t   { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; }
    .tb  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; font-weight: 700; }
    .ts  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #8C8078; }
    .num { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #FFFFFF; font-weight: 700; font-size: 11px; }
    .ink { fill: none; stroke: #3D3229; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; }
    .thin{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; }
    .dash{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; stroke-dasharray: 4 5; }
    .lead{ fill: none; stroke: #8C8078; stroke-width: 1; }
    .acc { fill: none; stroke: #A67C52; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .blue{ fill: none; stroke: #6B8FBF; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .green{ fill: none; stroke: #6F8F6A; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .red { fill: none; stroke: #B0563F; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .dot { fill: #3D3229; }
  </style>
  <text x="26" y="34" class="tb" font-size="16">十、實戰組合：多個調變效果的疊加使用</text>
  <text x="26" y="55" class="ts" font-size="12.5">把這一節的重點排在一起</text>
  <rect x="26.0" y="96" width="295.0" height="96" rx="9" fill="#F3E9DC" stroke="#D9CFC4" stroke-width="1.4"/>  <circle cx="40.0" cy="116" r="10" fill="#A67C52"/>  <text x="40.0" y="120" text-anchor="middle" class="num">1</text>  <text x="60.0" y="121" class="t" font-size="12" font-weight="700">總量控制</text>  <text x="40.0" y="144" class="ts" font-size="9.5" fill="#8C8078">多個調變效果的總Mix應控制在</text>  <text x="40.0" y="160" class="ts" font-size="9.5" fill="#8C8078">合理範圍內，不要讓每個效果都開</text>  <text x="40.0" y="176" class="ts" font-size="9.5" fill="#8C8078">到50%以上</text>  <rect x="339.0" y="96" width="295.0" height="96" rx="9" fill="#F3E9DC" stroke="#D9CFC4" stroke-width="1.4"/>  <circle cx="353.0" cy="116" r="10" fill="#A67C52"/>  <text x="353.0" y="120" text-anchor="middle" class="num">2</text>  <text x="373.0" y="121" class="t" font-size="12" font-weight="700">速率錯開</text>  <text x="353.0" y="144" class="ts" font-size="9.5" fill="#8C8078">若同時使用Chorus+Pha</text>  <text x="353.0" y="160" class="ts" font-size="9.5" fill="#8C8078">ser，將Rate設定為不同的</text>  <text x="353.0" y="176" class="ts" font-size="9.5" fill="#8C8078">速度（如Chorus0.5H</text>  <rect x="26.0" y="206" width="295.0" height="96" rx="9" fill="#F3E9DC" stroke="#D9CFC4" stroke-width="1.4"/>  <circle cx="40.0" cy="226" r="10" fill="#A67C52"/>  <text x="40.0" y="230" text-anchor="middle" class="num">3</text>  <text x="60.0" y="231" class="t" font-size="12" font-weight="700">頻譜分工</text>  <text x="40.0" y="254" class="ts" font-size="9.5" fill="#8C8078">讓不同調變效果在不同頻率範圍作</text>  <text x="40.0" y="270" class="ts" font-size="9.5" fill="#8C8078">用——例如只在高頻使用Phas</text>  <text x="40.0" y="286" class="ts" font-size="9.5" fill="#8C8078">er，中低頻使用Chorus</text>  <rect x="339.0" y="206" width="295.0" height="96" rx="9" fill="#F3E9DC" stroke="#D9CFC4" stroke-width="1.4"/>  <circle cx="353.0" cy="226" r="10" fill="#A67C52"/>  <text x="353.0" y="230" text-anchor="middle" class="num">4</text>  <text x="373.0" y="231" class="t" font-size="12" font-weight="700">分層而非堆疊</text>  <text x="353.0" y="254" class="ts" font-size="9.5" fill="#8C8078">更好的方式是分別對不同樂器使用</text>  <text x="353.0" y="270" class="ts" font-size="9.5" fill="#8C8078">單一調變效果，而非在同一音軌上</text>  <text x="353.0" y="286" class="ts" font-size="9.5" fill="#8C8078">堆疊多個效果</text>
</svg>
