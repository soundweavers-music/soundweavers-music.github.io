  <rect x="60" y="272" width="250" height="52" rx="8" fill="#F3E9DC" stroke="#D9CFC4" stroke-width="1.3"/>
  <text x="72" y="294" class="t" font-size="13" font-weight="700">24-bit 混音 → 16-bit 交付</text>
  <text x="72" y="313" class="ts" font-size="11">只在最後一次輸出時做</text>
  <rect x="330" y="272" width="270" height="52" rx="8" fill="#DEE8F3" stroke="#D9CFC4" stroke-width="1.3"/>
  <text x="342" y="294" class="t" font-size="13" font-weight="700">32-bit float 內部處理</text>
  <text x="342" y="313" class="ts" font-size="11">不需要也不會壞，但別重複加</text>
  <text x="26" y="362" class="ts" font-size="11">Dither 只能加一次，且要在降位元深度的那一步；加兩次等於多一層雜訊。</text>
</svg>
