  <text x="88" y="126" class="ts" font-size="9.5" fill="#B0563F">60 Hz 嗡嗡聲</text>
  <circle cx="119.2" cy="208.8" r="4" fill="#B0563F"/>
  <path d="M178.0 100 L178.0 260" class="thin" stroke-dasharray="4 4"/>
  <text x="182.89999999999998" y="118" class="ts" font-size="9.5" fill="#6F8F6A">高通起點</text>
  <rect x="60" y="282" width="250" height="50" rx="8" fill="#F4DFD7" stroke="#D9CFC4" stroke-width="1.3"/>
  <text x="72" y="304" class="t" font-size="13" font-weight="700">先找來源</text>
  <text x="72" y="323" class="ts" font-size="11">冷氣、變壓器、USB 供電</text>
  <rect x="340" y="282" width="260" height="50" rx="8" fill="#E4EBDC" stroke="#D9CFC4" stroke-width="1.3"/>
  <text x="352" y="304" class="t" font-size="13" font-weight="700">再考慮處理</text>
  <text x="352" y="323" class="ts" font-size="11">高通＋降噪，但別把細節一起吃掉</text>
  <text x="26" y="342" class="ts" font-size="11">底噪是錄進來就固定的；後面放大，它也一起變大。</text>
</svg>
