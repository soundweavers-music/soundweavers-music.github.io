<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 354" role="img" aria-label="手動調音與自動修正">
  <title>手動調音與自動修正</title>
  <rect width="660" height="354" fill="#FBF8F4"/>
  <style>
    .t   { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; }
    .tb  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; font-weight: 700; }
    .ts  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #8C8078; }
    .num { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #FFFFFF; font-weight: 700; font-size: 11px; }
    .ink { fill: none; stroke: #3D3229; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; }
    .thin{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; }
    .dash{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; stroke-dasharray: 4 5; }
    .lead{ fill: none; stroke: #8C8078; stroke-width: 1; }
    .acc { fill: none; stroke: #A67C52; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .blue{ fill: none; stroke: #6B8FBF; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .green{ fill: none; stroke: #6F8F6A; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .red { fill: none; stroke: #B0563F; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .dot { fill: #3D3229; }
  </style>
  <text x="26" y="34" class="tb" font-size="16">手動調音與自動修正</text>
  <text x="26" y="55" class="ts" font-size="12.5">一個保留細節，一個追求速度</text>
  <text x="150.0" y="92" class="t" font-size="11.5" font-weight="700" fill="#A67C52">手動</text>  <text x="395.0" y="92" class="t" font-size="11.5" font-weight="700" fill="#A67C52">自動</text>  <rect x="26" y="104" width="608" height="58" rx="4" fill="#F3E9DC" opacity="0.55"/>  <text x="34" y="126" class="t" font-size="11.5" font-weight="700">精度</text>  <text x="150.0" y="124" class="ts" font-size="10" fill="#5D4E41">可只修一個音</text>  <text x="395.0" y="124" class="ts" font-size="10" fill="#5D4E41">整段統一</text>  <text x="34" y="184" class="t" font-size="11.5" font-weight="700">時間</text>  <text x="150.0" y="182" class="ts" font-size="10" fill="#5D4E41">慢，但要修的地方通常不多</text>  <text x="395.0" y="182" class="ts" font-size="10" fill="#5D4E41">快，適合整首</text>  <rect x="26" y="220" width="608" height="58" rx="4" fill="#F3E9DC" opacity="0.55"/>  <text x="34" y="242" class="t" font-size="11.5" font-weight="700">自然度</text>  <text x="150.0" y="240" class="ts" font-size="10" fill="#5D4E41">高（可保留抖音）</text>  <text x="395.0" y="240" class="ts" font-size="10" fill="#5D4E41">低（容易變成 T-Pain</text>  <text x="395.0" y="255" class="ts" font-size="10" fill="#5D4E41">）</text>  <text x="34" y="300" class="t" font-size="11.5" font-weight="700">適用</text>  <text x="150.0" y="298" class="ts" font-size="10" fill="#5D4E41">主唱、需要細修</text>  <text x="395.0" y="298" class="ts" font-size="10" fill="#5D4E41">和聲、背景、創意效果</text>
  <text x="26" y="336" class="ts" font-size="11">主唱用手動、和聲用自動，是多數流行製作的實際分工。</text>
</svg>
