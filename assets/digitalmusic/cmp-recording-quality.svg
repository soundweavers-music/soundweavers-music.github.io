<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 354" role="img" aria-label="「好錄音」與「頂級錄音」差在哪">
  <title>「好錄音」與「頂級錄音」差在哪</title>
  <rect width="660" height="354" fill="#FBF8F4"/>
  <style>
    .t   { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; }
    .tb  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; font-weight: 700; }
    .ts  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #8C8078; }
    .num { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #FFFFFF; font-weight: 700; font-size: 11px; }
    .ink { fill: none; stroke: #3D3229; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; }
    .thin{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; }
    .dash{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; stroke-dasharray: 4 5; }
    .lead{ fill: none; stroke: #8C8078; stroke-width: 1; }
    .acc { fill: none; stroke: #A67C52; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .blue{ fill: none; stroke: #6B8FBF; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .green{ fill: none; stroke: #6F8F6A; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .red { fill: none; stroke: #B0563F; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .dot { fill: #3D3229; }
  </style>
  <text x="26" y="34" class="tb" font-size="16">「好錄音」與「頂級錄音」差在哪</text>
  <text x="26" y="55" class="ts" font-size="12.5">差的不是器材等級，是那些事後修不回來的東西</text>
  <text x="150.0" y="92" class="t" font-size="11.5" font-weight="700" fill="#A67C52">好錄音</text>  <text x="395.0" y="92" class="t" font-size="11.5" font-weight="700" fill="#A67C52">頂級錄音</text>  <rect x="26" y="104" width="608" height="58" rx="4" fill="#F3E9DC" opacity="0.55"/>  <text x="34" y="126" class="t" font-size="11.5" font-weight="700">空間</text>  <text x="150.0" y="124" class="ts" font-size="10" fill="#5D4E41">安靜、沒有明顯反射</text>  <text x="395.0" y="124" class="ts" font-size="10" fill="#5D4E41">連殘響都選過</text>  <text x="34" y="184" class="t" font-size="11.5" font-weight="700">動態</text>  <text x="150.0" y="182" class="ts" font-size="10" fill="#5D4E41">沒有爆、沒有底噪</text>  <text x="395.0" y="182" class="ts" font-size="10" fill="#5D4E41">保留了完整的表情</text>  <rect x="26" y="220" width="608" height="58" rx="4" fill="#F3E9DC" opacity="0.55"/>  <text x="34" y="242" class="t" font-size="11.5" font-weight="700">音準與節奏</text>  <text x="150.0" y="240" class="ts" font-size="10" fill="#5D4E41">事後修得回來</text>  <text x="395.0" y="240" class="ts" font-size="10" fill="#5D4E41">一開始就對</text>  <text x="34" y="300" class="t" font-size="11.5" font-weight="700">音色</text>  <text x="150.0" y="298" class="ts" font-size="10" fill="#5D4E41">清楚</text>  <text x="395.0" y="298" class="ts" font-size="10" fill="#5D4E41">一聽就知道是什麼樂器</text>
  <text x="26" y="336" class="ts" font-size="11">前三項修不回來，後兩項可以；所以錄音時把力氣花在前三項。</text>
</svg>
