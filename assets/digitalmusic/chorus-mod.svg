  <text x="26" y="34" class="tb" font-size="16">Chorus 在做什麼</text>
  <text x="26" y="55" class="ts" font-size="12.5">把延遲時間緩慢地推來推去</text>
  <text x="26" y="84" class="ts" font-size="12">Chorus 是把延遲時間緩緩地推來推去，讓兩個聲音永遠差一點點。</text>
