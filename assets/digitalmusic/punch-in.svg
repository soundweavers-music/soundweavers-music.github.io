<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 340" role="img" aria-label="Punch In／Out">
  <title>Punch In／Out</title>
  <rect width="660" height="340" fill="#FBF8F4"/>
  <style>
    .t   { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; }
    .tb  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; font-weight: 700; }
    .ts  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #8C8078; }
    .num { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #FFFFFF; font-weight: 700; font-size: 11px; }
    .ink { fill: none; stroke: #3D3229; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; }
    .thin{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; }
    .dash{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; stroke-dasharray: 4 5; }
    .lead{ fill: none; stroke: #8C8078; stroke-width: 1; }
    .acc { fill: none; stroke: #A67C52; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .blue{ fill: none; stroke: #6B8FBF; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .green{ fill: none; stroke: #6F8F6A; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .red { fill: none; stroke: #B0563F; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .dot { fill: #3D3229; }
  </style>
  <text x="26" y="34" class="tb" font-size="16">Punch In／Out</text>
  <text x="26" y="55" class="ts" font-size="12.5">時間軸上開一個窗口重錄</text>
  <text x="26" y="84" class="ts" font-size="12">Punch In/Out 就是在時間軸上開一個窗口，只重錄那一段。</text>
  <text x="62" y="144" class="ts" font-size="9.5" text-anchor="end" fill="#8C8078">原始 Take</text>
  <rect x="70" y="118" width="520" height="44" rx="4" fill="#FFFFFF" stroke="#D9CFC4" stroke-width="1.4"/>
  <text x="62" y="214" class="ts" font-size="9.5" text-anchor="end" fill="#8C8078">Punch 錄音</text>
  <rect x="70" y="188" width="520" height="44" rx="4" fill="#FFFFFF" stroke="#D9CFC4" stroke-width="1.4"/>
  <rect x="252.0" y="118" width="156.0" height="44" fill="#B0563F" opacity="0.18"/>
  <rect x="252.0" y="188" width="156.0" height="44" fill="#6F8F6A" opacity="0.25"/>
  <path d="M252.0 108 L252.0 244" class="red" stroke-dasharray="4 4"/>
  <text x="252.0" y="102" class="ts" font-size="9.5" text-anchor="middle" fill="#B0563F">In</text>
  <path d="M408.0 108 L408.0 244" class="red" stroke-dasharray="4 4"/>
  <text x="408.0" y="102" class="ts" font-size="9.5" text-anchor="middle" fill="#B0563F">Out</text>
  <text x="330.0" y="258" class="ts" font-size="10" text-anchor="middle">只這一段被新錄音取代，前後保持原樣</text>
  <text x="26" y="300" class="ts" font-size="11">錄之前先留兩小節前後緩衝，剪接點比較好處理。</text>
  <text x="26" y="322" class="ts" font-size="11" fill="#8C8078">Punch 進去的瞬間要對準拍點，否則會聽到一個接縫。</text>
</svg>
