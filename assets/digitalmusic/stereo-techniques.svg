<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 420" role="img" aria-label="四種立體聲收音">
  <title>四種立體聲收音</title>
  <rect width="660" height="420" fill="#FBF8F4"/>
  <style>
    .t   { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; }
    .tb  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; font-weight: 700; }
    .ts  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #8C8078; }
    .num { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #FFFFFF; font-weight: 700; font-size: 11px; }
    .ink { fill: none; stroke: #3D3229; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; }
    .thin{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; }
    .dash{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; stroke-dasharray: 4 5; }
    .lead{ fill: none; stroke: #8C8078; stroke-width: 1; }
    .acc { fill: none; stroke: #A67C52; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .blue{ fill: none; stroke: #6B8FBF; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .green{ fill: none; stroke: #6F8F6A; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .red { fill: none; stroke: #B0563F; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .dot { fill: #3D3229; }
  </style>
  <text x="26" y="34" class="tb" font-size="16">四種立體聲收音</text>
  <text x="26" y="55" class="ts" font-size="12.5">AB、XY、ORTF、MS 各自的時間差與音量差</text>
  <text x="26" y="84" class="ts" font-size="12">同一組樂器，四種擺法＝四種空間感；差別在「時間差」與「音量差」。</text>
  <rect x="40" y="104" width="280" height="118" rx="8" fill="#FFFFFF" stroke="#6B8FBF" stroke-width="1.5"/>
  <text x="54" y="130" class="t" font-size="15" font-weight="700" fill="#6B8FBF">AB</text>
  <text x="54" y="152" class="ts" font-size="10.5">兩支全指向、間距 40–80 cm</text>
  <text x="54" y="172" class="ts" font-size="10.5" fill="#8C8078">時間差為主</text>
  <circle cx="250" cy="196" r="5" fill="#6B8FBF"/>
  <circle cx="302" cy="196" r="5" fill="#6B8FBF"/>
  <path d="M255 196 L297 196" class="thin" stroke-dasharray="3 3"/>
  <rect x="340" y="104" width="280" height="118" rx="8" fill="#FFFFFF" stroke="#A67C52" stroke-width="1.5"/>
  <text x="354" y="130" class="t" font-size="15" font-weight="700" fill="#A67C52">XY</text>
  <text x="354" y="152" class="ts" font-size="10.5">兩支心形、90° 交叉同點</text>
  <text x="354" y="172" class="ts" font-size="10.5" fill="#8C8078">音量差為主，單聲道相容</text>
  <circle cx="572" cy="196" r="5" fill="#A67C52"/>
  <circle cx="580" cy="196" r="5" fill="#A67C52"/>
  <path d="M572 196 l-14 -10 M572 196 l-14 10" class="thin"/>
  <path d="M580 196 l14 -10 M580 196 l14 10" class="thin" stroke-dasharray="3 3"/>
  <rect x="40" y="244" width="280" height="118" rx="8" fill="#FFFFFF" stroke="#6F8F6A" stroke-width="1.5"/>
  <text x="54" y="270" class="t" font-size="15" font-weight="700" fill="#6F8F6A">ORTF</text>
  <text x="54" y="292" class="ts" font-size="10.5">兩支心形、17 cm、110°</text>
  <text x="54" y="312" class="ts" font-size="10.5" fill="#8C8078">時間差＋音量差</text>
  <circle cx="267" cy="332" r="5" fill="#6F8F6A"/>
  <circle cx="285" cy="340" r="5" fill="#6F8F6A"/>
  <path d="M267 332 l-12 -12" class="thin"/>
  <path d="M285 340 l12 12" class="thin" stroke-dasharray="3 3"/>
  <rect x="340" y="244" width="280" height="118" rx="8" fill="#FFFFFF" stroke="#5D4E41" stroke-width="1.5"/>
  <text x="354" y="270" class="t" font-size="15" font-weight="700" fill="#5D4E41">MS</text>
  <text x="354" y="292" class="ts" font-size="10.5">一支中置＋一支雙向</text>
  <text x="354" y="312" class="ts" font-size="10.5" fill="#8C8078">M/S 比例決定寬度</text>
  <circle cx="576" cy="326" r="5" fill="#5D4E41"/>
  <circle cx="576" cy="346" r="5" fill="#6B8FBF"/>
  <path d="M560 326 L592 326" class="thin"/>
  <path d="M576 346 l0 0" class="thin"/>
  <text x="26" y="380" class="ts" font-size="11.5">3:1 規則：第二支麥克風的距離，至少是第一支到音源距離的三倍。</text>
  <text x="26" y="402" class="ts" font-size="11">單聲道相容性：把左右相加不會讓樂器突然消失，才算擺得安全。</text>
</svg>
