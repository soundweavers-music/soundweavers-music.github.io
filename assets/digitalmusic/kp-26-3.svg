<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 350" role="img" aria-label="主歌到副歌的漸強 Build-Up">
  <title>主歌到副歌的漸強 Build-Up</title>
  <rect width="660" height="350" fill="#FBF8F4"/>
  <style>
    .t   { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; }
    .tb  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; font-weight: 700; }
    .ts  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #8C8078; }
    .num { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #FFFFFF; font-weight: 700; font-size: 11px; }
    .ink { fill: none; stroke: #3D3229; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; }
    .thin{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; }
    .dash{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; stroke-dasharray: 4 5; }
    .lead{ fill: none; stroke: #8C8078; stroke-width: 1; }
    .acc { fill: none; stroke: #A67C52; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .blue{ fill: none; stroke: #6B8FBF; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .green{ fill: none; stroke: #6F8F6A; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .red { fill: none; stroke: #B0563F; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .dot { fill: #3D3229; }
  </style>
  <text x="26" y="34" class="tb" font-size="16">主歌到副歌的漸強 Build-Up</text>
  <text x="26" y="55" class="ts" font-size="12.5">把這一節的重點排在一起</text>
  <rect x="26.0" y="96" width="295.0" height="96" rx="9" fill="#F3E9DC" stroke="#D9CFC4" stroke-width="1.4"/>  <circle cx="40.0" cy="116" r="10" fill="#A67C52"/>  <text x="40.0" y="120" text-anchor="middle" class="num">1</text>  <text x="60.0" y="121" class="t" font-size="12" font-weight="700">主歌前半段</text>  <text x="40.0" y="144" class="ts" font-size="9.5" fill="#8C8078">只有人聲、鋼琴／木吉他、Bas</text>  <text x="40.0" y="160" class="ts" font-size="9.5" fill="#8C8078">s，音量維持在較低水平</text>  <rect x="339.0" y="96" width="295.0" height="96" rx="9" fill="#F3E9DC" stroke="#D9CFC4" stroke-width="1.4"/>  <circle cx="353.0" cy="116" r="10" fill="#A67C52"/>  <text x="353.0" y="120" text-anchor="middle" class="num">2</text>  <text x="373.0" y="121" class="t" font-size="12" font-weight="700">主歌後半段</text>  <text x="353.0" y="144" class="ts" font-size="9.5" fill="#8C8078">鼓組逐漸加入，Hi-Hat和S</text>  <text x="353.0" y="160" class="ts" font-size="9.5" fill="#8C8078">nare開始提升音量，Bass</text>  <text x="353.0" y="176" class="ts" font-size="9.5" fill="#8C8078">變得更有存在感</text>  <rect x="26.0" y="206" width="295.0" height="96" rx="9" fill="#F3E9DC" stroke="#D9CFC4" stroke-width="1.4"/>  <circle cx="40.0" cy="226" r="10" fill="#A67C52"/>  <text x="40.0" y="230" text-anchor="middle" class="num">3</text>  <text x="60.0" y="231" class="t" font-size="12" font-weight="700">Pre-Chorus</text>  <text x="40.0" y="254" class="ts" font-size="9.5" fill="#8C8078">所有樂器逐漸提升2-3dB，P</text>  <text x="40.0" y="270" class="ts" font-size="9.5" fill="#8C8078">ad/Synth的濾波器慢慢打</text>  <text x="40.0" y="286" class="ts" font-size="9.5" fill="#8C8078">開</text>  <rect x="339.0" y="206" width="295.0" height="96" rx="9" fill="#F3E9DC" stroke="#D9CFC4" stroke-width="1.4"/>  <circle cx="353.0" cy="226" r="10" fill="#A67C52"/>  <text x="353.0" y="230" text-anchor="middle" class="num">4</text>  <text x="373.0" y="231" class="t" font-size="12" font-weight="700">副歌Drop點</text>  <text x="353.0" y="254" class="ts" font-size="9.5" fill="#8C8078">全部樂器達到最大音量，Cras</text>  <text x="353.0" y="270" class="ts" font-size="9.5" fill="#8C8078">hCymbal加入，Rever</text>  <text x="353.0" y="286" class="ts" font-size="9.5" fill="#8C8078">b變大</text>
</svg>
