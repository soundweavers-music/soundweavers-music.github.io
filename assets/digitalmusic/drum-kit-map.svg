<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400" role="img" aria-label="鼓組的麥克風地圖">
  <title>鼓組的麥克風地圖</title>
  <rect width="660" height="400" fill="#FBF8F4"/>
  <style>
    .t   { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; }
    .tb  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; font-weight: 700; }
    .ts  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #8C8078; }
    .num { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #FFFFFF; font-weight: 700; font-size: 11px; }
    .ink { fill: none; stroke: #3D3229; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; }
    .thin{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; }
    .dash{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; stroke-dasharray: 4 5; }
    .lead{ fill: none; stroke: #8C8078; stroke-width: 1; }
    .acc { fill: none; stroke: #A67C52; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .blue{ fill: none; stroke: #6B8FBF; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .green{ fill: none; stroke: #6F8F6A; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .red { fill: none; stroke: #B0563F; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .dot { fill: #3D3229; }
  </style>
  <text x="26" y="34" class="tb" font-size="16">鼓組的麥克風地圖</text>
  <text x="26" y="55" class="ts" font-size="12.5">先有輪廓，再補細節</text>
  <text x="26" y="84" class="ts" font-size="12">鼓組收音的麥克風位置：先顧好 kick、snare 與 overheads，其餘再補。</text>
  <rect x="120" y="104" width="420" height="210" rx="6" fill="#FFFFFF" stroke="#D9CFC4" stroke-width="1.4"/>
  <circle cx="250" cy="250" r="16" fill="#A67C52" stroke="#A67C52" stroke-width="1.4" opacity="0.25"/>
  <text x="250" y="280" class="ts" font-size="9" text-anchor="middle">Kick</text>
  <text x="250" y="292" class="ts" font-size="8" text-anchor="middle" fill="#8C8078">in / out</text>
  <circle cx="320" cy="200" r="16" fill="#6F8F6A" stroke="#6F8F6A" stroke-width="1.4" opacity="0.25"/>
  <text x="320" y="230" class="ts" font-size="9" text-anchor="middle">Snare</text>
  <text x="320" y="242" class="ts" font-size="8" text-anchor="middle" fill="#8C8078">top + bottom</text>
  <circle cx="400" cy="180" r="16" fill="#6B8FBF" stroke="#6B8FBF" stroke-width="1.4" opacity="0.25"/>
  <text x="400" y="210" class="ts" font-size="9" text-anchor="middle">Hi-Hat</text>
  <text x="400" y="222" class="ts" font-size="8" text-anchor="middle" fill="#8C8078">邊緣上方</text>
  <circle cx="300" cy="150" r="16" fill="#5D4E41" stroke="#5D4E41" stroke-width="1.4" opacity="0.25"/>
  <text x="300" y="180" class="ts" font-size="9" text-anchor="middle">Tom 1</text>
  <circle cx="370" cy="150" r="16" fill="#5D4E41" stroke="#5D4E41" stroke-width="1.4" opacity="0.25"/>
  <text x="370" y="180" class="ts" font-size="9" text-anchor="middle">Tom 2</text>
  <circle cx="430" cy="240" r="16" fill="#5D4E41" stroke="#5D4E41" stroke-width="1.4" opacity="0.25"/>
  <text x="430" y="270" class="ts" font-size="9" text-anchor="middle">Floor Tom</text>
  <path d="M180 130 L480 130" class="acc" stroke-dasharray="4 4"/>
  <text x="180" y="122" class="ts" font-size="9.5" fill="#A67C52">Overheads（XY 或 AB）</text>
  <circle cx="150" cy="180" r="7" fill="#6B8FBF"/>
  <text x="150" y="164" class="ts" font-size="9" text-anchor="middle" fill="#6B8FBF">Room</text>
  <text x="26" y="344" class="ts" font-size="11">每一支額外的麥克風都會帶來相位問題；先用四支能聽，再加。</text>
  <text x="26" y="382" class="ts" font-size="11" fill="#8C8078">Overheads 決定鼓組的整體聲音，close mic 只是補細節。</text>
</svg>
