<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 460" role="img" aria-label="諧波激發器：不加音量也能增加存在感">
  <title>諧波激發器：不加音量也能增加存在感</title>
  <rect width="660" height="460" fill="#FBF8F4"/>
  <style>
    .t   { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; }
    .tb  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; font-weight: 700; }
    .ts  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #8C8078; }
    .num { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #FFFFFF; font-weight: 700; font-size: 11px; }
    .ink { fill: none; stroke: #3D3229; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; }
    .thin{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; }
    .dash{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; stroke-dasharray: 4 5; }
    .lead{ fill: none; stroke: #8C8078; stroke-width: 1; }
    .acc { fill: none; stroke: #A67C52; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .blue{ fill: none; stroke: #6B8FBF; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .green{ fill: none; stroke: #6F8F6A; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .red { fill: none; stroke: #B0563F; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .dot { fill: #3D3229; }
  </style>
  <text x="26" y="34" class="tb" font-size="16">諧波激發器：不加音量也能增加存在感</text>
  <text x="26" y="55" class="ts" font-size="12.5">把這一節的重點排在一起</text>
  <rect x="26.0" y="96" width="295.0" height="96" rx="9" fill="#F3E9DC" stroke="#D9CFC4" stroke-width="1.4"/>  <circle cx="40.0" cy="116" r="10" fill="#A67C52"/>  <text x="40.0" y="120" text-anchor="middle" class="num">1</text>  <text x="60.0" y="121" class="t" font-size="12" font-weight="700">主唱</text>  <text x="40.0" y="144" class="ts" font-size="9.5" fill="#8C8078">以2-5kHz為中心，加入微量</text>  <text x="40.0" y="160" class="ts" font-size="9.5" fill="#8C8078">諧波。</text>  <rect x="339.0" y="96" width="295.0" height="96" rx="9" fill="#F3E9DC" stroke="#D9CFC4" stroke-width="1.4"/>  <circle cx="353.0" cy="116" r="10" fill="#A67C52"/>  <text x="353.0" y="120" text-anchor="middle" class="num">2</text>  <text x="373.0" y="121" class="t" font-size="12" font-weight="700">立體聲混音</text>  <text x="353.0" y="144" class="ts" font-size="9.5" fill="#8C8078">6-12kHz的Exciter</text>  <text x="353.0" y="160" class="ts" font-size="9.5" fill="#8C8078">，讓混音頂端的空氣感出現，鈸的</text>  <text x="353.0" y="176" class="ts" font-size="9.5" fill="#8C8078">空氣音、房間殘響的尾韻變得更</text>  <rect x="26.0" y="206" width="295.0" height="96" rx="9" fill="#F3E9DC" stroke="#D9CFC4" stroke-width="1.4"/>  <circle cx="40.0" cy="226" r="10" fill="#A67C52"/>  <text x="40.0" y="230" text-anchor="middle" class="num">3</text>  <text x="60.0" y="231" class="t" font-size="12" font-weight="700">整體音場</text>  <text x="40.0" y="254" class="ts" font-size="9.5" fill="#8C8078">給20-100Hz的低頻Exc</text>  <text x="40.0" y="270" class="ts" font-size="9.5" fill="#8C8078">iter（類似SubHarmo</text>  <text x="40.0" y="286" class="ts" font-size="9.5" fill="#8C8078">nicSynthesizer</text>  <rect x="339.0" y="206" width="295.0" height="96" rx="9" fill="#F3E9DC" stroke="#D9CFC4" stroke-width="1.4"/>  <circle cx="353.0" cy="226" r="10" fill="#A67C52"/>  <text x="353.0" y="230" text-anchor="middle" class="num">4</text>  <text x="373.0" y="231" class="t" font-size="12" font-weight="700">WavesRBass/Ap</text>  <text x="353.0" y="254" class="ts" font-size="9.5" fill="#8C8078">—經典的低頻與高頻激發。</text>  <rect x="26.0" y="316" width="295.0" height="96" rx="9" fill="#F3E9DC" stroke="#D9CFC4" stroke-width="1.4"/>  <circle cx="40.0" cy="336" r="10" fill="#A67C52"/>  <text x="40.0" y="340" text-anchor="middle" class="num">5</text>  <text x="60.0" y="341" class="t" font-size="12" font-weight="700">OeksoundSooth</text>  <text x="40.0" y="364" class="ts" font-size="9.5" fill="#8C8078">—本質是動態共振抑制器，適合放</text>  <text x="40.0" y="380" class="ts" font-size="9.5" fill="#8C8078">在飽和之後修掉刺耳的諧波峰值，</text>  <text x="40.0" y="396" class="ts" font-size="9.5" fill="#8C8078">讓失真聽起來更圓潤（現場用的</text>  <rect x="339.0" y="316" width="295.0" height="96" rx="9" fill="#F3E9DC" stroke="#D9CFC4" stroke-width="1.4"/>  <circle cx="353.0" cy="336" r="10" fill="#A67C52"/>  <text x="353.0" y="340" text-anchor="middle" class="num">6</text>  <text x="373.0" y="341" class="t" font-size="12" font-weight="700">iZotopeOzoneE</text>  <text x="353.0" y="364" class="ts" font-size="9.5" fill="#8C8078">—多頻帶激發，可分別控制四個頻</text>  <text x="353.0" y="380" class="ts" font-size="9.5" fill="#8C8078">段。</text>
</svg>
