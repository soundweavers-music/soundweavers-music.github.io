<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 460" role="img" aria-label="十一、常見問題與陷阱">
  <title>十一、常見問題與陷阱</title>
  <rect width="660" height="460" fill="#FBF8F4"/>
  <style>
    .t   { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; }
    .tb  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; font-weight: 700; }
    .ts  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #8C8078; }
    .num { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #FFFFFF; font-weight: 700; font-size: 11px; }
    .ink { fill: none; stroke: #3D3229; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; }
    .thin{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; }
    .dash{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; stroke-dasharray: 4 5; }
    .lead{ fill: none; stroke: #8C8078; stroke-width: 1; }
    .acc { fill: none; stroke: #A67C52; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .blue{ fill: none; stroke: #6B8FBF; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .green{ fill: none; stroke: #6F8F6A; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .red { fill: none; stroke: #B0563F; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .dot { fill: #3D3229; }
  </style>
  <text x="26" y="34" class="tb" font-size="16">十一、常見問題與陷阱</text>
  <text x="26" y="55" class="ts" font-size="12.5">把這一節的重點排在一起</text>
  <rect x="26.0" y="96" width="295.0" height="96" rx="9" fill="#F3E9DC" stroke="#D9CFC4" stroke-width="1.4"/>  <circle cx="40.0" cy="116" r="10" fill="#A67C52"/>  <text x="40.0" y="120" text-anchor="middle" class="num">1</text>  <text x="60.0" y="121" class="t" font-size="12" font-weight="700">需要。Ableton</text>  <text x="40.0" y="144" class="ts" font-size="9.5" fill="#8C8078">的匯出選項中有「DitherO</text>  <text x="40.0" y="160" class="ts" font-size="9.5" fill="#8C8078">ptions」，在選擇16-b</text>  <text x="40.0" y="176" class="ts" font-size="9.5" fill="#8C8078">it時請開啟。</text>  <rect x="339.0" y="96" width="295.0" height="96" rx="9" fill="#F3E9DC" stroke="#D9CFC4" stroke-width="1.4"/>  <circle cx="353.0" cy="116" r="10" fill="#A67C52"/>  <text x="353.0" y="120" text-anchor="middle" class="num">2</text>  <text x="373.0" y="121" class="t" font-size="12" font-weight="700">不需要。24-bit</text>  <text x="353.0" y="144" class="ts" font-size="9.5" fill="#8C8078">到24-bit沒有降轉，不需要</text>  <text x="353.0" y="160" class="ts" font-size="9.5" fill="#8C8078">Dither。</text>  <rect x="26.0" y="206" width="295.0" height="96" rx="9" fill="#F3E9DC" stroke="#D9CFC4" stroke-width="1.4"/>  <circle cx="40.0" cy="226" r="10" fill="#A67C52"/>  <text x="40.0" y="230" text-anchor="middle" class="num">3</text>  <text x="60.0" y="231" class="t" font-size="12" font-weight="700">不需要。MP3編碼器</text>  <text x="40.0" y="254" class="ts" font-size="9.5" fill="#8C8078">內部使用自己的心理聲學模型與量</text>  <text x="40.0" y="270" class="ts" font-size="9.5" fill="#8C8078">化方式，外部Dither可能與</text>  <text x="40.0" y="286" class="ts" font-size="9.5" fill="#8C8078">其干擾。</text>  <rect x="339.0" y="206" width="295.0" height="96" rx="9" fill="#F3E9DC" stroke="#D9CFC4" stroke-width="1.4"/>  <circle cx="353.0" cy="226" r="10" fill="#A67C52"/>  <text x="353.0" y="230" text-anchor="middle" class="num">4</text>  <text x="373.0" y="231" class="t" font-size="12" font-weight="700">會。取樣率轉換會引入</text>  <text x="353.0" y="254" class="ts" font-size="9.5" fill="#8C8078">aliasing與濾波器art</text>  <text x="353.0" y="270" class="ts" font-size="9.5" fill="#8C8078">ifacts。</text>  <rect x="26.0" y="316" width="295.0" height="96" rx="9" fill="#F3E9DC" stroke="#D9CFC4" stroke-width="1.4"/>  <circle cx="40.0" cy="336" r="10" fill="#A67C52"/>  <text x="40.0" y="340" text-anchor="middle" class="num">5</text>  <text x="60.0" y="341" class="t" font-size="12" font-weight="700">很可能有兩個原因：1</text>  <text x="40.0" y="364" class="ts" font-size="9.5" fill="#8C8078">)沒有使用Dither（bit</text>  <text x="40.0" y="380" class="ts" font-size="9.5" fill="#8C8078">truncation導致量化失</text>  <text x="40.0" y="396" class="ts" font-size="9.5" fill="#8C8078">真）；2)使用了低品質的SR</text>  <rect x="339.0" y="316" width="295.0" height="96" rx="9" fill="#F3E9DC" stroke="#D9CFC4" stroke-width="1.4"/>  <circle cx="353.0" cy="336" r="10" fill="#A67C52"/>  <text x="353.0" y="340" text-anchor="middle" class="num">6</text>  <text x="373.0" y="341" class="t" font-size="12" font-weight="700">不建議。你應該保持母</text>  <text x="353.0" y="364" class="ts" font-size="9.5" fill="#8C8078">帶的動態範圍（例如-9到-11</text>  <text x="353.0" y="380" class="ts" font-size="9.5" fill="#8C8078">LUFS的流行樂標準），讓串流</text>  <text x="353.0" y="396" class="ts" font-size="9.5" fill="#8C8078">平台的LoudnessNor</text>
</svg>
