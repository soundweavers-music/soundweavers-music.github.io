  <text x="303" y="300" class="ts" font-size="10" text-anchor="middle">0</text>
  <text x="26" y="340" class="ts" font-size="11.5">處理順序：先檢查相位，再談 EQ；反相沒解決，EQ 只是在錯的訊號上加料。</text>
  <text x="26" y="362" class="ts" font-size="11">單聲道相容性測試：把左右相加，聽聽看有沒有東西突然消失。</text>
