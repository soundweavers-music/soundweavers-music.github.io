  <text x="26" y="34" class="tb" font-size="16">相位抵消</text>
  <text x="26" y="55" class="ts" font-size="12.5">同一個聲音晚半個波長，能量就變成零</text>
  <text x="26" y="84" class="ts" font-size="12">兩支麥克風收到同一個聲音、卻差了半個波長，相加就會變小。</text>
