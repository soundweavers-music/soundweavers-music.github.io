<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 350" role="img" aria-label="動態餘裕（Crest Factor）">
  <title>動態餘裕（Crest Factor）</title>
  <rect width="660" height="350" fill="#FBF8F4"/>
  <style>
    .t   { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; }
    .tb  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; font-weight: 700; }
    .ts  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #8C8078; }
    .num { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #FFFFFF; font-weight: 700; font-size: 11px; }
    .ink { fill: none; stroke: #3D3229; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; }
    .thin{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; }
    .dash{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; stroke-dasharray: 4 5; }
    .lead{ fill: none; stroke: #8C8078; stroke-width: 1; }
    .acc { fill: none; stroke: #A67C52; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .blue{ fill: none; stroke: #6B8FBF; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .green{ fill: none; stroke: #6F8F6A; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .red { fill: none; stroke: #B0563F; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .dot { fill: #3D3229; }
  </style>
  <text x="26" y="34" class="tb" font-size="16">動態餘裕（Crest Factor）</text>
  <text x="26" y="55" class="ts" font-size="12.5">峰值與平均的差距</text>
  <text x="26" y="84" class="ts" font-size="12">Crest factor＝峰值減平均；數字越小，代表動態被壓得越扁。</text>
  <text x="60" y="126" class="t" font-size="11">人聲（未壓縮）</text>
  <rect x="210" y="108" width="300" height="24" rx="4" fill="#FFFFFF" stroke="#D9CFC4" stroke-width="1.4"/>
  <rect x="210" y="108" width="54.0" height="24" rx="4" fill="#A67C52" opacity="0.3"/>
  <text x="268.0" y="144" class="ts" font-size="9.5" fill="#A67C52">約 12–18 dB</text>
  <text x="60" y="188" class="t" font-size="11">混音總線</text>
  <rect x="210" y="170" width="300" height="24" rx="4" fill="#FFFFFF" stroke="#D9CFC4" stroke-width="1.4"/>
  <rect x="210" y="170" width="165.0" height="24" rx="4" fill="#6B8FBF" opacity="0.3"/>
  <text x="379.0" y="206" class="ts" font-size="9.5" fill="#6B8FBF">約 8–12 dB</text>
  <text x="60" y="250" class="t" font-size="11">已母帶的流行歌</text>
  <rect x="210" y="232" width="300" height="24" rx="4" fill="#FFFFFF" stroke="#D9CFC4" stroke-width="1.4"/>
  <rect x="210" y="232" width="255.0" height="24" rx="4" fill="#B0563F" opacity="0.3"/>
  <text x="469.0" y="268" class="ts" font-size="9.5" fill="#B0563F">約 6–9 dB</text>
  <text x="26" y="320" class="ts" font-size="11">壓縮做得越多，crest factor 越小——聽起來越「貼」，也越沒有呼吸。</text>
  <text x="26" y="332" class="ts" font-size="11" fill="#8C8078">混音階段留 10 dB 左右，母帶才有東西可以處理。</text>
</svg>
