<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 354" role="img" aria-label="吸音與隔音：兩件完全不同的事">
  <title>吸音與隔音：兩件完全不同的事</title>
  <rect width="660" height="354" fill="#FBF8F4"/>
  <style>
    .t   { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; }
    .tb  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; font-weight: 700; }
    .ts  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #8C8078; }
    .num { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #FFFFFF; font-weight: 700; font-size: 11px; }
    .ink { fill: none; stroke: #3D3229; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; }
    .thin{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; }
    .dash{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; stroke-dasharray: 4 5; }
    .lead{ fill: none; stroke: #8C8078; stroke-width: 1; }
    .acc { fill: none; stroke: #A67C52; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .blue{ fill: none; stroke: #6B8FBF; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .green{ fill: none; stroke: #6F8F6A; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .red { fill: none; stroke: #B0563F; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .dot { fill: #3D3229; }
  </style>
  <text x="26" y="34" class="tb" font-size="16">吸音與隔音：兩件完全不同的事</text>
  <text x="26" y="55" class="ts" font-size="12.5">一個處理「房間裡的聲音」，一個處理「進出房間的聲音」</text>
  <text x="150.0" y="92" class="t" font-size="11.5" font-weight="700" fill="#A67C52">吸音（Absorption）</text>  <text x="395.0" y="92" class="t" font-size="11.5" font-weight="700" fill="#A67C52">隔音（Isolation）</text>  <rect x="26" y="104" width="608" height="58" rx="4" fill="#F3E9DC" opacity="0.55"/>  <text x="34" y="126" class="t" font-size="11.5" font-weight="700">處理什麼</text>  <text x="150.0" y="124" class="ts" font-size="10" fill="#5D4E41">反射音、殘響</text>  <text x="395.0" y="124" class="ts" font-size="10" fill="#5D4E41">空氣傳導與結構傳導</text>  <text x="34" y="184" class="t" font-size="11.5" font-weight="700">材料</text>  <text x="150.0" y="182" class="ts" font-size="10" fill="#5D4E41">泡棉、吸音板、厚窗簾</text>  <text x="395.0" y="182" class="ts" font-size="10" fill="#5D4E41">質量、彈性減振、氣密</text>  <rect x="26" y="220" width="608" height="58" rx="4" fill="#F3E9DC" opacity="0.55"/>  <text x="34" y="242" class="t" font-size="11.5" font-weight="700">效果</text>  <text x="150.0" y="240" class="ts" font-size="10" fill="#5D4E41">聲音變乾、變清楚</text>  <text x="395.0" y="240" class="ts" font-size="10" fill="#5D4E41">外面聽不到、裡面聽不到外面</text>  <text x="34" y="300" class="t" font-size="11.5" font-weight="700">常見誤解</text>  <text x="150.0" y="298" class="ts" font-size="10" fill="#5D4E41">貼滿泡棉不會變安靜</text>  <text x="395.0" y="298" class="ts" font-size="10" fill="#5D4E41">吸音棉對低頻幾乎沒用</text>
  <text x="26" y="336" class="ts" font-size="11">先做吸音（便宜有效），隔音是裝修等級的工程。</text>
</svg>
