<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 460" role="img" aria-label="二、Cue Mix：獨立耳機混音系統">
  <title>二、Cue Mix：獨立耳機混音系統</title>
  <rect width="660" height="460" fill="#FBF8F4"/>
  <style>
    .t   { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; }
    .tb  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; font-weight: 700; }
    .ts  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #8C8078; }
    .num { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #FFFFFF; font-weight: 700; font-size: 11px; }
    .ink { fill: none; stroke: #3D3229; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; }
    .thin{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; }
    .dash{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; stroke-dasharray: 4 5; }
    .lead{ fill: none; stroke: #8C8078; stroke-width: 1; }
    .acc { fill: none; stroke: #A67C52; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .blue{ fill: none; stroke: #6B8FBF; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .green{ fill: none; stroke: #6F8F6A; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .red { fill: none; stroke: #B0563F; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .dot { fill: #3D3229; }
  </style>
  <text x="26" y="34" class="tb" font-size="16">二、Cue Mix：獨立耳機混音系統</text>
  <text x="26" y="55" class="ts" font-size="12.5">把這一節的重點排在一起</text>
  <rect x="26.0" y="96" width="295.0" height="96" rx="9" fill="#F3E9DC" stroke="#D9CFC4" stroke-width="1.4"/>  <circle cx="40.0" cy="116" r="10" fill="#A67C52"/>  <text x="40.0" y="120" text-anchor="middle" class="num">1</text>  <text x="60.0" y="121" class="t" font-size="12" font-weight="700">DAW內建CueMix功能</text>  <text x="40.0" y="144" class="ts" font-size="9.5" fill="#8C8078">多數DAW（如ProTools</text>  <text x="40.0" y="160" class="ts" font-size="9.5" fill="#8C8078">、LogicPro、Cubas</text>  <text x="40.0" y="176" class="ts" font-size="9.5" fill="#8C8078">e、Reaper）都支援Au</text>  <rect x="339.0" y="96" width="295.0" height="96" rx="9" fill="#F3E9DC" stroke="#D9CFC4" stroke-width="1.4"/>  <circle cx="353.0" cy="116" r="10" fill="#A67C52"/>  <text x="353.0" y="120" text-anchor="middle" class="num">2</text>  <text x="373.0" y="121" class="t" font-size="12" font-weight="700">使用監聽控制器</text>  <text x="353.0" y="144" class="ts" font-size="9.5" fill="#8C8078">支援多組耳機輸出的音頻介面（如</text>  <text x="353.0" y="160" class="ts" font-size="9.5" fill="#8C8078">FocusriteClaret</text>  <text x="353.0" y="176" class="ts" font-size="9.5" fill="#8C8078">t+、RMEBabyface</text>  <rect x="26.0" y="206" width="295.0" height="96" rx="9" fill="#F3E9DC" stroke="#D9CFC4" stroke-width="1.4"/>  <circle cx="40.0" cy="226" r="10" fill="#A67C52"/>  <text x="40.0" y="230" text-anchor="middle" class="num">3</text>  <text x="60.0" y="231" class="t" font-size="12" font-weight="700">外部監聽混音器</text>  <text x="40.0" y="254" class="ts" font-size="9.5" fill="#8C8078">對於較大型的錄音場合，可以使用</text>  <text x="40.0" y="270" class="ts" font-size="9.5" fill="#8C8078">獨立的監聽混音系統（如Behr</text>  <text x="40.0" y="286" class="ts" font-size="9.5" fill="#8C8078">ingerP16、Aviom</text>  <rect x="339.0" y="206" width="295.0" height="96" rx="9" fill="#F3E9DC" stroke="#D9CFC4" stroke-width="1.4"/>  <circle cx="353.0" cy="226" r="10" fill="#A67C52"/>  <text x="353.0" y="230" text-anchor="middle" class="num">4</text>  <text x="373.0" y="231" class="t" font-size="12" font-weight="700">錄音前務必與每位樂手</text>  <text x="353.0" y="254" class="ts" font-size="9.5" fill="#8C8078">溝通他們在耳機中需要的內容。</text>  <rect x="26.0" y="316" width="295.0" height="96" rx="9" fill="#F3E9DC" stroke="#D9CFC4" stroke-width="1.4"/>  <circle cx="40.0" cy="336" r="10" fill="#A67C52"/>  <text x="40.0" y="340" text-anchor="middle" class="num">5</text>  <text x="60.0" y="341" class="t" font-size="12" font-weight="700">在建立CueMix時</text>  <text x="40.0" y="364" class="ts" font-size="9.5" fill="#8C8078">，可以將節拍器（ClickTr</text>  <text x="40.0" y="380" class="ts" font-size="9.5" fill="#8C8078">ack）獨立送出一軌，讓每位樂</text>  <text x="40.0" y="396" class="ts" font-size="9.5" fill="#8C8078">手自行決定節拍器音量。</text>  <rect x="339.0" y="316" width="295.0" height="96" rx="9" fill="#F3E9DC" stroke="#D9CFC4" stroke-width="1.4"/>  <circle cx="353.0" cy="336" r="10" fill="#A67C52"/>  <text x="353.0" y="340" text-anchor="middle" class="num">6</text>  <text x="373.0" y="341" class="t" font-size="12" font-weight="700">避免將所有人聲或樂器</text>  <text x="353.0" y="364" class="ts" font-size="9.5" fill="#8C8078">的推前（Pre-fader）與</text>  <text x="353.0" y="380" class="ts" font-size="9.5" fill="#8C8078">推後（Post-fader）路</text>  <text x="353.0" y="396" class="ts" font-size="9.5" fill="#8C8078">由混淆。</text>
</svg>
