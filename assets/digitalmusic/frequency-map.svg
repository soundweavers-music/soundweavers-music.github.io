<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 340" role="img" aria-label="頻譜分區">
  <title>頻譜分區</title>
  <rect width="660" height="340" fill="#FBF8F4"/>
  <style>
    .t   { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; }
    .tb  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; font-weight: 700; }
    .ts  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #8C8078; }
    .num { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #FFFFFF; font-weight: 700; font-size: 11px; }
    .ink { fill: none; stroke: #3D3229; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; }
    .thin{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; }
    .dash{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; stroke-dasharray: 4 5; }
    .lead{ fill: none; stroke: #8C8078; stroke-width: 1; }
    .acc { fill: none; stroke: #A67C52; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .blue{ fill: none; stroke: #6B8FBF; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .green{ fill: none; stroke: #6F8F6A; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .red { fill: none; stroke: #B0563F; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .dot { fill: #3D3229; }
  </style>
  <text x="26" y="34" class="tb" font-size="16">頻譜分區</text>
  <text x="26" y="55" class="ts" font-size="12.5">每一段負責不同的感覺</text>
  <text x="26" y="84" class="ts" font-size="12">同一個頻譜，不同區段負責不同的「感覺」；先知道自己在調哪一段。</text>
  <rect x="60" y="120" width="52.0" height="44" rx="4" fill="#6B8FBF" stroke="#6B8FBF" stroke-width="1.2" opacity="0.25"/>
  <text x="87.0" y="147" class="ts" font-size="10" text-anchor="middle">Sub</text>
  <text x="87.0" y="182" class="ts" font-size="8.5" text-anchor="middle" fill="#8C8078">20–60 Hz</text>
  <text x="87.0" y="200" class="ts" font-size="8.5" text-anchor="middle" fill="#8C8078">身體感</text>
  <rect x="114.0" y="120" width="95.2" height="44" rx="4" fill="#6F8F6A" stroke="#6F8F6A" stroke-width="1.2" opacity="0.25"/>
  <text x="162.6" y="147" class="ts" font-size="10" text-anchor="middle">低頻</text>
  <text x="162.6" y="182" class="ts" font-size="8.5" text-anchor="middle" fill="#8C8078">60–250 Hz</text>
  <text x="162.6" y="200" class="ts" font-size="8.5" text-anchor="middle" fill="#8C8078">厚度</text>
  <rect x="211.2" y="120" width="116.8" height="44" rx="4" fill="#A67C52" stroke="#A67C52" stroke-width="1.2" opacity="0.25"/>
  <text x="270.59999999999997" y="147" class="ts" font-size="10" text-anchor="middle">中低</text>
  <text x="270.59999999999997" y="182" class="ts" font-size="8.5" text-anchor="middle" fill="#8C8078">250–800 Hz</text>
  <text x="270.59999999999997" y="200" class="ts" font-size="8.5" text-anchor="middle" fill="#8C8078">箱音、悶</text>
  <rect x="330.0" y="120" width="106.0" height="44" rx="4" fill="#5D4E41" stroke="#5D4E41" stroke-width="1.2" opacity="0.25"/>
  <text x="384.0" y="147" class="ts" font-size="10" text-anchor="middle">中頻</text>
  <text x="384.0" y="182" class="ts" font-size="8.5" text-anchor="middle" fill="#8C8078">800–3k Hz</text>
  <text x="384.0" y="200" class="ts" font-size="8.5" text-anchor="middle" fill="#8C8078">存在感</text>
  <rect x="438.0" y="120" width="79.0" height="44" rx="4" fill="#B0563F" stroke="#B0563F" stroke-width="1.2" opacity="0.25"/>
  <text x="478.5" y="147" class="ts" font-size="10" text-anchor="middle">中高</text>
  <text x="478.5" y="182" class="ts" font-size="8.5" text-anchor="middle" fill="#8C8078">3k–6k Hz</text>
  <text x="478.5" y="200" class="ts" font-size="8.5" text-anchor="middle" fill="#8C8078">清晰、齒音</text>
  <rect x="519.0" y="120" width="79.0" height="44" rx="4" fill="#6B8FBF" stroke="#6B8FBF" stroke-width="1.2" opacity="0.25"/>
  <text x="559.5" y="147" class="ts" font-size="10" text-anchor="middle">高頻</text>
  <text x="559.5" y="182" class="ts" font-size="8.5" text-anchor="middle" fill="#8C8078">6k–20k Hz</text>
  <text x="559.5" y="200" class="ts" font-size="8.5" text-anchor="middle" fill="#8C8078">空氣感</text>
  <text x="26" y="250" class="ts" font-size="11">樂器之間搶的通常是 250–800 Hz 與 3–6 kHz 這兩段。</text>
  <text x="26" y="276" class="ts" font-size="11" fill="#8C8078">低頻留給大鼓與貝斯，中高頻留給人聲與鈸——先決定誰擁有哪一段。</text>
</svg>
