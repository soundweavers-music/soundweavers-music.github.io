<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 360" role="img" aria-label="輸出格式">
  <title>輸出格式</title>
  <rect width="660" height="360" fill="#FBF8F4"/>
  <style>
    .t   { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; }
    .tb  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; font-weight: 700; }
    .ts  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #8C8078; }
    .num { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #FFFFFF; font-weight: 700; font-size: 11px; }
    .ink { fill: none; stroke: #3D3229; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; }
    .thin{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; }
    .dash{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; stroke-dasharray: 4 5; }
    .lead{ fill: none; stroke: #8C8078; stroke-width: 1; }
    .acc { fill: none; stroke: #A67C52; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .blue{ fill: none; stroke: #6B8FBF; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .green{ fill: none; stroke: #6F8F6A; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .red { fill: none; stroke: #B0563F; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .dot { fill: #3D3229; }
  </style>
  <text x="26" y="34" class="tb" font-size="16">輸出格式</text>
  <text x="26" y="55" class="ts" font-size="12.5">工作檔與成品是兩件事</text>
  <text x="26" y="84" class="ts" font-size="12">輸出格式決定「誰還能再處理」：WAV 是工作檔，MP3 是成品。</text>
  <rect x="60" y="112" width="540" height="32" rx="4" fill="#6F8F6A" opacity="0.1"/>
  <text x="74" y="134" class="t" font-size="11" font-weight="700">WAV 24-bit</text>
  <text x="220" y="134" class="ts" font-size="10" fill="#8C8078">未壓縮</text>
  <text x="380" y="134" class="ts" font-size="10">母帶、送母帶師</text>
  <rect x="60" y="154" width="540" height="32" rx="4" fill="#6F8F6A" opacity="0.1"/>
  <text x="74" y="176" class="t" font-size="11" font-weight="700">AIFF 24-bit</text>
  <text x="220" y="176" class="ts" font-size="10" fill="#8C8078">未壓縮</text>
  <text x="380" y="176" class="ts" font-size="10">macOS 生態、交換</text>
  <rect x="60" y="196" width="540" height="32" rx="4" fill="#6B8FBF" opacity="0.1"/>
  <text x="74" y="218" class="t" font-size="11" font-weight="700">FLAC</text>
  <text x="220" y="218" class="ts" font-size="10" fill="#8C8078">無損壓縮</text>
  <text x="380" y="218" class="ts" font-size="10">存檔、發行無損版</text>
  <rect x="60" y="238" width="540" height="32" rx="4" fill="#A67C52" opacity="0.1"/>
  <text x="74" y="260" class="t" font-size="11" font-weight="700">AAC / M4A</text>
  <text x="220" y="260" class="ts" font-size="10" fill="#8C8078">有損</text>
  <text x="380" y="260" class="ts" font-size="10">Apple 生態串流</text>
  <rect x="60" y="280" width="540" height="32" rx="4" fill="#A67C52" opacity="0.1"/>
  <text x="74" y="302" class="t" font-size="11" font-weight="700">MP3 320k</text>
  <text x="220" y="302" class="ts" font-size="10" fill="#8C8078">有損</text>
  <text x="380" y="302" class="ts" font-size="10">相容性最好的成品</text>
  <text x="26" y="330" class="ts" font-size="11">不管輸出哪一種，母帶檔一定要留一份未壓縮的原始版本。</text>
</svg>
