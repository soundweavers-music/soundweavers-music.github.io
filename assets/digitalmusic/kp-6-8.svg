<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 460" role="img" aria-label="八、Gain Staging 實戰工作流程">
  <title>八、Gain Staging 實戰工作流程</title>
  <rect width="660" height="460" fill="#FBF8F4"/>
  <style>
    .t   { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; }
    .tb  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; font-weight: 700; }
    .ts  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #8C8078; }
    .num { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #FFFFFF; font-weight: 700; font-size: 11px; }
    .ink { fill: none; stroke: #3D3229; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; }
    .thin{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; }
    .dash{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; stroke-dasharray: 4 5; }
    .lead{ fill: none; stroke: #8C8078; stroke-width: 1; }
    .acc { fill: none; stroke: #A67C52; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .blue{ fill: none; stroke: #6B8FBF; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .green{ fill: none; stroke: #6F8F6A; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .red { fill: none; stroke: #B0563F; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .dot { fill: #3D3229; }
  </style>
  <text x="26" y="34" class="tb" font-size="16">八、Gain Staging 實戰工作流程</text>
  <text x="26" y="55" class="ts" font-size="12.5">把這一節的重點排在一起</text>
  <rect x="26.0" y="96" width="295.0" height="96" rx="9" fill="#F3E9DC" stroke="#D9CFC4" stroke-width="1.4"/>  <circle cx="40.0" cy="116" r="10" fill="#A67C52"/>  <text x="40.0" y="120" text-anchor="middle" class="num">1</text>  <text x="60.0" y="121" class="t" font-size="12" font-weight="700">校準錄音介面的pre</text>  <text x="40.0" y="144" class="ts" font-size="9.5" fill="#8C8078">amp：使用前級上的meter</text>  <text x="40.0" y="160" class="ts" font-size="9.5" fill="#8C8078">或DAW的peakmeter，</text>  <text x="40.0" y="176" class="ts" font-size="9.5" fill="#8C8078">確保最高peak在-12dB</text>  <rect x="339.0" y="96" width="295.0" height="96" rx="9" fill="#F3E9DC" stroke="#D9CFC4" stroke-width="1.4"/>  <circle cx="353.0" cy="116" r="10" fill="#A67C52"/>  <text x="353.0" y="120" text-anchor="middle" class="num">2</text>  <text x="373.0" y="121" class="t" font-size="12" font-weight="700">對於DI訊號</text>  <text x="353.0" y="144" class="ts" font-size="9.5" fill="#8C8078">、貝斯），確認介面的instr</text>  <text x="353.0" y="160" class="ts" font-size="9.5" fill="#8C8078">umentinput沒有過載</text>  <rect x="26.0" y="206" width="295.0" height="96" rx="9" fill="#F3E9DC" stroke="#D9CFC4" stroke-width="1.4"/>  <circle cx="40.0" cy="226" r="10" fill="#A67C52"/>  <text x="40.0" y="230" text-anchor="middle" class="num">3</text>  <text x="60.0" y="231" class="t" font-size="12" font-weight="700">錄製30秒的測試段落</text>  <text x="40.0" y="254" class="ts" font-size="9.5" fill="#8C8078">，檢查整段的最大peak</text>  <rect x="339.0" y="206" width="295.0" height="96" rx="9" fill="#F3E9DC" stroke="#D9CFC4" stroke-width="1.4"/>  <circle cx="353.0" cy="226" r="10" fill="#A67C52"/>  <text x="353.0" y="230" text-anchor="middle" class="num">4</text>  <text x="373.0" y="231" class="t" font-size="12" font-weight="700">如果peak超過-3</text>  <text x="353.0" y="254" class="ts" font-size="9.5" fill="#8C8078">dBFS，調降preampga</text>  <text x="353.0" y="270" class="ts" font-size="9.5" fill="#8C8078">in3–6dB重錄</text>  <rect x="26.0" y="316" width="295.0" height="96" rx="9" fill="#F3E9DC" stroke="#D9CFC4" stroke-width="1.4"/>  <circle cx="40.0" cy="336" r="10" fill="#A67C52"/>  <text x="40.0" y="340" text-anchor="middle" class="num">5</text>  <text x="60.0" y="341" class="t" font-size="12" font-weight="700">所有音訊clips進</text>  <text x="40.0" y="364" class="ts" font-size="9.5" fill="#8C8078">到DAW後，檢查clipgai</text>  <text x="40.0" y="380" class="ts" font-size="9.5" fill="#8C8078">n（clipgain/regi</text>  <text x="40.0" y="396" class="ts" font-size="9.5" fill="#8C8078">ongain）</text>  <rect x="339.0" y="316" width="295.0" height="96" rx="9" fill="#F3E9DC" stroke="#D9CFC4" stroke-width="1.4"/>  <circle cx="353.0" cy="336" r="10" fill="#A67C52"/>  <text x="353.0" y="340" text-anchor="middle" class="num">6</text>  <text x="373.0" y="341" class="t" font-size="12" font-weight="700">使用normaliz</text>  <text x="353.0" y="364" class="ts" font-size="9.5" fill="#8C8078">e功能將最大peak統一調整到</text>  <text x="353.0" y="380" class="ts" font-size="9.5" fill="#8C8078">-18dBFS（不是norma</text>  <text x="353.0" y="396" class="ts" font-size="9.5" fill="#8C8078">liseto0dBFS！）</text>
</svg>
