<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 360" role="img" aria-label="位元深度與動態範圍">
  <title>位元深度與動態範圍</title>
  <rect width="660" height="360" fill="#FBF8F4"/>
  <style>
    .t   { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; }
    .tb  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; font-weight: 700; }
    .ts  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #8C8078; }
    .num { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #FFFFFF; font-weight: 700; font-size: 11px; }
    .ink { fill: none; stroke: #3D3229; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; }
    .thin{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; }
    .dash{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; stroke-dasharray: 4 5; }
    .lead{ fill: none; stroke: #8C8078; stroke-width: 1; }
    .acc { fill: none; stroke: #A67C52; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .blue{ fill: none; stroke: #6B8FBF; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .green{ fill: none; stroke: #6F8F6A; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .red { fill: none; stroke: #B0563F; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .dot { fill: #3D3229; }
  </style>
  <text x="26" y="34" class="tb" font-size="16">位元深度與動態範圍</text>
  <text x="26" y="55" class="ts" font-size="12.5">位元數越多，最低的那一階越小</text>
  <text x="26" y="84" class="ts" font-size="12">位元深度決定的是「最安靜能到多小」，不是「最大聲能多大」。</text>
  <text x="60" y="126" class="t" font-size="12" font-weight="700" fill="#A67C52">16-bit</text>
  <rect x="180" y="110" width="380" height="22" rx="4" fill="#FFFFFF" stroke="#D9CFC4" stroke-width="1.4"/>
  <rect x="180" y="110" width="209.00000000000003" height="22" rx="4" fill="#A67C52" opacity="0.3"/>
  <text x="570" y="126" class="ts" font-size="9.5" text-anchor="end" fill="#A67C52">96 dB</text>
  <text x="180" y="146" class="ts" font-size="9" fill="#8C8078">約 6.5 萬階</text>
  <text x="60" y="188" class="t" font-size="12" font-weight="700" fill="#6B8FBF">24-bit</text>
  <rect x="180" y="172" width="380" height="22" rx="4" fill="#FFFFFF" stroke="#D9CFC4" stroke-width="1.4"/>
  <rect x="180" y="172" width="304.0" height="22" rx="4" fill="#6B8FBF" opacity="0.3"/>
  <text x="570" y="188" class="ts" font-size="9.5" text-anchor="end" fill="#6B8FBF">144 dB</text>
  <text x="180" y="208" class="ts" font-size="9" fill="#8C8078">約 1670 萬階</text>
  <text x="60" y="250" class="t" font-size="12" font-weight="700" fill="#6F8F6A">32-bit float</text>
  <rect x="180" y="234" width="380" height="22" rx="4" fill="#FFFFFF" stroke="#D9CFC4" stroke-width="1.4"/>
  <rect x="180" y="234" width="380.0" height="22" rx="4" fill="#6F8F6A" opacity="0.3"/>
  <text x="570" y="250" class="ts" font-size="9.5" text-anchor="end" fill="#6F8F6A">≈ 1528 dB（數學上）</text>
  <text x="180" y="270" class="ts" font-size="9" fill="#8C8078">內部處理用</text>
  <rect x="180" y="300" width="380" height="18" rx="4" fill="#F4DFD7" opacity="0.7"/>
  <text x="370" y="313" class="ts" font-size="9.5" text-anchor="middle" fill="#B0563F">任何一段聽得到的底噪，都會佔掉最底下那幾階</text>
  <text x="26" y="342" class="ts" font-size="11">錄音用 24-bit：不是為了更大聲，是為了留著後面還能修。</text>
</svg>
