<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 460" role="img" aria-label="五、管樂器（長笛、薩克斯風、小號）收音">
  <title>五、管樂器（長笛、薩克斯風、小號）收音</title>
  <rect width="660" height="460" fill="#FBF8F4"/>
  <style>
    .t   { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; }
    .tb  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; font-weight: 700; }
    .ts  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #8C8078; }
    .num { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #FFFFFF; font-weight: 700; font-size: 11px; }
    .ink { fill: none; stroke: #3D3229; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; }
    .thin{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; }
    .dash{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; stroke-dasharray: 4 5; }
    .lead{ fill: none; stroke: #8C8078; stroke-width: 1; }
    .acc { fill: none; stroke: #A67C52; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .blue{ fill: none; stroke: #6B8FBF; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .green{ fill: none; stroke: #6F8F6A; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .red { fill: none; stroke: #B0563F; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .dot { fill: #3D3229; }
  </style>
  <text x="26" y="34" class="tb" font-size="16">五、管樂器（長笛、薩克斯風、小號）收音</text>
  <text x="26" y="55" class="ts" font-size="12.5">把這一節的重點排在一起</text>
  <rect x="26.0" y="96" width="295.0" height="96" rx="9" fill="#F3E9DC" stroke="#D9CFC4" stroke-width="1.4"/>  <circle cx="40.0" cy="116" r="10" fill="#A67C52"/>  <text x="40.0" y="120" text-anchor="middle" class="num">1</text>  <text x="60.0" y="121" class="t" font-size="12" font-weight="700">位置</text>  <text x="40.0" y="144" class="ts" font-size="9.5" fill="#8C8078">麥克風放在吹口與按鍵之間，距離</text>  <text x="40.0" y="160" class="ts" font-size="9.5" fill="#8C8078">約30-60公分。</text>  <rect x="339.0" y="96" width="295.0" height="96" rx="9" fill="#F3E9DC" stroke="#D9CFC4" stroke-width="1.4"/>  <circle cx="353.0" cy="116" r="10" fill="#A67C52"/>  <text x="353.0" y="120" text-anchor="middle" class="num">2</text>  <text x="373.0" y="121" class="t" font-size="12" font-weight="700">角度</text>  <text x="353.0" y="144" class="ts" font-size="9.5" fill="#8C8078">偏離吹口直接氣流約45度，避免</text>  <text x="353.0" y="160" class="ts" font-size="9.5" fill="#8C8078">吹氣聲（breathnoise</text>  <text x="353.0" y="176" class="ts" font-size="9.5" fill="#8C8078">）直接衝擊麥克風振膜。</text>  <rect x="26.0" y="206" width="295.0" height="96" rx="9" fill="#F3E9DC" stroke="#D9CFC4" stroke-width="1.4"/>  <circle cx="40.0" cy="226" r="10" fill="#A67C52"/>  <text x="40.0" y="230" text-anchor="middle" class="num">3</text>  <text x="60.0" y="231" class="t" font-size="12" font-weight="700">層次</text>  <text x="40.0" y="254" class="ts" font-size="9.5" fill="#8C8078">如果演奏者動態很大，可以加一支</text>  <text x="40.0" y="270" class="ts" font-size="9.5" fill="#8C8078">Roommic補充空間感。</text>  <rect x="339.0" y="206" width="295.0" height="96" rx="9" fill="#F3E9DC" stroke="#D9CFC4" stroke-width="1.4"/>  <circle cx="353.0" cy="226" r="10" fill="#A67C52"/>  <text x="353.0" y="230" text-anchor="middle" class="num">4</text>  <text x="373.0" y="231" class="t" font-size="12" font-weight="700">最佳位置</text>  <text x="353.0" y="254" class="ts" font-size="9.5" fill="#8C8078">麥克風距離喇叭口45-90公分</text>  <text x="353.0" y="270" class="ts" font-size="9.5" fill="#8C8078">，略偏喇叭口上方約30度，這樣</text>  <text x="353.0" y="286" class="ts" font-size="9.5" fill="#8C8078">可以同時收到喇叭口的聲音與按</text>  <rect x="26.0" y="316" width="295.0" height="96" rx="9" fill="#F3E9DC" stroke="#D9CFC4" stroke-width="1.4"/>  <circle cx="40.0" cy="336" r="10" fill="#A67C52"/>  <text x="40.0" y="340" text-anchor="middle" class="num">5</text>  <text x="60.0" y="341" class="t" font-size="12" font-weight="700">近距離選項</text>  <text x="40.0" y="364" class="ts" font-size="9.5" fill="#8C8078">若想得到更直接的音色（如流行樂</text>  <text x="40.0" y="380" class="ts" font-size="9.5" fill="#8C8078">或funk），可以將動圈麥克風</text>  <text x="40.0" y="396" class="ts" font-size="9.5" fill="#8C8078">放在喇叭口前方10-20公分</text>  <rect x="339.0" y="316" width="295.0" height="96" rx="9" fill="#F3E9DC" stroke="#D9CFC4" stroke-width="1.4"/>  <circle cx="353.0" cy="336" r="10" fill="#A67C52"/>  <text x="353.0" y="340" text-anchor="middle" class="num">6</text>  <text x="373.0" y="341" class="t" font-size="12" font-weight="700">避免</text>  <text x="353.0" y="364" class="ts" font-size="9.5" fill="#8C8078">不要直接把動圈麥克風塞入喇叭口</text>  <text x="353.0" y="380" class="ts" font-size="9.5" fill="#8C8078">——這會讓音色極度壓縮且不自然</text>  <text x="353.0" y="396" class="ts" font-size="9.5" fill="#8C8078">（除非你要的是那種特殊的vi</text>
</svg>
