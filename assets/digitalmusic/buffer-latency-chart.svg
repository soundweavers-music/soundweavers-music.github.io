<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 372" role="img" aria-label="Buffer 大小與延遲">
  <title>Buffer 大小與延遲</title>
  <rect width="660" height="372" fill="#FBF8F4"/>
  <style>
    .t   { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; }
    .tb  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; font-weight: 700; }
    .ts  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #8C8078; }
    .num { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #FFFFFF; font-weight: 700; font-size: 11px; }
    .ink { fill: none; stroke: #3D3229; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; }
    .thin{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; }
    .dash{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; stroke-dasharray: 4 5; }
    .lead{ fill: none; stroke: #8C8078; stroke-width: 1; }
    .acc { fill: none; stroke: #A67C52; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .blue{ fill: none; stroke: #6B8FBF; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .green{ fill: none; stroke: #6F8F6A; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .red { fill: none; stroke: #B0563F; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .dot { fill: #3D3229; }
  </style>
  <text x="26" y="34" class="tb" font-size="16">Buffer 大小與延遲</text>
  <text x="26" y="55" class="ts" font-size="12.5">來回延遲（毫秒）大約是 Buffer 的兩倍</text>
  <text x="26" y="82" class="ts" font-size="11.5">Buffer 越小延遲越低，但越容易爆音；48 kHz 下單趟延遲＝Buffer ÷ 48000。</text>  <path d="M90 100.0 L560 100.0" class="thin" opacity="0.5"/>  <path d="M90 150.0 L560 150.0" class="thin" opacity="0.5"/>  <path d="M90 200.0 L560 200.0" class="thin" opacity="0.5"/>  <path d="M90 250.0 L560 250.0" class="thin" opacity="0.5"/>  <path d="M90 300.0 L560 300.0" class="thin" opacity="0.5"/>  <rect x="72.0" y="293.75" width="36" height="6.249999999999999" rx="4" fill="#F3E9DC" stroke="#A67C52" stroke-width="1.4"/>  <text x="90.0" y="287.75" class="t" font-size="9.5" text-anchor="middle" fill="#A67C52">1.3</text>  <text x="90.0" y="316" class="ts" font-size="9.5" text-anchor="middle" fill="#8C8078">32</text>  <rect x="166.0" y="287.5" width="36" height="12.499999999999998" rx="4" fill="#F3E9DC" stroke="#A67C52" stroke-width="1.4"/>  <text x="184.0" y="281.5" class="t" font-size="9.5" text-anchor="middle" fill="#A67C52">2.7</text>  <text x="184.0" y="316" class="ts" font-size="9.5" text-anchor="middle" fill="#8C8078">64</text>  <rect x="260.0" y="275.0" width="36" height="24.999999999999996" rx="4" fill="#F3E9DC" stroke="#A67C52" stroke-width="1.4"/>  <text x="278.0" y="269.0" class="t" font-size="9.5" text-anchor="middle" fill="#A67C52">5.3</text>  <text x="278.0" y="316" class="ts" font-size="9.5" text-anchor="middle" fill="#8C8078">128</text>  <rect x="354.0" y="250.0" width="36" height="49.99999999999999" rx="4" fill="#F3E9DC" stroke="#A67C52" stroke-width="1.4"/>  <text x="372.0" y="244.0" class="t" font-size="9.5" text-anchor="middle" fill="#A67C52">10.7</text>  <text x="372.0" y="316" class="ts" font-size="9.5" text-anchor="middle" fill="#8C8078">256</text>  <rect x="448.0" y="200.0" width="36" height="99.99999999999999" rx="4" fill="#F3E9DC" stroke="#A67C52" stroke-width="1.4"/>  <text x="466.0" y="194.0" class="t" font-size="9.5" text-anchor="middle" fill="#A67C52">21.3</text>  <text x="466.0" y="316" class="ts" font-size="9.5" text-anchor="middle" fill="#8C8078">512</text>  <rect x="542.0" y="100.00000000000003" width="36" height="199.99999999999997" rx="4" fill="#F3E9DC" stroke="#A67C52" stroke-width="1.4"/>  <text x="560.0" y="94.00000000000003" class="t" font-size="9.5" text-anchor="middle" fill="#A67C52">42.7</text>  <text x="560.0" y="316" class="ts" font-size="9.5" text-anchor="middle" fill="#8C8078">1024</text>  <text x="325.0" y="334" class="ts" font-size="9.5" text-anchor="middle" fill="#8C8078">Buffer Size（samples）</text>  <text x="26" y="352" class="ts" font-size="11">錄音時 128–256 是常見折衷；混音時可以拉到 1024，反正不需要即時。</text>
</svg>
