<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 296" role="img" aria-label="LUFS 是什麼：為什麼不是 dB">
  <title>LUFS 是什麼：為什麼不是 dB</title>
  <rect width="660" height="296" fill="#FBF8F4"/>
  <style>
    .t   { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; }
    .tb  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; font-weight: 700; }
    .ts  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #8C8078; }
    .num { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #FFFFFF; font-weight: 700; font-size: 11px; }
    .ink { fill: none; stroke: #3D3229; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; }
    .thin{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; }
    .dash{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; stroke-dasharray: 4 5; }
    .lead{ fill: none; stroke: #8C8078; stroke-width: 1; }
    .acc { fill: none; stroke: #A67C52; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .blue{ fill: none; stroke: #6B8FBF; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .green{ fill: none; stroke: #6F8F6A; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .red { fill: none; stroke: #B0563F; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .dot { fill: #3D3229; }
  </style>
  <text x="26" y="34" class="tb" font-size="16">LUFS 是什麼：為什麼不是 dB</text>
  <text x="26" y="55" class="ts" font-size="12.5">它試著模擬「人耳覺得多大聲」，不是「波形多大」</text>
  <text x="150.0" y="92" class="t" font-size="11.5" font-weight="700" fill="#A67C52">dBFS（峰值）</text>  <text x="395.0" y="92" class="t" font-size="11.5" font-weight="700" fill="#A67C52">LUFS（響度）</text>  <rect x="26" y="104" width="608" height="58" rx="4" fill="#F3E9DC" opacity="0.55"/>  <text x="34" y="126" class="t" font-size="11.5" font-weight="700">量什麼</text>  <text x="150.0" y="124" class="ts" font-size="10" fill="#5D4E41">波形最高點</text>  <text x="395.0" y="124" class="ts" font-size="10" fill="#5D4E41">人耳感受到的音量</text>  <text x="34" y="184" class="t" font-size="11.5" font-weight="700">用途</text>  <text x="150.0" y="182" class="ts" font-size="10" fill="#5D4E41">不要削波</text>  <text x="395.0" y="182" class="ts" font-size="10" fill="#5D4E41">平台與專輯的一致性</text>  <rect x="26" y="220" width="608" height="58" rx="4" fill="#F3E9DC" opacity="0.55"/>  <text x="34" y="242" class="t" font-size="11.5" font-weight="700">例子</text>  <text x="150.0" y="240" class="ts" font-size="10" fill="#5D4E41">−1 dBFS 的歌不一定</text>  <text x="150.0" y="255" class="ts" font-size="10" fill="#5D4E41">比較大聲</text>  <text x="395.0" y="240" class="ts" font-size="10" fill="#5D4E41">−9 LUFS 才是真的比</text>  <text x="395.0" y="255" class="ts" font-size="10" fill="#5D4E41">較大聲</text>
  <text x="26" y="278" class="ts" font-size="11">兩個都要看：LUFS 決定大小聲，True Peak 決定會不會爆。</text>
</svg>
