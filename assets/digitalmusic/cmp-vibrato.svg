<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 296" role="img" aria-label="修抖音：修到什麼程度">
  <title>修抖音：修到什麼程度</title>
  <rect width="660" height="296" fill="#FBF8F4"/>
  <style>
    .t   { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; }
    .tb  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; font-weight: 700; }
    .ts  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #8C8078; }
    .num { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #FFFFFF; font-weight: 700; font-size: 11px; }
    .ink { fill: none; stroke: #3D3229; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; }
    .thin{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; }
    .dash{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; stroke-dasharray: 4 5; }
    .lead{ fill: none; stroke: #8C8078; stroke-width: 1; }
    .acc { fill: none; stroke: #A67C52; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .blue{ fill: none; stroke: #6B8FBF; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .green{ fill: none; stroke: #6F8F6A; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .red { fill: none; stroke: #B0563F; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .dot { fill: #3D3229; }
  </style>
  <text x="26" y="34" class="tb" font-size="16">修抖音：修到什麼程度</text>
  <text x="26" y="55" class="ts" font-size="12.5">抖動是情感，走音才是問題</text>
  <text x="150.0" y="92" class="t" font-size="11.5" font-weight="700" fill="#A67C52">保留抖動</text>  <text x="395.0" y="92" class="t" font-size="11.5" font-weight="700" fill="#A67C52">壓平抖動</text>  <rect x="26" y="104" width="608" height="58" rx="4" fill="#F3E9DC" opacity="0.55"/>  <text x="34" y="126" class="t" font-size="11.5" font-weight="700">聽感</text>  <text x="150.0" y="124" class="ts" font-size="10" fill="#5D4E41">有生命、有張力</text>  <text x="395.0" y="124" class="ts" font-size="10" fill="#5D4E41">平、像合成器</text>  <text x="34" y="184" class="t" font-size="11.5" font-weight="700">適用</text>  <text x="150.0" y="182" class="ts" font-size="10" fill="#5D4E41">主唱、長音</text>  <text x="395.0" y="182" class="ts" font-size="10" fill="#5D4E41">和聲、電子、效果</text>  <rect x="26" y="220" width="608" height="58" rx="4" fill="#F3E9DC" opacity="0.55"/>  <text x="34" y="242" class="t" font-size="11.5" font-weight="700">做法</text>  <text x="150.0" y="240" class="ts" font-size="10" fill="#5D4E41">只修音準，不動曲線高低</text>  <text x="395.0" y="240" class="ts" font-size="10" fill="#5D4E41">把整條曲線拉直</text>
  <text x="26" y="278" class="ts" font-size="11">判斷方法：把手放在喇叭上，感覺到「有起伏」就是還有抖動。</text>
</svg>
