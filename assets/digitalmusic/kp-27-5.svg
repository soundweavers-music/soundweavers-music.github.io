<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 460" role="img" aria-label="Master Bus 的進階處理">
  <title>Master Bus 的進階處理</title>
  <rect width="660" height="460" fill="#FBF8F4"/>
  <style>
    .t   { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; }
    .tb  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; font-weight: 700; }
    .ts  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #8C8078; }
    .num { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #FFFFFF; font-weight: 700; font-size: 11px; }
    .ink { fill: none; stroke: #3D3229; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; }
    .thin{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; }
    .dash{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; stroke-dasharray: 4 5; }
    .lead{ fill: none; stroke: #8C8078; stroke-width: 1; }
    .acc { fill: none; stroke: #A67C52; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .blue{ fill: none; stroke: #6B8FBF; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .green{ fill: none; stroke: #6F8F6A; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .red { fill: none; stroke: #B0563F; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .dot { fill: #3D3229; }
  </style>
  <text x="26" y="34" class="tb" font-size="16">Master Bus 的進階處理</text>
  <text x="26" y="55" class="ts" font-size="12.5">把這一節的重點排在一起</text>
  <rect x="26.0" y="96" width="295.0" height="96" rx="9" fill="#F3E9DC" stroke="#D9CFC4" stroke-width="1.4"/>  <circle cx="40.0" cy="116" r="10" fill="#A67C52"/>  <text x="40.0" y="120" text-anchor="middle" class="num">1</text>  <text x="60.0" y="121" class="t" font-size="12" font-weight="700">Mid-Side</text>  <text x="40.0" y="144" class="ts" font-size="9.5" fill="#8C8078">將立體聲訊號分為Mid（中央，</text>  <text x="40.0" y="160" class="ts" font-size="9.5" fill="#8C8078">左右聲道相同部分）與Side（</text>  <text x="40.0" y="176" class="ts" font-size="9.5" fill="#8C8078">側邊，左右聲道不同部分），然</text>  <rect x="339.0" y="96" width="295.0" height="96" rx="9" fill="#F3E9DC" stroke="#D9CFC4" stroke-width="1.4"/>  <circle cx="353.0" cy="116" r="10" fill="#A67C52"/>  <text x="353.0" y="120" text-anchor="middle" class="num">2</text>  <text x="373.0" y="121" class="t" font-size="12" font-weight="700">稍微壓縮Mid聲道，</text>  <text x="353.0" y="144" class="ts" font-size="9.5" fill="#8C8078">讓中央的人聲與大鼓更穩定</text>  <rect x="26.0" y="206" width="295.0" height="96" rx="9" fill="#F3E9DC" stroke="#D9CFC4" stroke-width="1.4"/>  <circle cx="40.0" cy="226" r="10" fill="#A67C52"/>  <text x="40.0" y="230" text-anchor="middle" class="num">3</text>  <text x="60.0" y="231" class="t" font-size="12" font-weight="700">對Side聲道做高頻</text>  <text x="40.0" y="254" class="ts" font-size="9.5" fill="#8C8078">提升，增加空間感</text>  <rect x="339.0" y="206" width="295.0" height="96" rx="9" fill="#F3E9DC" stroke="#D9CFC4" stroke-width="1.4"/>  <circle cx="353.0" cy="226" r="10" fill="#A67C52"/>  <text x="353.0" y="230" text-anchor="middle" class="num">4</text>  <text x="373.0" y="231" class="t" font-size="12" font-weight="700">用M/SEQ分別調整</text>  <text x="353.0" y="254" class="ts" font-size="9.5" fill="#8C8078">中央與側邊的頻率平衡</text>  <rect x="26.0" y="316" width="295.0" height="96" rx="9" fill="#F3E9DC" stroke="#D9CFC4" stroke-width="1.4"/>  <circle cx="40.0" cy="336" r="10" fill="#A67C52"/>  <text x="40.0" y="340" text-anchor="middle" class="num">5</text>  <text x="60.0" y="341" class="t" font-size="12" font-weight="700">立體聲擴展器</text>  <text x="40.0" y="364" class="ts" font-size="9.5" fill="#8C8078">使用像WavesS1或iZot</text>  <text x="40.0" y="380" class="ts" font-size="9.5" fill="#8C8078">opeOzone的Imager</text>  <text x="40.0" y="396" class="ts" font-size="9.5" fill="#8C8078">模組，將Side訊號的寬度適</text>  <rect x="339.0" y="316" width="295.0" height="96" rx="9" fill="#F3E9DC" stroke="#D9CFC4" stroke-width="1.4"/>  <circle cx="353.0" cy="336" r="10" fill="#A67C52"/>  <text x="353.0" y="340" text-anchor="middle" class="num">6</text>  <text x="373.0" y="341" class="t" font-size="12" font-weight="700">HaasEffect延遲</text>  <text x="353.0" y="364" class="ts" font-size="9.5" fill="#8C8078">在母帶階段較少使用，但某些插件</text>  <text x="353.0" y="380" class="ts" font-size="9.5" fill="#8C8078">會利用極短延遲（5-20ms）</text>  <text x="353.0" y="396" class="ts" font-size="9.5" fill="#8C8078">來創造寬度感——使用上要非常</text>
</svg>
