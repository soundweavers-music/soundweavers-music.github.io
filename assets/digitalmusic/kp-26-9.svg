<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 460" role="img" aria-label="透過 Automation 創造情緒弧線">
  <title>透過 Automation 創造情緒弧線</title>
  <rect width="660" height="460" fill="#FBF8F4"/>
  <style>
    .t   { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; }
    .tb  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; font-weight: 700; }
    .ts  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #8C8078; }
    .num { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #FFFFFF; font-weight: 700; font-size: 11px; }
    .ink { fill: none; stroke: #3D3229; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; }
    .thin{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; }
    .dash{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; stroke-dasharray: 4 5; }
    .lead{ fill: none; stroke: #8C8078; stroke-width: 1; }
    .acc { fill: none; stroke: #A67C52; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .blue{ fill: none; stroke: #6B8FBF; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .green{ fill: none; stroke: #6F8F6A; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .red { fill: none; stroke: #B0563F; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .dot { fill: #3D3229; }
  </style>
  <text x="26" y="34" class="tb" font-size="16">透過 Automation 創造情緒弧線</text>
  <text x="26" y="55" class="ts" font-size="12.5">把這一節的重點排在一起</text>
  <rect x="26.0" y="96" width="295.0" height="96" rx="9" fill="#F3E9DC" stroke="#D9CFC4" stroke-width="1.4"/>  <circle cx="40.0" cy="116" r="10" fill="#A67C52"/>  <text x="40.0" y="120" text-anchor="middle" class="num">1</text>  <text x="60.0" y="121" class="t" font-size="12" font-weight="700">Intro</text>  <text x="40.0" y="144" class="ts" font-size="9.5" fill="#8C8078">音量較低，filter較悶，p</text>  <text x="40.0" y="160" class="ts" font-size="9.5" fill="#8C8078">an範圍較窄。</text>  <rect x="339.0" y="96" width="295.0" height="96" rx="9" fill="#F3E9DC" stroke="#D9CFC4" stroke-width="1.4"/>  <circle cx="353.0" cy="116" r="10" fill="#A67C52"/>  <text x="353.0" y="120" text-anchor="middle" class="num">2</text>  <text x="373.0" y="121" class="t" font-size="12" font-weight="700">Verse1</text>  <text x="353.0" y="144" class="ts" font-size="9.5" fill="#8C8078">逐漸打開，但仍保留空間。</text>  <rect x="26.0" y="206" width="295.0" height="96" rx="9" fill="#F3E9DC" stroke="#D9CFC4" stroke-width="1.4"/>  <circle cx="40.0" cy="226" r="10" fill="#A67C52"/>  <text x="40.0" y="230" text-anchor="middle" class="num">3</text>  <text x="60.0" y="231" class="t" font-size="12" font-weight="700">Pre-Chorus</text>  <text x="40.0" y="254" class="ts" font-size="9.5" fill="#8C8078">volume持續上升，filt</text>  <text x="40.0" y="270" class="ts" font-size="9.5" fill="#8C8078">er慢慢打開，pan開始拓展到</text>  <text x="40.0" y="286" class="ts" font-size="9.5" fill="#8C8078">更寬</text>  <rect x="339.0" y="206" width="295.0" height="96" rx="9" fill="#F3E9DC" stroke="#D9CFC4" stroke-width="1.4"/>  <circle cx="353.0" cy="226" r="10" fill="#A67C52"/>  <text x="353.0" y="230" text-anchor="middle" class="num">4</text>  <text x="373.0" y="231" class="t" font-size="12" font-weight="700">Chorus</text>  <text x="353.0" y="254" class="ts" font-size="9.5" fill="#8C8078">全部打開——最大音量、全頻段、</text>  <text x="353.0" y="270" class="ts" font-size="9.5" fill="#8C8078">寬廣立體聲場、豐富的rever</text>  <text x="353.0" y="286" class="ts" font-size="9.5" fill="#8C8078">b</text>  <rect x="26.0" y="316" width="295.0" height="96" rx="9" fill="#F3E9DC" stroke="#D9CFC4" stroke-width="1.4"/>  <circle cx="40.0" cy="336" r="10" fill="#A67C52"/>  <text x="40.0" y="340" text-anchor="middle" class="num">5</text>  <text x="60.0" y="341" class="t" font-size="12" font-weight="700">Bridge</text>  <text x="40.0" y="364" class="ts" font-size="9.5" fill="#8C8078">回到較小的設定，但與intro</text>  <text x="40.0" y="380" class="ts" font-size="9.5" fill="#8C8078">相比多一些元素，營造反思感</text>  <rect x="339.0" y="316" width="295.0" height="96" rx="9" fill="#F3E9DC" stroke="#D9CFC4" stroke-width="1.4"/>  <circle cx="353.0" cy="336" r="10" fill="#A67C52"/>  <text x="353.0" y="340" text-anchor="middle" class="num">6</text>  <text x="373.0" y="341" class="t" font-size="12" font-weight="700">FinalChorus</text>  <text x="353.0" y="364" class="ts" font-size="9.5" fill="#8C8078">達到整首歌的最高潮——比第一次</text>  <text x="353.0" y="380" class="ts" font-size="9.5" fill="#8C8078">chorus更大聲、更寬廣、更</text>  <text x="353.0" y="396" class="ts" font-size="9.5" fill="#8C8078">多能量</text>
</svg>
