<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 340" role="img" aria-label="Stem 與母帶">
  <title>Stem 與母帶</title>
  <rect width="660" height="340" fill="#FBF8F4"/>
  <style>
    .t   { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; }
    .tb  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; font-weight: 700; }
    .ts  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #8C8078; }
    .num { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #FFFFFF; font-weight: 700; font-size: 11px; }
    .ink { fill: none; stroke: #3D3229; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; }
    .thin{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; }
    .dash{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; stroke-dasharray: 4 5; }
    .lead{ fill: none; stroke: #8C8078; stroke-width: 1; }
    .acc { fill: none; stroke: #A67C52; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .blue{ fill: none; stroke: #6B8FBF; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .green{ fill: none; stroke: #6F8F6A; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .red { fill: none; stroke: #B0563F; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .dot { fill: #3D3229; }
  </style>
  <text x="26" y="34" class="tb" font-size="16">Stem 與母帶</text>
  <text x="26" y="55" class="ts" font-size="12.5">分組輸出與最終輸出的差別</text>
  <text x="26" y="84" class="ts" font-size="12">Stem 是分組的混音結果，母帶是最後那一份；交出去之前先搞清楚對方要哪一種。</text>
  <rect x="60" y="110" width="150" height="52" rx="8" fill="#F3E9DC" stroke="#D9CFC4" stroke-width="1.3"/>
  <text x="72" y="132" class="t" font-size="13" font-weight="700">鼓</text>
  <rect x="60" y="174" width="150" height="52" rx="8" fill="#F3E9DC" stroke="#D9CFC4" stroke-width="1.3"/>
  <text x="72" y="196" class="t" font-size="13" font-weight="700">貝斯</text>
  <rect x="60" y="238" width="150" height="52" rx="8" fill="#F3E9DC" stroke="#D9CFC4" stroke-width="1.3"/>
  <text x="72" y="260" class="t" font-size="13" font-weight="700">人聲</text>
  <rect x="250" y="110" width="150" height="52" rx="8" fill="#F3E9DC" stroke="#D9CFC4" stroke-width="1.3"/>
  <text x="262" y="132" class="t" font-size="13" font-weight="700">吉他／鍵盤</text>
  <rect x="250" y="174" width="150" height="52" rx="8" fill="#F3E9DC" stroke="#D9CFC4" stroke-width="1.3"/>
  <text x="262" y="196" class="t" font-size="13" font-weight="700">效果／氛圍</text>
  <path d="M400.0 200.0 L434.6 200.0" fill="none" stroke="#8C8078" stroke-width="1.7" stroke-linecap="round"/><path d="M440.0 200.0 L434.5 202.4 L434.5 197.6 Z" fill="#8C8078"/>
  <rect x="444" y="168" width="90" height="64" rx="8" fill="#E4EBDC" stroke="#D9CFC4" stroke-width="1.3"/>
  <text x="456" y="190" class="t" font-size="13" font-weight="700">Master</text>
  <text x="456" y="209" class="ts" font-size="11">2 軌</text>
  <text x="26" y="320" class="ts" font-size="11">Stem 交出去時：不加母帶處理、檔頭對齊、峰值 −6 dBFS。</text>
</svg>
