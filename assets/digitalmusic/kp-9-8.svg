<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 460" role="img" aria-label="處理剪輯邊界的 Click 與 Pop">
  <title>處理剪輯邊界的 Click 與 Pop</title>
  <rect width="660" height="460" fill="#FBF8F4"/>
  <style>
    .t   { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; }
    .tb  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; font-weight: 700; }
    .ts  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #8C8078; }
    .num { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #FFFFFF; font-weight: 700; font-size: 11px; }
    .ink { fill: none; stroke: #3D3229; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; }
    .thin{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; }
    .dash{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; stroke-dasharray: 4 5; }
    .lead{ fill: none; stroke: #8C8078; stroke-width: 1; }
    .acc { fill: none; stroke: #A67C52; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .blue{ fill: none; stroke: #6B8FBF; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .green{ fill: none; stroke: #6F8F6A; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .red { fill: none; stroke: #B0563F; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .dot { fill: #3D3229; }
  </style>
  <text x="26" y="34" class="tb" font-size="16">處理剪輯邊界的 Click 與 Pop</text>
  <text x="26" y="55" class="ts" font-size="12.5">把這一節的重點排在一起</text>
  <rect x="26.0" y="96" width="295.0" height="96" rx="9" fill="#F3E9DC" stroke="#D9CFC4" stroke-width="1.4"/>  <circle cx="40.0" cy="116" r="10" fill="#A67C52"/>  <text x="40.0" y="120" text-anchor="middle" class="num">1</text>  <text x="60.0" y="121" class="t" font-size="12" font-weight="700">波形被零點以外切斷</text>  <text x="40.0" y="144" class="ts" font-size="9.5" fill="#8C8078">音訊波形在非零點處被截斷，產生</text>  <text x="40.0" y="160" class="ts" font-size="9.5" fill="#8C8078">瞬間的波形不連續（stepdi</text>  <text x="40.0" y="176" class="ts" font-size="9.5" fill="#8C8078">scontinuity），激</text>  <rect x="339.0" y="96" width="295.0" height="96" rx="9" fill="#F3E9DC" stroke="#D9CFC4" stroke-width="1.4"/>  <circle cx="353.0" cy="116" r="10" fill="#A67C52"/>  <text x="353.0" y="120" text-anchor="middle" class="num">2</text>  <text x="373.0" y="121" class="t" font-size="12" font-weight="700">相位不連續</text>  <text x="353.0" y="144" class="ts" font-size="9.5" fill="#8C8078">兩個片段的波形在接點處的相位相</text>  <text x="353.0" y="160" class="ts" font-size="9.5" fill="#8C8078">差太大。</text>  <rect x="26.0" y="206" width="295.0" height="96" rx="9" fill="#F3E9DC" stroke="#D9CFC4" stroke-width="1.4"/>  <circle cx="40.0" cy="226" r="10" fill="#A67C52"/>  <text x="40.0" y="230" text-anchor="middle" class="num">3</text>  <text x="60.0" y="231" class="t" font-size="12" font-weight="700">數位削波</text>  <text x="40.0" y="254" class="ts" font-size="9.5" fill="#8C8078">片段邊界處原本就有超過0dBF</text>  <text x="40.0" y="270" class="ts" font-size="9.5" fill="#8C8078">S的瞬間峰值。</text>  <rect x="339.0" y="206" width="295.0" height="96" rx="9" fill="#F3E9DC" stroke="#D9CFC4" stroke-width="1.4"/>  <circle cx="353.0" cy="226" r="10" fill="#A67C52"/>  <text x="353.0" y="230" text-anchor="middle" class="num">4</text>  <text x="373.0" y="231" class="t" font-size="12" font-weight="700">最簡單的方法</text>  <text x="353.0" y="254" class="ts" font-size="9.5" fill="#8C8078">在任何剪輯點上建立一個1-3m</text>  <text x="353.0" y="270" class="ts" font-size="9.5" fill="#8C8078">s的微小Crossfade。</text>  <rect x="26.0" y="316" width="295.0" height="96" rx="9" fill="#F3E9DC" stroke="#D9CFC4" stroke-width="1.4"/>  <circle cx="40.0" cy="336" r="10" fill="#A67C52"/>  <text x="40.0" y="340" text-anchor="middle" class="num">5</text>  <text x="60.0" y="341" class="t" font-size="12" font-weight="700">進階方法</text>  <text x="40.0" y="364" class="ts" font-size="9.5" fill="#8C8078">放大波形到樣本層級（Sampl</text>  <text x="40.0" y="380" class="ts" font-size="9.5" fill="#8C8078">eLevel），在剪輯點附近找</text>  <text x="40.0" y="396" class="ts" font-size="9.5" fill="#8C8078">到波形的零點交叉處（Zero</text>  <rect x="339.0" y="316" width="295.0" height="96" rx="9" fill="#F3E9DC" stroke="#D9CFC4" stroke-width="1.4"/>  <circle cx="353.0" cy="336" r="10" fill="#A67C52"/>  <text x="353.0" y="340" text-anchor="middle" class="num">6</text>  <text x="373.0" y="341" class="t" font-size="12" font-weight="700">針對殘留Click</text>  <text x="353.0" y="364" class="ts" font-size="9.5" fill="#8C8078">如果做完Crossfade後仍</text>  <text x="353.0" y="380" class="ts" font-size="9.5" fill="#8C8078">有Click，使用ClipGa</text>  <text x="353.0" y="396" class="ts" font-size="9.5" fill="#8C8078">in（片段增益）將該處的音量</text>
</svg>
