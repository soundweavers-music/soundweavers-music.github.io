<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 460" role="img" aria-label="四、空間效果：Reverb 與 Delay 的藝術">
  <title>四、空間效果：Reverb 與 Delay 的藝術</title>
  <rect width="660" height="460" fill="#FBF8F4"/>
  <style>
    .t   { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; }
    .tb  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; font-weight: 700; }
    .ts  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #8C8078; }
    .num { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #FFFFFF; font-weight: 700; font-size: 11px; }
    .ink { fill: none; stroke: #3D3229; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; }
    .thin{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; }
    .dash{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; stroke-dasharray: 4 5; }
    .lead{ fill: none; stroke: #8C8078; stroke-width: 1; }
    .acc { fill: none; stroke: #A67C52; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .blue{ fill: none; stroke: #6B8FBF; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .green{ fill: none; stroke: #6F8F6A; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .red { fill: none; stroke: #B0563F; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .dot { fill: #3D3229; }
  </style>
  <text x="26" y="34" class="tb" font-size="16">四、空間效果：Reverb 與 Delay 的藝術</text>
  <text x="26" y="55" class="ts" font-size="12.5">把這一節的重點排在一起</text>
  <rect x="26.0" y="96" width="295.0" height="96" rx="9" fill="#F3E9DC" stroke="#D9CFC4" stroke-width="1.4"/>  <circle cx="40.0" cy="116" r="10" fill="#A67C52"/>  <text x="40.0" y="120" text-anchor="middle" class="num">1</text>  <text x="60.0" y="121" class="t" font-size="12" font-weight="700">短板RoomReverb</text>  <text x="40.0" y="144" class="ts" font-size="9.5" fill="#8C8078">（decay0.5–1.2秒）</text>  <text x="40.0" y="160" class="ts" font-size="9.5" fill="#8C8078">：用於鼓組和節奏吉他，模擬小型</text>  <text x="40.0" y="176" class="ts" font-size="9.5" fill="#8C8078">錄音室的自然空間。</text>  <rect x="339.0" y="96" width="295.0" height="96" rx="9" fill="#F3E9DC" stroke="#D9CFC4" stroke-width="1.4"/>  <circle cx="353.0" cy="116" r="10" fill="#A67C52"/>  <text x="353.0" y="120" text-anchor="middle" class="num">2</text>  <text x="373.0" y="121" class="t" font-size="12" font-weight="700">中板HallReverb</text>  <text x="353.0" y="144" class="ts" font-size="9.5" fill="#8C8078">（decay1.5–2.5秒）</text>  <text x="353.0" y="160" class="ts" font-size="9.5" fill="#8C8078">：用於主旋律樂器和lead吉他</text>  <text x="353.0" y="176" class="ts" font-size="9.5" fill="#8C8078">，創造「在一個中型音樂廳中」</text>  <rect x="26.0" y="206" width="295.0" height="96" rx="9" fill="#F3E9DC" stroke="#D9CFC4" stroke-width="1.4"/>  <circle cx="40.0" cy="226" r="10" fill="#A67C52"/>  <text x="40.0" y="230" text-anchor="middle" class="num">3</text>  <text x="60.0" y="231" class="t" font-size="12" font-weight="700">長板Cathedral/S</text>  <text x="40.0" y="254" class="ts" font-size="9.5" fill="#8C8078">（decay4–8秒）：這是後</text>  <text x="40.0" y="270" class="ts" font-size="9.5" fill="#8C8078">搖滾的招牌空間。</text>  <rect x="339.0" y="206" width="295.0" height="96" rx="9" fill="#F3E9DC" stroke="#D9CFC4" stroke-width="1.4"/>  <circle cx="353.0" cy="226" r="10" fill="#A67C52"/>  <text x="353.0" y="230" text-anchor="middle" class="num">4</text>  <text x="373.0" y="231" class="t" font-size="12" font-weight="700">ReverseReverb</text>  <text x="353.0" y="254" class="ts" font-size="9.5" fill="#8C8078">這幾乎是後搖滾的標誌性效果。</text>  <rect x="26.0" y="316" width="295.0" height="96" rx="9" fill="#F3E9DC" stroke="#D9CFC4" stroke-width="1.4"/>  <circle cx="40.0" cy="336" r="10" fill="#A67C52"/>  <text x="40.0" y="340" text-anchor="middle" class="num">5</text>  <text x="60.0" y="341" class="t" font-size="12" font-weight="700">雙軌延遲</text>  <text x="40.0" y="364" class="ts" font-size="9.5" fill="#8C8078">將一個乾淨的延遲send分別送</text>  <text x="40.0" y="380" class="ts" font-size="9.5" fill="#8C8078">至左右聲道，左聲道設為8分音符</text>  <text x="40.0" y="396" class="ts" font-size="9.5" fill="#8C8078">、右聲道設為附點8分音符。</text>  <rect x="339.0" y="316" width="295.0" height="96" rx="9" fill="#F3E9DC" stroke="#D9CFC4" stroke-width="1.4"/>  <circle cx="353.0" cy="336" r="10" fill="#A67C52"/>  <text x="353.0" y="340" text-anchor="middle" class="num">6</text>  <text x="373.0" y="341" class="t" font-size="12" font-weight="700">類比延遲</text>  <text x="353.0" y="364" class="ts" font-size="9.5" fill="#8C8078">使用模擬tapedelay的外</text>  <text x="353.0" y="380" class="ts" font-size="9.5" fill="#8C8078">掛（如EchoBoy、Repl</text>  <text x="353.0" y="396" class="ts" font-size="9.5" fill="#8C8078">ika），加入適量的wow&amp;</text>
</svg>
