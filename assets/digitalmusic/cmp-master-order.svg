<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 354" role="img" aria-label="母帶處理的順序">
  <title>母帶處理的順序</title>
  <rect width="660" height="354" fill="#FBF8F4"/>
  <style>
    .t   { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; }
    .tb  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; font-weight: 700; }
    .ts  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #8C8078; }
    .num { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #FFFFFF; font-weight: 700; font-size: 11px; }
    .ink { fill: none; stroke: #3D3229; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; }
    .thin{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; }
    .dash{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; stroke-dasharray: 4 5; }
    .lead{ fill: none; stroke: #8C8078; stroke-width: 1; }
    .acc { fill: none; stroke: #A67C52; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .blue{ fill: none; stroke: #6B8FBF; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .green{ fill: none; stroke: #6F8F6A; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .red { fill: none; stroke: #B0563F; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .dot { fill: #3D3229; }
  </style>
  <text x="26" y="34" class="tb" font-size="16">母帶處理的順序</text>
  <text x="26" y="55" class="ts" font-size="12.5">順序錯了，後面的處理會一直在補前面的問題</text>
  <text x="150.0" y="92" class="t" font-size="11.5" font-weight="700" fill="#A67C52">做什麼</text>  <text x="395.0" y="92" class="t" font-size="11.5" font-weight="700" fill="#A67C52">為什麼在這</text>  <rect x="26" y="104" width="608" height="58" rx="4" fill="#F3E9DC" opacity="0.55"/>  <text x="34" y="126" class="t" font-size="11.5" font-weight="700">1 修正</text>  <text x="150.0" y="124" class="ts" font-size="10" fill="#5D4E41">修掉極端的低頻與刺耳</text>  <text x="395.0" y="124" class="ts" font-size="10" fill="#5D4E41">先處理問題，再談音量</text>  <text x="34" y="184" class="t" font-size="11.5" font-weight="700">2 動態</text>  <text x="150.0" y="182" class="ts" font-size="10" fill="#5D4E41">壓縮或限制，控制峰值</text>  <text x="395.0" y="182" class="ts" font-size="10" fill="#5D4E41">讓後面的限制器不用做苦工</text>  <rect x="26" y="220" width="608" height="58" rx="4" fill="#F3E9DC" opacity="0.55"/>  <text x="34" y="242" class="t" font-size="11.5" font-weight="700">3 音色</text>  <text x="150.0" y="240" class="ts" font-size="10" fill="#5D4E41">寬度與飽和度微調</text>  <text x="395.0" y="240" class="ts" font-size="10" fill="#5D4E41">讓整體聽起來像同一張專輯</text>  <text x="34" y="300" class="t" font-size="11.5" font-weight="700">4 響度</text>  <text x="150.0" y="298" class="ts" font-size="10" fill="#5D4E41">限制器推到目標</text>  <text x="395.0" y="298" class="ts" font-size="10" fill="#5D4E41">最後一步，前面都沒動它</text>
  <text x="26" y="336" class="ts" font-size="11">每一首歌都照同一個順序做，專輯裡各首歌的差異才不會忽大忽小。</text>
</svg>
