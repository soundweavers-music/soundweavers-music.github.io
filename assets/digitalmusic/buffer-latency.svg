<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 360" role="img" aria-label="緩衝區大小與延遲">
  <title>緩衝區大小與延遲</title>
  <rect width="660" height="360" fill="#FBF8F4"/>
  <style>
    .t   { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; }
    .tb  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; font-weight: 700; }
    .ts  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #8C8078; }
    .num { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #FFFFFF; font-weight: 700; font-size: 11px; }
    .ink { fill: none; stroke: #3D3229; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; }
    .thin{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; }
    .dash{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; stroke-dasharray: 4 5; }
    .lead{ fill: none; stroke: #8C8078; stroke-width: 1; }
    .acc { fill: none; stroke: #A67C52; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .blue{ fill: none; stroke: #6B8FBF; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .green{ fill: none; stroke: #6F8F6A; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .red { fill: none; stroke: #B0563F; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .dot { fill: #3D3229; }
  </style>
  <text x="26" y="34" class="tb" font-size="16">緩衝區大小與延遲</text>
  <text x="26" y="55" class="ts" font-size="12.5">同一台電腦，穩定與即時是交換關係</text>
  <text x="26" y="84" class="ts" font-size="12">緩衝區是一塊一塊處理的；越大越穩，但延遲越長。</text>
  <path d="M60 130 L600 130" class="thin"/>
  <rect x="60" y="104" width="62" height="52" rx="3" fill="#F3E9DC" stroke="#D9CFC4" stroke-width="1.4"/>
  <text x="91" y="134" class="ts" font-size="10" text-anchor="middle" fill="#8C8078">128</text>
  <rect x="128" y="104" width="62" height="52" rx="3" fill="#FFFFFF" stroke="#D9CFC4" stroke-width="1.4"/>
  <text x="159" y="134" class="ts" font-size="10" text-anchor="middle" fill="#8C8078">128</text>
  <rect x="196" y="104" width="62" height="52" rx="3" fill="#F3E9DC" stroke="#D9CFC4" stroke-width="1.4"/>
  <text x="227" y="134" class="ts" font-size="10" text-anchor="middle" fill="#8C8078">128</text>
  <rect x="264" y="104" width="62" height="52" rx="3" fill="#FFFFFF" stroke="#D9CFC4" stroke-width="1.4"/>
  <text x="295" y="134" class="ts" font-size="10" text-anchor="middle" fill="#8C8078">128</text>
  <rect x="332" y="104" width="62" height="52" rx="3" fill="#F3E9DC" stroke="#D9CFC4" stroke-width="1.4"/>
  <text x="363" y="134" class="ts" font-size="10" text-anchor="middle" fill="#8C8078">128</text>
  <rect x="400" y="104" width="62" height="52" rx="3" fill="#FFFFFF" stroke="#D9CFC4" stroke-width="1.4"/>
  <text x="431" y="134" class="ts" font-size="10" text-anchor="middle" fill="#8C8078">128</text>
  <rect x="468" y="104" width="62" height="52" rx="3" fill="#F3E9DC" stroke="#D9CFC4" stroke-width="1.4"/>
  <text x="499" y="134" class="ts" font-size="10" text-anchor="middle" fill="#8C8078">128</text>
  <rect x="536" y="104" width="62" height="52" rx="3" fill="#FFFFFF" stroke="#D9CFC4" stroke-width="1.4"/>
  <text x="567" y="134" class="ts" font-size="10" text-anchor="middle" fill="#8C8078">128</text>
  <text x="330" y="176" class="ts" font-size="10.5" text-anchor="middle">每一格＝一個緩衝區（sample 數）</text>
  <rect x="60" y="200" width="12" height="12" rx="2" fill="#6F8F6A" opacity="0.5"/>
  <text x="84" y="212" class="t" font-size="11.5">64 samples　來回約 2.7 ms</text>
  <rect x="60" y="232" width="12" height="12" rx="2" fill="#A67C52" opacity="0.5"/>
  <text x="84" y="244" class="t" font-size="11.5">128 samples　來回約 5.3 ms</text>
  <rect x="60" y="264" width="12" height="12" rx="2" fill="#6B8FBF" opacity="0.5"/>
  <text x="84" y="276" class="t" font-size="11.5">256 samples　來回約 10.7 ms</text>
  <rect x="60" y="296" width="12" height="12" rx="2" fill="#B0563F" opacity="0.5"/>
  <text x="84" y="308" class="t" font-size="11.5">512 samples　來回約 21.3 ms</text>
  <text x="360" y="214" class="ts" font-size="12" fill="#3D3229">延遲 = 緩衝區 ÷ 取樣率 × 2</text>
  <text x="360" y="236" class="ts" font-size="10.5">（輸入一次、輸出一次）</text>
  <text x="360" y="276" class="ts" font-size="11">48 kHz、128 samples →</text>
  <text x="360" y="296" class="ts" font-size="11">約 2.7 ms 單程、5.3 ms 來回</text>
  <text x="26" y="342" class="ts" font-size="11">錄音時把緩衝區壓小、把外掛關掉；混音時再放大讓它跑得動。</text>
</svg>
