<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 460" role="img" aria-label="如何使用參考曲目（Reference Tracks）">
  <title>如何使用參考曲目（Reference Tracks）</title>
  <rect width="660" height="460" fill="#FBF8F4"/>
  <style>
    .t   { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; }
    .tb  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; font-weight: 700; }
    .ts  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #8C8078; }
    .num { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #FFFFFF; font-weight: 700; font-size: 11px; }
    .ink { fill: none; stroke: #3D3229; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; }
    .thin{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; }
    .dash{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; stroke-dasharray: 4 5; }
    .lead{ fill: none; stroke: #8C8078; stroke-width: 1; }
    .acc { fill: none; stroke: #A67C52; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .blue{ fill: none; stroke: #6B8FBF; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .green{ fill: none; stroke: #6F8F6A; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .red { fill: none; stroke: #B0563F; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .dot { fill: #3D3229; }
  </style>
  <text x="26" y="34" class="tb" font-size="16">如何使用參考曲目（Reference Tracks）</text>
  <text x="26" y="55" class="ts" font-size="12.5">把這一節的重點排在一起</text>
  <rect x="26.0" y="96" width="295.0" height="96" rx="9" fill="#F3E9DC" stroke="#D9CFC4" stroke-width="1.4"/>  <circle cx="40.0" cy="116" r="10" fill="#A67C52"/>  <text x="40.0" y="120" text-anchor="middle" class="num">1</text>  <text x="60.0" y="121" class="t" font-size="12" font-weight="700">選擇同曲風的歌曲</text>  <text x="40.0" y="144" class="ts" font-size="9.5" fill="#8C8078">不要拿重型金屬來參考民謠彈唱，</text>  <text x="40.0" y="160" class="ts" font-size="9.5" fill="#8C8078">兩者的動態與頻率分布完全不同。</text>  <rect x="339.0" y="96" width="295.0" height="96" rx="9" fill="#F3E9DC" stroke="#D9CFC4" stroke-width="1.4"/>  <circle cx="353.0" cy="116" r="10" fill="#A67C52"/>  <text x="353.0" y="120" text-anchor="middle" class="num">2</text>  <text x="373.0" y="121" class="t" font-size="12" font-weight="700">選擇你信任的混音</text>  <text x="353.0" y="144" class="ts" font-size="9.5" fill="#8C8078">挑選你認為聲音「很棒」的歌曲，</text>  <text x="353.0" y="160" class="ts" font-size="9.5" fill="#8C8078">最好是獲獎或業界公認的經典作品</text>  <text x="353.0" y="176" class="ts" font-size="9.5" fill="#8C8078">。</text>  <rect x="26.0" y="206" width="295.0" height="96" rx="9" fill="#F3E9DC" stroke="#D9CFC4" stroke-width="1.4"/>  <circle cx="40.0" cy="226" r="10" fill="#A67C52"/>  <text x="40.0" y="230" text-anchor="middle" class="num">3</text>  <text x="60.0" y="231" class="t" font-size="12" font-weight="700">準備2-3首參考曲</text>  <text x="40.0" y="254" class="ts" font-size="9.5" fill="#8C8078">單一首可能帶有錄音師的個人偏好</text>  <text x="40.0" y="270" class="ts" font-size="9.5" fill="#8C8078">，多首參考可以找到更客觀的標準</text>  <text x="40.0" y="286" class="ts" font-size="9.5" fill="#8C8078">。</text>  <rect x="339.0" y="206" width="295.0" height="96" rx="9" fill="#F3E9DC" stroke="#D9CFC4" stroke-width="1.4"/>  <circle cx="353.0" cy="226" r="10" fill="#A67C52"/>  <text x="353.0" y="230" text-anchor="middle" class="num">4</text>  <text x="373.0" y="231" class="t" font-size="12" font-weight="700">確保音質一致</text>  <text x="353.0" y="254" class="ts" font-size="9.5" fill="#8C8078">參考曲應使用高品質音源（如44</text>  <text x="353.0" y="270" class="ts" font-size="9.5" fill="#8C8078">.1/16WAV或FLAC，而</text>  <text x="353.0" y="286" class="ts" font-size="9.5" fill="#8C8078">非YouTube壓縮過的串流</text>  <rect x="26.0" y="316" width="295.0" height="96" rx="9" fill="#F3E9DC" stroke="#D9CFC4" stroke-width="1.4"/>  <circle cx="40.0" cy="336" r="10" fill="#A67C52"/>  <text x="40.0" y="340" text-anchor="middle" class="num">5</text>  <text x="60.0" y="341" class="t" font-size="12" font-weight="700">LUFS比較</text>  <text x="40.0" y="364" class="ts" font-size="9.5" fill="#8C8078">使用YouLeanLoudne</text>  <text x="40.0" y="380" class="ts" font-size="9.5" fill="#8C8078">ssMeter或iZotope</text>  <text x="40.0" y="396" class="ts" font-size="9.5" fill="#8C8078">Insight測量參考曲的整</text>  <rect x="339.0" y="316" width="295.0" height="96" rx="9" fill="#F3E9DC" stroke="#D9CFC4" stroke-width="1.4"/>  <circle cx="353.0" cy="336" r="10" fill="#A67C52"/>  <text x="353.0" y="340" text-anchor="middle" class="num">6</text>  <text x="373.0" y="341" class="t" font-size="12" font-weight="700">頻譜比較</text>  <text x="353.0" y="364" class="ts" font-size="9.5" fill="#8C8078">用SPAN（免費）或Ozone</text>  <text x="353.0" y="380" class="ts" font-size="9.5" fill="#8C8078">的TonalBalanceCo</text>  <text x="353.0" y="396" class="ts" font-size="9.5" fill="#8C8078">ntrol查看參考曲的頻譜分</text>
</svg>
