<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 346" role="img" aria-label="手動調音的工作流程：先修大的，再修小的">
  <title>手動調音的工作流程：先修大的，再修小的</title>
  <rect width="660" height="346" fill="#FBF8F4"/>
  <style>
    .t   { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; }
    .tb  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; font-weight: 700; }
    .ts  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #8C8078; }
    .num { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #FFFFFF; font-weight: 700; font-size: 11px; }
    .ink { fill: none; stroke: #3D3229; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; }
    .thin{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; }
    .dash{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; stroke-dasharray: 4 5; }
    .lead{ fill: none; stroke: #8C8078; stroke-width: 1; }
    .acc { fill: none; stroke: #A67C52; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .blue{ fill: none; stroke: #6B8FBF; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .green{ fill: none; stroke: #6F8F6A; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .red { fill: none; stroke: #B0563F; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .dot { fill: #3D3229; }
  </style>
  <text x="26" y="34" class="tb" font-size="16">手動調音的工作流程：先修大的，再修小的</text>
  <text x="26" y="55" class="ts" font-size="12.5">一次只調一個音，調完立刻聽前後兩秒；不要整首掃過去</text>
  <circle cx="38.0" cy="110" r="10" fill="#A67C52"/>  <text x="38.0" y="114" text-anchor="middle" class="num">1</text>  <rect x="26.0" y="96" width="141.5" height="88" rx="9" fill="#F3E9DC" stroke="#D9CFC4" stroke-width="1.4"/>  <text x="36.0" y="140" class="t" font-size="12.5" font-weight="700">標記問題音</text>  <text x="36.0" y="158" class="ts" font-size="9.5" fill="#8C8078">聽一遍，把明顯走音的地</text>  <text x="36.0" y="173" class="ts" font-size="9.5" fill="#8C8078">方留下 marker</text>  <path d="M169.5 140.0 L173.2 140.0" fill="none" stroke="#A67C52" stroke-width="1.7" stroke-linecap="round"/><path d="M179.5 140.0 L173.1 142.9 L173.1 137.1 Z" fill="#A67C52"/>  <circle cx="193.5" cy="110" r="10" fill="#A67C52"/>  <text x="193.5" y="114" text-anchor="middle" class="num">2</text>  <rect x="181.5" y="96" width="141.5" height="88" rx="9" fill="#F3E9DC" stroke="#D9CFC4" stroke-width="1.4"/>  <text x="191.5" y="140" class="t" font-size="12.5" font-weight="700">粗調</text>  <text x="191.5" y="158" class="ts" font-size="9.5" fill="#8C8078">先把差半音以上的拉回來</text>  <path d="M325.0 140.0 L328.7 140.0" fill="none" stroke="#A67C52" stroke-width="1.7" stroke-linecap="round"/><path d="M335.0 140.0 L328.6 142.9 L328.6 137.1 Z" fill="#A67C52"/>  <circle cx="349.0" cy="110" r="10" fill="#A67C52"/>  <text x="349.0" y="114" text-anchor="middle" class="num">3</text>  <rect x="337.0" y="96" width="141.5" height="88" rx="9" fill="#F3E9DC" stroke="#D9CFC4" stroke-width="1.4"/>  <text x="347.0" y="140" class="t" font-size="12.5" font-weight="700">細調</text>  <text x="347.0" y="158" class="ts" font-size="9.5" fill="#8C8078">1～2 個半音內的誤差</text>  <text x="347.0" y="173" class="ts" font-size="9.5" fill="#8C8078">，看音高曲線平不平</text>  <path d="M480.5 140.0 L484.2 140.0" fill="none" stroke="#A67C52" stroke-width="1.7" stroke-linecap="round"/><path d="M490.5 140.0 L484.1 142.9 L484.1 137.1 Z" fill="#A67C52"/>  <circle cx="504.5" cy="110" r="10" fill="#A67C52"/>  <text x="504.5" y="114" text-anchor="middle" class="num">4</text>  <rect x="492.5" y="96" width="141.5" height="88" rx="9" fill="#F3E9DC" stroke="#D9CFC4" stroke-width="1.4"/>  <text x="502.5" y="140" class="t" font-size="12.5" font-weight="700">修抖音</text>  <text x="502.5" y="158" class="ts" font-size="9.5" fill="#8C8078">把抖動的幅度縮小，保留</text>  <text x="502.5" y="173" class="ts" font-size="9.5" fill="#8C8078">頻率</text>  <circle cx="38.0" cy="232" r="10" fill="#A67C52"/>  <text x="38.0" y="236" text-anchor="middle" class="num">5</text>  <rect x="26.0" y="218" width="141.5" height="88" rx="9" fill="#F3E9DC" stroke="#D9CFC4" stroke-width="1.4"/>  <text x="36.0" y="262" class="t" font-size="12.5" font-weight="700">回聽</text>  <text x="36.0" y="280" class="ts" font-size="9.5" fill="#8C8078">整段播一次，確認沒有不</text>  <text x="36.0" y="295" class="ts" font-size="9.5" fill="#8C8078">自然的跳動</text>
  <text x="26" y="328" class="ts" font-size="11">修完一定要從頭聽：單獨聽都對，連起來聽才聽得出來「太機械」。</text>
</svg>
