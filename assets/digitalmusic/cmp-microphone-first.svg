<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 296" role="img" aria-label="麥克風擺位的核心邏輯">
  <title>麥克風擺位的核心邏輯</title>
  <rect width="660" height="296" fill="#FBF8F4"/>
  <style>
    .t   { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; }
    .tb  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; font-weight: 700; }
    .ts  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #8C8078; }
    .num { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #FFFFFF; font-weight: 700; font-size: 11px; }
    .ink { fill: none; stroke: #3D3229; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; }
    .thin{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; }
    .dash{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; stroke-dasharray: 4 5; }
    .lead{ fill: none; stroke: #8C8078; stroke-width: 1; }
    .acc { fill: none; stroke: #A67C52; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .blue{ fill: none; stroke: #6B8FBF; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .green{ fill: none; stroke: #6F8F6A; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .red { fill: none; stroke: #B0563F; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .dot { fill: #3D3229; }
  </style>
  <text x="26" y="34" class="tb" font-size="16">麥克風擺位的核心邏輯</text>
  <text x="26" y="55" class="ts" font-size="12.5">擺位解決的問題，EQ 只能在事後補救</text>
  <text x="150.0" y="92" class="t" font-size="11.5" font-weight="700" fill="#A67C52">意思</text>  <text x="395.0" y="92" class="t" font-size="11.5" font-weight="700" fill="#A67C52">實作</text>  <rect x="26" y="104" width="608" height="58" rx="4" fill="#F3E9DC" opacity="0.55"/>  <text x="34" y="126" class="t" font-size="11.5" font-weight="700">先決定距離</text>  <text x="150.0" y="124" class="ts" font-size="10" fill="#5D4E41">近＝乾、遠＝空間</text>  <text x="395.0" y="124" class="ts" font-size="10" fill="#5D4E41">人聲 15–25 cm</text>  <text x="34" y="184" class="t" font-size="11.5" font-weight="700">再決定角度</text>  <text x="150.0" y="182" class="ts" font-size="10" fill="#5D4E41">正軸最亮、離軸最柔</text>  <text x="395.0" y="182" class="ts" font-size="10" fill="#5D4E41">偏 15–30 度降噴麥</text>  <rect x="26" y="220" width="608" height="58" rx="4" fill="#F3E9DC" opacity="0.55"/>  <text x="34" y="242" class="t" font-size="11.5" font-weight="700">最後才用 EQ</text>  <text x="150.0" y="240" class="ts" font-size="10" fill="#5D4E41">EQ 補不回的，擺位可以</text>  <text x="395.0" y="240" class="ts" font-size="10" fill="#5D4E41">先重錄再修</text>
  <text x="26" y="278" class="ts" font-size="11">能重錄就重錄：修一個錄壞的軌道，花的時間通常比重錄多。</text>
</svg>
