<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 460" role="img" aria-label="六、Chorus 的實際應用">
  <title>六、Chorus 的實際應用</title>
  <rect width="660" height="460" fill="#FBF8F4"/>
  <style>
    .t   { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; }
    .tb  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; font-weight: 700; }
    .ts  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #8C8078; }
    .num { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #FFFFFF; font-weight: 700; font-size: 11px; }
    .ink { fill: none; stroke: #3D3229; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; }
    .thin{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; }
    .dash{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; stroke-dasharray: 4 5; }
    .lead{ fill: none; stroke: #8C8078; stroke-width: 1; }
    .acc { fill: none; stroke: #A67C52; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .blue{ fill: none; stroke: #6B8FBF; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .green{ fill: none; stroke: #6F8F6A; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .red { fill: none; stroke: #B0563F; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .dot { fill: #3D3229; }
  </style>
  <text x="26" y="34" class="tb" font-size="16">六、Chorus 的實際應用</text>
  <text x="26" y="55" class="ts" font-size="12.5">把這一節的重點排在一起</text>
  <rect x="26.0" y="96" width="295.0" height="96" rx="9" fill="#F3E9DC" stroke="#D9CFC4" stroke-width="1.4"/>  <circle cx="40.0" cy="116" r="10" fill="#A67C52"/>  <text x="40.0" y="120" text-anchor="middle" class="num">1</text>  <text x="60.0" y="121" class="t" font-size="12" font-weight="700">Clean節奏吉他</text>  <text x="40.0" y="144" class="ts" font-size="9.5" fill="#8C8078">Rate0.4~0.8Hz，D</text>  <text x="40.0" y="160" class="ts" font-size="9.5" fill="#8C8078">epth30~50%，可搭配輕</text>  <text x="40.0" y="176" class="ts" font-size="9.5" fill="#8C8078">微Reverb營造夢幻感</text>  <rect x="339.0" y="96" width="295.0" height="96" rx="9" fill="#F3E9DC" stroke="#D9CFC4" stroke-width="1.4"/>  <circle cx="353.0" cy="116" r="10" fill="#A67C52"/>  <text x="353.0" y="120" text-anchor="middle" class="num">2</text>  <text x="373.0" y="121" class="t" font-size="12" font-weight="700">CleanArpeggio</text>  <text x="353.0" y="144" class="ts" font-size="9.5" fill="#8C8078">Rate0.3~0.5Hz，D</text>  <text x="353.0" y="160" class="ts" font-size="9.5" fill="#8C8078">epth25~40%，讓分解和</text>  <text x="353.0" y="176" class="ts" font-size="9.5" fill="#8C8078">弦如流水般滑動</text>  <rect x="26.0" y="206" width="295.0" height="96" rx="9" fill="#F3E9DC" stroke="#D9CFC4" stroke-width="1.4"/>  <circle cx="40.0" cy="226" r="10" fill="#A67C52"/>  <text x="40.0" y="230" text-anchor="middle" class="num">3</text>  <text x="60.0" y="231" class="t" font-size="12" font-weight="700">Distortion吉他</text>  <text x="40.0" y="254" class="ts" font-size="9.5" fill="#8C8078">Chorus放在破音前效果較柔</text>  <text x="40.0" y="270" class="ts" font-size="9.5" fill="#8C8078">和，放在破音後效果較強烈但容易</text>  <text x="40.0" y="286" class="ts" font-size="9.5" fill="#8C8078">產生噪音</text>  <rect x="339.0" y="206" width="295.0" height="96" rx="9" fill="#F3E9DC" stroke="#D9CFC4" stroke-width="1.4"/>  <circle cx="353.0" cy="226" r="10" fill="#A67C52"/>  <text x="353.0" y="230" text-anchor="middle" class="num">4</text>  <text x="373.0" y="231" class="t" font-size="12" font-weight="700">Pad音色</text>  <text x="353.0" y="254" class="ts" font-size="9.5" fill="#8C8078">Chorus讓合成器Pad從單</text>  <text x="353.0" y="270" class="ts" font-size="9.5" fill="#8C8078">薄變成浩瀚的音牆</text>  <rect x="26.0" y="316" width="295.0" height="96" rx="9" fill="#F3E9DC" stroke="#D9CFC4" stroke-width="1.4"/>  <circle cx="40.0" cy="336" r="10" fill="#A67C52"/>  <text x="40.0" y="340" text-anchor="middle" class="num">5</text>  <text x="60.0" y="341" class="t" font-size="12" font-weight="700">Lead音色</text>  <text x="40.0" y="364" class="ts" font-size="9.5" fill="#8C8078">微量的Chorus讓主旋律線條</text>  <text x="40.0" y="380" class="ts" font-size="9.5" fill="#8C8078">更加流暢、有延展性</text>  <rect x="339.0" y="316" width="295.0" height="96" rx="9" fill="#F3E9DC" stroke="#D9CFC4" stroke-width="1.4"/>  <circle cx="353.0" cy="336" r="10" fill="#A67C52"/>  <text x="353.0" y="340" text-anchor="middle" class="num">6</text>  <text x="373.0" y="341" class="t" font-size="12" font-weight="700">Bass音色</text>  <text x="353.0" y="364" class="ts" font-size="9.5" fill="#8C8078">謹慎使用，過多的Chorus會</text>  <text x="353.0" y="380" class="ts" font-size="9.5" fill="#8C8078">讓低頻變得模糊，建議僅在200</text>  <text x="353.0" y="396" class="ts" font-size="9.5" fill="#8C8078">Hz以上增加Chorus</text>
</svg>
