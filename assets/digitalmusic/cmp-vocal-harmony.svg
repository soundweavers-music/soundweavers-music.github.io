<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 296" role="img" aria-label="和聲編排：三種常見排法">
  <title>和聲編排：三種常見排法</title>
  <rect width="660" height="296" fill="#FBF8F4"/>
  <style>
    .t   { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; }
    .tb  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; font-weight: 700; }
    .ts  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #8C8078; }
    .num { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #FFFFFF; font-weight: 700; font-size: 11px; }
    .ink { fill: none; stroke: #3D3229; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; }
    .thin{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; }
    .dash{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; stroke-dasharray: 4 5; }
    .lead{ fill: none; stroke: #8C8078; stroke-width: 1; }
    .acc { fill: none; stroke: #A67C52; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .blue{ fill: none; stroke: #6B8FBF; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .green{ fill: none; stroke: #6F8F6A; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .red { fill: none; stroke: #B0563F; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .dot { fill: #3D3229; }
  </style>
  <text x="26" y="34" class="tb" font-size="16">和聲編排：三種常見排法</text>
  <text x="26" y="55" class="ts" font-size="12.5">和聲不是把人聲複製貼上，是分配音高</text>
  <text x="150.0" y="92" class="t" font-size="11.5" font-weight="700" fill="#A67C52">音程</text>  <text x="395.0" y="92" class="t" font-size="11.5" font-weight="700" fill="#A67C52">聽感</text>  <rect x="26" y="104" width="608" height="58" rx="4" fill="#F3E9DC" opacity="0.55"/>  <text x="34" y="126" class="t" font-size="11.5" font-weight="700">三度</text>  <text x="150.0" y="124" class="ts" font-size="10" fill="#5D4E41">主唱上方 3 度</text>  <text x="395.0" y="124" class="ts" font-size="10" fill="#5D4E41">最常見、最自然</text>  <text x="34" y="184" class="t" font-size="11.5" font-weight="700">五度</text>  <text x="150.0" y="182" class="ts" font-size="10" fill="#5D4E41">上方 5 度</text>  <text x="395.0" y="182" class="ts" font-size="10" fill="#5D4E41">空、開闊，容易太明顯</text>  <rect x="26" y="220" width="608" height="58" rx="4" fill="#F3E9DC" opacity="0.55"/>  <text x="34" y="242" class="t" font-size="11.5" font-weight="700">八度</text>  <text x="150.0" y="240" class="ts" font-size="10" fill="#5D4E41">同音高八度</text>  <text x="395.0" y="240" class="ts" font-size="10" fill="#5D4E41">加厚，不改變和聲</text>
  <text x="26" y="278" class="ts" font-size="11">和聲要先修音準再做效果；不準的和聲會讓整個混音變糊。</text>
</svg>
