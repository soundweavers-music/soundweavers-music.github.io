<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 460" role="img" aria-label="True Peak：真實峰值的重要性">
  <title>True Peak：真實峰值的重要性</title>
  <rect width="660" height="460" fill="#FBF8F4"/>
  <style>
    .t   { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; }
    .tb  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; font-weight: 700; }
    .ts  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #8C8078; }
    .num { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #FFFFFF; font-weight: 700; font-size: 11px; }
    .ink { fill: none; stroke: #3D3229; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; }
    .thin{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; }
    .dash{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; stroke-dasharray: 4 5; }
    .lead{ fill: none; stroke: #8C8078; stroke-width: 1; }
    .acc { fill: none; stroke: #A67C52; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .blue{ fill: none; stroke: #6B8FBF; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .green{ fill: none; stroke: #6F8F6A; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .red { fill: none; stroke: #B0563F; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .dot { fill: #3D3229; }
  </style>
  <text x="26" y="34" class="tb" font-size="16">True Peak：真實峰值的重要性</text>
  <text x="26" y="55" class="ts" font-size="12.5">把這一節的重點排在一起</text>
  <rect x="26.0" y="96" width="295.0" height="96" rx="9" fill="#F3E9DC" stroke="#D9CFC4" stroke-width="1.4"/>  <circle cx="40.0" cy="116" r="10" fill="#A67C52"/>  <text x="40.0" y="120" text-anchor="middle" class="num">1</text>  <text x="60.0" y="121" class="t" font-size="12" font-weight="700">SamplePeak</text>  <text x="40.0" y="144" class="ts" font-size="9.5" fill="#8C8078">只檢查取樣點（Sample）的</text>  <text x="40.0" y="160" class="ts" font-size="9.5" fill="#8C8078">振幅。</text>  <rect x="339.0" y="96" width="295.0" height="96" rx="9" fill="#F3E9DC" stroke="#D9CFC4" stroke-width="1.4"/>  <circle cx="353.0" cy="116" r="10" fill="#A67C52"/>  <text x="353.0" y="120" text-anchor="middle" class="num">2</text>  <text x="373.0" y="121" class="t" font-size="12" font-weight="700">TruePeak</text>  <text x="353.0" y="144" class="ts" font-size="9.5" fill="#8C8078">透過超取樣（Oversampl</text>  <text x="353.0" y="160" class="ts" font-size="9.5" fill="#8C8078">ing）重建類比波形，找出「真</text>  <text x="353.0" y="176" class="ts" font-size="9.5" fill="#8C8078">實」的最高點。</text>  <rect x="26.0" y="206" width="295.0" height="96" rx="9" fill="#F3E9DC" stroke="#D9CFC4" stroke-width="1.4"/>  <circle cx="40.0" cy="226" r="10" fill="#A67C52"/>  <text x="40.0" y="230" text-anchor="middle" class="num">3</text>  <text x="60.0" y="231" class="t" font-size="12" font-weight="700">編碼器失真</text>  <text x="40.0" y="254" class="ts" font-size="9.5" fill="#8C8078">壓縮成AAC、MP3或OGG等</text>  <text x="40.0" y="270" class="ts" font-size="9.5" fill="#8C8078">有損格式時，編碼器會重新取樣計</text>  <text x="40.0" y="286" class="ts" font-size="9.5" fill="#8C8078">算，可能將隱藏的TruePe</text>  <rect x="339.0" y="206" width="295.0" height="96" rx="9" fill="#F3E9DC" stroke="#D9CFC4" stroke-width="1.4"/>  <circle cx="353.0" cy="226" r="10" fill="#A67C52"/>  <text x="353.0" y="230" text-anchor="middle" class="num">4</text>  <text x="373.0" y="231" class="t" font-size="12" font-weight="700">串流平台的規範</text>  <text x="353.0" y="254" class="ts" font-size="9.5" fill="#8C8078">AppleMusic要求Tru</text>  <text x="353.0" y="270" class="ts" font-size="9.5" fill="#8C8078">ePeak不超過-1dBTP，</text>  <text x="353.0" y="286" class="ts" font-size="9.5" fill="#8C8078">Spotify建議低於−1d</text>  <rect x="26.0" y="316" width="295.0" height="96" rx="9" fill="#F3E9DC" stroke="#D9CFC4" stroke-width="1.4"/>  <circle cx="40.0" cy="336" r="10" fill="#A67C52"/>  <text x="40.0" y="340" text-anchor="middle" class="num">5</text>  <text x="60.0" y="341" class="t" font-size="12" font-weight="700">類比設備保護</text>  <text x="40.0" y="364" class="ts" font-size="9.5" fill="#8C8078">如果最終要轉換為類比訊號（黑膠</text>  <text x="40.0" y="380" class="ts" font-size="9.5" fill="#8C8078">、廣播），TruePeak超標</text>  <text x="40.0" y="396" class="ts" font-size="9.5" fill="#8C8078">會直接導致功率放大器過載。</text>
</svg>
