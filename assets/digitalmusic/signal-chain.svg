<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400" role="img" aria-label="訊號鏈上的每一次轉換">
  <title>訊號鏈上的每一次轉換</title>
  <rect width="660" height="400" fill="#FBF8F4"/>
  <style>
    .t   { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; }
    .tb  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; font-weight: 700; }
    .ts  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #8C8078; }
    .num { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #FFFFFF; font-weight: 700; font-size: 11px; }
    .ink { fill: none; stroke: #3D3229; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; }
    .thin{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; }
    .dash{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; stroke-dasharray: 4 5; }
    .lead{ fill: none; stroke: #8C8078; stroke-width: 1; }
    .acc { fill: none; stroke: #A67C52; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .blue{ fill: none; stroke: #6B8FBF; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .green{ fill: none; stroke: #6F8F6A; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .red { fill: none; stroke: #B0563F; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .dot { fill: #3D3229; }
  </style>
  <text x="26" y="34" class="tb" font-size="16">訊號鏈上的每一次轉換</text>
  <text x="26" y="55" class="ts" font-size="12.5">麥克風、介面、DAW、監聽各自改變了什麼</text>
  <text x="26" y="82" class="ts" font-size="12">聲音從嘴巴到耳朵，中間每一站都會改一次它的樣子。</text>
  <rect x="40" y="108" width="86" height="74" rx="8" fill="#FFFFFF" stroke="#6B8FBF" stroke-width="1.6"/>
  <text x="83" y="133" class="t" font-size="12.5" text-anchor="middle" font-weight="700">聲音</text>
  <text x="83" y="154" class="ts" font-size="10" text-anchor="middle">類比・空氣振動</text>
  <text x="83" y="172" class="ts" font-size="9.5" text-anchor="middle" fill="#6B8FBF">類比</text>
  <path d="M128.0 145.0 L138.6 145.0" fill="none" stroke="#8C8078" stroke-width="1.7" stroke-linecap="round"/><path d="M144.0 145.0 L138.5 147.4 L138.5 142.6 Z" fill="#8C8078"/>
  <rect x="148" y="108" width="86" height="74" rx="8" fill="#FFFFFF" stroke="#6B8FBF" stroke-width="1.6"/>
  <text x="191" y="133" class="t" font-size="12.5" text-anchor="middle" font-weight="700">麥克風</text>
  <text x="191" y="154" class="ts" font-size="10" text-anchor="middle">聲→電</text>
  <text x="191" y="172" class="ts" font-size="9.5" text-anchor="middle" fill="#6B8FBF">類比</text>
  <path d="M236.0 145.0 L246.6 145.0" fill="none" stroke="#8C8078" stroke-width="1.7" stroke-linecap="round"/><path d="M252.0 145.0 L246.5 147.4 L246.5 142.6 Z" fill="#8C8078"/>
  <rect x="256" y="108" width="86" height="74" rx="8" fill="#FFFFFF" stroke="#A67C52" stroke-width="1.6"/>
  <text x="299" y="133" class="t" font-size="12.5" text-anchor="middle" font-weight="700">麥克風線</text>
  <text x="299" y="154" class="ts" font-size="10" text-anchor="middle">平衡 XLR</text>
  <text x="299" y="172" class="ts" font-size="9.5" text-anchor="middle" fill="#A67C52">類比</text>
  <path d="M344.0 145.0 L362.6 145.0" fill="none" stroke="#8C8078" stroke-width="1.7" stroke-linecap="round"/><path d="M368.0 145.0 L362.5 147.4 L362.5 142.6 Z" fill="#8C8078"/>
  <rect x="372" y="108" width="86" height="74" rx="8" fill="#FFFFFF" stroke="#A67C52" stroke-width="1.6"/>
  <text x="415" y="133" class="t" font-size="12.5" text-anchor="middle" font-weight="700">錄音介面</text>
  <text x="415" y="154" class="ts" font-size="10" text-anchor="middle">類比→數位</text>
  <text x="415" y="172" class="ts" font-size="9.5" text-anchor="middle" fill="#A67C52">轉數位</text>
  <path d="M460.0 145.0 L470.6 145.0" fill="none" stroke="#8C8078" stroke-width="1.7" stroke-linecap="round"/><path d="M476.0 145.0 L470.5 147.4 L470.5 142.6 Z" fill="#8C8078"/>
  <rect x="480" y="108" width="86" height="74" rx="8" fill="#FFFFFF" stroke="#6F8F6A" stroke-width="1.6"/>
  <text x="523" y="133" class="t" font-size="12.5" text-anchor="middle" font-weight="700">DAW</text>
  <text x="523" y="154" class="ts" font-size="10" text-anchor="middle">編輯・混音</text>
  <text x="523" y="172" class="ts" font-size="9.5" text-anchor="middle" fill="#6F8F6A">數位</text>
  <path d="M568.0 145.0 L564.6 145.0" fill="none" stroke="#8C8078" stroke-width="1.7" stroke-linecap="round"/><path d="M570.0 145.0 L564.5 147.4 L564.5 142.6 Z" fill="#8C8078"/>
  <rect x="574" y="108" width="86" height="74" rx="8" fill="#FFFFFF" stroke="#6F8F6A" stroke-width="1.6"/>
  <text x="617" y="133" class="t" font-size="12.5" text-anchor="middle" font-weight="700">耳機／喇叭</text>
  <text x="617" y="154" class="ts" font-size="10" text-anchor="middle">數位→類比</text>
  <text x="617" y="172" class="ts" font-size="9.5" text-anchor="middle" fill="#6F8F6A">轉類比</text>
  <rect x="40" y="206" width="250" height="46" rx="6" fill="#DEE8F3" opacity="0.75"/>
  <rect x="300" y="206" width="170" height="46" rx="6" fill="#F3E9DC" opacity="0.75"/>
  <rect x="480" y="206" width="160" height="46" rx="6" fill="#E4EBDC" opacity="0.75"/>
  <text x="48" y="234" class="ts" font-size="10.5" fill="#6B8FBF">電壓連續：怕干擾</text>
  <text x="308" y="234" class="ts" font-size="10.5" fill="#A67C52">0 與 1：可完美複製</text>
  <text x="488" y="234" class="ts" font-size="10" fill="#6F8F6A">回到電壓才推得動耳機</text>
  <text x="26" y="288" class="ts" font-size="11.5">鏈上任何一段有雜訊，後面都會一起被放大；所以先顧好收音與線材。</text>
  <text x="26" y="312" class="ts" font-size="11.5" fill="#8C8078">兩次類比／數位轉換就是兩次失真機會，能少一次就少一次。</text>
  <text x="26" y="382" class="ts" font-size="11">監聽的品質決定你能不能聽見問題；聽不到，就調不出來。</text>
</svg>
