<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 354" role="img" aria-label="多頻段壓縮與單頻段壓縮">
  <title>多頻段壓縮與單頻段壓縮</title>
  <rect width="660" height="354" fill="#FBF8F4"/>
  <style>
    .t   { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; }
    .tb  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; font-weight: 700; }
    .ts  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #8C8078; }
    .num { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #FFFFFF; font-weight: 700; font-size: 11px; }
    .ink { fill: none; stroke: #3D3229; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; }
    .thin{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; }
    .dash{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; stroke-dasharray: 4 5; }
    .lead{ fill: none; stroke: #8C8078; stroke-width: 1; }
    .acc { fill: none; stroke: #A67C52; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .blue{ fill: none; stroke: #6B8FBF; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .green{ fill: none; stroke: #6F8F6A; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .red { fill: none; stroke: #B0563F; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .dot { fill: #3D3229; }
  </style>
  <text x="26" y="34" class="tb" font-size="16">多頻段壓縮與單頻段壓縮</text>
  <text x="26" y="55" class="ts" font-size="12.5">一個處理整個動態，一個只處理「某一段」的動態</text>
  <text x="150.0" y="92" class="t" font-size="11.5" font-weight="700" fill="#A67C52">單頻段</text>  <text x="395.0" y="92" class="t" font-size="11.5" font-weight="700" fill="#A67C52">多頻段</text>  <rect x="26" y="104" width="608" height="58" rx="4" fill="#F3E9DC" opacity="0.55"/>  <text x="34" y="126" class="t" font-size="11.5" font-weight="700">處理範圍</text>  <text x="150.0" y="124" class="ts" font-size="10" fill="#5D4E41">整個訊號</text>  <text x="395.0" y="124" class="ts" font-size="10" fill="#5D4E41">分成 2～4 段各自處理</text>  <text x="34" y="184" class="t" font-size="11.5" font-weight="700">優點</text>  <text x="150.0" y="182" class="ts" font-size="10" fill="#5D4E41">自然、整體感</text>  <text x="395.0" y="182" class="ts" font-size="10" fill="#5D4E41">精準，不會牽動其他頻段</text>  <rect x="26" y="220" width="608" height="58" rx="4" fill="#F3E9DC" opacity="0.55"/>  <text x="34" y="242" class="t" font-size="11.5" font-weight="700">缺點</text>  <text x="150.0" y="240" class="ts" font-size="10" fill="#5D4E41">壓低頻會影響高頻</text>  <text x="395.0" y="240" class="ts" font-size="10" fill="#5D4E41">相位與設定較複雜</text>  <text x="34" y="300" class="t" font-size="11.5" font-weight="700">適用</text>  <text x="150.0" y="298" class="ts" font-size="10" fill="#5D4E41">匯流排、整體黏合</text>  <text x="395.0" y="298" class="ts" font-size="10" fill="#5D4E41">母帶、有問題的頻段</text>
  <text x="26" y="336" class="ts" font-size="11">新手先練單頻段；多頻段是拿來修「只有某一段有問題」的情況。</text>
</svg>
