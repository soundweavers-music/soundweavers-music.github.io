  <text x="488.0" y="110" class="ts" font-size="10" text-anchor="middle" fill="#B0563F">超過 Nyquist</text>
  <path d="M320.0 150 L320.0 210" class="thin" stroke-dasharray="4 4"/>
  <text x="320.0" y="226" class="ts" font-size="10" text-anchor="middle" fill="#8C8078">Nyquist（取樣率的一半）</text>
  <path d="M488.0 250.0 L157.4 250.0" fill="none" stroke="#B0563F" stroke-width="1.7" stroke-linecap="round"/><path d="M152.0 250.0 L157.5 247.6 L157.5 252.4 Z" fill="#B0563F"/>
  <text x="320.0" y="274" class="ts" font-size="10.5" text-anchor="middle" fill="#B0563F">折返後的假頻率：聽起來像另一個音</text>
  <text x="26" y="330" class="ts" font-size="11">這就是為什麼抗混疊濾波器必須存在，也是 44.1 kHz 選在 20 kHz 兩倍以上的原因。</text>
</svg>
