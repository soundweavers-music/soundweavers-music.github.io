<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 460" role="img" aria-label="四、視覺 vs 聽覺：學會用耳朵聽壓縮">
  <title>四、視覺 vs 聽覺：學會用耳朵聽壓縮</title>
  <rect width="660" height="460" fill="#FBF8F4"/>
  <style>
    .t   { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; }
    .tb  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; font-weight: 700; }
    .ts  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #8C8078; }
    .num { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #FFFFFF; font-weight: 700; font-size: 11px; }
    .ink { fill: none; stroke: #3D3229; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; }
    .thin{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; }
    .dash{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; stroke-dasharray: 4 5; }
    .lead{ fill: none; stroke: #8C8078; stroke-width: 1; }
    .acc { fill: none; stroke: #A67C52; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .blue{ fill: none; stroke: #6B8FBF; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .green{ fill: none; stroke: #6F8F6A; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .red { fill: none; stroke: #B0563F; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .dot { fill: #3D3229; }
  </style>
  <text x="26" y="34" class="tb" font-size="16">四、視覺 vs 聽覺：學會用耳朵聽壓縮</text>
  <text x="26" y="55" class="ts" font-size="12.5">把這一節的重點排在一起</text>
  <rect x="26.0" y="96" width="295.0" height="96" rx="9" fill="#F3E9DC" stroke="#D9CFC4" stroke-width="1.4"/>  <circle cx="40.0" cy="116" r="10" fill="#A67C52"/>  <text x="40.0" y="120" text-anchor="middle" class="num">1</text>  <text x="60.0" y="121" class="t" font-size="12" font-weight="700">不同音源對壓縮的反應</text>  <text x="40.0" y="144" class="ts" font-size="9.5" fill="#8C8078">不同：人聲的4dB壓縮和貝斯的</text>  <text x="40.0" y="160" class="ts" font-size="9.5" fill="#8C8078">4dB壓縮聽起來完全不一樣。</text>  <rect x="339.0" y="96" width="295.0" height="96" rx="9" fill="#F3E9DC" stroke="#D9CFC4" stroke-width="1.4"/>  <circle cx="353.0" cy="116" r="10" fill="#A67C52"/>  <text x="353.0" y="120" text-anchor="middle" class="num">2</text>  <text x="373.0" y="121" class="t" font-size="12" font-weight="700">Attack和Rel</text>  <text x="353.0" y="144" class="ts" font-size="9.5" fill="#8C8078">ease的設定決定了壓縮的「質</text>  <text x="353.0" y="160" class="ts" font-size="9.5" fill="#8C8078">感」，而這是表頭無法顯示的。</text>  <rect x="26.0" y="206" width="295.0" height="96" rx="9" fill="#F3E9DC" stroke="#D9CFC4" stroke-width="1.4"/>  <circle cx="40.0" cy="226" r="10" fill="#A67C52"/>  <text x="40.0" y="230" text-anchor="middle" class="num">3</text>  <text x="60.0" y="231" class="t" font-size="12" font-weight="700">同樣的Thresho</text>  <text x="40.0" y="254" class="ts" font-size="9.5" fill="#8C8078">ld與Ratio，在不同頻率分</text>  <text x="40.0" y="270" class="ts" font-size="9.5" fill="#8C8078">布的聲音上會產生截然不同的效果</text>  <text x="40.0" y="286" class="ts" font-size="9.5" fill="#8C8078">。</text>  <rect x="339.0" y="206" width="295.0" height="96" rx="9" fill="#F3E9DC" stroke="#D9CFC4" stroke-width="1.4"/>  <circle cx="353.0" cy="226" r="10" fill="#A67C52"/>  <text x="353.0" y="230" text-anchor="middle" class="num">4</text>  <text x="373.0" y="231" class="t" font-size="12" font-weight="700">先過度壓縮</text>  <text x="353.0" y="254" class="ts" font-size="9.5" fill="#8C8078">將Threshold拉低、Ra</text>  <text x="353.0" y="270" class="ts" font-size="9.5" fill="#8C8078">tio拉到8:1以上，Atta</text>  <text x="353.0" y="286" class="ts" font-size="9.5" fill="#8C8078">ck設最快、Release設</text>  <rect x="26.0" y="316" width="295.0" height="96" rx="9" fill="#F3E9DC" stroke="#D9CFC4" stroke-width="1.4"/>  <circle cx="40.0" cy="336" r="10" fill="#A67C52"/>  <text x="40.0" y="340" text-anchor="middle" class="num">5</text>  <text x="60.0" y="341" class="t" font-size="12" font-weight="700">再慢慢放鬆</text>  <text x="40.0" y="364" class="ts" font-size="9.5" fill="#8C8078">將Ratio降到4:1，Att</text>  <text x="40.0" y="380" class="ts" font-size="9.5" fill="#8C8078">ack調慢到10ms，Rele</text>  <text x="40.0" y="396" class="ts" font-size="9.5" fill="#8C8078">ase調到200ms。</text>  <rect x="339.0" y="316" width="295.0" height="96" rx="9" fill="#F3E9DC" stroke="#D9CFC4" stroke-width="1.4"/>  <circle cx="353.0" cy="336" r="10" fill="#A67C52"/>  <text x="353.0" y="340" text-anchor="middle" class="num">6</text>  <text x="373.0" y="341" class="t" font-size="12" font-weight="700">極端A/B測試</text>  <text x="353.0" y="364" class="ts" font-size="9.5" fill="#8C8078">在壓縮器開啟與關閉之間切換，專</text>  <text x="353.0" y="380" class="ts" font-size="9.5" fill="#8C8078">注於聽「聲音的哪些部分變了」—</text>  <text x="353.0" y="396" class="ts" font-size="9.5" fill="#8C8078">—是變亮了？變厚了？變平了？</text>
</svg>
