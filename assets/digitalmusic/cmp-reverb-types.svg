<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 354" role="img" aria-label="四種殘響：差別在「空間怎麼被算出來」">
  <title>四種殘響：差別在「空間怎麼被算出來」</title>
  <rect width="660" height="354" fill="#FBF8F4"/>
  <style>
    .t   { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; }
    .tb  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; font-weight: 700; }
    .ts  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #8C8078; }
    .num { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #FFFFFF; font-weight: 700; font-size: 11px; }
    .ink { fill: none; stroke: #3D3229; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; }
    .thin{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; }
    .dash{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; stroke-dasharray: 4 5; }
    .lead{ fill: none; stroke: #8C8078; stroke-width: 1; }
    .acc { fill: none; stroke: #A67C52; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .blue{ fill: none; stroke: #6B8FBF; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .green{ fill: none; stroke: #6F8F6A; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .red { fill: none; stroke: #B0563F; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .dot { fill: #3D3229; }
  </style>
  <text x="26" y="34" class="tb" font-size="16">四種殘響：差別在「空間怎麼被算出來」</text>
  <text x="26" y="55" class="ts" font-size="12.5">不是哪一種比較好，是適合哪一種場合</text>
  <text x="150.0" y="92" class="t" font-size="11.5" font-weight="700" fill="#A67C52">聽起來</text>  <text x="395.0" y="92" class="t" font-size="11.5" font-weight="700" fill="#A67C52">適合</text>  <rect x="26" y="104" width="608" height="58" rx="4" fill="#F3E9DC" opacity="0.55"/>  <text x="34" y="126" class="t" font-size="11.5" font-weight="700">Plate</text>  <text x="150.0" y="124" class="ts" font-size="10" fill="#5D4E41">密、亮、尾巴平滑</text>  <text x="395.0" y="124" class="ts" font-size="10" fill="#5D4E41">人聲、小鼓</text>  <text x="34" y="184" class="t" font-size="11.5" font-weight="700">Spring</text>  <text x="150.0" y="182" class="ts" font-size="10" fill="#5D4E41">金屬感、彈簧聲</text>  <text x="395.0" y="182" class="ts" font-size="10" fill="#5D4E41">吉他、復古風</text>  <rect x="26" y="220" width="608" height="58" rx="4" fill="#F3E9DC" opacity="0.55"/>  <text x="34" y="242" class="t" font-size="11.5" font-weight="700">Room</text>  <text x="150.0" y="240" class="ts" font-size="10" fill="#5D4E41">短、自然、有實體感</text>  <text x="395.0" y="240" class="ts" font-size="10" fill="#5D4E41">鼓組、需要「同一個房間」</text>  <text x="34" y="300" class="t" font-size="11.5" font-weight="700">Hall</text>  <text x="150.0" y="298" class="ts" font-size="10" fill="#5D4E41">長、寬、尾巴厚</text>  <text x="395.0" y="298" class="ts" font-size="10" fill="#5D4E41">弦樂、慢歌、營造空間</text>
  <text x="26" y="336" class="ts" font-size="11">古典與電影感常用 Hall；流行歌人聲多半用 Plate 疊一點 Room。</text>
</svg>
