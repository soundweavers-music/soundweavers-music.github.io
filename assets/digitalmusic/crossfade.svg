  </style>
  <text x="26" y="34" class="tb" font-size="16">Crossfade 的兩條曲線</text>
  <text x="26" y="55" class="ts" font-size="12.5">交界處要嘛等功率、要嘛等增益</text>
  <text x="26" y="84" class="ts" font-size="12">兩個 Take 交界處的淡出淡入；曲線選錯，交接點會凹一個洞。</text>
