<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 360" role="img" aria-label="單獨聽某一段">
  <title>單獨聽某一段</title>
  <rect width="660" height="360" fill="#FBF8F4"/>
  <style>
    .t   { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; }
    .tb  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; font-weight: 700; }
    .ts  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #8C8078; }
    .num { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #FFFFFF; font-weight: 700; font-size: 11px; }
    .ink { fill: none; stroke: #3D3229; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; }
    .thin{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; }
    .dash{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; stroke-dasharray: 4 5; }
    .lead{ fill: none; stroke: #8C8078; stroke-width: 1; }
    .acc { fill: none; stroke: #A67C52; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .blue{ fill: none; stroke: #6B8FBF; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .green{ fill: none; stroke: #6F8F6A; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .red { fill: none; stroke: #B0563F; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .dot { fill: #3D3229; }
  </style>
  <text x="26" y="34" class="tb" font-size="16">單獨聽某一段</text>
  <text x="26" y="55" class="ts" font-size="12.5">Solo 是按鈕，不是診斷</text>
  <text x="26" y="84" class="ts" font-size="12">多頻段壓縮的實務順序：先單獨聽一段，確定問題在哪，再動手。</text>
  <rect x="60" y="116" width="60" height="34" rx="4" fill="#6B8FBF" stroke="#6B8FBF" stroke-width="1.2" opacity="0.25"/>
  <text x="90" y="138" class="ts" font-size="10" text-anchor="middle" fill="#6B8FBF">S</text>
  <text x="140" y="132" class="t" font-size="11" font-weight="700">低頻</text>
  <text x="140" y="148" class="ts" font-size="9" fill="#8C8078">120 Hz 以下</text>
  <text x="300" y="138" class="ts" font-size="10">貝斯與大鼓的起伏</text>
  <text x="500" y="138" class="ts" font-size="9.5" fill="#6B8FBF">衰減 1–2 dB</text>
  <rect x="60" y="164" width="60" height="34" rx="4" fill="#6F8F6A" stroke="#6F8F6A" stroke-width="1.2" opacity="0.25"/>
  <text x="90" y="186" class="ts" font-size="10" text-anchor="middle" fill="#6F8F6A">S</text>
  <text x="140" y="180" class="t" font-size="11" font-weight="700">中低</text>
  <text x="140" y="196" class="ts" font-size="9" fill="#8C8078">120–800 Hz</text>
  <text x="300" y="186" class="ts" font-size="10">箱音、悶</text>
  <text x="500" y="186" class="ts" font-size="9.5" fill="#6F8F6A">衰減 2–4 dB</text>
  <rect x="60" y="212" width="60" height="34" rx="4" fill="#A67C52" stroke="#A67C52" stroke-width="1.2" opacity="0.25"/>
  <text x="90" y="234" class="ts" font-size="10" text-anchor="middle" fill="#A67C52">S</text>
  <text x="140" y="228" class="t" font-size="11" font-weight="700">中高</text>
  <text x="140" y="244" class="ts" font-size="9" fill="#8C8078">800–4k</text>
  <text x="300" y="234" class="ts" font-size="10">人聲前傾</text>
  <text x="500" y="234" class="ts" font-size="9.5" fill="#A67C52">衰減 2–4 dB</text>
  <rect x="60" y="260" width="60" height="34" rx="4" fill="#B0563F" stroke="#B0563F" stroke-width="1.2" opacity="0.25"/>
  <text x="90" y="282" class="ts" font-size="10" text-anchor="middle" fill="#B0563F">S</text>
  <text x="140" y="276" class="t" font-size="11" font-weight="700">高頻</text>
  <text x="140" y="292" class="ts" font-size="9" fill="#8C8078">4k 以上</text>
  <text x="300" y="282" class="ts" font-size="10">齒音、鈸</text>
  <text x="500" y="282" class="ts" font-size="9.5" fill="#B0563F">衰減 2–4 dB</text>
  <text x="26" y="330" class="ts" font-size="11">一次只 solo 一段，否則你會以為問題消失了，其實只是被別段蓋住。</text>
</svg>
