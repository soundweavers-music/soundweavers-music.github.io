  <text x="26" y="34" class="tb" font-size="16">房間裡的駐波</text>
  <text x="26" y="55" class="ts" font-size="12.5">平行牆面把某些低頻留下來、某些抵消掉</text>
  <text x="26" y="82" class="ts" font-size="12">兩面平行的硬牆，等於一根共振管：某些低頻被留下，某些被抵銷。</text>
