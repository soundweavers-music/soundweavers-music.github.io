  <text x="26" y="332" class="ts" font-size="11">牆面永遠是壓力最大處：越靠牆，低頻越多、越濁。房間越大，最低那個駐波越低。</text>
  <text x="26" y="356" class="ts" font-size="11" fill="#8C8078">小房間的問題集中在 100–300 Hz；把喇叭與耳朵都離開牆面，等於讓開節點。</text>
  <text x="26" y="382" class="ts" font-size="11">紅點＝牆面；曲線的每一個交叉點，就是耳朵會聽到「特別多」或「特別少」的位置。</text>
</svg>
