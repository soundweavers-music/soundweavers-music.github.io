  <text x="400" y="276" class="ts" font-size="11">延遲越短，梳子的齒距越寬。</text>
  <text x="400" y="296" class="ts" font-size="11">兩支麥克風距離一變，凹陷的頻率就整排搬家。</text>
  <text x="400" y="320" class="ts" font-size="11" fill="#8C8078">3:1 規則＝讓齒距密到聽不出來。</text>
  <text x="400" y="344" class="ts" font-size="10.5" fill="#8C8078">單麥克風錄音也會有梳狀濾波——來自地板與桌面的反射。</text>
