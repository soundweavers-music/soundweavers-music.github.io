  <text x="26" y="34" class="tb" font-size="16">梳狀濾波</text>
  <text x="26" y="55" class="ts" font-size="12.5">直達音與反射音相差幾毫秒的結果</text>
  <text x="26" y="84" class="ts" font-size="12">同一個聲音晚到幾毫秒，就會跟原聲疊成梳子狀的頻率響應。</text>
