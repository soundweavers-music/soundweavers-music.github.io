<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 350" role="img" aria-label="Master Bus 的多頻段壓縮：黏合與精修">
  <title>Master Bus 的多頻段壓縮：黏合與精修</title>
  <rect width="660" height="350" fill="#FBF8F4"/>
  <style>
    .t   { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; }
    .tb  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; font-weight: 700; }
    .ts  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #8C8078; }
    .num { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #FFFFFF; font-weight: 700; font-size: 11px; }
    .ink { fill: none; stroke: #3D3229; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; }
    .thin{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; }
    .dash{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; stroke-dasharray: 4 5; }
    .lead{ fill: none; stroke: #8C8078; stroke-width: 1; }
    .acc { fill: none; stroke: #A67C52; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .blue{ fill: none; stroke: #6B8FBF; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .green{ fill: none; stroke: #6F8F6A; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .red { fill: none; stroke: #B0563F; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .dot { fill: #3D3229; }
  </style>
  <text x="26" y="34" class="tb" font-size="16">Master Bus 的多頻段壓縮：黏合與精修</text>
  <text x="26" y="55" class="ts" font-size="12.5">把這一節的重點排在一起</text>
  <rect x="26.0" y="96" width="295.0" height="96" rx="9" fill="#F3E9DC" stroke="#D9CFC4" stroke-width="1.4"/>  <circle cx="40.0" cy="116" r="10" fill="#A67C52"/>  <text x="40.0" y="120" text-anchor="middle" class="num">1</text>  <text x="60.0" y="121" class="t" font-size="12" font-weight="700">微量使用</text>  <text x="40.0" y="144" class="ts" font-size="9.5" fill="#8C8078">GainReduction總量</text>  <text x="40.0" y="160" class="ts" font-size="9.5" fill="#8C8078">不超過1-3dB，每個頻段最多</text>  <text x="40.0" y="176" class="ts" font-size="9.5" fill="#8C8078">1-2dB</text>  <rect x="339.0" y="96" width="295.0" height="96" rx="9" fill="#F3E9DC" stroke="#D9CFC4" stroke-width="1.4"/>  <circle cx="353.0" cy="116" r="10" fill="#A67C52"/>  <text x="353.0" y="120" text-anchor="middle" class="num">2</text>  <text x="373.0" y="121" class="t" font-size="12" font-weight="700">極低Ratio</text>  <text x="353.0" y="144" class="ts" font-size="9.5" fill="#8C8078">使用1.25:1到1.5:1即</text>  <text x="353.0" y="160" class="ts" font-size="9.5" fill="#8C8078">可，這更像是「動態微調」而非「</text>  <text x="353.0" y="176" class="ts" font-size="9.5" fill="#8C8078">壓縮」</text>  <rect x="26.0" y="206" width="295.0" height="96" rx="9" fill="#F3E9DC" stroke="#D9CFC4" stroke-width="1.4"/>  <circle cx="40.0" cy="226" r="10" fill="#A67C52"/>  <text x="40.0" y="230" text-anchor="middle" class="num">3</text>  <text x="60.0" y="231" class="t" font-size="12" font-weight="700">寬分頻點</text>  <text x="40.0" y="254" class="ts" font-size="9.5" fill="#8C8078">MasterBus上建議使用較</text>  <text x="40.0" y="270" class="ts" font-size="9.5" fill="#8C8078">寬的分頻點（常見LR4，需要更</text>  <text x="40.0" y="286" class="ts" font-size="9.5" fill="#8C8078">陡的斜率時用LR8），減少分</text>  <rect x="339.0" y="206" width="295.0" height="96" rx="9" fill="#F3E9DC" stroke="#D9CFC4" stroke-width="1.4"/>  <circle cx="353.0" cy="226" r="10" fill="#A67C52"/>  <text x="353.0" y="230" text-anchor="middle" class="num">4</text>  <text x="373.0" y="231" class="t" font-size="12" font-weight="700">慢Attack，中Rele</text>  <text x="353.0" y="254" class="ts" font-size="9.5" fill="#8C8078">Attack設在30-50ms</text>  <text x="353.0" y="270" class="ts" font-size="9.5" fill="#8C8078">，Release約50-100</text>  <text x="353.0" y="286" class="ts" font-size="9.5" fill="#8C8078">ms</text>
</svg>
