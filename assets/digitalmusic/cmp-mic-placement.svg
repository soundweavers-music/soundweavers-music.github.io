<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 296" role="img" aria-label="麥克風擺位的三個變數">
  <title>麥克風擺位的三個變數</title>
  <rect width="660" height="296" fill="#FBF8F4"/>
  <style>
    .t   { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; }
    .tb  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; font-weight: 700; }
    .ts  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #8C8078; }
    .num { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #FFFFFF; font-weight: 700; font-size: 11px; }
    .ink { fill: none; stroke: #3D3229; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; }
    .thin{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; }
    .dash{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; stroke-dasharray: 4 5; }
    .lead{ fill: none; stroke: #8C8078; stroke-width: 1; }
    .acc { fill: none; stroke: #A67C52; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .blue{ fill: none; stroke: #6B8FBF; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .green{ fill: none; stroke: #6F8F6A; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .red { fill: none; stroke: #B0563F; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .dot { fill: #3D3229; }
  </style>
  <text x="26" y="34" class="tb" font-size="16">麥克風擺位的三個變數</text>
  <text x="26" y="55" class="ts" font-size="12.5">距離、角度、高度，換一個聲音就不同</text>
  <text x="150.0" y="92" class="t" font-size="11.5" font-weight="700" fill="#A67C52">改變什麼</text>  <text x="395.0" y="92" class="t" font-size="11.5" font-weight="700" fill="#A67C52">起點</text>  <rect x="26" y="104" width="608" height="58" rx="4" fill="#F3E9DC" opacity="0.55"/>  <text x="34" y="126" class="t" font-size="11.5" font-weight="700">距離</text>  <text x="150.0" y="124" class="ts" font-size="10" fill="#5D4E41">近接效應與空間比例</text>  <text x="395.0" y="124" class="ts" font-size="10" fill="#5D4E41">15–25 cm（人聲）</text>  <text x="34" y="184" class="t" font-size="11.5" font-weight="700">角度</text>  <text x="150.0" y="182" class="ts" font-size="10" fill="#5D4E41">離軸染色與噴麥</text>  <text x="395.0" y="182" class="ts" font-size="10" fill="#5D4E41">略偏 15–30 度</text>  <rect x="26" y="220" width="608" height="58" rx="4" fill="#F3E9DC" opacity="0.55"/>  <text x="34" y="242" class="t" font-size="11.5" font-weight="700">高度</text>  <text x="150.0" y="240" class="ts" font-size="10" fill="#5D4E41">鼻腔與胸腔的比例</text>  <text x="395.0" y="240" class="ts" font-size="10" fill="#5D4E41">對準嘴巴或略高</text>
  <text x="26" y="278" class="ts" font-size="11">一次只動一個變數，錄 20 秒比較；同時改三個就分不清效果。</text>
</svg>
