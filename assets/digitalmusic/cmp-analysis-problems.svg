<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 412" role="img" aria-label="分析工具幫你抓出的五個問題">
  <title>分析工具幫你抓出的五個問題</title>
  <rect width="660" height="412" fill="#FBF8F4"/>
  <style>
    .t   { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; }
    .tb  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; font-weight: 700; }
    .ts  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #8C8078; }
    .num { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #FFFFFF; font-weight: 700; font-size: 11px; }
    .ink { fill: none; stroke: #3D3229; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; }
    .thin{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; }
    .dash{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; stroke-dasharray: 4 5; }
    .lead{ fill: none; stroke: #8C8078; stroke-width: 1; }
    .acc { fill: none; stroke: #A67C52; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .blue{ fill: none; stroke: #6B8FBF; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .green{ fill: none; stroke: #6F8F6A; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .red { fill: none; stroke: #B0563F; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .dot { fill: #3D3229; }
  </style>
  <text x="26" y="34" class="tb" font-size="16">分析工具幫你抓出的五個問題</text>
  <text x="26" y="55" class="ts" font-size="12.5">工具只負責「發現」，不負責「決定」</text>
  <text x="150.0" y="92" class="t" font-size="11.5" font-weight="700" fill="#A67C52">代表</text>  <text x="395.0" y="92" class="t" font-size="11.5" font-weight="700" fill="#A67C52">先做什麼</text>  <rect x="26" y="104" width="608" height="58" rx="4" fill="#F3E9DC" opacity="0.55"/>  <text x="34" y="126" class="t" font-size="11.5" font-weight="700">頻譜中間凹陷</text>  <text x="150.0" y="124" class="ts" font-size="10" fill="#5D4E41">兩個樂器搶同一段</text>  <text x="395.0" y="124" class="ts" font-size="10" fill="#5D4E41">做頻率分工</text>  <text x="34" y="184" class="t" font-size="11.5" font-weight="700">相位表偏低</text>  <text x="150.0" y="182" class="ts" font-size="10" fill="#5D4E41">單聲道會消失</text>  <text x="395.0" y="182" class="ts" font-size="10" fill="#5D4E41">檢查時間差與極性</text>  <rect x="26" y="220" width="608" height="58" rx="4" fill="#F3E9DC" opacity="0.55"/>  <text x="34" y="242" class="t" font-size="11.5" font-weight="700">True Peak 超標</text>  <text x="150.0" y="240" class="ts" font-size="10" fill="#5D4E41">串流平台會轉小</text>  <text x="395.0" y="240" class="ts" font-size="10" fill="#5D4E41">降限制器輸出</text>  <text x="34" y="300" class="t" font-size="11.5" font-weight="700">動態範圍很窄</text>  <text x="150.0" y="298" class="ts" font-size="10" fill="#5D4E41">整首都一樣大聲</text>  <text x="395.0" y="298" class="ts" font-size="10" fill="#5D4E41">回頭處理主歌</text>  <rect x="26" y="336" width="608" height="58" rx="4" fill="#F3E9DC" opacity="0.55"/>  <text x="34" y="358" class="t" font-size="11.5" font-weight="700">低頻不穩</text>  <text x="150.0" y="356" class="ts" font-size="10" fill="#5D4E41">每段音量不同</text>  <text x="395.0" y="356" class="ts" font-size="10" fill="#5D4E41">用多頻段或自動化</text>
  <text x="26" y="394" class="ts" font-size="11">先修最明顯的那一個，修完再看下一個；一次改全部會失控。</text>
</svg>
