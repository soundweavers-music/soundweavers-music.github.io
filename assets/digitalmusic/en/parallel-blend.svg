<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 350" role="img" aria-label="Wet/dry on parallel compression">
  <title>Wet/dry on parallel compression</title>
  <rect width="660" height="350" fill="#FBF8F4"/>
  <style>
    .t   { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; }
    .tb  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; font-weight: 700; }
    .ts  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #8C8078; }
    .num { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #FFFFFF; font-weight: 700; font-size: 11px; }
    .ink { fill: none; stroke: #3D3229; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; }
    .thin{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; }
    .dash{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; stroke-dasharray: 4 5; }
    .lead{ fill: none; stroke: #8C8078; stroke-width: 1; }
    .acc { fill: none; stroke: #A67C52; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .blue{ fill: none; stroke: #6B8FBF; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .green{ fill: none; stroke: #6F8F6A; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .red { fill: none; stroke: #B0563F; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .dot { fill: #3D3229; }
  </style>
  <text x="26" y="34" class="tb" font-size="16">Wet/dry on parallel compression</text>
  <text x="26" y="55" class="ts" font-size="12.5">How much you blend in decides how audible it is</text>
  <text x="26" y="84" class="ts" font-size="12">The point is the wet/dry blend, not how hard you squash</text>
  <text x="60" y="124" class="t" font-size="10.5">0% wet</text>
  <rect x="140" y="108" width="380" height="22" rx="4" fill="#FFFFFF" stroke="#D9CFC4" stroke-width="1.4"/>
  <rect x="140" y="108" width="0.0" height="22" rx="4" fill="#A67C52" opacity="0.3"/>
  <text x="146.0" y="142" class="ts" font-size="9" fill="#8C8078">fully dry: the original dynamics only</text>
  <text x="60" y="176" class="t" font-size="10.5">35% wet</text>
  <rect x="140" y="160" width="380" height="22" rx="4" fill="#FFFFFF" stroke="#D9CFC4" stroke-width="1.4"/>
  <rect x="140" y="160" width="133.0" height="22" rx="4" fill="#A67C52" opacity="0.3"/>
  <text x="279.0" y="194" class="ts" font-size="9" fill="#8C8078">light blend: thicker, dynamics intact</text>
  <text x="60" y="228" class="t" font-size="10.5">70% wet</text>
  <rect x="140" y="212" width="380" height="22" rx="4" fill="#FFFFFF" stroke="#D9CFC4" stroke-width="1.4"/>
  <rect x="140" y="212" width="266.0" height="22" rx="4" fill="#A67C52" opacity="0.3"/>
  <text x="412.0" y="246" class="ts" font-size="9" fill="#8C8078">heavy blend: clearly thicker and closer</text>
  <text x="60" y="280" class="t" font-size="10.5">100% wet</text>
  <rect x="140" y="264" width="380" height="22" rx="4" fill="#FFFFFF" stroke="#D9CFC4" stroke-width="1.4"/>
  <rect x="140" y="264" width="380.0" height="22" rx="4" fill="#A67C52" opacity="0.3"/>
  <text x="526.0" y="298" class="ts" font-size="9" fill="#8C8078">fully wet: the same as serial compression</text>
  <text x="26" y="330" class="ts" font-size="11">Start at 30% and stop when it sounds thicker but the dynamics still show</text>
</svg>
