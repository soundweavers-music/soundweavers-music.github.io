  <text x="26" y="34" class="tb" font-size="16">Four faults on a pitch curve</text>
  <text x="26" y="55" class="ts" font-size="12.5">Tools like Melodyne show exactly this line</text>
  <text x="26" y="84" class="ts" font-size="12">One melody, two versions: sung in blue, tuned in brown</text>
