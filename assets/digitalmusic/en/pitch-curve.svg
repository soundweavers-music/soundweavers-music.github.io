  <circle cx="534" cy="168" r="10" fill="#A67C52"/>  <text x="534" y="172" text-anchor="middle" class="num">4</text>
  <text x="550" y="172" class="ts" font-size="10.5">the end drifts sharp</text>
  <text x="26" y="344" class="ts" font-size="11.5">Fix: move the curve&#x27;s centre line to the target and keep the vibrato wiggle</text>
  <text x="26" y="366" class="ts" font-size="11" fill="#8C8078">Flattening every point sounds robotic; get the centre line right and it reads as in tune</text>
  <text x="26" y="390" class="ts" font-size="10.5" fill="#8C8078">dashed blue = original take, solid brown = tuned, dashed grey = target pitch</text>
