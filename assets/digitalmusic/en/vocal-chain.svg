<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400" role="img" aria-label="A pop vocal chain">
  <title>A pop vocal chain</title>
  <rect width="660" height="400" fill="#FBF8F4"/>
  <style>
    .t   { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; }
    .tb  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; font-weight: 700; }
    .ts  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #8C8078; }
    .num { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #FFFFFF; font-weight: 700; font-size: 11px; }
    .ink { fill: none; stroke: #3D3229; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; }
    .thin{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; }
    .dash{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; stroke-dasharray: 4 5; }
    .lead{ fill: none; stroke: #8C8078; stroke-width: 1; }
    .acc { fill: none; stroke: #A67C52; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .blue{ fill: none; stroke: #6B8FBF; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .green{ fill: none; stroke: #6F8F6A; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .red { fill: none; stroke: #B0563F; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .dot { fill: #3D3229; }
  </style>
  <text x="26" y="34" class="tb" font-size="16">A pop vocal chain</text>
  <text x="26" y="55" class="ts" font-size="12.5">Fix, then shape, then add space — never the other way round</text>
  <text x="26" y="84" class="ts" font-size="12">Order decides the result: fix problems, then shape tone, then add space</text>
  <rect x="50" y="110" width="132" height="60" rx="8" fill="#FFFFFF" stroke="#A67C52" stroke-width="1.3"/>
  <text x="62" y="134" class="t" font-size="11.5" font-weight="700">Trim</text>
  <text x="62" y="153" class="ts" font-size="9.5" fill="#8C8078">Level match first</text>
  <path d="M184.0 140.0 L191.5 140.0" fill="none" stroke="#8C8078" stroke-width="1.7" stroke-linecap="round"/><path d="M196.0 140.0 L191.4 142.0 L191.4 138.0 Z" fill="#8C8078"/>
  <rect x="198" y="110" width="132" height="60" rx="8" fill="#FFFFFF" stroke="#A67C52" stroke-width="1.3"/>
  <text x="210" y="134" class="t" font-size="11.5" font-weight="700">High-pass</text>
  <text x="210" y="153" class="ts" font-size="9.5" fill="#8C8078">80–120 Hz</text>
  <path d="M332.0 140.0 L339.5 140.0" fill="none" stroke="#8C8078" stroke-width="1.7" stroke-linecap="round"/><path d="M344.0 140.0 L339.4 142.0 L339.4 138.0 Z" fill="#8C8078"/>
  <rect x="346" y="110" width="132" height="60" rx="8" fill="#FFFFFF" stroke="#A67C52" stroke-width="1.3"/>
  <text x="358" y="134" class="t" font-size="11.5" font-weight="700">Dynamic EQ</text>
  <text x="358" y="153" class="ts" font-size="9.5" fill="#8C8078">one band only</text>
  <path d="M480.0 140.0 L487.5 140.0" fill="none" stroke="#8C8078" stroke-width="1.7" stroke-linecap="round"/><path d="M492.0 140.0 L487.4 142.0 L487.4 138.0 Z" fill="#8C8078"/>
  <rect x="494" y="110" width="132" height="60" rx="8" fill="#FFFFFF" stroke="#A67C52" stroke-width="1.3"/>
  <text x="506" y="134" class="t" font-size="11.5" font-weight="700">Compression</text>
  <text x="506" y="153" class="ts" font-size="9.5" fill="#8C8078">3–6 dB down</text>
  <path d="M560 172 L560 190" class="thin"/>
  <rect x="50" y="194" width="132" height="60" rx="8" fill="#FFFFFF" stroke="#A67C52" stroke-width="1.3"/>
  <text x="62" y="218" class="t" font-size="11.5" font-weight="700">De-ess</text>
  <text x="62" y="237" class="ts" font-size="9.5" fill="#8C8078">6–9 kHz</text>
  <path d="M184.0 224.0 L191.5 224.0" fill="none" stroke="#8C8078" stroke-width="1.7" stroke-linecap="round"/><path d="M196.0 224.0 L191.4 226.0 L191.4 222.0 Z" fill="#8C8078"/>
  <rect x="198" y="194" width="132" height="60" rx="8" fill="#FFFFFF" stroke="#A67C52" stroke-width="1.3"/>
  <text x="210" y="218" class="t" font-size="11.5" font-weight="700">EQ shaping</text>
  <text x="210" y="237" class="ts" font-size="9.5" fill="#8C8078">mostly boosts</text>
  <path d="M332.0 224.0 L339.5 224.0" fill="none" stroke="#8C8078" stroke-width="1.7" stroke-linecap="round"/><path d="M344.0 224.0 L339.4 226.0 L339.4 222.0 Z" fill="#8C8078"/>
  <rect x="346" y="194" width="132" height="60" rx="8" fill="#FFFFFF" stroke="#A67C52" stroke-width="1.3"/>
  <text x="358" y="218" class="t" font-size="11.5" font-weight="700">Saturation</text>
  <text x="358" y="237" class="ts" font-size="9.5" fill="#8C8078">optional</text>
  <path d="M480.0 224.0 L487.5 224.0" fill="none" stroke="#8C8078" stroke-width="1.7" stroke-linecap="round"/><path d="M492.0 224.0 L487.4 226.0 L487.4 222.0 Z" fill="#8C8078"/>
  <rect x="494" y="194" width="132" height="60" rx="8" fill="#FFFFFF" stroke="#A67C52" stroke-width="1.3"/>
  <text x="506" y="218" class="t" font-size="11.5" font-weight="700">Space</text>
  <text x="506" y="237" class="ts" font-size="9.5" fill="#8C8078">on a send</text>
  <rect x="60" y="300" width="240" height="52" rx="8" fill="#F4DFD7" stroke="#D9CFC4" stroke-width="1.3"/>
  <text x="72" y="322" class="t" font-size="13" font-weight="700">De-ess after the compressor</text>
  <text x="72" y="341" class="ts" font-size="11">compression lifts sibilance too</text>
  <rect x="330" y="300" width="250" height="52" rx="8" fill="#E4EBDC" stroke="#D9CFC4" stroke-width="1.3"/>
  <text x="342" y="322" class="t" font-size="13" font-weight="700">Space always comes last</text>
  <text x="342" y="341" class="ts" font-size="11">don&#x27;t let reverb smear earlier work</text>
  <text x="26" y="382" class="ts" font-size="11">The same chain is not the same sound: tune every setting to this song</text>
</svg>
