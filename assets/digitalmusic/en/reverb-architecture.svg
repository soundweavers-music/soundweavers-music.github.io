<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400" role="img" aria-label="Reverb on a send/return">
  <title>Reverb on a send/return</title>
  <rect width="660" height="400" fill="#FBF8F4"/>
  <style>
    .t   { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; }
    .tb  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; font-weight: 700; }
    .ts  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #8C8078; }
    .num { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #FFFFFF; font-weight: 700; font-size: 11px; }
    .ink { fill: none; stroke: #3D3229; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; }
    .thin{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; }
    .dash{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; stroke-dasharray: 4 5; }
    .lead{ fill: none; stroke: #8C8078; stroke-width: 1; }
    .acc { fill: none; stroke: #A67C52; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .blue{ fill: none; stroke: #6B8FBF; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .green{ fill: none; stroke: #6F8F6A; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .red { fill: none; stroke: #B0563F; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .dot { fill: #3D3229; }
  </style>
  <text x="26" y="34" class="tb" font-size="16">Reverb on a send/return</text>
  <text x="26" y="55" class="ts" font-size="12.5">One bus, one space shared by many tracks</text>
  <text x="26" y="84" class="ts" font-size="12">Use send/return so many tracks share one space instead of each having its own</text>
  <rect x="60" y="112" width="120" height="52" rx="8" fill="#F3E9DC" stroke="#D9CFC4" stroke-width="1.3"/>
  <text x="72" y="134" class="t" font-size="13" font-weight="700">vocal</text>
  <text x="72" y="153" class="ts" font-size="11">Send −12 dB</text>
  <rect x="60" y="178" width="120" height="52" rx="8" fill="#F3E9DC" stroke="#D9CFC4" stroke-width="1.3"/>
  <text x="72" y="200" class="t" font-size="13" font-weight="700">guitar</text>
  <text x="72" y="219" class="ts" font-size="11">Send −18 dB</text>
  <rect x="60" y="244" width="120" height="52" rx="8" fill="#F3E9DC" stroke="#D9CFC4" stroke-width="1.3"/>
  <text x="72" y="266" class="t" font-size="13" font-weight="700">drums</text>
  <text x="72" y="285" class="ts" font-size="11">Send −24 dB</text>
  <rect x="250" y="158" width="150" height="96" rx="8" fill="#E4EBDC" stroke="#6F8F6A" stroke-width="1.5"/>
  <text x="325" y="186" class="t" font-size="11.5" text-anchor="middle" font-weight="700">Reverb Return</text>
  <text x="325" y="206" class="ts" font-size="10" text-anchor="middle">Pre-delay 20 ms</text>
  <text x="325" y="222" class="ts" font-size="10" text-anchor="middle">Decay 1.8 s</text>
  <text x="325" y="238" class="ts" font-size="10" text-anchor="middle">High-cut 8 kHz</text>
  <path d="M180 138 L246 138 L246 206" class="blue" opacity="0.8"/>
  <path d="M180 204 L246 204 L246 206" class="blue" opacity="0.8"/>
  <path d="M180 270 L246 270 L246 206" class="blue" opacity="0.8"/>
  <path d="M400.0 206.0 L454.6 206.0" fill="none" stroke="#8C8078" stroke-width="1.7" stroke-linecap="round"/><path d="M460.0 206.0 L454.5 208.4 L454.5 203.6 Z" fill="#8C8078"/>
  <rect x="464" y="180" width="130" height="52" rx="8" fill="#DEE8F3" stroke="#D9CFC4" stroke-width="1.3"/>
  <text x="476" y="202" class="t" font-size="13" font-weight="700">mix bus</text>
  <text x="476" y="221" class="ts" font-size="11">dry + wet together</text>
  <text x="26" y="330" class="ts" font-size="11">Longer pre-delay pulls the sound off the source; longer decay means a bigger space</text>
  <text x="26" y="352" class="ts" font-size="11" fill="#8C8078">Several reverbs, several spaces: near, far, drums only</text>
  <text x="26" y="382" class="ts" font-size="11">EQ the return too: high-pass at 300 Hz so the reverb does not mud up the low end</text>
</svg>
