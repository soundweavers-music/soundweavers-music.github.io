<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 380" role="img" aria-label="Finding the first reflection points">
  <title>Finding the first reflection points</title>
  <rect width="660" height="380" fill="#FBF8F4"/>
  <style>
    .t   { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; }
    .tb  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; font-weight: 700; }
    .ts  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #8C8078; }
    .num { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #FFFFFF; font-weight: 700; font-size: 11px; }
    .ink { fill: none; stroke: #3D3229; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; }
    .thin{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; }
    .dash{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; stroke-dasharray: 4 5; }
    .lead{ fill: none; stroke: #8C8078; stroke-width: 1; }
    .acc { fill: none; stroke: #A67C52; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .blue{ fill: none; stroke: #6B8FBF; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .green{ fill: none; stroke: #6F8F6A; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .red { fill: none; stroke: #B0563F; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .dot { fill: #3D3229; }
  </style>
  <text x="26" y="34" class="tb" font-size="16">Finding the first reflection points</text>
  <text x="26" y="55" class="ts" font-size="12.5">Where the mirror shows a speaker is where the panel goes</text>
  <text x="26" y="84" class="ts" font-size="12">The mirror trick: sit down; wherever a speaker shows in the mirror is a first reflection</text>
  <rect x="80" y="122" width="500" height="168" rx="4" fill="#FFFFFF" stroke="#D9CFC4" stroke-width="1.4"/>
  <rect x="80" y="122" width="500" height="10" fill="#3D3229" opacity="0.25"/>
  <text x="330" y="116" class="ts" font-size="10" text-anchor="middle" fill="#8C8078">Side walls and back wall</text>
  <circle cx="330" cy="250" r="8" fill="#A67C52"/>
  <text x="330" y="274" class="ts" font-size="10" text-anchor="middle">Ears</text>
  <circle cx="180" cy="150" r="7" fill="#6B8FBF"/>
  <circle cx="480" cy="150" r="7" fill="#6B8FBF"/>
  <text x="180" y="136" class="ts" font-size="9.5" text-anchor="middle" fill="#6B8FBF">Speaker L</text>
  <text x="480" y="136" class="ts" font-size="9.5" text-anchor="middle" fill="#6B8FBF">Speaker R</text>
  <path d="M180 158 L100 172" class="thin"/>
  <path d="M100 172 L275 244" class="thin"/>
  <circle cx="100" cy="172" r="5" fill="#B0563F"/>
  <path d="M480 158 L560 172" class="thin"/>
  <path d="M560 172 L385 244" class="thin"/>
  <circle cx="560" cy="172" r="5" fill="#B0563F"/>
  <text x="120" y="196" class="ts" font-size="10" fill="#B0563F">Reflection point</text>
  <text x="544" y="196" class="ts" font-size="10" text-anchor="end" fill="#B0563F">Reflection point</text>
  <text x="26" y="320" class="ts" font-size="11.5">One panel at the reflection point beats covering the whole wall</text>
  <text x="26" y="362" class="ts" font-size="11">The back wall too: treat the nearest two reflection points first</text>
</svg>
