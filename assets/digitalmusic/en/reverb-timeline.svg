<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 360" role="img" aria-label="The reverb timeline">
  <title>The reverb timeline</title>
  <rect width="660" height="360" fill="#FBF8F4"/>
  <style>
    .t   { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; }
    .tb  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; font-weight: 700; }
    .ts  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #8C8078; }
    .num { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #FFFFFF; font-weight: 700; font-size: 11px; }
    .ink { fill: none; stroke: #3D3229; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; }
    .thin{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; }
    .dash{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; stroke-dasharray: 4 5; }
    .lead{ fill: none; stroke: #8C8078; stroke-width: 1; }
    .acc { fill: none; stroke: #A67C52; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .blue{ fill: none; stroke: #6B8FBF; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .green{ fill: none; stroke: #6F8F6A; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .red { fill: none; stroke: #B0563F; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .dot { fill: #3D3229; }
  </style>
  <text x="26" y="34" class="tb" font-size="16">The reverb timeline</text>
  <text x="26" y="55" class="ts" font-size="12.5">pre-delay、early reflections、decay</text>
  <text x="26" y="84" class="ts" font-size="12">The reverb timeline: pre-delay is the gap, decay is the tail</text>
  <path d="M70 200 L590 200" class="thin"/>
  <rect x="70" y="154" width="40" height="46" rx="3" fill="#A67C52" opacity="0.35"/>
  <text x="90" y="220" class="ts" font-size="9" text-anchor="middle">direct sound</text>
  <path d="M160.0 178.4 L164.0 173.6 L168.0 170.0 L172.0 168.2 L176.0 168.3 L180.0 170.4 L184.0 174.1 L188.0 178.9 L192.0 182.6 L196.0 179.0 L200.0 176.4 L204.0 175.2 L208.0 175.5 L212.0 177.4 L216.0 180.4 L220.0 184.1 L224.0 186.0 L228.0 183.3 L232.0 181.4 L236.0 180.7 L240.0 181.1 L244.0 182.7 L248.0 185.2 L252.0 188.1 L256.0 188.8 L260.0 186.8 L264.0 185.4 L268.0 184.9 L272.0 185.4 L276.0 186.8 L280.0 188.8 L284.0 191.1 L288.0 191.0 L292.0 189.5 L296.0 188.6 L300.0 188.3 L304.0 188.8 L308.0 189.9 L312.0 191.5 L316.0 193.4 L320.0 192.8 L324.0 191.7 L328.0 191.0 L332.0 190.9 L336.0 191.4 L340.0 192.3 L344.0 193.6 L348.0 195.0 L352.0 194.3 L356.0 193.5 L360.0 193.0 L364.0 193.0 L368.0 193.4 L372.0 194.2 L376.0 195.2 L380.0 196.3 L384.0 195.4 L388.0 194.8 L392.0 194.5 L396.0 194.6 L400.0 194.9 L404.0 195.6 L408.0 196.4 L412.0 197.0 L416.0 196.4 L420.0 195.9 L424.0 195.7 L428.0 195.8 L432.0 196.1 L436.0 196.6 L440.0 197.3 L444.0 197.6 L448.0 197.1 L452.0 196.8 L456.0 196.7 L460.0 196.7 L464.0 197.0 L468.0 197.5 L472.0 198.0 L476.0 198.1 L480.0 197.7 L484.0 197.5 L488.0 197.4 L492.0 197.5 L496.0 197.7 L500.0 198.1 L504.0 198.5 L508.0 198.5 L512.0 198.2 L516.0 198.0 L520.0 198.0 L524.0 198.1 L528.0 198.3 L532.0 198.5 L536.0 198.9 L540.0 198.8 L544.0 198.6 L548.0 198.5 L552.0 198.4 L556.0 198.5 L560.0 198.7" class="blue"/>
  <path d="M110 140 L160 140" class="acc"/>
  <text x="135.0" y="132" class="ts" font-size="9.5" text-anchor="middle" fill="#A67C52">Pre-delay</text>
  <path d="M160 140 L560 140" class="blue"/>
  <text x="360.0" y="132" class="ts" font-size="9.5" text-anchor="middle" fill="#6B8FBF">Decay</text>
  <text x="26" y="280" class="ts" font-size="11">Pre-delay 20–30 ms: clear but still in a space; 60 ms and up: a separate room</text>
  <text x="26" y="342" class="ts" font-size="11" fill="#8C8078">Early reflections say how close the walls are; decay says how big the room is</text>
</svg>
