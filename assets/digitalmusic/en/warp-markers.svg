<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 360" role="img" aria-label="Time stretching and quantizing">
  <title>Time stretching and quantizing</title>
  <rect width="660" height="360" fill="#FBF8F4"/>
  <style>
    .t   { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; }
    .tb  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; font-weight: 700; }
    .ts  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #8C8078; }
    .num { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #FFFFFF; font-weight: 700; font-size: 11px; }
    .ink { fill: none; stroke: #3D3229; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; }
    .thin{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; }
    .dash{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; stroke-dasharray: 4 5; }
    .lead{ fill: none; stroke: #8C8078; stroke-width: 1; }
    .acc { fill: none; stroke: #A67C52; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .blue{ fill: none; stroke: #6B8FBF; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .green{ fill: none; stroke: #6F8F6A; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .red { fill: none; stroke: #B0563F; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .dot { fill: #3D3229; }
  </style>
  <text x="26" y="34" class="tb" font-size="16">Time stretching and quantizing</text>
  <text x="26" y="55" class="ts" font-size="12.5">Where the markers sit decides &quot;natural or not&quot; more than the algorithm</text>
  <text x="26" y="84" class="ts" font-size="12">A warp marker says &quot;this hit belongs here on the grid&quot;; marker placement is the timing fix</text>
  <rect x="70" y="110" width="500" height="150" rx="4" fill="#FFFFFF" stroke="#D9CFC4" stroke-width="1.4"/>
  <path d="M70.0 110 L70.0 260" class="thin"/>
  <text x="70.0" y="278" class="ts" font-size="9" text-anchor="middle" fill="#8C8078">0</text>
  <path d="M132.5 110 L132.5 260" class="thin"/>
  <text x="132.5" y="278" class="ts" font-size="9" text-anchor="middle" fill="#8C8078">4</text>
  <path d="M195.0 110 L195.0 260" class="thin"/>
  <text x="195.0" y="278" class="ts" font-size="9" text-anchor="middle" fill="#8C8078">8</text>
  <path d="M257.5 110 L257.5 260" class="thin"/>
  <text x="257.5" y="278" class="ts" font-size="9" text-anchor="middle" fill="#8C8078">12</text>
  <path d="M320.0 110 L320.0 260" class="thin"/>
  <text x="320.0" y="278" class="ts" font-size="9" text-anchor="middle" fill="#8C8078">16</text>
  <path d="M382.5 110 L382.5 260" class="thin"/>
  <text x="382.5" y="278" class="ts" font-size="9" text-anchor="middle" fill="#8C8078">20</text>
  <path d="M445.0 110 L445.0 260" class="thin"/>
  <text x="445.0" y="278" class="ts" font-size="9" text-anchor="middle" fill="#8C8078">24</text>
  <path d="M507.5 110 L507.5 260" class="thin"/>
  <text x="507.5" y="278" class="ts" font-size="9" text-anchor="middle" fill="#8C8078">28</text>
  <path d="M570.0 110 L570.0 260" class="thin"/>
  <text x="570.0" y="278" class="ts" font-size="9" text-anchor="middle" fill="#8C8078">32</text>
  <path d="M80.0 188 L150.0 188 L215.0 188 L275.0 188 L345.0 188 L410.0 188 L480.0 188 L550.0 188" class="acc"/>
  <circle cx="80.0" cy="188" r="4.5" fill="#A67C52"/>
  <path d="M80.0 182 L80.0 144" class="thin" stroke-dasharray="3 3"/>
  <circle cx="150.0" cy="188" r="4.5" fill="#B0563F"/>
  <path d="M150.0 182 L150.0 144" class="thin" stroke-dasharray="3 3"/>
  <circle cx="215.0" cy="188" r="4.5" fill="#A67C52"/>
  <path d="M215.0 182 L215.0 144" class="thin" stroke-dasharray="3 3"/>
  <circle cx="275.0" cy="188" r="4.5" fill="#B0563F"/>
  <path d="M275.0 182 L275.0 144" class="thin" stroke-dasharray="3 3"/>
  <circle cx="345.0" cy="188" r="4.5" fill="#A67C52"/>
  <path d="M345.0 182 L345.0 144" class="thin" stroke-dasharray="3 3"/>
  <circle cx="410.0" cy="188" r="4.5" fill="#B0563F"/>
  <path d="M410.0 182 L410.0 144" class="thin" stroke-dasharray="3 3"/>
  <circle cx="480.0" cy="188" r="4.5" fill="#A67C52"/>
  <path d="M480.0 182 L480.0 144" class="thin" stroke-dasharray="3 3"/>
  <circle cx="550.0" cy="188" r="4.5" fill="#B0563F"/>
  <path d="M550.0 182 L550.0 144" class="thin" stroke-dasharray="3 3"/>
  <text x="70" y="140" class="ts" font-size="10.5" fill="#8C8078">Markers sit on the transients you hear; the grid is the project tempo</text>
  <path d="M80 254 l0 -10" class="thin"/>
  <path d="M84 254 l0 -10" class="thin"/>
  <path d="M88 254 l0 -10" class="thin"/>
  <path d="M92 254 l0 -10" class="thin"/>
  <path d="M96 254 l0 -10" class="thin"/>
  <text x="70" y="216" class="ts" font-size="10" fill="#A67C52">A</text>
  <text x="570" y="216" class="ts" font-size="10" text-anchor="end" fill="#B0563F">B</text>
  <rect x="70" y="288" width="240" height="52" rx="8" fill="#DEE8F3" stroke="#D9CFC4" stroke-width="1.3"/>
  <text x="82" y="310" class="t" font-size="13" font-weight="700">Q: kick first, or snare first?</text>
  <text x="82" y="329" class="ts" font-size="11">clearest transient first, rest follow</text>
  <rect x="330" y="288" width="240" height="52" rx="8" fill="#E4EBDC" stroke="#D9CFC4" stroke-width="1.3"/>
  <text x="342" y="310" class="t" font-size="13" font-weight="700">Q: quantize 100%?</text>
  <text x="342" y="329" class="ts" font-size="11">drums 100%, bass and vocals 60–80%</text>
</svg>
