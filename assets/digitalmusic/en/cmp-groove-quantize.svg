<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 296" role="img" aria-label="Keep the groove or quantize it perfect">
  <title>Keep the groove or quantize it perfect</title>
  <rect width="660" height="296" fill="#FBF8F4"/>
  <style>
    .t   { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; }
    .tb  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; font-weight: 700; }
    .ts  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #8C8078; }
    .num { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #FFFFFF; font-weight: 700; font-size: 11px; }
    .ink { fill: none; stroke: #3D3229; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; }
    .thin{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; }
    .dash{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; stroke-dasharray: 4 5; }
    .lead{ fill: none; stroke: #8C8078; stroke-width: 1; }
    .acc { fill: none; stroke: #A67C52; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .blue{ fill: none; stroke: #6B8FBF; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .green{ fill: none; stroke: #6F8F6A; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .red { fill: none; stroke: #B0563F; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .dot { fill: #3D3229; }
  </style>
  <text x="26" y="34" class="tb" font-size="16">Keep the groove or quantize it perfect</text>
  <text x="26" y="55" class="ts" font-size="12.5">Quantizing tightens the rhythm and drains the feel</text>
  <text x="150.0" y="92" class="t" font-size="11.5" font-weight="700" fill="#A67C52">Sounds like</text>  <text x="395.0" y="92" class="t" font-size="11.5" font-weight="700" fill="#A67C52">When to use it</text>  <rect x="26" y="104" width="608" height="58" rx="4" fill="#F3E9DC" opacity="0.55"/>  <text x="34" y="126" class="t" font-size="11.5" font-weight="700">Full quantize</text>  <text x="150.0" y="124" class="ts" font-size="10" fill="#5D4E41">Tight, mechanical</text>  <text x="395.0" y="124" class="ts" font-size="10" fill="#5D4E41">EDM, sections that must be tight</text>  <text x="34" y="184" class="t" font-size="11.5" font-weight="700">Keep the groove</text>  <text x="150.0" y="182" class="ts" font-size="10" fill="#5D4E41">Human, slightly loose</text>  <text x="395.0" y="182" class="ts" font-size="10" fill="#5D4E41">Jazz, funk, real players</text>  <rect x="26" y="220" width="608" height="58" rx="4" fill="#F3E9DC" opacity="0.55"/>  <text x="34" y="242" class="t" font-size="11.5" font-weight="700">Fix the obvious ones</text>  <text x="150.0" y="240" class="ts" font-size="10" fill="#5D4E41">Between the two</text>  <text x="395.0" y="240" class="ts" font-size="10" fill="#5D4E41">What pop usually does</text>
  <text x="26" y="278" class="ts" font-size="11">The compromise: quantize, then put a little error back into timing and velocity</text>
</svg>
