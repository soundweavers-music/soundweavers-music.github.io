<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400" role="img" aria-label="Gain staging: four levels">
  <title>Gain staging: four levels</title>
  <rect width="660" height="400" fill="#FBF8F4"/>
  <style>
    .t   { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; }
    .tb  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; font-weight: 700; }
    .ts  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #8C8078; }
    .num { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #FFFFFF; font-weight: 700; font-size: 11px; }
    .ink { fill: none; stroke: #3D3229; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; }
    .thin{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; }
    .dash{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; stroke-dasharray: 4 5; }
    .lead{ fill: none; stroke: #8C8078; stroke-width: 1; }
    .acc { fill: none; stroke: #A67C52; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .blue{ fill: none; stroke: #6B8FBF; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .green{ fill: none; stroke: #6F8F6A; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .red { fill: none; stroke: #B0563F; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .dot { fill: #3D3229; }
  </style>
  <text x="26" y="34" class="tb" font-size="16">Gain staging: four levels</text>
  <text x="26" y="55" class="ts" font-size="12.5">Mic to bus, every stage needs headroom</text>
  <text x="26" y="84" class="ts" font-size="12">Realign at every stage; one hot stage and nothing downstream saves it</text>
  <rect x="76" y="112" width="40" height="200" rx="4" fill="#FFFFFF" stroke="#D9CFC4" stroke-width="1.4"/>
  <text x="96.0" y="104" class="ts" font-size="10" text-anchor="middle" fill="#8C8078">0 dBFS</text>
  <path d="M70 112 L116 112" class="thin"/>
  <text x="66" y="116" class="ts" font-size="9.5" text-anchor="end" fill="#8C8078">0</text>
  <path d="M70 152.0 L116 152.0" class="thin"/>
  <text x="66" y="156.0" class="ts" font-size="9.5" text-anchor="end" fill="#8C8078">−20</text>
  <path d="M70 192.0 L116 192.0" class="thin"/>
  <text x="66" y="196.0" class="ts" font-size="9.5" text-anchor="end" fill="#8C8078">−40</text>
  <path d="M70 232.0 L116 232.0" class="thin"/>
  <text x="66" y="236.0" class="ts" font-size="9.5" text-anchor="end" fill="#8C8078">−60</text>
  <path d="M70 272.0 L116 272.0" class="thin"/>
  <text x="66" y="276.0" class="ts" font-size="9.5" text-anchor="end" fill="#8C8078">−80</text>
  <path d="M70 312.0 L116 312.0" class="thin"/>
  <text x="66" y="316.0" class="ts" font-size="9.5" text-anchor="end" fill="#8C8078">−∞</text>
  <circle cx="130" cy="244.0" r="4.5" fill="#6B8FBF"/>
  <text x="146" y="248.0" class="t" font-size="12" font-weight="600" fill="#6B8FBF">Mic out</text>
  <text x="246" y="248.0" class="ts" font-size="10.5">About −50 dBFS, very small</text>
  <circle cx="130" cy="184.0" r="4.5" fill="#A67C52"/>
  <text x="146" y="188.0" class="t" font-size="12" font-weight="600" fill="#A67C52">Preamp</text>
  <text x="246" y="188.0" class="ts" font-size="10.5">Up to the −18 dBFS target</text>
  <circle cx="130" cy="148.0" r="4.5" fill="#6F8F6A"/>
  <text x="146" y="152.0" class="t" font-size="12" font-weight="600" fill="#6F8F6A">Into the DAW</text>
  <text x="246" y="152.0" class="ts" font-size="10.5">Peaks at −12 to −6 dBFS</text>
  <circle cx="130" cy="120.0" r="4.5" fill="#A67C52"/>
  <text x="146" y="124.0" class="t" font-size="12" font-weight="600" fill="#A67C52">Mix bus</text>
  <text x="246" y="124.0" class="ts" font-size="10.5">Peaks no higher than −3 dBFS</text>
  <rect x="60" y="330" width="540" height="34" rx="6" fill="#F4DFD7" opacity="0.6"/>
  <text x="74" y="352" class="ts" font-size="10.5" fill="#B0563F">0 dBFS is a hard ceiling: cross it and the clipping is in the file</text>
  <text x="26" y="382" class="ts" font-size="11">Measure, do not guess: check the meter at every stage</text>
</svg>
