  <text x="26" y="286" class="ts" font-size="11">1–3 dB of gain reduction is inaudible; past 6 dB you start losing punch</text>
  <text x="26" y="332" class="ts" font-size="11" fill="#8C8078">Watch the GR meter, not the waveform; flat tops mean the ceiling is too low</text>
</svg>
