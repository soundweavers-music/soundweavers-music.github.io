<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 346" role="img" aria-label="The export checklist, in order">
  <title>The export checklist, in order</title>
  <rect width="660" height="346" fill="#FBF8F4"/>
  <style>
    .t   { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; }
    .tb  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; font-weight: 700; }
    .ts  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #8C8078; }
    .num { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #FFFFFF; font-weight: 700; font-size: 11px; }
    .ink { fill: none; stroke: #3D3229; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; }
    .thin{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; }
    .dash{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; stroke-dasharray: 4 5; }
    .lead{ fill: none; stroke: #8C8078; stroke-width: 1; }
    .acc { fill: none; stroke: #A67C52; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .blue{ fill: none; stroke: #6B8FBF; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .green{ fill: none; stroke: #6F8F6A; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .red { fill: none; stroke: #B0563F; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .dot { fill: #3D3229; }
  </style>
  <text x="26" y="34" class="tb" font-size="16">The export checklist, in order</text>
  <text x="26" y="55" class="ts" font-size="12.5">Five minutes of this saves a redo</text>
  <circle cx="38.0" cy="110" r="10" fill="#A67C52"/>  <text x="38.0" y="114" text-anchor="middle" class="num">1</text>  <rect x="26.0" y="96" width="141.5" height="88" rx="9" fill="#F3E9DC" stroke="#D9CFC4" stroke-width="1.4"/>  <text x="36.0" y="140" class="t" font-size="12.5" font-weight="700">Peaks</text>  <text x="36.0" y="158" class="ts" font-size="9.5" fill="#8C8078">True Peak must stay</text>  <text x="36.0" y="173" class="ts" font-size="9.5" fill="#8C8078">under -1 dBTP</text>  <path d="M169.5 140.0 L173.2 140.0" fill="none" stroke="#A67C52" stroke-width="1.7" stroke-linecap="round"/><path d="M179.5 140.0 L173.1 142.9 L173.1 137.1 Z" fill="#A67C52"/>  <circle cx="193.5" cy="110" r="10" fill="#A67C52"/>  <text x="193.5" y="114" text-anchor="middle" class="num">2</text>  <rect x="181.5" y="96" width="141.5" height="88" rx="9" fill="#F3E9DC" stroke="#D9CFC4" stroke-width="1.4"/>  <text x="191.5" y="140" class="t" font-size="12.5" font-weight="700">Loudness</text>  <text x="191.5" y="158" class="ts" font-size="9.5" fill="#8C8078">Match the platform target</text>  <path d="M325.0 140.0 L328.7 140.0" fill="none" stroke="#A67C52" stroke-width="1.7" stroke-linecap="round"/><path d="M335.0 140.0 L328.6 142.9 L328.6 137.1 Z" fill="#A67C52"/>  <circle cx="349.0" cy="110" r="10" fill="#A67C52"/>  <text x="349.0" y="114" text-anchor="middle" class="num">3</text>  <rect x="337.0" y="96" width="141.5" height="88" rx="9" fill="#F3E9DC" stroke="#D9CFC4" stroke-width="1.4"/>  <text x="347.0" y="140" class="t" font-size="12.5" font-weight="700">Length</text>  <text x="347.0" y="158" class="ts" font-size="9.5" fill="#8C8078">No stray silence or cut-offs at</text>  <text x="347.0" y="173" class="ts" font-size="9.5" fill="#8C8078">either end</text>  <path d="M480.5 140.0 L484.2 140.0" fill="none" stroke="#A67C52" stroke-width="1.7" stroke-linecap="round"/><path d="M490.5 140.0 L484.1 142.9 L484.1 137.1 Z" fill="#A67C52"/>  <circle cx="504.5" cy="110" r="10" fill="#A67C52"/>  <text x="504.5" y="114" text-anchor="middle" class="num">4</text>  <rect x="492.5" y="96" width="141.5" height="88" rx="9" fill="#F3E9DC" stroke="#D9CFC4" stroke-width="1.4"/>  <text x="502.5" y="140" class="t" font-size="12.5" font-weight="700">Phase</text>  <text x="502.5" y="158" class="ts" font-size="9.5" fill="#8C8078">Fold to mono and check that</text>  <text x="502.5" y="173" class="ts" font-size="9.5" fill="#8C8078">nothing disappears</text>  <circle cx="38.0" cy="232" r="10" fill="#A67C52"/>  <text x="38.0" y="236" text-anchor="middle" class="num">5</text>  <rect x="26.0" y="218" width="141.5" height="88" rx="9" fill="#F3E9DC" stroke="#D9CFC4" stroke-width="1.4"/>  <text x="36.0" y="262" class="t" font-size="12.5" font-weight="700">Name it</text>  <text x="36.0" y="280" class="ts" font-size="9.5" fill="#8C8078">Version and date in the filename</text>
  <text x="26" y="328" class="ts" font-size="11">Keep a lossless master; convert a separate compressed file for the platform</text>
</svg>
