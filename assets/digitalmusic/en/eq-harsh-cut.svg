<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 366" role="img" aria-label="Taking the sting out of 2–4 kHz">
  <title>Taking the sting out of 2–4 kHz</title>
  <rect width="660" height="366" fill="#FBF8F4"/>
  <style>
    .t   { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; }
