<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 380" role="img" aria-label="Takes and comps">
  <title>Takes and comps</title>
  <rect width="660" height="380" fill="#FBF8F4"/>
  <style>
    .t   { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; }
    .tb  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; font-weight: 700; }
    .ts  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #8C8078; }
    .num { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #FFFFFF; font-weight: 700; font-size: 11px; }
    .ink { fill: none; stroke: #3D3229; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; }
    .thin{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; }
    .dash{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; stroke-dasharray: 4 5; }
    .lead{ fill: none; stroke: #8C8078; stroke-width: 1; }
    .acc { fill: none; stroke: #A67C52; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .blue{ fill: none; stroke: #6B8FBF; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .green{ fill: none; stroke: #6F8F6A; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .red { fill: none; stroke: #B0563F; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .dot { fill: #3D3229; }
  </style>
  <text x="26" y="34" class="tb" font-size="16">Takes and comps</text>
  <text x="26" y="55" class="ts" font-size="12.5">One finished line is many small pieces</text>
  <text x="26" y="84" class="ts" font-size="12">Comping is picking the best of each take, piece by piece</text>
  <text x="100" y="136" class="ts" font-size="9.5" text-anchor="end" fill="#8C8078">Take 1</text>
  <rect x="112.0" y="120" width="111.0" height="32" rx="3" fill="#6F8F6A" stroke="#D9CFC4" stroke-width="1.4" opacity="0.35"/>
  <text x="167.5" y="142" class="ts" font-size="11" text-anchor="middle" fill="#6F8F6A">✓</text>
  <rect x="227.0" y="120" width="111.0" height="32" rx="3" fill="#FFFFFF" stroke="#D9CFC4" stroke-width="1.4" opacity="1"/>
  <rect x="342.0" y="120" width="111.0" height="32" rx="3" fill="#FFFFFF" stroke="#D9CFC4" stroke-width="1.4" opacity="1"/>
  <rect x="457.0" y="120" width="111.0" height="32" rx="3" fill="#FFFFFF" stroke="#D9CFC4" stroke-width="1.4" opacity="1"/>
  <text x="100" y="190" class="ts" font-size="9.5" text-anchor="end" fill="#8C8078">Take 2</text>
  <rect x="112.0" y="174" width="111.0" height="32" rx="3" fill="#FFFFFF" stroke="#D9CFC4" stroke-width="1.4" opacity="1"/>
  <rect x="227.0" y="174" width="111.0" height="32" rx="3" fill="#6F8F6A" stroke="#D9CFC4" stroke-width="1.4" opacity="0.35"/>
  <text x="282.5" y="196" class="ts" font-size="11" text-anchor="middle" fill="#6F8F6A">✓</text>
  <rect x="342.0" y="174" width="111.0" height="32" rx="3" fill="#FFFFFF" stroke="#D9CFC4" stroke-width="1.4" opacity="1"/>
  <rect x="457.0" y="174" width="111.0" height="32" rx="3" fill="#6F8F6A" stroke="#D9CFC4" stroke-width="1.4" opacity="0.35"/>
  <text x="512.5" y="196" class="ts" font-size="11" text-anchor="middle" fill="#6F8F6A">✓</text>
  <text x="100" y="244" class="ts" font-size="9.5" text-anchor="end" fill="#8C8078">Take 3</text>
  <rect x="112.0" y="228" width="111.0" height="32" rx="3" fill="#FFFFFF" stroke="#D9CFC4" stroke-width="1.4" opacity="1"/>
  <rect x="227.0" y="228" width="111.0" height="32" rx="3" fill="#FFFFFF" stroke="#D9CFC4" stroke-width="1.4" opacity="1"/>
  <rect x="342.0" y="228" width="111.0" height="32" rx="3" fill="#6F8F6A" stroke="#D9CFC4" stroke-width="1.4" opacity="0.35"/>
  <text x="397.5" y="250" class="ts" font-size="11" text-anchor="middle" fill="#6F8F6A">✓</text>
  <rect x="457.0" y="228" width="111.0" height="32" rx="3" fill="#FFFFFF" stroke="#D9CFC4" stroke-width="1.4" opacity="1"/>
  <text x="100" y="298" class="ts" font-size="9.5" text-anchor="end" fill="#A67C52">Comp</text>
  <rect x="112.0" y="282" width="111.0" height="32" rx="3" fill="#A67C52" opacity="0.25"/>
  <rect x="227.0" y="282" width="111.0" height="32" rx="3" fill="#A67C52" opacity="0.25"/>
  <rect x="342.0" y="282" width="111.0" height="32" rx="3" fill="#A67C52" opacity="0.25"/>
  <rect x="457.0" y="282" width="111.0" height="32" rx="3" fill="#A67C52" opacity="0.25"/>
  <text x="340.0" y="304" class="ts" font-size="9.5" text-anchor="middle">Crossfade the joins between the pieces</text>
  <text x="26" y="348" class="ts" font-size="11">Hear each piece three times: pitch, then timing, then feeling alone</text>
  <text x="26" y="362" class="ts" font-size="11" fill="#8C8078">Cut at a breath or a consonant and nobody hears the splice</text>
</svg>
