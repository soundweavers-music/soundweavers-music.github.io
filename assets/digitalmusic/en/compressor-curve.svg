<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400" role="img" aria-label="The compressor transfer curve">
  <title>The compressor transfer curve</title>
  <rect width="660" height="400" fill="#FBF8F4"/>
  <style>
    .t   { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; }
    .tb  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; font-weight: 700; }
    .ts  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #8C8078; }
    .num { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #FFFFFF; font-weight: 700; font-size: 11px; }
    .ink { fill: none; stroke: #3D3229; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; }
    .thin{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; }
    .dash{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; stroke-dasharray: 4 5; }
    .lead{ fill: none; stroke: #8C8078; stroke-width: 1; }
    .acc { fill: none; stroke: #A67C52; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .blue{ fill: none; stroke: #6B8FBF; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .green{ fill: none; stroke: #6F8F6A; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .red { fill: none; stroke: #B0563F; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .dot { fill: #3D3229; }
  </style>
  <text x="26" y="34" class="tb" font-size="16">The compressor transfer curve</text>
  <text x="26" y="55" class="ts" font-size="12.5">Above the threshold the in/out slope changes</text>
  <text x="26" y="84" class="ts" font-size="12">It changes how the output follows a rising input: slope, not level</text>
  <rect x="90" y="130" width="206" height="206" rx="4" fill="#FFFFFF" stroke="#D9CFC4" stroke-width="1.4"/>
  <path d="M90.0 336.0 L313.7 336.0" fill="none" stroke="#8C8078" stroke-width="1.7" stroke-linecap="round"/><path d="M320.0 336.0 L313.6 338.9 L313.6 333.1 Z" fill="#8C8078"/>
  <path d="M90.0 336.0 L90.0 114.3" fill="none" stroke="#8C8078" stroke-width="1.7" stroke-linecap="round"/><path d="M90.0 108.0 L92.9 114.4 L87.1 114.4 Z" fill="#8C8078"/>
  <text x="314" y="370" class="ts" font-size="10" text-anchor="end">Input dB</text>
  <text x="82" y="116" class="ts" font-size="10" text-anchor="middle">Output dB</text>
  <path d="M90 336 L296 130" class="thin" stroke-dasharray="4 4"/>
  <path d="M90 336 L234.2 191.8 L296 207.2" class="acc"/>
  <circle cx="234.2" cy="191.8" r="4.5" fill="#B0563F"/>
  <text x="242.2" y="183.8" class="ts" font-size="10" fill="#B0563F">Threshold −18 dB</text>
  <text x="292" y="199.25" class="ts" font-size="11" text-anchor="end" fill="#A67C52">4:1</text>
  <text x="100" y="330" class="ts" font-size="9.5" fill="#8C8078">1:1</text>
  <text x="400" y="120" class="t" font-size="12" font-weight="700">Threshold</text>
  <text x="400" y="138" class="ts" font-size="10.5" fill="#8C8078">Where it starts</text>
  <text x="400" y="164" class="t" font-size="12" font-weight="700">Ratio</text>
  <text x="400" y="182" class="ts" font-size="10.5" fill="#8C8078">How hard</text>
  <text x="400" y="208" class="t" font-size="12" font-weight="700">Attack</text>
  <text x="400" y="226" class="ts" font-size="10.5" fill="#8C8078">How fast it starts</text>
  <text x="400" y="252" class="t" font-size="12" font-weight="700">Release</text>
  <text x="400" y="270" class="ts" font-size="10.5" fill="#8C8078">How fast it lets go</text>
  <circle cx="392" cy="116" r="5" fill="#A67C52" opacity="0.7"/>
  <text x="26" y="352" class="ts" font-size="11">More compression means more noise back with makeup gain: the hidden cost</text>
  <text x="26" y="382" class="ts" font-size="11">Listen to the tail getting longer or shorter; the gain-reduction meter is no help</text>
</svg>
