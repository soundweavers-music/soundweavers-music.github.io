  <text x="26" y="34" class="tb" font-size="16">Plosives are an airflow problem</text>
  <text x="26" y="55" class="ts" font-size="12.5">On the waveform it is a low-frequency pulse, not loudness</text>
  <text x="26" y="84" class="ts" font-size="12">The puff behind P and B hits the diaphragm and leaves a low thump</text>
