  <text x="26" y="55" class="ts" font-size="12.5">Nyquist: sample at least twice the highest frequency</text>
  <text x="26" y="84" class="ts" font-size="12">Sample: measure at fixed intervals. Quantize: snap each value to the nearest step</text>
