<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 350" role="img" aria-label="Multiband on the master: glue and polish">
  <title>Multiband on the master: glue and polish</title>
  <rect width="660" height="350" fill="#FBF8F4"/>
  <style>
    .t   { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; }
    .tb  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; font-weight: 700; }
    .ts  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #8C8078; }
    .num { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #FFFFFF; font-weight: 700; font-size: 11px; }
    .ink { fill: none; stroke: #3D3229; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; }
    .thin{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; }
    .dash{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; stroke-dasharray: 4 5; }
    .lead{ fill: none; stroke: #8C8078; stroke-width: 1; }
    .acc { fill: none; stroke: #A67C52; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .blue{ fill: none; stroke: #6B8FBF; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .green{ fill: none; stroke: #6F8F6A; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .red { fill: none; stroke: #B0563F; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .dot { fill: #3D3229; }
  </style>
  <text x="26" y="34" class="tb" font-size="16">Multiband on the master: glue and polish</text>
  <text x="26" y="55" class="ts" font-size="12.5">Key points of this section</text>
  <rect x="26.0" y="96" width="295.0" height="96" rx="9" fill="#F3E9DC" stroke="#D9CFC4" stroke-width="1.4"/>  <circle cx="40.0" cy="116" r="10" fill="#A67C52"/>  <text x="40.0" y="120" text-anchor="middle" class="num">1</text>  <text x="60.0" y="121" class="t" font-size="12" font-weight="700">Use a little</text>  <text x="40.0" y="144" class="ts" font-size="9.5" fill="#8C8078">total gain reduction</text>  <text x="40.0" y="160" class="ts" font-size="9.5" fill="#8C8078">under 1-3 dB, each band no more</text>  <text x="40.0" y="176" class="ts" font-size="9.5" fill="#8C8078">1-2dB</text>  <rect x="339.0" y="96" width="295.0" height="96" rx="9" fill="#F3E9DC" stroke="#D9CFC4" stroke-width="1.4"/>  <circle cx="353.0" cy="116" r="10" fill="#A67C52"/>  <text x="353.0" y="120" text-anchor="middle" class="num">2</text>  <text x="373.0" y="121" class="t" font-size="12" font-weight="700">Very low ratio</text>  <text x="353.0" y="144" class="ts" font-size="9.5" fill="#8C8078">1.25:1 to 1.5:1 is plenty: it is</text>  <text x="353.0" y="160" class="ts" font-size="9.5" fill="#8C8078">dynamic tidying, not</text>  <text x="353.0" y="176" class="ts" font-size="9.5" fill="#8C8078">compression</text>  <rect x="26.0" y="206" width="295.0" height="96" rx="9" fill="#F3E9DC" stroke="#D9CFC4" stroke-width="1.4"/>  <circle cx="40.0" cy="226" r="10" fill="#A67C52"/>  <text x="40.0" y="230" text-anchor="middle" class="num">3</text>  <text x="60.0" y="231" class="t" font-size="12" font-weight="700">Wide crossovers</text>  <text x="40.0" y="254" class="ts" font-size="9.5" fill="#8C8078">on the master, keep crossovers</text>  <text x="40.0" y="270" class="ts" font-size="9.5" fill="#8C8078">wide (LR4 is usual, LR8 when</text>  <text x="40.0" y="286" class="ts" font-size="9.5" fill="#8C8078">you need a steeper slope)</text>  <rect x="339.0" y="206" width="295.0" height="96" rx="9" fill="#F3E9DC" stroke="#D9CFC4" stroke-width="1.4"/>  <circle cx="353.0" cy="226" r="10" fill="#A67C52"/>  <text x="353.0" y="230" text-anchor="middle" class="num">4</text>  <text x="373.0" y="231" class="t" font-size="12" font-weight="700">Slow attack, mid release</text>  <text x="353.0" y="254" class="ts" font-size="9.5" fill="#8C8078">attack 30-50 ms,</text>  <text x="353.0" y="270" class="ts" font-size="9.5" fill="#8C8078">release about 50-100</text>  <text x="353.0" y="286" class="ts" font-size="9.5" fill="#8C8078">ms</text>
</svg>
