<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 380" role="img" aria-label="Dynamic vs. condenser mics">
  <title>Dynamic vs. condenser mics</title>
  <rect width="660" height="380" fill="#FBF8F4"/>
  <style>
    .t   { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; }
    .tb  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; font-weight: 700; }
    .ts  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #8C8078; }
    .num { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #FFFFFF; font-weight: 700; font-size: 11px; }
    .ink { fill: none; stroke: #3D3229; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; }
    .thin{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; }
    .dash{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; stroke-dasharray: 4 5; }
    .lead{ fill: none; stroke: #8C8078; stroke-width: 1; }
    .acc { fill: none; stroke: #A67C52; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .blue{ fill: none; stroke: #6B8FBF; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .green{ fill: none; stroke: #6F8F6A; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .red { fill: none; stroke: #B0563F; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .dot { fill: #3D3229; }
  </style>
  <text x="26" y="34" class="tb" font-size="16">Dynamic vs. condenser mics</text>
  <text x="26" y="55" class="ts" font-size="12.5">Sensitivity decides how much room it hears</text>
  <text x="26" y="84" class="ts" font-size="12">Same line, two versions; the difference is sensitivity and max SPL</text>
  <rect x="60" y="108" width="250" height="150" rx="8" fill="#FFFFFF" stroke="#A67C52" stroke-width="1.5"/>
  <text x="74" y="132" class="t" font-size="12.5" font-weight="700" fill="#A67C52">Dynamic</text>
  <text x="74" y="152" class="ts" font-size="9.5" fill="#8C8078">low sensitivity, high SPL, no power</text>
  <circle cx="120" cy="210" r="18" fill="#3D3229" opacity="0.8"/>
  <path d="M140 198 q18 -6 36 0" class="thin" stroke-dasharray="3 3"/>
  <path d="M140 206 q18 -2 36 0" class="thin" stroke-dasharray="3 3"/>
  <path d="M140 214 q18 2 36 0" class="thin" stroke-dasharray="3 3"/>
  <path d="M140 222 q18 6 36 0" class="thin" stroke-dasharray="3 3"/>
  <text x="156" y="238" class="ts" font-size="9">capture range</text>
  <text x="156" y="252" class="ts" font-size="10" fill="#A67C52">about 45%</text>
  <rect x="350" y="108" width="250" height="150" rx="8" fill="#FFFFFF" stroke="#6B8FBF" stroke-width="1.5"/>
  <text x="364" y="132" class="t" font-size="12.5" font-weight="700" fill="#6B8FBF">Condenser</text>
  <text x="364" y="152" class="ts" font-size="9.5" fill="#8C8078">high sensitivity, more detail, needs +48V</text>
  <circle cx="410" cy="210" r="18" fill="#3D3229" opacity="0.8"/>
  <path d="M430 198 q38 -6 76 0" class="thin" stroke-dasharray="3 3"/>
  <path d="M430 206 q38 -2 76 0" class="thin" stroke-dasharray="3 3"/>
  <path d="M430 214 q38 2 76 0" class="thin" stroke-dasharray="3 3"/>
  <path d="M430 222 q38 6 76 0" class="thin" stroke-dasharray="3 3"/>
  <text x="446" y="238" class="ts" font-size="9">capture range</text>
  <text x="446" y="252" class="ts" font-size="10" fill="#6B8FBF">about 95%</text>
  <rect x="60" y="280" width="250" height="56" rx="8" fill="#F3E9DC" stroke="#D9CFC4" stroke-width="1.3"/>
  <text x="72" y="302" class="t" font-size="13" font-weight="700">noisy room, drums and guitar cabs</text>
  <text x="72" y="321" class="ts" font-size="11">buy a dynamic first</text>
  <rect x="340" y="280" width="260" height="56" rx="8" fill="#DEE8F3" stroke="#D9CFC4" stroke-width="1.3"/>
  <text x="352" y="302" class="t" font-size="13" font-weight="700">quiet room, detailed vocals</text>
  <text x="352" y="321" class="ts" font-size="11">then a condenser</text>
  <text x="26" y="362" class="ts" font-size="11">A condenser records the room plus the voice; a bad room will show</text>
</svg>
