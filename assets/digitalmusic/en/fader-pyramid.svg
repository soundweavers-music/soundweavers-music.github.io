<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 360" role="img" aria-label="The fader hierarchy">
  <title>The fader hierarchy</title>
  <rect width="660" height="360" fill="#FBF8F4"/>
  <style>
    .t   { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; }
    .tb  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; font-weight: 700; }
    .ts  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #8C8078; }
    .num { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #FFFFFF; font-weight: 700; font-size: 11px; }
    .ink { fill: none; stroke: #3D3229; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; }
    .thin{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; }
    .dash{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; stroke-dasharray: 4 5; }
    .lead{ fill: none; stroke: #8C8078; stroke-width: 1; }
    .acc { fill: none; stroke: #A67C52; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .blue{ fill: none; stroke: #6B8FBF; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .green{ fill: none; stroke: #6F8F6A; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .red { fill: none; stroke: #B0563F; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .dot { fill: #3D3229; }
  </style>
  <text x="26" y="34" class="tb" font-size="16">The fader hierarchy</text>
  <text x="26" y="55" class="ts" font-size="12.5">Build down from the vocal, do not guess from the top</text>
  <text x="26" y="84" class="ts" font-size="12">Decide what is in front, then place the rest around it; order beats numbers</text>
  <rect x="120.0" y="118" width="420.0" height="40" rx="6" fill="#A67C52" stroke="#A67C52" stroke-width="1.3" opacity="0.33249999999999996"/>
  <text x="134.0" y="143" class="t" font-size="12" font-weight="700">Lead vocal</text>
  <text x="528.0" y="143" class="ts" font-size="10" text-anchor="end">0 dB reference</text>
  <rect x="157.79999999999998" y="170" width="344.40000000000003" height="40" rx="6" fill="#5D4E41" stroke="#5D4E41" stroke-width="1.3" opacity="0.287"/>
  <text x="171.79999999999998" y="195" class="t" font-size="12" font-weight="700">Drums and bass</text>
  <text x="490.20000000000005" y="195" class="ts" font-size="10" text-anchor="end">−3 to −6 dB</text>
  <rect x="195.6" y="222" width="268.8" height="40" rx="6" fill="#6F8F6A" stroke="#6F8F6A" stroke-width="1.3" opacity="0.23099999999999998"/>
  <text x="209.6" y="247" class="t" font-size="12" font-weight="700">Rhythm gtr / keys</text>
  <text x="452.4" y="247" class="ts" font-size="10" text-anchor="end">−9 to −15 dB</text>
  <rect x="233.4" y="274" width="193.2" height="40" rx="6" fill="#6B8FBF" stroke="#6B8FBF" stroke-width="1.3" opacity="0.175"/>
  <text x="247.4" y="299" class="t" font-size="12" font-weight="700">Harmony / fx</text>
  <text x="414.6" y="299" class="ts" font-size="10" text-anchor="end">−15 to −21 dB</text>
  <text x="26" y="318" class="ts" font-size="11.5">Then mute the vocal: do the rest still sound like a song?</text>
  <text x="26" y="342" class="ts" font-size="11">Do not touch EQ or compression before the static mix; balance first, tone after</text>
</svg>
