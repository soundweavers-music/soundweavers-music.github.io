<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 380" role="img" aria-label="Direct Monitor vs. software monitoring">
  <title>Direct Monitor vs. software monitoring</title>
  <rect width="660" height="380" fill="#FBF8F4"/>
  <style>
    .t   { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; }
    .tb  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; font-weight: 700; }
    .ts  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #8C8078; }
    .num { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #FFFFFF; font-weight: 700; font-size: 11px; }
    .ink { fill: none; stroke: #3D3229; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; }
    .thin{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; }
    .dash{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; stroke-dasharray: 4 5; }
    .lead{ fill: none; stroke: #8C8078; stroke-width: 1; }
    .acc { fill: none; stroke: #A67C52; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .blue{ fill: none; stroke: #6B8FBF; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .green{ fill: none; stroke: #6F8F6A; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .red { fill: none; stroke: #B0563F; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .dot { fill: #3D3229; }
  </style>
  <text x="26" y="34" class="tb" font-size="16">Direct Monitor vs. software monitoring</text>
  <text x="26" y="55" class="ts" font-size="12.5">Keep latency in the computer, not in your ears</text>
  <text x="26" y="84" class="ts" font-size="12">Same sound: direct out, or through the computer — that gap is latency</text>
  <rect x="50" y="120" width="130" height="64" rx="8" fill="#FFFFFF" stroke="#D9CFC4" stroke-width="1.3"/>
  <text x="62" y="142" class="t" font-size="13" font-weight="700">singer</text>
  <text x="62" y="161" class="ts" font-size="11">into the mic</text>
  <rect x="220" y="120" width="150" height="64" rx="8" fill="#F3E9DC" stroke="#D9CFC4" stroke-width="1.3"/>
  <text x="232" y="142" class="t" font-size="13" font-weight="700">interface</text>
  <text x="232" y="161" class="ts" font-size="11">preamp + AD</text>
  <rect x="410" y="120" width="130" height="64" rx="8" fill="#DEE8F3" stroke="#D9CFC4" stroke-width="1.3"/>
  <text x="422" y="142" class="t" font-size="13" font-weight="700">computer DAW</text>
  <text x="422" y="161" class="ts" font-size="11">record, run plugins</text>
  <rect x="220" y="250" width="150" height="64" rx="8" fill="#E4EBDC" stroke="#D9CFC4" stroke-width="1.3"/>
  <text x="232" y="272" class="t" font-size="13" font-weight="700">headphone out</text>
  <text x="232" y="291" class="ts" font-size="11">Cue mix</text>
  <path d="M180.0 152.0 L210.6 152.0" fill="none" stroke="#8C8078" stroke-width="1.7" stroke-linecap="round"/><path d="M216.0 152.0 L210.5 154.4 L210.5 149.6 Z" fill="#8C8078"/>
  <path d="M370.0 152.0 L400.6 152.0" fill="none" stroke="#8C8078" stroke-width="1.7" stroke-linecap="round"/><path d="M406.0 152.0 L400.5 154.4 L400.5 149.6 Z" fill="#8C8078"/>
  <path d="M475 184 C475 232 420 250 374 268" class="blue"/>
  <path d="M420.0 258.0 L381.2 268.6" fill="none" stroke="#6B8FBF" stroke-width="1.7" stroke-linecap="round"/><path d="M376.0 270.0 L380.6 266.2 L381.9 270.9 Z" fill="#6B8FBF"/>
  <text x="492" y="232" class="ts" font-size="10.5" fill="#6B8FBF">via computer = latency</text>
  <path d="M260 184 C260 216 258 234 258 246" class="green"/>
  <path d="M258.0 240.0 L258.0 240.6" fill="none" stroke="#6F8F6A" stroke-width="1.7" stroke-linecap="round"/><path d="M258.0 246.0 L255.6 240.5 L260.4 240.5 Z" fill="#6F8F6A"/>
  <text x="272" y="218" class="ts" font-size="10.5" fill="#6F8F6A">Direct Monitor: skips the computer</text>
  <path d="M370.0 282.0 L185.4 282.0" fill="none" stroke="#8C8078" stroke-width="1.7" stroke-linecap="round"/><path d="M180.0 282.0 L185.5 279.6 L185.5 284.4 Z" fill="#8C8078"/>
  <text x="275" y="300" class="ts" font-size="10" text-anchor="middle">backing track in the headphones</text>
  <text x="26" y="348" class="ts" font-size="11">Past about 10 ms you sing out of time; use Direct Monitor or a smaller buffer</text>
  <text x="26" y="362" class="ts" font-size="11">Compensate after recording: playback can land a few ms late</text>
</svg>
