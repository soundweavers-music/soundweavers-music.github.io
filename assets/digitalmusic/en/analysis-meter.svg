<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400" role="img" aria-label="Three analysis meters">
  <title>Three analysis meters</title>
  <rect width="660" height="400" fill="#FBF8F4"/>
  <style>
    .t   { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; }
    .tb  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; font-weight: 700; }
    .ts  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #8C8078; }
    .num { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #FFFFFF; font-weight: 700; font-size: 11px; }
    .ink { fill: none; stroke: #3D3229; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; }
    .thin{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; }
    .dash{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; stroke-dasharray: 4 5; }
    .lead{ fill: none; stroke: #8C8078; stroke-width: 1; }
    .acc { fill: none; stroke: #A67C52; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .blue{ fill: none; stroke: #6B8FBF; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .green{ fill: none; stroke: #6F8F6A; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .red { fill: none; stroke: #B0563F; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .dot { fill: #3D3229; }
  </style>
  <text x="26" y="34" class="tb" font-size="16">Three analysis meters</text>
  <text x="26" y="55" class="ts" font-size="12.5">Spectrum, phase, goniometer: one question each</text>
  <text x="26" y="84" class="ts" font-size="12">Three jobs: spectrum for balance, phase for mono fit, goniometer for width</text>
  <rect x="50" y="120" width="180" height="140" rx="4" fill="#FFFFFF" stroke="#D9CFC4" stroke-width="1.4"/>
  <text x="58" y="138" class="t" font-size="11" font-weight="700">Spectrum</text>
  <path d="M56.0 228.2 L58.1 223.9 L60.2 218.9 L62.3 213.4 L64.4 207.3 L66.5 200.9 L68.6 194.1 L70.7 187.3 L72.8 180.6 L74.9 174.3 L77.0 168.6 L79.1 163.8 L81.2 160.0 L83.3 157.4 L85.4 156.1 L87.5 156.3 L89.6 157.8 L91.7 160.6 L93.8 164.7 L95.9 169.7 L98.0 175.6 L100.1 182.0 L102.2 188.7 L104.3 195.5 L106.4 202.2 L108.5 208.6 L110.6 214.5 L112.7 220.0 L114.8 224.8 L116.9 229.0 L119.0 232.6 L121.1 235.5 L123.2 238.0 L125.3 239.9 L127.4 241.4 L129.5 242.5 L131.6 243.2 L133.7 243.5 L135.8 243.3 L137.9 242.5 L140.0 240.9 L142.1 238.4 L144.2 234.7 L146.3 229.8 L148.4 223.8 L150.5 217.1 L152.6 210.3 L154.7 204.0 L156.8 199.2 L158.9 196.5 L161.0 196.2 L163.1 198.5 L165.2 203.0 L167.3 209.0 L169.4 215.8 L171.5 222.6 L173.6 228.8 L175.7 234.0 L177.8 238.0 L179.9 241.0 L182.0 243.0 L184.1 244.3 L186.2 245.1 L188.3 245.5 L190.4 245.8 L192.5 245.9 L194.6 246.0 L196.7 246.0 L198.8 246.0 L200.9 246.0 L203.0 246.0 L205.1 246.0 L207.2 246.0 L209.3 246.0 L211.4 246.0 L213.5 246.0 L215.6 246.0 L217.7 246.0 L219.8 246.0 L221.9 246.0 L224.0 246.0" class="blue"/>
  <text x="58" y="256" class="ts" font-size="8" fill="#8C8078">20 Hz</text>
  <text x="222" y="256" class="ts" font-size="8" text-anchor="end" fill="#8C8078">20 kHz</text>
  <rect x="250" y="120" width="180" height="140" rx="4" fill="#FFFFFF" stroke="#D9CFC4" stroke-width="1.4"/>
  <text x="258" y="138" class="t" font-size="11" font-weight="700">Phase correlation</text>
  <rect x="260" y="194" width="160" height="16" rx="3" fill="#E4EBDC"/>
  <rect x="332.0" y="194" width="88.0" height="16" rx="3" fill="#F4DFD7" opacity="0.7"/>
  <rect x="359.2" y="188" width="3" height="28" fill="#3D3229"/>
  <text x="258" y="228" class="ts" font-size="8" fill="#8C8078">+1</text>
  <text x="422" y="228" class="ts" font-size="8" text-anchor="end" fill="#8C8078">−1</text>
  <text x="340.0" y="246" class="ts" font-size="9" text-anchor="middle" fill="#B0563F">Pinned right = possible cancellation</text>
  <rect x="450" y="120" width="160" height="140" rx="4" fill="#FFFFFF" stroke="#D9CFC4" stroke-width="1.4"/>
  <text x="458" y="138" class="t" font-size="11" font-weight="700">Goniometer</text>
  <circle cx="530" cy="210" r="48" fill="none" stroke="#D9CFC4" stroke-width="1.4"/>
  <path d="M530 162 L530 258" class="thin" stroke-dasharray="2 3"/>
  <circle cx="512" cy="190" r="2.2" fill="#6B8FBF" opacity="0.7"/>
  <circle cx="544" cy="198" r="2.2" fill="#6B8FBF" opacity="0.7"/>
  <circle cx="524" cy="216" r="2.2" fill="#6B8FBF" opacity="0.7"/>
  <circle cx="552" cy="228" r="2.2" fill="#6B8FBF" opacity="0.7"/>
  <circle cx="532" cy="180" r="2.2" fill="#6B8FBF" opacity="0.7"/>
  <text x="458" y="254" class="ts" font-size="8.5" fill="#8C8078">Wider = more stereo</text>
  <text x="26" y="306" class="ts" font-size="11.5">Meters advise, they do not judge: a pretty spectrum that sounds flat means your ears win</text>
  <text x="26" y="332" class="ts" font-size="11.5" fill="#8C8078">A/B: match the levels first, or the louder one always wins</text>
  <text x="26" y="382" class="ts" font-size="11">Change one thing, then A/B; change three and you cannot tell which one worked</text>
</svg>
