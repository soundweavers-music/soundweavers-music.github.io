  <text x="26" y="34" class="tb" font-size="16">Transposing and formants</text>
  <text x="26" y="55" class="ts" font-size="12.5">Harmonics and formants are separate; moving one need not move the other</text>
  <text x="26" y="84" class="ts" font-size="12">Transpose and the harmonics should follow; let the formants follow and the voice warps</text>
  <text x="28" y="138" class="ts" font-size="10" fill="#A67C52">Original</text>
  <text x="28" y="156" class="ts" font-size="10" fill="#8C8078">220 Hz（A3）</text>
