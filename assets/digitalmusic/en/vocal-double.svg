<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 350" role="img" aria-label="Doubled vocals">
  <title>Doubled vocals</title>
  <rect width="660" height="350" fill="#FBF8F4"/>
  <style>
    .t   { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; }
    .tb  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; font-weight: 700; }
    .ts  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #8C8078; }
    .num { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #FFFFFF; font-weight: 700; font-size: 11px; }
    .ink { fill: none; stroke: #3D3229; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; }
    .thin{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; }
    .dash{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; stroke-dasharray: 4 5; }
    .lead{ fill: none; stroke: #8C8078; stroke-width: 1; }
    .acc { fill: none; stroke: #A67C52; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .blue{ fill: none; stroke: #6B8FBF; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .green{ fill: none; stroke: #6F8F6A; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .red { fill: none; stroke: #B0563F; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .dot { fill: #3D3229; }
  </style>
  <text x="26" y="34" class="tb" font-size="16">Doubled vocals</text>
  <text x="26" y="55" class="ts" font-size="12.5">Two performances, not two copies</text>
  <text x="26" y="84" class="ts" font-size="12">A double is not copy-paste: you want two takes that are almost, not quite, the same</text>
  <rect x="60" y="108" width="160" height="56" rx="8" fill="#F3E9DC" stroke="#D9CFC4" stroke-width="1.3"/>
  <text x="72" y="130" class="t" font-size="13" font-weight="700">Lead</text>
  <text x="72" y="149" class="ts" font-size="11">centre, dry</text>
  <rect x="60" y="186" width="160" height="56" rx="8" fill="#DEE8F3" stroke="#D9CFC4" stroke-width="1.3"/>
  <text x="72" y="208" class="t" font-size="13" font-weight="700">Double</text>
  <text x="72" y="227" class="ts" font-size="11">offset 10–20 ms</text>
  <rect x="280" y="128" width="240" height="18" rx="3" fill="#A67C52" opacity="0.25"/>
  <text x="286" y="140" class="ts" font-size="9" fill="#A67C52">L</text>
  <rect x="284" y="206" width="240" height="18" rx="3" fill="#6B8FBF" opacity="0.25"/>
  <text x="290" y="218" class="ts" font-size="9" fill="#6B8FBF">R</text>
  <text x="560" y="140" class="ts" font-size="9.5" fill="#A67C52">Lead: equal L/R</text>
  <text x="560" y="218" class="ts" font-size="9.5" fill="#6B8FBF">Double: offset</text>
  <text x="26" y="290" class="ts" font-size="11">A 10–25 ms offset between the two widens the sound; identical copies only get louder</text>
  <text x="26" y="332" class="ts" font-size="11" fill="#8C8078">Sing the double again; copy, paste and delay is a different effect, not thickening</text>
</svg>
