<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 412" role="img" aria-label="Common mix problems: guess these five first">
  <title>Common mix problems: guess these five first</title>
  <rect width="660" height="412" fill="#FBF8F4"/>
  <style>
    .t   { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; }
    .tb  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; font-weight: 700; }
    .ts  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #8C8078; }
    .num { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #FFFFFF; font-weight: 700; font-size: 11px; }
    .ink { fill: none; stroke: #3D3229; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; }
    .thin{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; }
    .dash{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; stroke-dasharray: 4 5; }
    .lead{ fill: none; stroke: #8C8078; stroke-width: 1; }
    .acc { fill: none; stroke: #A67C52; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .blue{ fill: none; stroke: #6B8FBF; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .green{ fill: none; stroke: #6F8F6A; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .red { fill: none; stroke: #B0563F; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .dot { fill: #3D3229; }
  </style>
  <text x="26" y="34" class="tb" font-size="16">Common mix problems: guess these five first</text>
  <text x="26" y="55" class="ts" font-size="12.5">Nine in ten &quot;this sounds wrong&quot; cases are here</text>
  <text x="150.0" y="92" class="t" font-size="11.5" font-weight="700" fill="#A67C52">Likely cause</text>  <text x="395.0" y="92" class="t" font-size="11.5" font-weight="700" fill="#A67C52">Where to start</text>  <rect x="26" y="104" width="608" height="58" rx="4" fill="#F3E9DC" opacity="0.55"/>  <text x="34" y="126" class="t" font-size="11.5" font-weight="700">Vocal is unclear</text>  <text x="150.0" y="124" class="ts" font-size="10" fill="#5D4E41">A mid instrument is masking it</text>  <text x="395.0" y="124" class="ts" font-size="10" fill="#5D4E41">Move the instrument, not the vocal up</text>  <text x="34" y="184" class="t" font-size="11.5" font-weight="700">Muddy low end</text>  <text x="150.0" y="182" class="ts" font-size="10" fill="#5D4E41">Kick and bass colliding</text>  <text x="150.0" y="197" class="ts" font-size="10" fill="#5D4E41">in the same place</text>  <text x="395.0" y="182" class="ts" font-size="10" fill="#5D4E41">Split the roles: one low, one high</text>  <rect x="26" y="220" width="608" height="58" rx="4" fill="#F3E9DC" opacity="0.55"/>  <text x="34" y="242" class="t" font-size="11.5" font-weight="700">It all sounds busy</text>  <text x="150.0" y="240" class="ts" font-size="10" fill="#5D4E41">Every track is packed</text>  <text x="395.0" y="240" class="ts" font-size="10" fill="#5D4E41">Subtract first, stop adding</text>  <text x="34" y="300" class="t" font-size="11.5" font-weight="700">No stereo image</text>  <text x="150.0" y="298" class="ts" font-size="10" fill="#5D4E41">Everything is centred</text>  <text x="395.0" y="298" class="ts" font-size="10" fill="#5D4E41">Push the supporting parts wide</text>  <rect x="26" y="336" width="608" height="58" rx="4" fill="#F3E9DC" opacity="0.55"/>  <text x="34" y="358" class="t" font-size="11.5" font-weight="700">It sounds far away</text>  <text x="150.0" y="356" class="ts" font-size="10" fill="#5D4E41">Too much reverb</text>  <text x="395.0" y="356" class="ts" font-size="10" fill="#5D4E41">Shorten decay, add pre-delay</text>  <text x="395.0" y="371" class="ts" font-size="10" fill="#5D4E41">e-delay</text>
  <text x="26" y="394" class="ts" font-size="11">Change one thing and A/B it; change three and you learn nothing</text>
</svg>
