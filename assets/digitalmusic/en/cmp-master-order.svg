<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 354" role="img" aria-label="The order of mastering">
  <title>The order of mastering</title>
  <rect width="660" height="354" fill="#FBF8F4"/>
  <style>
    .t   { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; }
    .tb  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; font-weight: 700; }
    .ts  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #8C8078; }
    .num { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #FFFFFF; font-weight: 700; font-size: 11px; }
    .ink { fill: none; stroke: #3D3229; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; }
    .thin{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; }
    .dash{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; stroke-dasharray: 4 5; }
    .lead{ fill: none; stroke: #8C8078; stroke-width: 1; }
    .acc { fill: none; stroke: #A67C52; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .blue{ fill: none; stroke: #6B8FBF; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .green{ fill: none; stroke: #6F8F6A; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .red { fill: none; stroke: #B0563F; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .dot { fill: #3D3229; }
  </style>
  <text x="26" y="34" class="tb" font-size="16">The order of mastering</text>
  <text x="26" y="55" class="ts" font-size="12.5">Wrong order and every later step just patches the one before</text>
  <text x="150.0" y="92" class="t" font-size="11.5" font-weight="700" fill="#A67C52">What</text>  <text x="395.0" y="92" class="t" font-size="11.5" font-weight="700" fill="#A67C52">Why here</text>  <rect x="26" y="104" width="608" height="58" rx="4" fill="#F3E9DC" opacity="0.55"/>  <text x="34" y="126" class="t" font-size="11.5" font-weight="700">1 Fix</text>  <text x="150.0" y="124" class="ts" font-size="10" fill="#5D4E41">Tame extreme low end and harshness</text>  <text x="395.0" y="124" class="ts" font-size="10" fill="#5D4E41">Fix problems first, loudness after</text>  <text x="34" y="184" class="t" font-size="11.5" font-weight="700">2 Dynamics</text>  <text x="150.0" y="182" class="ts" font-size="10" fill="#5D4E41">Compress or limit, control peaks</text>  <text x="395.0" y="182" class="ts" font-size="10" fill="#5D4E41">So the limiter does not do the heavy lifting</text>  <rect x="26" y="220" width="608" height="58" rx="4" fill="#F3E9DC" opacity="0.55"/>  <text x="34" y="242" class="t" font-size="11.5" font-weight="700">3 Tone</text>  <text x="150.0" y="240" class="ts" font-size="10" fill="#5D4E41">Fine width and saturation</text>  <text x="395.0" y="240" class="ts" font-size="10" fill="#5D4E41">Make it sound like one album</text>  <text x="34" y="300" class="t" font-size="11.5" font-weight="700">4 Loudness</text>  <text x="150.0" y="298" class="ts" font-size="10" fill="#5D4E41">Push the limiter to target</text>  <text x="395.0" y="298" class="ts" font-size="10" fill="#5D4E41">Last step; nothing before touched it</text>
  <text x="26" y="336" class="ts" font-size="11">Do every song in the same order, or the album jumps around in level</text>
</svg>
