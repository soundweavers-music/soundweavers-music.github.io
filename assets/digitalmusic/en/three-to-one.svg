<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 360" role="img" aria-label="The 3:1 rule">
  <title>The 3:1 rule</title>
  <rect width="660" height="360" fill="#FBF8F4"/>
  <style>
    .t   { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; }
    .tb  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; font-weight: 700; }
    .ts  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #8C8078; }
    .num { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #FFFFFF; font-weight: 700; font-size: 11px; }
    .ink { fill: none; stroke: #3D3229; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; }
    .thin{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; }
    .dash{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; stroke-dasharray: 4 5; }
    .lead{ fill: none; stroke: #8C8078; stroke-width: 1; }
    .acc { fill: none; stroke: #A67C52; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .blue{ fill: none; stroke: #6B8FBF; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .green{ fill: none; stroke: #6F8F6A; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .red { fill: none; stroke: #B0563F; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .dot { fill: #3D3229; }
  </style>
  <text x="26" y="34" class="tb" font-size="16">The 3:1 rule</text>
  <text x="26" y="55" class="ts" font-size="12.5">How far apart the two mics are sets how dense the phase problems get</text>
  <text x="26" y="84" class="ts" font-size="12">Put the second mic at least three times the first mic&#x27;s distance</text>
  <circle cx="110" cy="220" r="12" fill="#A67C52" opacity="0.6"/>
  <text x="110" y="254" class="ts" font-size="10" text-anchor="middle">Source</text>
  <circle cx="200" cy="220" r="10" fill="#3D3229"/>
  <circle cx="420" cy="220" r="10" fill="#3D3229"/>
  <text x="200" y="250" class="ts" font-size="9.5" text-anchor="middle">Mic 1 (1×)</text>
  <text x="420" y="250" class="ts" font-size="9.5" text-anchor="middle">Mic 2 (≥3×)</text>
  <path d="M124 220 L188 220" class="thin"/>
  <path d="M124 220 L408 220" class="thin"/>
  <text x="155" y="208" class="ts" font-size="10" fill="#8C8078">d</text>
  <text x="265" y="208" class="ts" font-size="10" fill="#B0563F">3d or more</text>
  <rect x="60" y="268" width="250" height="52" rx="8" fill="#DEE8F3" stroke="#D9CFC4" stroke-width="1.3"/>
  <text x="72" y="290" class="t" font-size="13" font-weight="700">Why three times</text>
  <text x="72" y="309" class="ts" font-size="11">Bigger gap, denser comb dips</text>
  <rect x="340" y="268" width="260" height="52" rx="8" fill="#F3E9DC" stroke="#D9CFC4" stroke-width="1.3"/>
  <text x="352" y="290" class="t" font-size="13" font-weight="700">Ears alone won&#x27;t catch it</text>
  <text x="352" y="309" class="ts" font-size="11">Phase trouble shows up in mono</text>
</svg>
