<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 376" role="img" aria-label="Balancing the rhythm section">
  <title>Balancing the rhythm section</title>
  <rect width="660" height="376" fill="#FBF8F4"/>
  <style>
    .t   { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; }
    .tb  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; font-weight: 700; }
    .ts  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #8C8078; }
    .num { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #FFFFFF; font-weight: 700; font-size: 11px; }
    .ink { fill: none; stroke: #3D3229; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; }
    .thin{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; }
    .dash{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; stroke-dasharray: 4 5; }
    .lead{ fill: none; stroke: #8C8078; stroke-width: 1; }
    .acc { fill: none; stroke: #A67C52; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .blue{ fill: none; stroke: #6B8FBF; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .green{ fill: none; stroke: #6F8F6A; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .red { fill: none; stroke: #B0563F; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .dot { fill: #3D3229; }
  </style>
  <text x="26" y="34" class="tb" font-size="16">Balancing the rhythm section</text>
  <text x="26" y="55" class="ts" font-size="12.5">Kick, snare and bass first, so everything else has somewhere to stand</text>
  <circle cx="38.0" cy="110" r="10" fill="#A67C52"/>  <text x="38.0" y="114" text-anchor="middle" class="num">1</text>  <rect x="26.0" y="96" width="141.5" height="108" rx="9" fill="#F3E9DC" stroke="#D9CFC4" stroke-width="1.4"/>  <text x="36.0" y="126" class="t" font-size="12.5" font-weight="700">Kick sets the floor</text>  <text x="36.0" y="164" class="ts" font-size="9.5" fill="#8C8078">Get the kick right first; it is the</text>  <text x="36.0" y="178" class="ts" font-size="9.5" fill="#8C8078">floor of the whole song</text>  <path d="M169.5 150.0 L173.2 150.0" fill="none" stroke="#A67C52" stroke-width="1.7" stroke-linecap="round"/><path d="M179.5 150.0 L173.1 152.9 L173.1 147.1 Z" fill="#A67C52"/>  <circle cx="193.5" cy="110" r="10" fill="#A67C52"/>  <text x="193.5" y="114" text-anchor="middle" class="num">2</text>  <rect x="181.5" y="96" width="141.5" height="108" rx="9" fill="#F3E9DC" stroke="#D9CFC4" stroke-width="1.4"/>  <text x="191.5" y="126" class="t" font-size="12.5" font-weight="700">Bass locks to Kick</text>  <text x="191.5" y="143" class="t" font-size="12.5" font-weight="700">ick</text>  <text x="191.5" y="164" class="ts" font-size="9.5" fill="#8C8078">Keep the lows from fighting; one</text>  <text x="191.5" y="178" class="ts" font-size="9.5" fill="#8C8078">of them gives way</text>  <path d="M325.0 150.0 L328.7 150.0" fill="none" stroke="#A67C52" stroke-width="1.7" stroke-linecap="round"/><path d="M335.0 150.0 L328.6 152.9 L328.6 147.1 Z" fill="#A67C52"/>  <circle cx="349.0" cy="110" r="10" fill="#A67C52"/>  <text x="349.0" y="114" text-anchor="middle" class="num">3</text>  <rect x="337.0" y="96" width="141.5" height="108" rx="9" fill="#F3E9DC" stroke="#D9CFC4" stroke-width="1.4"/>  <text x="347.0" y="126" class="t" font-size="12.5" font-weight="700">Snare marks the beat</text>  <text x="347.0" y="164" class="ts" font-size="9.5" fill="#8C8078">The snare decides where the clap</text>  <text x="347.0" y="178" class="ts" font-size="9.5" fill="#8C8078">lands</text>  <path d="M480.5 150.0 L484.2 150.0" fill="none" stroke="#A67C52" stroke-width="1.7" stroke-linecap="round"/><path d="M490.5 150.0 L484.1 152.9 L484.1 147.1 Z" fill="#A67C52"/>  <circle cx="504.5" cy="110" r="10" fill="#A67C52"/>  <text x="504.5" y="114" text-anchor="middle" class="num">4</text>  <rect x="492.5" y="96" width="141.5" height="108" rx="9" fill="#F3E9DC" stroke="#D9CFC4" stroke-width="1.4"/>  <text x="502.5" y="126" class="t" font-size="12.5" font-weight="700">Check the low end</text>  <text x="502.5" y="164" class="ts" font-size="9.5" fill="#8C8078">Fold to mono once; the bass</text>  <text x="502.5" y="178" class="ts" font-size="9.5" fill="#8C8078">must not vanish</text>  <circle cx="38.0" cy="242" r="10" fill="#A67C52"/>  <text x="38.0" y="246" text-anchor="middle" class="num">5</text>  <rect x="26.0" y="228" width="141.5" height="108" rx="9" fill="#F3E9DC" stroke="#D9CFC4" stroke-width="1.4"/>  <text x="36.0" y="258" class="t" font-size="12.5" font-weight="700">Add decoration</text>  <text x="36.0" y="296" class="ts" font-size="9.5" fill="#8C8078">Hi-hats and percussion</text>  <text x="36.0" y="310" class="ts" font-size="9.5" fill="#8C8078">come in last</text>
  <text x="26" y="358" class="ts" font-size="11">Start with the decoration and you chase the low end all night</text>
</svg>
