<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 460" role="img" aria-label="Walkthrough: drone, texture, evolution">
  <title>Walkthrough: drone, texture, evolution</title>
  <rect width="660" height="460" fill="#FBF8F4"/>
  <style>
    .t   { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; }
    .tb  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; font-weight: 700; }
    .ts  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #8C8078; }
    .num { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #FFFFFF; font-weight: 700; font-size: 11px; }
    .ink { fill: none; stroke: #3D3229; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; }
    .thin{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; }
    .dash{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; stroke-dasharray: 4 5; }
    .lead{ fill: none; stroke: #8C8078; stroke-width: 1; }
    .acc { fill: none; stroke: #A67C52; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .blue{ fill: none; stroke: #6B8FBF; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .green{ fill: none; stroke: #6F8F6A; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .red { fill: none; stroke: #B0563F; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .dot { fill: #3D3229; }
  </style>
  <text x="26" y="34" class="tb" font-size="16">Walkthrough: drone, texture, evolution</text>
  <text x="26" y="55" class="ts" font-size="12.5">Key points at a glance</text>
  <rect x="26.0" y="96" width="295.0" height="96" rx="9" fill="#F3E9DC" stroke="#D9CFC4" stroke-width="1.4"/>  <circle cx="40.0" cy="116" r="10" fill="#A67C52"/>  <text x="40.0" y="120" text-anchor="middle" class="num">1</text>  <text x="60.0" y="121" class="t" font-size="12" font-weight="700">with Serum or Vi</text>  <text x="40.0" y="144" class="ts" font-size="9.5" fill="#8C8078">tal, two sine oscillators</text>  <text x="40.0" y="160" class="ts" font-size="9.5" fill="#8C8078">illator：C2（65Hz</text>  <text x="40.0" y="176" class="ts" font-size="9.5" fill="#8C8078">and G2 (98Hz)</text>  <rect x="339.0" y="96" width="295.0" height="96" rx="9" fill="#F3E9DC" stroke="#D9CFC4" stroke-width="1.4"/>  <circle cx="353.0" cy="116" r="10" fill="#A67C52"/>  <text x="353.0" y="120" text-anchor="middle" class="num">2</text>  <text x="373.0" y="121" class="t" font-size="12" font-weight="700">LFO1 shapes volume</text>  <text x="353.0" y="144" class="ts" font-size="9.5" fill="#8C8078">me（rate0.05Hz，d</text>  <text x="353.0" y="160" class="ts" font-size="9.5" fill="#8C8078">epth30%）</text>  <rect x="26.0" y="206" width="295.0" height="96" rx="9" fill="#F3E9DC" stroke="#D9CFC4" stroke-width="1.4"/>  <circle cx="40.0" cy="226" r="10" fill="#A67C52"/>  <text x="40.0" y="230" text-anchor="middle" class="num">3</text>  <text x="60.0" y="231" class="t" font-size="12" font-weight="700">LFO2 shapes the filter</text>  <text x="40.0" y="254" class="ts" font-size="9.5" fill="#8C8078">erCutoff（rate0.</text>  <text x="40.0" y="270" class="ts" font-size="9.5" fill="#8C8078">1Hz，depth20%）</text>  <rect x="339.0" y="206" width="295.0" height="96" rx="9" fill="#F3E9DC" stroke="#D9CFC4" stroke-width="1.4"/>  <circle cx="353.0" cy="226" r="10" fill="#A67C52"/>  <text x="353.0" y="230" text-anchor="middle" class="num">4</text>  <text x="373.0" y="231" class="t" font-size="12" font-weight="700">add a Valhalla</text>  <text x="353.0" y="254" class="ts" font-size="9.5" fill="#8C8078">Shimmer or similar shimmer</text>  <text x="353.0" y="270" class="ts" font-size="9.5" fill="#8C8078">reverb (12s decay,</text>  <text x="353.0" y="286" class="ts" font-size="9.5" fill="#8C8078">mix60%）</text>  <rect x="26.0" y="316" width="295.0" height="96" rx="9" fill="#F3E9DC" stroke="#D9CFC4" stroke-width="1.4"/>  <circle cx="40.0" cy="336" r="10" fill="#A67C52"/>  <text x="40.0" y="340" text-anchor="middle" class="num">5</text>  <text x="60.0" y="341" class="t" font-size="12" font-weight="700">second synth: Super</text>  <text x="40.0" y="364" class="ts" font-size="9.5" fill="#8C8078">Saw playing a Cmaj7 chord (</text>  <text x="40.0" y="380" class="ts" font-size="9.5" fill="#8C8078">CEGB）</text>  <rect x="339.0" y="316" width="295.0" height="96" rx="9" fill="#F3E9DC" stroke="#D9CFC4" stroke-width="1.4"/>  <circle cx="353.0" cy="336" r="10" fill="#A67C52"/>  <text x="353.0" y="340" text-anchor="middle" class="num">6</text>  <text x="373.0" y="341" class="t" font-size="12" font-weight="700">high-passed at 150Hz,</text>  <text x="353.0" y="364" class="ts" font-size="9.5" fill="#8C8078">so the lows do not overlap</text>
</svg>
