<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 380" role="img" aria-label="How saturation changes the harmonics">
  <title>How saturation changes the harmonics</title>
  <rect width="660" height="380" fill="#FBF8F4"/>
  <style>
    .t   { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; }
    .tb  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; font-weight: 700; }
    .ts  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #8C8078; }
    .num { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #FFFFFF; font-weight: 700; font-size: 11px; }
    .ink { fill: none; stroke: #3D3229; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; }
    .thin{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; }
    .dash{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; stroke-dasharray: 4 5; }
    .lead{ fill: none; stroke: #8C8078; stroke-width: 1; }
    .acc { fill: none; stroke: #A67C52; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .blue{ fill: none; stroke: #6B8FBF; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .green{ fill: none; stroke: #6F8F6A; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .red { fill: none; stroke: #B0563F; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .dot { fill: #3D3229; }
  </style>
  <text x="26" y="34" class="tb" font-size="16">How saturation changes the harmonics</text>
  <text x="26" y="55" class="ts" font-size="12.5">Same level, different harmonic balance</text>
  <text x="26" y="84" class="ts" font-size="12">Saturation does not make it louder; it grows harmonics that were not there</text>
  <text x="80" y="116" class="ts" font-size="11">Clean: fundamental and a few harmonics</text>
  <text x="80" y="150" class="ts" font-size="11" fill="#B0563F">Lightly saturated (sketch)</text>
  <rect x="80" y="150.0" width="36" height="150.0" rx="3" fill="#A67C52" opacity="0.3"/>
  <text x="98" y="318" class="ts" font-size="9.5" text-anchor="middle" fill="#8C8078">1f</text>
  <rect x="80" y="257.1428571428571" width="36" height="42.85714285714286" rx="3" fill="#B0563F" opacity="0.28"/>
  <rect x="146" y="225.0" width="36" height="75.0" rx="3" fill="#A67C52" opacity="0.3"/>
  <text x="164" y="318" class="ts" font-size="9.5" text-anchor="middle" fill="#8C8078">2f</text>
  <rect x="146" y="275.0" width="36" height="25.0" rx="3" fill="#B0563F" opacity="0.28"/>
  <rect x="212" y="250.0" width="36" height="50.0" rx="3" fill="#A67C52" opacity="0.3"/>
  <text x="230" y="318" class="ts" font-size="9.5" text-anchor="middle" fill="#8C8078">3f</text>
  <rect x="212" y="282.3529411764706" width="36" height="17.647058823529413" rx="3" fill="#B0563F" opacity="0.28"/>
  <rect x="278" y="262.5" width="36" height="37.5" rx="3" fill="#A67C52" opacity="0.3"/>
  <text x="296" y="318" class="ts" font-size="9.5" text-anchor="middle" fill="#8C8078">4f</text>
  <rect x="278" y="286.3636363636364" width="36" height="13.636363636363635" rx="3" fill="#B0563F" opacity="0.28"/>
  <rect x="344" y="270.0" width="36" height="30.0" rx="3" fill="#A67C52" opacity="0.3"/>
  <text x="362" y="318" class="ts" font-size="9.5" text-anchor="middle" fill="#8C8078">5f</text>
  <rect x="344" y="288.8888888888889" width="36" height="11.11111111111111" rx="3" fill="#B0563F" opacity="0.28"/>
  <rect x="410" y="275.0" width="36" height="25.0" rx="3" fill="#A67C52" opacity="0.3"/>
  <text x="428" y="318" class="ts" font-size="9.5" text-anchor="middle" fill="#8C8078">6f</text>
  <rect x="410" y="290.625" width="36" height="9.375" rx="3" fill="#B0563F" opacity="0.28"/>
  <rect x="476" y="278.57142857142856" width="36" height="21.428571428571427" rx="3" fill="#A67C52" opacity="0.3"/>
  <text x="494" y="318" class="ts" font-size="9.5" text-anchor="middle" fill="#8C8078">7f</text>
  <rect x="476" y="291.8918918918919" width="36" height="8.108108108108107" rx="3" fill="#B0563F" opacity="0.28"/>
  <rect x="542" y="281.25" width="36" height="18.75" rx="3" fill="#A67C52" opacity="0.3"/>
  <text x="560" y="318" class="ts" font-size="9.5" text-anchor="middle" fill="#8C8078">8f</text>
  <rect x="542" y="292.85714285714283" width="36" height="7.142857142857142" rx="3" fill="#B0563F" opacity="0.28"/>
  <path d="M60 300 L600 300" class="thin"/>
  <rect x="70" y="330" width="240" height="40" rx="8" fill="#DEE8F3" stroke="#D9CFC4" stroke-width="1.3"/>
  <text x="82" y="352" class="t" font-size="13" font-weight="700">Even harmonics</text>
  <text x="82" y="371" class="ts" font-size="11">Thick, like an octave below</text>
  <rect x="330" y="330" width="240" height="40" rx="8" fill="#F3E9DC" stroke="#D9CFC4" stroke-width="1.3"/>
  <text x="342" y="352" class="t" font-size="13" font-weight="700">Odd harmonics</text>
  <text x="342" y="371" class="ts" font-size="11">Bright and aggressive</text>
</svg>
