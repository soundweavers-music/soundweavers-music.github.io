<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 480" role="img" aria-label="站姿側面：耳朵、肩膀、骨盆與腳踝的位置關係">
  <title>站姿側面：耳朵、肩膀、骨盆與腳踝的位置關係</title>
  <rect width="620" height="480" fill="#fbf8f2"/>
  <style>
    .ink { fill: none; stroke: #2b2a26; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
    .thin { fill: none; stroke: #8a8578; stroke-width: 1.4; stroke-dasharray: 5 5; }
    .grid { fill: none; stroke: #d8d0c2; stroke-width: 1.2; }
    .fill { fill: #b5734a; opacity: .18; stroke: #b5734a; stroke-width: 1.8; }
    .fill2 { fill: #7d9b76; opacity: .18; stroke: #7d9b76; stroke-width: 1.8; }
    .solid { fill: #b5734a; opacity: .85; }
    .solid2 { fill: #7d9b76; opacity: .85; }
    .lbl { font-family: 'Noto Serif TC', 'Songti TC', 'PingFang TC', serif; font-size: 15px; fill: #2b2a26; }
    .lbl-s { font-family: 'Noto Serif TC', 'Songti TC', 'PingFang TC', serif; font-size: 12.5px; fill: #8a8578; }
    .lbl-b { font-family: 'Noto Serif TC', 'Songti TC', 'PingFang TC', serif; font-size: 15px; fill: #2b2a26; font-weight: 700; }
  </style>
<text class="lbl-b" x="40" y="40">站姿對不對，看這四個點有沒有疊在一起</text>
  <text class="lbl-b" x="60" y="84">常見的塌</text>
  <path class="thin" d="M150 110 L150 380" stroke-dasharray="4 6"/>
  <circle class="solid" cx="150" cy="130" r="8"/>
  <text class="lbl-s" x="174" y="135">耳／下巴</text>
  <circle class="solid" cx="118" cy="200" r="8"/>
  <text class="lbl-s" x="142" y="205">肩</text>
  <circle class="solid" cx="104" cy="300" r="8"/>
  <text class="lbl-s" x="128" y="305">髖</text>
  <circle class="solid" cx="128" cy="372" r="8"/>
  <text class="lbl-s" x="152" y="377">踝</text>
  <text class="lbl-s" x="60" y="420">下巴前伸、肩膀往前掉、骨盆後坐</text>
  <text class="lbl-b" x="350" y="84">對齊的站姿</text>
  <path class="thin" d="M440 110 L440 380" stroke-dasharray="4 6"/>
  <circle class="solid" cx="440" cy="130" r="8"/>
  <text class="lbl-s" x="464" y="135">耳／下巴</text>
  <circle class="solid" cx="438" cy="200" r="8"/>
  <text class="lbl-s" x="462" y="205">肩</text>
  <circle class="solid" cx="438" cy="300" r="8"/>
  <text class="lbl-s" x="462" y="305">髖</text>
  <circle class="solid" cx="440" cy="372" r="8"/>
  <text class="lbl-s" x="464" y="377">踝</text>
  <text class="lbl-s" x="350" y="420">四個點大致落在同一條垂直線上</text>
  <text class="lbl-s" x="40" y="452">先讓身體回到中線，共鳴才有空間；下巴一縮，喉嚨就鬆一半</text>
</svg>
