<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-label="站姿側面：四個點對齊">
  <title>站姿側面：四個點對齊</title>
  <rect width="640" height="380" fill="#FBF8F4"/>
  <style>
    .t   { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; }
    .tb  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; font-weight: 700; }
    .ts  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #8C8078; }
    .num { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #FFFFFF; font-weight: 700; font-size: 11px; }
    .ink { fill: none; stroke: #3D3229; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; }
    .thin{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; }
    .dash{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; stroke-dasharray: 4 5; }
    .lead{ fill: none; stroke: #8C8078; stroke-width: 1; }
    .acc { fill: none; stroke: #A67C52; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .blue{ fill: none; stroke: #6B8FBF; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .green{ fill: none; stroke: #6F8F6A; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .red { fill: none; stroke: #B0563F; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .dot { fill: #3D3229; }
  </style>
  <text x="26" y="34" class="tb" font-size="16">站姿側面：四個點對齊</text>
  <text x="26" y="55" class="ts" font-size="12.5">耳、肩、骨盆、腳踝在同一條鉛垂線上</text>
  <path d="M230 70 L230 330" fill="none" stroke="#D9CFC4" stroke-width="1.2" stroke-dasharray="5 5"/>
  <circle cx="230" cy="96" r="6.5" fill="#A67C52"/>
  <text x="214" y="100" class="ts" font-size="11.5" text-anchor="end">耳</text>
  <circle cx="230" cy="150" r="6.5" fill="#A67C52"/>
  <text x="214" y="154" class="ts" font-size="11.5" text-anchor="end">肩</text>
  <circle cx="230" cy="230" r="6.5" fill="#A67C52"/>
  <text x="214" y="234" class="ts" font-size="11.5" text-anchor="end">骨盆</text>
  <circle cx="230" cy="320" r="6.5" fill="#A67C52"/>
  <text x="214" y="324" class="ts" font-size="11.5" text-anchor="end">腳踝</text>
  <path d="M224 150 C214 190 216 214 230 230 C244 250 236 292 230 320" class="ink" opacity="0.3"/>
  <text x="272" y="96" class="ts" font-size="12">從側面看，四個點落在同一條鉛垂線上。</text>
  <text x="272" y="130" class="ts" font-size="12">頭往前伸、肋骨往前翻，是最常見的兩個走位。</text>
  <text x="272" y="176" class="ts" font-size="12">站直不是挺胸：挺胸會讓肋骨翻起來，</text>
  <text x="272" y="198" class="ts" font-size="12">腰反而更凹、氣更難下去。</text>
  <text x="26" y="362" class="ts" font-size="11">姿勢的目的只有一個：讓氣道是直的。</text>
</svg>
