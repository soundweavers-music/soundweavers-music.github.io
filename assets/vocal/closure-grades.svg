<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 640 430" role="img" aria-label="聲帶閉合三級：氣聲、正常、閉合">
  <title>聲帶閉合三級：氣聲、正常、閉合</title>
  <rect width="640" height="430" fill="#FBF8F4"/>
  <text x="26" y="34" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="16" font-weight="700" fill="#3D3229">聲帶閉合三級</text>
  <text x="26" y="55" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="12.5" fill="#8C8078">聲門張開的程度，決定聲音漏不漏氣、喉嚨累不累</text>
  <svg x="40" y="96" width="180" height="194" viewBox="600 0 200 226"><image x="0" y="0" width="1200" height="226" xlink:href="_anatomy/src/glottis-positions.png"/></svg>
  <text x="130.0" y="316" text-anchor="middle" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="13" font-weight="600" fill="#3D3229">氣聲（D）</text>
  <text x="130.0" y="336" text-anchor="middle" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="11.5" fill="#8C8078">兩片分開，氣一直漏</text>
  <text x="130.0" y="354" text-anchor="middle" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="11.5" fill="#8C8078">音色沙、容易累</text>
  <svg x="240" y="96" width="180" height="194" viewBox="200 0 200 226"><image x="0" y="0" width="1200" height="226" xlink:href="_anatomy/src/glottis-positions.png"/></svg>
  <text x="330.0" y="316" text-anchor="middle" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="13" font-weight="600" fill="#3D3229">正常嗓音（B）</text>
  <text x="330.0" y="336" text-anchor="middle" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="11.5" fill="#8C8078">輕輕靠攏</text>
  <text x="330.0" y="354" text-anchor="middle" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="11.5" fill="#8C8078">乾淨、省力</text>
  <svg x="440" y="96" width="180" height="194" viewBox="0 0 200 226"><image x="0" y="0" width="1200" height="226" xlink:href="_anatomy/src/glottis-positions.png"/></svg>
  <text x="530.0" y="316" text-anchor="middle" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="13" font-weight="600" fill="#3D3229">閉合（A）</text>
  <text x="530.0" y="336" text-anchor="middle" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="11.5" fill="#8C8078">完全閉上，準備發聲</text>
  <text x="530.0" y="354" text-anchor="middle" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="11.5" fill="#8C8078">擋得住氣，但別夾</text>
  <text x="26" y="416" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="10.5" fill="#8C8078">底圖：Wikimedia Commons（公有領域），說明文字依原檔圖例 A／B／D 重繪</text>
</svg>
