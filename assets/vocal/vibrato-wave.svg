  <text x="70" y="266" class="ts" font-size="11.5">滑音</text>
  <path d="M70 300 C140 300 180 268 240 268 L300 268" class="blue"/>
  <text x="340" y="124" class="ts" font-size="11.5">直音：沒有起伏，適合長句的穩定感。</text>
  <text x="340" y="210" class="ts" font-size="11.5">顫音：音高規律上下，速度約每秒 5–7 次。</text>
  <text x="340" y="268" class="ts" font-size="11.5">滑音：一次移動，不來回。</text>
  <text x="26" y="302" class="ts" font-size="11">顫音不是抖出來的，是「支撐穩定之後自然出現的微小擺動」。</text>
</svg>
