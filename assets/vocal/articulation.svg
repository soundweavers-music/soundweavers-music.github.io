<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="口腔：咬字用到的六個部位">
  <title>口腔：咬字用到的六個部位</title>
  <rect width="640" height="400" fill="#FBF8F4"/>
  <style>
    .t   { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; }
    .tb  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; font-weight: 700; }
    .ts  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #8C8078; }
    .num { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #FFFFFF; font-weight: 700; font-size: 11px; }
    .ink { fill: none; stroke: #3D3229; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; }
    .thin{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; }
    .dash{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; stroke-dasharray: 4 5; }
    .lead{ fill: none; stroke: #8C8078; stroke-width: 1; }
    .acc { fill: none; stroke: #A67C52; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .blue{ fill: none; stroke: #6B8FBF; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .green{ fill: none; stroke: #6F8F6A; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .red { fill: none; stroke: #B0563F; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .dot { fill: #3D3229; }
  </style>
  <text x="26" y="34" class="tb" font-size="16">口腔：咬字用到的六個部位</text>
  <text x="26" y="55" class="ts" font-size="12.5">唇、齒、齒齦、硬顎、軟顎、舌</text>
  <path d="M96 150 C150 118 230 112 300 124 C330 130 348 146 356 168" class="ink"/>
  <path d="M96 214 C140 236 220 244 300 236 C330 232 350 222 360 208" class="ink"/>
  <path d="M96 150 C150 118 230 112 300 124 C330 130 348 146 356 168 L356 168 L360 208 L96 214" class="ink" fill="#A67C52" stroke="none" stroke-width="1.4" opacity="0.05"/>
  <path d="M300 124 C330 132 344 152 342 176 C332 162 318 152 304 148 Z" class="ink" fill="#A67C52" stroke="#A67C52" stroke-width="1.3" opacity="0.3"/>
  <path d="M118 210 C150 176 230 168 286 186 C306 192 312 200 300 206 C240 220 170 220 118 214 Z" class="ink" fill="#A67C52" stroke="#A67C52" stroke-width="1.3" opacity="0.25"/>
  <rect x="96" y="150" width="12" height="20" rx="2" fill="#FFFFFF" stroke="#3D3229" stroke-width="1.2"/>
  <rect x="96" y="194" width="12" height="20" rx="2" fill="#FFFFFF" stroke="#3D3229" stroke-width="1.2"/>
  <path d="M96 150 C82 158 82 206 96 214" class="ink"/>
  <text x="104" y="146" class="ts" font-size="11.5" text-anchor="end">唇</text>
  <text x="140" y="190" class="ts" font-size="11.5" text-anchor="end">齒</text>
  <text x="200" y="118" class="ts" font-size="11.5" text-anchor="middle">齒齦</text>
  <text x="268" y="108" class="ts" font-size="11.5" text-anchor="middle">硬顎</text>
  <text x="356" y="196" class="ts" font-size="11.5">軟顎</text>
  <text x="196" y="240" class="ts" font-size="11.5" text-anchor="middle">舌</text>
  <text x="392" y="132" class="ts" font-size="12">咬字是舌頭與軟顎的形狀變化，</text>
  <text x="392" y="154" class="ts" font-size="12">不是下巴開合的大小。</text>
  <text x="392" y="198" class="ts" font-size="12">換母音＝換舌位；</text>
  <text x="392" y="220" class="ts" font-size="12">換子音＝換阻斷的位置。</text>
  <text x="26" y="382" class="ts" font-size="11">六個部位裡，只有舌頭與軟顎需要「練」；唇齒多數時候只是跟著。</text>
</svg>
