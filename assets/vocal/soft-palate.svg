<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 340" role="img" aria-label="軟顎抬起與放下，聲音分別往口腔或鼻腔走">
  <title>軟顎抬起與放下，聲音分別往口腔或鼻腔走</title>
  <rect width="620" height="340" fill="#fbf8f2"/>
  <style>
    .ink { fill: none; stroke: #2b2a26; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
    .thin { fill: none; stroke: #8a8578; stroke-width: 1.4; stroke-dasharray: 5 5; }
    .grid { fill: none; stroke: #d8d0c2; stroke-width: 1.2; }
    .fill { fill: #b5734a; opacity: .18; stroke: #b5734a; stroke-width: 1.8; }
    .fill2 { fill: #7d9b76; opacity: .18; stroke: #7d9b76; stroke-width: 1.8; }
    .solid { fill: #b5734a; opacity: .85; }
    .solid2 { fill: #7d9b76; opacity: .85; }
    .lbl { font-family: 'Noto Serif TC', 'Songti TC', 'PingFang TC', serif; font-size: 15px; fill: #2b2a26; }
    .lbl-s { font-family: 'Noto Serif TC', 'Songti TC', 'PingFang TC', serif; font-size: 12.5px; fill: #8a8578; }
    .lbl-b { font-family: 'Noto Serif TC', 'Songti TC', 'PingFang TC', serif; font-size: 15px; fill: #2b2a26; font-weight: 700; }
  </style>
<text class="lbl-b" x="40" y="40">軟顎是一扇門：開哪邊，聲音就往哪邊去</text>
  <text class="lbl-b" x="60" y="90">軟顎抬起</text>
  <path class="ink" d="M60 150 C120 116 190 116 236 146"/>
  <path class="ink" d="M236 146 C256 138 266 124 256 132"/>
  <ellipse class="solid" cx="236" cy="132" rx="8" ry="8"/>
  <path class="ink" d="M60 226 C130 250 200 246 256 226"/>
  <path class="ink" d="M156 220 L156 168"/><path class="ink" d="M156 168 L160.5 178.0 L151.5 178.0 Z" fill="#2b2a26"/>
  <text class="lbl-s" x="60" y="274">聲音走口腔，字清楚</text>
  <text class="lbl-b" x="330" y="90">軟顎放下</text>
  <path class="ink" d="M330 150 C390 116 460 116 506 146"/>
  <path class="ink" d="M506 146 C526 138 536 168 526 176"/>
  <ellipse class="solid" cx="506" cy="132" rx="8" ry="8"/>
  <path class="ink" d="M330 226 C400 250 470 246 526 226"/>
  <path class="ink" d="M426 220 L480 158"/><path class="ink" d="M480 158 L476.8 168.5 L470.0 162.6 Z" fill="#2b2a26"/>
  <path class="thin" d="M480 150 C498 132 520 130 534 140"/>
  <text class="lbl-s" x="330" y="274">聲音漏進鼻腔，變鼻音</text>
  <text class="lbl-s" x="40" y="312">想加鼻音色彩就把軟顎放一點；想要乾淨通透就抬起來</text>
</svg>
