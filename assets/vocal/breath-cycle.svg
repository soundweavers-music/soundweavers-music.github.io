<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="呼吸與唱歌吸氣的差別">
  <title>呼吸與唱歌吸氣的差別</title>
  <rect width="640" height="400" fill="#FBF8F4"/>
  <style>
    .t   { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; }
    .tb  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; font-weight: 700; }
    .ts  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #8C8078; }
    .num { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #FFFFFF; font-weight: 700; font-size: 11px; }
    .ink { fill: none; stroke: #3D3229; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; }
    .thin{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; }
    .dash{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; stroke-dasharray: 4 5; }
    .lead{ fill: none; stroke: #8C8078; stroke-width: 1; }
    .acc { fill: none; stroke: #A67C52; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .blue{ fill: none; stroke: #6B8FBF; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .green{ fill: none; stroke: #6F8F6A; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .red { fill: none; stroke: #B0563F; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .dot { fill: #3D3229; }
  </style>
  <text x="26" y="34" class="tb" font-size="16">呼吸與唱歌吸氣的差別</text>
  <text x="26" y="55" class="ts" font-size="12.5">橫膈膜下降的幅度，決定你吸進多少氣</text>
  <rect x="70" y="90" width="170" height="210" rx="18" fill="#FFFFFF" stroke="#D9CFC4" stroke-width="1.2"/>
  <ellipse cx="126" cy="182" rx="30" ry="48" fill="#DEE8F3" stroke="#6B8FBF" stroke-width="1.3" opacity=".85"/>
  <ellipse cx="184" cy="182" rx="30" ry="48" fill="#DEE8F3" stroke="#6B8FBF" stroke-width="1.3" opacity=".85"/>
  <path d="M88 152 C130 136 180 136 222 152" class="thin"/>
  <path d="M88 186 C130 170 180 170 222 186" class="thin"/>
  <path d="M88 220 C130 204 180 204 222 220" class="thin"/>
  <path d="M86 286 C122 244 188 244 224 286" class="ink" fill="#A67C52" stroke="#A67C52" stroke-width="2" opacity="0.3"/>
  <text x="155" y="72" class="t" font-size="13" text-anchor="middle" font-weight="600" fill="#6F8F6A">平常呼吸</text>
  <text x="155" y="88" class="ts" font-size="10.5" text-anchor="middle">橫膈膜只下降一點</text>
  <text x="155" y="324" class="ts" font-size="10.5" text-anchor="middle">夠活著用</text>
  <rect x="370" y="90" width="170" height="210" rx="18" fill="#FFFFFF" stroke="#D9CFC4" stroke-width="1.2"/>
  <ellipse cx="426" cy="182" rx="30" ry="48" fill="#DEE8F3" stroke="#6B8FBF" stroke-width="1.3" opacity=".85"/>
  <ellipse cx="484" cy="182" rx="30" ry="48" fill="#DEE8F3" stroke="#6B8FBF" stroke-width="1.3" opacity=".85"/>
  <path d="M388 152 C430 136 480 136 522 152" class="thin"/>
  <path d="M388 186 C430 170 480 170 522 186" class="thin"/>
  <path d="M388 220 C430 204 480 204 522 220" class="thin"/>
  <path d="M386 286 C422 218 488 218 524 286" class="ink" fill="#A67C52" stroke="#A67C52" stroke-width="2" opacity="0.3"/>
  <text x="455" y="72" class="t" font-size="13" text-anchor="middle" font-weight="600" fill="#6B8FBF">唱歌吸氣</text>
  <text x="455" y="88" class="ts" font-size="10.5" text-anchor="middle">下降更多、肋骨外擴</text>
  <text x="455" y="324" class="ts" font-size="10.5" text-anchor="middle">低、寬、不僵</text>
  <path d="M300.0 300.0 L330.6 300.0" fill="none" stroke="#3D3229" stroke-width="1.7" stroke-linecap="round"/><path d="M336.0 300.0 L330.5 302.4 L330.5 297.6 Z" fill="#3D3229"/>
  <text x="70" y="362" class="ts" font-size="11.5">吸氣像聞花香：沒有聲音，肩膀不動。</text>
</svg>
