<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 640 430" role="img" aria-label="聲帶開合：吸氣張開、發聲靠攏">
  <title>聲帶開合：吸氣張開、發聲靠攏</title>
  <rect width="640" height="430" fill="#FBF8F4"/>
  <text x="26" y="34" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="16" font-weight="700" fill="#3D3229">聲帶的開與合</text>
  <text x="26" y="55" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="12.5" fill="#8C8078">吸氣時張開讓氣通過，發聲時靠攏把氣擋住</text>
  <svg x="120" y="96" width="160" height="200" viewBox="1034 0 116 226"><image x="0" y="0" width="1200" height="226" xlink:href="_anatomy/src/glottis-positions.png"/></svg>
  <text x="200.0" y="324" text-anchor="middle" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="13" font-weight="600" fill="#3D3229">吸氣：張開</text>
  <text x="200.0" y="344" text-anchor="middle" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="11.5" fill="#8C8078">讓氣通過</text>
  <svg x="360" y="96" width="160" height="200" viewBox="34 0 116 226"><image x="0" y="0" width="1200" height="226" xlink:href="_anatomy/src/glottis-positions.png"/></svg>
  <text x="440.0" y="324" text-anchor="middle" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="13" font-weight="600" fill="#3D3229">發聲：靠攏</text>
  <text x="440.0" y="344" text-anchor="middle" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="11.5" fill="#8C8078">兩片碰在一起才擋得住氣</text>
  <text x="26" y="416" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="10.5" fill="#8C8078">底圖：Wikimedia Commons「Glottis positions」（公有領域），本站裁切</text>
</svg>
