<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" role="img" aria-label="聲帶開合：吸氣張開，發聲靠攏">
  <title>聲帶開合：吸氣張開，發聲靠攏</title>
  <rect width="640" height="320" fill="#FBF8F4"/>
  <style>
    .t   { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; }
    .tb  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; font-weight: 700; }
    .ts  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #8C8078; }
    .num { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #FFFFFF; font-weight: 700; font-size: 11px; }
    .ink { fill: none; stroke: #3D3229; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; }
    .thin{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; }
    .dash{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; stroke-dasharray: 4 5; }
    .lead{ fill: none; stroke: #8C8078; stroke-width: 1; }
    .acc { fill: none; stroke: #A67C52; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .blue{ fill: none; stroke: #6B8FBF; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .green{ fill: none; stroke: #6F8F6A; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .red { fill: none; stroke: #B0563F; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .dot { fill: #3D3229; }
  </style>
  <text x="26" y="34" class="tb" font-size="16">聲帶開合：吸氣張開，發聲靠攏</text>
  <text x="26" y="55" class="ts" font-size="12.5">閉合不是用力夾，是兩片剛好碰上</text>
  <rect x="70" y="120" width="200" height="46" rx="10" fill="#A67C52" opacity="0.18"/>
  <rect x="70" y="120" width="200" height="46" rx="10" fill="none" stroke="#A67C52" stroke-width="1.5"/>
  <rect x="70" y="184" width="200" height="46" rx="10" fill="#A67C52" opacity="0.18"/>
  <rect x="70" y="184" width="200" height="46" rx="10" fill="none" stroke="#A67C52" stroke-width="1.5"/>
  <text x="170" y="110" class="ts" font-size="11.5" text-anchor="middle">聲帶（俯視）</text>
  <text x="170" y="250" class="ts" font-size="11.5" text-anchor="middle">吸氣：張開讓氣通過</text>
  <rect x="330" y="90" width="0" height="0" fill="none"/>
  <rect x="370" y="120" width="200" height="46" rx="10" fill="#A67C52" opacity="0.18"/>
  <rect x="370" y="120" width="200" height="46" rx="10" fill="none" stroke="#A67C52" stroke-width="1.5"/>
  <rect x="370" y="172" width="200" height="46" rx="10" fill="#A67C52" opacity="0.18"/>
  <rect x="370" y="172" width="200" height="46" rx="10" fill="none" stroke="#A67C52" stroke-width="1.5"/>
  <text x="470" y="100" class="t" font-size="12" text-anchor="middle" font-weight="600">發聲：靠攏</text>
  <text x="470" y="250" class="ts" font-size="11.5" text-anchor="middle">兩片碰在一起，氣才會被擋住</text>
  <text x="26" y="302" class="ts" font-size="11">吸氣與發聲是兩件事：一開一合，中間沒有「半開」的正常狀態。</text>
</svg>
