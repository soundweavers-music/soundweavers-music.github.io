<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 330" role="img" aria-label="氣聲成分：諧波加上寬頻噪音">
  <title>氣聲成分：諧波加上寬頻噪音</title>
  <rect width="600" height="330" fill="#fbf8f2"/>
  <style>
    .ink { fill: none; stroke: #2b2a26; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
    .thin { fill: none; stroke: #8a8578; stroke-width: 1.4; stroke-dasharray: 5 5; }
    .grid { fill: none; stroke: #d8d0c2; stroke-width: 1.2; }
    .fill { fill: #b5734a; opacity: .18; stroke: #b5734a; stroke-width: 1.8; }
    .fill2 { fill: #7d9b76; opacity: .18; stroke: #7d9b76; stroke-width: 1.8; }
    .solid { fill: #b5734a; opacity: .85; }
    .solid2 { fill: #7d9b76; opacity: .85; }
    .lbl { font-family: 'Noto Serif TC', 'Songti TC', 'PingFang TC', serif; font-size: 15px; fill: #2b2a26; }
    .lbl-s { font-family: 'Noto Serif TC', 'Songti TC', 'PingFang TC', serif; font-size: 12.5px; fill: #8a8578; }
    .lbl-b { font-family: 'Noto Serif TC', 'Songti TC', 'PingFang TC', serif; font-size: 15px; fill: #2b2a26; font-weight: 700; }
  </style>
<text class="lbl-b" x="40" y="40">氣聲不是玄學：是「噪音」在諧波上面加了一層</text>
  <path class="ink" d="M70 260 L540 260"/>
  <path class="ink" d="M70 260 L70 80"/>
  <rect class="fill2" x="128" y="149" width="14" height="111" rx="3"/>
  <rect class="fill2" x="176" y="158" width="14" height="102" rx="3"/>
  <rect class="fill2" x="224" y="167" width="14" height="93" rx="3"/>
  <rect class="fill2" x="272" y="176" width="14" height="84" rx="3"/>
  <rect class="fill2" x="320" y="185" width="14" height="75" rx="3"/>
  <rect class="fill2" x="368" y="194" width="14" height="66" rx="3"/>
  <rect class="fill2" x="416" y="203" width="14" height="57" rx="3"/>
  <rect class="fill2" x="464" y="212" width="14" height="48" rx="3"/>
  <path class="fill" d="M75 250 C120 240 180 246 240 238 C300 250 360 242 420 248 C470 242 510 250 540 246 L540 260 L75 260 Z"/>
  <text class="lbl-s" x="300" y="92">諧波（音高）</text>
  <text class="lbl-s" x="300" y="150">↑ 這一整片是氣聲的噪音</text>
  <text class="lbl-s" x="70" y="300">哭腔、嘆氣、呢喃，都是靠「氣聲比例」在做事，不是靠音量</text>
</svg>
