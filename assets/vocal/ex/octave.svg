<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 300" role="img" aria-label="一口氣滑完八度">
  <title>一口氣滑完八度</title>
  <rect width="540" height="300" fill="#fbf8f2"/>
  <style>
    .out   { fill: none; stroke: #2a2724; stroke-width: 1.8; stroke-linejoin: round; stroke-linecap: round; }
    .lead  { fill: none; stroke: #2a2724; stroke-width: .9; }
    .dot   { fill: #2a2724; }
    .skin  { fill: #f1e0d6; stroke: #2a2724; stroke-width: 1.8; }
    .muc   { fill: #e2a99b; stroke: #cb8f82; stroke-width: 1.2; }
    .muc2  { fill: #cb8f82; stroke: #2a2724; stroke-width: 1.4; }
    .cart  { fill: #d5d5c2; stroke: #2a2724; stroke-width: 1.5; }
    .bone  { fill: #ece6d8; stroke: #2a2724; stroke-width: 1.4; }
    .air   { fill: #d5e5e7; stroke: #2a2724; stroke-width: 1.3; }
    .fold  { fill: #f6f3ea; stroke: #c9c1ac; stroke-width: 1.6; }
    .musc  { fill: #cf8f88; stroke: #2a2724; stroke-width: 1.1; }
    .hl    { fill: #b5734a; fill-opacity: .22; stroke: #b5734a; stroke-width: 1.7; }
    .hl2   { fill: #7d9b76; fill-opacity: .22; stroke: #7d9b76; stroke-width: 1.7; }
    .ink   { fill: none; stroke: #2a2724; stroke-width: 1.8; stroke-linejoin: round; stroke-linecap: round; }
    .ave   { fill: none; stroke: #b5734a; stroke-width: 2.2; stroke-linejoin: round; stroke-linecap: round; }
    .ave2  { fill: none; stroke: #7d9b76; stroke-width: 2.2; stroke-linejoin: round; stroke-linecap: round; }
    .thin  { fill: none; stroke: #d8d0c2; stroke-width: 1.3; stroke-dasharray: 5 5; }
    .lbl   { font-family: 'Noto Sans TC','PingFang TC',system-ui,sans-serif; font-size: 14px; fill: #2a2724; }
    .lbl-s { font-family: 'Noto Sans TC','PingFang TC',system-ui,sans-serif; font-size: 12px; fill: #6f6a60; }
    .lbl-b { font-family: 'Noto Sans TC','PingFang TC',system-ui,sans-serif; font-size: 14px; fill: #2a2724; font-weight: 700; }
  </style>
<text class="lbl-b" x="26" y="30">一口氣滑完八度</text>
  <path class="grid" d="M50 220 L420 220"/>
  <path class="ave" d="M70 200 C150 190 200 80 300 70 C350 66 390 84 410 92"/>
  <circle cx="70" cy="200" r="6" fill="#b5734a"/>
  <circle cx="410" cy="92" r="6" fill="#b5734a"/>
  <text class="lbl-s" x="70" y="240">低八度</text>
  <text class="lbl-s" x="400" y="240" text-anchor="end">高八度</text>
  <text class="lbl-s" x="240" y="52" text-anchor="middle">一口氣滑完，不要中途換檔</text>
  <text class="lbl-s" x="26" y="284">八度滑行是從胸聲一路帶到頭聲，中間不能斷</text>
</svg>
