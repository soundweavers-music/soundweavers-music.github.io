<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-label="聲音是練不出來的，是休息出來的">
  <title>聲音是練不出來的，是休息出來的</title>
  <rect width="640" height="300" fill="#FBF8F4"/>
  <style>
    .t   { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; }
    .tb  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; font-weight: 700; }
    .ts  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #8C8078; }
    .num { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #FFFFFF; font-weight: 700; font-size: 11px; }
    .ink { fill: none; stroke: #3D3229; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; }
    .thin{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; }
    .dash{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; stroke-dasharray: 4 5; }
    .lead{ fill: none; stroke: #8C8078; stroke-width: 1; }
    .acc { fill: none; stroke: #A67C52; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .blue{ fill: none; stroke: #6B8FBF; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .green{ fill: none; stroke: #6F8F6A; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .red { fill: none; stroke: #B0563F; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .dot { fill: #3D3229; }
  </style>
  <text x="26" y="34" class="tb" font-size="16">聲音是練不出來的，是休息出來的</text>
  <text x="26" y="55" class="ts" font-size="12.5">一週排三到四天，比天天練有效</text>
  <rect x="90" y="150" width="44" height="90" rx="4" fill="#A67C52" opacity="0.28"/>
  <rect x="90" y="150" width="44" height="90" rx="4" fill="none" stroke="#A67C52" stroke-width="1.1"/>
  <text x="112" y="262" class="t" font-size="12" text-anchor="middle">一</text>
  <text x="112" y="140" class="ts" font-size="11" text-anchor="middle">練</text>
  <rect x="156" y="150" width="44" height="90" rx="4" fill="#6F8F6A" opacity="0.18"/>
  <rect x="156" y="150" width="44" height="90" rx="4" fill="none" stroke="#6F8F6A" stroke-width="1.1"/>
  <text x="178" y="262" class="t" font-size="12" text-anchor="middle">二</text>
  <text x="178" y="140" class="ts" font-size="11" text-anchor="middle">休</text>
  <rect x="222" y="150" width="44" height="90" rx="4" fill="#A67C52" opacity="0.28"/>
  <rect x="222" y="150" width="44" height="90" rx="4" fill="none" stroke="#A67C52" stroke-width="1.1"/>
  <text x="244" y="262" class="t" font-size="12" text-anchor="middle">三</text>
  <text x="244" y="140" class="ts" font-size="11" text-anchor="middle">練</text>
  <rect x="288" y="150" width="44" height="90" rx="4" fill="#6F8F6A" opacity="0.18"/>
  <rect x="288" y="150" width="44" height="90" rx="4" fill="none" stroke="#6F8F6A" stroke-width="1.1"/>
  <text x="310" y="262" class="t" font-size="12" text-anchor="middle">四</text>
  <text x="310" y="140" class="ts" font-size="11" text-anchor="middle">休</text>
  <rect x="354" y="150" width="44" height="90" rx="4" fill="#A67C52" opacity="0.28"/>
  <rect x="354" y="150" width="44" height="90" rx="4" fill="none" stroke="#A67C52" stroke-width="1.1"/>
  <text x="376" y="262" class="t" font-size="12" text-anchor="middle">五</text>
  <text x="376" y="140" class="ts" font-size="11" text-anchor="middle">練</text>
  <rect x="420" y="150" width="44" height="90" rx="4" fill="#6F8F6A" opacity="0.18"/>
  <rect x="420" y="150" width="44" height="90" rx="4" fill="none" stroke="#6F8F6A" stroke-width="1.1"/>
  <text x="442" y="262" class="t" font-size="12" text-anchor="middle">六</text>
  <text x="442" y="140" class="ts" font-size="11" text-anchor="middle">休</text>
  <rect x="486" y="150" width="44" height="90" rx="4" fill="#6F8F6A" opacity="0.18"/>
  <rect x="486" y="150" width="44" height="90" rx="4" fill="none" stroke="#6F8F6A" stroke-width="1.1"/>
  <text x="508" y="262" class="t" font-size="12" text-anchor="middle">日</text>
  <text x="508" y="140" class="ts" font-size="11" text-anchor="middle">休</text>
  <text x="26" y="282" class="ts" font-size="11">聲帶是肌肉：練完需要恢復。每天硬練，進步反而停住。</text>
</svg>
