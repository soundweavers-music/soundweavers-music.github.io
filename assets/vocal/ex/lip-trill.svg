  <polyline points="262.0,154.0 263.3,150.3 264.6,147.3 265.9,145.4 267.2,145.0 268.5,146.2 269.8,148.7 271.1,152.1 272.4,155.9 273.7,159.3 275.0,161.8 276.3,163.0 277.6,162.6 278.9,160.7 280.2,157.7 281.5,154.0 282.8,150.3 284.1,147.3 285.4,145.4 286.7,145.0 288.0,146.2 289.3,148.7 290.6,152.1 291.9,155.9 293.2,159.3 294.5,161.8 295.8,163.0 297.1,162.6 298.4,160.7 299.7,157.7 301.0,154.0 302.3,150.3 303.6,147.3 304.9,145.4 306.2,145.0 307.5,146.2 308.8,148.7 310.1,152.1 311.4,155.9 312.7,159.3 314.0,161.8 315.3,163.0 316.6,162.6 317.9,160.7 319.2,157.7 320.5,154.0 321.8,150.3 323.1,147.3 324.4,145.4 325.7,145.0 327.0,146.2 328.3,148.7 329.6,152.1 330.9,155.9 332.2,159.3 333.5,161.8 334.8,163.0 336.1,162.6 337.4,160.7 338.7,157.7 340.0,154.0" class="acc" fill="none"/>
  <text x="262" y="202" class="ts" font-size="11.5">吹成「噗嚕噗嚕」</text>
  <text x="262" y="222" class="ts" font-size="10.5">手摸脖子：鬆的</text>
  <rect x="382" y="92" width="232" height="68" rx="6" fill="#E4EBDC" stroke="#6F8F6A" stroke-width="1.2"/>
  <text x="396" y="118" class="t" font-size="12.5" font-weight="600" fill="#6F8F6A">對：喉嚨沒有感覺</text>
  <text x="396" y="140" class="ts" font-size="11">只有嘴唇在動</text>
  <rect x="382" y="176" width="232" height="68" rx="6" fill="#F4DFD7" stroke="#B0563F" stroke-width="1.2"/>
  <text x="396" y="202" class="t" font-size="12.5" font-weight="600" fill="#B0563F">錯：喉嚨在出力</text>
  <text x="396" y="224" class="ts" font-size="11">嘴唇反而抖不起來</text>
  <text x="26" y="342" class="ts" font-size="11">彈唇是「半閉口」練習：氣有阻力、聲帶壓力變小，換聲區最容易鬆開。</text>
</svg>
