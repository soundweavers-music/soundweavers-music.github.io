  <path class="lead" d="M180 146 L250 110"/><circle class="dot" cx="180" cy="146" r="2.6"/><text class="lbl" x="256" y="114">假聲帶關起來</text>
  <path class="lead" d="M180 200 L250 214"/><circle class="dot" cx="180" cy="200" r="2.6"/><text class="lbl" x="256" y="218">真聲帶在下面</text>
  <text class="lbl-s" x="30" y="280">先認識它，再學會不要叫它出來</text>
  <text class="lbl-s" x="26" y="284">那個「夾住」的感覺，是假聲帶在關門</text>
