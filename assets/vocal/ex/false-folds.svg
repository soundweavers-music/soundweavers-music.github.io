    .ave2  { fill: none; stroke: #7d9b76; stroke-width: 2.2; stroke-linejoin: round; stroke-linecap: round; }
    .thin  { fill: none; stroke: #d8d0c2; stroke-width: 1.3; stroke-dasharray: 5 5; }
    .lbl   { font-family: 'Noto Sans TC','PingFang TC',system-ui,sans-serif; font-size: 14px; fill: #2a2724; }
    .lbl-s { font-family: 'Noto Sans TC','PingFang TC',system-ui,sans-serif; font-size: 12px; fill: #6f6a60; }
    .lbl-b { font-family: 'Noto Sans TC','PingFang TC',system-ui,sans-serif; font-size: 14px; fill: #2a2724; font-weight: 700; }
  </style>
<text class="lbl-b" x="26" y="30">認出假聲帶夾住的那個感覺</text>
  <g transform="translate(20,40) scale(0.62)"><path class="cart" d="M96 60 C130 44 210 44 244 60 C252 110 250 176 240 216 C210 232 130 232 100 216 C90 176 90 110 96 60 Z"/>
  <path class="air" d="M124 76 C160 66 190 66 216 76 C222 130 220 186 212 216 C182 226 156 226 128 216 C120 186 118 130 124 76 Z"/>
  <path class="hl" d="M124 118 C144 104 166 102 186 110 C192 118 190 126 182 128 C162 122 142 124 126 132 Z"/>
  <path class="hl" d="M216 118 C196 104 174 102 154 110 C148 118 150 126 158 128 C178 122 198 124 214 132 Z"/>
  <path class="fold" d="M126 156 C152 146 178 146 198 158 C202 170 196 180 186 182 C162 172 144 174 128 180 Z"/>
  <path class="fold" d="M214 156 C188 146 162 146 142 158 C138 170 144 180 154 182 C178 172 196 174 212 180 Z"/>
  <path class="ink" d="M170 140 L192 140"/>
  <path class="air" d="M128 218 L212 218 L216 292 L132 292 Z"/>
  <path class="ink" d="M130 232 L214 232"/>
