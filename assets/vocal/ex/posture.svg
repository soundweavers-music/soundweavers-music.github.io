<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="站好，再開始唱">
  <title>站好，再開始唱</title>
  <rect width="640" height="360" fill="#FBF8F4"/>
  <style>
    .t   { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; }
    .tb  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; font-weight: 700; }
    .ts  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #8C8078; }
    .num { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #FFFFFF; font-weight: 700; font-size: 11px; }
    .ink { fill: none; stroke: #3D3229; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; }
    .thin{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; }
    .dash{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; stroke-dasharray: 4 5; }
    .lead{ fill: none; stroke: #8C8078; stroke-width: 1; }
    .acc { fill: none; stroke: #A67C52; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .blue{ fill: none; stroke: #6B8FBF; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .green{ fill: none; stroke: #6F8F6A; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .red { fill: none; stroke: #B0563F; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .dot { fill: #3D3229; }
  </style>
  <text x="26" y="34" class="tb" font-size="16">站好，再開始唱</text>
  <text x="26" y="55" class="ts" font-size="12.5">身體是一根柱子，不是一張弓</text>
  <path d="M210 70 L210 320" fill="none" stroke="#D9CFC4" stroke-width="1.2" stroke-dasharray="5 5"/>
  <circle cx="210" cy="96" r="7" fill="#A67C52" opacity="0.9"/>
  <text x="188" y="100" class="ts" font-size="11.5" text-anchor="end">耳</text>
  <circle cx="210" cy="148" r="7" fill="#A67C52" opacity="0.9"/>
  <text x="188" y="152" class="ts" font-size="11.5" text-anchor="end">肩</text>
  <circle cx="210" cy="226" r="7" fill="#A67C52" opacity="0.9"/>
  <text x="188" y="230" class="ts" font-size="11.5" text-anchor="end">骨盆</text>
  <circle cx="210" cy="314" r="7" fill="#A67C52" opacity="0.9"/>
  <text x="188" y="318" class="ts" font-size="11.5" text-anchor="end">腳踝</text>
  <path d="M210 96 C186 120 184 168 196 226 C204 270 206 292 210 314" class="ink" opacity="0.35"/>
  <text x="264" y="100" class="ts" font-size="12">耳朵、肩膀、骨盆、腳踝，</text>
  <text x="264" y="122" class="ts" font-size="12">從側面看要落在同一條鉛垂線上。</text>
  <text x="264" y="168" class="ts" font-size="12">站直不是挺胸，是「不要塌」：</text>
  <text x="264" y="190" class="ts" font-size="12">肋骨不要往前翻，下巴不要往前伸。</text>
  <text x="26" y="342" class="ts" font-size="11">姿勢不是為了好看，是為了讓氣道是直的。</text>
</svg>
