<text class="lbl-b" x="26" y="30">讓聲門靠攏但不夾</text>
  <g transform="translate(50,30) scale(0.66)"><ellipse class="muc" cx="180" cy="176" rx="110" ry="136"/>
  <ellipse class="muc2" cx="146" cy="288" rx="17" ry="14"/>
  <ellipse class="muc2" cx="214" cy="288" rx="17" ry="14"/>
  <path class="fold" d="M180 56 C165.0 112 169.0 198 179.0 264 C153.0 278 125.0 272 121.0 246 C115.0 164 149.0 90 180 56 Z"/>
  <path class="fold" d="M180 56 C195.0 112 191.0 198 181.0 264 C207.0 278 235.0 272 239.0 246 C245.0 164 211.0 90 180 56 Z"/>
