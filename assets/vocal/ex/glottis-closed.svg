<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 300" role="img" aria-label="讓聲門靠攏但不夾">
  <title>讓聲門靠攏但不夾</title>
  <rect width="540" height="300" fill="#fbf8f2"/>
  <style>
