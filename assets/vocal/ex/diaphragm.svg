<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="用肚子吸氣，不是用肩膀">
  <title>用肚子吸氣，不是用肩膀</title>
  <rect width="640" height="360" fill="#FBF8F4"/>
  <style>
    .t   { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; }
    .tb  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; font-weight: 700; }
    .ts  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #8C8078; }
    .num { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #FFFFFF; font-weight: 700; font-size: 11px; }
    .ink { fill: none; stroke: #3D3229; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; }
    .thin{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; }
    .dash{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; stroke-dasharray: 4 5; }
    .lead{ fill: none; stroke: #8C8078; stroke-width: 1; }
    .acc { fill: none; stroke: #A67C52; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .blue{ fill: none; stroke: #6B8FBF; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .green{ fill: none; stroke: #6F8F6A; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .red { fill: none; stroke: #B0563F; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .dot { fill: #3D3229; }
  </style>
  <text x="26" y="34" class="tb" font-size="16">用肚子吸氣，不是用肩膀</text>
  <text x="26" y="55" class="ts" font-size="12.5">空氣只會進肺，肚子鼓是橫膈膜往下推的結果</text>
  <text x="150" y="90" class="t" font-size="13.5" text-anchor="middle" font-weight="600" fill="#B0563F">用肩膀吸</text>
  <path d="M110 130 C130 116 170 116 190 130" class="ink"/>
  <path d="M130.0 150.0 L130.0 123.4" fill="none" stroke="#B0563F" stroke-width="1.7" stroke-linecap="round"/><path d="M130.0 118.0 L132.4 123.5 L127.6 123.5 Z" fill="#B0563F"/>
  <path d="M170.0 150.0 L170.0 123.4" fill="none" stroke="#B0563F" stroke-width="1.7" stroke-linecap="round"/><path d="M170.0 118.0 L172.4 123.5 L167.6 123.5 Z" fill="#B0563F"/>
  <rect x="112" y="190" width="76" height="84" rx="10" fill="#F4DFD7" stroke="#B0563F" stroke-width="1.2"/>
  <text x="150" y="292" class="ts" font-size="11" text-anchor="middle">胸口抬起、脖子變短</text>
  <text x="450" y="90" class="t" font-size="13.5" text-anchor="middle" font-weight="600" fill="#6F8F6A">用下腹（橫膈膜）</text>
  <path d="M410 130 C430 118 470 118 490 130" class="ink"/>
  <rect x="412" y="150" width="76" height="124" rx="10" fill="#E4EBDC" stroke="#6F8F6A" stroke-width="1.2"/>
  <path d="M450.0 258.0 L450.0 195.4" fill="none" stroke="#6F8F6A" stroke-width="1.7" stroke-linecap="round"/><path d="M450.0 190.0 L452.4 195.5 L447.6 195.5 Z" fill="#6F8F6A"/>
  <text x="450" y="292" class="ts" font-size="11" text-anchor="middle">肩膀不動，下腹鬆開外擴</text>
  <text x="450" y="312" class="ts" font-size="11" text-anchor="middle">肚子鼓是結果，不是動作</text>
  <text x="26" y="342" class="ts" font-size="11">吸氣像聞花香：沒有聲音、肩膀不動，只有下腹與肋骨在動。</text>
</svg>
