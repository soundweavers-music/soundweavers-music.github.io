  <text class="lbl-b" x="220" y="92" text-anchor="middle">厚、短 → 低音</text>
  <text class="lbl-b" x="530" y="92" text-anchor="middle">薄、長 → 高音</text>
  <text class="lbl-s" x="220" y="404" text-anchor="middle">甲杓肌（TA）收縮</text>
  <text class="lbl-s" x="530" y="404" text-anchor="middle">環甲肌（CT）收縮</text>
  <text class="lbl-s" x="24" y="452">厚的時候面積大、振動慢；拉薄之後張力高、振動快</text>
