<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 330" role="img" aria-label="聲帶厚薄與音高：甲杓肌（TA）與環甲肌（CT）">
  <title>聲帶厚薄與音高：甲杓肌（TA）與環甲肌（CT）</title>
  <rect width="620" height="330" fill="#fbf8f2"/>
  <style>
    .ink { fill: none; stroke: #2b2a26; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
    .thin { fill: none; stroke: #8a8578; stroke-width: 1.4; stroke-dasharray: 5 5; }
    .grid { fill: none; stroke: #d8d0c2; stroke-width: 1.2; }
    .fill { fill: #b5734a; opacity: .18; stroke: #b5734a; stroke-width: 1.8; }
    .fill2 { fill: #7d9b76; opacity: .18; stroke: #7d9b76; stroke-width: 1.8; }
    .solid { fill: #b5734a; opacity: .85; }
    .solid2 { fill: #7d9b76; opacity: .85; }
    .lbl { font-family: 'Noto Serif TC', 'Songti TC', 'PingFang TC', serif; font-size: 15px; fill: #2b2a26; }
    .lbl-s { font-family: 'Noto Serif TC', 'Songti TC', 'PingFang TC', serif; font-size: 12.5px; fill: #8a8578; }
    .lbl-b { font-family: 'Noto Serif TC', 'Songti TC', 'PingFang TC', serif; font-size: 15px; fill: #2b2a26; font-weight: 700; }
  </style>
<text class="lbl-b" x="40" y="40">同一條聲帶，厚薄改變就是音高改變</text>
  <text class="lbl-b" x="110" y="92">厚、短 → 低音</text>
  <path class="fill2" d="M110 168 C160 120 230 120 280 168 C230 216 160 216 110 168 Z"/>
  <path class="ink" d="M76 168 L44 168"/><path class="ink" d="M44 168 L54.0 163.5 L54.0 172.5 Z" fill="#2b2a26"/>
  <path class="ink" d="M314 168 L346 168"/><path class="ink" d="M346 168 L336.0 172.5 L336.0 163.5 Z" fill="#2b2a26"/>
  <text class="lbl-s" x="195" y="250" text-anchor="middle">甲杓肌（TA）收縮：變厚變短</text>
  <text class="lbl-b" x="370" y="92">薄、長 → 高音</text>
  <path class="fill2" d="M370 168 C420 159 490 159 540 168 C490 177 420 177 370 168 Z"/>
  <path class="ink" d="M336 168 L304 168"/><path class="ink" d="M304 168 L314.0 163.5 L314.0 172.5 Z" fill="#2b2a26"/>
  <path class="ink" d="M574 168 L606 168"/><path class="ink" d="M606 168 L596.0 172.5 L596.0 163.5 Z" fill="#2b2a26"/>
  <text class="lbl-s" x="455" y="211" text-anchor="middle">環甲肌（CT）收縮：拉長拉薄</text>
  <text class="lbl-s" x="40" y="300">厚的時候面積大、振動慢；拉薄之後張力高、振動快。你不需要「感覺」它，只要知道方向</text>
</svg>
