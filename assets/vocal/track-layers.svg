<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 390" role="img" aria-label="分段錄音堆疊成一首歌的分軌">
  <title>分段錄音堆疊成一首歌的分軌</title>
  <rect width="620" height="390" fill="#fbf8f2"/>
  <style>
    .ink { fill: none; stroke: #2b2a26; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
    .thin { fill: none; stroke: #8a8578; stroke-width: 1.4; stroke-dasharray: 5 5; }
    .grid { fill: none; stroke: #d8d0c2; stroke-width: 1.2; }
    .fill { fill: #b5734a; opacity: .18; stroke: #b5734a; stroke-width: 1.8; }
    .fill2 { fill: #7d9b76; opacity: .18; stroke: #7d9b76; stroke-width: 1.8; }
    .solid { fill: #b5734a; opacity: .85; }
    .solid2 { fill: #7d9b76; opacity: .85; }
    .lbl { font-family: 'Noto Serif TC', 'Songti TC', 'PingFang TC', serif; font-size: 15px; fill: #2b2a26; }
    .lbl-s { font-family: 'Noto Serif TC', 'Songti TC', 'PingFang TC', serif; font-size: 12.5px; fill: #8a8578; }
    .lbl-b { font-family: 'Noto Serif TC', 'Songti TC', 'PingFang TC', serif; font-size: 15px; fill: #2b2a26; font-weight: 700; }
  </style>
<text class="lbl-b" x="40" y="40">分軌錄音就是「一次只做一件事」</text>
  <text class="lbl-s" x="50" y="108">主唱</text>
  <rect class="fill" x="200" y="90" width="52" height="30" rx="6"/>
  <rect class="fill" x="258" y="90" width="52" height="30" rx="6"/>
  <rect class="fill" x="316" y="90" width="52" height="30" rx="6"/>
  <rect class="fill" x="374" y="90" width="52" height="30" rx="6"/>
  <rect class="fill" x="432" y="90" width="52" height="30" rx="6"/>
  <rect class="fill" x="490" y="90" width="52" height="30" rx="6"/>
  <text class="lbl-s" x="50" y="158">主唱（第二次）</text>
  <rect class="fill2" x="200" y="140" width="52" height="30" rx="6"/>
  <rect class="fill2" x="258" y="140" width="52" height="30" rx="6"/>
  <rect class="fill2" x="316" y="140" width="52" height="30" rx="6"/>
  <rect class="fill2" x="374" y="140" width="52" height="30" rx="6"/>
  <rect class="fill2" x="432" y="140" width="52" height="30" rx="6"/>
  <rect class="fill2" x="490" y="140" width="52" height="30" rx="6"/>
  <text class="lbl-s" x="50" y="208">低三度和聲</text>
  <rect class="fill" x="200" y="190" width="52" height="30" rx="6"/>
  <rect class="fill" x="258" y="190" width="52" height="30" rx="6"/>
  <rect class="fill" x="316" y="190" width="52" height="30" rx="6"/>
  <rect class="fill" x="374" y="190" width="52" height="30" rx="6"/>
  <rect class="fill" x="432" y="190" width="52" height="30" rx="6"/>
  <rect class="fill" x="490" y="190" width="52" height="30" rx="6"/>
  <text class="lbl-s" x="50" y="258">高八度和聲</text>
  <rect class="fill2" x="200" y="240" width="52" height="30" rx="6"/>
  <rect class="fill2" x="258" y="240" width="52" height="30" rx="6"/>
  <rect class="fill2" x="316" y="240" width="52" height="30" rx="6"/>
  <rect class="fill2" x="374" y="240" width="52" height="30" rx="6"/>
  <rect class="fill2" x="432" y="240" width="52" height="30" rx="6"/>
  <rect class="fill2" x="490" y="240" width="52" height="30" rx="6"/>
  <text class="lbl-s" x="50" y="308">氣音層</text>
  <rect class="grid" x="200" y="290" width="52" height="30" rx="6"/>
  <rect class="grid" x="258" y="290" width="52" height="30" rx="6"/>
  <rect class="grid" x="316" y="290" width="52" height="30" rx="6"/>
  <rect class="grid" x="374" y="290" width="52" height="30" rx="6"/>
  <rect class="grid" x="432" y="290" width="52" height="30" rx="6"/>
  <rect class="grid" x="490" y="290" width="52" height="30" rx="6"/>
  <text class="lbl-s" x="40" y="360">每一軌只修一個問題：這軌收音準、那軌咬字、另一軌情緒——合起來才會像一個人</text>
</svg>
