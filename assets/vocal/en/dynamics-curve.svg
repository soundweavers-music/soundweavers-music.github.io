<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="Dynamics from verse to chorus">
  <title>Dynamics from verse to chorus</title>
  <rect width="640" height="360" fill="#FBF8F4"/>
  <style>
    .t   { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; }
    .tb  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; font-weight: 700; }
    .ts  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #8C8078; }
    .num { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #FFFFFF; font-weight: 700; font-size: 11px; }
    .ink { fill: none; stroke: #3D3229; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; }
    .thin{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; }
    .dash{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; stroke-dasharray: 4 5; }
    .lead{ fill: none; stroke: #8C8078; stroke-width: 1; }
    .acc { fill: none; stroke: #A67C52; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .blue{ fill: none; stroke: #6B8FBF; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .green{ fill: none; stroke: #6F8F6A; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .red { fill: none; stroke: #B0563F; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .dot { fill: #3D3229; }
  </style>
  <text x="26" y="34" class="tb" font-size="16">Dynamics from verse to chorus</text>
  <text x="26" y="55" class="ts" font-size="12.5">Hold back first, then you have something to give</text>
  <rect x="82.0" y="290" width="182.2" height="16" rx="4" fill="#A67C52" opacity="0.16"/>
  <text x="173.1" y="326" class="ts" font-size="11" text-anchor="middle">verse</text>
  <rect x="82.0" y="242.5" width="182.2" height="37.5" rx="4" fill="#A67C52" opacity="0.1"/>
  <rect x="268.2" y="290" width="94.0" height="16" rx="4" fill="#A67C52" opacity="0.16"/>
  <text x="315.2" y="326" class="ts" font-size="11" text-anchor="middle">pre-chorus</text>
  <rect x="268.2" y="212.5" width="94.0" height="67.5" rx="4" fill="#A67C52" opacity="0.1"/>
  <rect x="366.2" y="290" width="152.8" height="16" rx="4" fill="#A67C52" opacity="0.16"/>
  <text x="442.6" y="326" class="ts" font-size="11" text-anchor="middle">chorus</text>
  <rect x="366.2" y="145.0" width="152.8" height="135.0" rx="4" fill="#A67C52" opacity="0.1"/>
  <rect x="523.0" y="290" width="45.0" height="16" rx="4" fill="#A67C52" opacity="0.16"/>
  <text x="545.5" y="326" class="ts" font-size="11" text-anchor="middle">outro</text>
  <rect x="523.0" y="250.0" width="45.0" height="30.0" rx="4" fill="#A67C52" opacity="0.1"/>
  <path d="M80 280 L570 280" class="thin"/>
  <path d="M80 246 C160 220 210 214 260 196 C320 172 380 152 440 134 C480 124 520 122 570 236" class="acc"/>
  <text x="80" y="96" class="ts" font-size="12">The vertical axis is intensity for the listener, not volume</text>
  <text x="80" y="356" class="ts" font-size="11.5">A big chorus comes from a small verse; a clean outro from air in reserve</text>
</svg>
