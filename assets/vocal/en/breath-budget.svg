<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" role="img" aria-label="How one breath is spent on a long note">
  <title>How one breath is spent on a long note</title>
  <rect width="640" height="320" fill="#FBF8F4"/>
  <style>
    .t   { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; }
    .tb  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; font-weight: 700; }
    .ts  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #8C8078; }
    .num { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #FFFFFF; font-weight: 700; font-size: 11px; }
    .ink { fill: none; stroke: #3D3229; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; }
    .thin{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; }
    .dash{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; stroke-dasharray: 4 5; }
    .lead{ fill: none; stroke: #8C8078; stroke-width: 1; }
    .acc { fill: none; stroke: #A67C52; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .blue{ fill: none; stroke: #6B8FBF; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .green{ fill: none; stroke: #6F8F6A; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .red { fill: none; stroke: #B0563F; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .dot { fill: #3D3229; }
  </style>
  <text x="26" y="34" class="tb" font-size="16">How one breath is spent on a long note</text>
  <text x="26" y="55" class="ts" font-size="12.5">The onset should use a little; the rest is for holding</text>
  <rect x="80" y="150" width="46.0" height="26" rx="4" fill="#A67C52" opacity="0.3"/>
  <rect x="80" y="150" width="46.0" height="26" rx="4" fill="none" stroke="#A67C52" stroke-width="1.2"/>
  <text x="104.5" y="168" class="t" font-size="12" text-anchor="middle" font-weight="600">onset</text>
  <rect x="129.0" y="150" width="340.0" height="26" rx="4" fill="#6F8F6A" opacity="0.3"/>
  <rect x="129.0" y="150" width="340.0" height="26" rx="4" fill="none" stroke="#6F8F6A" stroke-width="1.2"/>
  <text x="300.5" y="168" class="t" font-size="12" text-anchor="middle" font-weight="600">sustain</text>
  <rect x="472.0" y="150" width="95.0" height="26" rx="4" fill="#6B8FBF" opacity="0.3"/>
  <rect x="472.0" y="150" width="95.0" height="26" rx="4" fill="none" stroke="#6B8FBF" stroke-width="1.2"/>
  <text x="521.0" y="168" class="t" font-size="12" text-anchor="middle" font-weight="600">release</text>
  <path d="M80 220 C140 210 200 210 260 206 L430 206 C500 206 530 216 570 236" class="acc"/>
  <text x="80" y="134" class="ts" font-size="12">How one breath is spent on a long note</text>
  <text x="80" y="280" class="ts" font-size="12">Most singers spend 80% of the air in the first 3 seconds; it should be reversed</text>
  <text x="26" y="302" class="ts" font-size="11">The release is not running out of air; it is deciding to stop with some left</text>
</svg>
