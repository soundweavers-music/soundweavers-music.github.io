<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" role="img" aria-label="The practice loop: set, record, listen, fix">
  <title>The practice loop: set, record, listen, fix</title>
  <rect width="640" height="340" fill="#FBF8F4"/>
  <style>
    .t   { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; }
    .tb  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; font-weight: 700; }
    .ts  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #8C8078; }
    .num { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #FFFFFF; font-weight: 700; font-size: 11px; }
    .ink { fill: none; stroke: #3D3229; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; }
    .thin{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; }
    .dash{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; stroke-dasharray: 4 5; }
    .lead{ fill: none; stroke: #8C8078; stroke-width: 1; }
    .acc { fill: none; stroke: #A67C52; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .blue{ fill: none; stroke: #6B8FBF; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .green{ fill: none; stroke: #6F8F6A; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .red { fill: none; stroke: #B0563F; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .dot { fill: #3D3229; }
  </style>
  <text x="26" y="34" class="tb" font-size="16">The practice loop: set, record, listen, fix</text>
  <text x="26" y="55" class="ts" font-size="12.5">Practice without recording just repeats what you think you sound like</text>
  <ellipse cx="320" cy="190" rx="130" ry="92" class="dash" fill="none"/>
  <circle cx="320.0" cy="98.0" r="30" fill="#FFFFFF" stroke="#A67C52" stroke-width="1.5"/>
  <text x="320.0" y="102.0" class="t" font-size="10.5" text-anchor="middle" font-weight="600">set one goal</text>
  <circle cx="344.0" cy="74.0" r="9" fill="#A67C52"/>  <text x="344.0" y="78.0" text-anchor="middle" class="num">1</text>
  <circle cx="450.0" cy="190.0" r="30" fill="#FFFFFF" stroke="#A67C52" stroke-width="1.5"/>
  <text x="450.0" y="194.0" class="t" font-size="10.5" text-anchor="middle" font-weight="600">record 30 seconds</text>
  <circle cx="474.0" cy="166.0" r="9" fill="#A67C52"/>  <text x="474.0" y="170.0" text-anchor="middle" class="num">2</text>
  <circle cx="320.0" cy="282.0" r="30" fill="#FFFFFF" stroke="#A67C52" stroke-width="1.5"/>
  <text x="320.0" y="286.0" class="t" font-size="10.5" text-anchor="middle" font-weight="600">listen for one problem only</text>
  <circle cx="344.0" cy="258.0" r="9" fill="#A67C52"/>  <text x="344.0" y="262.0" text-anchor="middle" class="num">3</text>
  <circle cx="190.0" cy="190.0" r="30" fill="#FFFFFF" stroke="#A67C52" stroke-width="1.5"/>
  <text x="190.0" y="194.0" class="t" font-size="10.5" text-anchor="middle" font-weight="600">change one thing</text>
  <circle cx="214.0" cy="166.0" r="9" fill="#A67C52"/>  <text x="214.0" y="170.0" text-anchor="middle" class="num">4</text>
  <text x="26" y="322" class="ts" font-size="11">One change per round; after four rounds record a full take and compare</text>
</svg>
