  <text x="400" y="150" class="ts" font-size="12">On low notes the palm feels a pulse</text>
  <text x="400" y="172" class="ts" font-size="12">No buzz? That is not an error</text>
  <text x="400" y="194" class="ts" font-size="12">Too quiet, or placed too high</text>
