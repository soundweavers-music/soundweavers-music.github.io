<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-label="Find your place on the slider">
  <title>Find your place on the slider</title>
  <rect width="640" height="300" fill="#FBF8F4"/>
  <style>
    .t   { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; }
    .tb  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; font-weight: 700; }
    .ts  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #8C8078; }
    .num { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #FFFFFF; font-weight: 700; font-size: 11px; }
    .ink { fill: none; stroke: #3D3229; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; }
    .thin{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; }
    .dash{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; stroke-dasharray: 4 5; }
    .lead{ fill: none; stroke: #8C8078; stroke-width: 1; }
    .acc { fill: none; stroke: #A67C52; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .blue{ fill: none; stroke: #6B8FBF; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .green{ fill: none; stroke: #6F8F6A; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .red { fill: none; stroke: #B0563F; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .dot { fill: #3D3229; }
  </style>
  <text x="26" y="34" class="tb" font-size="16">Find your place on the slider</text>
  <text x="26" y="55" class="ts" font-size="12.5">The same lyric line can slide freely along this bar</text>
  <rect x="70" y="150" width="500" height="34" rx="17" fill="#FFFFFF" stroke="#D9CFC4" stroke-width="1.2"/>
  <defs><linearGradient id="mixg" x1="0" x2="1"><stop offset="0" stop-color="#6F8F6A" stop-opacity=".45"/><stop offset=".5" stop-color="#A67C52" stop-opacity=".4"/><stop offset="1" stop-color="#6B8FBF" stop-opacity=".45"/></linearGradient></defs>
  <rect x="72" y="152" width="496" height="30" rx="15" fill="url(#mixg)"/>
  <text x="70" y="138" class="ts" font-size="12">chest voice (thick)</text>
  <text x="570" y="138" class="ts" font-size="12" text-anchor="end">head voice (thin)</text>
  <circle cx="180.0" cy="167" r="9" fill="#6F8F6A"/>
  <text x="180.0" y="214" class="t" font-size="13" text-anchor="middle" font-weight="600">strong mix</text>
  <circle cx="320.0" cy="167" r="9" fill="#A67C52"/>
  <text x="320.0" y="214" class="t" font-size="13" text-anchor="middle" font-weight="600">balanced</text>
  <circle cx="460.0" cy="167" r="9" fill="#6B8FBF"/>
  <text x="460.0" y="214" class="t" font-size="13" text-anchor="middle" font-weight="600">light mix</text>
  <text x="26" y="282" class="ts" font-size="11">Mixed voice is a ratio, not a switch: a bit of both and the seam disappears</text>
</svg>
