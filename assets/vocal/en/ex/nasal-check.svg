<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-label="Pinch your nose and check for air leaks">
  <title>Pinch your nose and check for air leaks</title>
  <rect width="640" height="300" fill="#FBF8F4"/>
  <style>
    .t   { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; }
    .tb  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; font-weight: 700; }
    .ts  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #8C8078; }
    .num { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #FFFFFF; font-weight: 700; font-size: 11px; }
    .ink { fill: none; stroke: #3D3229; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; }
    .thin{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; }
    .dash{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; stroke-dasharray: 4 5; }
    .lead{ fill: none; stroke: #8C8078; stroke-width: 1; }
    .acc { fill: none; stroke: #A67C52; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .blue{ fill: none; stroke: #6B8FBF; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .green{ fill: none; stroke: #6F8F6A; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .red { fill: none; stroke: #B0563F; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .dot { fill: #3D3229; }
  </style>
  <text x="26" y="34" class="tb" font-size="16">Pinch your nose and check for air leaks</text>
  <text x="26" y="55" class="ts" font-size="12.5">Singing normally, almost all the air should go through the mouth</text>
  <path d="M140 120 C140 96 152 84 168 84 C182 84 190 96 190 112 C190 128 178 136 168 136" class="ink" fill="#F2E7DC" stroke="#3D3229" stroke-width="1.5"/>
  <circle cx="150" cy="150" r="16" fill="none" stroke="#3D3229" stroke-width="1.3"/>
  <circle cx="186" cy="150" r="16" fill="none" stroke="#3D3229" stroke-width="1.3"/>
  <path d="M120.0 150.0 L134.6 150.0" fill="none" stroke="#B0563F" stroke-width="1.7" stroke-linecap="round"/><path d="M140.0 150.0 L134.5 152.4 L134.5 147.6 Z" fill="#B0563F"/>
  <path d="M216.0 150.0 L201.4 150.0" fill="none" stroke="#B0563F" stroke-width="1.7" stroke-linecap="round"/><path d="M196.0 150.0 L201.5 147.6 L201.5 152.4 Z" fill="#B0563F"/>
  <text x="168" y="200" class="ts" font-size="11.5" text-anchor="middle">pinch your nose and sing</text>
  <rect x="262" y="92" width="170" height="74" rx="6" fill="#E4EBDC" stroke="#6F8F6A" stroke-width="1.2"/>
  <text x="276" y="118" class="t" font-size="12.5" font-weight="600" fill="#6F8F6A">sound unchanged</text>
  <text x="276" y="140" class="ts" font-size="11">resonance in the mouth, normal</text>
  <rect x="262" y="180" width="170" height="74" rx="6" fill="#F4DFD7" stroke="#B0563F" stroke-width="1.2"/>
  <text x="276" y="206" class="t" font-size="12.5" font-weight="600" fill="#B0563F">sound disappears</text>
  <text x="276" y="228" class="ts" font-size="11">too much air in the nose</text>
  <text x="452" y="108" class="ts" font-size="11.5">Nasal is not &quot;into the nose&quot;,</text>
  <text x="452" y="130" class="ts" font-size="11.5">the soft palate is not closed</text>
  <text x="452" y="176" class="ts" font-size="11.5">A 10-second pinch test</text>
  <text x="26" y="282" class="ts" font-size="11">Singing normally, almost all the air should go through the mouth</text>
</svg>
