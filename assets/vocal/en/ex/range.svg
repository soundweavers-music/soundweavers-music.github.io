<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" role="img" aria-label="Measure your range, then choose songs">
  <title>Measure your range, then choose songs</title>
  <rect width="640" height="320" fill="#FBF8F4"/>
  <style>
    .t   { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; }
    .tb  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; font-weight: 700; }
    .ts  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #8C8078; }
    .num { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #FFFFFF; font-weight: 700; font-size: 11px; }
    .ink { fill: none; stroke: #3D3229; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; }
    .thin{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; }
    .dash{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; stroke-dasharray: 4 5; }
    .lead{ fill: none; stroke: #8C8078; stroke-width: 1; }
    .acc { fill: none; stroke: #A67C52; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .blue{ fill: none; stroke: #6B8FBF; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .green{ fill: none; stroke: #6F8F6A; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .red { fill: none; stroke: #B0563F; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .dot { fill: #3D3229; }
  </style>
  <text x="26" y="34" class="tb" font-size="16">Measure your range, then choose songs</text>
  <text x="26" y="55" class="ts" font-size="12.5">Three bands: can speak it, can sing it, can only touch it</text>
  <text x="80" y="115" class="t" font-size="13" text-anchor="end" font-weight="600">speaking</text>
  <rect x="100" y="100" width="440" height="22" rx="11" fill="#FFFFFF" stroke="#D9CFC4" stroke-width="1"/>
  <rect x="100.0" y="100" width="132.0" height="22" rx="11" fill="#6F8F6A" opacity="0.35"/>
  <rect x="100.0" y="100" width="132.0" height="22" rx="11" fill="none" stroke="#6F8F6A" stroke-width="1.2"/>
  <text x="556" y="114" class="ts" font-size="11">most relaxed</text>
  <text x="80" y="177" class="t" font-size="13" text-anchor="end" font-weight="600">comfort</text>
  <rect x="100" y="162" width="440" height="22" rx="11" fill="#FFFFFF" stroke="#D9CFC4" stroke-width="1"/>
  <rect x="166.0" y="162" width="206.79999999999998" height="22" rx="11" fill="#A67C52" opacity="0.35"/>
  <rect x="166.0" y="162" width="206.79999999999998" height="22" rx="11" fill="none" stroke="#A67C52" stroke-width="1.2"/>
  <text x="556" y="176" class="ts" font-size="11">steady singing</text>
  <text x="80" y="239" class="t" font-size="13" text-anchor="end" font-weight="600">limit</text>
  <rect x="100" y="224" width="440" height="22" rx="11" fill="#FFFFFF" stroke="#D9CFC4" stroke-width="1"/>
  <rect x="342.0" y="224" width="189.19999999999996" height="22" rx="11" fill="#B0563F" opacity="0.35"/>
  <rect x="342.0" y="224" width="189.19999999999996" height="22" rx="11" fill="none" stroke="#B0563F" stroke-width="1.2"/>
  <text x="556" y="238" class="ts" font-size="11">touch briefly</text>
  <text x="26" y="302" class="ts" font-size="11">Choose songs by whether your comfort zone is big enough, not by whether you can hit the limit</text>
</svg>
