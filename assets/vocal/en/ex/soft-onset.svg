<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" role="img" aria-label="Three onsets: listen first, then choose">
  <title>Three onsets: listen first, then choose</title>
  <rect width="640" height="340" fill="#FBF8F4"/>
  <style>
    .t   { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; }
    .tb  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; font-weight: 700; }
    .ts  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #8C8078; }
    .num { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #FFFFFF; font-weight: 700; font-size: 11px; }
    .ink { fill: none; stroke: #3D3229; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; }
    .thin{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; }
    .dash{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; stroke-dasharray: 4 5; }
    .lead{ fill: none; stroke: #8C8078; stroke-width: 1; }
    .acc { fill: none; stroke: #A67C52; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .blue{ fill: none; stroke: #6B8FBF; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .green{ fill: none; stroke: #6F8F6A; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .red { fill: none; stroke: #B0563F; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .dot { fill: #3D3229; }
  </style>
  <text x="26" y="34" class="tb" font-size="16">Three onsets: listen first, then choose</text>
  <text x="26" y="55" class="ts" font-size="12.5">The onset decides whether the syllable sounds squeezed, round or hit</text>
  <path d="M90 220 L230 220" class="thin"/>
  <path d="M90 220 L98 124 L220 150" class="blue"/>
  <text x="160" y="246" class="t" font-size="12.5" text-anchor="middle" font-weight="600" fill="#6B8FBF">breathy onset</text>
  <text x="160" y="266" class="ts" font-size="11" text-anchor="middle">closes too late</text>
  <path d="M270 220 L410 220" class="thin"/>
  <path d="M270 220 C280 210 290 160 330 144 L400 144" class="green"/>
  <text x="340" y="246" class="t" font-size="12.5" text-anchor="middle" font-weight="600" fill="#6F8F6A">balanced onset</text>
  <text x="340" y="266" class="ts" font-size="11" text-anchor="middle">air and closure together</text>
  <path d="M450 220 L590 220" class="thin"/>
  <path d="M450 220 L458 124 L580 150" class="red"/>
  <text x="520" y="246" class="t" font-size="12.5" text-anchor="middle" font-weight="600" fill="#B0563F">hard onset</text>
  <text x="520" y="266" class="ts" font-size="11" text-anchor="middle">close first, then push</text>
  <text x="26" y="322" class="ts" font-size="11">All three onsets are legal, but most of the time you want the middle one</text>
</svg>
