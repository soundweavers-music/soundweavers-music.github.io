<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Where the five vowels sit on the spectrum">
  <title>Where the five vowels sit on the spectrum</title>
  <rect width="640" height="400" fill="#FBF8F4"/>
  <style>
    .t   { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; }
    .tb  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; font-weight: 700; }
    .ts  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #8C8078; }
    .num { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #FFFFFF; font-weight: 700; font-size: 11px; }
    .ink { fill: none; stroke: #3D3229; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; }
    .thin{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; }
    .dash{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; stroke-dasharray: 4 5; }
    .lead{ fill: none; stroke: #8C8078; stroke-width: 1; }
    .acc { fill: none; stroke: #A67C52; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .blue{ fill: none; stroke: #6B8FBF; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .green{ fill: none; stroke: #6F8F6A; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .red { fill: none; stroke: #B0563F; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .dot { fill: #3D3229; }
  </style>
  <text x="26" y="34" class="tb" font-size="16">Where the five vowels sit on the spectrum</text>
  <text x="26" y="55" class="ts" font-size="12.5">F1 (mouth opening) and F2 (tongue position) decide which vowel you hear</text>
  <rect x="110" y="90" width="450" height="240" rx="4" fill="#FFFFFF" stroke="#D9CFC4" stroke-width="1.2"/>
  <path d="M92.0 90.0 L92.0 323.7" fill="none" stroke="#3D3229" stroke-width="1.7" stroke-linecap="round"/><path d="M92.0 330.0 L89.1 323.6 L94.9 323.6 Z" fill="#3D3229"/>
  <text x="84" y="82" class="ts" font-size="10.5" text-anchor="end">low F1</text>
  <text x="84" y="334" class="ts" font-size="10.5" text-anchor="end">high F1</text>
  <path d="M110.0 352.0 L553.7 352.0" fill="none" stroke="#3D3229" stroke-width="1.7" stroke-linecap="round"/><path d="M560.0 352.0 L553.6 354.9 L553.6 349.1 Z" fill="#3D3229"/>
  <text x="560" y="372" class="ts" font-size="10.5" text-anchor="end">F2 low → high</text>
  <circle cx="191.0" cy="118.8" r="15" fill="#A67C52" opacity="0.16"/>
  <circle cx="191.0" cy="118.8" r="5" fill="#A67C52"/>
  <text x="211.0" y="123.8" class="t" font-size="15" font-weight="700">i</text>
  <circle cx="245.0" cy="152.4" r="15" fill="#A67C52" opacity="0.16"/>
  <circle cx="245.0" cy="152.4" r="5" fill="#A67C52"/>
  <text x="265.0" y="157.4" class="t" font-size="15" font-weight="700">e</text>
  <circle cx="357.5" cy="306.0" r="15" fill="#A67C52" opacity="0.16"/>
  <circle cx="357.5" cy="306.0" r="5" fill="#A67C52"/>
  <text x="377.5" y="311.0" class="t" font-size="15" font-weight="700">a</text>
  <circle cx="290.0" cy="262.79999999999995" r="15" fill="#A67C52" opacity="0.16"/>
  <circle cx="290.0" cy="262.79999999999995" r="5" fill="#A67C52"/>
  <text x="310.0" y="267.79999999999995" class="t" font-size="15" font-weight="700">o</text>
  <circle cx="236.0" cy="222.0" r="15" fill="#A67C52" opacity="0.16"/>
  <circle cx="236.0" cy="222.0" r="5" fill="#A67C52"/>
  <text x="256.0" y="227.0" class="t" font-size="15" font-weight="700">u</text>
  <text x="26" y="382" class="ts" font-size="11">Swap five vowels in one sentence and the tongue and lips move five times; that is diction</text>
</svg>
