<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" role="img" aria-label="Recognise the false folds clamping">
  <title>Recognise the false folds clamping</title>
  <rect width="640" height="320" fill="#FBF8F4"/>
  <style>
    .t   { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; }
    .tb  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; font-weight: 700; }
    .ts  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #8C8078; }
    .num { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #FFFFFF; font-weight: 700; font-size: 11px; }
    .ink { fill: none; stroke: #3D3229; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; }
    .thin{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; }
    .dash{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; stroke-dasharray: 4 5; }
    .lead{ fill: none; stroke: #8C8078; stroke-width: 1; }
    .acc { fill: none; stroke: #A67C52; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .blue{ fill: none; stroke: #6B8FBF; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .green{ fill: none; stroke: #6F8F6A; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .red { fill: none; stroke: #B0563F; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .dot { fill: #3D3229; }
  </style>
  <text x="26" y="34" class="tb" font-size="16">Recognise the false folds clamping</text>
  <text x="26" y="55" class="ts" font-size="12.5">Two sets of folds; pinch the upper one and the sound dulls</text>
  <rect x="90" y="130" width="180" height="16" rx="8" fill="#6F8F6A" opacity="0.3"/>
  <rect x="90" y="130" width="180" height="16" rx="8" fill="none" stroke="#6F8F6A" stroke-width="1.5"/>
  <rect x="90" y="168" width="180" height="10" rx="5" fill="#B0563F" opacity="0.22"/>
  <rect x="90" y="168" width="180" height="10" rx="5" fill="none" stroke="#B0563F" stroke-width="1.4"/>
  <text x="282" y="140" class="ts" font-size="11.5" fill="#6F8F6A">Vocal folds (true)</text>
  <text x="282" y="176" class="ts" font-size="11.5" fill="#B0563F">False folds (ventricular)</text>
  <path d="M90.0 210.0 L90.0 195.4" fill="none" stroke="#B0563F" stroke-width="1.7" stroke-linecap="round"/><path d="M90.0 190.0 L92.4 195.5 L87.6 195.5 Z" fill="#B0563F"/>
  <text x="100" y="214" class="ts" font-size="11" fill="#B0563F">Pinched, the sound is dull</text>
  <rect x="370" y="96" width="240" height="78" rx="6" fill="#E4EBDC" stroke="#6F8F6A" stroke-width="1.2"/>
  <text x="384" y="122" class="t" font-size="12.5" font-weight="600" fill="#6F8F6A">Relaxed: only the folds vibrate</text>
  <text x="384" y="144" class="ts" font-size="11">Clean, effortless sound</text>
  <rect x="370" y="188" width="240" height="78" rx="6" fill="#F4DFD7" stroke="#B0563F" stroke-width="1.2"/>
  <text x="384" y="214" class="t" font-size="12.5" font-weight="600" fill="#B0563F">Pinched: the false folds push in</text>
  <text x="384" y="236" class="ts" font-size="11">Dull sound, throat feels it</text>
  <text x="26" y="302" class="ts" font-size="11">False folds don&#x27;t &quot;help&quot; you sing high; pinch them and the vocal folds freeze</text>
</svg>
