  <text x="410" y="112" class="ts" font-size="12">Standing tall, ear, shoulder,</text>
  <text x="410" y="134" class="ts" font-size="12">pelvis and ankle on one line</text>
  <text x="410" y="188" class="ts" font-size="12">One shoulder high, hips tilted:</text>
  <text x="410" y="210" class="ts" font-size="12">air only fills one side</text>
  <text x="410" y="264" class="ts" font-size="12">Not chest out: it flips the ribs up</text>
  <text x="410" y="286" class="ts" font-size="12">and hollows the lower back</text>
  <text x="26" y="462" class="ts" font-size="11">Posture has one job: keep the airway straight</text>
