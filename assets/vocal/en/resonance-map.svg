<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-label="Vocal tract in section: three cavities and the source">
  <title>Vocal tract in section: three cavities and the source</title>
  <rect width="640" height="420" fill="#FBF8F4"/>
  <style>
    .t   { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; }
    .tb  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; font-weight: 700; }
    .ts  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #8C8078; }
    .num { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #FFFFFF; font-weight: 700; font-size: 11px; }
    .ink { fill: none; stroke: #3D3229; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; }
    .thin{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; }
    .dash{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; stroke-dasharray: 4 5; }
    .lead{ fill: none; stroke: #8C8078; stroke-width: 1; }
    .acc { fill: none; stroke: #A67C52; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .blue{ fill: none; stroke: #6B8FBF; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .green{ fill: none; stroke: #6F8F6A; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .red { fill: none; stroke: #B0563F; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .dot { fill: #3D3229; }
  </style>
  <text x="26" y="34" class="tb" font-size="16">Vocal tract in section: three cavities and the source</text>
  <text x="26" y="55" class="ts" font-size="12.5">Sound starts at the folds and passes three spaces it can reshape</text>
  <path d="M150 340 C150 280 150 240 150 200 C150 160 170 140 200 128 C230 116 260 100 268 76" class="ink"/>
  <path d="M190 340 C190 286 190 250 190 210 C190 176 206 158 232 146 C258 134 286 118 294 96" class="ink"/>
  <rect x="236" y="88" width="96" height="32" rx="8" fill="#DEE8F3" stroke="#6B8FBF" stroke-width="1.2"/>
  <text x="284" y="110" class="t" font-size="11.5" text-anchor="middle" font-weight="600">nasal cavity</text>
  <rect x="196" y="150" width="100" height="40" rx="8" fill="#F3E9DC" stroke="#A67C52" stroke-width="1.2"/>
  <text x="246" y="176" class="t" font-size="11.5" text-anchor="middle" font-weight="600">mouth</text>
  <rect x="160" y="210" width="70" height="60" rx="8" fill="#E4EBDC" stroke="#6F8F6A" stroke-width="1.2"/>
  <text x="195" y="246" class="t" font-size="11.5" text-anchor="middle" font-weight="600">pharynx</text>
  <rect x="160" y="288" width="46" height="14" rx="7" fill="#A67C52"/>
  <text x="214" y="300" class="ts" font-size="11" fill="#A67C52">vocal folds</text>
  <text x="74" y="214" class="ts" font-size="11" text-anchor="end">airflow</text>
  <path d="M80.0 240.0 L134.6 240.0" fill="none" stroke="#6B8FBF" stroke-width="1.7" stroke-linecap="round"/><path d="M140.0 240.0 L134.5 242.4 L134.5 237.6 Z" fill="#6B8FBF"/>
  <text x="360" y="110" class="ts" font-size="11.5">Nasal: nasality and brightness</text>
  <text x="360" y="160" class="ts" font-size="11.5">Mouth: vowels and diction</text>
  <text x="360" y="230" class="ts" font-size="11.5">Pharynx: low end and body</text>
  <text x="360" y="286" class="ts" font-size="11.5" fill="#A67C52">Folds: the source, not a cavity</text>
  <text x="26" y="402" class="ts" font-size="11">Resonance is a result of shape: change a cavity and the boosted frequencies move</text>
</svg>
