<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" role="img" aria-label="Fold thickness and pitch">
  <title>Fold thickness and pitch</title>
  <rect width="640" height="340" fill="#FBF8F4"/>
  <style>
    .t   { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; }
    .tb  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; font-weight: 700; }
    .ts  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #8C8078; }
    .num { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #FFFFFF; font-weight: 700; font-size: 11px; }
    .ink { fill: none; stroke: #3D3229; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; }
    .thin{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; }
    .dash{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; stroke-dasharray: 4 5; }
    .lead{ fill: none; stroke: #8C8078; stroke-width: 1; }
    .acc { fill: none; stroke: #A67C52; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .blue{ fill: none; stroke: #6B8FBF; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .green{ fill: none; stroke: #6F8F6A; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .red { fill: none; stroke: #B0563F; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .dot { fill: #3D3229; }
  </style>
  <text x="26" y="34" class="tb" font-size="16">Fold thickness and pitch</text>
  <text x="26" y="55" class="ts" font-size="12.5">Stretch the same folds and they get thinner and higher</text>
  <rect x="90" y="120" width="120" height="60" rx="30" fill="#6F8F6A" opacity="0.2"/>
  <rect x="90" y="120" width="120" height="60" rx="30" fill="none" stroke="#6F8F6A" stroke-width="1.5"/>
  <text x="150" y="220" class="t" font-size="13" text-anchor="middle" font-weight="600" fill="#6F8F6A">thick, short</text>
  <text x="150" y="240" class="ts" font-size="11" text-anchor="middle">slower vibration → lower pitch</text>
  <rect x="330" y="132" width="190" height="32" rx="16" fill="#6B8FBF" opacity="0.2"/>
  <rect x="330" y="132" width="190" height="32" rx="16" fill="none" stroke="#6B8FBF" stroke-width="1.5"/>
  <text x="425" y="220" class="t" font-size="13" text-anchor="middle" font-weight="600" fill="#6B8FBF">thin, long</text>
  <text x="425" y="240" class="ts" font-size="11" text-anchor="middle">faster vibration → higher pitch</text>
  <path d="M240.0 150.0 L309.7 150.0" fill="none" stroke="#3D3229" stroke-width="1.7" stroke-linecap="round"/><path d="M316.0 150.0 L309.6 152.9 L309.6 147.1 Z" fill="#3D3229"/>
  <text x="278" y="136" class="ts" font-size="11" text-anchor="middle">stretched</text>
  <text x="90" y="296" class="ts" font-size="12">Pitch is changed by shape (length and thickness), not by how hard you blow</text>
</svg>
