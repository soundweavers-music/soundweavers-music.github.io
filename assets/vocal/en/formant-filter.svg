<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" role="img" aria-label="Source–filter: how harmonics become vowels">
  <title>Source–filter: how harmonics become vowels</title>
  <rect width="640" height="340" fill="#FBF8F4"/>
  <style>
    .t   { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; }
    .tb  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; font-weight: 700; }
    .ts  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #8C8078; }
    .num { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #FFFFFF; font-weight: 700; font-size: 11px; }
    .ink { fill: none; stroke: #3D3229; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; }
    .thin{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; }
    .dash{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; stroke-dasharray: 4 5; }
    .lead{ fill: none; stroke: #8C8078; stroke-width: 1; }
    .acc { fill: none; stroke: #A67C52; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .blue{ fill: none; stroke: #6B8FBF; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .green{ fill: none; stroke: #6F8F6A; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .red { fill: none; stroke: #B0563F; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .dot { fill: #3D3229; }
  </style>
  <text x="26" y="34" class="tb" font-size="16">Source–filter: how harmonics become vowels</text>
  <text x="26" y="55" class="ts" font-size="12.5">The folds supply the raw sound; the vocal tract shapes it</text>
  <text x="60" y="90" class="ts" font-size="12">Source: a row of harmonics</text>
  <rect x="60" y="150" width="8" height="70" rx="2" fill="#A67C52" opacity="0.55"/>
  <rect x="86" y="154" width="8" height="66" rx="2" fill="#A67C52" opacity="0.55"/>
  <rect x="112" y="158" width="8" height="62" rx="2" fill="#A67C52" opacity="0.55"/>
  <rect x="138" y="162" width="8" height="58" rx="2" fill="#A67C52" opacity="0.55"/>
  <rect x="164" y="166" width="8" height="54" rx="2" fill="#A67C52" opacity="0.55"/>
  <rect x="190" y="170" width="8" height="50" rx="2" fill="#A67C52" opacity="0.55"/>
  <rect x="216" y="174" width="8" height="46" rx="2" fill="#A67C52" opacity="0.55"/>
  <rect x="242" y="178" width="8" height="42" rx="2" fill="#A67C52" opacity="0.55"/>
  <rect x="268" y="182" width="8" height="38" rx="2" fill="#A67C52" opacity="0.55"/>
  <rect x="294" y="186" width="8" height="34" rx="2" fill="#A67C52" opacity="0.55"/>
  <text x="60" y="250" class="ts" font-size="10.5">frequency →</text>
  <text x="340" y="90" class="ts" font-size="12">Vocal tract: the filter</text>
  <path d="M340 210 C370 210 380 130 420 130 C460 130 470 190 520 190" class="blue"/>
  <text x="340" y="250" class="ts" font-size="11" fill="#6B8FBF">formants boost some frequencies</text>
  <text x="340" y="296" class="ts" font-size="11.5">Output spectrum</text>
  <text x="60" y="300" class="ts" font-size="12">Same folds, different tract: a different vowel</text>
</svg>
