<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" role="img" aria-label="Takes stacked into a song">
  <title>Takes stacked into a song</title>
  <rect width="640" height="340" fill="#FBF8F4"/>
  <style>
    .t   { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; }
    .tb  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; font-weight: 700; }
    .ts  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #8C8078; }
    .num { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #FFFFFF; font-weight: 700; font-size: 11px; }
    .ink { fill: none; stroke: #3D3229; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; }
    .thin{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; }
    .dash{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; stroke-dasharray: 4 5; }
    .lead{ fill: none; stroke: #8C8078; stroke-width: 1; }
    .acc { fill: none; stroke: #A67C52; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .blue{ fill: none; stroke: #6B8FBF; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .green{ fill: none; stroke: #6F8F6A; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .red { fill: none; stroke: #B0563F; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .dot { fill: #3D3229; }
  </style>
  <text x="26" y="34" class="tb" font-size="16">Takes stacked into a song</text>
  <text x="26" y="55" class="ts" font-size="12.5">Lead, double, harmony, ad-lib: one track each</text>
  <text x="116" y="114" class="t" font-size="11.5" text-anchor="end" font-weight="600" fill="#A67C52">lead</text>
  <rect x="130" y="100" width="450" height="26" rx="4" fill="#FFFFFF" stroke="#D9CFC4" stroke-width="0.8"/>
  <rect x="152.5" y="103" width="382.5" height="20" rx="3" fill="#A67C52" opacity="0.3"/>
  <text x="116" y="158" class="t" font-size="11.5" text-anchor="end" font-weight="600" fill="#C4956A">Double</text>
  <rect x="130" y="144" width="450" height="26" rx="4" fill="#FFFFFF" stroke="#D9CFC4" stroke-width="0.8"/>
  <rect x="152.5" y="147" width="382.5" height="20" rx="3" fill="#C4956A" opacity="0.3"/>
  <text x="116" y="202" class="t" font-size="11.5" text-anchor="end" font-weight="600" fill="#6B8FBF">high harmony</text>
  <rect x="130" y="188" width="450" height="26" rx="4" fill="#FFFFFF" stroke="#D9CFC4" stroke-width="0.8"/>
  <rect x="220.0" y="191" width="157.50000000000003" height="20" rx="3" fill="#6B8FBF" opacity="0.3"/>
  <rect x="409.0" y="191" width="126.00000000000001" height="20" rx="3" fill="#6B8FBF" opacity="0.3"/>
  <text x="116" y="246" class="t" font-size="11.5" text-anchor="end" font-weight="600" fill="#6F8F6A">low harmony</text>
  <rect x="130" y="232" width="450" height="26" rx="4" fill="#FFFFFF" stroke="#D9CFC4" stroke-width="0.8"/>
  <rect x="220.0" y="235" width="157.50000000000003" height="20" rx="3" fill="#6F8F6A" opacity="0.3"/>
  <rect x="409.0" y="235" width="126.00000000000001" height="20" rx="3" fill="#6F8F6A" opacity="0.3"/>
  <text x="116" y="290" class="t" font-size="11.5" text-anchor="end" font-weight="600" fill="#B0563F">Ad-lib</text>
  <rect x="130" y="276" width="450" height="26" rx="4" fill="#FFFFFF" stroke="#D9CFC4" stroke-width="0.8"/>
  <rect x="319.0" y="279" width="36.00000000000001" height="20" rx="3" fill="#B0563F" opacity="0.3"/>
  <rect x="517.0" y="279" width="40.499999999999986" height="20" rx="3" fill="#B0563F" opacity="0.3"/>
  <text x="26" y="322" class="ts" font-size="11">Tracking is for retakes: every layer stands alone until the final stack</text>
</svg>
