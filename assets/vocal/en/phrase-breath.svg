<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" role="img" aria-label="Phrases and where to breathe">
  <title>Phrases and where to breathe</title>
  <rect width="640" height="320" fill="#FBF8F4"/>
  <style>
    .t   { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; }
    .tb  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; font-weight: 700; }
    .ts  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #8C8078; }
    .num { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #FFFFFF; font-weight: 700; font-size: 11px; }
    .ink { fill: none; stroke: #3D3229; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; }
    .thin{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; }
    .dash{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; stroke-dasharray: 4 5; }
    .lead{ fill: none; stroke: #8C8078; stroke-width: 1; }
    .acc { fill: none; stroke: #A67C52; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .blue{ fill: none; stroke: #6B8FBF; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .green{ fill: none; stroke: #6F8F6A; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .red { fill: none; stroke: #B0563F; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .dot { fill: #3D3229; }
  </style>
  <text x="26" y="34" class="tb" font-size="16">Phrases and where to breathe</text>
  <text x="26" y="55" class="ts" font-size="12.5">Draw the phrases first, then choose the breaths</text>
  <path d="M90 170 L560 170" class="thin"/>
  <rect x="113.5" y="160" width="108.10000000000002" height="20" rx="10" fill="#A67C52" opacity="0.22"/>
  <rect x="113.5" y="160" width="108.10000000000002" height="20" rx="10" fill="none" stroke="#A67C52" stroke-width="1.2"/>
  <rect x="249.8" y="160" width="112.79999999999995" height="20" rx="10" fill="#A67C52" opacity="0.22"/>
  <rect x="249.8" y="160" width="112.79999999999995" height="20" rx="10" fill="none" stroke="#A67C52" stroke-width="1.2"/>
  <rect x="390.8" y="160" width="131.60000000000008" height="20" rx="10" fill="#A67C52" opacity="0.22"/>
  <rect x="390.8" y="160" width="131.60000000000008" height="20" rx="10" fill="none" stroke="#A67C52" stroke-width="1.2"/>
  <path d="M227.60000000000002 150 L235.70000000000002 136 L243.8 150" class="ink" stroke="#6B8FBF" stroke-width="1.5"/>
  <path d="M368.59999999999997 150 L376.7 136 L384.8 150" class="ink" stroke="#6B8FBF" stroke-width="1.5"/>
  <text x="90" y="110" class="ts" font-size="12">Three phrases, two breaths: the breaths are designed, not left to running out</text>
  <text x="26" y="302" class="ts" font-size="11">A breath belongs in the gap between phrases, not inside a word</text>
</svg>
