<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-label="自己的聲音能力分佈">
  <title>自己的聲音能力分佈</title>
  <rect width="640" height="380" fill="#FBF8F4"/>
  <style>
    .t   { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; }
    .tb  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; font-weight: 700; }
    .ts  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #8C8078; }
    .num { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #FFFFFF; font-weight: 700; font-size: 11px; }
    .ink { fill: none; stroke: #3D3229; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; }
    .thin{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; }
    .dash{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; stroke-dasharray: 4 5; }
    .lead{ fill: none; stroke: #8C8078; stroke-width: 1; }
    .acc { fill: none; stroke: #A67C52; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .blue{ fill: none; stroke: #6B8FBF; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .green{ fill: none; stroke: #6F8F6A; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .red { fill: none; stroke: #B0563F; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .dot { fill: #3D3229; }
  </style>
  <text x="26" y="34" class="tb" font-size="16">自己的聲音能力分佈</text>
  <text x="26" y="55" class="ts" font-size="12.5">把抽象的「我唱得怎樣」拆成六個可練的項目</text>
  <path d="M300 200 L300.0 90.0" class="thin" stroke-dasharray="3 4"/>
  <path d="M300 200 L395.3 145.0" class="thin" stroke-dasharray="3 4"/>
  <path d="M300 200 L395.3 255.0" class="thin" stroke-dasharray="3 4"/>
  <path d="M300 200 L300.0 310.0" class="thin" stroke-dasharray="3 4"/>
  <path d="M300 200 L204.7 255.0" class="thin" stroke-dasharray="3 4"/>
  <path d="M300 200 L204.7 145.0" class="thin" stroke-dasharray="3 4"/>
  <polygon points="300.0,112.0 352.4,169.8 366.7,238.5 300.0,249.5 242.8,233.0 252.4,172.5" fill="#A67C52" fill-opacity=".22" stroke="#A67C52" stroke-width="2"/>
  <text x="300.0" y="68.0" class="ts" font-size="11.5" text-anchor="middle">音準</text>
  <text x="417.7794549146837" y="136.0" class="ts" font-size="11.5" text-anchor="middle">音域</text>
  <text x="417.7794549146837" y="272.0" class="ts" font-size="11.5" text-anchor="middle">音色</text>
  <text x="300.0" y="340.0" class="ts" font-size="11.5" text-anchor="middle">節奏</text>
  <text x="182.22054508531633" y="272.0" class="ts" font-size="11.5" text-anchor="middle">咬字</text>
  <text x="182.22054508531636" y="136.0" class="ts" font-size="11.5" text-anchor="middle">體力</text>
  <text x="26" y="362" class="ts" font-size="11">六個軸量的是「你現在的樣子」，不是別人給你的分數；形狀會隨練習改變。</text>
</svg>
