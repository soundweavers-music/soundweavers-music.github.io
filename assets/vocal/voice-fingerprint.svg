  <path class="ink" d="M169.5 175.0 L430.5 325.0"/>
  <path class="ink" d="M169.5 325.0 L430.5 175.0"/>
  <text class="lbl" x="300.0" y="71.0" text-anchor="middle">音域</text>
  <text class="lbl" x="459.34867429633675" y="163.0" text-anchor="middle">氣息</text>
  <text class="lbl" x="459.34867429633675" y="347.0" text-anchor="middle">共鳴</text>
  <text class="lbl" x="300.0" y="439.0" text-anchor="middle">咬字</text>
  <text class="lbl" x="140.65132570366328" y="347.0" text-anchor="middle">律動</text>
  <text class="lbl" x="140.6513257036633" y="163.0" text-anchor="middle">情感</text>
  <path class="fill" d="M300.0,133.0 L380.5,203.5 L416.9,317.5 L300.0,332.5 L209.1,302.5 L189.6,186.2 Z"/>
  <text class="lbl-s" x="40" y="450">長處留著、短處補到及格就好；全部拉滿就變成別人，不是你的聲音</text>
