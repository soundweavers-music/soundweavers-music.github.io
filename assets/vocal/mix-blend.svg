<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="混聲比例尺：從胸聲到頭聲">
  <title>混聲比例尺：從胸聲到頭聲</title>
  <rect width="640" height="360" fill="#FBF8F4"/>
  <style>
    .t   { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; }
    .tb  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; font-weight: 700; }
    .ts  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #8C8078; }
    .num { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #FFFFFF; font-weight: 700; font-size: 11px; }
    .ink { fill: none; stroke: #3D3229; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; }
    .thin{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; }
    .dash{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; stroke-dasharray: 4 5; }
    .lead{ fill: none; stroke: #8C8078; stroke-width: 1; }
    .acc { fill: none; stroke: #A67C52; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .blue{ fill: none; stroke: #6B8FBF; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .green{ fill: none; stroke: #6F8F6A; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .red { fill: none; stroke: #B0563F; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .dot { fill: #3D3229; }
  </style>
  <text x="26" y="34" class="tb" font-size="16">混聲比例尺：從胸聲到頭聲</text>
  <text x="26" y="55" class="ts" font-size="12.5">接縫不是一條線，是一段要練的區間</text>
  <defs><linearGradient id="mbg" x1="0" x2="1"><stop offset="0" stop-color="#6F8F6A" stop-opacity=".5"/><stop offset="1" stop-color="#6B8FBF" stop-opacity=".5"/></linearGradient></defs>
  <rect x="80" y="150" width="480" height="32" rx="16" fill="url(#mbg)"/>
  <rect x="80" y="150" width="480" height="32" rx="16" fill="none" stroke="#D9CFC4" stroke-width="1"/>
  <text x="80" y="136" class="ts" font-size="11.5" fill="#6F8F6A">胸聲（TA 多）</text>
  <text x="560" y="136" class="ts" font-size="11.5" text-anchor="end" fill="#6B8FBF">頭聲（CT 多）</text>
  <path d="M330 144 L330 188" fill="none" stroke="#B0563F" stroke-width="1.4" stroke-dasharray="4 3"/>
  <text x="330" y="208" class="ts" font-size="10.5" text-anchor="middle" fill="#B0563F">接縫</text>
  <text x="80" y="250" class="ts" font-size="12">混聲要練的是把這道接縫抹平：</text>
  <text x="80" y="272" class="ts" font-size="12">在接縫附近，兩邊各留一點，不要讓任何一邊掉到零。</text>
  <text x="26" y="342" class="ts" font-size="11">「混聲」不是第三種聲音，是兩種聲音重疊的比例。</text>
</svg>
