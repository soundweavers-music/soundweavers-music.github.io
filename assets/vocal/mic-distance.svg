<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" role="img" aria-label="麥克風距離與音色">
  <title>麥克風距離與音色</title>
  <rect width="640" height="340" fill="#FBF8F4"/>
  <style>
    .t   { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; }
    .tb  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; font-weight: 700; }
    .ts  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #8C8078; }
    .num { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #FFFFFF; font-weight: 700; font-size: 11px; }
    .ink { fill: none; stroke: #3D3229; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; }
    .thin{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; }
    .dash{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; stroke-dasharray: 4 5; }
    .lead{ fill: none; stroke: #8C8078; stroke-width: 1; }
    .acc { fill: none; stroke: #A67C52; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .blue{ fill: none; stroke: #6B8FBF; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .green{ fill: none; stroke: #6F8F6A; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .red { fill: none; stroke: #B0563F; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .dot { fill: #3D3229; }
  </style>
  <text x="26" y="34" class="tb" font-size="16">麥克風距離與音色</text>
  <text x="26" y="55" class="ts" font-size="12.5">越近低頻越多（近接效應），越遠空間越多</text>
  <circle cx="90" cy="150" r="26" fill="#A67C52" stroke="#A67C52" stroke-width="1.4" opacity="0.3"/>
  <text x="90" y="196" class="ts" font-size="11.5" text-anchor="middle">麥克風</text>
  <path d="M116 110 L230 100" class="thin"/>
  <rect x="230" y="88" width="74" height="26" rx="6" fill="#FFFFFF" stroke="#D9CFC4" stroke-width="1"/>
  <text x="238" y="106" class="ts" font-size="10.5">3 公分</text>
  <text x="238" y="130" class="ts" font-size="10.5">低頻變厚、噴麥</text>
  <path d="M116 110 L320 150" class="thin"/>
  <rect x="320" y="138" width="74" height="26" rx="6" fill="#FFFFFF" stroke="#D9CFC4" stroke-width="1"/>
  <text x="328" y="156" class="ts" font-size="10.5">15 公分</text>
  <text x="328" y="180" class="ts" font-size="10.5">最平衡</text>
  <path d="M116 110 L420 200" class="thin"/>
  <rect x="420" y="188" width="74" height="26" rx="6" fill="#FFFFFF" stroke="#D9CFC4" stroke-width="1"/>
  <text x="428" y="206" class="ts" font-size="10.5">50 公分</text>
  <text x="428" y="230" class="ts" font-size="10.5">空間感多、細節少</text>
  <text x="26" y="322" class="ts" font-size="11">距離決定的是「低頻比例」與「空間感」，不是音量——音量可以用增益補。</text>
</svg>
