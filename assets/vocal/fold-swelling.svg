<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 520" role="img" aria-label="正常聲帶與水腫聲帶的比較">
  <title>正常聲帶與水腫聲帶的比較</title>
  <rect width="780" height="520" fill="#fbf8f2"/>
  <style>
    .out   { fill: none; stroke: #2a2724; stroke-width: 1.8; stroke-linejoin: round; stroke-linecap: round; }
    .lead  { fill: none; stroke: #2a2724; stroke-width: .9; }
    .dot   { fill: #2a2724; }
    .skin  { fill: #f1e0d6; stroke: #2a2724; stroke-width: 1.8; }
    .muc   { fill: #e2a99b; stroke: #cb8f82; stroke-width: 1.2; }
    .muc2  { fill: #cb8f82; stroke: #2a2724; stroke-width: 1.4; }
    .cart  { fill: #d5d5c2; stroke: #2a2724; stroke-width: 1.5; }
    .bone  { fill: #ece6d8; stroke: #2a2724; stroke-width: 1.4; }
    .air   { fill: #d5e5e7; stroke: #2a2724; stroke-width: 1.3; }
    .fold  { fill: #f6f3ea; stroke: #c9c1ac; stroke-width: 1.6; }
    .musc  { fill: #cf8f88; stroke: #2a2724; stroke-width: 1.1; }
    .hl    { fill: #b5734a; fill-opacity: .22; stroke: #b5734a; stroke-width: 1.7; }
    .hl2   { fill: #7d9b76; fill-opacity: .22; stroke: #7d9b76; stroke-width: 1.7; }
    .ink   { fill: none; stroke: #2a2724; stroke-width: 1.8; stroke-linejoin: round; stroke-linecap: round; }
    .ave   { fill: none; stroke: #b5734a; stroke-width: 2.2; stroke-linejoin: round; stroke-linecap: round; }
    .ave2  { fill: none; stroke: #7d9b76; stroke-width: 2.2; stroke-linejoin: round; stroke-linecap: round; }
    .thin  { fill: none; stroke: #d8d0c2; stroke-width: 1.3; stroke-dasharray: 5 5; }
    .lbl   { font-family: 'Noto Sans TC','PingFang TC',system-ui,sans-serif; font-size: 14px; fill: #2a2724; }
    .lbl-s { font-family: 'Noto Sans TC','PingFang TC',system-ui,sans-serif; font-size: 12px; fill: #6f6a60; }
    .lbl-b { font-family: 'Noto Sans TC','PingFang TC',system-ui,sans-serif; font-size: 14px; fill: #2a2724; font-weight: 700; }
  </style>
<text class="lbl-b" x="24" y="30">沙啞常常不是唱壞，是聲帶腫了、關不緊</text>
  <g transform="translate(60,60)"><ellipse class="muc" cx="180" cy="176" rx="110" ry="136"/>
  <ellipse class="muc2" cx="146" cy="288" rx="17" ry="14"/>
  <ellipse class="muc2" cx="214" cy="288" rx="17" ry="14"/>
  <path class="fold" d="M180 56 C162.0 112 166.0 198 176.0 264 C150.0 278 122.0 272 118.0 246 C112.0 164 146.0 90 180 56 Z"/>
  <path class="fold" d="M180 56 C198.0 112 194.0 198 184.0 264 C210.0 278 238.0 272 242.0 246 C248.0 164 214.0 90 180 56 Z"/>
  <path d="M180 60 L176.0 262 L184.0 262 Z" fill="#d5e5e7" stroke="#2a2724" stroke-width="1.2"/></g>
  <g transform="translate(430,60)"><ellipse class="muc" cx="180" cy="176" rx="110" ry="136"/>
  <ellipse class="muc2" cx="146" cy="288" rx="17" ry="14"/>
  <ellipse class="muc2" cx="214" cy="288" rx="17" ry="14"/>
  <path class="fold" d="M180 56 C146.4 112 150.4 198 160.4 264 C134.4 278 106.4 272 93.60000000000001 246 C87.60000000000001 164 130.4 90 180 56 Z"/>
  <path class="fold" d="M180 56 C213.6 112 209.6 198 199.6 264 C225.6 278 253.6 272 266.4 246 C272.4 164 229.6 90 180 56 Z"/>
  <path d="M180 60 L160.4 262 L199.6 262 Z" fill="#d5e5e7" stroke="#2a2724" stroke-width="1.2"/></g>
  <text class="lbl-b" x="240" y="92" text-anchor="middle">正常</text>
  <text class="lbl-b" x="610" y="92" text-anchor="middle">水腫</text>
  <path class="lead" d="M600 300 L690 300"/><circle class="dot" cx="600" cy="300" r="2.6"/><text class="lbl" x="696" y="304">邊緣變圓</text>
  <text class="lbl-s" x="240" y="420" text-anchor="middle">邊緣清楚、有稜角，能靠攏</text>
  <text class="lbl-s" x="610" y="420" text-anchor="middle">變厚變圓，中間合不起來</text>
  <text class="lbl-s" x="24" y="468">水腫時硬唱，大腦會叫假聲帶代班補縫隙——那才是真正傷聲帶的一步</text>
  <text class="lbl-s" x="24" y="492">處理方式只有休息、補水、少說話；隔天再唱，不要當天硬練</text>
</svg>
