<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 380" role="img" aria-label="舞台監聽喇叭與主喇叭">
  <title>舞台監聽喇叭與主喇叭</title>
  <rect width="620" height="380" fill="#fbf8f2"/>
  <style>
    .ink { fill: none; stroke: #2b2a26; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
    .thin { fill: none; stroke: #8a8578; stroke-width: 1.4; stroke-dasharray: 5 5; }
    .grid { fill: none; stroke: #d8d0c2; stroke-width: 1.2; }
    .fill { fill: #b5734a; opacity: .18; stroke: #b5734a; stroke-width: 1.8; }
    .fill2 { fill: #7d9b76; opacity: .18; stroke: #7d9b76; stroke-width: 1.8; }
    .solid { fill: #b5734a; opacity: .85; }
    .solid2 { fill: #7d9b76; opacity: .85; }
    .lbl { font-family: 'Noto Serif TC', 'Songti TC', 'PingFang TC', serif; font-size: 15px; fill: #2b2a26; }
    .lbl-s { font-family: 'Noto Serif TC', 'Songti TC', 'PingFang TC', serif; font-size: 12.5px; fill: #8a8578; }
    .lbl-b { font-family: 'Noto Serif TC', 'Songti TC', 'PingFang TC', serif; font-size: 15px; fill: #2b2a26; font-weight: 700; }
  </style>
<text class="lbl-b" x="40" y="40">台上聽不到自己，通常是路徑問題，不是音量問題</text>
  <path class="ink" d="M50 300 L580 300"/>
  <path class="ink" d="M50 300 L50 318"/>
  <text class="lbl-s" x="500" y="316">舞台地板</text>
  <circle class="fill2" cx="250" cy="210" r="26"/>
  <text class="lbl" x="250" y="216" text-anchor="middle">你</text>
  <path class="ink" d="M250 236 L250 300"/>
  <path class="fill" d="M170 292 L206 292 L200 258 L176 258 Z"/>
  <path class="ink" d="M190 262 L226 232"/><path class="ink" d="M226 232 L221.2 241.9 L215.4 235.0 Z" fill="#2b2a26"/>
  <text class="lbl-s" x="96" y="244">地板監聽</text>
  <text class="lbl-s" x="96" y="262">指向你的臉</text>
  <rect class="fill" x="500" y="96" width="30" height="54" rx="6"/>
  <text class="lbl-s" x="486" y="88" text-anchor="middle">主喇叭</text>
  <path class="thin" d="M500 150 C440 190 360 190 296 200"/>
  <text class="lbl-s" x="360" y="178">延遲、殘響一起進來</text>
  <path class="ink" d="M196 256 L232 226"/><path class="ink" d="M232 226 L227.2 235.9 L221.4 229.0 Z" fill="#2b2a26"/>
  <text class="lbl-s" x="402" y="250">聽得到自己的聲音</text>
  <text class="lbl-s" x="40" y="356">要求監聽送回「你的聲音＋拍點」，不要整團都塞進去；聽得到的東西愈少，音準愈穩</text>
</svg>
