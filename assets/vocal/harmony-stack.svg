<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" role="img" aria-label="主唱與和聲的堆疊">
  <title>主唱與和聲的堆疊</title>
  <rect width="640" height="320" fill="#FBF8F4"/>
  <style>
    .t   { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; }
    .tb  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; font-weight: 700; }
    .ts  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #8C8078; }
    .num { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #FFFFFF; font-weight: 700; font-size: 11px; }
    .ink { fill: none; stroke: #3D3229; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; }
    .thin{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; }
    .dash{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; stroke-dasharray: 4 5; }
    .lead{ fill: none; stroke: #8C8078; stroke-width: 1; }
    .acc { fill: none; stroke: #A67C52; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .blue{ fill: none; stroke: #6B8FBF; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .green{ fill: none; stroke: #6F8F6A; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .red { fill: none; stroke: #B0563F; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .dot { fill: #3D3229; }
  </style>
  <text x="26" y="34" class="tb" font-size="16">主唱與和聲的堆疊</text>
  <text x="26" y="55" class="ts" font-size="12.5">每一條都要能單獨聽，合起來才不糊</text>
  <text x="90" y="106" class="t" font-size="11.5" font-weight="600" fill="#6B8FBF">高和聲（+3 度）</text>
  <rect x="90" y="114" width="460" height="28" rx="6" fill="#6B8FBF" opacity="0.12"/>
  <rect x="90" y="114" width="460" height="28" rx="6" fill="none" stroke="#6B8FBF" stroke-width="1.2"/>
  <circle cx="119.0" cy="128" r="5" fill="#6B8FBF" opacity="0.85"/>
  <circle cx="173.0" cy="128" r="5" fill="#6B8FBF" opacity="0.85"/>
  <circle cx="227.0" cy="128" r="5" fill="#6B8FBF" opacity="0.85"/>
  <circle cx="281.0" cy="128" r="5" fill="#6B8FBF" opacity="0.85"/>
  <circle cx="335.0" cy="128" r="5" fill="#6B8FBF" opacity="0.85"/>
  <circle cx="389.0" cy="128" r="5" fill="#6B8FBF" opacity="0.85"/>
  <circle cx="443.0" cy="128" r="5" fill="#6B8FBF" opacity="0.85"/>
  <circle cx="497.0" cy="128" r="5" fill="#6B8FBF" opacity="0.85"/>
  <text x="90" y="168" class="t" font-size="11.5" font-weight="600" fill="#A67C52">主唱</text>
  <rect x="90" y="176" width="460" height="28" rx="6" fill="#A67C52" opacity="0.12"/>
  <rect x="90" y="176" width="460" height="28" rx="6" fill="none" stroke="#A67C52" stroke-width="1.2"/>
  <circle cx="130.0" cy="190" r="5" fill="#A67C52" opacity="0.85"/>
  <circle cx="184.0" cy="190" r="5" fill="#A67C52" opacity="0.85"/>
  <circle cx="238.0" cy="190" r="5" fill="#A67C52" opacity="0.85"/>
  <circle cx="292.0" cy="190" r="5" fill="#A67C52" opacity="0.85"/>
  <circle cx="346.0" cy="190" r="5" fill="#A67C52" opacity="0.85"/>
  <circle cx="400.0" cy="190" r="5" fill="#A67C52" opacity="0.85"/>
  <circle cx="454.0" cy="190" r="5" fill="#A67C52" opacity="0.85"/>
  <circle cx="508.0" cy="190" r="5" fill="#A67C52" opacity="0.85"/>
  <text x="90" y="230" class="t" font-size="11.5" font-weight="600" fill="#6F8F6A">低和聲（−3 度）</text>
  <rect x="90" y="238" width="460" height="28" rx="6" fill="#6F8F6A" opacity="0.12"/>
  <rect x="90" y="238" width="460" height="28" rx="6" fill="none" stroke="#6F8F6A" stroke-width="1.2"/>
  <circle cx="141.0" cy="252" r="5" fill="#6F8F6A" opacity="0.85"/>
  <circle cx="195.0" cy="252" r="5" fill="#6F8F6A" opacity="0.85"/>
  <circle cx="249.0" cy="252" r="5" fill="#6F8F6A" opacity="0.85"/>
  <circle cx="303.0" cy="252" r="5" fill="#6F8F6A" opacity="0.85"/>
  <circle cx="357.0" cy="252" r="5" fill="#6F8F6A" opacity="0.85"/>
  <circle cx="411.0" cy="252" r="5" fill="#6F8F6A" opacity="0.85"/>
  <circle cx="465.0" cy="252" r="5" fill="#6F8F6A" opacity="0.85"/>
  <circle cx="519.0" cy="252" r="5" fill="#6F8F6A" opacity="0.85"/>
  <text x="90" y="290" class="ts" font-size="12">和聲不是把同一個音唱大聲，是在上面或下面加一條獨立旋律。</text>
</svg>
