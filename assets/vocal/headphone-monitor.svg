<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 360" role="img" aria-label="耳機監聽與骨傳導兩條路徑">
  <title>耳機監聽與骨傳導兩條路徑</title>
  <rect width="620" height="360" fill="#fbf8f2"/>
  <style>
    .ink { fill: none; stroke: #2b2a26; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
    .thin { fill: none; stroke: #8a8578; stroke-width: 1.4; stroke-dasharray: 5 5; }
    .grid { fill: none; stroke: #d8d0c2; stroke-width: 1.2; }
    .fill { fill: #b5734a; opacity: .18; stroke: #b5734a; stroke-width: 1.8; }
    .fill2 { fill: #7d9b76; opacity: .18; stroke: #7d9b76; stroke-width: 1.8; }
    .solid { fill: #b5734a; opacity: .85; }
    .solid2 { fill: #7d9b76; opacity: .85; }
    .lbl { font-family: 'Noto Serif TC', 'Songti TC', 'PingFang TC', serif; font-size: 15px; fill: #2b2a26; }
    .lbl-s { font-family: 'Noto Serif TC', 'Songti TC', 'PingFang TC', serif; font-size: 12.5px; fill: #8a8578; }
    .lbl-b { font-family: 'Noto Serif TC', 'Songti TC', 'PingFang TC', serif; font-size: 15px; fill: #2b2a26; font-weight: 700; }
  </style>
<text class="lbl-b" x="40" y="40">戴耳機時，你聽到的是兩個版本的自己</text>
  <circle class="fill2" cx="300" cy="170" r="66"/>
  <path class="ink" d="M234 150 C210 130 206 190 232 200"/>
  <path class="ink" d="M366 150 C390 130 394 190 368 200"/>
  <text class="lbl" x="300" y="176" text-anchor="middle">你</text>
  <path class="fill" d="M226 150 C206 132 196 168 212 186 Z"/>
  <path class="fill" d="M374 150 C394 132 404 168 388 186 Z"/>
  <path class="ink" d="M214 138 L262 106"/><path class="ink" d="M262 106 L256.1 115.3 L251.2 107.8 Z" fill="#2b2a26"/>
  <text class="lbl" x="118" y="90">耳機送來的聲音</text>
  <text class="lbl-s" x="118" y="110">別人聽到的版本（含殘響）</text>
  <path class="ink" d="M386 200 L470 240"/><path class="ink" d="M470 240 L459.0 239.7 L462.9 231.6 Z" fill="#2b2a26"/>
  <text class="lbl" x="430" y="262">骨傳導</text>
  <text class="lbl-s" x="400" y="282">自己聽到的版本（低頻多）</text>
  <text class="lbl-s" x="40" y="330">錄音時以麥克風收到的為準；覺得自己聲音「很薄」是正常的，那是少了骨傳導</text>
</svg>
