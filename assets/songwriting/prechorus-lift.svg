<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" role="img" aria-label="導歌：三條線同時往上">
  <title>導歌：三條線同時往上</title>
  <rect width="760" height="320" fill="#FBF8F4"/>
  <style>
    .t   { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; }
    .tb  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; font-weight: 700; }
    .ts  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #8C8078; }
    .num { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #FFFFFF; font-weight: 700; font-size: 11px; }
    .ink { fill: none; stroke: #3D3229; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; }
    .thin{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; }
    .dash{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; stroke-dasharray: 4 5; }
    .lead{ fill: none; stroke: #8C8078; stroke-width: 1; }
    .acc { fill: none; stroke: #A67C52; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .blue{ fill: none; stroke: #6B8FBF; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .green{ fill: none; stroke: #6F8F6A; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .red { fill: none; stroke: #B0563F; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .dot { fill: #3D3229; }
  </style>
  <text x="26" y="34" class="tb" font-size="16">導歌：三條線同時往上</text>
  <text x="26" y="55" class="ts" font-size="12.5">導歌不講內容，只做「往上」這件事</text>
  <path d="M70 230 L230 210 L390 195 L492 170 L569 110 L710 60" class="ink" stroke="#A67C52" stroke-width="2.2"/>  <path d="M70 220 L262 220 L454 205 L582 180 L710 160" class="ink" stroke="#C9A883" stroke-width="2" stroke-dasharray="5 4"/>  <path d="M70 205 L326 205 L518 190 L614 130 L710 90" class="ink" stroke="#8C8078" stroke-width="1.8" stroke-dasharray="2 4"/>  <text x="70" y="276" class="ts" font-size="11" text-anchor="middle" fill="#8C8078">主歌</text>  <text x="530.8" y="276" class="ts" font-size="11" text-anchor="middle" fill="#8C8078">導歌</text>  <text x="710" y="276" class="ts" font-size="11" text-anchor="middle" fill="#8C8078">副歌</text>  <text x="704" y="66" class="ts" font-size="10.5" text-anchor="end" fill="#A67C52">音高</text>  <text x="704" y="84" class="ts" font-size="10.5" text-anchor="end" fill="#C9A883">節奏密度</text>  <text x="704" y="102" class="ts" font-size="10.5" text-anchor="end" fill="#8C8078">和聲張力</text>  <text x="26" y="302" class="ts" font-size="10.5" fill="#8C8078">三個工具可以只用一個。最省事的是第三個：導歌最後一小節停在 5 級不動。</text>
</svg>
