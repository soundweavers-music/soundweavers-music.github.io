<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-label="具體勝過抽象">
  <title>具體勝過抽象</title>
  <rect width="760" height="360" fill="#FBF8F4"/>
  <style>
    .t   { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; }
    .tb  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; font-weight: 700; }
    .ts  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #8C8078; }
    .num { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #FFFFFF; font-weight: 700; font-size: 11px; }
    .ink { fill: none; stroke: #3D3229; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; }
    .thin{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; }
    .dash{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; stroke-dasharray: 4 5; }
    .lead{ fill: none; stroke: #8C8078; stroke-width: 1; }
    .acc { fill: none; stroke: #A67C52; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .blue{ fill: none; stroke: #6B8FBF; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .green{ fill: none; stroke: #6F8F6A; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .red { fill: none; stroke: #B0563F; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .dot { fill: #3D3229; }
  </style>
  <text x="26" y="34" class="tb" font-size="16">具體勝過抽象</text>
  <text x="26" y="55" class="ts" font-size="12.5">不要告訴聽眾你的感覺，給他一幅畫面，讓他自己產生那個感覺</text>
  <text x="26" y="84" class="ts" font-size="12">左邊是結論，右邊是證據。聽眾要的是證據。</text>  <text x="40" y="116" class="ts" font-size="11.5" font-weight="700" fill="#8C8078">抽象（結論）</text>  <text x="300" y="116" class="ts" font-size="11.5" font-weight="700" fill="#A67C52">具體（證據）</text>  <rect x="26" y="132" width="220" height="38" rx="6" fill="#F4EFE7" stroke="#D9CFC4" stroke-width="1.4"/>  <text x="40" y="156" class="ts" font-size="11.5" fill="#8C8078">我很難過</text>  <rect x="290" y="132" width="444" height="38" rx="6" fill="#FFFFFF" stroke="#A67C52" stroke-width="1.4"/>  <text x="304" y="156" class="ts" font-size="11.5">我把車停在路邊，雨刷還開著</text>  <rect x="26" y="180" width="220" height="38" rx="6" fill="#F4EFE7" stroke="#D9CFC4" stroke-width="1.4"/>  <text x="40" y="204" class="ts" font-size="11.5" fill="#8C8078">我很想他</text>  <rect x="290" y="180" width="444" height="38" rx="6" fill="#FFFFFF" stroke="#A67C52" stroke-width="1.4"/>  <text x="304" y="204" class="ts" font-size="11.5">我還是買了兩杯咖啡</text>  <rect x="26" y="228" width="220" height="38" rx="6" fill="#F4EFE7" stroke="#D9CFC4" stroke-width="1.4"/>  <text x="40" y="252" class="ts" font-size="11.5" fill="#8C8078">我們回不去了</text>  <rect x="290" y="228" width="444" height="38" rx="6" fill="#FFFFFF" stroke="#A67C52" stroke-width="1.4"/>  <text x="304" y="252" class="ts" font-size="11.5">你留下的傘，我今天才收進櫃子</text>  <rect x="26" y="276" width="220" height="38" rx="6" fill="#F4EFE7" stroke="#D9CFC4" stroke-width="1.4"/>  <text x="40" y="300" class="ts" font-size="11.5" fill="#8C8078">我很孤單</text>  <rect x="290" y="276" width="444" height="38" rx="6" fill="#FFFFFF" stroke="#A67C52" stroke-width="1.4"/>  <text x="304" y="300" class="ts" font-size="11.5">我在便利商店等到店員換班</text>  <text x="26" y="342" class="ts" font-size="10.5" fill="#8C8078">「床前明月光」是證據，「低頭思故鄉」才是結論——唐詩一千年前就這樣寫了。</text>
</svg>
