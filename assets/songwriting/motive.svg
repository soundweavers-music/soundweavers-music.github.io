<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-label="動機與它的三種變化">
  <title>動機與它的三種變化</title>
  <rect width="760" height="360" fill="#FBF8F4"/>
  <style>
    .t   { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; }
    .tb  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; font-weight: 700; }
    .ts  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #8C8078; }
    .num { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #FFFFFF; font-weight: 700; font-size: 11px; }
    .ink { fill: none; stroke: #3D3229; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; }
    .thin{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; }
    .dash{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; stroke-dasharray: 4 5; }
    .lead{ fill: none; stroke: #8C8078; stroke-width: 1; }
    .acc { fill: none; stroke: #A67C52; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .blue{ fill: none; stroke: #6B8FBF; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .green{ fill: none; stroke: #6F8F6A; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .red { fill: none; stroke: #B0563F; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .dot { fill: #3D3229; }
  </style>
  <text x="26" y="34" class="tb" font-size="16">動機與它的三種變化</text>
  <text x="26" y="55" class="ts" font-size="12.5">數字是和弦級數裡的音級；真正的重點是形狀，不是音高</text>
  <text x="26" y="84" class="ts" font-size="12">四個音是種子。整段副歌＝種子＋三種變化。</text>  <text x="26" y="138" class="ts" font-size="11.5" font-weight="700">動機</text>  <circle cx="150" cy="134" r="9" fill="#FFF" stroke="#D9CFC4" stroke-width="1.6"/>  <text x="150" y="138" class="ts" font-size="9" text-anchor="middle" fill="#3D3229">1</text>  <circle cx="194" cy="127" r="9" fill="#FFF" stroke="#D9CFC4" stroke-width="1.6"/>  <text x="194" y="131" class="ts" font-size="9" text-anchor="middle" fill="#3D3229">2</text>  <circle cx="238" cy="120" r="9" fill="#FFF" stroke="#D9CFC4" stroke-width="1.6"/>  <text x="238" y="124" class="ts" font-size="9" text-anchor="middle" fill="#3D3229">3</text>  <circle cx="282" cy="127" r="9" fill="#FFF" stroke="#D9CFC4" stroke-width="1.6"/>  <text x="282" y="131" class="ts" font-size="9" text-anchor="middle" fill="#3D3229">2</text>  <text x="360" y="140" class="ts" font-size="11" fill="#8C8078">四個音，形狀固定</text>  <text x="26" y="196" class="ts" font-size="11.5" font-weight="700">重複</text>  <circle cx="150" cy="192" r="9" fill="#A67C52" stroke="#A67C52" stroke-width="1.6"/>  <text x="150" y="196" class="ts" font-size="9" text-anchor="middle" fill="#FFFFFF">1</text>  <circle cx="194" cy="185" r="9" fill="#A67C52" stroke="#A67C52" stroke-width="1.6"/>  <text x="194" y="189" class="ts" font-size="9" text-anchor="middle" fill="#FFFFFF">2</text>  <circle cx="238" cy="178" r="9" fill="#A67C52" stroke="#A67C52" stroke-width="1.6"/>  <text x="238" y="182" class="ts" font-size="9" text-anchor="middle" fill="#FFFFFF">3</text>  <circle cx="282" cy="185" r="9" fill="#A67C52" stroke="#A67C52" stroke-width="1.6"/>  <text x="282" y="189" class="ts" font-size="9" text-anchor="middle" fill="#FFFFFF">2</text>  <text x="360" y="198" class="ts" font-size="11" fill="#8C8078">完全一樣再來一次——最有效</text>  <text x="26" y="254" class="ts" font-size="11.5" font-weight="700">模進</text>  <circle cx="150" cy="243" r="9" fill="#A67C52" stroke="#A67C52" stroke-width="1.6"/>  <text x="150" y="247" class="ts" font-size="9" text-anchor="middle" fill="#FFFFFF">2</text>  <circle cx="194" cy="236" r="9" fill="#A67C52" stroke="#A67C52" stroke-width="1.6"/>  <text x="194" y="240" class="ts" font-size="9" text-anchor="middle" fill="#FFFFFF">3</text>  <circle cx="238" cy="229" r="9" fill="#A67C52" stroke="#A67C52" stroke-width="1.6"/>  <text x="238" y="233" class="ts" font-size="9" text-anchor="middle" fill="#FFFFFF">4</text>  <circle cx="282" cy="236" r="9" fill="#A67C52" stroke="#A67C52" stroke-width="1.6"/>  <text x="282" y="240" class="ts" font-size="9" text-anchor="middle" fill="#FFFFFF">3</text>  <text x="360" y="256" class="ts" font-size="11" fill="#8C8078">同樣形狀整體往上移</text>  <text x="26" y="312" class="ts" font-size="11.5" font-weight="700">變尾</text>  <circle cx="150" cy="308" r="9" fill="#A67C52" stroke="#A67C52" stroke-width="1.6"/>  <text x="150" y="312" class="ts" font-size="9" text-anchor="middle" fill="#FFFFFF">1</text>  <circle cx="194" cy="301" r="9" fill="#A67C52" stroke="#A67C52" stroke-width="1.6"/>  <text x="194" y="305" class="ts" font-size="9" text-anchor="middle" fill="#FFFFFF">2</text>  <circle cx="238" cy="294" r="9" fill="#A67C52" stroke="#A67C52" stroke-width="1.6"/>  <text x="238" y="298" class="ts" font-size="9" text-anchor="middle" fill="#FFFFFF">3</text>  <circle cx="282" cy="308" r="9" fill="#A67C52" stroke="#A67C52" stroke-width="1.6"/>  <text x="282" y="312" class="ts" font-size="9" text-anchor="middle" fill="#FFFFFF">1</text>  <text x="360" y="314" class="ts" font-size="11" fill="#8C8078">前面一樣，只改最後一個音（收住）</text>  <text x="26" y="342" class="ts" font-size="10.5" fill="#8C8078">把這三種變化排成八小節，就是一段完整的副歌了：動機、重複、模進、變尾。</text>
</svg>
