<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" role="img" aria-label="中文歌詞的聲調陷阱">
  <title>中文歌詞的聲調陷阱</title>
  <rect width="760" height="340" fill="#FBF8F4"/>
  <style>
    .t   { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; }
    .tb  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; font-weight: 700; }
    .ts  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #8C8078; }
    .num { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #FFFFFF; font-weight: 700; font-size: 11px; }
    .ink { fill: none; stroke: #3D3229; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; }
    .thin{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; }
    .dash{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; stroke-dasharray: 4 5; }
    .lead{ fill: none; stroke: #8C8078; stroke-width: 1; }
    .acc { fill: none; stroke: #A67C52; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .blue{ fill: none; stroke: #6B8FBF; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .green{ fill: none; stroke: #6F8F6A; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .red { fill: none; stroke: #B0563F; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .dot { fill: #3D3229; }
  </style>
  <text x="26" y="34" class="tb" font-size="16">The tone trap in Mandarin lyrics</text>
  <text x="26" y="55" class="ts" font-size="12.5">Same syllable, different tone, different word. If the melody fights the tone, listeners hear the wrong word.</text>
  <text x="26" y="84" class="ts" font-size="12">The four Mandarin tones (vertical axis = pitch). Follow the contour and people understand.</text>  <text x="84" y="220" class="ts" font-size="11.5" text-anchor="middle" font-weight="700">Tone 1</text>  <path d="M60 190.0 L104 190.0" class="acc"/>  <circle cx="60" cy="190.0" r="3" fill="#A67C52"/>  <circle cx="104" cy="190.0" r="3" fill="#A67C52"/>  <text x="214" y="220" class="ts" font-size="11.5" text-anchor="middle" font-weight="700">Tone 2</text>  <path d="M190 190.0 L234 150.9" class="acc"/>  <circle cx="190" cy="190.0" r="3" fill="#A67C52"/>  <circle cx="234" cy="150.9" r="3" fill="#A67C52"/>  <text x="344" y="220" class="ts" font-size="11.5" text-anchor="middle" font-weight="700">Tone 3</text>  <path d="M320 178.5 L342 187.7 L364 164.7" class="acc"/>  <circle cx="320" cy="173.9" r="3" fill="#A67C52"/>  <circle cx="364" cy="187.7" r="3" fill="#A67C52"/>  <text x="474" y="220" class="ts" font-size="11.5" text-anchor="middle" font-weight="700">Tone 4</text>  <path d="M450 155.5 L494 190.0" class="acc"/>  <circle cx="450" cy="155.5" r="3" fill="#A67C52"/>  <circle cx="494" cy="190.0" r="3" fill="#A67C52"/>  <text x="26" y="322" class="ts" font-size="10.5" fill="#8C8078">Example: wǒ-ài-nǐ is tone 3–4–3. Lift the 愛 and it starts sounding like 矮 (&quot;short&quot;).</text>
</svg>
