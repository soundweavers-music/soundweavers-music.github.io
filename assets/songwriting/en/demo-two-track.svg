<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img" aria-label="兩軌 demo 是照妖鏡">
  <title>兩軌 demo 是照妖鏡</title>
  <rect width="760" height="300" fill="#FBF8F4"/>
  <style>
    .t   { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; }
    .tb  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; font-weight: 700; }
    .ts  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #8C8078; }
    .num { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #FFFFFF; font-weight: 700; font-size: 11px; }
    .ink { fill: none; stroke: #3D3229; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; }
    .thin{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; }
    .dash{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; stroke-dasharray: 4 5; }
    .lead{ fill: none; stroke: #8C8078; stroke-width: 1; }
    .acc { fill: none; stroke: #A67C52; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .blue{ fill: none; stroke: #6B8FBF; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .green{ fill: none; stroke: #6F8F6A; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .red { fill: none; stroke: #B0563F; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .dot { fill: #3D3229; }
  </style>
  <text x="26" y="34" class="tb" font-size="16">A two-track demo shows everything</text>
  <text x="26" y="55" class="ts" font-size="12.5">A demo exists so people understand the song, not so they admire the production.</text>
  <text x="26" y="84" class="ts" font-size="12">Left: what a two-track demo looks like. Right: what happens when you add too much.</text>  <rect x="40" y="112" width="250" height="30" rx="6" fill="#A67C52"/>  <text x="52" y="132" class="ts" font-size="11" font-weight="700" style="fill:#FFFFFF">Vocal</text>  <rect x="40" y="152" width="250" height="30" rx="6" fill="#C9A883"/>  <text x="52" y="172" class="ts" font-size="11" font-weight="700" style="fill:#FFFFFF">Guitar / piano</text>  <text x="40" y="212" class="ts" font-size="10.5" font-weight="700" fill="#A67C52">You can hear tuning, timing, breathing</text>  <rect x="410" y="104" width="300" height="22" rx="5" fill="#A67C52"/>  <text x="422" y="120" class="ts" font-size="10" style="fill:#FFFFFF">Vocal</text>  <rect x="410" y="132" width="300" height="22" rx="5" fill="#D8C7AF"/>  <text x="422" y="148" class="ts" font-size="10" fill="#3D3229">Drums</text>  <rect x="410" y="160" width="300" height="22" rx="5" fill="#D8C7AF"/>  <text x="422" y="176" class="ts" font-size="10" fill="#3D3229">Bass</text>  <rect x="410" y="188" width="300" height="22" rx="5" fill="#D8C7AF"/>  <text x="422" y="204" class="ts" font-size="10" fill="#3D3229">Guitar</text>  <rect x="410" y="216" width="300" height="22" rx="5" fill="#D8C7AF"/>  <text x="422" y="232" class="ts" font-size="10" fill="#3D3229">Strings</text>  <rect x="410" y="244" width="300" height="22" rx="5" fill="#D8C7AF"/>  <text x="422" y="260" class="ts" font-size="10" fill="#3D3229">Backing vocals</text>  <text x="410" y="284" class="ts" font-size="10.5" fill="#8C8078">Sounds full; every problem is buried</text>
</svg>
