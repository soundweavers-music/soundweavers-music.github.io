<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 290" role="img" aria-label="三十分鐘計時流程">
  <title>三十分鐘計時流程</title>
  <rect width="760" height="290" fill="#FBF8F4"/>
  <style>
    .t   { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; }
    .tb  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; font-weight: 700; }
    .ts  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #8C8078; }
    .num { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #FFFFFF; font-weight: 700; font-size: 11px; }
    .ink { fill: none; stroke: #3D3229; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; }
    .thin{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; }
    .dash{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; stroke-dasharray: 4 5; }
    .lead{ fill: none; stroke: #8C8078; stroke-width: 1; }
    .acc { fill: none; stroke: #A67C52; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .blue{ fill: none; stroke: #6B8FBF; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .green{ fill: none; stroke: #6F8F6A; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .red { fill: none; stroke: #B0563F; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .dot { fill: #3D3229; }
  </style>
  <text x="26" y="34" class="tb" font-size="16">三十分鐘計時流程</text>
  <text x="26" y="55" class="ts" font-size="12.5">四個階段，每段只做一件事</text>
  <rect x="30" y="104" width="164" height="72" rx="8" fill="#FFFFFF" stroke="#D9CFC4" stroke-width="1.4"/>  <text x="112" y="132" class="ts" font-size="11" text-anchor="middle" fill="#8C8078">0–5</text>  <text x="112" y="156" class="ts" font-size="12.5" text-anchor="middle" fill="#3D3229">主題句</text>  <rect x="208" y="104" width="164" height="72" rx="8" fill="#A67C52" stroke="#D9CFC4" stroke-width="1.4"/>  <text x="290" y="132" class="ts" font-size="11" text-anchor="middle" style="fill:#FFFFFF">5–15</text>  <text x="290" y="156" class="ts" font-size="12.5" text-anchor="middle" style="fill:#FFFFFF">四句副歌</text>  <rect x="386" y="104" width="164" height="72" rx="8" fill="#FFFFFF" stroke="#D9CFC4" stroke-width="1.4"/>  <text x="468" y="132" class="ts" font-size="11" text-anchor="middle" fill="#8C8078">15–25</text>  <text x="468" y="156" class="ts" font-size="12.5" text-anchor="middle" fill="#3D3229">旋律</text>  <rect x="564" y="104" width="164" height="72" rx="8" fill="#FFFFFF" stroke="#D9CFC4" stroke-width="1.4"/>  <text x="646" y="132" class="ts" font-size="11" text-anchor="middle" fill="#8C8078">25–30</text>  <text x="646" y="156" class="ts" font-size="12.5" text-anchor="middle" fill="#3D3229">錄音／標記</text>  <text x="30" y="206" class="ts" font-size="11" fill="#8C8078">時間到就停。你練的是「在壓力下做決定」，不是「無限修到好」。</text>  <text x="30" y="236" class="ts" font-size="11" font-weight="700" fill="#A67C52">第一次做完，你至少會有一段完整（但粗糙）的副歌——那就夠了。</text>
</svg>
