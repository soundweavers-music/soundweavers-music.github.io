<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img" aria-label="副歌的容納量">
  <title>副歌的容納量</title>
  <rect width="760" height="300" fill="#FBF8F4"/>
  <style>
    .t   { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; }
    .tb  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; font-weight: 700; }
    .ts  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #8C8078; }
    .num { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #FFFFFF; font-weight: 700; font-size: 11px; }
    .ink { fill: none; stroke: #3D3229; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; }
    .thin{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; }
    .dash{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; stroke-dasharray: 4 5; }
    .lead{ fill: none; stroke: #8C8078; stroke-width: 1; }
    .acc { fill: none; stroke: #A67C52; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .blue{ fill: none; stroke: #6B8FBF; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .green{ fill: none; stroke: #6F8F6A; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .red { fill: none; stroke: #B0563F; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .dot { fill: #3D3229; }
  </style>
  <text x="26" y="34" class="tb" font-size="16">How much a chorus holds</text>
  <text x="26" y="55" class="ts" font-size="12.5">Don&#x27;t cram what fits. Count the slots first.</text>
  <text x="26" y="84" class="ts" font-size="12">Eight bars is four lines; 8–12 syllables a line sings best.</text>  <rect x="40" y="108" width="152" height="60" rx="7" fill="#FFFFFF" stroke="#D9CFC4" stroke-width="1.4"/>  <text x="52" y="132" class="ts" font-size="11" font-weight="700">Line 1</text>  <text x="52" y="152" class="ts" font-size="10.5" fill="#8C8078">8–12 words</text>  <rect x="216" y="108" width="152" height="60" rx="7" fill="#FFFFFF" stroke="#D9CFC4" stroke-width="1.4"/>  <text x="228" y="132" class="ts" font-size="11" font-weight="700">Line 2</text>  <text x="228" y="152" class="ts" font-size="10.5" fill="#8C8078">8–12 words</text>  <rect x="392" y="108" width="152" height="60" rx="7" fill="#FFFFFF" stroke="#D9CFC4" stroke-width="1.4"/>  <text x="404" y="132" class="ts" font-size="11" font-weight="700">Line 3</text>  <text x="404" y="152" class="ts" font-size="10.5" fill="#8C8078">8–12 words</text>  <rect x="568" y="108" width="152" height="60" rx="7" fill="#F3E4D2" stroke="#D9CFC4" stroke-width="1.4"/>  <text x="580" y="132" class="ts" font-size="11" font-weight="700">Line 4</text>  <text x="580" y="152" class="ts" font-size="10.5" fill="#8C8078">8–12 words</text>  <text x="40" y="196" class="ts" font-size="11" fill="#8C8078">After the first pass, chorus 2 usually keeps the four lines and adds nothing new.</text>  <text x="40" y="226" class="ts" font-size="11" font-weight="700" fill="#A67C52">Count the slots first: four lines, four things. Save the fifth for the next song.</text>
</svg>
