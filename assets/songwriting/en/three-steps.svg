<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img" aria-label="拆歌三步">
  <title>拆歌三步</title>
  <rect width="760" height="300" fill="#FBF8F4"/>
  <style>
    .t   { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; }
    .tb  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; font-weight: 700; }
    .ts  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #8C8078; }
    .num { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #FFFFFF; font-weight: 700; font-size: 11px; }
    .ink { fill: none; stroke: #3D3229; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; }
    .thin{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; }
    .dash{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; stroke-dasharray: 4 5; }
    .lead{ fill: none; stroke: #8C8078; stroke-width: 1; }
    .acc { fill: none; stroke: #A67C52; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .blue{ fill: none; stroke: #6B8FBF; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .green{ fill: none; stroke: #6F8F6A; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .red { fill: none; stroke: #B0563F; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .dot { fill: #3D3229; }
  </style>
  <text x="26" y="34" class="tb" font-size="16">Three steps to take a song apart</text>
  <text x="26" y="55" class="ts" font-size="12.5">Listen three times, one job per pass</text>
  <rect x="26" y="92" width="226" height="130" rx="8" fill="#FFFFFF" stroke="#D9CFC4" stroke-width="1.4"/>  <text x="42" y="118" class="ts" font-size="12.5" font-weight="700" fill="#3D3229">1. Mark sections</text>  <text x="42" y="140" class="ts" font-size="10.5" fill="#8C8078">First pass: only mark section changes</text>  <text x="42" y="158" class="ts" font-size="10.5" fill="#8C8078">No terminology: if it sounds like</text>  <text x="42" y="176" class="ts" font-size="10.5" fill="#8C8078">a different thing, mark it</text>  <rect x="272" y="92" width="226" height="130" rx="8" fill="#FFFFFF" stroke="#D9CFC4" stroke-width="1.4"/>  <text x="288" y="118" class="ts" font-size="12.5" font-weight="700" fill="#3D3229">2. Mark chords</text>  <text x="288" y="140" class="ts" font-size="10.5" fill="#8C8078">Second pass: find the chords in each</text>  <text x="288" y="158" class="ts" font-size="10.5" fill="#8C8078">section. You don&#x27;t need all of them,</text>  <text x="288" y="176" class="ts" font-size="10.5" fill="#8C8078">but you must get the chorus</text>  <rect x="518" y="92" width="226" height="130" rx="8" fill="#F3E4D2" stroke="#D9CFC4" stroke-width="1.4"/>  <text x="534" y="118" class="ts" font-size="12.5" font-weight="700" fill="#A67C52">3. Mark the motif</text>  <text x="534" y="140" class="ts" font-size="10.5" fill="#8C8078">Third pass: draw the pitch shape of</text>  <text x="534" y="158" class="ts" font-size="10.5" fill="#8C8078">the chorus&#x27;s first line — up, down,</text>  <text x="534" y="176" class="ts" font-size="10.5" fill="#8C8078">or flat</text>  <text x="26" y="258" class="ts" font-size="11" fill="#8C8078">None of the three touches the lyrics: you want the skeleton, not the content.</text>
</svg>
