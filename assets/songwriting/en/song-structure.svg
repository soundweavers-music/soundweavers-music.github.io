<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" role="img" aria-label="流行歌的七個零件">
  <title>流行歌的七個零件</title>
  <rect width="760" height="330" fill="#FBF8F4"/>
  <style>
    .t   { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; }
    .tb  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; font-weight: 700; }
    .ts  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #8C8078; }
    .num { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #FFFFFF; font-weight: 700; font-size: 11px; }
    .ink { fill: none; stroke: #3D3229; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; }
    .thin{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; }
    .dash{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; stroke-dasharray: 4 5; }
    .lead{ fill: none; stroke: #8C8078; stroke-width: 1; }
    .acc { fill: none; stroke: #A67C52; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .blue{ fill: none; stroke: #6B8FBF; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .green{ fill: none; stroke: #6F8F6A; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .red { fill: none; stroke: #B0563F; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .dot { fill: #3D3229; }
  </style>
  <text x="26" y="34" class="tb" font-size="16">The seven parts of a pop song</text>
  <text x="26" y="55" class="ts" font-size="12.5">The same skeleton for thirty years: the wrapping changed, not the order</text>
  <text x="26" y="84" class="ts" font-size="12">A three-minute song; the bar is time, and each block is how long that part lasts.</text>  <rect x="40" y="112" width="52.4" height="46" rx="4" fill="#EDE6DC" stroke="#D9CFC4" stroke-width="1.4"/>  <text x="66.2" y="140" class="ts" font-size="10" text-anchor="middle" fill="#3D3229">Intro</text>  <rect x="94.4" y="112" width="106.8" height="46" rx="4" fill="#E3D6C4" stroke="#D9CFC4" stroke-width="1.4"/>  <text x="147.8" y="140" class="ts" font-size="10" text-anchor="middle" fill="#3D3229">Verse 1</text>  <rect x="203.2" y="112" width="38.8" height="46" rx="4" fill="#D8C7AF" stroke="#D9CFC4" stroke-width="1.4"/>  <text x="222.6" y="140" class="ts" font-size="10" text-anchor="middle" fill="#3D3229">Pre</text>  <rect x="244.0" y="112" width="79.6" height="46" rx="4" fill="#A67C52" stroke="#D9CFC4" stroke-width="1.4"/>  <text x="283.8" y="140" class="ts" font-size="10" text-anchor="middle" style="fill:#FFFFFF">Chorus 1</text>  <rect x="325.6" y="112" width="66.0" height="46" rx="4" fill="#E3D6C4" stroke="#D9CFC4" stroke-width="1.4"/>  <text x="358.6" y="140" class="ts" font-size="10" text-anchor="middle" fill="#3D3229">Verse 2</text>  <rect x="393.6" y="112" width="38.8" height="46" rx="4" fill="#D8C7AF" stroke="#D9CFC4" stroke-width="1.4"/>  <text x="413.0" y="140" class="ts" font-size="10" text-anchor="middle" fill="#3D3229">Pre</text>  <rect x="434.40000000000003" y="112" width="79.6" height="46" rx="4" fill="#A67C52" stroke="#D9CFC4" stroke-width="1.4"/>  <text x="474.20000000000005" y="140" class="ts" font-size="10" text-anchor="middle" style="fill:#FFFFFF">Chorus 2</text>  <rect x="516.0" y="112" width="52.4" height="46" rx="4" fill="#CFC2B2" stroke="#D9CFC4" stroke-width="1.4"/>  <text x="542.2" y="140" class="ts" font-size="10" text-anchor="middle" fill="#3D3229">Bridge</text>  <rect x="570.4" y="112" width="93.2" height="46" rx="4" fill="#A67C52" stroke="#D9CFC4" stroke-width="1.4"/>  <text x="617.0" y="140" class="ts" font-size="10" text-anchor="middle" style="fill:#FFFFFF">Chorus 3</text>  <rect x="665.6" y="112" width="52.4" height="46" rx="4" fill="#EDE6DC" stroke="#D9CFC4" stroke-width="1.4"/>  <text x="691.8000000000001" y="140" class="ts" font-size="10" text-anchor="middle" fill="#3D3229">Outro</text>  <text x="40" y="102" class="ts" font-size="10" fill="#8C8078">0:00</text>  <text x="720" y="102" class="ts" font-size="10" text-anchor="end" fill="#8C8078">~3:00</text>  <circle cx="46" cy="192" r="3.2" fill="#A67C52"/>  <text x="58" y="196" class="ts" font-size="12" font-weight="700">The chorus is a third of the clock</text>  <text x="58" y="214" class="ts" font-size="11" fill="#8C8078">and nearly all of the memorability comes from here.</text>  <circle cx="46" cy="236" r="3.2" fill="#A67C52"/>  <text x="58" y="240" class="ts" font-size="12" font-weight="700">Verse 2 is shorter than verse 1</text>  <text x="58" y="258" class="ts" font-size="11" fill="#8C8078">The first listen needs information; the second just wants the chorus.</text>  <circle cx="46" cy="280" r="3.2" fill="#A67C52"/>  <text x="58" y="284" class="ts" font-size="12" font-weight="700">The bridge is optional</text>  <text x="58" y="302" class="ts" font-size="11" fill="#8C8078">It exists for contrast; without it the song still works, it just has one fewer turn.</text>
</svg>
