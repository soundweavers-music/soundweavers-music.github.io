<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" role="img" aria-label="句尾收在哪">
  <title>句尾收在哪</title>
  <rect width="760" height="320" fill="#FBF8F4"/>
  <style>
    .t   { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; }
    .tb  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; font-weight: 700; }
    .ts  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #8C8078; }
    .num { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #FFFFFF; font-weight: 700; font-size: 11px; }
    .ink { fill: none; stroke: #3D3229; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; }
    .thin{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; }
    .dash{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; stroke-dasharray: 4 5; }
    .lead{ fill: none; stroke: #8C8078; stroke-width: 1; }
    .acc { fill: none; stroke: #A67C52; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .blue{ fill: none; stroke: #6B8FBF; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .green{ fill: none; stroke: #6F8F6A; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .red { fill: none; stroke: #B0563F; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .dot { fill: #3D3229; }
  </style>
  <text x="26" y="34" class="tb" font-size="16">Where the phrase lands</text>
  <text x="26" y="55" class="ts" font-size="12.5">1, 3 and 5 are stable; 2, 4, 6 and 7 are unstable (in C major)</text>
  <text x="26" y="84" class="ts" font-size="12">Four lines: the first three hang in the air (commas), the last one lands (a full stop).</text>  <text x="26" y="136" class="ts" font-size="11.5" font-weight="700">Line 1</text>  <text x="110" y="136" class="ts" font-size="11.5" font-weight="700" fill="#8C8078">ends on 2</text>  <rect x="200" y="116" width="300" height="30" rx="5" fill="#FFFFFF" stroke="#D9CFC4" stroke-width="1.4"/>  <path d="M210 138 L440 138" class="ink" stroke-dasharray="3 4"/>  <text x="516" y="136" class="ts" font-size="10.5" font-weight="700" fill="#8C8078">unstable</text>  <text x="596" y="136" class="ts" font-size="10" fill="#8C8078">pushes forward</text>  <text x="26" y="184" class="ts" font-size="11.5" font-weight="700">Line 2</text>  <text x="110" y="184" class="ts" font-size="11.5" font-weight="700" fill="#8C8078">ends on 4</text>  <rect x="200" y="164" width="300" height="30" rx="5" fill="#FFFFFF" stroke="#D9CFC4" stroke-width="1.4"/>  <path d="M210 186 L440 186" class="ink" stroke-dasharray="3 4"/>  <text x="516" y="184" class="ts" font-size="10.5" font-weight="700" fill="#8C8078">unstable</text>  <text x="596" y="184" class="ts" font-size="10" fill="#8C8078">pushes again</text>  <text x="26" y="232" class="ts" font-size="11.5" font-weight="700">Line 3</text>  <text x="110" y="232" class="ts" font-size="11.5" font-weight="700" fill="#8C8078">ends on 6</text>  <rect x="200" y="212" width="300" height="30" rx="5" fill="#FFFFFF" stroke="#D9CFC4" stroke-width="1.4"/>  <path d="M210 234 L440 234" class="ink" stroke-dasharray="3 4"/>  <text x="516" y="232" class="ts" font-size="10.5" font-weight="700" fill="#8C8078">unstable</text>  <text x="596" y="232" class="ts" font-size="10" fill="#8C8078">take a breath, don&#x27;t let go</text>  <text x="26" y="280" class="ts" font-size="11.5" font-weight="700">Line 4</text>  <text x="110" y="280" class="ts" font-size="11.5" font-weight="700" fill="#A67C52">ends on 1</text>  <rect x="200" y="260" width="300" height="30" rx="5" fill="#F3E4D2" stroke="#D9CFC4" stroke-width="1.4"/>  <path d="M210 282 L488 282" class="ink" stroke-dasharray="3 4"/>  <text x="516" y="280" class="ts" font-size="10.5" font-weight="700" fill="#A67C52">stable</text>  <text x="596" y="280" class="ts" font-size="10" fill="#8C8078">lands</text>  <text x="26" y="302" class="ts" font-size="10.5" fill="#8C8078">All four landing is flat; all four hanging is unmoored. The drop is what makes it feel complete.</text>
</svg>
