<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" role="img" aria-label="三十秒定律">
  <title>三十秒定律</title>
  <rect width="760" height="330" fill="#FBF8F4"/>
  <style>
    .t   { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; }
    .tb  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; font-weight: 700; }
    .ts  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #8C8078; }
    .num { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #FFFFFF; font-weight: 700; font-size: 11px; }
    .ink { fill: none; stroke: #3D3229; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; }
    .thin{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; }
    .dash{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; stroke-dasharray: 4 5; }
    .lead{ fill: none; stroke: #8C8078; stroke-width: 1; }
    .acc { fill: none; stroke: #A67C52; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .blue{ fill: none; stroke: #6B8FBF; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .green{ fill: none; stroke: #6F8F6A; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .red { fill: none; stroke: #B0563F; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .dot { fill: #3D3229; }
  </style>
  <text x="26" y="34" class="tb" font-size="16">The thirty-second rule</text>
  <text x="26" y="55" class="ts" font-size="12.5">The tinted band is the first 30 seconds; all three answer one question: how to give them something to remember, fastest.</text>
  <text x="26" y="84" class="ts" font-size="12">Listeners give you about 30 seconds. Something has to grab them inside it.</text>  <rect x="130" y="96" width="98.33333333333333" height="196" rx="6" fill="#F7EDE0"/>  <text x="26" y="134" class="ts" font-size="11.5" font-weight="700">Standard</text>  <rect x="130" y="112" width="194.60000000000002" height="30" rx="5" fill="#FFFFFF" stroke="#D9CFC4" stroke-width="1.4"/>  <text x="227.3" y="132" class="ts" font-size="10" text-anchor="middle" fill="#3D3229">Intro 8 bars</text>  <rect x="330.6" y="112" width="123.80000000000001" height="30" rx="5" fill="#FFFFFF" stroke="#D9CFC4" stroke-width="1.4"/>  <text x="392.5" y="132" class="ts" font-size="10" text-anchor="middle" fill="#3D3229">Verse 1</text>  <rect x="460.40000000000003" y="112" width="123.80000000000001" height="30" rx="5" fill="#FFFFFF" stroke="#D9CFC4" stroke-width="1.4"/>  <text x="522.3000000000001" y="132" class="ts" font-size="10" text-anchor="middle" fill="#3D3229">Pre</text>  <rect x="590.2" y="112" width="123.80000000000001" height="30" rx="5" fill="#FFFFFF" stroke="#D9CFC4" stroke-width="1.4"/>  <text x="652.1" y="132" class="ts" font-size="10" text-anchor="middle" fill="#3D3229">Chorus 1</text>  <text x="130" y="162" class="ts" font-size="10" fill="#8C8078">The chorus lands at 0:45 — risky</text>  <text x="26" y="208" class="ts" font-size="11.5" font-weight="700">Chorus first</text>  <rect x="130" y="186" width="194.60000000000002" height="30" rx="5" fill="#A67C52" stroke="#D9CFC4" stroke-width="1.4"/>  <text x="227.3" y="206" class="ts" font-size="10" text-anchor="middle" style="fill:#FFFFFF">Chorus (bare)</text>  <rect x="330.6" y="186" width="123.80000000000001" height="30" rx="5" fill="#FFFFFF" stroke="#D9CFC4" stroke-width="1.4"/>  <text x="392.5" y="206" class="ts" font-size="10" text-anchor="middle" fill="#3D3229">Verse 1</text>  <rect x="460.40000000000003" y="186" width="123.80000000000001" height="30" rx="5" fill="#FFFFFF" stroke="#D9CFC4" stroke-width="1.4"/>  <text x="522.3000000000001" y="206" class="ts" font-size="10" text-anchor="middle" fill="#3D3229">Pre</text>  <rect x="590.2" y="186" width="123.80000000000001" height="30" rx="5" fill="#FFFFFF" stroke="#D9CFC4" stroke-width="1.4"/>  <text x="652.1" y="206" class="ts" font-size="10" text-anchor="middle" fill="#3D3229">Chorus 1</text>  <text x="130" y="236" class="ts" font-size="10" fill="#A67C52">The strongest eight bars are the first thing you hear</text>  <text x="26" y="282" class="ts" font-size="11.5" font-weight="700">Intro is the hook</text>  <rect x="130" y="260" width="194.60000000000002" height="30" rx="5" fill="#A67C52" stroke="#D9CFC4" stroke-width="1.4"/>  <text x="227.3" y="280" class="ts" font-size="10" text-anchor="middle" style="fill:#FFFFFF">Intro (the hook)</text>  <rect x="330.6" y="260" width="123.80000000000001" height="30" rx="5" fill="#FFFFFF" stroke="#D9CFC4" stroke-width="1.4"/>  <text x="392.5" y="280" class="ts" font-size="10" text-anchor="middle" fill="#3D3229">Verse 1</text>  <rect x="460.40000000000003" y="260" width="123.80000000000001" height="30" rx="5" fill="#FFFFFF" stroke="#D9CFC4" stroke-width="1.4"/>  <text x="522.3000000000001" y="280" class="ts" font-size="10" text-anchor="middle" fill="#3D3229">Pre</text>  <rect x="590.2" y="260" width="123.80000000000001" height="30" rx="5" fill="#FFFFFF" stroke="#D9CFC4" stroke-width="1.4"/>  <text x="652.1" y="280" class="ts" font-size="10" text-anchor="middle" fill="#3D3229">Chorus 1</text>  <text x="130" y="310" class="ts" font-size="10" fill="#A67C52">The intro is itself a melody you remember</text>
</svg>
