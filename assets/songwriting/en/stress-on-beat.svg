<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img" aria-label="Put the stressed word on the strong beat">
  <title>Put the stressed word on the strong beat</title>
  <rect width="760" height="300" fill="#FBF8F4"/>
  <style>
    .t   { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; }
    .tb  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; font-weight: 700; }
    .ts  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #8C8078; }
    .num { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #FFFFFF; font-weight: 700; font-size: 11px; }
    .ink { fill: none; stroke: #3D3229; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; }
    .thin{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; }
    .dash{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; stroke-dasharray: 4 5; }
    .lead{ fill: none; stroke: #8C8078; stroke-width: 1; }
    .acc { fill: none; stroke: #A67C52; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .blue{ fill: none; stroke: #6B8FBF; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .green{ fill: none; stroke: #6F8F6A; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .red { fill: none; stroke: #B0563F; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .dot { fill: #3D3229; }
  </style>
  <text x="26" y="34" class="tb" font-size="16">Put the stressed word on the strong beat</text>
  <text x="26" y="55" class="ts" font-size="12.5">Same sentence; move the stress and the meaning moves with it</text>
  <text x="26" y="136" class="ts" font-size="11.5" font-weight="700">Stress on "car"</text>  <text x="160" y="135" class="ts" font-size="12.5" text-anchor="middle" fill="#3D3229">I</text>  <text x="222" y="135" class="ts" font-size="12.5" text-anchor="middle" fill="#3D3229">left</text>  <text x="284" y="135" class="ts" font-size="12.5" text-anchor="middle" fill="#3D3229">the</text>  <circle cx="346" cy="130" r="20" fill="#A67C52"/>  <text x="346" y="135" class="ts" font-size="12.5" text-anchor="middle" style="fill:#FFFFFF">car</text>  <text x="408" y="135" class="ts" font-size="12.5" text-anchor="middle" fill="#3D3229">by</text>  <text x="470" y="135" class="ts" font-size="12.5" text-anchor="middle" fill="#3D3229">the</text>  <text x="532" y="135" class="ts" font-size="12.5" text-anchor="middle" fill="#3D3229">road</text>  <text x="160" y="162" class="ts" font-size="10" fill="#8C8078">reads: I left the CAR by the road</text>  <text x="26" y="220" class="ts" font-size="11.5" font-weight="700">Stress on "left"</text>  <text x="160" y="219" class="ts" font-size="12.5" text-anchor="middle" fill="#3D3229">I</text>  <circle cx="222" cy="214" r="20" fill="#A67C52"/>  <text x="222" y="219" class="ts" font-size="12.5" text-anchor="middle" style="fill:#FFFFFF">left</text>  <text x="284" y="219" class="ts" font-size="12.5" text-anchor="middle" fill="#3D3229">the</text>  <text x="346" y="219" class="ts" font-size="12.5" text-anchor="middle" fill="#3D3229">car</text>  <text x="408" y="219" class="ts" font-size="12.5" text-anchor="middle" fill="#3D3229">by</text>  <text x="470" y="219" class="ts" font-size="12.5" text-anchor="middle" fill="#3D3229">the</text>  <text x="532" y="219" class="ts" font-size="12.5" text-anchor="middle" fill="#3D3229">road</text>  <text x="160" y="246" class="ts" font-size="10" fill="#8C8078">reads: I LEFT the car by the road</text>  <text x="26" y="282" class="ts" font-size="10.5" fill="#8C8078">Decide which word carries the meaning, then let the melody put it on beat one.</text>
</svg>
