<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-label="具體勝過抽象">
  <title>具體勝過抽象</title>
  <rect width="760" height="360" fill="#FBF8F4"/>
  <style>
    .t   { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; }
    .tb  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; font-weight: 700; }
    .ts  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #8C8078; }
    .num { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #FFFFFF; font-weight: 700; font-size: 11px; }
    .ink { fill: none; stroke: #3D3229; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; }
    .thin{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; }
    .dash{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; stroke-dasharray: 4 5; }
    .lead{ fill: none; stroke: #8C8078; stroke-width: 1; }
    .acc { fill: none; stroke: #A67C52; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .blue{ fill: none; stroke: #6B8FBF; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .green{ fill: none; stroke: #6F8F6A; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .red { fill: none; stroke: #B0563F; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .dot { fill: #3D3229; }
  </style>
  <text x="26" y="34" class="tb" font-size="16">Concrete beats abstract</text>
  <text x="26" y="55" class="ts" font-size="12.5">Don&#x27;t tell the listener how you feel. Give them an image and let the feeling arrive on its own.</text>
  <text x="26" y="84" class="ts" font-size="12">Left is the conclusion, right is the evidence. Listeners want evidence.</text>  <text x="40" y="116" class="ts" font-size="11.5" font-weight="700" fill="#8C8078">Abstract (conclusion)</text>  <text x="300" y="116" class="ts" font-size="11.5" font-weight="700" fill="#A67C52">Concrete (evidence)</text>  <rect x="26" y="132" width="220" height="38" rx="6" fill="#F4EFE7" stroke="#D9CFC4" stroke-width="1.4"/>  <text x="40" y="156" class="ts" font-size="11.5" fill="#8C8078">I&#x27;m sad</text>  <rect x="290" y="132" width="444" height="38" rx="6" fill="#FFFFFF" stroke="#A67C52" stroke-width="1.4"/>  <text x="304" y="156" class="ts" font-size="11.5">I pulled over; the wipers are still on</text>  <rect x="26" y="180" width="220" height="38" rx="6" fill="#F4EFE7" stroke="#D9CFC4" stroke-width="1.4"/>  <text x="40" y="204" class="ts" font-size="11.5" fill="#8C8078">I miss him</text>  <rect x="290" y="180" width="444" height="38" rx="6" fill="#FFFFFF" stroke="#A67C52" stroke-width="1.4"/>  <text x="304" y="204" class="ts" font-size="11.5">I still bought two coffees</text>  <rect x="26" y="228" width="220" height="38" rx="6" fill="#F4EFE7" stroke="#D9CFC4" stroke-width="1.4"/>  <text x="40" y="252" class="ts" font-size="11.5" fill="#8C8078">We can&#x27;t go back</text>  <rect x="290" y="228" width="444" height="38" rx="6" fill="#FFFFFF" stroke="#A67C52" stroke-width="1.4"/>  <text x="304" y="252" class="ts" font-size="11.5">I put your umbrella away today</text>  <rect x="26" y="276" width="220" height="38" rx="6" fill="#F4EFE7" stroke="#D9CFC4" stroke-width="1.4"/>  <text x="40" y="300" class="ts" font-size="11.5" fill="#8C8078">I&#x27;m lonely</text>  <rect x="290" y="276" width="444" height="38" rx="6" fill="#FFFFFF" stroke="#A67C52" stroke-width="1.4"/>  <text x="304" y="300" class="ts" font-size="11.5">I waited until the clerk changed shift</text>  <text x="26" y="342" class="ts" font-size="10.5" fill="#8C8078">Li Bai didn&#x27;t write &quot;I&#x27;m homesick&quot;. He wrote moonlight, frost, a lifted head—and let you feel it.</text>
</svg>
