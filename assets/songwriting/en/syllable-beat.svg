<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" role="img" aria-label="字與拍的密度">
  <title>字與拍的密度</title>
  <rect width="760" height="330" fill="#FBF8F4"/>
  <style>
    .t   { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; }
    .tb  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; font-weight: 700; }
    .ts  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #8C8078; }
    .num { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #FFFFFF; font-weight: 700; font-size: 11px; }
    .ink { fill: none; stroke: #3D3229; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; }
    .thin{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; }
    .dash{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; stroke-dasharray: 4 5; }
    .lead{ fill: none; stroke: #8C8078; stroke-width: 1; }
    .acc { fill: none; stroke: #A67C52; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .blue{ fill: none; stroke: #6B8FBF; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .green{ fill: none; stroke: #6F8F6A; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .red { fill: none; stroke: #B0563F; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .dot { fill: #3D3229; }
  </style>
  <text x="26" y="34" class="tb" font-size="16">字與拍的密度</text>
  <text x="26" y="55" class="ts" font-size="12.5">同樣四拍，放 4 個字和放 16 個字是兩種完全不同的歌</text>
  <text x="26" y="126" class="ts" font-size="11.5" font-weight="700">一字一拍</text>  <text x="190" y="126" class="ts" font-size="11" font-weight="700" fill="#A67C52">一小節 4 個字</text>  <text x="190" y="146" class="ts" font-size="10" fill="#8C8078">很清楚，適合抒情</text>  <rect x="360.0" y="100" width="87.0" height="24" rx="3" fill="#F3E4D2" stroke="#D9CFC4" stroke-width="1.4"/>  <rect x="450.0" y="100" width="87.0" height="24" rx="3" fill="#F3E4D2" stroke="#D9CFC4" stroke-width="1.4"/>  <rect x="540.0" y="100" width="87.0" height="24" rx="3" fill="#F3E4D2" stroke="#D9CFC4" stroke-width="1.4"/>  <rect x="630.0" y="100" width="87.0" height="24" rx="3" fill="#F3E4D2" stroke="#D9CFC4" stroke-width="1.4"/>  <text x="26" y="192" class="ts" font-size="11.5" font-weight="700">一字半拍</text>  <text x="190" y="192" class="ts" font-size="11" font-weight="700" fill="#A67C52">一小節 8 個字</text>  <text x="190" y="212" class="ts" font-size="10" fill="#8C8078">流行歌最常見，有流動感</text>  <rect x="360.0" y="166" width="42.0" height="24" rx="3" fill="#F3E4D2" stroke="#D9CFC4" stroke-width="1.4"/>  <rect x="405.0" y="166" width="42.0" height="24" rx="3" fill="#F3E4D2" stroke="#D9CFC4" stroke-width="1.4"/>  <rect x="450.0" y="166" width="42.0" height="24" rx="3" fill="#F3E4D2" stroke="#D9CFC4" stroke-width="1.4"/>  <rect x="495.0" y="166" width="42.0" height="24" rx="3" fill="#F3E4D2" stroke="#D9CFC4" stroke-width="1.4"/>  <rect x="540.0" y="166" width="42.0" height="24" rx="3" fill="#F3E4D2" stroke="#D9CFC4" stroke-width="1.4"/>  <rect x="585.0" y="166" width="42.0" height="24" rx="3" fill="#F3E4D2" stroke="#D9CFC4" stroke-width="1.4"/>  <rect x="630.0" y="166" width="42.0" height="24" rx="3" fill="#F3E4D2" stroke="#D9CFC4" stroke-width="1.4"/>  <rect x="675.0" y="166" width="42.0" height="24" rx="3" fill="#F3E4D2" stroke="#D9CFC4" stroke-width="1.4"/>  <text x="26" y="258" class="ts" font-size="11.5" font-weight="700">一字四分之一拍</text>  <text x="190" y="258" class="ts" font-size="11" font-weight="700" fill="#A67C52">一小節 16 個字</text>  <text x="190" y="278" class="ts" font-size="10" fill="#8C8078">已經是饒舌的密度</text>  <rect x="360.0" y="232" width="19.5" height="24" rx="3" fill="#F3E4D2" stroke="#D9CFC4" stroke-width="1.4"/>  <rect x="382.5" y="232" width="19.5" height="24" rx="3" fill="#F3E4D2" stroke="#D9CFC4" stroke-width="1.4"/>  <rect x="405.0" y="232" width="19.5" height="24" rx="3" fill="#F3E4D2" stroke="#D9CFC4" stroke-width="1.4"/>  <rect x="427.5" y="232" width="19.5" height="24" rx="3" fill="#F3E4D2" stroke="#D9CFC4" stroke-width="1.4"/>  <rect x="450.0" y="232" width="19.5" height="24" rx="3" fill="#F3E4D2" stroke="#D9CFC4" stroke-width="1.4"/>  <rect x="472.5" y="232" width="19.5" height="24" rx="3" fill="#F3E4D2" stroke="#D9CFC4" stroke-width="1.4"/>  <rect x="495.0" y="232" width="19.5" height="24" rx="3" fill="#F3E4D2" stroke="#D9CFC4" stroke-width="1.4"/>  <rect x="517.5" y="232" width="19.5" height="24" rx="3" fill="#F3E4D2" stroke="#D9CFC4" stroke-width="1.4"/>  <rect x="540.0" y="232" width="19.5" height="24" rx="3" fill="#F3E4D2" stroke="#D9CFC4" stroke-width="1.4"/>  <rect x="562.5" y="232" width="19.5" height="24" rx="3" fill="#F3E4D2" stroke="#D9CFC4" stroke-width="1.4"/>  <rect x="585.0" y="232" width="19.5" height="24" rx="3" fill="#F3E4D2" stroke="#D9CFC4" stroke-width="1.4"/>  <rect x="607.5" y="232" width="19.5" height="24" rx="3" fill="#F3E4D2" stroke="#D9CFC4" stroke-width="1.4"/>  <rect x="630.0" y="232" width="19.5" height="24" rx="3" fill="#F3E4D2" stroke="#D9CFC4" stroke-width="1.4"/>  <rect x="652.5" y="232" width="19.5" height="24" rx="3" fill="#F3E4D2" stroke="#D9CFC4" stroke-width="1.4"/>  <rect x="675.0" y="232" width="19.5" height="24" rx="3" fill="#F3E4D2" stroke="#D9CFC4" stroke-width="1.4"/>  <rect x="697.5" y="232" width="19.5" height="24" rx="3" fill="#F3E4D2" stroke="#D9CFC4" stroke-width="1.4"/>  <text x="26" y="314" class="ts" font-size="10.5" fill="#8C8078">寫之前先數：這句幾個字？超過 10 個字又要塞進一小節，就得砍。</text>
</svg>
