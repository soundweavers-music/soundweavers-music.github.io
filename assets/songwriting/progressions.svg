<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" role="img" aria-label="三組萬用進行">
  <title>三組萬用進行</title>
  <rect width="760" height="330" fill="#FBF8F4"/>
  <style>
    .t   { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; }
    .tb  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; font-weight: 700; }
    .ts  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #8C8078; }
    .num { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #FFFFFF; font-weight: 700; font-size: 11px; }
    .ink { fill: none; stroke: #3D3229; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; }
    .thin{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; }
    .dash{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; stroke-dasharray: 4 5; }
    .lead{ fill: none; stroke: #8C8078; stroke-width: 1; }
    .acc { fill: none; stroke: #A67C52; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .blue{ fill: none; stroke: #6B8FBF; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .green{ fill: none; stroke: #6F8F6A; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .red { fill: none; stroke: #B0563F; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .dot { fill: #3D3229; }
  </style>
  <text x="26" y="34" class="tb" font-size="16">三組萬用進行</text>
  <text x="26" y="55" class="ts" font-size="12.5">差別不在和弦，在「從哪裡開始、繞多遠」</text>
  <text x="26" y="128" class="ts" font-size="12" font-weight="700">1-5-6-4</text>  <circle cx="150" cy="122" r="15" fill="#FFFFFF" stroke="#A67C52" stroke-width="1.6"/>  <text x="150" y="127" class="ts" font-size="11" text-anchor="middle" font-weight="700" fill="#A67C52">1</text>  <circle cx="208" cy="122" r="15" fill="#FFFFFF" stroke="#A67C52" stroke-width="1.6"/>  <text x="208" y="127" class="ts" font-size="11" text-anchor="middle" font-weight="700" fill="#A67C52">5</text>  <circle cx="266" cy="122" r="15" fill="#FFFFFF" stroke="#A67C52" stroke-width="1.6"/>  <text x="266" y="127" class="ts" font-size="11" text-anchor="middle" font-weight="700" fill="#A67C52">6</text>  <circle cx="324" cy="122" r="15" fill="#FFFFFF" stroke="#A67C52" stroke-width="1.6"/>  <text x="324" y="127" class="ts" font-size="11" text-anchor="middle" font-weight="700" fill="#A67C52">4</text>  <text x="150" y="152" class="ts" font-size="10" fill="#8C8078">C–G–Am–F</text>  <text x="26" y="152" class="ts" font-size="10" fill="#8C8078">最通用；一直在動，適合主歌</text>  <text x="26" y="202" class="ts" font-size="12" font-weight="700">卡農</text>  <circle cx="150" cy="196" r="15" fill="#FFFFFF" stroke="#A67C52" stroke-width="1.6"/>  <text x="150" y="201" class="ts" font-size="11" text-anchor="middle" font-weight="700" fill="#A67C52">1</text>  <circle cx="208" cy="196" r="15" fill="#FFFFFF" stroke="#A67C52" stroke-width="1.6"/>  <text x="208" y="201" class="ts" font-size="11" text-anchor="middle" font-weight="700" fill="#A67C52">5</text>  <circle cx="266" cy="196" r="15" fill="#FFFFFF" stroke="#A67C52" stroke-width="1.6"/>  <text x="266" y="201" class="ts" font-size="11" text-anchor="middle" font-weight="700" fill="#A67C52">6</text>  <circle cx="324" cy="196" r="15" fill="#FFFFFF" stroke="#A67C52" stroke-width="1.6"/>  <text x="324" y="201" class="ts" font-size="11" text-anchor="middle" font-weight="700" fill="#A67C52">3</text>  <circle cx="382" cy="196" r="15" fill="#FFFFFF" stroke="#A67C52" stroke-width="1.6"/>  <text x="382" y="201" class="ts" font-size="11" text-anchor="middle" font-weight="700" fill="#A67C52">4</text>  <circle cx="440" cy="196" r="15" fill="#FFFFFF" stroke="#A67C52" stroke-width="1.6"/>  <text x="440" y="201" class="ts" font-size="11" text-anchor="middle" font-weight="700" fill="#A67C52">1</text>  <circle cx="498" cy="196" r="15" fill="#FFFFFF" stroke="#A67C52" stroke-width="1.6"/>  <text x="498" y="201" class="ts" font-size="11" text-anchor="middle" font-weight="700" fill="#A67C52">4</text>  <circle cx="556" cy="196" r="15" fill="#FFFFFF" stroke="#A67C52" stroke-width="1.6"/>  <text x="556" y="201" class="ts" font-size="11" text-anchor="middle" font-weight="700" fill="#A67C52">5</text>  <text x="150" y="226" class="ts" font-size="10" fill="#8C8078">C–G–Am–Em–F–C–F–G</text>  <text x="26" y="226" class="ts" font-size="10" fill="#8C8078">八小節；旋律怎麼唱都合</text>  <text x="26" y="276" class="ts" font-size="12" font-weight="700">4-5-3-6</text>  <circle cx="150" cy="270" r="15" fill="#FFFFFF" stroke="#A67C52" stroke-width="1.6"/>  <text x="150" y="275" class="ts" font-size="11" text-anchor="middle" font-weight="700" fill="#A67C52">4</text>  <circle cx="208" cy="270" r="15" fill="#FFFFFF" stroke="#A67C52" stroke-width="1.6"/>  <text x="208" y="275" class="ts" font-size="11" text-anchor="middle" font-weight="700" fill="#A67C52">5</text>  <circle cx="266" cy="270" r="15" fill="#FFFFFF" stroke="#A67C52" stroke-width="1.6"/>  <text x="266" y="275" class="ts" font-size="11" text-anchor="middle" font-weight="700" fill="#A67C52">3</text>  <circle cx="324" cy="270" r="15" fill="#FFFFFF" stroke="#A67C52" stroke-width="1.6"/>  <text x="324" y="275" class="ts" font-size="11" text-anchor="middle" font-weight="700" fill="#A67C52">6</text>  <text x="150" y="300" class="ts" font-size="10" fill="#8C8078">F–G–Em–Am</text>  <text x="26" y="300" class="ts" font-size="10" fill="#8C8078">王道進行；還沒開始就在路上</text>
</svg>
