<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img" aria-label="可以拿出去之前的六項檢查">
  <title>可以拿出去之前的六項檢查</title>
  <rect width="760" height="300" fill="#FBF8F4"/>
  <style>
    .t   { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; }
    .tb  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #3D3229; font-weight: 700; }
    .ts  { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #8C8078; }
    .num { font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif; fill: #FFFFFF; font-weight: 700; font-size: 11px; }
    .ink { fill: none; stroke: #3D3229; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; }
    .thin{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; }
    .dash{ fill: none; stroke: #D9CFC4; stroke-width: 1.1; stroke-dasharray: 4 5; }
    .lead{ fill: none; stroke: #8C8078; stroke-width: 1; }
    .acc { fill: none; stroke: #A67C52; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .blue{ fill: none; stroke: #6B8FBF; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .green{ fill: none; stroke: #6F8F6A; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .red { fill: none; stroke: #B0563F; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .dot { fill: #3D3229; }
  </style>
  <text x="26" y="34" class="tb" font-size="16">可以拿出去之前的六項檢查</text>
  <text x="26" y="55" class="ts" font-size="12.5">檢核表不是打分數，是告訴你「還差哪一項」</text>
  <rect x="40" y="96" width="18" height="18" rx="4" fill="#FFFFFF" stroke="#A67C52" stroke-width="1.4"/>  <text x="70" y="111" class="ts" font-size="11.5">副歌一次就能懂</text>  <rect x="40" y="128" width="18" height="18" rx="4" fill="#FFFFFF" stroke="#A67C52" stroke-width="1.4"/>  <text x="70" y="143" class="ts" font-size="11.5">主歌有畫面</text>  <rect x="40" y="160" width="18" height="18" rx="4" fill="#FFFFFF" stroke="#A67C52" stroke-width="1.4"/>  <text x="70" y="175" class="ts" font-size="11.5">沒有唱不順的地方</text>  <rect x="40" y="192" width="18" height="18" rx="4" fill="#FFFFFF" stroke="#A67C52" stroke-width="1.4"/>  <text x="70" y="207" class="ts" font-size="11.5">副歌會重複，而且第二次有變化</text>  <rect x="40" y="224" width="18" height="18" rx="4" fill="#FFFFFF" stroke="#A67C52" stroke-width="1.4"/>  <text x="70" y="239" class="ts" font-size="11.5">兩軌 demo 聽得完</text>  <rect x="40" y="256" width="18" height="18" rx="4" fill="#FFFFFF" stroke="#A67C52" stroke-width="1.4"/>  <text x="70" y="271" class="ts" font-size="11.5">標題對得上</text>  <text x="430" y="108" class="ts" font-size="12.5" font-weight="700" fill="#A67C52">六項都過</text>  <text x="430" y="130" class="ts" font-size="11" fill="#8C8078">才拿出去給人聽。</text>  <text x="430" y="162" class="ts" font-size="11" fill="#8C8078">沒過的那一項，</text>  <text x="430" y="180" class="ts" font-size="11" fill="#8C8078">就是你下一次要改的東西。</text>
</svg>
