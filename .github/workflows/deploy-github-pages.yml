name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system fonts & LibreOffice
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk libreoffice-writer poppler-utils 2>/dev/null || true

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install Markdown openpyxl bleach python-docx qrcode pillow

      # 和弦資料（組成音、必備音、簡單把位）先驗一次，壞掉就不要部署
      - name: Verify chord data
        run: python scripts/verify_chord_data.py

      - name: Build static site
        run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          if [[ "$REPO_NAME" == *.github.io ]]; then
            export SITE_BASE_PATH=""
          else
            export SITE_BASE_PATH="/$REPO_NAME"
          fi
          python scripts/build_static_site.py

      - name: Build vocal & extra pages
        run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          if [[ "$REPO_NAME" == *.github.io ]]; then
            export SITE_BASE_PATH=""
          else
            export SITE_BASE_PATH="/$REPO_NAME"
          fi
          python scripts/build_vocal_extra.py

      - name: Build mandolin section
        run: python scripts/build_mandolin.py

      - name: Build guitar & ukulele courses
        run: python scripts/build_courses.py

      # 英文版課程頁（/en/<course>/）與 /en/ 落地頁。要在 build_courses.py 之後，
      # 因為它接手所有英文課程頁面（build_courses.py 只管中文）。
      - name: Build English course pages
        run: python scripts/build_en_courses.py

      # 英文版的守門員：章數對不對、圖在不在、有沒有整段還是中文
      - name: Check English edition
        run: python scripts/check_en_site.py

      - name: Build sound-journey reader
        run: python scripts/build_sound_journey_docs.py

      - name: Build ensembles
        run: python scripts/build_ensembles.py

      # /learn/ 搜尋框用的索引：要在所有課程都建好之後才跑，否則會缺章節
      - name: Build learn search index
        run: python scripts/build_learn_index.py

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: outputs/world-instruments-static

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
