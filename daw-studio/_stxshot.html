<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><title>面板外觀</title>
<link rel="stylesheet" href="daw.css">
<style>body{background:#15171c;margin:0;font-family:system-ui}</style></head>
<body>
<script type="module">
import { store, newProject, newTrack } from './js/state.js';
import { uid, computePeaks } from './js/util.js';
import { openStretchPanel, openAlignPanel } from './js/stretch-ui.js';

const sr = 44100;
function noiseClip(seconds, seed0) {
  const buf = new AudioBuffer({ numberOfChannels: 1, length: Math.round(sr * seconds), sampleRate: sr });
  const ch = buf.getChannelData(0);
  let seed = seed0;
  const rnd = () => (seed = (seed * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff;
  for (let k = 0; k < 16; k++) {
    const at = Math.floor(rnd() * (ch.length - sr * 0.08));
    const len = Math.floor(sr * (0.03 + rnd() * 0.05));
    const amp = 0.25 + rnd() * 0.6;
    for (let j = 0; j < len; j++) ch[at + j] += (rnd() * 2 - 1) * amp * Math.sin(Math.PI * j / len);
  }
  return buf;
}

store.project = newProject();
store.project.tracks.length = 0;
const t1 = newTrack(0, 'audio'); t1.name = '主唱';
const t2 = newTrack(1, 'audio'); t2.name = '伴奏';
store.project.tracks.push(t1, t2);

const ref = noiseClip(6, 99);
store.buffers.set('r', ref);
store.bufferMeta.set('r', { name: '伴奏.wav', peaks: computePeaks(ref) });
t2.clips.push({ id: uid('clip'), name: '伴奏.wav', bufferId: 'r', start: 0, duration: 6, offset: 0 });

const voc = noiseClip(4, 7);
store.buffers.set('v', voc);
store.bufferMeta.set('v', { name: '主唱.wav', peaks: computePeaks(voc) });
const clip = { id: uid('clip'), name: '主唱 take3.wav', bufferId: 'v', start: 0.4, duration: 4, offset: 0 };
t1.clips.push(clip);

const which = location.hash.slice(1) || 'align';
if (which === 'speed') openStretchPanel(clip.id); else openAlignPanel(clip.id);
window.__done = true;
</script>
</body></html>
