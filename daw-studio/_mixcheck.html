<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<title>smartmix check</title>
<style>body{font:13px/1.5 monospace;white-space:pre-wrap;padding:16px}</style>
</head><body>
<div id="out">running…</div>
<script type="module">
import { store, newProject } from './js/state.js';
import { analyzeProject, makePlan, applyPlan, setSmartMixEnabled, DEFAULT_PREFS } from './js/smartmix.js';
import { toggleSmartMix, _smartmixUI } from './js/smartmix-ui.js';
import { analyzeBreaths } from './js/breath.js';

const sr = 48000, dur = 6;
const ctx = new OfflineAudioContext(2, sr * dur, sr);

function bake(fn, chans = 2) {
  const b = ctx.createBuffer(chans, sr * dur, sr);
  for (let ch = 0; ch < chans; ch++) {
    const d = b.getChannelData(ch);
    for (let i = 0; i < d.length; i++) d[i] = fn(i / sr, ch);
  }
  return b;
}
// 人聲：帶顫音的諧波 + 兩段換氣（噪音）
const vocal = bake((t, ch) => {
  const vib = 1 + 0.004 * Math.sin(2 * Math.PI * 5 * t);
  const f0 = 220 * vib;
  let s = 0;
  for (let k = 1; k <= 12; k++) s += Math.sin(2 * Math.PI * f0 * k * t) / (k * 1.6);
  const env = (t > 0.2 && t < 2.4) || (t > 3.0 && t < 5.4) ? 1 : 0;
  const inBreath = (t > 2.45 && t < 2.85) || (t > 5.45 && t < 5.8);
  const n1 = Math.random() * 2 - 1, n2 = Math.random() * 2 - 1;
  const hp = (n1 - (globalThis.__prevNoise ?? 0)); globalThis.__prevNoise = n1;
  return 0.16 * s * env + (inBreath ? 0.025 * hp + 0.006 * n2 : 0) + (ch ? 0.002 : 0.003) * (Math.random() * 2 - 1);
});
// 伴奏：三和音 + 低頻
const inst = bake(t => {
  const env = 0.6 + 0.4 * Math.sin(2 * Math.PI * 0.5 * t);
  return 0.05 * env * (Math.sin(2 * Math.PI * 261.6 * t) + Math.sin(2 * Math.PI * 329.6 * t) + Math.sin(2 * Math.PI * 392 * t))
    + 0.04 * Math.sin(2 * Math.PI * 65.4 * t);
});
// 低音
const bass = bake(t => 0.12 * Math.sin(2 * Math.PI * 55 * t) + 0.03 * Math.sin(2 * Math.PI * 110 * t));

const p = newProject();
p.tracks = [];
const mk = (name, buf) => {
  const id = 'buf_' + name;
  store.buffers.set(id, buf);
  const t = { id: 'trk_' + name, kind: 'audio', name, color: '#888', volumeDb: 0, pan: 0, mute: false,
    solo: false, arm: false, monitor: false, inserts: [], sends: [-60, -60], auto: {}, clips: [
      { id: 'cl_' + name, bufferId: id, start: 0, duration: buf.duration, offset: 0 }] };
  p.tracks.push(t);
};
mk('主唱', vocal); mk('吉他', inst); mk('Bass', bass);
store.project = p;

const log = [];
try {
  const items = analyzeProject();
  for (const it of items) {
    const f = it.feats;
    log.push(`${it.name}: kind=${it.kind} lufs=${f.lufs.toFixed(1)} peak=${f.peakDb.toFixed(1)} crest=${f.crestDb.toFixed(1)}`
      + ` noise=${f.noiseDb.toFixed(1)} sib=${f.bands.sib.toFixed(1)} breath=${f.breath.length} flat=${f.flatness.toFixed(3)}`);
  }
  const plan = makePlan({ ...DEFAULT_PREFS, vocal: 0.8, space: 0.5, cleanup: 0.8 }, items);
  for (const t of plan.tracks) log.push(`plan ${t.name}: ${t.chain.map(c => c[0]).join('→')} gain=${t.gainDb} send=${t.sends[0]}`);
  log.push('master ' + JSON.stringify(plan.master));
  const touched = applyPlan(plan);
  log.push(`applied ${touched.length} tracks; inserts=${store.project.tracks.map(t => t.inserts.length).join(',')}; auto pts=${(store.project.tracks[0].auto.volume?.points || []).length}`);
  const n = setSmartMixEnabled(false);
  log.push(`bypass ${n} inserts`);
  {
    const d = vocal.getChannelData(0);
    const rms = (a, b) => { let s = 0, n = 0; for (let i = Math.floor(a*sr); i < b*sr; i++) { s += d[i]*d[i]; n++; } return 20*Math.log10(Math.sqrt(s/n)+1e-12); };
    log.push(`rms sing=${rms(1.0,2.0).toFixed(1)} breath1=${rms(2.5,2.8).toFixed(1)} breath2=${rms(5.5,5.75).toFixed(1)} silence=${rms(2.9,2.95).toFixed(1)}`);
  }
  const mono = new AudioBuffer({ length: vocal.length, sampleRate: sr, numberOfChannels: 1 });
  mono.copyToChannel(vocal.getChannelData(0), 0);
  for (const s of [0.5, 0.9, 1.0]) {
    const b = analyzeBreaths(mono, 0, dur, { sens: s });
    log.push(`breaths sens=${s}: ${b.length} ${b.slice(0,3).map(x => x.start.toFixed(2)+'-'+x.end.toFixed(2)).join(',')}`);
  }
  toggleSmartMix(true);
  const win = document.querySelector('.smx-win');
  log.push('UI modal=' + !!win + ' panes=' + document.querySelectorAll('.aiw-pane').length + ' slides=' + document.querySelectorAll('.smx-slide').length);
  _smartmixUI.runAnalyze && await _smartmixUI.runAnalyze();
  log.push('UI cards=' + document.querySelectorAll('.smx-card').length);
  log.push('OK');
} catch (e) {
  log.push('ERROR ' + (e?.stack || e));
}
document.getElementById('out').textContent = log.join('\n');
</script>
</body></html>
