<!doctype html>
<html lang="zh-Hant" data-theme="wood-light">
<head>
<meta charset="utf-8">
<title>效果器圖示檢查</title>
<link rel="stylesheet" href="daw.css">
<style>
  body { padding: 24px; font-family: system-ui, sans-serif; }
  h2 { font-size: 14px; margin: 18px 0 8px; color: var(--tx1); }
  .grid { display: flex; flex-wrap: wrap; gap: 10px; }
  .cell { width: 128px; padding: 8px; border: 1px solid var(--line2); border-radius: 6px; background: var(--bg1); text-align: center; }
  .cell svg { width: 38px; height: 38px; color: var(--tx0); }
  .cell b { display: block; font-size: 11px; margin-top: 4px; color: var(--tx1); font-weight: 500; }
  .slots { width: 220px; }
</style>
</head>
<body>
<h2>所有效果器圖示（38px）</h2>
<div class="grid" id="grid"></div>
<h2>插入槽實際大小（檢閱器 / 混音台 compact）</h2>
<div class="slots" id="slots"></div>
<div class="slots" id="slots2" style="width:150px"></div>
<script type="module">
import { fxIcon } from './js/fx-icons.js';
import { FX_TYPES, FX_ORDER } from './js/effects.js';
import { insertSlots } from './js/fx-ui.js';
import { store } from './js/state.js';

document.getElementById('grid').innerHTML = FX_ORDER.map(t =>
  `<div class="cell">${fxIcon(t)}<b>${FX_TYPES[t].short}<br><span style="opacity:.6">${t}</span></b></div>`).join('');

const t = store.project.tracks[0];
t.inserts = [
  { id: 'a1', type: 'tune', on: true, params: {} },
  { id: 'a2', type: 'comp', on: true, params: {} },
  { id: 'a3', type: 'deess', on: false, params: {} },
  { id: 'a4', type: 'eq', on: true, params: {} },
];
document.getElementById('slots').appendChild(insertSlots(t.id));
document.getElementById('slots2').appendChild(insertSlots('bus0', true));
</script>
</body>
</html>
