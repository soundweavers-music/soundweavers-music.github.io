<!doctype html>
<meta charset="utf-8">
<pre id="r">running…</pre>
<script type="module">
const mods = ['./js/util.js', './js/state.js', './js/effects.js', './js/engine.js',
  './js/fx-presets.js', './js/note-detect.js', './js/autotune-ui.js',
  './js/width-ui.js', './js/reverb-ui.js', './js/fx-ui.js', './js/harmony-ui.js',
  './js/main.js'];
const out = [];
for (const m of mods) {
  try { await import(m); out.push('OK   ' + m); }
  catch (e) { out.push('ERR  ' + m + ' → ' + e.message); }
}
document.getElementById('r').textContent = out.join('\n');
document.title = 'check-done';
</script>
