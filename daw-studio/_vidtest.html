<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><title>影片輸出測試</title></head>
<body><img src="/__ready" style="display:none"><pre id="out">running…</pre>
<script type="module">
import { store, newTrack } from './js/state.js';
import { putMedia } from './js/media-store.js';
import { exportVideoMp4 } from './js/video-export.js';
import { addTextClip } from './js/video.js';
import { engine } from './js/engine.js';

// 無頭瀏覽器開音訊引擎會卡住，這裡直接餵一段合成的靜音，只測影片那一段
engine.ensure = async () => ({ sampleRate: 48000 });
engine.render = async ({ start = 0, end = 2, sampleRate = 48000 }) =>
  new AudioBuffer({ numberOfChannels: 2, length: Math.max(1, Math.round((end - start) * sampleRate)), sampleRate });

const out = [], log = (...a) => { out.push(a.join(' ')); document.getElementById('out').textContent = out.join('\n'); };
const sleep = ms => new Promise(r => setTimeout(r, ms));

// 兩段純色來源（紅、藍），方便用像素判斷濾鏡／轉場／淡入有沒有生效
async function makeSolid(seconds, color) {
  const cv = document.createElement('canvas'); cv.width = 320; cv.height = 180;
  const g = cv.getContext('2d');
  const stream = cv.captureStream(30);
  const rec = new MediaRecorder(stream, { mimeType: 'video/webm;codecs=vp8' });
  const parts = [];
  rec.ondataavailable = e => e.data.size && parts.push(e.data);
  const done = new Promise(r => { rec.onstop = r; });
  rec.start();
  const t0 = performance.now();
  while (performance.now() - t0 < seconds * 1000) {
    g.fillStyle = color; g.fillRect(0, 0, 320, 180);
    await sleep(33);
  }
  rec.stop(); await done;
  return new Blob(parts, { type: 'video/webm' });
}

function px(v, t) {
  return new Promise(res => {
    const done = () => {
      const cv = document.createElement('canvas'); cv.width = 320; cv.height = 180;
      const g = cv.getContext('2d'); g.drawImage(v, 0, 0);
      const d = g.getImageData(160, 90, 1, 1).data;
      res([d[0], d[1], d[2]]);
    };
    v.onseeked = done; v.currentTime = t;
    setTimeout(done, 4000);
  });
}

try {
  const red = await makeSolid(1.5, '#e02020');
  const blue = await makeSolid(1.5, '#2040e0');
  await putMedia('mred', { name: 'r.webm', type: 'video/webm', blob: red });
  await putMedia('mblue', { name: 'b.webm', type: 'video/webm', blob: blue });

  const p = store.project;
  p.name = 'vidtest'; p.video = { w: 320, h: 180, fps: 30, bg: '#000' };
  p.tracks.length = 0;
  const vt = newTrack(0, 'video'); vt.name = '影片'; p.tracks.push(vt);
  // 第一段：黑白濾鏡 + 淡入；交界處 0.8 秒疊化
  vt.clips.push({ id: 'c1', mediaId: 'mred', name: 'red', start: 0, duration: 1.5, offset: 0,
    filter: 'bw', filterAmt: 1, fadeIn: 0.5, trans: { type: 'dissolve', dur: 0.8 } });
  vt.clips.push({ id: 'c2', mediaId: 'mblue', name: 'blue', start: 1.5, duration: 1.5, offset: 0,
    color: { b: 40, c: 0, s: 30, t: 40, h: 0, v: 0, f: 0 } });
  store.changed('structure');

  const mp4 = await exportVideoMp4({ width: 320, height: 180, fps: 30, download: false });
  log('mp4 bytes', mp4.size);

  const url = URL.createObjectURL(mp4);
  const v = document.createElement('video'); v.muted = true; v.src = url;
  await new Promise(r => { v.onloadeddata = r; v.onerror = r; setTimeout(r, 6000); });
  log('duration', v.duration, 'size', v.videoWidth + 'x' + v.videoHeight);
  for (const t of [0.15, 1.2, 1.5, 1.9]) {
    log(`t=${t}`, (await px(v, t)).join(','));
  }
  // 期望：0.15 很暗（淡入）、1.2 灰（黑白濾鏡）、1.5 紅藍混合、1.9 藍

  const bytes = new Uint8Array(await mp4.arrayBuffer());
  let s = '';
  for (let i = 0; i < bytes.length; i += 8192) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 8192));
  const pre = document.createElement('pre'); pre.id = 'b64'; pre.textContent = btoa(s);
  document.body.appendChild(pre);
  log('DONE');
} catch (e) {
  log('FAILED', e.message, e.stack?.split('\n')[1] || '');
}
document.title = 'done';
fetch('/__go');
</script>
</body></html>
