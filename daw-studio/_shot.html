<!doctype html><meta charset="utf-8">
<style>html,body{margin:0;height:100%;overflow:hidden}iframe{border:0;width:100vw;height:100vh;display:block}</style>
<iframe id="f"></iframe>
<script>
const q = new URLSearchParams(location.search);
const view = q.get('v') || 'overview';
const f = document.getElementById('f');
// 課程截圖統一用「世界聲音・木質深色」，跟既有圖片一致
try { localStorage.setItem('zhiyin-daw-theme', 'wood-dark'); } catch (e) { /* ignore */ }
f.src = 'index.html?demo=1';
const wait = ms => new Promise(r => setTimeout(r, ms));
f.addEventListener('load', async () => {
  await wait(1200);
  const w = f.contentWindow, d = f.contentDocument;
  const click = id => d.getElementById(id) && d.getElementById(id).click();
  const daw = w.__daw;
  const menuPick = async (btn, text) => {
    click(btn); await wait(150);
    const b = [...d.querySelectorAll('.ctxmenu button')].find(x => x.textContent.includes(text));
    if (b) b.click();
    await wait(300);
  };
  try {
    if (view === 'mixer') click('btnMixer');
    else if (view === 'filemenu') { click('btnFile'); await wait(300); }
    else if (view === 'moremenu') { click('btnMore'); await wait(300); }
    else if (view === 'piano') {
      const t = daw.store.project.tracks.find(x => x.name === '鋼琴');
      daw.store.selection.trackId = t.id;
      daw.store.selection.clipIds = new Set([t.clips[0].id]);
      daw.store.emit('select', {}); daw.renderInspector();
      click('btnPiano');
      await wait(600);
    }
    else if (view === 'chords') { daw.store.project.chordView = 1; daw.store.emit('chords', {}); daw.renderArrange(); }
    else if (view === 'fx-tune') {
      const t = daw.store.project.tracks.find(x => x.name === '主唱');
      daw.store.selection.trackId = t.id; daw.store.emit('select', {});
      w.__daw.store.emit('open-fx', {});
      // 直接開效果器面板
      d.querySelector('#inspector .fx-slot') && d.querySelector('#inspector .fx-slot').click();
      await wait(600);
    }
    else if (view === 'master') click('btnMaster');
    else if (view === 'album') click('btnAlbum');
    else if (view === 'arranger') click('btnArranger');
    else if (view === 'fx-eq' || view === 'fx-tune' || view === 'fx-comp') {
      const idx = view === 'fx-tune' ? 0 : view === 'fx-eq' ? 1 : 2;
      const slots = d.querySelectorAll('#inspector .fx-slot');
      if (slots[idx]) slots[idx].click();
      await wait(800);
    }
    else if (view === 'devices') { await menuPick('btnMore', '裝置設定'); await wait(400); }
    else if (view === 'export') click('btnExport');
    else if (view === 'automation') click('btnAuto');
    else if (view === 'chords-name') { daw.store.project.chordView = 0; daw.store.emit('chords', {}); daw.renderArrange(); }
    else if (view === 'chords-solfa') { daw.store.project.chordView = 2; daw.store.emit('chords', {}); daw.renderArrange(); }
    await wait(700);
  } catch (e) { document.title = 'err ' + e.message; }
  document.title = 'shot-' + view;
});
</script>
