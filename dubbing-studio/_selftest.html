<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>配音剪輯：數學驗證</title>
<style>
  body { background: #0b0c10; color: #dfe1e6; font: 12px ui-monospace, Consolas, monospace; padding: 16px; }
  pre { white-space: pre-wrap; line-height: 1.6; }
  .pass { color: #7df0cd; } .fail { color: #ff8a8a; } .info { color: #8f9dff; }
</style>
</head>
<body>
<pre id="out">running…</pre>
<iframe src="/tools/dubbing/" style="width:2px;height:2px;opacity:0;border:0"></iframe>
<img src="/__SLOW__" width="1" height="1" alt="" style="position:absolute;left:-9px;top:-9px">
<script>
(async function () {
  var out = document.getElementById('out'), rows = [], fails = 0;
  function log(cls, s) { rows.push('<span class="' + cls + '">' + s + '</span>'); out.innerHTML = rows.join('\n'); }
  function check(name, ok, detail) {
    if (!ok) fails++;
    log(ok ? 'pass' : 'fail', (ok ? 'PASS' : 'FAIL') + '  ' + name + (detail ? '  — ' + detail : ''));
  }
  var frame = document.querySelector('iframe');
  await new Promise(function (r) { frame.onload = r; setTimeout(r, 4000); });
  await new Promise(function (r) { setTimeout(r, 600); });
  var D = frame.contentWindow && frame.contentWindow.__dubbing;
  if (!D) {
    log('fail', 'FAIL  找不到 __dubbing 除錯鉤子（頁面可能沒載入）');
    fetch('/__READY__');
    return;
  }

  // ---- 字幕解析 ----
  var srt = '1\n00:00:01,000 --> 00:00:03,500\n第一句話\n\n2\n00:00:04,200 --> 00:00:07,000\n第二句話，長一點。\n';
  var c1 = D.parseSubtitle(srt);
  check('SRT：解析 2 句', c1.length === 2, JSON.stringify(c1.map(function (c) { return [c.start, c.end]; })));
  check('SRT：時間正確', Math.abs(c1[0].start - 1) < 0.01 && Math.abs(c1[1].end - 7) < 0.01);

  var lrc = '[00:01.50]第一句\n[00:04.00]第二句\n';
  var c2 = D.parseSubtitle(lrc);
  check('LRC：解析 2 句', c2.length === 2, JSON.stringify(c2.map(function (c) { return [c.start, c.end]; })));
  check('LRC：沒有時間的下一句會補上結束時間', c2[1] && c2[1].end > c2[1].start);

  // ---- 對齊（字幕 ↔ AI 聽到的句子）----
  var cues = [
    { start: 0.5, end: 3, text: '今天我們來聊聊混音' },
    { start: 3.5, end: 6, text: '首先要認識頻率' },
    { start: 6.5, end: 9, text: '低頻要乾淨' }
  ];
  var heard = [
    { time: 0.6, end: 2.9, text: '今天我們來聊聊混音' },
    { time: 3.7, end: 5.6, text: '首先要認識頻率這件事情' },
    { time: 6.6, end: 8.6, text: '低頻要乾淨一點' }
  ];
  var map = D.alignCues(cues, heard);
  check('對齊：三句都對到正確的 AI 句子', map[0] === 0 && map[1] === 1 && map[2] === 2, JSON.stringify(map));
  var map2 = D.alignCues([{ start: 0, end: 2, text: '完全不同的內容' }], heard);
  check('對齊：完全不一樣的字幕仍然會給一個位置（不會整段消失）', map2.length === 1 && map2[0] >= 0, JSON.stringify(map2));

  // ---- WSOLA 變速 ----
  var sr = 44100, tone = new Float32Array(sr); // 1 秒 440 Hz
  for (var i = 0; i < tone.length; i++) tone[i] = Math.sin(2 * Math.PI * 440 * i / sr) * 0.5;
  var st = D.timeStretch(tone, sr, 0.8);
  check('變速：0.8 倍長度正確', Math.abs(st.length - Math.round(sr * 0.8)) <= 2, st.length + ' vs ' + Math.round(sr * 0.8));
  // 音高不變：量過零率（440 Hz ≈ 880 次/秒）
  var zc = 0; for (var k = 1; k < st.length; k++) if ((st[k - 1] < 0) !== (st[k] < 0)) zc++;
  var hz = zc / 2 / (st.length / sr);
  check('變速：音高不變（過零率 ≈ 440 Hz）', Math.abs(hz - 440) < 25, hz.toFixed(1) + ' Hz');

  // ---- 降噪 ----
  var noisy = new Float32Array(sr);
  var seed = 7;
  function rnd() { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 2147483648 - 1; }
  for (var j = 0; j < noisy.length; j++) {
    var t = j / sr;
    var speech = (t > 0.2 && t < 0.8) ? Math.sin(2 * Math.PI * 220 * t) * 0.4 : 0;
    noisy[j] = speech + rnd() * 0.05;
  }
  function rms(a, s, e) { var x = 0; for (var i2 = s; i2 < e; i2++) x += a[i2] * a[i2]; return Math.sqrt(x / (e - s)); }
  var dn = D.denoise(noisy, sr);
  var n0 = rms(noisy, 0, Math.round(sr * 0.15)), n1 = rms(dn, 0, Math.round(sr * 0.15));
  var s0 = rms(noisy, Math.round(sr * 0.35), Math.round(sr * 0.65)), s1 = rms(dn, Math.round(sr * 0.35), Math.round(sr * 0.65));
  check('降噪：只有噪音的地方被壓低', n1 < n0 * 0.75, (n1 / n0).toFixed(2) + '×');
  check('降噪：有語音的地方保留', s1 > s0 * 0.7, (s1 / s0).toFixed(2) + '×');

  // ---- 呼吸聲偵測 ----
  var br = new Float32Array(sr * 3), lp = 0;
  for (var q = 0; q < br.length; q++) {
    var tt = q / sr, v = 0;
    if (tt < 0.5 || (tt >= 1 && tt < 2)) v = Math.sin(2 * Math.PI * 220 * tt) * 0.3;
    else if (tt >= 0.8 && tt < 1) { var w = rnd(); lp = lp * 0.7 + w * 0.3; v = lp * 0.04; }
    br[q] = v;
  }
  var regs = D.breathRegions(br, sr);
  var hit = regs.some(function (r) { return r.start < 0.93 && r.end > 0.83; });
  check('呼吸聲：抓到合成的吸氣段', hit, JSON.stringify(regs.map(function (r) { return [+r.start.toFixed(2), +r.end.toFixed(2)]; })));
  check('呼吸聲：沒有把歌聲當成呼吸', !regs.some(function (r) { return r.start < 0.45; }));

  // ---- EQ ----
  function sine(amp, f, sec) {
    var n = Math.round(sr * (sec || 1)), a = new Float32Array(n);
    for (var i = 0; i < n; i++) a[i] = Math.sin(2 * Math.PI * f * i / sr) * amp;
    return a;
  }
  function rms2(a, s, e) { var x = 0; for (var i = s; i < e; i++) x += a[i] * a[i]; return Math.sqrt(x / (e - s)); }
  var p = { hp: 90, mud: -2, pres: 6, air: 1 };
  var t3 = sine(0.2, 3000), e3 = D.applyEq(t3, sr, p);
  var db3 = 20 * Math.log10(rms2(e3, 8000, 40000) / rms2(t3, 8000, 40000));
  check('EQ：3 kHz 峰值 +6 dB', Math.abs(db3 - 6) < 0.6, db3.toFixed(2) + ' dB');
  var mag3 = D.eqMagDb(3000, D.eqStages(p, sr), sr);
  check('EQ：響應圖與實際處理一致', Math.abs(mag3 - db3) < 0.5, mag3.toFixed(2) + ' vs ' + db3.toFixed(2));
  var p2 = { hp: 200, mud: -2, pres: 6, air: 1 };
  var t100 = sine(0.2, 100), e100 = D.applyEq(t100, sr, p2);
  var db100 = 20 * Math.log10(rms2(e100, 8000, 40000) / rms2(t100, 8000, 40000));
  check('EQ：低頻切點 200 Hz 把 100 Hz 壓下來', db100 < -8, db100.toFixed(1) + ' dB');

  // ---- 音量標準化 ----
  var quiet = sine(0.02, 220), loud = sine(0.7, 220);
  var nq = D.normalizeLoudness(quiet, sr, -16, -1);
  var lvq = D.speechLevelDb(D.frameLevels(nq.data, sr));
  check('標準化：太小聲會被拉大', nq.gainDb > 10, '+' + nq.gainDb.toFixed(1) + ' dB');
  check('標準化：拉大後接近目標 −16 dB', Math.abs(lvq + 16) < 1.5, lvq.toFixed(1) + ' dB');
  var nl = D.normalizeLoudness(loud, sr, -16, -1);
  check('標準化：太大聲會被拉小', nl.gainDb < 0, nl.gainDb.toFixed(1) + ' dB');
  check('標準化：尖峰不超過上限', D.peakDb(nl.data) <= -1 + 0.3, D.peakDb(nl.data).toFixed(2) + ' dB');

  // ---- 降噪強度 ----
  var dnLow = D.denoise(noisy, sr, 0.2), dnHigh = D.denoise(noisy, sr, 1);
  var rl = rms(dnLow, 0, Math.round(sr * 0.15)), rh = rms(dnHigh, 0, Math.round(sr * 0.15));
  check('降噪：強力比輕微壓得更多', rh < rl * 0.85, (rh / rl).toFixed(2) + '×');

  // ---- 模型倉庫（IndexedDB + sha256）----
  var ZM = frame.contentWindow.ZhiyinModels;
  check('模型倉庫：有載入', !!(ZM && ZM.get && ZM.put && ZM.sha256));
  if (ZM) {
    var hh = await ZM.sha256(new TextEncoder().encode('abc').buffer);
    check('模型倉庫：sha256 正確', hh === 'ba7816bf8f01cfea414140de5dae2223b00361a396177a9cb410ff61f20015ad', hh.slice(0, 12) + '…');
    var rec = await ZM.get('funasr-nano');
    check('模型倉庫：測試環境沒有安裝模型', !rec);
    var card = frame.contentDocument.querySelector('#modelCard.zmodel');
    check('模型倉庫：口白剪輯頁有模型卡', !!card, card ? card.querySelector('.zmodel-state').textContent : '');
  }

  // ---- 歌詞工具也要有模型卡 ----
  var f2 = document.createElement('iframe');
  f2.src = '/tools/lrc/';
  f2.style.cssText = 'width:2px;height:2px;opacity:0;border:0';
  document.body.appendChild(f2);
  await new Promise(function (r) { f2.onload = r; setTimeout(r, 4000); });
  await new Promise(function (r) { setTimeout(r, 1200); });
  var card2 = f2.contentDocument && f2.contentDocument.querySelector('#lrc-model-card.zmodel');
  check('歌詞工具：有模型卡', !!card2, card2 ? card2.querySelector('.zmodel-state').textContent : '');

  // ---- AI 配音：文字 → 音素（MeloTTS） ----
  var sylD = await D.ttsSyllables();
  check('AI 配音：音素表載入', !!sylD && !!sylD.syllables && !!sylD.tokens, '音節 ' + Object.keys(sylD.syllables || {}).length);
  check('AI 配音：中文音節拆得對（中 → zh ong、綠 → l v、而 → EE er）',
    String(sylD.syllables.zhong) === 'zh,ong' && String(sylD.syllables.lv) === 'l,v' &&
    String(sylD.syllables.er) === 'EE,er',
    JSON.stringify([sylD.syllables.zhong, sylD.syllables.lv, sylD.syllables.er]));
  await D.ttsPinyin();
  check('AI 配音：拼音工具載入', !!(frame.contentWindow.pinyinPro && frame.contentWindow.pinyinPro.pinyin));
  function phones(s) {
    var g = D.ttsPhones(s, sylD), toks = [];
    Object.keys(sylD.tokens).forEach(function (k) { toks[sylD.tokens[k]] = k; });
    return { names: g.ids.map(function (i) { return toks[i]; }), tones: g.tones, warn: g };
  }
  var p1 = phones('中文');
  check('AI 配音：中文 → 音素序列', p1.names.join(' ') === 'zh ong w en', p1.names.join(' ') + ' / ' + p1.tones.join(','));
  check('AI 配音：聲調正確（中 1、文 2）', p1.tones.join(',') === '1,1,2,2', p1.tones.join(','));
  var p2 = phones('你好');
  check('AI 配音：三聲連讀變調（你 3 → 2）', p2.tones.join(',') === '2,2,3,3', p2.tones.join(','));
  var p3 = phones('你說，');
  check('AI 配音：標點變成停頓音素', p3.names[p3.names.length - 1] === ',' && p3.tones[p3.tones.length - 1] === 7,
    p3.names.join(' ') + ' / ' + p3.tones.join(','));
  var p4 = phones('2026');
  check('AI 配音：數字念成中文（2026 → 二千零二十六）', p4.names.length >= 10 && p4.warn.latin === 0, p4.names.join(' '));
  check('AI 配音：數字讀法文字正確', D.zhNumber('2026') === '二千零二十六' && D.zhNumber('105') === '一百零五' &&
    D.zhNumber('10') === '十' && D.zhNumber('0') === '零',
    [D.zhNumber('2026'), D.zhNumber('105'), D.zhNumber('10'), D.zhNumber('0')].join(' / '));
  var p5 = phones('hello 你好');
  check('AI 配音：英文單字先跳過（不會亂念）', p5.warn.latin === 1 && p5.names.length === 4, 'latin=' + p5.warn.latin);
  var noModel = '';
  try { await D.ttsRun('你好', 1); } catch (e) { noModel = (e && e.message) || String(e); }
  check('AI 配音：沒裝模型時給清楚的說明', /還沒有安裝配音模型/.test(noModel), noModel.slice(0, 40));

  // ---- 口白：分段（take）機制 ----
  var AC = frame.contentWindow.AudioContext || frame.contentWindow.webkitAudioContext;
  var actx = new AC();
  function mkBuf(sec, rate, freq) {
    var n = Math.round(sec * rate), b = actx.createBuffer(1, n, rate), d = b.getChannelData(0);
    for (var i = 0; i < n; i++) d[i] = Math.sin(2 * Math.PI * freq * i / rate) * 0.2;
    return b;
  }
  D.ed.takes.length = 0;
  D.addTake('A', mkBuf(1, 48000, 220));
  D.addTake('B', mkBuf(0.5, 44100, 330));
  check('分段：兩段都加進來', D.ed.takes.length === 2, D.ed.takes.length + ' 段');
  check('分段：接起來的長度正確（1 + 0.25 間隔 + 0.5）',
    Math.abs(D.ed.buffer.duration - 1.75) < 0.05, D.ed.buffer.duration.toFixed(3) + ' s');
  check('分段：第二段的起點正確', Math.abs(D.ed.takes[1].off - 1.25) < 0.03, D.ed.takes[1].off.toFixed(3) + ' s');
  check('分段：不同取樣率會統一', D.ed.buffer.sampleRate === 48000, String(D.ed.buffer.sampleRate));
  var t0 = D.ed.takes[0]; D.ed.takes[0] = D.ed.takes[1]; D.ed.takes[1] = t0;  // 假裝按了「↑」
  D.rebuildBuffer();
  check('分段：順序可以對調', D.ed.takes[0].name === 'B' && Math.abs(D.ed.takes[1].off - 0.75) < 0.03,
    D.ed.takes[0].name + ' 在前，第二段從 ' + D.ed.takes[1].off.toFixed(2) + ' s');

  // ---- 缺段判斷（哪幾句還沒錄到） ----
  D.ed.cues = D.parseSubtitle('1\n00:00:00,000 --> 00:00:02,000\n第一句話\n\n2\n00:00:02,000 --> 00:00:04,000\n第二句話\n\n3\n00:00:04,000 --> 00:00:06,000\n第三句話很長一點\n');
  var cov1 = D.edCoverage([
    { time: 0.1, end: 1.9, text: '第一句話' },
    { time: 2.1, end: 3.9, text: '第二句話' }
  ]);
  check('缺段：只錄了前兩句 → 缺第 3 句', cov1.missing.length === 1 && cov1.missing[0] === 2,
    '缺 ' + JSON.stringify(cov1.missing) + '、不像 ' + JSON.stringify(cov1.weak.map(function (w) { return w.i; })));
  var cov2 = D.edCoverage([
    { time: 0.1, end: 1.9, text: '第一句話' },
    { time: 2.1, end: 3.9, text: '第二句話' },
    { time: 4.1, end: 5.9, text: '第三句話很長一點' }
  ]);
  check('缺段：三句都有 → 不缺', cov2.missing.length === 0, JSON.stringify(cov2.missing));
  var cov3 = D.edCoverage([
    { time: 0.1, end: 1.9, text: '完全不相干的一段話' }
  ]);
  check('缺段：聽到的字不一樣 → 標成「不像」而不是消失',
    cov3.missing.length + cov3.weak.length === 3, '缺 ' + cov3.missing.length + '、不像 ' + cov3.weak.length);

  // ---- 效果圖跟著主題換色 ----
  var htmlEl = frame.contentDocument.documentElement;
  htmlEl.setAttribute('data-theme', 'dark');
  var pDark = D.fxPalette();
  D.drawEffects();
  htmlEl.setAttribute('data-theme', 'light');
  var pLight = D.fxPalette();
  D.drawEffects();
  check('主題：深色／淺色判斷正確', pDark.dark === true && pLight.dark === false);
  check('主題：圖表底色跟著換', pDark.bg0 !== pLight.bg0, pDark.bg0 + ' vs ' + pLight.bg0);
  check('主題：文字色跟著換', pDark.dim !== pLight.dim);
  var cv = frame.contentDocument.getElementById('eqCv');
  htmlEl.setAttribute('data-theme', 'dark');
  D.drawEffects();
  var pxDark = cv.getContext('2d').getImageData(2, cv.height - 3, 1, 1).data;
  htmlEl.setAttribute('data-theme', 'light');
  D.drawEffects();
  var pxLight = cv.getContext('2d').getImageData(2, cv.height - 3, 1, 1).data;
  check('主題：畫布真的重畫成不同顏色',
    (pxDark[0] + pxDark[1] + pxDark[2]) < (pxLight[0] + pxLight[1] + pxLight[2]),
    '深 ' + [pxDark[0], pxDark[1], pxDark[2]].join(',') + ' / 淺 ' + [pxLight[0], pxLight[1], pxLight[2]].join(','));

  // ---- 瀏覽器錄音（無頭 Chrome 用假麥克風） ----
  var recBtn = frame.contentDocument.getElementById('recBtn');
  var W2 = frame.contentWindow;
  if (!W2.navigator.mediaDevices || !W2.navigator.mediaDevices.getUserMedia || !W2.MediaRecorder) {
    check('錄音：這個瀏覽器不支援（略過）', true, 'skip');
  } else {
    var before = D.ed.takes.length;
    recBtn.click();
    await new Promise(function (r) { setTimeout(r, 1400); });
    recBtn.click();
    for (var tries = 0; tries < 40 && D.ed.takes.length === before; tries++) {
      await new Promise(function (r) { setTimeout(r, 150); });
    }
    var recSt = frame.contentDocument.getElementById('recStatus').textContent;
    check('錄音：按下錄音→停止後多出一段', D.ed.takes.length === before + 1,
      D.ed.takes.length + ' 段' + (recSt ? '（' + recSt + '）' : ''));
    if (D.ed.takes.length > before) {
      var last = D.ed.takes[D.ed.takes.length - 1];
      check('錄音：這一段有聲音（假麥克風是 440 Hz 音）', last.buffer.duration > 0.5,
        fmtSecs(last.buffer.duration));
    }
  }
  function fmtSecs(s) { return s.toFixed(2) + ' s'; }

  // ---- WAV ----
  var b = D.wav(new Float32Array(100), 48000);
  check('WAV：檔頭與長度正確', b.byteLength === 44 + 200, b.byteLength + ' bytes');

  log('info', fails ? '\n共 ' + fails + ' 項失敗' : '\n全部通過');
  document.title = fails ? 'FAIL' : 'PASS';
  fetch('/__READY__').catch(function () {});
})();
</script>
</body>
</html>
