{% load static %}
<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}世界樂器百科{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'css/site.css' %}">
  <script>!function(){try{var t=localStorage.getItem("theme");document.documentElement.setAttribute("data-theme",t||"nextdoor")}catch(e){}}()</script>
  {% block extra_head %}{% endblock %}
</head>
<body>
  <header class="site-header">
    <a class="brand" href="{% url 'home' %}">世界樂器百科</a>
    <nav class="site-nav">
      <div class="nav-dropdown">
        <a href="{% url 'instrument_list' %}" class="dropdown-trigger">全部樂器</a>
        <div class="dropdown-menu">
          <a href="{% url 'instrument_list' %}">分類</a>
          <a href="{% url 'random_instrument' %}">隨選</a>
          <a href="{% url 'popular_instruments' %}">熱門</a>
          <a href="{% url 'uncommon_instruments' %}">冷門</a>
          <a href="{% url 'about' %}">關於本站</a>
        </div>
      </div>
      <div class="nav-dropdown">
        <a href="{% url 'fretboard_tool' %}" class="dropdown-trigger">工具</a>
        <div class="dropdown-menu">
          <a href="{% url 'fretboard_tool' %}">世界樂器指版和弦圖</a>
          <a href="{% url 'experience_page' %}">體驗</a>
        </div>
      </div>
      <a href="{% url 'theory' %}">樂理</a>
      <a href="{% url 'about' %}">關於</a>
      <a href="/admin/">管理後台</a>
    </nav>
    <button id="theme-toggle" class="theme-toggle" aria-label="切換色調">🎋</button>
  </header>

  {% block content %}{% endblock %}

  <footer class="site-footer">
    <p>
      作者：<a href="https://www.youtube.com/@NextDoorSoundWeavers/" target="_blank" rel="noopener">隔壁織音人</a>
      ｜<a href="{% url 'about' %}">關於本站</a>
      ｜<a href="{% url 'theory' %}">樂理基礎</a>
      ｜資料來源：<a href="https://www.wikipedia.org/" target="_blank" rel="noopener">Wikipedia</a>
      ｜<a href="https://www.youtube.com/@NextDoorSoundWeavers/" target="_blank" rel="noopener">訂閱 YouTube 頻道</a>
    </p>
  </footer>

  {% block extra_js %}{% endblock %}

  <script>
  (function(){var t=document.getElementById("theme-toggle"),d=document.documentElement;var I={nextdoor:"🎋",light:"🌤",dark:"🌙"};function s(m){d.setAttribute("data-theme",m);if(t)t.textContent=I[m]||"🎋";try{localStorage.setItem("theme",m)}catch(e){}}var v=localStorage.getItem("theme")||"nextdoor";s(v);if(t)t.addEventListener("click",function(){var c=d.getAttribute("data-theme");s(c==="nextdoor"?"light":c==="light"?"dark":"nextdoor")});})();
  </script>
</body>
</html>
